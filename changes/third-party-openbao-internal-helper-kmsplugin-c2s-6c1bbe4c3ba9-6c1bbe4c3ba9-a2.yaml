  agentLog: This context is the OpenBao KMS plugin catalog package at third_party/openbao/internal/helper/kmsplugin.
    It owns the Catalog type, which resolves server plugin configuration into pluginized
    KMS, Key and wrapper objects, dispenses them over go-plugin gRPC processes, and
    layers reload, finalization and retry behavior on top so a live server survives
    plugin process restarts. The catalog distinguishes builtin implementations (transit
    KMS, kmip/static/transit wrappers, transit metadata) from external plugins addressed
    by name, reference counts each cached client, and evicts clients whose declared
    configuration disappeared when the server config is reloaded. Test files cover
    client lookup and reuse, reload eviction and bad config, the KMS open/key/cipher
    surface, metadata lookup, and wrapper configuration, reload and builtin dispatch
    paths.
