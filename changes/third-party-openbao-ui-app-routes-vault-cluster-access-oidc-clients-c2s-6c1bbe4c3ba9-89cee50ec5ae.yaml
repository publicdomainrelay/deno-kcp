  agentLog: 'This context holds the three Ember.js route classes that back the OpenBao
    UI''s OIDC client pages under the vault cluster access area. OidcClientsRoute
    (index.js) lists OIDC clients: its model hook queries the ''oidc/client'' record
    type with an empty query object, swallows an httpStatus 404 into an empty array
    and rethrows every other error, and its afterModel hook redirects to ''vault.cluster.access.oidc''
    when the resulting list is empty so a user never lands on a blank clients page.
    OidcClientsCreateRoute (create.js) builds an unsaved ''oidc/client'' record through
    store.createRecord so the create form has a fresh model. OidcClientRoute (client.js)
    loads one client by the dynamic :name segment of the URL through store.findRecord(''oidc/client'',
    name). Each route injects the Ember store service; the index route additionally
    injects the router service for its redirect.'
