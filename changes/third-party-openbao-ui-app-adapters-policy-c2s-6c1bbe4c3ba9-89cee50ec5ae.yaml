  agentLog: 'This context covers the three Ember Data policy adapters that the OpenBao
    web UI registers for ACL, EGP, and RGP policies: third_party/openbao/ui/app/adapters/policy/acl.js,
    egp.js, and rgp.js. Each file is a three-line module that imports the shared policy
    adapter from ../policy and re-exports it via `PolicyAdapter.extend()` with no
    properties, no methods, and no overrides. The three files are byte-for-byte equivalent
    apart from their names, so the concrete request behavior for all three policy
    types is inherited entirely from the base policy adapter, and each subclass exists
    only to give Ember Data a distinct adapter key per policy model.'
