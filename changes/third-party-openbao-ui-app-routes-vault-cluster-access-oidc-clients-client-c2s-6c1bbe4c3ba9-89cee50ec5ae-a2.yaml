  phase: Succeeded
  agentLog: 'Three Ember route classes under third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client
    give each OIDC client detail screen its own routable sub-state. details.js exports
    OidcClientDetailsRoute and edit.js exports OidcClientEditRoute, both bare subclasses
    of Ember''s Route with no hooks and no injected services, so they inherit the
    client model already loaded by the parent vault.cluster.access.oidc.clients.client
    route. providers.js exports OidcClientProvidersRoute, which injects the Ember
    Data store, overrides model() to read that same parent model and call this.store.query(''oidc/provider'',
    { allowed_client_id: model.clientId }), and catches the failure so an error with
    httpStatus 404 yields an empty array while every other error is rethrown. All
    three are default-exported so Ember''s route resolver maps .../clients/client/<name>
    onto the matching route, and each file keeps the HashiCorp MPL-2.0 header.'
