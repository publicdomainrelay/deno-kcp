  agentLog: 'This context covers three Ember route modules in the vendored OpenBao
    UI that implement the Vault cluster policy screens: the policy index route, the
    policy show route, and the policy edit route. The index route is a redirect shim
    that immediately forwards the bare policy path to the ACL policy list. The show
    route derives the active policy type from the parent vault.cluster.policy route''s
    type param, loads the policy record and its capabilities record together in one
    hash, redirects the special root ACL policy away from the detail view before rendering,
    pushes the resolved records and the derived type onto the controller, and calls
    the controller''s cleanupModel when the route is exited. The edit route subclasses
    the show route and adds a single willTransition guard that confirms with the user
    before discarding unsaved changes.'
