  agentLog: internal/trigger holds the decision logic for the RunTrigger custom resource.
    Reconcile takes an Observed snapshot — the RunTrigger object, an optional RunObservation
    of the referenced policy workflow's latest run, an AnyRun flag that says whether
    any run exists at all, and a Now clock time — and returns a Result. The Result
    carries the desired RunTriggerPhase, whether the run matched the spec's match
    map, the derived job name, the last consumed run, the status conditions, the Ops
    the caller must execute, and a RemoveFinalizer flag. Result starts from the object's
    existing status, so fields the decider leaves alone survive. Conditions are written
    through meta.SetStatusCondition with the trigger's generation as ObservedGeneration.
    The package makes no client calls and asks for no requeue; the provider layer
    executes the returned Ops. New builds a Reconciler from Options and defaults its
    Now function to time.Now.
