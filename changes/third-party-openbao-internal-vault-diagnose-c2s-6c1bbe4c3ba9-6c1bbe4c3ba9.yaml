  agentLog: 'Package `diagnose` under `third_party/openbao/internal/vault/diagnose`
    implements a diagnostic harness for an OpenBao/Vault server. It centres on a `Session`
    carried in the context: `New` builds one over an `io.Writer`, `Context`/`CurrentSession`
    attach and retrieve it, and `StartSpan`, `Test`, `SpotCheck`, `Success`, `Fail`,
    `Error`, `Skipped`, `Warn`, `SpotOk`, `SpotWarn`, `SpotError`, `SpotSkipped`,
    `Advice`, `Advise`, `WithTimeout` and `CapitalizeFirstLetter` emit OpenTelemetry
    span events and status for each check. Skip filters held on the session short-circuit
    both `Test` and `SpotCheck`. A `TelemetryCollector` (built by `NewTelemetryCollector`)
    turns finished spans into a `Result`, which renders through `Write`, `String`
    and `StringWrapped`, with a `status` enum for its JSON and text forms. Around
    that harness sit the actual checks: file permission checks (`IsDir`, `HasDB`,
    `CheckFilePerms`, `IsOwnedByRoot`), raft checks (`RaftFileChecks`, `RaftStorageQuorum`),
    storage latency and topology checks (`EndToEndLatencyCheckWrite/Read/Delete`,
    `ConsulDirectAccess`), OS checks (`OSChecks`), and TLS verification (`ListenerChecks`,
    `TLSFileChecks`, `TLSCertCheck`, `ParseTLSInformation`, `TLSErrorChecks`, `TLSFileWarningChecks`,
    `NearExpiration`, `TLSMutualExclusionCertCheck`, `TLSClientCAFileCheck`, `TLSCAFileCheck`).
    A `mockStorageBackend` supplies an in-memory `physical.Backend` plus the `RaftConfigurableStorageBackend`
    interface for tests.'
