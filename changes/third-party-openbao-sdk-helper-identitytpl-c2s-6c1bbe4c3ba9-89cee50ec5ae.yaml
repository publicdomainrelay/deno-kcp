  agentLog: This context is the OpenBao SDK identity templating helper at third_party/openbao/sdk/helper/identitytpl.
    It exposes one struct, PopulateStringInput, which carries the template string
    to expand, an entity and its groups, a namespace ID, a processing Mode (ACL templating
    or JSON templating), an optional Now time, and an optional list of blocked substitutions,
    plus unexported fields for the selected template handler and the flattened group
    names and IDs. It exposes one entry point, PopulateString, which takes that input
    by value and returns whether any substitution happened, the populated string,
    and an error. The function refuses an unknown mode, splits the input on "{{",
    rejects unbalanced templating characters, runs each trimmed template fragment
    through the mode-specific handler via performTemplating, and rejects any fragment
    whose expanded value contains one of the blocked substitution strings. A test
    file, templating_test.go, drives the package through TestPopulate_Basic, TestPopulate_CurrentTime
    and TestPopulate_FullObject, covering time expressions, metadata lookups and validity-only
    checks.
