status:
  agentLog: 'This context covers the Ember application initializers that ship in the
    vendored OpenBao web UI, under third_party/openbao/ui/app/initializers. Four files
    are in scope: deprecation-filter.js, disable-ember-inspector.js, ember-data-identifiers.js,
    and enable-engines.js. Each file exports an Ember initializer function named initialize,
    which the Ember runtime invokes during application boot. The initializers cover
    unrelated boot-time concerns: deprecation message filtering, turning off the Ember
    Inspector, replacing Ember Data''s record identifier generation so it works in
    non-secure browser contexts, and attaching a no-op addRootMounts hook to the environment
    config so the router DSL can mount engines at the root. The only initializer whose
    exported function is recorded in the observed facts is initialize in deprecation-filter.js;
    the others are known only by file presence and by the surrounding code graph entries.'
