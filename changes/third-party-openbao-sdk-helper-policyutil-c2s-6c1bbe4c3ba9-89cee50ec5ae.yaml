status:
  agentLog: 'third_party/openbao/sdk/helper/policyutil is a vendored OpenBao SDK helper
    package that normalizes Vault-style policy name lists before they are stored or
    compared. policyutil.go defines three exported functions: ParsePolicies accepts
    an untyped value that may be nil, a comma-separated string, or a []string and
    returns a sanitized policy list; SanitizePolicies lowercases and trims each entry,
    drops empties, collapses the list to just ["root"] when root is present, optionally
    appends "default", and removes duplicates; EquivalentPolicies compares two policy
    lists as sets after filtering the "default" entry, tolerating nil versus a single
    "default" as equal. policyutil_test.go exercises ParsePolicies and SanitizePolicies
    and uses EquivalentPolicies as its comparison oracle.'
