status:
  agentLog: 'This context covers the Ember Data adapters under third_party/openbao/ui/app/adapters/keymgmt/,
    which connect the OpenBao web UI to the key-management secrets engine. key.js
    exports KeymgmtKeyAdapter, which extends ApplicationAdapter, sets namespace ''v1'',
    and maps the literal path segment ''key'' to URLs of the form <namespace>/<backend>/key.
    buildURL rewrites that segment using snapshot.attr(''backend'') or query.backend;
    the url() helper appends an encoded key id plus optional ''/rotate'' or ''/kms''
    suffixes. createRecord issues a POST carrying only the type attribute and then,
    when deletionAllowed is set, a follow-up PUT restricted to deletion_allowed and
    min_enabled_version, throwing ''Key <name> was created, not all settings were
    saved'' style error text if the second call fails. updateRecord PUTs the same
    restricted attribute set. distribute PUTs to <backend>/kms/<kms>/key/<key>; getProvider
    GETs the key''s kms list and returns the first entry, null on HTTP 404, or { permissionsError:
    true } on HTTP 403; getDistribution GETs one distribution and splits its purpose
    string into purposeArray. queryRecord fetches one key and, unless recordOnly is
    true, attaches provider and distribution data. query builds either a provider-scoped
    URL through the keymgmt/provider adapter or the backend-level list URL and tags
    the response with backend. rotateKey PUTs the rotate URL then reloads the store
    record, and removeFromProvider DELETEs the distribution and nulls model.provider.
    provider.js exports a second KeymgmtKeyAdapter for the ''kms'' path, which replaces
    ''kms'' with the backend segment, builds a keys URL from a query, creates providers
    with PUT instead of POST, decorates findRecord responses with the name, and expands
    list queries by fetching each listed key through a mocked snapshot that only answers
    the ''backend'' attribute.'
