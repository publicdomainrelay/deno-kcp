    with the pki and kv logical backends registered, starts it, waits for one active
    node plus standbys, mounts kv-v2 on the primary, mints a token on the primary
    and copies it to the standby client, then for each core writes a distinct value
    through that core's KVv2 client and asserts, with require.EventuallyWithT at a
    10s timeout and 100ms tick, that the value is readable both through the primary
    client and through the standby client. It then revokes the token tree on the primary
    and asserts that reads through the standby client eventually fail with "permission
    denied". TestReadOnlyStandbysForwardingWrapping builds a cluster with a passthrough
    kv-v2 backend, mounts wraptest on the active node, performs a CreateOperation
    through the leader's HandleRequest, then issues a ReadOperation with WrapInfo
    (15s TTL) against every core and asserts that the active core returns a response
    whose WrapInfo.TTL is 15s while non-active cores return an error for which logical.ShouldForward
    is true.
