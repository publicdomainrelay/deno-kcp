  agentLog: 'This context covers the vendored third_party/openbao/internal/physical/raft/snapshot
    package in deno-kcp, a copy of OpenBao''s raft snapshot helper. Two source files
    carry it: archive.go defines the unexported hashList type that tracks a per-file
    SHA-256 sum, encodes those sums as a SHA256SUMS-style text file, and re-reads
    such a file to verify it against the tracked sums; snapshot.go defines the Snapshot
    struct (an open temp file plus index and checksum), the Sealer interface with
    Seal and Open for wrapping and unwrapping snapshot bytes, and the package-level
    operations New/NewWithSealer, Write, Verify, Parse, Restore/RestoreWithSealer,
    and WriteToTempFile/WriteToTempFileWithSealer. Paired _test.go files exercise
    the archive hash list and the snapshot read/write path. The package is the boundary
    between a raft node and an archive file on disk: Write seals and writes a snapshot
    with a trailing metadata and checksum trailer, Verify and Parse validate that
    trailer on the way back in, and Restore hands the recovered bytes to the raft
    library.'
