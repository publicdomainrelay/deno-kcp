status:
  agentLog: 'Package auth implements the auto-auth core shared by the OpenBao agent
    and proxy. It defines the AuthMethod interface that every credential source (approle,
    cert, jwt, kubernetes, token-file) must satisfy, an extended AuthMethodWithClient
    interface for methods that need their own API client, and the value types AuthConfig,
    AuthHandlerConfig and AuthHandler that carry configuration into the handler. NewAuthHandler
    builds a handler from an AuthHandlerConfig, and AuthHandler.Run drives the whole
    lifecycle: it obtains credentials, authenticates against the server or validates
    a preloaded token with lookup-self, pushes the resulting token to the sink channels,
    starts an API lifetime watcher that renews the token, and retries on failure with
    an exponential backoff that doubles up to a cap and resets on success. A small
    autoAuthBackoff type holds that backoff state and prints the current delay truncated
    to ten milliseconds.'
