  agentLog: This context covers `third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods/create.js`,
    an Ember controller that backs the OpenBao UI screen for creating a new MFA method.
    `MfaMethodCreateController` extends Ember's `Controller`, injects the `store`,
    `flashMessages` and `router` services, declares `type` as a query parameter, and
    holds tracked state for the selected method type, the `mfa-method` and `mfa-login-enforcement`
    model records under construction, the enforcement preference (default `'new'`),
    and separate validation error maps for each model. Derived getters produce the
    type-specific description copy, the display-cased type label, an `isTotp` flag
    and a `showForms` flag. Actions reset form state on type selection, create or
    unload the model records, cancel back to the methods list, and a `ember-concurrency`
    save task validates both models, saves the method first, attaches it to the enforcement's
    `mfa_methods` relation, then saves the enforcement with its own error capture
    and transitions to the newly created method's route.
