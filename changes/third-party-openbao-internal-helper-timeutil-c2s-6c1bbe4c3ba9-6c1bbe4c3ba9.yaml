  agentLog: 'This context is the vendored OpenBao time utility package at third_party/openbao/internal/helper/timeutil.
    It holds a small set of pure calendar helpers that operate on time.Time: StartOfMonth,
    StartOfPreviousMonth, StartOfNextMonth and EndOfMonth snap a time to a month boundary,
    while IsMonthStart, IsPreviousMonth, IsCurrentMonth and InRange answer membership
    questions, and MonthsPreviousTo and GetMostRecentContiguousMonths walk backwards
    over a series of month start times to find contiguous stretches of data. ParseTimeFromPath
    turns a path into a timestamp. The package also defines a Clock interface (Now,
    NewTicker, NewTimer) plus a DefaultClock struct whose methods delegate to the
    standard library, so callers can inject a fake clock in tests. SkipAtEndOfMonth
    is a test helper living in the same non-test file and takes a *testing.T.'
