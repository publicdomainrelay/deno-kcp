  agentLog: This context is the seal package of the vendored OpenBao tree at third_party/openbao/internal/vault/seal.
    It holds five files. seal.go defines the Access interface, which embeds wrapping.Wrapper
    and wrapping.InitFinalizer and adds GetWrapper, plus the unexported access type
    whose methods KeyId, SetConfig, GetWrapper, Init, Type, Encrypt, Decrypt and Finalize
    all forward to the wrapped wrapping.Wrapper, and NewAccess, which turns any wrapping.Wrapper
    into that Access. envelope.go defines Envelope with a sync.Once-guarded init,
    an Encrypt that times itself under seal/envelope/encrypt and calls wrapping.EnvelopeEncrypt
    with wrapping.WithAad, and a Decrypt that calls wrapping.EnvelopeDecrypt with
    the same AAD, plus NewEnvelope. shamirwrapper.go defines ShamirWrapper, whose
    Type reports the Shamir wrapper type, and NewShamirWrapper. The two testing files
    are seal_testing.go, which provides TestSealOpts, NewTestSeal, NewToggleableTestSeal
    and ToggleableWrapper with SetError and an overridable Type, Encrypt and Decrypt,
    and envelope_test.go, which round-trips Envelope through NewEnvelope. The package
    is the indirection layer the barrier uses to reach a configured seal wrapper,
    so one interface covers production seals and the toggleable test seal.
