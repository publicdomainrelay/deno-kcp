status:
  agentLog: Package listenerutil holds the listener-side helpers OpenBao uses to build
    its network and TLS listeners. bufconn.go wraps a bufconn.Listener in a BufConnWrapper
    whose Dial and DialContext satisfy consul-template's TransportDialer interface
    by dialing the in-memory listener and ignoring the address arguments. listener.go
    defines the Listener and UnixSocketsConfig structs, the rmListener wrapper whose
    Close removes the socket file, UnixSocketListener, which removes any stale socket
    file, listens on the unix path, applies user/group/mode permissions and returns
    the file-removing wrapper, and TLSConfig, which turns a configutil.Listener plus
    properties map, a cli.Ui and an hclog.Logger into a *tls.Config and a ReloadableCertGetter.
    tls_acme.go declares the ReloadableCertGetter interface (Reload and GetCertificate)
    and the ACMECertGetter that implements it together with ALPNProtos, HandleHTTPChallenge,
    Close and NewCertificateGetter, plus the zapHclCore adapter that renders an hclog
    logger through a zapcore.Core. tls_autoreload.go adds NewTLSReloadListener, which
    decorates any net.Listener so that changes to the watched file paths trigger the
    supplied reload function on a timer, and tlsReloadListener.Close, which stops
    that watcher. Tests in listener_test.go, tls_acme_test.go and tls_autoreload_test.go
    cover the unix socket permission modes, certificate-getter behaviour and reload
    loop.
