        level: MUST
        text: 'deploy/examples/atproto/market/accept.sh is the live acceptance of
          this example: it brings the whole market up in a throwaway state directory
          and exits non-zero unless every workload is up and reachable. It is bash
          with set -euo pipefail; ACCEPT_ROOT (default a fresh mktemp -d) is the one
          directory it owns, and an EXIT trap stops everything it started and removes
          that directory. It never stops or touches a kcp, kine or OpenBao it did
          not start. It asks the kernel for three free 127.0.0.1 ports, for kcp, kine
          and OpenBao, instead of pinning any, so it cannot collide with another instance
          on the machine. It starts kcp with ROOT=$ACCEPT_ROOT/kcp and KCP_SECURE_PORT
          and KINE_ENDPOINT set to two of those ports through deploy/start-kcp.sh;
          installs the provider with KUBECONFIG_PATH=$ACCEPT_ROOT/kcp/admin.kubeconfig
          through deploy/install-provider.sh; builds ./cmd/deno-kcp-provider into
          $ACCEPT_ROOT; starts OpenBao with OPENBAO_DIR=$ACCEPT_ROOT/openbao and OPENBAO_LISTEN
          on the third port through deploy/start-openbao.sh; and runs the provider
          with --kubeconfig, --openbao-addr http://<openbao port>, --openbao-token
          root and RUNS_DIR=$ACCEPT_ROOT/runs. It then runs deploy/examples/atproto/market/apply.sh
          with ORG_ROOT the repository parent, KUBECONFIG the kcp admin kubeconfig,
          OPENBAO_LISTEN the same address, START_OPENBAO=0, a bounded WAIT_SECONDS,
          and KEY_FILE, BOB_KEY_FILE and BIDDER_KEY_FILE under $ACCEPT_ROOT. When
          apply.sh returns, whether it succeeded or not, accept.sh reads every DenoPod
          from kcp with kubectl and prints one line per check, each with its result
          and the decisive evidence: apply.sh exited 0; DenoPod plc in root:global,
          relay in root:relay, pds in root:alice, pds in root:bob and bidder in root:bob
          each reached phase Running and report ready true; DenoPod verifier in root:alice
          reached the terminal phase Succeeded; bob pds answers on its own name, which
          the provider proves with its readiness probe through the shim (kcpdns pds.default.bob.svc.kcp.local
          /xrpc/_health) and the host proves by fetching the same path from outside
          with curl https://127.0.0.1:2585/xrpc/_health; the bidder answers on bidder.default.bob.svc.kcp.local
          /oauth-client-metadata.json and on http://127.0.0.1:2586/oauth-client-metadata.json.
          The host check names the scheme the listener actually speaks, and the two
          are not the same. The PDS in root:bob serves TLS -- its supervisor script
          writes the injected leaf and appends --tls-cert-file and --tls-key-file
          -- so its host check is https, because an http:// fetch of a TLS listener
          is not a check of anything and must not be written. The bidder serves plain
          HTTP on its port: SERVICE_TLS is true for it too, but its supervisor script
          must not append the TLS flags, because hono-bidder declares no such options
          and its parser rejects unknown ones, so the bidder consumes only the trust
          bundle and its listener is not the TLS one; its host check is therefore
          http://, and an https:// fetch of a plain listener fails the same way round.
          The readiness probe of the provider is the one that does not care, because
          it tries https and then http. http_code reports the status curl printed,
          and prints 000 exactly once when the fetch failed rather than appending
          a second fallback. And the five long-running pods are still Running with
          ready true when they are read a second time at least ten seconds later,
          so a pod that dies after startup fails the run. It prints a final table
          naming every check and its result, prints the tail of the provider log and
          the status of the failing pod when a check fails, and exits 0 only when
          every check passed.'
