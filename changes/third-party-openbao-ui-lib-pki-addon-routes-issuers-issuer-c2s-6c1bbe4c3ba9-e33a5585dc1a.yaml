  agentLog: 'This context covers five Ember route classes in the OpenBao PKI UI addon,
    all under third_party/openbao/ui/lib/pki/addon/routes/issuers/issuer/. Each route
    backs one screen of the issuer workflow: details (PkiIssuerDetailsRoute), update
    (PkiIssuerEditRoute), cross-sign (PkiIssuerCrossSignRoute), sign intermediate
    (PkiIssuerSignRoute) and rotate root (PkiIssuerRotateRootRoute). All five inject
    the `store` and `secretMountPath` services, implement a `model()` hook that pulls
    data from the parent `issuers.issuer` route or from `store.queryRecord`/`store.createRecord`,
    and implement `setupController()` to super-call the base then assign a `controller.breadcrumbs`
    array of the form secrets / mount path / issuers / issuer id / current step label.
    Details adds a private `fetchCertByFormat` that hits `/v1/<mount>/issuer/<id>/<format>`
    unauthenticated and a `isRoot` helper that treats an issuer as a root when a certificate
    verifies against itself and a key id is present. Rotate root parses the old root
    certificate, carries settings onto a new `pki/action` record with actionType `rotate-root`,
    reports parsing errors, and is decorated with `@withConfirmLeave(''model.newRootModel'')`.
    Sign is decorated with a bare `@withConfirmLeave()`. The files carry the HashiCorp
    MPL-2.0 header and are vendored third-party OpenBao sources.'
