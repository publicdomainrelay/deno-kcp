  agentLog: 'This context is the vendored OpenBao web UI component layer under third_party/openbao/ui/app/components.
    It holds 66 JavaScript modules, each exporting one default Ember component class
    with a co-located template, that together render the OpenBao console: secret v2
    read, edit, metadata, version and delete flows; auth forms including JWT/OIDC
    and base64 input toggling; secrets engine mount and database engine configuration;
    the crypto tool pages (wrap, unwrap, rewrap, lookup, hash, random) with TTL and
    PGP file helpers; policy editing and OIDC consent; and shared presentation pieces
    such as calendar and date dropdowns, pagination controls, flash messages, token
    expiry warning, section tabs, selectable cards, hover copy button, secret links
    and splash page. The classes talk to the Ember data store (for example DiffVersionSelector
    uses the secret-v2-version adapter) and receive state through args, tracked properties
    and service injection. The code is an unmodified third_party copy of upstream
    OpenBao UI.'
