  phase: Succeeded
  agentLog: 'Five Ember Data adapter modules under third_party/openbao/ui/app/adapters/pki/config
    implement the PKI configuration read/write HTTP surface for the OpenBao web UI.
    base.js defines PkiConfigBaseAdapter, which extends the UI ApplicationAdapter,
    sets namespace ''v1'', and implements both request paths: findRecord(store, type,
    backend) issues an HTTP GET to this._url(backend) and unwraps the response body''s
    data property, while updateRecord(store, type, snapshot) serializes the snapshot
    and issues an HTTP POST of that payload as data to this._url(snapshot.record.id),
    so the record id supplies the backend mount path. acme.js, cluster.js, crl.js
    and urls.js each declare a subclass that re-declares namespace ''v1'' and overrides
    only _url(backend), returning this.buildURL() joined with the encodePath-encoded
    backend mount and one fixed segment: /config/acme, /config/cluster, /config/crl
    and /config/urls respectively. Path encoding comes from vault/utils/path-encoding-helpers
    rather than hand-rolled escaping.'
