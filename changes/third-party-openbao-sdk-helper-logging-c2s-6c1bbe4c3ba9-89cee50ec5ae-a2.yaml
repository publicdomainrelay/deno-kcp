status:
  agentLog: 'This context is the OpenBao SDK logging helper package at third_party/openbao/sdk/helper/logging,
    which gives SDK consumers a small, self-contained way to interpret log-format
    settings and to build loggers. It defines the integer LogFormat enum with the
    values UnspecifiedFormat, StandardFormat and JSONFormat plus a String method that
    renders them as "unspecified", "standard" and "json" (and "unknown" otherwise),
    two constructors — NewVaultLogger, which writes to log.DefaultOutput, and NewVaultLoggerWithWriter,
    which takes any io.Writer and sets IndependentLevels to true with JSONFormat decided
    by ParseEnvLogFormat — and two parsers: ParseLogFormat, which lower-cases and
    trims a caller-supplied string and returns an error for anything unrecognised,
    and ParseEnvLogFormat, which reads the BAO_LOG_FORMAT variable (through api.ReadBaoVariable)
    and maps it without error. The test file logging_test.go covers ParseLogFormat''s
    case-insensitive, whitespace-trimmed matching and its error string through Test_ParseLogFormat.'
