status:
  agentLog: Three Ember.js route modules under third_party/openbao/ui/app/routes/vault/cluster/access/oidc/scopes/
    implement the routing surface for OIDC scope management in the OpenBao web UI.
    create.js default-exports OidcScopesCreateRoute, index.js default-exports OidcScopesRoute,
    and scope.js default-exports OidcScopeRoute; all three extend the Ember Route
    base class, declare an injected `store` service property, and override the `model`
    hook. The create route's hook body is observed in full and returns `this.store.createRecord('oidc/scope')`,
    an unsaved client-side record, so the create screen never fetches a server record.
    The index route's hook takes no parameters and serves the scope list screen. The
    scope route's hook takes a destructured `{ name }` parameter, keyed on the scope
    name from the route's dynamic segment, and serves a single scope's detail screen.
    The modules export nothing besides their default class.
