status:
  agentLog: 'This context covers the in-memory physical storage backend shipped with
    the OpenBao SDK under third_party/openbao/sdk/physical/inmem. inmem.go defines
    InmemBackend, a map-backed physical.Backend that supports Put, Get, Delete, List
    and paginated ListPage, each paired with an Internal variant (PutInternal, GetInternal
    via getInternal, DeleteInternal, ListInternal, listPaginatedInternal) plus FailPut/FailGet/FailDelete/FailList
    switches that force errors for tests. It also defines TransactionalInmemBackend
    with BeginTx and BeginReadOnlyTx and the staged InmemBackendTransaction, whose
    Put/Delete/Get/List/ListPage read through a dirty overlay and whose Commit applies
    staged writes under the parent lock while Rollback discards them. OpName maps
    the InmemOp op constants to their string names, and InmemOp itself is the recorded
    operation struct used by tests. inmem_ha.go adds InmemHABackend, an InmemBackend
    embedder that implements LockWith, HookInvalidate, LockMapSize and HAEnabled,
    plus InmemLock with Lock, Unlock and Value, using the lock map so a single process
    can simulate HA locking. The remaining files are the package''s tests: inmem_test.go,
    inmem_ha_test.go, cache_test.go and physical_view_test.go.'
