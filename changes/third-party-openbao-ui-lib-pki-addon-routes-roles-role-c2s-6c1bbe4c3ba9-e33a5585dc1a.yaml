  agentLog: 'This context holds the four Ember route classes that serve a single PKI
    role under a secrets mount in the OpenBao web UI: the role details route, the
    role edit route, the certificate generate route, and the certificate sign route.
    Each route injects the `store` and `secretMountPath` services, reads the `role`
    param from its parent `roles/role` route, loads or creates a `pki/*` model against
    the current mount path, and then in `setupController` assigns a breadcrumb trail
    to the controller. The details and edit routes read existing server state (`pki/role`,
    `pki/issuer`); the generate and sign routes build unsaved `pki/certificate/*`
    records and seed `hasSubmitted` on the controller. The edit route guards against
    losing unsaved changes through the `withConfirmLeave` decorator keyed on the role
    and issuers models, while the generate and sign routes call `withConfirmLeave()`
    at module scope.'
