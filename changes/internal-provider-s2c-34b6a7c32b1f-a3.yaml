  requirementCoverage:
  - id: r.provider-initial-list-is-bounded-and-retried
    implemented: true
    evidence: 'watch.go adds `const defaultCacheSyncTimeout = 30 * time.Second`, `cacheSyncRetryPace
      = time.Second`, and `awaitCacheRound` which wraps the wait in `bounded, cancel
      := context.WithTimeout(ctx, deadline)` and returns false when any factory reports
      `!synced`. `waitForCaches` runs `for { round, err := build(); if awaitCacheRound(ctx,
      round.factories, deadline) { log.Info("watch: informer caches have synced",
      "kinds", len(round.factories)); return round, nil }; round.Close(); if ctx.Err()
      != nil { return nil, nil }; log.Info("watch: informer caches did not sync within
      the deadline, retrying", "timeout", deadline, "kinds", len(round.factories));
      select { case <-ctx.Done(): return nil, nil; case <-time.After(pace): } }` —
      abandoned attempt closed via `round.Close()`, next attempt re-runs `build()`
      which is `func() (*informerRound, error) { return p.startInformers(ctx, endpoints,
      reader, queue) }`, and `startInformers` calls `factory.Start(round.stop)` on
      each factory, so informers restart; the loop repeats while ctx lives; both the
      sync and the retry are logged with `log.Info` at info level.'
  - id: r.provider-initial-list-is-bounded-and-retried-test
    implemented: true
    evidence: 'watch_test.go adds `type neverSyncingFactory struct{}` whose `WaitForCacheSync`
      blocks on `<-stopCh` then returns `map[schema.GroupVersionResource]bool{gvrDenoPods:
      false}` (never synced), and `TestTheInitialCacheSyncIsBoundedAndRetried` drives
      `waitForCaches(ctx, build, 20*time.Millisecond, time.Millisecond, log)` with
      a `build` that counts and publishes attempts on a channel; it asserts the next
      attempt starts (`for attempt < 3 { select { case attempt = <-built: case <-guard:
      t.Fatalf("the bounded wait started %d attempts in %s; it did not abandon the
      first one within its deadline", ...) } }`), that attempts return within the
      deadline (`if elapsed := time.Since(start); elapsed > time.Second { t.Fatalf("three
      bounded attempts took %s; each deadline is 20ms", elapsed) }`), that it returns
      after cancellation (`case <-time.After(time.Second): t.Fatal("the bounded wait
      did not return after the context was cancelled")`), and that the retry was logged
      (`if !strings.Contains(logs.String(), "retrying") { t.Fatalf(...) }`). A provider
      that waited on its first attempt without a deadline would call `build` once
      and block on `ctx.Done()`, so the `<-guard` arm fires at 2s and fails the test.
      No test-only or comment-only implementation; the asserts run against the real
      `waitForCaches`.'
