status:
  agentLog: 'This context holds six Ember component classes from the OpenBao UI mfa
    module under third_party/openbao/ui/app/components/mfa/. Two of them drive login-time
    MFA: MfaForm resolves the active MFA constraints into a description, validates
    the entered passcode, tracks a countdown and code delay message, and submits the
    chosen constraint, while MfaSetupStepOne and MfaSetupStepTwo carry the two wizard
    steps for enrolling a new method. The other four drive administration: MfaMethodForm
    owns the edit-modal validation state and save/initSave/cancel actions, MfaLoginEnforcementForm
    builds a flattened target list from the model''s auth_method_accessors, auth_method_types,
    identity_groups and identity_entities arrays, eagerly resets search-select state,
    fetches only auth method types that have mounts, and exposes save, add/remove
    target and selection handlers, and MfaLoginEnforcementHeaderComponent fetches
    and caches mfa-login-enforcement records when rendered inline and resolves a selected
    enforcement name back to its model.'
