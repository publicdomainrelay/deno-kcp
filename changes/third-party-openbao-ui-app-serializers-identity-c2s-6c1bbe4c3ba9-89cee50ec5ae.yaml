status:
  agentLog: 'Ember Data serializers for the OpenBao web UI identity models, under
    third_party/openbao/ui/app/serializers/identity/. A shared base serializer (_base.js)
    extends the application serializer and overrides normalizeItems to flatten identity
    list responses: when payload.data.keys is an array of strings it maps each key
    through payload.data.key_info into a model object with id set to the key, when
    keys are already objects it returns them unchanged, and for single-record payloads
    it hoists payload.data onto payload and deletes the data wrapper. entity-alias.js,
    entity.js and group.js each override extractLazyPaginatedData to do the same key_info
    mapping for lazily paginated lists, attaching payload.backend to each model when
    present. entity.js and group.js mix in EmbeddedRecordsMixin to declare their alias
    relationships embedded always; entity.js makes serializeHasMany a no-op because
    entity relationships are not serialized, while group.js strips the alias key on
    serialize and drops member_entity_ids and member_group_ids for groups of type
    external, and deletes an empty alias object from find-record responses before
    delegating to the default normalization. group-alias.js extends the base serializer
    with no overrides.'
