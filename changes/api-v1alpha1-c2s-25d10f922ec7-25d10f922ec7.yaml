  agentLog: 'api/v1alpha1 is the Go API package of the deno-kcp Kubernetes operator.
    It declares the group-version registration plus the typed CustomResource surface
    for eight kinds: DenoPod, DenoRun, DenoJob, RunTrigger, PolicyEngine, PolicyWorkflowPod,
    PolicyWorkflowRun and OpenBao. Each kind ships a root type, a List type, a Spec
    type, a Status type and a phase string alias, alongside shared building blocks
    (ServiceAccountRef, DenoPermission, DenoPermissions, DenoPodTemplate, ExecProbe,
    DenoRestartPolicy, ConcurrencyPolicy). Two conversion helpers in denospec.go adapt
    the API types to the external denospec library structs, and zz_generated.deepcopy.go
    supplies the generated DeepCopy/DeepCopyInto/DeepCopyObject methods that satisfy
    runtime.Object for every root and list type. Tests in deno_types_test.go and types_test.go
    cover deep-copy aliasing and type behaviour.'
