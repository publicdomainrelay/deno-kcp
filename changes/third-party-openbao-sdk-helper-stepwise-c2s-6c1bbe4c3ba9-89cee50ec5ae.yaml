status:
  agentLog: 'This context is the OpenBao SDK `stepwise` helper package, vendored under
    `third_party/openbao/sdk/helper/stepwise`. It provides a black-box acceptance-test
    harness: `Run` takes a `Case` (an `Environment` plus an ordered list of `Step`s)
    and drives each step against a live Vault/OpenBao cluster created by the `Environment`,
    issuing write/update/read/list/delete requests through an API client obtained
    from that environment. The package also ships two support helpers in `helpers.go`:
    `CompilePlugin`, which cross-compiles a plugin binary for linux/amd64 and returns
    its name, path and SHA-256, and `CertificateGetter`, a reloadable TLS certificate
    holder that reads PEM cert/key files, decrypts an encrypted PEM key with a passphrase,
    and serves the certificate to `tls.Config`. The package is guarded by the `BAO_ACC`
    environment variable so that acceptance tests never run by surprise.'
