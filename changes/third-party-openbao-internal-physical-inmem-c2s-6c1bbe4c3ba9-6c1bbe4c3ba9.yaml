  agentLog: 'This context is the internal in-memory physical storage backend of the
    vendored OpenBao copy at third_party/openbao/internal/physical/inmem. It provides
    InmemBackend, a map-backed implementation of physical.Backend guarded by an RWMutex
    with Put, Get, Delete, List and ListPage, plus per-operation failure-injection
    switches (FailPut, FailGet, FailDelete, FailList). NewDirectInmem returns a plain
    InmemBackend, while NewInmem returns a TransactionalInmemBackend that adds BeginTx
    and BeginReadOnlyTx producing InmemBackendTransaction values whose Commit applies
    staged operations and whose Rollback discards them. OpName and the InmemOp struct
    give each operation a symbolic name used for test tracing. The companion file
    inmem_ha.go layers high-availability locking on top: InmemHABackend embeds InmemBackend,
    keeps a map of inmemLockMap shared locks, exposes LockWith, HookInvalidate, LockMapSize
    and HAEnabled, and hands out InmemLock values whose Lock blocks until the lock
    is acquired or stopCh closes and whose Unlock releases it. Tests in inmem_test.go,
    inmem_ha_test.go and physical_view_test.go exercise these paths.'
