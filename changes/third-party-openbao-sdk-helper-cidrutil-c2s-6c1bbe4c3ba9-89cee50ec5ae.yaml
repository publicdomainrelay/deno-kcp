  agentLog: 'This context is the vendored OpenBao SDK package `third_party/openbao/sdk/helper/cidrutil`,
    a small helper library that answers CIDR membership and validation questions for
    the surrounding deno-kcp program. It exposes seven functions in `cidr.go`: `RemoteAddrIsOk`
    decides whether a remote socket address is permitted by a list of bound `*sockaddr.SockAddrMarshaler`
    CIDRs, `IPBelongsToCIDR` and `IPBelongsToCIDRBlocksSlice` test whether a single
    IP falls inside one CIDR or any CIDR of a slice, `ValidateCIDRListString` and
    `ValidateCIDRListSlice` check that CIDR lists parse cleanly, and `Subset` and
    `SubsetBlocks` decide whether one CIDR block (or every block of one slice) is
    contained in another. The package is self-contained apart from the standard library,
    an internal `isIPAddr` helper that unwraps a sockaddr into an IP, a `sockaddr`
    dependency, and `strutil.ParseDedupLowercaseAndSortStrings` for splitting and
    normalizing string lists. `cidr_test.go` supplies table-driven positive and negative
    tests for each exported function.'
