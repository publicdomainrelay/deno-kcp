  agentLog: 'The vendored OpenBao SDK helper package `sdk/helper/cryptoutil` is copied
    into the deno-kcp repository under `third_party/openbao`. It holds one exported
    function, `Blake2b256Hash`, which takes a string key and returns the BLAKE2b-256
