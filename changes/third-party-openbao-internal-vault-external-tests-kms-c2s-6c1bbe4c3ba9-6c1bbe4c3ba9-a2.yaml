status:
  agentLog: 'This context holds the KMS external-test harness for OpenBao, in two
    files under third_party/openbao/internal/vault/external_tests/kms/. testing.go
    exports reusable exercise functions that drive a live OpenBao server through its
    Go API client. ExerciseTransitKMS is the top-level entry: it runs two subtests,
    "transit" and "pki", delegating to ExerciseTransitWithTransitKMS and ExercisePKIWithTransitKMS.
    Those set up their mounts with SetupTransit and SetupPKI, iterate the transit
    key types returned by knownTransitKeyTypes, write a backing key and an external
    key config for each type, and hand off to ExerciseTransitForKey or ExercisePKIForKey.
    ExerciseTransitForKey writes an external-key transit key, asserts the write fails
    while no grant exists, creates the grant at sys/external-keys/configs/kms/keys/<base>/grants/transit,
    retries the write expecting success, then runs ExerciseTransitEncryptDecrypt and
    ExerciseTransitSignVerify in parallel against both the "keys" and "transit" mounts
    when the key type supports them. The PKI side follows the same shape through ExercisePKIRootCA,
    ExercisePKIIntermediateCA and ExercisePKICA. kms_test.go supplies the concrete
    TestKMS_BuiltinTransit and TestKMS_ExternalTransit tests that call ExerciseTransitKMS.'
