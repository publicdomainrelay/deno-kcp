  agentLog: 'The console component directory of the vendored OpenBao web UI, third_party/openbao/ui/app/components/console/,
    holds seven modules: command-input.js, log-json.js, log-list.js, log-object.js,
    log-text.js, output-log.js and ui-panel.js. Each is named for the part it plays
    in rendering the console and its log output. The only symbol the observed facts
    carry is stringifyObjectValues(data) in log-object.js at line 11: it walks the
    own enumerable keys of the data object, JSON.stringify''s every value whose typeof
    is not ''string'', leaves strings as they are, and assigns each result back onto
    the same key, so the caller''s object is mutated in place and nothing is returned.
    log-object.js itself is the only in-tree caller of the helper, with the integration
    test at third_party/openbao/ui/tests/integration/components/console/log-object-test.js
    exercising it alongside.'
