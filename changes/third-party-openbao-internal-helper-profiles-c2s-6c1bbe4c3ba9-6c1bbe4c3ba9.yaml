  agentLog: This context is the OpenBao internal helper package `third_party/openbao/internal/helper/profiles`.
    It builds a small HCL-driven evaluation engine for response/request profile blocks.
    `ProfileEngine` is constructed by `NewEngine` from a list of option functions
    that register named source builders (`WithSourceBuilder`, `WithCELSource`, `WithEnvSource`,
    `WithFileSource`, `WithRequestSource`, `WithResponseSource`, `WithTemplateSource`),
    set the profile, outer block name, default token, request handler, logger, output
    config and request identifier prefix. Every source implements the `Source` interface
    (`Validate`, `Evaluate`, `Close`) and is produced by a `SourceBuilder` from a
    `ProfileEngine` plus the block's field map. `EvaluationHistory` records requests
    and responses keyed by outer block and request block, and exposes map and field-selector
    getters. `config.go` parses HCL object lists into `OuterConfig`, `RequestConfig`,
    `InputConfig`, `FieldSchemaConfig` and `OutputConfig`, each able to report unused
    keys through `ValidateUnused`. Tests cover CEL variable gating, config parsing,
    history, and each source.
