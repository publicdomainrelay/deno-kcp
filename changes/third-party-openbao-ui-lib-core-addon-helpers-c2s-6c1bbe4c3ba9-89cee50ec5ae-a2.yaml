  agentLog: 'This context is the helper layer of the OpenBao core Ember addon, under
    third_party/openbao/ui/lib/core/addon/helpers. Each file is a thin, single-purpose
    template helper: changelogUrlFor builds a GitHub CHANGELOG anchor from a version,
    clusterStates maps a replication cluster state to a display glyph plus ok/syncing
    flags with a neutral fallback, dateFormat renders dates and 10-digit epoch seconds
    with an optional locale timezone suffix, duration converts a second count into
    a human-readable duration string, formatNumber localizes numbers through Intl.NumberFormat,
    messageTypes resolves an alert type to its MESSAGE_TYPES metadata and asserts
    on an unknown type, optionsForBackend computes the available UI options for a
    backend scoped to a tab and engine flag, pathOrArray and looseEqual are generic
    template utilities, sanitizedHtml emits sanitized markup, and IsActiveRoute is
    the one class-based helper. The addon files are paired with re-export files under
    lib/core/app/helpers so the host app can resolve them, and components such as
    alert-banner and alert-inline consume messageTypes.'
