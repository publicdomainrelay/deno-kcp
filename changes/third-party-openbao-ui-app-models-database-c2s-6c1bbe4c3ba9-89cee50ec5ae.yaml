  agentLog: 'Three Ember Data models under third_party/openbao/ui/app/models/database
    back the OpenBao web UI database secrets engine screens. connection.js models
    a database connection configuration: it declares connection attributes (name,
    plugin_name, connection_url, TLS and pool settings, rotation statements) and derives
    which attributes the create and edit forms show from the selected plugin entry
    in AVAILABLE_PLUGIN_TYPES, grouping plugin-specific fields and stating which fields
    are statements. role.js models a database role with the role/ id prefix, attributes
    for the target connection, role type, TTLs and creation/revocation/rotation/rollback/renew
    statements, and computed field metadata for the form and the role-settings form.
    credential.js is a flat read-model holding the generated credential response fields.
    Each model exposes capability flags computed from lazyCapabilities apiPath macros
    so templates can gate edit, delete, reset, rotate, add-role, create-role and generate-credential
    actions.'
