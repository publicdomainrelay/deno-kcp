  agentLog: 'This context covers the Ember.js route layer for OIDC providers in the
    OpenBao web UI, under third_party/openbao/ui/app/routes/vault/cluster/access/oidc/providers/.
    Three route classes each inject the Ember Data store service: OidcProvidersRoute
    (index.js) loads the collection with store.query(''oidc/provider'', {}) and downgrades
    a 404 rejection to an empty array, OidcProvidersCreateRoute (create.js) builds
    an unsaved record with store.createRecord(''oidc/provider'') for the creation
    form, and OidcProviderRoute (provider.js) loads one record with store.findRecord(''oidc/provider'',
    name) using the name dynamic segment. Together the three model hooks supply the
    data that the corresponding oidc/providers templates render, so templates and
    downstream routes can rely on a predictable model shape.'
