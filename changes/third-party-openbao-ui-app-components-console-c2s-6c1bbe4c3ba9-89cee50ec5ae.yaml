status:
  agentLog: 'This context covers the console component directory of the bundled OpenBao
    web UI, third_party/openbao/ui/app/components/console/. It holds seven modules:
    command-input.js, log-json.js, log-list.js, log-object.js, log-text.js, output-log.js
    and ui-panel.js, plus a co-located stringify reachable from log-object.js. The
    only exported symbol the facts carry is stringifyObjectValues(data) in log-object.js,
    which walks the own keys of the given data object, JSON.stringify''s every value
    that is not already a string, and writes the result back into the same object
    in place. The remaining files are named for the roles they play in the console
    UI: reading typed commands, rendering log entries as JSON, as lists, as objects
    and as plain text, appending output, and hosting the panel that contains them.
    Integration tests under third_party/openbao/ui/tests/integration/components/console/
    exercise these components, including log-object-test.js which calls the stringify
    helper.'
