status:
  agentLog: 'The metricsutil package under third_party/openbao/internal/helper/metricsutil
    is OpenBao''s shared metrics layer. It turns token TTLs and lease expiry times
    into fixed histogram bucket labels (TTLBucket, ExpiryBucket) and it runs periodic
    gauge collection through GaugeCollectionProcess, which is built either from a
    raw metrics.MetricSink plus an explicit interval and cardinality cap (NewGaugeCollectionProcess)
    or from a ClusterMetricSink that supplies its own GaugeInterval and MaxGaugeCardinality
    (ClusterMetricSink.NewGaugeCollectionProcess); Run drives the collection loop
    and Stop ends it. MetricsHelper sits in front of an in-memory sink: it caches
    loop gauge values under a key built by CreateMetricsCacheKeyName, picks a response
    format with FormatFromRequest and ResponseForFormat, and serves either a Prometheus
    exposition (PrometheusResponse) or a generic JSON response (GenericResponse).
    ClusterMetricSink, SinkWrapper and BlackholeSink wrap a go-metrics MetricSink
    so that every gauge, counter, sample and duration measurement carries the namespace
    and cluster name labels: the Metrics interface fixes the five labelled operations,
    SinkWrapper implements the duration and measure-since pair, BlackholeSink is a
    ClusterMetricSink that discards everything, and NamespaceLabel converts a namespace.Namespace
    into a metrics.Label. Four test files (bucket_test.go, gauge_process_test.go,
    metricsutil_test.go, wrapped_metrics_test.go) cover the buckets, the gauge process
    lifecycle, the helper responses and the wrapped sinks.'
