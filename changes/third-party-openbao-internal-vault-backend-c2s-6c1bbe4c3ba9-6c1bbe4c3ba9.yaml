  agentLog: 'third_party/openbao/internal/vault/backend/testing.go is the test-support
    file of the OpenBao vault backend package. It defines the Noop backend: a logical.Backend
    implementation that answers nothing meaningful but records everything it is asked
    to do, so that router, rollback and storage tests can assert against the recorded
    requests. Noop carries a sync.Mutex plus slices of paths, requests and invalidated
    keys, an optional Response and an optional RouterTestHandlerFunc that overrides
    the return value. Two factories build it, NoopBackendFactory and NoopBackendRollbackErrFactory,
    both reading the include_resolve_path_operations key out of the BackendConfig
    through parseCfg. InitializableBackend embeds Noop and adds an IsInitialized flag
    plus an Initialize that refuses a second call and proves storage is writable by
    putting a dummy entry. The file also owns the package-level TestLogicalBackends
    and TestCredentialBackends registries, with AddTestCredentialBackend to populate
    the credential registry (rejecting an empty name or a nil factory) and ClearTestCredentialBackends
    to reset it.'
