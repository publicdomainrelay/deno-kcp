  phase: Succeeded
  agentLog: This context covers the four Ember route modules that serve the UI's identity-alias
    pages under vault.cluster.access.identity.aliases. add.js builds a new unsaved
    `identity/<itemType>-alias` record whose canonicalId is taken from the route's
    item_id param and guards navigation away from dirty records, edit.js loads an
    existing alias by item_alias_id, index.js lists aliases through a lazy paginated
    query with page and pageFilter query params, and show.js loads one alias and validates
    the requested section against the tabs registered for that alias type. All four
    obtain the parent identity item type with modelFor('vault.cluster.access.identity')
    and compose an `identity/${itemType}-alias` model name from it, so the alias type
    follows whatever identity type the parent route resolved.
