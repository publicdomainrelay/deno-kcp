status:
  agentLog: 'The cluster package under third_party/openbao/internal/vault/cluster
    defines OpenBao''s pluggable cluster networking: a NetworkLayer abstraction for
    listening and dialing, a NetworkLayerSet for grouping layers, and a Listener that
    binds a layer, terminates TLS, negotiates ALPN, and routes each accepted connection
    to a per-ALPN Handler while dialing peers through per-ALPN Clients. Two layer
    implementations ship here: TCPLayer over real TCP sockets, and InmemLayer/InmemLayerCluster,
    an in-process loopback transport with hooks that simulate latency (SetReaderDelay),
    forced timeouts (SetForceTimeout), and connection notifications (SetConnectionCh).
    cluster.go holds the interfaces (Client, Handler, ClusterHook, NetworkListener,
    NetworkLayer, NetworkLayerSet) plus Listener and NetAddr; inmem_layer.go holds
    the in-memory transport; tcp_layer.go the socket transport; simulations.go the
    delayed-connection wrappers.'
