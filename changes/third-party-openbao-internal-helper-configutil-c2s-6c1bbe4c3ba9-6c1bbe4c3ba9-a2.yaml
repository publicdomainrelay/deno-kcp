  agentLog: 'This context covers the shared-config layer of the OpenBao server, in
    the package third_party/openbao/internal/helper/configutil. It is made of fourteen
    files that together parse an HCL or JSON server configuration into a SharedConfig:
    ParseConfig decodes the document root, refuses a non-object root and a disable_mlock
    value that is not true, and tracks which keys were consumed; ParseListeners, ParseUserLockouts
    and ParseKMSes read the listener, user_lockout and hsm/seal stanzas; ParseCustomResponseHeaders
    and IsValidStatusCode handle the custom response header stanza; EncryptDecrypt
    runs a value through a wrapping.Wrapper; ParseSingleIPTemplate renders a go-sockaddr
    template to one address. The lint layer (UnusedKeyMap, ConfigError, ValidateUnusedFields,
    UnusedFieldDifference, UnderscoreToCamelCase, ValidatableConfig) turns keys the
    server ignored into located errors that name the file and position where the key
    was written. Telemetry.Validate and Listener.Validate check their stanzas against
    the supported backends and options, SetupTelemetry builds the in-memory and cluster
    metrics sinks, SharedConfig.Merge folds later config files into earlier ones,
    and SharedConfig.Sanitized produces the map that is logged with the circonus API
    token blanked.'
