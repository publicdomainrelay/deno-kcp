  agentLog: The openbao/sdk/helper/keysutil package holds the key policy engine that
    OpenBao's transit secrets engine builds on. policy.go defines KeyType with its
    capability predicates (encryption, decryption, signing, derivation, key agreement,
    associated data, public-key import) and the Policy type, which owns KeyEntry versions
    and implements persist/load/serialize/upgrade, encrypt/decrypt, sign/verify, derive,
    import/export, rotate, backup/restore, wrap-key, CSR and certificate-chain handling.
    lock_manager.go wraps policies with a LockManager that caches them (Cache abstraction
    implemented by transit_lru.go's bounded TransitLRU and transit_syncmap.go's unbounded
    TransitSyncMap) and serializes access through GetPolicy, GetPolicyExclusive and
    GetPolicyWithLockType with locking. encrypted_key_storage.go builds a logical.Storage
    decorator that encrypts stored key paths with a convergent AES256-GCM96 policy
    and optionally runs inside logical transactions. util.go carries PKCS#8 parsers
    for Ed25519 and RSA-PSS keys, and consts.go defines the HashType and MarshalingType
    enumerations used by signing and marshaling options.
