  agentLog: This context covers the sidebar header home-link component of the OpenBao
    web UI, vendored under third_party/openbao/ui/app/components/sidebar/header/home-link.ts.
    The file exports the SidebarHeaderHomeLinkSignature interface and the default
    SidebarHeaderHomeLinkComponent class, an Ember Glimmer component typed by that
    signature. The signature declares a single Args field, ariaLabel, of type string.
    The component exposes one getter, ariaLabel, which reads ariaLabel out of this.args,
    asserts with the message '@ariaLabel for "Sidebar::Header::HomeLink" ("Logo")
    must have a valid value' that the value is not undefined, and returns it. The
    component therefore turns the caller-supplied aria-label into the accessible name
    of the sidebar header's home (logo) link, and fails loudly at access time when
    the argument is missing.
