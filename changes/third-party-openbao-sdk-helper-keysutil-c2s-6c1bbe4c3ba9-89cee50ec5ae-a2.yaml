  agentLog: 'This context is the vendored OpenBao SDK keysutil package inside deno-kcp.
    It supplies the policy layer the rest of the repository consumes: Policy holds
    one named key (its type, versions, derivation and convergent-encryption settings),
    and exposes encrypt, decrypt, sign, verify, HMAC, derive, wrap, import, rotate,
    persist, backup and CSR operations over that key. LockManager wraps Policy with
    a named lookup, an optional cache, and shared/exclusive locking so concurrent
    readers do not race with rotation or persistence; the cache is either a size-bounded
    TransitLRU or an unbounded TransitSyncMap, both satisfying one Cache interface.
    Two more pieces sit alongside: an encrypted key storage decorator that encrypts
    stored paths under a policy with a configured prefix and supports transactions,
    and small PKCS#8 parsers plus HashType, MarshalingType and KeyType enumerations
    that gate which operations a key type supports before any crypto runs.'
