status:
  agentLog: 'This context holds the three Ember Data REST serializers that the OpenBao
    web UI uses for the database secrets engine: connection.js, credential.js and
    role.js. Each module extends @ember-data/serializer/rest, sets a primary key (''name''
    for connections and roles, ''username'' for credentials), and converts between
    the JSON the OpenBao database API returns and the attribute names the UI models
    expect. connection.js and role.js share the same pattern: a normalizeSecrets method
    that handles both a list response (payload.data.keys mapped into records) and
    a single-record response, a normalizeResponse that short-circuits update/create/delete
    into a minimal {name, backend} record, and a serialize hook that rewrites UI-side
    names back into API-side names. connection.js additionally filters outgoing attributes
    to the fields declared for the detected plugin type in AVAILABLE_PLUGIN_TYPES,
    while role.js transposes single MongoDB-style statements into arrays and flattens
    the database array into db_name. credential.js is simpler: it renames the credential
    response fields into model attributes and otherwise passes through.'
