  agentLog: Package postgresql in third_party/openbao/sdk/helper/testhelpers/postgresql
    postgresqlhelper.go wraps the OpenBao sdk docker service runner into reusable
    PostgreSQL test fixtures. It starts containers from the mirrored postgres image
    (or the bitnami/postgresql-repmgr image), maps 5432/tcp, and returns a cleanup
    function plus connection URL; a PG_URL environment variable short-circuits container
    startup entirely. Variants cover a plain server, a no-wait server for retry tests,
    a custom password, a container seeded with a vaultadmin superuser for rotate-root
    tests, and a repmgr server wired to a pre-created multihost network. On top of
    that it adds a Cluster abstraction that builds a primary with a replication init
    script and WAL settings, clones replicas via pg_basebackup against named physical
    replication slots, promotes a node with pg_promote, removes the primary for failover
    tests, and cleans everything up nil-safely.
