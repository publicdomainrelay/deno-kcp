  agentLog: 'third_party/openbao/ui/lib/service-worker-authenticated-download/service-worker/index.js
    is the OpenBao UI service worker that makes authenticated browser downloads possible.
    It imports createUrlRegEx and urlMatchesAnyPattern from ember-service-worker/service-worker/url-utils
    and builds a REGEXES list from a single pattern, ''/v1/sys/storage/raft/snapshot''.
    On every fetch event it tests the request URL against those regexes and the request
    method: a GET to a matching URL is answered by authenticateRequest, which clones
    the request headers, asks a window client for the Vault token over a MessageChannel
    (postMessage with action ''getToken''), sets X-Vault-Token on the cloned headers,
    and refetches the original URL with the original method; anything else falls through
    to a plain fetch(request). The token request rejects when the port message carries
    an error field and otherwise resolves with the token value.'
