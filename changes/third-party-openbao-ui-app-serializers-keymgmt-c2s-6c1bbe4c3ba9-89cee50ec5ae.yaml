  agentLog: 'This context holds the two Ember Data serializers for the OpenBao key-management
    UI, vendored under third_party/openbao/ui/app/serializers/keymgmt. KeymgmtKeySerializer
    (key.js) overrides normalizeItems to reshape the key payload: when the payload
    carries a versions object keyed by version number it converts it into an array
    of version records whose id is the version number parsed as base-10 integer merged
    with that version''s own fields, and it annotates the result with created (creation_time
    of the first version) and last_rotated (creation_time of the last version); when
    the normalized payload is instead an array it maps each entry down to id/name
    from the entry''s id plus the backend taken from the parent payload, and anything
    else passes through unchanged. KeymgmtProviderSerializer (provider.js) declares
    primaryKey = ''name'', overrides normalizeItems to stamp id = name and backend
    = payload.backend onto every provider in an array payload, and overrides serialize
    to call the superclass serializer and add the unsaved credentials read from snapshot.record.credentials
    onto the JSON body.'
