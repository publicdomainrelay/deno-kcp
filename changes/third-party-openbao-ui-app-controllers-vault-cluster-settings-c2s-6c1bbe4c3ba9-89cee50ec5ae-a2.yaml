    delete flows for an existing backend''s configuration, including a dedicated SSH
    certificate-authority path through saveCA, and third_party/openbao/ui/app/controllers/vault/cluster/settings/seal.js
    performs the cluster seal action. All three controllers are thin: they hold service
    injections and delegate to the model layer, then redirect with the shared transitionToSafe
    helper rather than the router directly.'
