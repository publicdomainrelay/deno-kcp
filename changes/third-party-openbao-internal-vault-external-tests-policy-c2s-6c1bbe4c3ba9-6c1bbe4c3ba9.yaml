  agentLog: This context is the OpenBao external policy test package at third_party/openbao/internal/vault/external_tests/policy.
    It holds two black-box acceptance test files that drive a real in-memory Vault
    core over the HTTP API rather than calling internal policy functions directly.
    policy_test.go covers token policy composition across login and renewal, pagination
    limits applied by ACL policy paths over a versioned KV mount, and policy-store
    cache invalidation across an active/standby pair with the cache disabled. acl_templating_test.go
