    group name, group id, and alias-name templates, plus the effect of bad group membership,
    invalid metadata values, and the allow_wildcards_in_identity_templates and allow_slashes_in_identity_templates
    policy flags. Both files build a cluster with vault.NewTestCluster, wait for active,
    exercise the system through the api.Client, and assert with require, strutil.EquivalentSlices,
    and vault.TestWaitActive-style helpers.
