status:
  agentLog: 'third_party/openbao/sdk/helper/locksutil is the vendored copy of the
    OpenBao SDK lock helpers inside deno-kcp. cancel.go defines CancelLock, a channel-based
    mutual-exclusion lock whose Lock(ctx) can be aborted by context cancellation and
    whose Unlock releases it, panicking when the lock is not held. keyed.go layers
    KeyedCancelLock[K comparable] on top, holding a sync.Mutex and a map from key
    to keyedCancelLockEntry, recycling entries from a sync.Pool whose New function
    is installed by resetKeyedCancelLockPool from NewCancelLock, so each key gets
    its own CancelLock and unrelated keys do not block. sharded.go provides sharded
    locking: LockEntry and the generic helpers CreateLocks, CreateGenericLocks, LockIndexForKey,
    LockForKey, LocksForKeys, LockWithUnlock and RLockWithUnlock, which hash a string
    key to a uint8 shard index and hand back the matching lock or a deferred unlock
    closure. Three test files, cancel_test.go, keyed_test.go and sharded_test.go,
    pin the observable behaviour, including double-unlock panics, blocking waiters
    that succeed after release, and cancellation during acquisition under synctest.'
