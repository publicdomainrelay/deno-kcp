  agentLog: 'This context covers the syslog audit backend of the vendored OpenBao
    tree, contained in the single file third_party/openbao/internal/builtin/audit/syslog/backend.go.
    The file exposes a Factory constructor that the audit subsystem calls with a context.Context
    and an *audit.BackendConfig and that returns an audit.Backend plus an error, together
    with a Backend struct that holds the device state. Backend implements the full
    audit backend surface: LogRequest and LogResponse write request and response audit
    entries, LogTestMessage writes the operator-triggered test entry using a per-call
    config map, GetHash returns the HMAC hash of a data string, Reload re-reads the
    device configuration, Invalidate drops cached state, and Salt returns the *salt.Salt
    used by the JSON formatter. Together these make syslog one interchangeable audit
    sink alongside the file, http and socket backends that share the same Factory
    and Backend shape.'
