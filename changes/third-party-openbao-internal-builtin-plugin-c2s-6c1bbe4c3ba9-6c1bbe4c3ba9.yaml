  agentLog: 'third_party/openbao/internal/builtin/plugin/backend.go implements the
    builtin plugin logical backend: a version-agnostic Factory that tries the v5 plugin
    backend first and falls back to the v1 PluginBackend, plus a PluginBackend wrapper
    that probes the plugin in metadata mode to learn its type, special paths and version,
    then lazy-loads the real plugin process on first request and transparently restarts
    it after a plugin shutdown. Every read of the wrapped backend takes a read lock,
    so the wrapper can swap the underlying plugin while requests are in flight. Tests
    backend_test.go and backend_lazyLoad_test.go exercise the metadata probe and the
    lazy-load/reload path.'
