  agentLog: The vendored OpenBao identity helper package under third_party/openbao/internal/helper/identity
    holds the protobuf identity records (Group, Entity, Alias, EntityStorageEntry,
    PersonaIndexEntry, LocalAliases) in types.pb.go, the deep-copy and SDK-projection
    helpers in identity.go, and the Sentinel read surface in sentinel.go. Clone deep-copies
    a record by proto.Marshal and proto.Unmarshal into a fresh value and refuses a
    nil receiver with an error, so the storage layer can mutate copies without touching
    originals. Entity.UpsertAlias replaces an alias by ID in place or appends it.
    ToSDKAlias, ToSDKEntity, ToSDKGroup and ToSDKGroups project the internal records
    onto logical.Alias, logical.Entity and logical.Group, copying Metadata into a
    new map so the SDK value never aliases the internal map. Each record's SentinelGet
    and SentinelKeys expose the policy-readable field surface.
