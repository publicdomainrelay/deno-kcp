  agentLog: 'This context covers two Ember route classes in the OpenBao Kubernetes
    secrets-engine UI addon, both under third_party/openbao/ui/lib/kubernetes/addon/routes/roles/.
    KubernetesRolesRoute (index.js) loads the list of Kubernetes roles for the currently
    selected secrets backend: it reads the backend path from the secretMountPath service,
    queries the store for ''kubernetes/role'' records scoped to that backend, optionally
    filters them by a case-insensitive pageFilter query parameter taken from the transition
    target''s queryParams, degrades a 404 into an empty list, and rethrows any other
    error. It returns a hash of the application model as backend, promptConfig, and
    the roles promise. KubernetesRolesCreateRoute (create.js) instead builds an unsaved
    ''kubernetes/role'' record bound to the current backend path so a form can populate
    it. Both routes inject the store and secretMountPath services and both override
    setupController to call super and then assign the controller''s breadcrumbs array,
    so the UI shows the correct navigation trail for listing versus creating roles.'
