  agentLog: 'This context covers a single vendored upstream test file, third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go,
    which is a black-box HTTP-level acceptance test of the response-header allow-list
    feature in the vendored OpenBao vault HTTP handler. The test builds an in-process
    test cluster with vault.NewTestCluster using HandlerFunc vaulthttp.Handler and
    DisableStandbyReads true, starts it, waits for the active core, and defers cluster.Cleanup().
    It registers a credential backend named headtest whose login and loginnoerror
    paths both return a logical.Response whose Headers map carries www-authenticate:
    Negotiate; login also returns logical.CodedError(401, "authentication required")
    while loginnoerror returns an empty logical.Auth with a nil error. The test asserts
    that with an untuned mount the header is stripped from the raw HTTP response on
    both the 200 and 401 paths, then tunes the mount with AllowedResponseHeaders []string{"WwW-AuthenTicate"}
    and asserts the header reappears on both responses, which shows the allow-list
    match ignores letter case.'
