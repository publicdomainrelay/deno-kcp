  agentLog: This context is the third_party/openbao/sdk/helper/salt package, a small
    helper that manages a persistent salt key used to make storage paths and identifiers
    non-reversible. salt.go defines the Salt struct (config *Config, salt string,
    generated bool), the HashFunc type, and the Config struct with Location, HashFunc,
    HMAC and HMACType fields. NewSalt loads an existing salt from a logical.Storage
    view at the configured location, or generates a UUID salt and persists it back
    through the view; NewNonpersistentSalt builds the same structure with an in-memory
    UUID and no storage. Hashing helpers SaltID, SaltIDHashFunc, GetHMAC, GetIdentifiedHMAC,
    SHA1Hash and SHA256Hash apply a configured or supplied hash, or an HMAC plus identifying
    prefix, and return hex strings or raw digest bytes. salt_test.go covers generation,
    restore across two NewSalt calls, and digest length for SHA1 and SHA256.
