status:
  agentLog: 'This context covers the five Ember Data serializers that back the OpenBao
    UI''s OIDC models: assignment, client, key, provider, and scope, all under third_party/openbao/ui/app/serializers/oidc/.
    Every one of them is a small subclass of the shared ApplicationSerializer in the
    parent directory, and every one declares primaryKey = ''name'' so records are
    addressed by their name attribute rather than by an id. Three of them, assignment,
    key, and scope, add nothing else and inherit the base normalization. The other
    two, client and provider, override normalizeItems(payload) with identical bodies:
    when the payload carries a data envelope whose data.keys is an array, they flatten
    the LIST response into one object per key by mapping each entry to { name: key,
    ...payload.data.key_info[key] }, which rehydrates each model with all of its attributes
    instead of just its name; otherwise they hoist the contents of payload.data onto
    the payload itself and drop the empty data key before returning. Provider carries
    the same override so its list view can surface issuer metadata, and client carries
    it so list responses expose full client attributes.'
