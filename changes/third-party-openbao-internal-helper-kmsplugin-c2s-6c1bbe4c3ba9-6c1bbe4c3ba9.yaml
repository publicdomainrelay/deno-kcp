  agentLog: This context is the OpenBao KMS plugin catalog package (third_party/openbao/internal/helper/kmsplugin).
    It owns a Catalog type that resolves server plugin configuration into pluginized
    KMS, Key and wrapper objects, dispenses them over go-plugin gRPC processes, and
    layers reload, finalization and retry behavior on top so that a live server survives
    plugin restarts. The catalog distinguishes builtin implementations (transit KMS,
    kmip/static/transit wrappers, transit metadata) from external plugins addressed
    by name, and it evicts clients whose declared configuration changed when the server
    config is reloaded. Test files cover client lookup, reload and bad config, the
    KMS surface, metadata lookup, and wrapper configuration plus reload and builtin
    dispatch.
