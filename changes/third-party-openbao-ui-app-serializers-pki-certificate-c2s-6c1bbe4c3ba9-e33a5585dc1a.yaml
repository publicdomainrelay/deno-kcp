  agentLog: 'This context covers the PKI certificate serializers in the OpenBao UI
    Ember application, located under `third_party/openbao/ui/app/serializers/pki/certificate/`.
    Three files make up the context: `base.js` defines `PkiCertificateBaseSerializer`,
    an Ember Data serializer extending `ApplicationSerializer`, and `generate.js`
    and `sign.js` each define an empty subclass also named `PkiCertificateGenerateSerializer`
    that inherits all behavior. The base serializer sets `primaryKey` to `serial_number`
    and declares an `attrs` map that marks `role` as non-serializable, then overrides
    `normalizeResponse` so that when the API payload carries a PEM `certificate` field
    the serializer parses it with `parseCertificate` and re-invokes the superclass
    with a payload augmented by `parsed_certificate` and `common_name`; when no certificate
    is present it delegates the original arguments unchanged.'
