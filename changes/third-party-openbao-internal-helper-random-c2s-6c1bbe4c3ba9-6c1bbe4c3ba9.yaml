  agentLog: 'This context is the vendored OpenBao password-policy package at third_party/openbao/internal/helper/random.
    It turns an HCL password policy into a StringGenerator that produces random strings
    satisfying declared rules. PolicyParser.ParsePolicy decodes the HCL body into
    a map, decodes the top level into a StringGenerator with mapstructure using the
    stringToRunesFunc decode hook, pulls the "rule" blocks out with getMapSlice, resolves
    each rule name through the PolicyParser.RuleRegistry (a Registry whose Rules map
    holds constructors such as defaultRuleNameMapping), then calls validateConfig
    on the result. ParsePolicy and ParsePolicyBytes are convenience wrappers that
    build a PolicyParser over defaultRuleNameMapping. The rule layer is the Rule interface,
    with Pass([]rune) bool and Type() string, implemented by CharsetRule, which ParseCharset
    builds from a map[string]any and which exposes its runes through Chars, its minimum
    length through MinLength, and its acceptance test through Pass. serializing.go
    makes rules round-trip through JSON: serializableRules.MarshalJSON and serializableRules.UnmarshalJSON
    carry the rule list, and the runes type marshals and unmarshals a rune slice while
    providing Len, Less and Swap so it sorts. random_api.go exposes the whole thing
    to the logical layer through HandleRandomAPI, and string_generator.go holds StringGenerator,
    whose Generate method draws from an io.Reader and a context to return a string.'
