  agentLog: 'This context covers the vendored OpenBao PKI addon''s Ember route classes
    that back the issuer screens: the issuer list route in third_party/openbao/ui/lib/pki/addon/routes/issuers/index.js,
    the issuer detail route in issuer.js, and the three issuer-producing form routes
    generate-root.js, generate-intermediate.js and import.js. The list route queries
    the store for pki/issuer records with isListView true scoped to secretMountPath.currentPath,
    pairs the result with the parent model from modelFor(''issuers''), and tolerates
    HTTP 404 by resolving to a parent-only model; the detail route reads the issuer_ref
    param from the issuers/issuer parent and issues a queryRecord for a single pki/issuer.
    Each form route builds an unsaved pki/action record, with actionType ''generate-root'',
    ''generate-csr'', or none at all for import, and each is wrapped in withConfirmLeave
    so abandoning an unfilled form prompts. Every route injects the store and secretMountPath
    services, and every setupController builds the breadcrumb chain from secrets through
    the mount overview to the current step, with the list route additionally seeding
    notConfiguredMessage from PKI_DEFAULT_EMPTY_STATE_MSG.'
