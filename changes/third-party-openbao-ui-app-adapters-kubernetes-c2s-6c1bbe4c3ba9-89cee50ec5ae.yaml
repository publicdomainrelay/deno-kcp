status:
  agentLog: 'This context covers the two Ember Data adapters that the OpenBao (Vault)
    web UI uses to talk to a Kubernetes secrets engine mounted at an arbitrary backend
    path. third_party/openbao/ui/app/adapters/kubernetes/config.js defines KubernetesConfigAdapter,
    which extends ApplicationAdapter, pins namespace to ''v1'', and maps the singleton
    config record onto `<buildURL>/<encodePath(backend)>/config`: queryRecord GETs
    it and stamps the backend onto the response, createRecord and updateRecord both
    funnel into a private _saveRecord that serializes the snapshot, POSTs to the URL
    for the record id (snapshot.id or its backend attribute), and resolves with the
    serialized data plus backend and id, urlForUpdateRecord and urlForDeleteRecord
    resolve to the config URL, and checkConfigVars GETs the sibling `<backend>/check`
    path. third_party/openbao/ui/app/adapters/kubernetes/role.js defines KubernetesRoleAdapter,
    which extends NamedPathAdapter and maps role records onto `<buildURL>/<encodePath(backend)>/roles[/<name>]`:
    query GETs with list=true and maps the returned keys to {name, backend} pairs,
    queryRecord GETs a single named role and returns its data with backend and name
    attached, the URL hooks drive update and delete from the snapshot''s backend attribute,
    and generateCredentials POSTs to `<backend>/creds/<role>` after stripping the
    role field from the payload, then flattens lease_id, lease_duration and the response
    data into one object. Both adapters take the engine mount path as the `backend`
    parameter and encode it into every URL they build.'
