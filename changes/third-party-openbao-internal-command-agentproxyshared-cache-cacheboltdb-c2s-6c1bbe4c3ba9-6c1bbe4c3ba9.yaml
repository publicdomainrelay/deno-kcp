  agentLog: 'This context is the cacheboltdb package of the vendored OpenBao agent
    proxy shared cache, implemented in third_party/openbao/internal/command/agentproxyshared/cache/cacheboltdb/bolt.go.
    It wraps a bbolt database as a persistent, encrypted cache for the Vault/OpenBao
    agent: tokens and leases are encrypted through a wrapping.Wrapper with an AAD
    string, marshalled as protobuf BlobInfo values, and stored in named buckets. BoltStorageConfig
    carries the directory Path, an hclog.Logger, the wrapping.Wrapper and the AAD;
    NewBoltStorage joins Path with the fixed file name vault-agent-cache.db, opens
    it 0600 with a 1 second timeout, and creates or migrates the schema to version
    2. The schema keeps auto-auth tokens in the token bucket, auth and secret leases
    merged into one ordered lease bucket addressed by big-endian auto-increment keys
    with a lookup bucket mapping external ids to those keys, and a meta bucket holding
    the version, the latest auto-auth token and the retrieval-token material. The
    exported API is Set, Delete, GetByType, GetAutoAuthToken, GetRetrievalToken, StoreRetrievalToken,
    Close and Clear on BoltStorage, plus the DBFileExists helper. bolt_test.go exercises
    set/get, delete, clear, auto-auth token storage and retrieval-token round trips,
    plus v1-to-v2 and invalid-version migration paths.'
