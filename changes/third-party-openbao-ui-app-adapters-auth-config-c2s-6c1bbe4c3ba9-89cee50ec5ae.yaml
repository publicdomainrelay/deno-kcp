  agentLog: This context holds the Ember Data adapters that the OpenBao web UI uses
    to read and write auth-method configuration. `_base.js` defines the shared `AuthConfig`
    adapter, extending the application adapter with namespace `/v1/auth`; it derives
    the request path from the model type, builds the URL as `<namespace>/<backendId>/config`
    (appending the type-specific path only for `aws` models), and guarantees that
    create and update responses resolve to the owning backend's id. The remaining
    files — azure, jwt, kubernetes, ldap, oidc and radius — are one-line subclasses
    that extend the base adapter with no overrides, so every non-AWS auth method inherits
    identical URL and payload behavior.
