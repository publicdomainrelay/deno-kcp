  agentLog: 'The pkiext context covers the Go test-support and test files of the OpenBao
    PKI secrets engine extension package under third_party/openbao/internal/builtin/logical/pkiext:
    nginx_test.go, test_helpers.go and zlint_test.go. The only exported surface observed
    is LogConsumerWriter, a struct declared in test_helpers.go whose Write method
    makes it an io.Writer, so it can be handed to code that streams docker container
    output. Write scans the incoming byte slice line by line with a bufio.Scanner
    over a bytes.Reader, sizes the scanner buffer to 64 KiB initial capacity with
    bufio.MaxScanTokenSize as the ceiling, passes each scanned line to the struct''s
    exported Consumer callback, and returns the full input length together with a
    nil error. A comment records the known assumption that Write is never given partial
    log lines, which the authors consider safe given how docker implements logging.
    The two sibling test files, nginx_test.go and zlint_test.go, sit in the same package
    and exercise PKI behaviour in the same test harness.'
