  phase: Succeeded
  agentLog: 'The test-integration package proves what the repository alone cannot:
    three tiers of checks over the deno-kcp examples and runtime. The offline tier
    (examples.go, offline_test.go) needs no cluster: it decodes every registered kcp-kind
    manifest through decodeExample, reconciles the declared inventory with exampleFilesOnDisk,
    checks that examples reference each other, and schema-fits each one against the
    APIResourceSchema of its declared kind and the APIExports that name it. The live
    tier (fixture_test.go, live_test.go) stands up kine, kcp and the in-process provider,
    bootstraps the tenancy and provider workspaces, then drives the published example
    chain and a direct run with its readers against typed v1alpha1 objects, polling
    cluster state through liveCluster.expect with explicit timeouts. The OpenBao tier
    (bao_test.go, openbao_live_test.go) builds the pinned third_party/openbao checkout
    once per test binary, runs it in development mode, and proves that a Kubernetes
    namespace gets its own OpenBao namespace whose intermediate is signed by the root,
    that a workload certificate verifies against the root alone over plain HTTP and
    over TLS, and that a namespace with no OpenBao object gets no certificate. TestMain
    reaps every child process the fixture spawned, and the example registry carries
    the atproto market manifests so the cheap tier exercises them with no cluster
    present.'
