status:
  agentLog: 'Package kv is the OpenBao key/value secrets engine. It holds two backends:
    the versioned KV v2 backend (versionedKVBackend, built by VersionedKVFactory and
    exported through Factory) which stores seal-wrapped versioned data, key policy
    and archive, registers the config, data, metadata, detailed-metadata, destroy,
    subkeys, delete and invalid paths, and runs a one-time storage upgrade guarded
    by UpgradeInfo; and the legacy passthrough backend (PassthroughBackend, built
    by PassthroughBackendFactory, LeasedPassthroughBackendFactory and LeaseSwitchedPassthroughBackend)
    which returns the stored data directly and optionally generates leases. types.pb.go
    carries the protobuf wire types Configuration, VersionMetadata, KeyMetadata, Version
    and UpgradeInfo with their getters. delete_version_after.go adds the delete-version-after
    policy helpers on Configuration, and path_data.go carries KeyMetadata.AddVersion
    which appends a version and advances the current version under the configured
    maximum. Tests sit beside every non-generated file.'
