  agentLog: 'This context covers the shared helper modules of the OpenBao web UI core
    addon, located under third_party/openbao/ui/lib/core/addon/utils/. The modules
    are small, single-purpose ES modules: b64.js encodes and decodes UTF-8 strings
    to and from base64 using TextEncoderLite/TextDecoderLite and base64js; date-formatters.js
    turns API timestamps such as ''2021-03-21T00:00:00Z'' into Date objects and formatted
    strings, and provides a chart-label formatter; duration-utils.ts converts between
    a number-plus-unit pair and seconds using a secondsMap, with convertToSeconds,
    convertFromSeconds, a Go-safe variant, and largestUnitFromSeconds that picks the
    biggest unit dividing the value evenly. The remaining files in the directory,
    common-prefix.js, parse-url.js, timestamp.js, and search-select-has-many.js, supply
    common-prefix detection, URL parsing, timestamp helpers, and a helper that applies
    a multi-select result to an Ember Data has-many relationship. Consumers are the
    addon''s components and the app-level re-export at third_party/openbao/ui/lib/core/app/utils/b64.js,
    as well as acceptance and integration tests.'
