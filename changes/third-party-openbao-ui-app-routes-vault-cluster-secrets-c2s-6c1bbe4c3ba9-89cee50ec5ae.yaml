status:
  agentLog: 'Two Ember route modules under third_party/openbao/ui/app/routes/vault/cluster/secrets
    turn the Vault secrets-engine API into routable UI state. third_party/openbao/ui/app/routes/vault/cluster/secrets/backends.js
    defines the index route for the secrets list: its model hook queries the ''secret-engine''
    store with an empty filter and returns the whole record array, so the template
    can render every mounted secrets engine. third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
    defines the route for one engine: it injects the store, flashMessages and secretMountPath
    services, keeps an oldModel slot, and in model(params) pushes the route''s :backend
    param into the secretMountPath service before querying the ''secret-engine'' store
    for that path and returning the first matching record (or undefined when the query
    yields nothing). Its afterModel hook then reads the model''s path and, when the
    transition target is this same route (no deeper child route was matched), redirects
    with replaceWith to vault.cluster.secrets.backend.list-root for that path, so
    a bare engine URL lands on the engine''s root listing instead of an empty intermediate
    state.'
