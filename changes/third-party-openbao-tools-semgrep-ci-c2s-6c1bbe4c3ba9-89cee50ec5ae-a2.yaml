    Every rule declares an id, message, languages and severity, so a finding reports
    a stable rule id. The rules encode Go review conventions the compiler and vet
    do not catch: multierror.Append assigned back onto an operand, nil guards that
    dereference the value they just tested, error shadowing before the error is checked,
    fmt.Printf/Println outside command, tool and test trees, hash Sum without a Write,
    bytes.Equal on an HMAC, hmac.New over a reused hash instance, hclog format strings
    and redundant level checks, time.After inside loops, loop-variable capture in
    goroutines, unchecked values from logical and physical storage Get and from NamespaceByID,
    a logical.Response carrying Auth returned alongside a non-nil error, contradictory
    or repeated if sequences, framework.Path entries mixing Callbacks with Operations,
    two return-nil shapes, strings.SplitN with limit 1, context.Background and context.TODO
    in test files, time.ParseDuration, mismatched mutex lock and deferred unlock pairs,
    and a heuristic wrong-error return. Severities split between ERROR and WARNING,
    and a few rules narrow their scope with paths.include or paths.exclude globs.'
