  agentLog: This context is the vendored OpenBao SDK helper package `third_party/openbao/sdk/helper/shamir`,
    which implements Shamir's Secret Sharing over GF(256). It exposes exactly two
    functions. `Split` takes a non-empty secret plus a part count and a threshold,
    validates the parameters, draws a random shuffled set of x coordinates, builds
    one random polynomial per secret byte, and returns `parts` byte slices each of
    length `len(secret)+1` where the final byte carries the x coordinate. `Combine`
    takes slices produced by `Split`, validates part count, minimum length, uniform
    length, and x-coordinate uniqueness, then reconstructs each secret byte by interpolating
    the polynomial at zero. The package holds no state and no configuration; everything
    is driven by the arguments. Its correctness is pinned by `shamir_test.go`, which
    covers invalid inputs for both functions and the split/combine round trip.
