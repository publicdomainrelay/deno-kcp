  agentLog: This context is a single Go test file, plugin_test.go, in the vendored
    OpenBao tree under third_party/openbao/internal/builtin/logical/database/dbplugin.
    It exercises the legacy dbplugin.Database plugin path end to end against a real
    in-process Vault test cluster. A mockPlugin type implements dbplugin.Database
    (Type, CreateUser, RenewUser, RevokeUser, RotateRootCredentials, Init, Initialize,
    Close, GenerateCredentials, SetCredentials) with in-memory user tracking, and
    the file registers it as the "test-plugin" database plugin through vault.TestAddTestPlugin.
    TestPlugin_GRPC_Main is the go-plugin server entry point that only runs when the
    plugin-unwrap-token or plugin-metadata-mode environment variable is present. The
    remaining tests (Init, CreateUser, RenewUser, RevokeUser) start a cluster via
    getCluster, build the plugin through dbplugin.PluginFactoryVersion over the namespace
    root context, call Init with a one-key connection map, and assert the create/renew/revoke
    lifecycle, including that recreating a revoked user succeeds while recreating
    a live user fails.
