status:
  agentLog: 'third_party/openbao/api/auth/ldap is a vendored copy of the OpenBao Go
    API client''s LDAP auth helper. LDAPAuth holds an unexported mount path, username,
    and one of three password sources (password, passwordFile, passwordEnv). Password
    is the public struct that names those sources via FromFile, FromEnv, and FromString,
    and validates that exactly one is set. LoginOption is a functional option type
    scoped to *LDAPAuth; WithMountPath is the only option shipped. NewLDAPAuth rejects
    an empty username ("no user name provided for login") and a nil Password ("no
    password provided for login"), wraps Password.validate failures as "invalid password:
    %w", defaults the mount path to the defaultMountPath constant "ldap", copies only
    the non-empty password source fields onto the struct, and applies each LoginOption
    in order, wrapping option errors as "error with login option: %w". LDAPAuth.Login
    satisfies api.AuthMethod: it defaults a nil context to context.Background(), resolves
    the password from file (capped at 1000 bytes through io.LimitReader, trailing
    newline stripped), environment, or plaintext, and writes a map with key "password"
    through client.Logical().WriteWithContext to "auth/%s/login/%s", returning the
    resulting *api.Secret or wrapping failures as "unable to log in with LDAP auth:
    %w". ldap_test.go exercises the constructor and login paths.'
