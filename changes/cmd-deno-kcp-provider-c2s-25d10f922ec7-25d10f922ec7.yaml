status:
  agentLog: 'cmd/deno-kcp-provider is the Kubernetes controller binary for the deno-kcp
    project. Its single file, cmd/deno-kcp-provider/main.go, parses flags for kubeconfig
    and host, runs directory, policy engine directory, bundled actions directory,
    deno binary, pod timeout, service account token lifetime, metrics listen address,
    default run TTL, status writing, service domain, and the OpenBao PKI settings
    (address, token, CA certificate, mount, role, intermediate TTL, leaf TTL), with
    each flag falling back to an environment variable through envOr or envOrInt64.
    It sets KUBE_FEATURE_WatchListClient to false before any client-go call, loads
    the kubeconfig with clientcmd.BuildConfigFromFlags, and then builds the provider''s
    collaborators in order: provider.NewRegistry, execrunner.NewEngine for the policy
    engine, execrunner.NewPod for the pod runner, and finally provider.New, which
    is handed the registry as Runtime and Minter, a policyclient.New client, the engine
    runner, and the pod runner. The exec pod runner receives a TrustBundle closure
    that reads the kubeconfig CA data through caData until the provider exists and
    afterwards defers to providerImpl.TrustBundle. main then installs a signal.NotifyContext
    for SIGINT and SIGTERM and calls providerImpl.Run, exiting with code 2 when no
    kubeconfig is given and code 1 on any construction or run error. Helper functions
    are envOr, envOrInt64, defaultRunTTL, caData, and readIfSet; the package exports
    no interfaces.'
