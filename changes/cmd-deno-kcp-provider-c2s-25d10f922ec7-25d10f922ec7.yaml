  agentLog: cmd-deno-kcp-provider holds one file, cmd/deno-kcp-provider/main.go, the
    whole process entrypoint for the provider controller. main sets KUBE_FEATURE_WatchListClient
    to false before any client-go call, declares a config struct, and binds every
    field to a flag whose default is read from the environment through envOr for strings
    and envOrInt64 for integers. Those defaults cover kubeconfig, host, the runs directory,
    the policy engine directory, the bundled actions directory, the deno binary, pod
    timeout, token TTL, metrics listen address, run TTL seconds, write-status, service
    domain, and the OpenBao address, token, CA certificate, mount, role, intermediate
    TTL and leaf TTL, with flag beating environment beating default. main refuses
    to start when kubeconfig is empty, derives the bundled actions directory from
    the policy engine directory when unset, builds the REST config with clientcmd.BuildConfigFromFlags,
    and takes the host from the flag when set and from the kubeconfig server otherwise.
    It then constructs provider.NewRegistry, execrunner.NewEngine, execrunner.NewPod
    and provider.New in that order, exiting 1 with a logged error at each failure,
    gives the pod runner a TrustBundle closure that yields caData(restCfg) while providerImpl
    is nil and providerImpl.TrustBundle() after, installs a signal.NotifyContext for
    SIGINT and SIGTERM, and runs providerImpl.Run, exiting 1 if it returns an error.
    The helpers envOr, envOrInt64, defaultRunTTL, caData and readIfSet carry the remaining
    behaviour, and the package exports no interfaces.
