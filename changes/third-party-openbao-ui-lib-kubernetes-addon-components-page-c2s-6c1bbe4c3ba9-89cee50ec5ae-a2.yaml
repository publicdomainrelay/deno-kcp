    null, fetchInferred calls store.adapterFor(''kubernetes/config'').checkConfigVars
    with the model backend and records ''success'' or ''error'', and a save task confirms
    on first invocation for an existing model, runs model.validate(), stores invalid
    state in modelValidations with the invalid form message in alert, and on success
    persists the model before leaving via the host router. OverviewPageComponent builds
    tracked roleOptions in its constructor from args.roles as name/id pairs, tracks
    selectedRole through selectRole, and transitions the host router to the credentials
    route for that role. CredentialsPageComponent holds the request form state (ttl,
    clusterRoleBinding, kubernetesNamespace, credentials, error) with actions for
    namespace input, ttl update, fetch and cancel plus a leaseExpiry getter. RolesPageComponent
    exposes the owner mount point through a getter and deletes a role record, splicing
    it out of args.roles and reporting success or failure through the flash messages
    service. All four inject the ''host-router'' service as the navigation mechanism.'
