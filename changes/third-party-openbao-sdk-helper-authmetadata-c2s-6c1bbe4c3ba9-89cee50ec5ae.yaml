  agentLog: third_party/openbao/sdk/helper/authmetadata is the OpenBao SDK helper
    package that standardizes the `auth_metadata` configuration field for auth plugins.
    It defines `Fields` (the plugin's field name, default fields, and additionally
    available fields), builds a `framework.FieldSchema` for that field via `FieldSchema`,
    and wraps per-configuration state in `Handler`, which is constructed by `NewHandler`.
    `Handler.ParseAuthMetadata` reads user input from `framework.FieldData`, de-duplicates
    it, stores an explicit list in `authMetadata`, rejects `"default"` mixed with
    other names, and rejects fields outside the available set; `Handler.AuthMetadata`
    returns that list for config reads, falling back to `Fields.Default` when nothing
    explicit was stored. `Handler.PopulateDesiredMetadata` copies the selected fields,
    when non-empty, into both `logical.Auth.Metadata` and `logical.Auth.Alias.Metadata`
    during login, and `Handler.MarshalJSON`/`Handler.UnmarshalJSON` persist the explicit
    list under the JSON key `auth_metadata` so an unconfigured handler stays nil and
    no storage migration is needed when defaults change. The package is exercised
    by auth_metadata_test.go unit tests and auth_metadata_acc_test.go acceptance tests
    that wire the helper into sample `config` and `login` framework paths.
