  agentLog: 'This context is the OpenBao SDK helper package third_party/openbao/sdk/helper/roottoken,
    which handles root token transport encoding for the Vault/OpenBao generate-root
    flow. It has three exported functions: EncodeToken XORs a token with a one-time
    password and base64 raw-encodes the result, DecodeToken reverses that operation,
    and GenerateOTP produces the one-time password itself. GenerateOTP and DecodeToken
    both branch on otpLength: a zero length selects the legacy path, where the OTP
    is 16 random bytes base64 StdEncoding-encoded and the decoded token is formatted
    as a UUID; a non-zero length selects the newer path, where the OTP is a base62
    string of the requested length. The package is covered by encode_test.go and otp_test.go.'
