  agentLog: cert_helpers.go is a Go test-helper package (third_party/openbao/internal/helper/testhelpers/certhelpers)
    that builds X.509 certificates for tests. Callers pass functional options of type
    CertOpt to NewCert, which seeds an x509.Certificate template (random serial, random
    common name, one-hour validity window, basic constraints valid) and then runs
    each option against a CertBuilder. Options set the subject common name (CommonName),
    adopt a parent certificate and its RSA private key (Parent), mark the certificate
    self-signed (SelfSign), toggle CA mode (IsCA), and add subjects (IP, DNS). NewCert
    generates an RSA key with NewPrivateKey, stamps the SubjectKeyId, and calls x509.CreateCertificate;
    on failure it calls t.Fatalf. When self-signing, the template is both leaf and
    parent and the generated key does the signing. CA certificates get KeyUsageCertSign|KeyUsageCRLSign
    and no extended key usage; leaf certificates get digital signature, key encipherment
    and key agreement with server and client auth. The returned Certificate exposes
    CombinedPEM and PrivateKeyPEM for PEM-encoded output.
