  agentLog: 'This context covers the two key-management data models of the OpenBao
    web UI: KeymgmtKeyModel in third_party/openbao/ui/app/models/keymgmt/key.js and
    KeymgmtProviderModel in third_party/openbao/ui/app/models/keymgmt/provider.js.
    KeymgmtKeyModel carries the attributes of a single named key (name, backend, type,
    version metadata, created and lastRotated timestamps, provider, distribution,
    icon) and derives its form field lists, key type options, distribution fields,
    API paths and capability flags from those attributes. KeymgmtProviderModel extends
    the shared UI Model base, declares the provider attributes (backend, name, provider,
    keyCollection), maps the provider type to a display name and icon, exposes credential
    and create form fields, tracks a keys array and a credentials value that the API
    never returns, fetches the keys belonging to a provider, and derives provider
    API paths and capability flags.'
