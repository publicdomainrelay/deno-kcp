  agentLog: 'The routing package is the vendored OpenBao mount registry and request
    dispatcher. MountTable holds MountEntry records and can clone, diff, sort and
    find them by path, backend UUID or namespace; MountEntry derives its API path,
    mount class, plugin kind and deserialized map, and can deep clone and refresh
    its config cache. Router owns the live RouteEntry map keyed by mount prefix: it
    mounts, unmounts, remounts, taints and untaints routes, matches request paths
    to the longest mount prefix, returns the backend, system view and storage behind
    a path, validates accessors and identities, routes logical requests and existence
    checks, resolves mount-relative storage paths, salts identifiers from an installed
    token-store salt function, and classifies paths as root or login through radix
    trees built from unauthenticated path patterns. MountConfig, APIMountConfig, UserLockoutConfig
    and APIUserLockoutConfig carry the per-mount settings that ride along with a MountEntry.'
