status:
  agentLog: 'This context is the `crosstest` package in `third_party/openbao/internal/physical/crosstest/cross_test.go`,
    a Go test-only package that cross-tests OpenBao physical storage backends against
    each other to find behavioral divergence. It builds, in `allPhysical`, a named
    map of every backend under test — raft, file, in-memory, transactional in-memory,
    PostgreSQL — plus composed stacks that layer `physical.NewCache` and `physical.NewStorageEncoding`
    over those backends and, in several cases, `BeginTx` transactions nested inside
    the composed layers; `allTransactionalPhysical` builds the transactional-only
    subset. The test entrypoints `Test_ExerciseBackends`, `Test_RandomOpsBackends`,
    `Test_RandomOpsTransactionalBackends` and `Test_ExerciseTransactionalBackends`
    run all call `t.Parallel()` and then drive those backends: `exerciseBackends`
    issues the same Put/Get/Delete/List/ListPage operations to every backend and compares
    the returned entries and key lists with `deep.Equal`, while `getRandomOps`/`executeRandomOps`/`executeRandomTransactionalOps`
    generate and replay pseudo-random operation sequences (1000 ops, transaction limit
    10) taken from `inmem.InmemOp`. The file also holds `BenchmarkClearView`, which
    measures `logical.ClearViewWithoutPagination` and `logical.ClearViewWithPagination`
    over `logical.InmemStorage` and a raft-backed `logical.NewLogicalStorage`, asserting
    `logical.CountKeys` returns `b.N` before the clear and zero after.'
