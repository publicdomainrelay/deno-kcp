  agentLog: This context covers the `dnstest` test helper package at third_party/openbao/internal/builtin/logical/pki/dnstest/server.go,
    a single-file Go test utility that stands up a real BIND9 DNS server in a Docker
    container so PKI tests can resolve names against a controlled zone. The `TestServer`
    struct holds the docker runner, network name, the running service handle, a mutex-guarded
    record map (domain to record type to values), the set of known domains, and a
    cleanup callback. Two constructors, `SetupResolver` and `SetupResolverOnNetwork`,
    create the server, start the container, and push the initial configuration. The
    remaining methods let tests add and remove domains and records, force a config
    push to the running container, read the container's local and remote addresses,
    and tear everything down. It is used widely across the OpenBao test suite as a
    fixture for certificate and DNS challenge verification.
