  agentLog: 'This context is the OpenBao server''s shared configuration helper package,
    third_party/openbao/internal/helper/configutil. It parses HCL and JSON server
    configuration into a SharedConfig: top-level shared options (ParseConfig), seal
    and HSM stanzas (ParseKMSes), listener stanzas (ParseListeners), user lockout
    stanzas (ParseUserLockouts), telemetry, custom HTTP response headers, and IP-template
    rendering (ParseSingleIPTemplate). The package also carries the merge and lint
