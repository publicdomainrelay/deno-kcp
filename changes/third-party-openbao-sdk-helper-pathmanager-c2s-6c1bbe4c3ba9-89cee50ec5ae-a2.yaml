  agentLog: This context is the vendored OpenBao SDK pathmanager package under third_party/openbao/sdk/helper/pathmanager.
    It holds one exported type, PathManager, which stores a set of path prefixes in
    a radix tree guarded by an embedded RWMutex, and the constructor New that returns
    an empty manager. AddPaths and RemovePaths mutate the tree inside a single transaction
    and commit it, skipping zero-length entries, cutting a leading "!" as the exception
    marker, and trimming a trailing "*" while leaving any trailing slash untouched
    so a path that fully names a file stays distinct from a directory prefix. RemovePathPrefix
    deletes every entry under a prefix. Readers are Len, Paths, HasPath, HasExactPath
    and HasPathSegments, covering counting, listing, prefix matching and whole-segment
    matching. A companion test file exercises construction, add and list, remove,
    prefix removal and the three match modes.
