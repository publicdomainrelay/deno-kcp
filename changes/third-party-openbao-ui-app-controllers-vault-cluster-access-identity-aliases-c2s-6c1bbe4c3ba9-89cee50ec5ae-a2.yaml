status:
  agentLog: 'Three Ember.js controllers under third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases
    back the OpenBao UI identity-alias pages. add.js extends the shared identity create
    controller imported from ''../create'' and overrides showRoute to ''vault.cluster.access.identity.aliases.show''
    so a successful creation navigates to the alias detail route; edit.js extends
    the add controller with no further overrides, inheriting the same create form
    and show route. index.js is the alias list controller: it binds query params page
    to ''page'' and pageFilter to ''pageFilter'' with defaults 1 and null, holds filter,
    filterFocused (false) and isLoading (false) as remaining state, computes filterMatchesKey
    by testing whether any model item id equals the current filter, computes firstPartialMatch
    by escaping the filter with escape-string-regexp and anchoring it at the start
    of item ids (returning null on an exact key match or no match, the single matching
    item otherwise, or an object carrying the model''s shared prefix from core/utils/common-prefix
    when the filter already equals that prefix), and exposes setFilter, setFilterFocus,
    refresh and onDelete actions where refresh and onDelete both send ''reload'' to
    the parent list route.'
