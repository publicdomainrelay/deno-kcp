status:
  agentLog: 'third_party/openbao/sdk/helper/locksutil is the vendored copy of the
    OpenBao SDK lock helpers inside deno-kcp. It contains three related locking utilities.
    cancel.go defines CancelLock, a channel-based mutual-exclusion lock whose Lock(ctx)
    can be aborted by context cancellation and whose Unlock releases it. keyed.go
    layers KeyedCancelLock[K comparable] on top, keeping a per-key CancelLock in a
    map guarded by a sync.Mutex and recycling entries through a sync.Pool. sharded.go
    provides sharded locking: LockEntry and the generic helpers CreateLocks, CreateGenericLocks,
    LockIndexForKey, LockForKey, LocksForKeys, LockWithUnlock and RLockWithUnlock,
    which hash a string key to a uint8 shard index and hand back the matching lock
    or a deferred unlock closure. Three test files, cancel_test.go, keyed_test.go
    and sharded_test.go, pin the observable behaviour, including double-unlock panics
    and cancellation during acquisition under synctest.'
