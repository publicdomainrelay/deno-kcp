status:
  agentLog: 'This context covers the two Ember.js route modules that back the OpenBao
    UI policy listing and creation screens under the vault cluster namespace. `index.js`
    extends `ClusterBaseRoute` and is the list route: it reads the policy `type` segment
    from the `vault.cluster.policies` params, declares `page` and `pageFilter` as
    refresh-modeling query params, and either returns nothing for non-ACL types or
    issues a lazy paginated store query against `policy/<type>` with `responsePath:
    ''data.keys''`, tolerating a 404 for non-ACL types by returning an empty array.
    `create.js` is the new-policy route: it only builds a `policy/<type>` record when
    the type is `acl` and otherwise redirects to the list route, mirrors the policy
    type onto the controller, and guards navigation with a dirty-attribute confirmation
    prompt. Together they define how the cluster policies route tree loads, paginates,
    filters, resets, and refuses to lose unsaved policy edits.'
