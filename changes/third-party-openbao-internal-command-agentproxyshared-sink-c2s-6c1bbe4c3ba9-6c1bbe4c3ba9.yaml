status:
  agentLog: 'This context is the vendored OpenBao agent sink package, held at third_party/openbao/internal/command/agentproxyshared/sink/sink.go.
    It defines the two small contracts that let the agent hand a token to a destination
    — the Sink interface (WriteToken(string) error) and the SinkReader interface (Token()
    string) — plus the configuration and driver types that feed them. SinkConfig embeds
    a Sink and carries the logger, api client, raw config map, wrap TTL, Diffie-Hellman
    type and path, derive-key flag and additional authenticated data, together with
    three unexported caches for the remote public key and the generated key pair.
    SinkServerConfig carries the logger, client, context and an exit-after-auth switch,
    and NewSinkServer turns it into a SinkServer seeded with a nanosecond-seeded math/rand
    source. SinkServer.Run is the run loop: it reads tokens from an incoming channel,
    ignores a token identical to the latest one, fans the token out as one sinkToken
    per configured sink while tracking a remaining counter, and writes each token
    through writeSink, which wraps the token against sys/wrapping/wrap when WrapTTL
    is set, encrypts it when DHType is set, and only then calls the sink''s WriteToken.
    A failed write is logged and re-enqueued after a randomized backoff of 1 to 3
    seconds; a canceled context, an empty sink list with exitAfterAuth, or a drained
    remaining counter with exitAfterAuth each end the loop with a nil error. A nil
    incoming channel is rejected with "sink server: incoming channel is nil".'
