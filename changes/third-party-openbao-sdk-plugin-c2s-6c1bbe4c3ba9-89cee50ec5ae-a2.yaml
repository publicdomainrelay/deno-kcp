  agentLog: 'This context is the vendored OpenBao/Vault SDK plugin package under third_party/openbao/sdk/plugin.
    It carries both halves of the go-plugin gRPC contract for logical backends: GRPCBackendPlugin,
    which registers the backend and PluginVersion services on the plugin side and
    constructs the dispensed client on the host side; the server and client transceivers
    in grpc_backend_server.go and grpc_backend_client.go; and the brokers a backend
    needs to reach host facilities, namely the storage broker (GRPCStorageClient/GRPCStorageServer
    with NOOPStorage and transactional support), the system-view broker (gRPCSystemViewClient/gRPCSystemViewServer),
    and the logger RPC surface in logger.go. The plugin and plugin_v5 files cover
    dispensing, version negotiation, reload-safe cleanup and the external-plugin flag,
    while serve.go provides the Serve and ServeMultiplex entrypoints, and middleware.go
    adds a tracing wrapper over a logical.Backend.'
