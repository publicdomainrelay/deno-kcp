  agentLog: 'The benchhelpers package provides one adapter used by tests across the
    vendored OpenBao tree: TBtoT takes a testing.TB and returns a testinginterface.T
    by wrapping it in the unexported tbWrapper struct, which embeds testing.TB so
    that every other testing.TB method is promoted unchanged. tbWrapper overrides
    Parallel with a no-op, which suppresses the parallel subtests that the historical
    tests were written with. Roughly 600 call sites across openbao/internal and openbao/api
    use this conversion, so those tests compile against testinginterface.T while keeping
    their t.Parallel() calls harmless.'
