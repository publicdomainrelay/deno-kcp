status:
  agentLog: This context is the `internal/baoembed/cmd/baoembed` command, a single-file
    Go `main` package that starts an embedded OpenBao development server for tests
    and local development. It parses four flags — `-addr`, `-root-token`, `-tls`,
    and `-tls-dir` — each falling back to an environment variable (`BAOEMBED_ADDR`,
    `BAOEMBED_ROOT_TOKEN`, `BAOEMBED_TLS`, `BAOEMBED_TLS_DIR`) with defaults of `127.0.0.1:8200`,
    `root`, off, and empty respectively. It exports the root token to the server by
    setting `BAO_DEV_ROOT_TOKEN_ID`, optionally generates a TLS CA and certificate
    into a directory it creates with mode `0o700` (a fresh temporary directory when
    none is given), and then polls the server until it answers. When ready, it writes
    a line beginning with the constant `readyPrefix` (`BAOEMBED `) so callers can
    detect readiness; in TLS mode that line also carries the generated CA certificate
    path, built by joining the TLS directory with `devTLSCAFile`. Failure to set the
    environment variable, to make the certificate directory, or to reach the server
    exits the process with a message on stderr and status 1.
