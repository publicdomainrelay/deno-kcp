  agentLog: This context covers the MySQL test helper package at third_party/openbao/internal/helper/testhelpers/mysql/mysqlhelper.go.
    It is a small, self-contained helper that integration and acceptance tests use
    to obtain a live MySQL instance. PrepareTestContainer either reuses an externally
    provided server when the MYSQL_URL environment variable is set, or starts a Docker
    container running the official MySQL image on port 3306 with a caller-supplied
    root password, waiting until the database answers a ping before handing back a
    cleanup function and a connection string. The Config struct carries the container
    host, port and connection string that the readiness adapter builds. TestCredsExist
    is a companion assertion helper that rewrites the default root credentials in
    a connection string with a newly issued username and password and pings the database
    to prove those credentials work.
