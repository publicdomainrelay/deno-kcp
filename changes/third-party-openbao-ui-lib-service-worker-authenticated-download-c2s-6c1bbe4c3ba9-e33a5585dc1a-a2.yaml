  agentLog: This context covers a single vendored Ember CLI addon file, `index.js`
    in `third_party/openbao/ui/lib/service-worker-authenticated-download/`, taken
    from OpenBao's UI. The file is a CommonJS module that exports one addon descriptor
    object. The descriptor takes its `name` from the sibling `package.json` through
    `require('./package').name`, reports `isDevelopingAddon()` as `true`, and implements
    `serverMiddleware({ app })`, which installs an Express-style middleware on the
    Ember dev server. That middleware sets the `Service-Worker-Allowed` response header
    to `/` on every request and then calls `next()`, so the header is present on responses
    written by later handlers. Setting that header widens the service worker's maximum
    scope to the site root, which is what allows a root-scoped authenticated-download
    service worker to intercept requests outside the directory it is served from.
    The file holds no other logic and exports no other surface.
