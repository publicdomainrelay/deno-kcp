  agentLog: Package pgpkeys is the shared PGP helper for OpenBao. It turns base64-encoded
    public keys into openpgp entities, encrypts secret shares to those keys, decrypts
    with a private key, and supplies flag.Value types plus parsers that accept either
    on-disk key files or keybase:user references. encrypt_decrypt.go holds the crypto
    path (EncryptShares, GetEntities, GetFingerprints, DecryptBytes); flag.go holds
    the flag types and the key-file and keybase resolution (PubKeyFileFlag, PubKeyFilesFlag,
    ParsePGPKeys, ReadPGPFile); keybase.go fetches armored public keys from the Keybase
    lookup API; test_keys.go supplies fixture keys for flag_test.go and keybase_test.go.
