  agentLog: This context covers three Ember.js controllers for the OpenBao web UI
    that live under app/controllers/vault/cluster/access/method/item/. create.js defines
    a controller that owns the create flow for an auth-method item and provides a
    cleanupModel hook which safely disposes the route model; edit.js is a thin subclass
    of that controller that inherits the cleanup behavior unchanged; list.js defines
    the controller that backs the item listing screen, exposing the page and pageFilter
    query parameters, a text filter with prefix-matching computed properties, and
    actions for updating the filter, its focus state, and triggering a reload of the
    list route. Together they are the per-route controller layer for creating, editing
    and browsing items within a single auth method (for example, roles or users of
    a method).
