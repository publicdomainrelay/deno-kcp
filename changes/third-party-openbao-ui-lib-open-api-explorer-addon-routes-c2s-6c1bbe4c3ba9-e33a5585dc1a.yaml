  agentLog: This context is the Ember route module at third_party/openbao/ui/lib/open-api-explorer/addon/routes/index.js,
    part of the vendored OpenBao web UI's open-api-explorer addon. The file defines
    the addon's default route by extending Ember's Route and injecting the flashMessages
    service. It deliberately no-ops the model hook so Ember does not fall back to
    the parent route's model and misbehave with query params, and it implements afterModel
    to raise a sticky, preformatted warning before the explorer is used. The warning
    tells the user that "Try it out" requests are made against the OpenBao server
    on the user's behalf, that a token with the proper capabilities can create and
    delete items on that server, and that the token will be visible in the example
    curl command output. No functions, classes or other interfaces are exported besides
    the route object itself.
