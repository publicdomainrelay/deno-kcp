  agentLog: This context covers the OpenBao JWT/OIDC authentication plugin under third_party/openbao/internal/builtin/credential/jwt.
    The package exports Factory, which builds and sets up a logical.Backend, a CLIHandler
    that implements the login CLI surface with Auth and Help, and a qrWriter that
    renders a qrcode.Matrix into an io.Writer. A provider abstraction is built from
    the CustomProvider interface (Initialize, SensitiveKeys) plus the optional extension
    interfaces UserInfoFetcher, GroupsFetcher, and KeySetDiscovery. ProviderMap returns
    the builtin registry keyed by provider type, and NewProviderConfig resolves and
    initializes a provider from a jwtConfig. Concrete providers AzureProvider, GSuiteProvider
    (with GSuiteProviderConfig), IBMISAMProvider, KubernetesProvider, and SecureAuthProvider
    implement Initialize and SensitiveKeys, and where supported FetchGroups, FetchUserInfo,
    and NewKeySet; KubernetesProvider fetches its key set over HTTP through bearerAuthRoundTripper.
    The backend itself exposes TLS overrides on jwtAuthBackend (OverrideRootCAs, OverrideAllowedServerNames),
    and celRoleEntry serializes itself back to response data.
