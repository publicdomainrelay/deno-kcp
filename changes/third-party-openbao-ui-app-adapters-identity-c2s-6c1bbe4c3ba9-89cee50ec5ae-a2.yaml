  agentLog: 'Six Ember Data adapter modules under third_party/openbao/ui/app/adapters/identity
    implement the OpenBao UI''s HTTP access to the identity secrets engine. base.js
    extends the application adapter, sets namespace ''v1'', returns model type names
    unchanged from pathForType, appends ''?list=true'' to query URLs through urlForQuery,
    overrides query to issue a GET against buildURL with a null id, and overrides
    buildURL to append ''/id'' to the model name except for createRecord requests.
    entity-alias.js and group-alias.js extend base with no further overrides. entity-merge.js
    extends base, hardcodes the URL path identity/entity/merge, and rewrites createRecord
    to resolve with { id: toEntityId } so the caller can redirect to the surviving
    entity after a merge. entity.js and group.js each extend base and add a lookup
    method that POSTs to ${urlPrefix}/identity/lookup/entity or ${urlPrefix}/identity/lookup/group,
    treats a 204 (falsy body) as no match by returning undefined, and otherwise normalizes
    the response through the matching serializer and pushes it into the store before
    returning the raw response.'
