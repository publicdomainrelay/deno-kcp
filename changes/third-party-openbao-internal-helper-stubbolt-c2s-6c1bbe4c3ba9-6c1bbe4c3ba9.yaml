status:
  phase: Succeeded
  agentLog: 'stubbolt.go is a single-file Go package (package bolt) at third_party/openbao/internal/helper/stubbolt/stubbolt.go
    that stands in for github.com/boltdb/bolt, which OpenBao does not want as a dependency
    because the old bolt project is unmaintained and would cost riscv64 platform support.
    It exports a type quartet (Options, DB, Tx, Bucket) and five operations (Open,
    DB.Begin, Tx.Rollback, Tx.Bucket, Bucket.ForEach) that copy the shape of the bolt
    API but do no work: every operation that would open a file, start a transaction,
    or iterate a bucket returns the package-level error value err = errors.New("unimplemented")
    instead. The types are empty structs, so no call carries state, and Tx.Bucket
    is the sole success path, returning a fresh empty &Bucket{} for any name so that
    downstream code can still compile and shape-check against the bolt interface.'
  message: wrote 9 requirement(s) and 9 interface(s) for third-party-openbao-internal-helper-stubbolt
