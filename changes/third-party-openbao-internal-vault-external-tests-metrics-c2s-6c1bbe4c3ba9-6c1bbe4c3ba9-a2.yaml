  agentLog: This context is the external integration-test package for OpenBao core
    metrics, held in the single file third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go.
    The file is package metrics and contains two integration tests plus two unexported
    gauge helpers. TestMountTableMetrics boots a two-core in-memory test cluster with
    a one-minute metric sink and MockBuiltinRegistry, waits for the first core to
    become active, reads the metrics endpoint through testhelpers.SysMetricsReq, and
    asserts that the nonlocal logical mount table reports three entries before a kv
    version 2 mount and four entries after it, while the reported core.mount_table.size
    stays non-zero. TestLeaderReElectionMetrics boots the same cluster shape, issues
    GET /v1/sys/metrics with the cluster root token in the consts.AuthHeaderName header,
    unmarshals the body into testhelpers.SysMetricsJSON, asserts that the core.active
    and core.unsealed gauges exist and equal 1, then calls sys/step_down, waits for
    the second core to become active, and repeats the same assertions against the
    new leader. gaugeSearchHelper walks the gauge list, keeps only series labelled
    local=false and type=logical, requires the core.mount_table.num_entries gauge
    to be present, compares its value for equality, and returns the core.mount_table.size
    value; gaugeConditionCheck is a small comparator that returns an error only for
    the eq comparator.
