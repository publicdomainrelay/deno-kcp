  agentLog: third_party/openbao/sdk/helper/ldaputil is the OpenBao SDK helper package
    that wraps LDAP directory access for the rest of the tree. It defines a Client
    struct whose methods dial one or more LDAP URLs, resolve a user's bind DN, render
    and escape user search filters, look up alias attribute values and user DNs, and
    collect group memberships. Connection and PagingConnection interfaces abstract
    the go-ldap connection so callers can bind, add, modify, delete, search, start
    TLS, set timeouts and unauthenticated-bind without depending on the driver. LDAP
    plus the unexported ldapIfc abstract URL dialing, NewLDAP is the factory, and
    ConfigEntry with ConfigFields/NewConfigEntry carries the field schema, validation,
    and the full and passwordless map views of a stored configuration.
