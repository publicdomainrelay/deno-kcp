  agentLog: 'This context covers the Ember engine addon for the Kubernetes secrets
    engine inside the vendored OpenBao web UI, held under third_party/openbao/ui/lib/kubernetes/addon.
    The addon is defined by two files: engine.js, which declares the KubernetesEngine
    class extending Ember''s Engine, wiring the module prefix from the environment
    config, the Ember resolver, injected services (host-router, store, secret-mount-path,
    flash-messages) and the external route secrets, then registers initializers through
    loadInitializers; and routes.js, which builds the engine route map with overview,
    roles (with create and a nested role route keyed by :name carrying details, edit
    and credentials), configure and configuration. There is no bespoke logic beyond
    engine and route declaration: the addon is pure Ember engine glue and carries
    the HashiCorp MPL-2.0 header, meaning it is vendored upstream UI code rather than
    first-party code of this repository.'
