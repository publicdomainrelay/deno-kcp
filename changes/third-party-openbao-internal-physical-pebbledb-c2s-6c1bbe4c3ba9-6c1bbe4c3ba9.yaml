status:
  agentLog: 'third_party/openbao/internal/physical/pebbledb implements the OpenBao
    physical storage backend on top of CockroachDB PebbleDB. NewBackend parses a configuration
    map (a required path, an optional read_only boolean), opens a Pebble database
    either on disk or in an in-memory VFS when path is ":memory:", and returns a Backend
    value that satisfies both physical.Backend and physical.TransactionalBackend.
    Backend exposes the plain key/value surface (Get, Put, List, ListPage, Delete)
    plus transaction entry points BeginTx and BeginReadOnlyTx. Because Pebble has
    no interactive write transactions, the package builds its own transactions over
    Pebble snapshots using an invalidation-checking conflict model: each Transaction
    keeps its own updates, reads and list results, is registered in a weak-pointer
    map on the parent Backend, and is notified by other writers through notifyWrite
    and notifyCommit. Commit takes the parent write lock last, re-confirms every parallel
    write, and applies the whole update set as one synchronous batch; a read/write
    overlap or a list whose result set would have contained the written key marks
    the transaction conflicted and Commit returns physical.ErrTransactionCommitFailure.'
