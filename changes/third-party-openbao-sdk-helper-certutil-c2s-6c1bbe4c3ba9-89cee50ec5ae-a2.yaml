  phase: Succeeded
  agentLog: 'The third_party/openbao/sdk/helper/certutil package is a vendored copy
    of OpenBao''s PKI helper library, held in four files: types.go (the bundle model
    and its conversions), helpers.go (creation, signing, parsing, key generation and
    extension encoding), certutil_test.go and helpers_test.go (the covering tests).
    types.go defines the raw and parsed bundle pairs for certificates, CSRs and keys,
    the CAInfoBundle used for signing, the CreationBundle/CreationParameters/IssueData
    structs that carry a signing request, plus the PrivateKeyType, BlockType, TLSUsage,
    CertExtKeyUsage, NotAfterBehavior and PrivateKeyExtractor identifiers and the
    ParsedPrivateKeyContainer interface that all key-holding bundles implement. helpers.go
    supplies the observable behavior: key generation, serial-number generation, subject
    key ID derivation, hex byte formatting, public key inspection and comparison,
    key type and bit-length validation, certificate and CSR creation and signing,
    PEM/DER/JSON/map parsing, certificate pools, CRL and basic-constraints extension
    encoding and decoding, OID and SAN handling, and the injectable variants that
    take a caller io.Reader or KeyGenerator so entropy and key material can be supplied
    from outside.'
