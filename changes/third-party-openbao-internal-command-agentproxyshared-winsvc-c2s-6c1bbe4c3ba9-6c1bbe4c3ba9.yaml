  agentLog: 'This context covers the Windows service support shim in OpenBao''s agent
    proxy shared command package. It consists of two small Go files. service.go holds
    a package-level channel chanGraceExit and the exported accessor ShutdownChannel,
    which hands out the receive end so other code can observe that a service shutdown
    signal has arrived. service_windows.go defines an empty serviceWindows struct,
    an init function that decides at process start whether the program is running
    interactively, and the serviceWindows.Execute method that implements the Windows
    service handler contract: it announces StartPending and Running status, accepts
    Stop and Shutdown control codes, echoes the current status back on Interrogate,
    and on Stop or Shutdown reports StopPending, sends a value into the grace-exit
    channel, and returns so the service exits.'
