status:
  agentLog: 'internal/denopod holds the pure decision function for the DenoPod controller.
    Reconcile takes an Observed snapshot (the DenoPod object, an optional ExecutionObservation
    of the running deno process, readiness/liveness probe outcomes, and a wall-clock
    Now) and returns a Result that carries the next phase, run ID, restart count,
    timestamps, exit code, outputs, readiness, conditions, a list of Ops for the side-effect
    layer to perform, a requeue interval, and delete/remove-finalizer flags. The package
    has no client and performs no I/O: New builds a Reconciler with an injected clock,
    defaulting to time.Now. Decisions run in a fixed order: carry the existing status
    forward, tear down on deletion, stop on an already-terminal phase (applying TTLSecondsAfterFinished
    expiry to delete), fail on exceeded activeDeadlineSeconds, start a run when no
    execution is observed, report readiness while the execution is running, and apply
    the pod''s restart policy (Always, OnFailure, or Never, with empty meaning Always)
    once the execution has exited.'
