  agentLog: 'This context is the `cachememdb` package under `third_party/openbao/internal/command/agentproxyshared/cache/cachememdb`.
    It is an in-memory index store for the OpenBao agent cache. `CacheMemDB` wraps
    a `atomic.Pointer[memdb.MemDB]` from `github.com/hashicorp/go-memdb` and exposes
    `Get`, `Set`, `GetByPrefix`, `Evict` and `Flush` over a single memdb table named
    `indexer`. `Index` is the cached record: it carries the request identity (`ID`,
    `Token`, `TokenAccessor`, `TokenParent`, `Namespace`, `RequestPath`), the lease
    identity (`Lease`, `LeaseToken`), the serialized `Response`, the HTTP request
    shape (`RequestMethod`, `RequestToken`, `RequestHeader`), the `LastRenewed` timestamp,
    a `Type` string, and a non-serialized `RenewCtxInfo *ContextInfo` for the renewal
    goroutine. The schema declares seven memdb indexes — `id` (unique on `ID`), `request_path`
    (compound `Namespace` + `RequestPath`, non-unique), `token` (unique), `token_accessor`
    (unique), `lease` (unique), `lease_token` (non-unique), `token_parent` (non-unique)
    — with the last four allowing missing fields. `validIndexName` gates every lookup
    to exactly the seven index-name constants. `Index.Serialize` clears `RenewCtxInfo`
    before JSON marshalling so the context and cancel func never reach the wire, and
    `Deserialize` reconstructs the index with a nil `RenewCtxInfo` that callers must
    rebuild. `NewContextInfo` returns nil for a nil parent context; otherwise it derives
    a cancellable context and a `DoneCh` channel.'
