  agentLog: 'This context is the OpenBao SDK helper package third_party/openbao/sdk/helper/jsonutil,
    a small Go utility layer that wraps encoding/json with strict input checks and
    optional gzip compression. It exposes four exported functions: EncodeJSON marshals
    any non-nil value to JSON bytes through a json.Encoder over a buffer; EncodeJSONAndCompress
    encodes first and then compresses the result through compressutil.Compress, defaulting
    to gzip at gzip.BestCompression when the caller passes a nil CompressionConfig;
    DecodeJSON takes a byte slice that may or may not carry the compression canary,
    decompresses it via compressutil.Decompress, and delegates to DecodeJSONFromReader;
    and DecodeJSONFromReader decodes from an io.Reader with a nil-check on both the
    reader and the output pointer, and enables UseNumber so JSON integers decode to
    json.Number rather than float64. Every entry point rejects nil input with a distinct
    error message, and DecodeJSON distinguishes an unset argument from a failed decompression
    or an empty decompressed payload. The companion test file exercises the compress/decompress
    round trip and both encode and decode paths.'
