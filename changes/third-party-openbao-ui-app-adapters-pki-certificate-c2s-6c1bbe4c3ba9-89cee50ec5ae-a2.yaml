status:
  phase: Succeeded
  agentLog: 'This context holds the three Ember Data adapters the OpenBao UI uses
    to speak to a PKI secrets engine, all under third_party/openbao/ui/app/adapters/pki/certificate/.
    PkiCertificateBaseAdapter extends the application adapter, declares namespace
    = ''v1'', and implements the shared transport: getURL(backend, id) builds `${buildURL()}/${encodePath(backend)}`
    ending in `/cert/<id>` for a single certificate or `/certs` for the list, fetchByQuery(query)
    issues a GET (with `{ list: true }` when no id is given, `{}` otherwise) and annotates
    the response with backend plus id and serial_number when an id was supplied, query
    and queryRecord both delegate to fetchByQuery, and updateRecord POSTs to the backend''s
    `/revoke` endpoint carrying either serial_number or certificate and resolves `{
    data: { ...serialize(snapshot), ...response.data } }`. PkiCertificateGenerateAdapter
    and PkiCertificateSignAdapter each extend that base and override only urlForCreateRecord,
    throwing Error(''URL for create record is missing required attributes'') when
    role or backend is absent and otherwise returning the encoded `/issue/<role>`
    and `/sign/<role>` endpoints respectively.'
