status:
  agentLog: This context covers the deprecated file storage backend of the vendored
    OpenBao SDK, in third_party/openbao/sdk/physical/file/file.go. FileBackend stores
    each logical key as a JSON file below a configured root directory, guarding every
    operation with an embedded sync.RWMutex and a physical.PermitPool sized to physical.DefaultParallelOperations.
    NewFileBackend builds the backend from a configuration map and logs a deprecation
    warning telling operators to migrate with bao operator migrate before v2.7.0.
    The public methods Delete, Get, Put, List and ListPage are thin serializing wrappers
    that take the semaphore and write lock and then call their Internal counterparts;
    the Internal methods do the real work of validating the path against parent references,
    expanding the logical key into a directory and file name, and reading, writing,
    removing or listing JSON entries. file_test.go exercises base64 URL encoding,
    path validation and the backend as a whole.
