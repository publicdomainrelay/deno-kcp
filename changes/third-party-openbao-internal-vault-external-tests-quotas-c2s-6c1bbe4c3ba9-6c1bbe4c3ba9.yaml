status:
  agentLog: quotas_test.go is an external integration test suite for OpenBao's request
    rate-limit quota subsystem. It builds an in-memory test cluster per test via teststorage.ClusterSetup
    with a vault.CoreConfig that registers only the pki logical backend, the userpass
    credential backend and the file audit backend, then drives the cluster through
    the HTTP API client to create, read, list and update rate-limit quotas under sys/quotas/rate-limit
    and global settings under sys/quotas/config. Helper functions setupMounts and
    teardownMounts install and remove a userpass auth mount (user foo/bar), a pki
    mount with a generated internal root certificate (common_name testvault.com, ttl
    200h, ip_sans 127.0.0.1) and a pki role test (allow_subdomains, max_ttl 2h, generate_lease).
    Two load helpers, testRPS and testRPSWithNS, hammer a request function until an
    elapsed deadline and return success count, failure count and elapsed time, which
    the tests compare against the token-bucket ideal of ceil(rate) + rate*seconds.
    The tests cover duplicate names, duplicate paths, exempt paths, default exempt
    paths, audit logging of quota violations, mount-scoped quotas and precedence,
    plain global quotas, namespace-inherited quotas and inheritable flag toggling.
