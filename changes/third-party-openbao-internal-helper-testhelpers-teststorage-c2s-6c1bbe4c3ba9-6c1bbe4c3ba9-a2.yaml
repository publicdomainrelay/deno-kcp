  phase: Succeeded
  agentLog: 'Package teststorage supplies the physical storage backends that OpenBao
    integration tests run against. teststorage.go builds in-memory, latent in-memory
    (in-memory plus a latency injector), file and raft physical backend bundles, each
    returned as a *vault.PhysicalBackendBundle carrying Backend, HABackend and an
    optional Cleanup func. It also supplies the factory adapters that fit those bundles
    into vault.TestClusterOptions: RaftHAFactory and SharedPhysicalFactory, plus the
    setup functions InmemBackendSetup, InmemLatentBackendSetup, FileBackendSetup,
    RaftBackendSetup and RaftHASetup that assign opts.PhysicalFactory, and ClusterSetup
    that threads a ClusterSetupMutator over the CoreConfig and TestClusterOptions
    pair. teststorage_reusable.go adds the ReusableStorage struct and its constructors
    MakeReusableStorage, MakeReusableRaftStorage and MakeReusableRaftHAStorage, which
    hand back a storage plus a StorageCleanup so a test can restart cores without
    rebuilding the backend, and CloseRaftStorage to shut one core''s raft storage
    down. Failures inside constructors go through t.Fatal rather than returning errors.'
