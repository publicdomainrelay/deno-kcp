  agentLog: This context covers two Ember controllers in the OpenBao web UI under
    the vault cluster settings auth route. third_party/openbao/ui/app/controllers/vault/cluster/settings/auth/configure-section.js
    extends @ember/controller, injects the store service, and defines cleanupModel(),
    which guards on an absent model and on the model being saving, destroyed, or destroying,
    calls removeRecord with the injected store when the model exposes unloadRecord,
    and then sets the controller's model to null so a singleton controller does not
    retain a stale record across route visits. third_party/openbao/ui/app/controllers/vault/cluster/settings/auth/enable.js
    extends @ember/controller, injects the router service, and defines an onMountSuccess(type,
    path) action that transitions to the vault.cluster.settings.auth.configure route
    with the mounted method's path through transitionToSafe, so navigation respects
    permissions and route accessibility.
