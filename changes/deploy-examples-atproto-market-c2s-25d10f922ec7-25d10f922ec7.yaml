status:
  agentLog: 'deploy/examples/atproto/market holds a runnable three-service AT Protocol
    topology for kcp: 00-workspaces.yaml creates the workspaces global, relay and
    alice under root with the denoruntime type; 10-rbac.yaml creates the deno-runner
    ServiceAccount plus a ClusterRole and ClusterRoleBinding that grant get/list on
    deno.computer denopods; 15-openbao-global.yaml, 15-openbao-relay.yaml and 15-openbao-alice.yaml
    each declare an OpenBao object named openbao in namespace default, carrying the
    finalizer openbao.deno.computer/namespace and naming the OpenBao namespace (global.default,
    relay.default, alice.default) whose intermediate CA issues that workspace''s serving
    certificates. Four DenoPod objects follow: 20-global-plc.yaml runs the hono-plc
    directory on port 2587 with a /health readiness probe on plc.default.global.svc.kcp.local;
    30-relay-relay.yaml runs hono-atproto-relay on port 2584 with a /xrpc/_health
    probe on relay.default.relay.svc.kcp.local; 40-alice-pds.yaml runs hono-pds on
    port 2583 with --unstable-kv, the deno-runner service account, and PDS_PUBLIC_HOSTNAME,
    PDS_PLC_DIRECTORY_URL, PDS_CRAWLERS and PDS_PRIVATE_KEY_HEX in SERVICE_ENV; 50-verifier.yaml
    runs a restartPolicy Never check that creates an account on the PDS, reads the
    DID back from the PLC directory, opens a WebSocket to the relay''s subscribeRepos
    and records a pass verdict only when plcStatus is 200, gotAccessJwt is yes and
    relaySawCommit is yes. Every service pod shares the same supervisor script: it
    reads SERVICE_ENTRY, SERVICE_CWD, SERVICE_ARGS, SERVICE_DENO_FLAGS and SERVICE_ENV,
    writes the injected KCP_CA_BUNDLE to ca.pem and points DENO_CERT at it, writes
    KCP_TLS_CERT and KCP_TLS_KEY to tls.crt and tls.key and appends --tls-cert-file
    and --tls-key-file to the child argv, prepends KCP_SHIM as a --preload flag, then
    spawns the entry module as a child with an env allowList restricted to the shim''s
    keys and writes exitCode into result.json.'
