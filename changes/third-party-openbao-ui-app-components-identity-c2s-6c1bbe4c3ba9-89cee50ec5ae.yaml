  agentLog: 'This context covers nine Ember.js component modules under third_party/openbao/ui/app/components/identity/
    that make up the identity (entity and group) UI of the vendored OpenBao web app.
    They fall into three groups: a shared popup base component (_popup-base.js) plus
    four thin subclasses that each perform one destructive mutation (popup-alias.js
    deletes a record, popup-members.js removes a member from a group, popup-metadata.js
    deletes a metadata key, popup-policy.js removes a policy); form and navigation
    components (edit-form.js, entity-nav.js, item-details.js); and a lookup component
    (lookup-input.js) that resolves an entity or group by alias name, id, or mount
    accessor and routes to its detail page. All components are Ember classic `Component.extend`
    definitions that inject the flash-messages, store, and router services, and several
    use ember-concurrency tasks with the `waitFor` test waiter.'
