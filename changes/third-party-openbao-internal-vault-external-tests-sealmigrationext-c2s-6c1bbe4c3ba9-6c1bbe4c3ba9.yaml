    Each one calls t.Parallel(), builds an hclog logger at Debug level named after
    the test, obtains reusable in-memory storage through teststorage.MakeReusableStorage
    and teststorage.MakeInmemBackend, defers the returned cleanup, and then delegates
    the real work to a parameterized helper in the sibling package internal/vault/external_tests/sealmigration,
    passing the logger, the storage handle and a distinct base port taken from that
    package''s constants plus an offset of 300. The package therefore owns no migration
    logic itself; it only selects which seal-migration scenario to run, on which storage,
    and on which port range, so the shared sealmigration package can be reused by
    other external surfaces.'
