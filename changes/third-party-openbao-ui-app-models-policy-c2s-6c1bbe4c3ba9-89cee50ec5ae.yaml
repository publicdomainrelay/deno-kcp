  agentLog: 'This context covers the three OpenBao web UI policy models that live
    under third_party/openbao/ui/app/models/policy: acl.js, egp.js and rgp.js. All
    three are Ember Data models built by extending a shared base policy model. acl.js
    is the simplest, an ACL policy model that adds nothing to the base. rgp.js defines
    the RGP (role governing policy) model and adds an enforcementLevel string attribute
    restricted to the values advisory, soft-mandatory and hard-mandatory, defaulting
    to hard-mandatory, plus an additionalAttrs computed property that expands attribute
    metadata for that field. egp.js defines the EGP (endpoint governing policy) model
    by extending the RGP model, adding a paths attribute rendered as a string array,
    and overriding additionalAttrs so the expanded metadata covers both enforcementLevel
    and paths. Together they supply the field set and edit metadata the policy create/edit
    forms consume.'
