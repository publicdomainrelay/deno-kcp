  agentLog: 'This context covers three Ember.js route modules that implement the OpenBao
    UI''s policy screens for a Vault cluster: the policy index route, the policy show
    route, and the policy edit route. The index route is a redirect shim that immediately
    forwards to the ACL policy list. The show route resolves the current policy type
    from the parent route''s params, loads the policy record and its capabilities
    record together, and pushes both onto the controller; it also redirects the special
    root ACL policy away from the detail view and cleans up the controller''s model
    when the route is exited. The edit route subclasses the show route and adds a
    single transition guard that asks the user to confirm before discarding unsaved
    changes.'
