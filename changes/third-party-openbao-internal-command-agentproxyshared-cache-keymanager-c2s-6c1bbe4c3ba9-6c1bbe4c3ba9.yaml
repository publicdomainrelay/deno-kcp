status:
  agentLog: 'The keymanager package under third_party/openbao/internal/command/agentproxyshared/cache/keymanager
    defines the KeyManager interface and one concrete implementation, PassthroughKeyManager.
    KeyManager is the contract the agent cache uses for key material: Wrapper() hands
    back a wrapping.Wrapper for key operations, and RetrievalToken(ctx) returns bytes
    that let a caller source back the encryption key, either the key itself or a token
    that exchanges for it. PassthroughKeyManager implements that contract with an
    embedded AES-GCM wrapper from github.com/openbao/go-kms-wrapping/v2/aead. NewPassthroughKeyManager
    builds the manager: it takes a 32-byte key, generates a random 32-byte root key
    when the caller passes nothing, rejects any other length, then configures the
    aead wrapper with key_id set to the package constant KeyID ("root") and installs
    the root key bytes. Wrapper returns that wrapper, and RetrievalToken calls KeyBytes
    on it, erroring when the wrapper is nil. The package is a passthrough by design:
    it does not abstract or re-wrap the key, so the retrieval token is the key material
    itself. A compile-time assertion in passthrough.go pins PassthroughKeyManager
    to the KeyManager interface, and passthrough_test.go covers the constructor and
    both methods.'
