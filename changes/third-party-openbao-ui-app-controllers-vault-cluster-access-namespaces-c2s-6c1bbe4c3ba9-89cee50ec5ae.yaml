  phase: Succeeded
  agentLog: 'Two Ember controllers back the OpenBao UI namespaces screens under vault/cluster/access/namespaces.
    index.js is the list controller: it injects the namespace and store services,
    aliases accessibleNamespaces to namespaceService.accessibleNamespaces and currentNamespace
    to namespaceService.path, defines cleanupModel to detach and unload the model
    record, and exposes a refreshNamespaceList action that refetches the namespace
    picker data and reloads the route. create.js is the creation controller: it injects
    namespace, store and router services, repeats the same cleanupModel teardown,
    and exposes an onSave action that refetches the namespace picker and transitions
    to the namespaces index route when the save type is ''save''. Both controllers
    exist to keep namespace picker state fresh and to avoid leaking singleton-controller
    model references.'
