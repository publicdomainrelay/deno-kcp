  agentLog: 'This context covers the Ember engine entrypoint of the OpenBao PKI UI
    addon, held under third_party/openbao/ui/lib/pki/addon. The engine.js file declares
    the default-exported PkiEngine class, which extends Ember''s Engine base class
    and fixes the three fields an engine needs at load time: the modulePrefix naming
    the addon''s module namespace, the Resolver used to look up that namespace, and
    the dependencies block that declares the host services the engine injects (auth,
    download, flash-messages, namespace, path-help, host-router, secret-mount-path,
