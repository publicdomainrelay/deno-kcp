  agentLog: 'This context is the page-component layer of the OpenBao PKI secrets-engine
    Ember addon, held in the deno-kcp repository under third_party/openbao/ui/lib/pki/addon/components/page/.
    Fourteen TypeScript component files define the route-level screens for the PKI
    engine: certificate details, configuration details and edit, configure-create,
    issuer details, issuer edit, issuer generate-intermediate, issuer generate-root,
    issuer import, issuer rotate-root, key details, overview, role details, and tidy
    status. The components are Glimmer classes extending Component, they declare services
    such as Store, FlashMessageService, DownloadService, VersionService and a host-router,
    and they expose @action and @task methods that call the store adapters (for example
    the pki/issuer adapter''s deleteAllIssuers), save models, drive router transitions,
    format serial numbers for PEM download, and report success or failure through
    flash messages. The observed facts give full bodies for only a few members, so
    the requirements below state what the exported names, actions and error paths
    do at the level the facts support.'
