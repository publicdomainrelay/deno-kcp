status:
  agentLog: This context covers the in-memory sink used by OpenBao's agent proxy shared
    command package. The package defines a single unexported type, inmemSink, that
    keeps an auto-auth token in memory instead of writing it to disk like the file
    sink does. New builds one from a *sink.SinkConfig and an optional *cache.LeaseCache
    and returns it as a sink.Sink. WriteToken stores the token atomically and, when
    a lease cache was supplied, also registers it as the auto-auth token, returning
    any error from that registration; with no lease cache it simply returns nil. Token
    reads the stored value and returns the empty string when nothing has been written
    yet. Because reads and writes go through an atomic value, the sink is safe for
    concurrent use.
