  agentLog: 'This context covers one vendored file from the OpenBao agent, third_party/openbao/internal/command/agent/internal/ctmanager/runner_config.go.
    The file declares ManagerConfig, a struct that carries an agent config, a namespace,
    an hclog level and an io.Writer for logs, and NewConfig, which turns that struct
    plus a set of ctconfig.TemplateConfigs into a fully populated *ctconfig.Config
    for the consul-template runner. NewConfig starts from ctconfig.DefaultConfig,
    copies the templates, and then fills the Vault section: token and renew-token
    are forced empty and false so nothing leaks in from the environment, the address
    comes from the agent config, the namespace is applied only when non-empty, a non-zero
    StaticSecretRenderInt becomes the default lease duration, DisableIdleConnsTemplating
    sets max idle connections to -1 and DisableKeepAlivesTemplating sets keep-alives
    off, an SSL block starts disabled with empty strings, retry attempts default to
    ctconfig.DefaultRetryAttempts and can be overridden by the agent''s retry block.
    When the agent has a cache but no in-process dialer the function returns an error;
    otherwise it installs the dialer and forces the address to http://127.0.0.1:8200.
    When there is no cache but the address starts with https or a CA cert is given,
    an enabled SSL block is built with Verify set to the inverse of TLSSkipVerify.
    Auto-auth min and max backoff are copied into the retry backoff when positive.
    The function then calls conf.Finalize(), converts the log level to a string through
    logLevelToStringPtr, configures ctlogging with that level and the supplied writer,
    and returns the config or the logging error.'
