  agentLog: 'This context covers three Ember Glimmer components that make up the Key
    Management (keymgmt) UI for the bundled OpenBao frontend, living under third_party/openbao/ui/app/components/keymgmt.
    KeymgmtDistribute renders the form that distributes an existing or newly created
    key to a KMS provider, deriving the legal operation set from the provider type
    and key type and surfacing a compatibility error when the pairing is invalid.
    KeymgmtKeyEdit renders a single key with mode-driven create/edit/show behaviour
    plus delete, remove-from-provider and rotate actions. KeymgmtProviderEdit renders
    a single provider, fetching its keys in show mode and handling provider save,
    provider delete and key delete. All three follow the same house pattern: @service
    injections for store/router/flashMessages, @tracked state, ember-concurrency @task
    methods wrapped in @waitFor, and vault/utils/transition-to-safe for navigation.'
