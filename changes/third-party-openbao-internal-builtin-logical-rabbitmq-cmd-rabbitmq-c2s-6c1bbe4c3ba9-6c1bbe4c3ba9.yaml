  agentLog: third_party/openbao/internal/builtin/logical/rabbitmq/cmd/rabbitmq/main.go
    is the command entrypoint that builds the OpenBao RabbitMQ secrets-engine plugin
    binary. Its main function builds an api.PluginAPIClientMeta, parses the plugin
    TLS flag set from os.Args[1:], derives a TLS config and hands it to api.VaultPluginTLSProvider,
    then calls plugin.ServeMultiplex with a ServeOpts whose BackendFactoryFunc is
    rabbitmq.Factory and whose TLSProviderFunc is that provider. On a serve error
    it constructs an hclog logger, logs "plugin shutting down" with the error, and
    exits with status 1. The package exports nothing of its own; the file is a thin
    adapter between the api and sdk plugin machinery and the rabbitmq backend factory.
