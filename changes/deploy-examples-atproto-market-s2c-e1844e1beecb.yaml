apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SpecChange
metadata:
  name: deploy-examples-atproto-market-s2c-e1844e1beecb
  namespace: default
spec:
  delta:
    intent:
      from: 'This context exists to pin down the deploy/examples/atproto/market example
        as an executable specification of what the kcp deno runtime must support:
        three peer services that reach each other only by cluster-local name over
        TLS, with identity and certificates supplied from outside the pod. It is the
        reference topology that exercises workspace creation, per-workspace API bindings,
        per-workspace RBAC, per-workspace OpenBao certificate authority selection,
        the provider''s virtual DNS table and shim, and the TLS leaf injection path,
        and it exists so that a regression in any of those surfaces shows up as a
        failing verifier pod rather than as an untested assumption in the provider.'
      to: 'This context exists to pin down the deploy/examples/atproto/market example
        as an executable specification of what the kcp deno runtime must support:
        peer services that reach each other only by cluster-local name over TLS, with
        identity and certificates supplied from outside the pod, and a market bidder
        that reaches those same peers the same way. It is the reference topology that
        exercises workspace creation, per-workspace API bindings, per-workspace RBAC,
        per-workspace OpenBao certificate authority selection, the provider''s virtual
        DNS table and shim, and the TLS leaf injection path, and it exists so that
        a regression in any of those surfaces shows up as a failing verifier pod rather
        than as an untested assumption in the provider.'
    requirements:
    - id: r.apply-includes-bob-and-bidder
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/apply.sh
        id: r.apply-includes-bob-and-bidder
        level: MUST
        text: apply.sh names the workspaces global relay alice bob, requires atproto-market/hono-bidder
          (as well as hono-plc, hono-atproto-relay and hono-pds) in its preflight
          check, generates a PDS key for bob and a key for the bidder, each distinct
          from alice's and each overridable by BOB_PDS_PRIVATE_KEY_HEX and BIDDER_PRIVATE_KEY_HEX,
          substitutes them for __BOB_PDS_PRIVATE_KEY_HEX__ and __BIDDER_PRIVATE_KEY_HEX__,
          applies 15-openbao-bob.yaml with the other authorities, applies 60-bob-pds.yaml
          before 70-bidder.yaml, and reports the phase and readiness of both pds and
          bidder in its final summary.
    - id: r.arch-data-lists-bob
      op: added
      to:
        codeRefs:
        - file:.tools/open-architecture/arch.yaml
        id: r.arch-data-lists-bob
        level: SHOULD
        text: The open-architecture overlay data ov.market-workspaces in .tools/open-architecture/arch.yaml
          lists root:bob alongside root:global, root:relay and root:alice, so validate.py
          and 00-workspaces.yaml agree.
    - id: r.bidder-pod
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/70-bidder.yaml
        id: r.bidder-pod
        level: MUST
        text: 'The bob workspace runs DenoPod bidder in namespace default under the
          deno-runner service account with restartPolicy Always, the denopod.deno.computer/run
          finalizer, SERVICE_ENTRY <ORG_ROOT>/atproto-market/hono-bidder/mod.ts (apply.sh
          rewrites the /home/johnandersen777/src/publicdomainrelay-kcp prefix), SERVICE_CWD
          <ORG_ROOT>/atproto-market, SERVICE_ARGS ["--serve-addr","127.0.0.1","--serve-port","2586","--plc-directory-url","https://plc.default.global.svc.kcp.local","--relay-url","https://relay.default.relay.svc.kcp.local","--skip-qr","--no-ingress-proxy","--compute-provider-deno-worker"]
          (the deno-worker compute provider is the only one that needs no cloud credential),
          SERVICE_DENO_FLAGS ["--unstable-kv"], SERVICE_TLS true, SERVICE_ENV {"PORT":"2586","HOSTNAME":"127.0.0.1","REPO_PRIVATE_KEY_HEX":"__BIDDER_PRIVATE_KEY_HEX__"}
          (PORT and HOSTNAME are what the provider advertises for bidder.default.bob.svc.kcp.local,
          because the bidder names its listener --serve-port and the name table only
          reads --port or PORT), and a readiness probe that resolves bidder.default.bob.svc.kcp.local
          and requests /oauth-client-metadata.json. It lives in root:bob because it
          is bob''s market participant: it shares bob''s OpenBao authority, service
          account and workspace identity with bob''s PDS and reaches the market through
          the same virtual DNS table.'
    - id: r.bidder-supervisor-script
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/70-bidder.yaml
        id: r.bidder-supervisor-script
        level: MUST
        text: 'The bidder pod''s script writes the injected KCP_CA_BUNDLE to ca.pem
          and sets DENO_CERT to it, prepends KCP_SHIM to the Deno flags as --preload,
          spawns the entry module as a child process with stdin null and inherited
          stdio, and writes the child exitCode to result.json. It must NOT write tls.crt
          or tls.key and must NOT append --tls-cert-file or --tls-key-file to the
          child argv: hono-bidder''s cli-args-env declares no such options and its
          parser rejects unknown flags, so the bidder consumes only the trust bundle
          even though SERVICE_TLS is true.'
    - id: r.bob-pds-pod
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/60-bob-pds.yaml
        id: r.bob-pds-pod
        level: MUST
        text: 'The bob workspace runs DenoPod pds in namespace default under the deno-runner
          service account with restartPolicy Always, the denopod.deno.computer/run
          finalizer, SERVICE_TLS true, --unstable-kv in SERVICE_DENO_FLAGS, port 2585
          (which collides with no other service: alice uses 2583, the relay 2584 and
          the PLC 2587), PDS_PUBLIC_HOSTNAME pds.default.bob.svc.kcp.local, PDS_PLC_DIRECTORY_URL
          pointed at the global PLC name, PDS_CRAWLERS pointed at the relay name,
          PDS_SUBSCRIBE_REPOS_FORMAT json, and PDS_PRIVATE_KEY_HEX in SERVICE_ENV
          as a key distinct from alice''s (__BOB_PDS_PRIVATE_KEY_HEX__), so the two
          PDS identities differ.'
    - id: r.four-workspaces-at-root
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/00-workspaces.yaml
        id: r.four-workspaces-at-root
        level: MUST
        text: The example creates exactly the four workspaces global, relay, alice
          and bob, each with spec.type.name denoruntime and spec.type.path root.
    - fields:
      - codeRefs
      - text
      from:
        codeRefs:
        - file:deploy/examples/atproto/market/15-openbao-alice.yaml
        - file:deploy/examples/atproto/market/15-openbao-global.yaml
        - file:deploy/examples/atproto/market/15-openbao-relay.yaml
        id: r.openbao-object-per-workspace
        level: MUST
        text: 'Each workspace applies one OpenBao object named openbao in namespace
          default, carrying the finalizer openbao.deno.computer/namespace and naming
          the OpenBao namespace that serves it: global.default, relay.default and
          alice.default respectively.'
      id: r.openbao-object-per-workspace
      op: changed
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/15-openbao-alice.yaml
        - file:deploy/examples/atproto/market/15-openbao-bob.yaml
        - file:deploy/examples/atproto/market/15-openbao-global.yaml
        - file:deploy/examples/atproto/market/15-openbao-relay.yaml
        id: r.openbao-object-per-workspace
        level: MUST
        text: 'Each workspace applies one OpenBao object named openbao in namespace
          default, carrying the finalizer openbao.deno.computer/namespace and naming
          the OpenBao namespace that serves it: global.default, relay.default, alice.default
          and bob.default respectively.'
    - id: r.rbac-covers-bob
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/10-rbac.yaml
        - file:deploy/examples/atproto/market/apply.sh
        id: r.rbac-covers-bob
        level: MUST
        text: apply.sh applies 10-rbac.yaml in root:bob as it does in every workspace,
          and every DenoPod in bob (pds and bidder) names the deno-runner service
          account. No new ClusterRole is added, because deno-runner-read-pods already
          grants get and list on denopods.
    - id: r.readme-lists-bob-and-bidder
      op: added
      to:
        codeRefs:
        - file:deploy/examples/atproto/market/README.md
        id: r.readme-lists-bob-and-bidder
        level: MUST
        text: README.md's service table adds root:bob DenoPod/pds (hono-pds, port
          2585, pds.default.bob.svc.kcp.local) and root:bob DenoPod/bidder (hono-bidder,
          port 2586, bidder.default.bob.svc.kcp.local), its OpenBao table adds root:bob
          OpenBao/openbao bob.default (15-openbao-bob.yaml), its prose says four workspaces,
          and its ceilings note that the bidder registers with an XRPC dispatcher,
          so it needs one reachable.
    - from:
        codeRefs:
        - file:deploy/examples/atproto/market/00-workspaces.yaml
        id: r.three-workspaces-at-root
        level: MUST
        text: The example creates exactly the three workspaces global, relay and alice,
          each with spec.type.name denoruntime and spec.type.path root.
      id: r.three-workspaces-at-root
      op: removed
