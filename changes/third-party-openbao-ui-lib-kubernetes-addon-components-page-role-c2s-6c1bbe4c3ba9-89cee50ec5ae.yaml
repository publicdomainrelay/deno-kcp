    and both read their state from this.args.model, the Kubernetes role model carrying
    the role record and backend. CreateAndEditRolePageComponent owns the role-rules
    editing surface: it conditionally initializes generated role rules for the ''full''
    generation preference, expands the annotations section when the model already
    carries extra annotations or labels, offers three generation-preference options
    (basic, expanded, full), and drives template selection and save/cancel actions
    through tracked state. RoleDetailsPageComponent is the read/delete side: it derives
    which extra metadata fields to render and deletes the role record before routing
    back to the Kubernetes roles list, flashing a danger message if the delete fails.'
