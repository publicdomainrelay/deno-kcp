  agentLog: 'This context covers the sidebar components of the OpenBao web UI, under
    third_party/openbao/ui/app/components/sidebar/. Two Ember components are present.
    frame.js defines SidebarNavComponent, which extends Component and injects the
    currentCluster and console services plus the vault.cluster controller so the navigation
    frame can read cluster state. user-menu.js defines SidebarUserMenuComponent, which
    injects the auth, currentCluster and router services, tracks a fakeRenew flag
    that defaults to false, and exposes the derived values and actions the user menu
    needs: hasEntityId, isRenewing, transitionToRoute, renewToken and revokeToken.
    Together the two files describe how the sidebar renders cluster navigation and
    how it renews or revokes the current token for the logged-in user.'
