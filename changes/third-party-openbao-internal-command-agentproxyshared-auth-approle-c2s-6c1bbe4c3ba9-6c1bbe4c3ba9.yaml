    typed values. approleMethod.Authenticate is the only method with real behavior:
    it stats and reads the role ID file, caches the trimmed value, and falls back
    to a previously cached role ID when the file read fails or the file is empty,
    warning instead of failing only when a cached value exists. With no secret ID
    path it returns mountPath + "/login" plus role_id only; otherwise it reads the
    secret ID file, optionally unwrapping a response-wrapped token through a cloned
    API client whose wrapping lookup creation_path must equal secret_id_response_wrapping_path,
    caches the trimmed secret ID, and removes the secret ID file after reading when
    configured. NewCreds returns a nil channel, and CredSuccess and Shutdown are empty
    no-ops, so this method never signals credential rotation.'
