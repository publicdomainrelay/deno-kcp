  agentLog: third_party/openbao/sdk/helper/testcluster is a vendored copy of the OpenBao
    SDK test-cluster helper package. It defines the VaultCluster and VaultClusterNode
    interfaces plus Storage, ClusterStorage and NodeStorage backend abstractions in
    types.go, and implements them for an out-of-process dev server in exec.go through
    ExecDevCluster and its execDevClusterNode children. ExecDevClusterOptions controls
    the binary path, temp directory, core count, base listen address, cluster name
    and logger; NewExecDevCluster and NewTestExecDevCluster spawn `vault server -dev`
    with -dev-cluster-json and BAO_LOG_FORMAT=json, and only NumCores of 1 or 3 are
    accepted. util.go adds seal/unseal, health, sealed-count, leader-election and
    root-token helpers that operate against any VaultCluster, logging.go provides
    JSONLogNoTimestamp, and consts.go holds package constants.
