  agentLog: 'This context is the `open-api-explorer` Ember Engine addon inside OpenBao''s
    vendored web UI, rooted at `third_party/openbao/ui/lib/open-api-explorer/addon`.
    It holds only the engine''s three bootstrap modules: `engine.js` declares the
    Engine subclass, `resolver.js` re-exports the stock Ember resolver, and `routes.js`
    supplies the engine''s route map. `engine.js` extends `ember-engines/engine`''s
    `Engine`, takes `modulePrefix` from `./config/environment`, uses the addon''s
    own `./resolver`, and declares the host services it consumes: `auth`, `flash-messages`,
    `namespace`, `host-router`, and `version`. It then runs `loadInitializers` against
    the engine class and exports that class as the module default. The route map in
    `routes.js` is built with `ember-engines/routes` and currently registers no routes,
    leaving the route table empty for downstream code to fill. Every file carries
    the HashiCorp copyright header and the SPDX identifier MPL-2.0, marking the whole
    tree as vendored upstream code.'
