  agentLog: 'This context is the single Ember addon component file `third_party/openbao/ui/lib/open-api-explorer/addon/components/swagger-ui.js`
    in the vendored OpenBao UI tree. The component wraps the `swagger-ui-dist` bundle
    to render the OpenBao OpenAPI specification inside the UI: on insert it dynamically
    imports the Swagger UI bundle, builds a configuration object, and calls the bundle
    with that configuration. The configuration points the UI at `/v1/sys/internal/specs/openapi`,
    disables deep linking, expands tags but not operations, sorts operations alphabetically,
    enables extension display so `x-vault-*` options show, and hides models that are
    not defined. Requests made by the UI are intercepted to attach an `X-Vault-Token`
    header from the injected auth service, an `X-Vault-Namespace` header from the
    injected namespace service when the target URL is not one of the namespace root
    URLs, and to prepend `/v1` to spec paths that lack it. A custom search filter
    plugin keeps only operations whose path contains the typed phrase and drops tags
    left with no operations. Two component actions support filtering: `updateFilter`
    reports the input value to the `onFilterChange` callback so the query parameter
    stays sharable, and `proxyEvent` forwards a synthetic `input` event to the React-managed
    Swagger filter input.'
