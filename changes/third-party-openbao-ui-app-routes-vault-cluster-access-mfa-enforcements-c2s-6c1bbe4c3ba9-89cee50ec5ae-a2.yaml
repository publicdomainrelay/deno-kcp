  agentLog: 'Three Ember route classes in the OpenBao UI back the login MFA enforcement
    screens under vault/cluster/access/mfa/enforcements. MfaEnforcementsRoute (index.js)
    serves the list: its model hook queries the mfa-login-enforcement record type
    with an empty query object, catches a 404 rejection and returns an empty array
    instead of rethrowing, and its setupController assigns the resolved model onto
    the controller. MfaLoginEnforcementCreateRoute (create.js) serves the create form:
    its model hook builds and returns a new unsaved mfa-login-enforcement record with
    no store lookup. MfaLoginEnforcementRoute (enforcement.js) serves the detail screen:
    its model hook destructures the name route parameter and calls findRecord(''mfa-login-enforcement'',
    name). All three inject the Ember Data store service and reach the backend only
    through it.'
