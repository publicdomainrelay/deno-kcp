    LeaseCacheConfig; both flow requests as SendRequest values and receive SendResponse
    values that carry an api.Response, a body, and CacheMeta. The package also exposes
    cache maintenance methods — Set, Evict, Flush, Restore, SetPersistentStorage,
    PersistentStorage, SetShuttingDown, RegisterAutoAuthToken — and a cache-clear
    http.Handler from HandleCacheClear.
