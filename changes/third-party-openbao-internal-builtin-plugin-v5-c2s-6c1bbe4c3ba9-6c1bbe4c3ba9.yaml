status:
  agentLog: 'This context covers third_party/openbao/internal/builtin/plugin/v5/backend.go,
    the OpenBao built-in plugin backend shim for plugin protocol v5. The file exports
    a Backend constructor that returns a logical.Backend, and defines the unexported
    backend type that wraps a real logical.Backend and transparently reloads the plugin
    when its RPC connection dies. HandleRequest and HandleExistenceCheck both read
    a canary UUID under a read lock, delegate to the wrapped backend, and on an rpc.ErrShutdown
    or plugin.ErrPluginShutdown error re-acquire the write lock, reload the backend
    against the request storage, generate a fresh canary UUID, and retry the call
    once. InvalidateKey and IsExternal complete the logical.Backend surface, forwarding
    key invalidation and reporting whether the wrapped backend is external. The whole
    file exists to hide plugin process restarts from callers: a shutdown mid-request
    is retried instead of surfaced, and the canary guards against two goroutines reloading
    at the same time.'
