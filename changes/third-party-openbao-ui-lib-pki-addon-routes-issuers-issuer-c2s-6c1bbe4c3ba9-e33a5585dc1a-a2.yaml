status:
  agentLog: 'Five Ember route classes in the vendored OpenBao PKI UI addon back the
    per-issuer screens of the PKI secrets engine: PkiIssuerDetailsRoute (issuer details
    and certificate downloads), PkiIssuerEditRoute (update), PkiIssuerCrossSignRoute
    (cross-sign), PkiIssuerSignRoute (sign intermediate) and PkiIssuerRotateRootRoute
    (rotate root). Each injects the `store` and `secretMountPath` services as class
    fields, implements a `model()` hook that either reuses the parent `issuers.issuer`
    model or queries/creates a PKI record against the current secrets mount path,
    and implements `setupController()` that super-calls the base hook and then assigns
    `controller.breadcrumbs`. Details adds `fetchCertByFormat`, an unauthenticated
    raw GET of `/v1/<mount>/issuer/<id>/<format>` that returns a blob for `der` and
    text otherwise, plus an `isRoot` helper that treats a certificate as self-signed
    root only when it verifies against itself and a key id is present. Rotate root
    parses the old root certificate, joins `parsing_errors` into one `parsingErrors`
    string, builds a new `pki/action` record with `actionType: ''rotate-root''` and
    `type: ''internal''`, and is decorated with `@withConfirmLeave(''model.newRootModel'')`;
    sign carries a bare `@withConfirmLeave()`. The files are HashiCorp MPL-2.0 headed,
    vendored third-party OpenBao sources.'
