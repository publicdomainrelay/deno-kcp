    the help URL `/v1/${backend}/issue/example?help=1`. PkiCertificateSignModel in
    sign.js extends it for the sign path, adding role, csr and removeRootsFromChain.
    Parallel TypeScript declaration files under third_party/openbao/ui/types/vault/models/pki/certificate/
    mirror the same attributes, and the sign model is consumed by the pki-role-generate
    component together with ModelValidations.'
