  agentLog: This context covers third_party/openbao/internal/vault/external_keys/registry.go
    and its test file. The package holds a Registry that stores external KMS configuration
    and key entries in logical storage, opens and caches KMS plugin clients per namespace,
    and hands out kms.Key handles to callers such as the transit and PKI backends.
    ConfigEntry pairs a plugin name with a values map, and KeyEntry pairs key values
    with a grant set of mount paths allowed to use the key. The registry exposes CRUD
    for configs and keys, redacted read variants, paged list operations, per-object
    locking through a callback-driven Modify API, a verify-before-write mode, ref
    parsing of "config/key" strings, namespace cleanup, and shutdown. A nilCheckingKey
    wrapper turns a nil kms.Key into one whose every operation returns an error instead
    of panicking.
