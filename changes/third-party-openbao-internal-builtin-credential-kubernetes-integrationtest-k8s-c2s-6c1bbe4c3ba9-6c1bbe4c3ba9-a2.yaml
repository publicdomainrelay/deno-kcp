    port-forward to the named pod: it builds a POST URL on the pods/portforward subresource,
    obtains a round tripper with spdy.RoundTripperFor, creates a dialer with spdy.NewDialer,
    creates a forwarder with portforward.New using the spec "0:8200" (a random free
    local port mapped to port 8200 in the pod) with a stop channel, ready channel,
    io.Discard for output and os.Stderr for errors, runs ForwardPorts in a goroutine,
    and selects between the error channel (returning "failed to start forwarding")
    and the ready channel. On readiness it reads the assigned port via forwarder.GetPorts
    (failing as "failed to get forwarded ports") and returns that local port along
    with a close function that sends on the stop channel and closes the forwarder.'
