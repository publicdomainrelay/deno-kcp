    running inside a Kubernetes cluster. It exports two helpers. ClientFromKubeConfig(kubeContext)
    builds a *kubernetes.Clientset by first calling the unexported kubeConfig helper,
    which resolves a REST config with clientcmd.NewNonInteractiveDeferredLoadingClientConfig
    over clientcmd.NewDefaultClientConfigLoadingRules and a ConfigOverrides carrying
