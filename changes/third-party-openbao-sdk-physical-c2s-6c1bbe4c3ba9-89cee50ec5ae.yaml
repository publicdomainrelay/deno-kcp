  agentLog: 'This context is the third_party/openbao/sdk/physical package, the storage
    abstraction layer of the vendored OpenBao SDK as consumed by deno-kcp. It defines
    the Backend contract (Put, Get, Delete, List, ListPage over a context and *Entry),
    the Entry record with its Key, Value and SealWrap fields, and Transactional/Transaction
    interfaces for read-only and read-write transactions. Around that base contract
    it provides decorators that wrap any Backend without changing its type: an LRU
    read cache with transactional support, a storage encoding wrapper, an error injector,
    a latency injector, a write notifier with hooks, a prefix-scoped View, and a PhysicalAccess
    helper that adds Purge. It also carries the interfaces used by the HA and replication
    paths (HABackend, FencingHABackend, Lock, RemoteLock, ReplicationIndexBackend,
    CacheInvalidationBackend, RedirectDetect), the PermitPool concurrency limiter,
    the Lister pagination helper, context helpers for cache refresh and unfenced writes,
    and the Exercise* conformance test helpers.'
