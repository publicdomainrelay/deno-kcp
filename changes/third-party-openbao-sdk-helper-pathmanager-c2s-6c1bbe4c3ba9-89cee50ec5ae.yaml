  agentLog: This context is the vendored OpenBao SDK pathmanager package under third_party/openbao/sdk/helper/pathmanager.
    It holds a single PathManager type backed by a radix tree and a read-write mutex,
    built through New, plus methods that add, remove and query allow/deny path prefixes.
    AddPaths and RemovePaths run inside a tree transaction, treat a leading "!" as
    an exception marker, and trim a trailing "*" while preserving any trailing slash,
    so a path that fully names a file stays distinguishable from a directory prefix.
    Readers get Len, Paths, HasPath, HasExactPath and HasPathSegments for counting,
    listing and matching stored paths. A companion test file exercises add, remove,
    prefix removal and the several matching modes.
