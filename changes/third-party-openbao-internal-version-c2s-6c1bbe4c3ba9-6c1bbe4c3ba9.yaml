  agentLog: 'The `third_party/openbao/internal/version` package reports the build
    identity of an OpenBao binary. `version_base.go` declares the identity variables,
    most of which the build sets through ldflags: `GitCommit`, `GitDescribe`, `CommitDate`,
    `VersionMetadata`, and the unexported `fullVersion` whose default is `2.0.0-HEAD`.
    `Version` and `VersionPrerelease` are derived from `fullVersion` at package init
    by trimming whitespace and cutting at the first `-`; a second init step copies
    `BuildDate` into `CommitDate` when `CommitDate` is empty, and `BuildDate` is kept
    only for backwards compatibility. `cgo.go` carries the `cgo` build tag and sets
    `CgoEnabled` to true during init, so the flag is false in non-cgo builds. `version.go`
    defines `VersionInfo`, a plain struct of five strings (Revision, Version, VersionPrerelease,
    VersionMetadata, CommitDate), the constructor `GetVersion`, and the two formatting
    methods `VersionNumber` and `FullVersionNumber`.'
