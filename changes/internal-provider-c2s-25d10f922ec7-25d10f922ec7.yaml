status:
  agentLog: 'internal/provider is the Kubernetes-style controller package for deno-kcp.
    It defines a Provider that runs reconcile loops over deno-kcp custom resources
    (PolicyWorkflowRun, DenoRun, DenoPod, DenoJob, RunTrigger, PolicyEngine, OpenBao,
    PolicyWorkflowPod) through two narrow port interfaces: Reader for reads and Runtime
    for writes. A Registry wires those ports to real clients plus a TokenMinter for
    service-account tokens, and a ClusterPath helper resolves logical cluster identifiers.
    Admission is delegated to an admissionSource that answers Parent, Runs and Capacity
    so the queue library can gate concurrent runs per policy workflow pod. A watch
    driver feeds a cacheReader that serves the Reader methods from an informer cache,
    metrics record reconcile latency and errors, and run_refs exposes active-run gauges.
    The package also carries live integration tests for TTL, max-concurrency, native
    admission, drain and denoruntime behaviour.'
