status:
  agentLog: 'This context is the helper layer of the OpenBao core Ember addon, living
    in third_party/openbao/ui/lib/core/addon/helpers. It is a set of small, single-purpose
    template helpers that the OpenBao web UI registers for use in Handlebars templates:
    changelogUrlFor builds GitHub CHANGELOG anchors, clusterStates maps a replication
    cluster state to a display glyph and ok/syncing flags, dateFormat renders dates
    and epoch seconds with an optional timezone suffix, duration converts a second
    count into a human duration string, formatNumber localizes numbers, messageTypes
    maps an alert type to its message metadata, optionsForBackend computes backend
    UI options, pathOrArray and looseEqual are generic template utilities, sanitizedHtml
    renders sanitized HTML, and IsActiveRoute is a class-based helper. Each file is
    a thin wrapper: the logic is a plain exported function (or class) that is then
    re-exported from lib/core/app/helpers so the host app can consume it. Several
    helpers are consumed by core components such as alert-banner and alert-inline,
    which call messageTypes to validate and resolve their type argument.'
