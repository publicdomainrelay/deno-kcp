  agentLog: This context is the Ember.js routing layer for the OpenBao web UI's identity
    access section, located under third_party/openbao/ui/app/routes/vault/cluster/access/identity.
    Its five route modules — index.js, create.js, edit.js, show.js and merge.js —
    load and mutate the ember-data models for the identity subtypes (entity, group)
    selected by the parent route vault.cluster.access.identity. index.js lists identities
    through a paginated store query with page and pageFilter query params that refresh
    the model; create.js and edit.js build a new or fetched record and guard navigation
    away from dirty records with a confirm dialog; show.js validates the requested
    section against the tab set for the item type, throws a 404 AdapterError on an
    unknown section, and redirects internal group aliases to the details tab; merge.js
    is restricted to the entity type and redirects elsewhere so that only entity-merge
    records can be created. Each route also resets its controller (clearing the filter
    or calling cleanupModel) when the route is exited.
