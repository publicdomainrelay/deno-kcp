status:
  agentLog: 'This context is the OpenBao SDK test helper package `third_party/openbao/sdk/helper/testhelpers/schema`,
    which gives backend tests a way to check that a logical response actually matches
    the response schema declared on a framework path. Five exported functions make
    up the surface: ValidateResponse and ValidateResponseData assert that response
    data conforms to a framework.Response schema, with a strict flag controlling whether
    extra fields are tolerated; FindResponseSchema and GetResponseSchema pull the
    declared response schema out of a framework.Path and logical.Operation, trying
    status codes 200, 202 and 204 in order; and ResponseValidatingCallback wraps all
    of that into a callback usable in place of a normal backend operation handler.
    All helper functions are marked with t.Helper() and abort the test with t.Fatalf
    when the schema is missing or the data fails validation. The unexported validateResponseDataImpl
    holds the real comparison logic and skips validation for non-2xx statuses and
    reserved logical response fields.'
