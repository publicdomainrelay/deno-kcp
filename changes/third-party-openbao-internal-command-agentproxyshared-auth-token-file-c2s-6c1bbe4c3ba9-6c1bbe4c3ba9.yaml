  agentLog: The token-file auth method is one of the agent's auth backends in the
    vendored OpenBao tree. It reads a Vault/OpenBao token from a file on disk and
    presents it to the server's `auth/token/lookup-self` endpoint, caching the last
    non-empty token it read so a transient read failure or an empty file does not
    immediately break the running agent. The constructor validates the plugin configuration
    and errors out on anything malformed; the credential-watching and shutdown hooks
    are deliberate no-ops because a static token file needs no renewal loop.
