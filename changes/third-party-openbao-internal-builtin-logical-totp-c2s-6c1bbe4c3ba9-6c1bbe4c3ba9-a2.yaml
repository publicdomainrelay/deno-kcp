  agentLog: 'This context covers the vendored TOTP logical (secrets) engine inside
    third_party/openbao, made of four files: backend.go, path_keys.go, path_code.go,
    and backend_test.go. backend.go carries the plugin entry points, where Factory
    builds a *backend from the supplied logical.BackendConfig, calls Setup on it,
    and returns the configured logical.Backend or the setup error with a nil backend.
    Backend() constructs that *backend and installs a framework.Backend that trims
    the backend help text, declares "key/" as seal-wrapped storage, registers the
    path list containing pathListKeys, pathKeys, and pathCode, sets the backend type
    to logical.TypeLogical, and creates the usedCodes zero-capacity cache with a thirty-second
    eviction. path_keys.go holds the key storage contract plus the key list, read,
    write, and delete handlers, while path_code.go holds the code generation and validation
    handlers that consume stored keys. The exported observable surface is small: Factory,
    Backend, and the backend.Key storage lookup, which reads "key/" plus the caller-supplied
    name from logical storage, returns nil with a nil error when nothing is stored
    there, propagates a storage read error, and otherwise decodes the stored JSON
    into a keyEntry.'
