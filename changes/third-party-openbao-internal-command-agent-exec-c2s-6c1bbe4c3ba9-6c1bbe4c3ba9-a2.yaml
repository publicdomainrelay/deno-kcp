  agentLog: This context covers the OpenBao agent exec package in third_party/openbao/internal/command/agent/exec/exec.go,
    the component that renders agent environment templates and supervises a child
    process with the rendered variables injected. ServerConfig carries the agent config,
    logger, namespace, log level and log writer; NewServer builds a Server in the
    childProcessStateNotStarted state with an unbuffered childProcessExitCh. Server.Run
    builds a consul-template manager in dry mode over AgentConfig.EnvTemplates, watches
    TemplateRenderedCh, debounces renders by 2 seconds, and calls the unexported restartChildProcess
    when the sorted NAME=value environment set changes; it also merges new Vault tokens
    arriving on incomingVaultToken, handles runner errors with optional exit-on-retry-failure,
    stops the child on context cancellation, and returns a *ProcessExitError when
    the child exits on its own. The companion test file exec_test.go exercises Run
    by building a test app binary and driving the server with template configs.
