  agentLog: third_party/openbao/sdk/helper/consts is a leaf package of shared constants
    and small value types used across the OpenBao SDK and server. It defines the enumerated
    types PluginType, DeprecationStatus, ReplicationState and HAState, all backed
    by uint32, together with their string and parse helpers. DeprecationStatus.String
    maps the known statuses to the lowercase names "supported", "deprecated", "pending
    removal" and "removed" and returns an empty string otherwise; PluginType.String
    and ParsePluginType round-trip a plugin kind between enum and wire string; ReplicationState
    is a bitmask with HasState, AddState, ClearState and ToggleState plus GetDRString,
    GetPerformanceString, IsPrimaryState and StateStrings renderers that map flags
    to hyphenated tags. Separate files hold agent, error, JWT, proxy and token constants.
    Nothing here performs I/O or holds mutable state beyond process-wide constant
    values.
