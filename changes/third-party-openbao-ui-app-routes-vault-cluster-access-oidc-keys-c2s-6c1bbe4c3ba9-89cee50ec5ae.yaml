  agentLog: Three Ember route modules under third_party/openbao/ui/app/routes/vault/cluster/access/oidc/keys
    form the routing layer for the OIDC key management screens in the OpenBao UI.
    index.js declares OidcKeysRoute, whose model hook queries the Ember Data store
    for every record of type 'oidc/key' with an empty options object, converting an
    HTTP 404 response into an empty array and rethrowing any other error so the list
    route renders an empty state instead of failing. create.js declares OidcKeysCreateRoute,
    whose model hook calls store.createRecord('oidc/key') to hand the form an unsaved
    new key. key.js declares OidcKeyRoute, whose model hook destructures the name
    parameter out of the route params and resolves that single record with store.findRecord('oidc/key',
    name). Each route injects the Ember Data store service and extends @ember/routing/route
    with no other behavior, so all three are thin data-loading adapters between the
    router and the oidc/key model.
