  agentLog: Package credsutil holds the shared credential-generation helpers used
    by the builtin database engines in the OpenBao SDK. It declares the CredentialsProducer
    interface (GenerateCredentials, GenerateUsername, GeneratePassword, GenerateExpiration)
    that a database plugin embeds to produce user information, plus a generic SQLCredentialsProducer
    implementation configured by exported fields DisplayNameLen, RoleNameLen, UsernameLen,
    Separator and LowercaseUsername. Password material comes from RandomAlphaNumeric,
    which draws base62 randomness and enforces a ten-character minimum, optionally
    prepending the literal `A1a-` so generated passwords always satisfy mixed-case
    and symbol requirements. Usernames are built by GenerateUsername from a variadic
    list of UsernameOpt closures (DisplayName, RoleName, Separator, MaxLength, Case,
    ToLower, ToUpper) applied over a builder whose defaults are the `_` separator,
    a 100-character maximum and KeepCase, joining the version marker `v`, the display
    name, the role name, a random user UUID and the current Unix timestamp, then truncating
    and applying the requested case operation. Expirations are formatted as `2006-01-02
    15:04:05-0700`. Companion test files credsutil_test.go and usernames_test.go cover
    the producer and the username builder.
