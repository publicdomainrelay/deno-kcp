status:
  agentLog: 'This context is the vendored OpenBao SDK helper package third_party/openbao/sdk/helper/pluginutil.
    It holds the plumbing that OpenBao uses to talk to external plugins: environment-variable
    gates for mlock and metadata mode (env.go), gRPC multiplexing negotiation and
    the PluginMultiplexingServerImpl that answers it (multiplexing.go plus generated
    multiplexing.pb.go and multiplexing_grpc.pb.go), the functional-option run configuration
    that builds a go-plugin client (run_config.go), and the runner.go interfaces and
    PluginRunner type that a host implements to launch, look up, and reload plugins.
    env.go reads Bao variables through api.ReadBaoVariable, so OptionallyEnableMlock
    locks memory only when PluginMlockEnabled reads "true" and InMetadataMode reports
    true only when PluginMetadataModeEnv reads "true". multiplexing.go returns a Supported
    flag from the server implementation, lets a plugin name opt out through PluginMultiplexingOptOut,
    treats an Unimplemented gRPC status or a nil response as "not multiplexed", and
    rejects a nil client connection with an error. run_config.go exposes RunOpt aliases
    for Env, Runner, PluginSets, HandshakeConfig, Logger, MetadataMode, AutoMTLS and
    MLock, and PluginRunner.RunConfig folds them onto the PluginClientConfig it hands
    to RunnerUtil.NewPluginClient. runner.go declares the Looker, RunnerUtil, LookRunnerUtil,
    PluginClient and PluginRunner surface, plus VersionedPlugin and the CtxCancelIfCanceled
    helper. Test files multiplexing_test.go and run_config_test.go pin the negotiation
    and option behaviour, and tls.go carries the TLS helper for plugin transport.'
