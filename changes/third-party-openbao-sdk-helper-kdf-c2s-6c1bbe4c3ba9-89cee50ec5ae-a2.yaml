status:
  agentLog: 'The kdf package under third_party/openbao/sdk/helper/kdf holds the vendored
    OpenBao SDK key-derivation helper. It defines PRF, a function type mapping a key
    and an input block to key material, and two functions built on it: CounterMode,
    a NIST SP 800-108 style counter-mode KDF that expands a key plus context into
    an arbitrary number of bits by iterating a big-endian uint32 counter in the first
    four bytes of each PRF input block and repeating the requested bit count in the
    last four, and HMACSHA256PRF, a PRF implemented with HMAC-SHA256. All logic lives
    in kdf.go; kdf_test.go pins CounterMode against a Python-generated 256-bit vector
    and checks output length and key non-containment, and pins HMACSHA256PRF against
    a Python-generated digest.'
