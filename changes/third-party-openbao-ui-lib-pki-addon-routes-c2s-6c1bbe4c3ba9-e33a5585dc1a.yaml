  agentLog: 'This context covers the Ember route layer of the OpenBao (Vault fork)
    PKI UI addon, vendored under third_party/openbao/ui/lib/pki/addon/routes. Six
    route modules make up the layer: application.js defines the engine-level PkiRoute
    with pathHelp and secretMountPath properties and a beforeModel hook; index.js
    defines a redirecting PkiRoute bound to the ''host-router'' property; overview.js
    defines PkiOverviewRoute plus the exported getCliMessage helper; configuration.js
    defines PkiConfigurationRoute, which pulls the store service and builds a model;
    tidy.js defines PkiTidyRoute, whose model hook hashes hasConfig, the engine model
    and a ''pki/tidy'' record lookup; error.js defines PkiRolesErrorRoute, which seeds
    controller breadcrumbs, tabs and title from the current secret mount path. The
    routes share the secretMountPath service, the store service, and the check-config
    decorator''s shouldPromptConfig flag to decide whether the PKI engine needs configuration
    before rendering. They are UI-facing only and contain no command entrypoint, so
    no flag or environment surface is defined here.'
