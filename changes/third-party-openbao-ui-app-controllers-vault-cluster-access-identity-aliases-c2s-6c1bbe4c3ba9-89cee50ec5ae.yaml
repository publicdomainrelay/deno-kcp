  agentLog: 'Three Ember.js controllers for the OpenBao UI that back the identity-alias
    pages under a cluster''s access view. add.js extends the shared identity create
    controller and overrides showRoute to ''vault.cluster.access.identity.aliases.show''
    so a successful create navigates to the alias detail route. edit.js extends the
    add controller unchanged, inheriting the same create and show behavior for the
    edit form. index.js is the alias list controller: it declares the page and pageFilter
    query params, holds filter, filterFocused and isLoading state, computes filterMatchesKey
    and firstPartialMatch for filter/autocomplete behavior using escape-string-regexp
    and core/utils/common-prefix, and exposes setFilter, setFilterFocus, refresh and
    onDelete actions that bubble a ''reload'' to the list route.'
