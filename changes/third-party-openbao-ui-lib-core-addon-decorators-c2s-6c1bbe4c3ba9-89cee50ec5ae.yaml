  agentLog: 'This context covers a single Ember.js decorator module at third_party/openbao/ui/lib/core/addon/decorators/confirm-leave.js
    that guards against losing unsaved form changes when a user navigates away from
    a route. The exported factory `withConfirmLeave(modelPath = ''model'', silentCleanupPaths)`
    returns an inner `decorator(SuperClass)` function which verifies that the target
    class inherits from Ember''s `Route`; when it does not, the decorator logs an
    error and returns the original class unchanged, so misuse degrades to a no-op
    instead of breaking the route. When the check passes it returns an anonymous `ConfirmLeave`
    subclass of the decorated route. That subclass injects the `store` service, defines
    `_rollbackModel(modelPath)` to fetch the model off the controller and call `unloadRecord`
    for new records or `rollbackAttributes` otherwise, but only when the model has
    dirty attributes and is not currently saving. It overrides the `@action`-decorated
    `willTransition(transition)` hook: it calls the superclass hook inside a try/catch
    so a missing parent implementation does not throw, inspects the model at `modelPath`,
    and when that model is dirty and not saving it either rolls the model back (when
    `Ember.testing` is true or the user confirms the ''You have unsaved changes...''
    prompt) or aborts the transition and returns false. After that it walks the optional
    `silentCleanupPaths` list and rolls back each named model without prompting, then
    returns true to let navigation proceed.'
