  agentLog: 'This context covers the vendored OpenBao identity helper package at third_party/openbao/internal/helper/identity,
    made of three Go files. identity.go holds hand-written helpers on the generated
    protobuf types: Clone methods that deep-copy Group, Entity and Alias through proto.Marshal/proto.Unmarshal
    round-trips, Entity.UpsertAlias for inserting or replacing an alias by ID, and
    ToSDKAlias, ToSDKEntity, ToSDKGroup and ToSDKGroups which project the internal
    types onto the logical SDK types. sentinel.go implements the sentinel interface
    for Entity, Alias and Group, exposing SentinelGet and SentinelKeys so policy code
    can read fields by key. types.pb.go is the generated protobuf layer: the Group,
    LocalAliases, Entity, Alias, EntityStorageEntry and PersonaIndexEntry messages,
    each with Reset, String, ProtoMessage, ProtoReflect, Descriptor and generated
    field getters. Together the package is the data model that OpenBao''s identity
    store persists and hands to the logical layer, so the code here decides what an
    entity, alias, group and their storage-side indexing records look like.'
