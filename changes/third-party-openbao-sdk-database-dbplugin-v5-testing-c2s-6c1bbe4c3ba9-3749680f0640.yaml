  agentLog: 'This context is the Go package third_party/openbao/sdk/database/dbplugin/v5/testing,
    whose single file test_helpers.go gives database plugin tests a shared set of
    assertion helpers. Six exported functions wrap the dbplugin.Database interface:
    AssertInitializeCircleCiTest retries initialization up to five times with a one
    second sleep, AssertInitialize performs a single initialization and stops the
    test on error, AssertNewUser creates a user and demands a non-empty username in
    the response, AssertUpdateUser and AssertDeleteUser call UpdateUser and DeleteUser
    and stop the test on error, and AssertClose covers closing the plugin. All user-facing
    helpers run under a context deadline taken from getRequestTimeout, which reads
    BAO_TEST_DATABASE_REQUEST_TIMEOUT and falls back to ten seconds, failing the test
    when a supplied duration does not parse. Every helper marks itself with t.Helper
    so failures point at the calling test.'
