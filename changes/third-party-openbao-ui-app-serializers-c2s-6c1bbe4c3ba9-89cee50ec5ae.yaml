  agentLog: 'This context holds the Ember Data serializer layer of the bundled OpenBao
    web UI, living under third_party/openbao/ui/app/serializers. It is a directory
    of 26 JavaScript modules, one per API model the UI talks to (auth methods, secrets
    engines, namespaces, leases, licenses, replication, MFA, roles, policies, transit
    keys, and others), plus an application.js base serializer they share. Only three
    of the modules carry structural detail in the observed facts: MfaLoginEnforcementSerializer,
    the MFA KeymgmtKeySerializer in mfa-method.js, and NamespaceSerializer. Each serializer
    adapts the raw JSON the OpenBao HTTP API returns into the shape Ember Data expects,
    mostly by overriding normalizeItems, normalizeList, normalizeResponse and serialize.
    The namespace serializer is the clearest example: it turns a keys list into records
    with a trailing slash stripped from the id, and special-cases deleteRecord and
    createRecord, which return no body.'
