  agentLog: 'This context covers five Ember Data adapters under third_party/openbao/ui/app/adapters/oidc/
    that bind OpenBao''s OIDC identity API to UI models: assignment.js, client.js,
    key.js, provider.js and scope.js. Every adapter is a default-exported class extending
    NamedPathAdapter from third_party/openbao/ui/app/adapters/named-path.js, and each
    overrides pathForType() to name the API path it serves. Four of the five (assignment,
    client, provider, scope) contain only that single override; OidcKeyAdapter adds
    a second method, rotate(name, verification_ttl). The adapters carry no persistence
    logic of their own — they inherit CRUD from NamedPathAdapter and contribute only
    the path segment, which makes them the adapter layer for the OpenBao OIDC provider,
    client, scope, assignment and key resources.'
