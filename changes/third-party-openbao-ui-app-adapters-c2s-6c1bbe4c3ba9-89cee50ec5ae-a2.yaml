status:
  agentLog: 'This context covers the Ember Data adapter layer of the OpenBao web UI,
    under third_party/openbao/ui/app/adapters. Thirty adapter modules sit there, each
    one translating an Ember model type into the HTTP calls the OpenBao server exposes:
    namespaces, MFA methods and TOTP setup, named paths, auth methods, secret engines
    and secrets, leases, policies, roles, transit keys, SSH and AWS credentials, and
    cluster or node operations. Most extend ApplicationAdapter from application.js,
    which supplies urlPrefix, buildURL and the ajax helper every adapter uses. Five
    classes are described here in detail: NamespaceAdapter, MfaSetupAdapter, MfaMethodAdapter,
    NamedPathAdapter, and the KeymgmtKeyAdapter that lives in mfa-login-enforcement.js.
    Together they show the three shapes the layer uses: plain REST adapters that pick
    a URL per operation, custom adapters that issue direct v1 ajax calls for MFA setup,
    and named-path adapters that save by unique name through POST rather than by generated
    id.'
