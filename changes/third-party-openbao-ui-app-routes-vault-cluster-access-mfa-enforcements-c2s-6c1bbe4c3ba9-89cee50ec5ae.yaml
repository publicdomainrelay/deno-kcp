  agentLog: 'This context covers three Ember route classes in the OpenBao UI that
    back the login MFA enforcement screens under `vault/cluster/access/mfa/enforcements`:
    the index route lists all enforcements, the create route builds an unsaved record
    for the create form, and the dynamic enforcement route loads a single enforcement
