  agentLog: The Docker stepwise environment provider inside the vendored OpenBao SDK,
    made of two files under third_party/openbao/sdk/helper/stepwise/environments/docker.
    environment.go defines DockerCluster, its per-node dockerClusterNode type, the
    DockerClusterOptions configuration struct, NewEnvironment, and the internal setupCA
