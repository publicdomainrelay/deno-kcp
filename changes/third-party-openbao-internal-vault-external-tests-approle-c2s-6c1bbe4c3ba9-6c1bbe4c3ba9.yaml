    create a role `test-role-1` and issue a secret-id. The wrapped variant forces
    response wrapping to `5m` via `client.SetWrappingLookupFunc`, then unwraps the
    wrapping token and requires `WrapInfo.WrappedAccessor` to equal the unwrapped
    `secret_id_accessor`. The non-wrapped variant restores `api.DefaultWrappingLookupFunc`
    and requires `WrapInfo.WrappedAccessor` to be empty. Both wrapped-secretid tests
    configure `CoreConfig` with `DisableCache: true` and a null logger.'
