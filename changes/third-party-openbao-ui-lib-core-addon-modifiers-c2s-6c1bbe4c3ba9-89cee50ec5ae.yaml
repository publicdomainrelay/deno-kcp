  agentLog: 'This context is the vendored OpenBao UI Ember modifier `CodeMirrorModifier`,
    defined in third_party/openbao/ui/lib/core/addon/modifiers/code-mirror.js. It
    is an `ember-modifier` Modifier subclass that turns an element into a CodeMirror
    editor instance and keeps that editor in sync with the named arguments passed
    to the modifier. On first invocation it builds the editor through `_setup`, which
    raises an error when no element is supplied, merges caller named arguments with
    defaults (gutters, matchBrackets, lint-on-change, cursor/active-line styling,
    tabSize 2, mode application/json, theme hashi, empty value and viewportMargin),
    and registers `change` and `focus` listeners bound to `_onChange` and `_onFocus`.
    Later invocations reuse the existing editor: they always reapply `readOnly`, and
    replace the editor value only when `content` is truthy and differs from the current
    value. `_onChange` compares the editor value against `named.content` to suppress
    the change event fired by programmatic value setting, otherwise calling `named.onUpdate(value,
    editor)`; `_onFocus` calls `named.onFocus(value)`. The file also imports the codemirror
    addons and the ruby and javascript modes it depends on.'
