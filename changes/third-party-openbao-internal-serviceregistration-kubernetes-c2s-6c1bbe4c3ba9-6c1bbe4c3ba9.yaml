  agentLog: 'This context is the Kubernetes backend of OpenBao''s service registration
    package, under third_party/openbao/internal/serviceregistration/kubernetes. NewServiceRegistration
    builds a serviceRegistration from a config map, an hclog logger and an sr.State:
    it reads the required namespace and pod name fields, builds a Kubernetes client,
    sanitizes the Vault version so special characters such as "+" are acceptable to
    the Kubernetes API, and wires a retryHandler that carries the initial state, an
    empty patchesToRetry map and the client. The serviceRegistration exposes Run plus
    four notify methods (active, sealed, performance standby, initialized) that each
    turn a boolean into a client.Patch with a Replace operation on a label path and
    hand it to retryHandler.Notify. The retryHandler owns the retry loop: Notify records
    a patch in patchesToRetry when no initial state has been set yet or when PatchPod
    fails, and Run sets the initial state and then starts a run.Group that watches
    the shutdown channel and runs periodicUpdateState until shutdown, at which point
    it shuts the client down. Two test files cover the retry handler (simple, add,
    races and deadlocks, API connectivity problems for initial state and for notifications)
    and the service registration itself.'
