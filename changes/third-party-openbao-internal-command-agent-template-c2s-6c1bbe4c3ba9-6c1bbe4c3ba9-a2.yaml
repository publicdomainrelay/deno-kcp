  phase: Succeeded
  agentLog: The template package under third_party/openbao/internal/command/agent/template
    renders user-supplied templates to disk by driving an internal OpenBao (Consul)
    Template Runner. ServerConfig carries the agent config, namespace, exit-after-auth
    flag, min/max backoff durations, log level and log writer, plus the logger. ServerConfig
    feeds NewServer, which allocates a Server with a DoneCh channel, atomic stopped
    and runnerStarted flags, and copies the backoff, logger, config pointer and exitAfterAuth
    values. Server.Run validates the incoming token channel, defaults the backoff
    bounds and rejects a min greater than the max, builds a runner config through
    ctmanager and a manager.Runner, records the runner's template ID mapping in lookupMap,
    then loops on context cancellation, new tokens, runner errors and render events,
    applying an exponential backoff (or a stop backoff when ExitOnRetryFailure is
    set) and returning once every template has rendered when exit_after_auth is true.
    Server.Stop closes DoneCh exactly once.
