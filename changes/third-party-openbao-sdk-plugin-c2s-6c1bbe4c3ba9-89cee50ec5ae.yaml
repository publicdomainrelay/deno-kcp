  agentLog: 'This context is the vendored OpenBao (Vault fork) Go SDK `sdk/plugin`
    package, copied into `third_party/openbao/sdk/plugin`. It implements the go-plugin
    wiring that lets a logical secrets backend run out-of-process: `GRPCBackendPlugin`
    serves a backend factory over gRPC (`backendGRPCPluginServer`) and dispenses it
    on the client side (`backendGRPCPluginClient`), with companion gRPC transports
    for logical storage (`GRPCStorageClient`/`GRPCStorageServer`, transactional and
    NOOP variants), for the system view (`gRPCSystemViewClient`/`gRPCSystemViewServer`),
    and for logging (`LoggerServer`). Entry points `NewBackend`, `NewBackendWithVersion`,
    `NewBackendV5`, `NewPluginClient`, `NewPluginClientV5` and `Dispense` build the
    client-side backend handle, while `Serve` and `ServeMultiplex` run the plugin''s
    main process. `BackendTracingMiddleware` wraps a backend to attach tracing spans,
    and `plugin_v5.go` adds a `ContextKey` used to suppress cleanup on plugin reload.'
