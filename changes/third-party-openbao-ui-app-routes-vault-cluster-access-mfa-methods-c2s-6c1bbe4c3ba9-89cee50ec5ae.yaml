  agentLog: 'This context covers the Ember.js route layer for the OpenBao web UI''s
    MFA methods screens, at third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/.
    Three route classes implement the list, detail, and create pages. MfaMethodsRoute
    (index.js) queries the ''mfa-method'' store for all methods, returns an empty
    array on an HTTP 404 instead of failing, redirects to vault.cluster.access.mfa
    when the list is empty, and hands the model to its controller. MfaMethodRoute
    (method.js) takes the route''s id parameter and resolves a hash of two promises:
    the method record found by id, and the ''mfa-login-enforcement'' collection filtered
    down to those enforcements whose mfa_methods relationship ids include the given
    method id, with query failures swallowed. MfaLoginEnforcementCreateRoute (create.js)
    drives the create form by calling the controller''s createModels() when a type
    query parameter is already selected, and clears the type parameter on controlled
    exit so a save or cancel resets the form while a page refresh keeps it.'
