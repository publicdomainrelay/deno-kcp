status:
  agentLog: The osutil package under third_party/openbao/internal/helper/osutil is
    a small portability helper for checking file ownership and permission safety.
    fileinfo.go holds the platform-independent predicates IsWriteGroup and IsWriteOther
    (bit tests against os.FileMode), FilePermissionsMatch, which either demands an
    exact permission match or, when the requested permission is 0, rejects modes that
    grant write to group or others, OwnerPermissionsMatch and OwnerPermissionsMatchFile,
    which apply the same check to a path or to an already-opened *os.File, and FileSha256Sum,
    which returns the hex SHA-256 digest of a file's contents. fileinfo_unix.go adds
    the POSIX-only helpers FileUIDEqual, FileGIDEqual and FileUidMatch, which read
    uid and gid out of syscall.Stat_t, plus Umask, which installs a new process umask
    and returns the previous one. fileinfo_windows.go provides the non-POSIX counterpart
    so the package still builds, and the two _test.go files exercise the unix and
    common paths.
