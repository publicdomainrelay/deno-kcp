  phase: Succeeded
  agentLog: 'This context holds the two Ember Data serializers for the OpenBao key-management
    UI, vendored under third_party/openbao/ui/app/serializers/keymgmt. KeymgmtKeySerializer
    in key.js overrides normalizeItems: when the payload is versioned it converts
    the versions object, keyed by version number, into an array of version records
    whose id is the version number parsed as a base-10 integer spread together with
    that version''s own fields, sets created to the creation_time of the first version
    in key order, sets last_rotated to the creation_time of the last version in key
    order, and returns the annotated payload; when the payload is instead an array
    it maps each entry down to id and name both taken from the entry''s id plus the
    backend taken from the parent payload; anything else is returned unchanged. KeymgmtProviderSerializer
    in provider.js declares primaryKey = ''name'', overrides normalizeItems to stamp
    id = name and backend = payload.backend onto every provider of an array payload
    and to pass non-array payloads through, and overrides serialize to call the superclass
    serializer with the original arguments and merge the record''s unsaved credentials
    into the resulting JSON.'
