    live in fields.go, cryptographic helpers in util.go, and persistence in storage.go
    plus storage_migrations.go. The backend is constructed by Backend and wrapped
    by Factory, which the plugin catalog calls to obtain a logical.Backend. Salt and
    salted-OTP generation support the OTP credential flow, and ImportIssuer writes
