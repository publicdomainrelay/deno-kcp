  agentLog: 'This context is the vendored OpenBao SDK logical package inside deno-kcp,
    at third_party/openbao/sdk/logical. It supplies the request/response, path, storage,
    lease, token, auth, identity, secret, plugin and audit contract types that an
    OpenBao plugin backend compiles against, plus generated protobuf code for identity,
    plugin and version messages and the version gRPC service. The audit slice exposes
    LogInput for audit backend logging, MarshalOptions carrying a ValueHasher, and
    the OptMarshaler interface that lets a type control JSON marshalling so secret
    values get hashed. The auth slice contributes PolicyResults describing whether
    a request was allowed, which policies granted it, and any control group. Around
    these sit the operative helpers: path and operation validation, request renewal
    and revocation context, response construction and error translation, transactional
    storage on logical storage, key listing with prefixes, storage views, and an in-memory
    storage plus testing helpers used by backend tests.'
