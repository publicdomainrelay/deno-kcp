  agentLog: The package third_party/openbao/sdk/physical/inmem implements physical.Backend
    in memory. InmemBackend holds a mutex-guarded map and delegates every exported
    operation to a paired Internal method (PutInternal, GetInternal, DeleteInternal,
    ListInternal, ListPaginatedInternal) so callers can bypass the FailPut, FailGet,
    FailDelete and FailList switches. ListPage reads from the same map, sorting keys
    under a prefix, skipping keys at or before the after cursor and cutting at limit.
    TransactionalInmemBackend wraps that backend and hands out InmemBackendTransaction
    values from BeginTx and BeginReadOnlyTx; the transaction keeps a dirty overlay
    of staged InmemOp records, serves Get, List and ListPage from the overlay first,
    and only writes through to the parent map in Commit, while Rollback discards the
    overlay. OpName renders each InmemOp constant as a lowercase name. The HA layer
    adds InmemHABackend, which embeds the data backend and keeps a map of InmemLock
    values keyed by lock name; LockWith registers a lock, HookInvalidate records a
    physical.InvalidateFunc, LockMapSize reports map size and HAEnabled reports true,
    and Put and Delete notify the invalidate hook.
