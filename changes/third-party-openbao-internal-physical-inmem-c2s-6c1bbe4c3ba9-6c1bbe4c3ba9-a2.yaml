  agentLog: 'This context is the in-memory physical storage backend vendored at third_party/openbao/internal/physical/inmem.
    InmemBackend keeps physical entries in a map behind an RWMutex and serves Put,
    Get, Delete, List and ListPage, with per-operation failure switches FailPut, FailGet,
    FailDelete and FailList for deterministic error-path tests. NewDirectInmem returns
    a plain InmemBackend; NewInmem returns a TransactionalInmemBackend whose BeginTx
    and BeginReadOnlyTx produce InmemBackendTransaction values that stage operations
    until Commit applies them or Rollback discards them. OpName and InmemOp name traced
    operations. inmem_ha.go adds the HA layer: InmemHABackend embeds InmemBackend,
    holds a shared lock map, and exposes LockWith, HookInvalidate, LockMapSize and
    HAEnabled, handing out InmemLock values whose Lock blocks until acquisition or
    stopCh close, whose Unlock removes the lock from the map, and whose Value reports
    the holder state. Put and Delete on the HA backend delegate to the embedded store
    and then fire the invalidation hook.'
