  agentLog: 'This context is the vendored OpenBao SDK mock plugin under third_party/openbao/sdk/plugin/mock/.
    It provides a complete but trivial logical backend that exists so plugin-host
    code and the plugin RPC transport can be tested end to end: backend.go builds
    a framework.Backend whose path table is assembled from errorPaths, kvPaths, pathInternal,
