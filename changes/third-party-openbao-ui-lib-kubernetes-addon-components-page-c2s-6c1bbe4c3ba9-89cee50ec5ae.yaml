status:
  agentLog: 'This context covers four Ember page components of the OpenBao (Vault-derived)
    UI Kubernetes secrets-engine addon: ConfigurePageComponent, CredentialsPageComponent,
    OverviewPageComponent and RolesPageComponent, each in its own file under third_party/openbao/ui/lib/kubernetes/addon/components/page/.
    ConfigurePageComponent owns the engine configuration form: it seeds inferredState
    from the config model, gates the save button through an isDisabled getter, re-infers
    the config state through a store adapter task, and runs a confirm-then-validate-then-save
    task that leaves the route on success. OverviewPageComponent builds a role option
    list from the roles argument, tracks the selected role, and transitions the host
    router to the credentials route for that role. CredentialsPageComponent holds
    the credential request form state (ttl, cluster role binding, kubernetes namespace,
    credentials and error) with actions for namespace input, ttl updates, fetch and
    cancel, plus a leaseExpiry getter. RolesPageComponent exposes the owner mount
    point and deletes a role record, splicing it out of the roles argument and reporting
    success or failure through the flash messages service. All four are routable page
    components that receive their data through args and drive navigation through the
    injected ''host-router'' service.'
