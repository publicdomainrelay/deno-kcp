  agentLog: 'This context is the Kubernetes engine''s Ember route decorator module,
    third_party/openbao/ui/lib/kubernetes/addon/decorators/fetch-config.js. It exports
    withConfig(), a decorator factory that returns a decorator(SuperClass) closure.
    The closure guards on the Route prototype: when the target is not an Ember Route
    subclass it logs an error through console.error and returns the SuperClass unchanged,
    so the decorator silently no-ops instead of breaking the class hierarchy. On a
    valid Route it returns a FetchConfig subclass that carries three class fields
    — configModel, configError, and promptConfig, initialized to null, null, and false
    — and overrides the async beforeModel hook. That hook first calls super.beforeModel
    with the forwarded arguments, reads the backend name from this.secretMountPath.get(),
    and then tries the store cache with this.store.peekRecord(''kubernetes/config'',
    backend). When a cached record exists it clears promptConfig and stops. When no
    record is cached it falls through to this.store.queryRecord(''kubernetes/config'',
    { backend }), storing the resolved record into configModel and setting promptConfig
    to false. The rejection path inspects error.httpStatus: a 404 is treated as ''not
    configured'' and sets promptConfig to true to drive the configuration call to
    action, while any other status is stored on configError rather than treated as
    a 404. Non-404 failures are deliberately swallowed so a missing permission or
    a transient failure does not block the route''s other model hooks; the stored
    error is surfaced later by the configuration route''s view.'
