status:
  agentLog: This context is the OpenBao internal helper package `storagepacker`. It
    packs many small items into a small fixed number of storage buckets so that a
    storage backend sees few large entries instead of many small ones. StoragePacker
    holds a logical.Storage view, an hclog logger, a per-key lock slice and a view
    prefix. Items are assigned to a bucket by hashing the item ID with MD5 and using
    the first hash byte as the bucket index, so bucket keys are `viewPrefix + decimal(index)`.
    Reads decompress and protobuf-unmarshal the bucket, writes lock the bucket, decompress,
    mutate and write back. types.pb.go holds the generated protobuf Item and Bucket
    messages, where Bucket carries a key, a repeated Item list and an ID to Any map.
