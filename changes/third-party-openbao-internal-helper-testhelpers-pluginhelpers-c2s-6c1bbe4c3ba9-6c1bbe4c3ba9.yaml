status:
  agentLog: This context is the OpenBao Go test-helper package `pluginhelpers`, contained
    in one file, `third_party/openbao/internal/helper/testhelpers/pluginhelpers/pluginhelpers.go`.
    It provides the machinery that OpenBao tests use to obtain a real, compiled plugin
    binary. `GetPlugin` maps a `consts.PluginType` onto the concrete builtin plugin
    that stands in for that type (approle for credential, kv for secrets, postgresql
    for database) and returns the plugin's name, short type, main-package path and
    the Go import path of its self-reported version variable. `CompilePlugin` calls
    `GetPlugin`, walks the working directory upward until it finds the `builtin` directory,
    builds the main package with `go build -o`, optionally injecting the version through
    `-ldflags -X`, caches the resulting bytes in a package-level map under a mutex
    so a given name/type/version triple is compiled only once, writes the binary to
    disk with mode 0o755 if it is absent, and returns a `TestPlugin` value carrying
    the name, type, version, file name and lowercase hex SHA-256 of the binary. The
    `TestPlugin` struct is the result record consumed by the core and external plugin
    tests.
