  agentLog: 'This context is the Ember.js routing layer for the OpenBao web UI that
    configures an enabled auth method. It holds two route files under third_party/openbao/ui/app/routes/vault/cluster/settings/auth/configure:
    index.js, a redirect route that sends the user to the first configuration tab
    of the selected auth backend, and section.js, which loads the tab-specific auth-config
