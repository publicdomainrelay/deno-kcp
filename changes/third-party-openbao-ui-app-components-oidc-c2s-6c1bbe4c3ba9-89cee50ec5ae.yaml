  agentLog: 'This context covers the five Ember Glimmer component classes under third_party/openbao/ui/app/components/oidc
    that back the OpenBao OIDC administration forms: OidcAssignmentFormComponent,
    OidcClientForm, OidcKeyForm, OidcProviderForm and OidcScopeFormComponent. Each
    is a form component driven by an injected model argument plus onSave and onCancel
    callbacks. All five share one save pattern: prevent the submit default, run model.validate(),
    keep validation state in a tracked modelValidations property, persist via model.save()
    only when valid, then emit a flash-messages success string naming whether the
    record was created or updated. All five share one cancel pattern: call unloadRecord()
    on a new model or rollbackAttributes() on a persisted one, then invoke the onCancel
    callback. Beyond that common shape, the client, key and provider forms carry an
    allow_all versus limited radio-card mode that rewrites a list field to the wildcard
    value on save, and give zero-valued TTL fields a 24h default before saving.'
