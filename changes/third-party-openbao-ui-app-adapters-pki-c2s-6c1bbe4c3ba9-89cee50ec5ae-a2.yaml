status:
  agentLog: 'The PKI adapter directory third_party/openbao/ui/app/adapters/pki/ holds
    seven Ember Data adapter modules, one per PKI model family: action.js (PkiActionAdapter),
    issuer.js (PkiIssuerAdapter), key.js (PkiKeyAdapter), role.js (PkiRoleAdapter),
    sign-intermediate.js (PkiSignIntermediateAdapter), tidy.js (PkiTidyAdapter) and
    cert.js. Each adapter sets namespace = ''v1'' so buildURL() places every request
    under the /v1 API prefix, appends the backend mount to that base, and passes mount
    names, key ids and issuer refs through encodePath before interpolation. PkiActionAdapter
    maps adapterOptions.actionType plus optional mount, issuerRef and useIssuer flags
    onto generation, import, sign-intermediate and rotate-root endpoints, choosing
    between the legacy paths (root/generate/<type>, intermediate/generate/<type>,
    config/ca, root/rotate/<type>) and the issuer paths (issuers/generate/root/<type>,
    issuers/generate/intermediate/<type>, issuers/import/bundle). PkiKeyAdapter lists
    and mutates keys under <backend>/keys and <backend>/key/<id>, generating or importing
    on create and posting only key_name on update. PkiTidyAdapter keeps manual tidy
    records (POST <backend>/tidy, never updated, synthesized back as a pki/tidy record
    with id equal to the backend) separate from auto-tidy config (POST and GET <backend>/config/auto-tidy,
    never created), and throws when a model arrives on the wrong path. PkiIssuerAdapter
    resolves the backend from the snapshot, builds issuer URLs through urlForQuery,
    normalizes payloads through getIssuerMetadata, and exposes deleteAllIssuers. PkiRoleAdapter
    and PkiSignIntermediateAdapter are the default exports giving those record families
    their own HTTP adapters.'
