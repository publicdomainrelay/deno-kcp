    after the first restart the test requires at least one key under secret/. The
    node is then stopped and restarted with Args ["-recovery"] and a StartProbe that
    calls GenerateRecoveryOperationTokenStatusWithContext, since in recovery mode
    almost no paths are reachable without a recovery token. The test generates a recovery
    token with testcluster.GenerateRoot(cluster, testcluster.GenerateRecovery), requires
    the second generate-root call to fail, sets the token on the client, lists sys/raw/logical/<secretMountUUID>
    and requires keys [foo], then deletes sys/raw/logical/<secretMountUUID>/foo. A
    final normal-mode restart must show zero keys under secret/, proving the raw deletion
    persisted. A listSecrets closure returns nil for a nil response and otherwise
    mapstructure-decodes the keys field into a []string. The file exports no reusable
    interfaces.'
