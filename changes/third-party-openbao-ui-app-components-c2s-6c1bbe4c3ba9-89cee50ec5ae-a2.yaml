  phase: Succeeded
  agentLog: 'This context covers the Ember component modules vendored at third_party/openbao/ui/app/components/,
    the presentation and form layer of the OpenBao (Bao) web console that deno-kcp
    embeds as third_party source. Each module exports one default Ember component
    class that a co-located template renders: CalendarWidget and DateDropdown for
    date range and single-date picking, ConfigureAwsSecretComponent and ConfigureSshSecretComponent
    for secrets engine configuration, DiffVersionSelector for comparing KV v2 secret
    versions through jsondiffpatch, the SecretEdit/SecretCreateOrUpdate/SecretEditMetadata/SecretEditToolbar/SecretVersionMenu/SecretDeleteMenu
    group for the secret v2 read, write, metadata and destroy flows, MountBackendForm
    and MountAccessorSelect for enabling mounts, the DatabaseConnectionEdit/DatabaseRoleEdit/DatabaseRoleSettingForm/GenerateCredentialsDatabase/GetCredentialsCard
    group for the database secrets engine, the crypto tool components ToolHash, ToolLookup,
    ToolRandom, ToolWrap, ToolUnwrap, ToolRewrap and WrapTtlComponent, auth-form.js,
    auth-jwt.js, auth-form-options.js and b64-toggle.js for login, PolicyFormComponent,
    OidcConsentBlockComponent, FlashMessageComponent and TokenExpireWarning for policy
    editing, OIDC consent and session feedback, plus small shared pieces such as SplashPage,
    SectionTabs, SelectableCard, HoverCopyButton, GeneratedItemList, PaginationControls,
    RegexValidator, SecretLink and ToolbarSecretLink. Because they are copied in rather
    than depended on, their contracts, arguments and storage interactions have to
    be described here instead of being read from a package.'
