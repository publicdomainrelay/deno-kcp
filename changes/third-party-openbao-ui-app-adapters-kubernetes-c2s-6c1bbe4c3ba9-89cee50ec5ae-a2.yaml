status:
  agentLog: 'This context covers the two Ember Data adapters the bundled OpenBao UI
    uses against a Kubernetes secrets engine mounted at an arbitrary backend path.
    third_party/openbao/ui/app/adapters/kubernetes/config.js defines KubernetesConfigAdapter,
    which extends ApplicationAdapter, pins its namespace to ''v1'', and addresses
    the singleton config record at <buildURL>/<encodePath(backend)>/config: queryRecord
    GETs that URL and stamps the backend onto the response, createRecord and updateRecord
    both funnel into a private _saveRecord that serializes the snapshot through the
    store serializer for the record''s modelName, takes the record id from snapshot.id
    or the snapshot''s backend attribute, POSTs the serialized data to that URL, and
    resolves with the serialized data plus backend and id set to that id, urlForUpdateRecord
    and urlForDeleteRecord resolve to the config URL, and checkConfigVars GETs the
    sibling <backend>/check path. third_party/openbao/ui/app/adapters/kubernetes/role.js
    defines KubernetesRoleAdapter, which extends NamedPathAdapter and addresses role
    records at <buildURL>/<encodePath(backend)>/roles[/<name>]: query GETs with list=true
    and maps the returned keys to {name, backend} pairs, queryRecord GETs one named
    role and returns its data with backend and name written onto it, the URL hooks
    drive update and delete from the snapshot''s backend attribute, and generateCredentials
    POSTs to <backend>/creds/<role> after deleting the role field from the payload,
    then flattens lease_id, lease_duration and the response data into one object.
    Both adapters take the engine mount path as the backend parameter and encode it
    into every URL they build.'
