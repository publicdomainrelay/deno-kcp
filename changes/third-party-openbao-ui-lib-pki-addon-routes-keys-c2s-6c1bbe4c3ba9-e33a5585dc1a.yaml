  agentLog: This context covers the four Ember route modules that back the PKI secrets-engine
    'keys' section of the OpenBao web UI, vendored under third_party/openbao/ui/lib/pki/addon/routes/keys/.
    PkiKeysIndexRoute lists keys, PkiKeysCreateRoute and PkiKeysImportRoute prepare
    a new unsaved pki/key record for the generate and import forms, and PkiKeyRoute
    loads a single key by id. Every route injects the secretMountPath and store services,
    so the current secrets mount path is passed as the 'backend' query option on each
    store call. The two form routes share the same body and differ only in the final
    breadcrumb label; the index route is additionally wrapped in the withConfig decorator
    and short-circuits a missing configuration into an empty key list, while the detail
    route reads key_id from its own route params.
