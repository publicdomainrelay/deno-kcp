  agentLog: This context covers the PKI add-on parameter utility module at third_party/openbao/ui/lib/pki/addon/utils/action-params.js
    in the deno-kcp repository. It exports a single helper, keyParamsByType(type),
    which maps a key-generation type to the list of parameter names the PKI UI must
    collect for that type. The default set is keyName, keyType and keyBits; the 'existing'
    type collapses to keyRef alone; 'kms' expands to keyName, managedKeyName and managedKeyId;
    and 'exported' takes the default set and appends privateKeyFormat. The returned
    array is consumed by the PKI action serializer to decide which attributes get
    serialized and by the generate-toggle-groups component to look up matching field
    definitions on the model.
