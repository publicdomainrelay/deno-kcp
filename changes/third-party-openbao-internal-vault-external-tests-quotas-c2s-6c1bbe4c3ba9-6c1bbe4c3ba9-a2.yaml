    with a generated internal root certificate (common_name testvault.com, ttl 200h,
    ip_sans 127.0.0.1) and a pki role test (allow_subdomains, max_ttl 2h, generate_lease);
    testRPS and testRPSWithNS hammer a caller-supplied request function in a tight
    loop for a fixed duration, counting successes and failures in atomic counters
    and returning both counts plus elapsed wall-clock time. Against that fixture the
    tests drive sys/quotas/rate-limit and sys/quotas/config through the HTTP API to
    assert quota naming and deduplication, duplicate-path rejection, path and mount
    scoping, mount-over-root precedence, namespace inheritance and the inheritable
    flag toggle, exempt paths, default exempt paths such as sys/health, and audit
    records emitted on rate-limit violations, comparing observed successes against
    the token-bucket ideal of ceil(rate) + rate*seconds.
