  agentLog: 'This context covers the OpenBao (Vault-compatible) Ember UI route layer
    for the vault cluster, held in two files under third_party/openbao/ui/app/routes/vault.
    cluster-base.js defines a base Ember Route that decides which route the browser
    must land on given the cluster''s init, seal and authentication state, and redirects
