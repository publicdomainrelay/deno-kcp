  agentLog: 'This context is the errutil helper package vendored from the OpenBao
    SDK at third_party/openbao/sdk/helper/errutil/error.go. It is a single small file
    that declares two exported error wrapper types, UserError and InternalError. Each
    type holds exactly one exported string field, Err, and defines Error() string
    on a value receiver that returns that field unchanged, so both types satisfy the
    standard error interface. The package adds no constructors, no Unwrap method,
    no chaining and no formatting; callers compose the message with fmt.Sprintf and
    assign it to Err in a composite literal. The two types exist to classify fault:
    UserError marks a bad request from the caller, InternalError marks a failure on
    the server side. Adjacent vendored code depends on this split, chiefly createCertificate
    in third_party/openbao/sdk/helper/certutil/helpers.go, which returns errutil.InternalError
    when GetSubjKeyID fails and returns errutil.UserError when the computed Not Before
    is after, or equal to, Not After.'
