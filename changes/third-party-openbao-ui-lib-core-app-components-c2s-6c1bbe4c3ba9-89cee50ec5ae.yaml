status:
  agentLog: '... is the vendored re-export surface of the OpenBao web UI component
    library, held under third_party/openbao/ui/lib/core/app/components. It holds 71
    JavaScript modules, one per component, and each module is a shim: a single `export
    { default } from ''core/components/<name>''` statement that forwards the addon
    component as the module default, with no local class, template or logic. The set
    covers the whole UI vocabulary the host application consumes by name: alerts (banner,
    inline, popup), form machinery (form-field, form-field-label, form-field-groups,
    form-field-groups-loop, form-error, form-save-buttons, edit-form, readonly-form-field,
    field-group-show), inputs and editors (masked-input, input-search, navigate-input,
    autocomplete-input, json-editor, kv-object-editor, object-list-input, string-list,
    text-file, ttl-picker), selection controls (checkbox-grid, box-radio, radio-button,
    radio-card, toggle, toggle-button, select), search and selection widgets (search-select,
    search-select-with-modal, search-select-placeholder), data display (info-table,
    info-table-row, info-table-item-array, key-value-header, stat-text, read-more,
    overview-card), chrome and navigation (page-header, page-header-level, toolbar,
    toolbar-actions, toolbar-filters, toolbar-link, popup-menu, menu-loader, list-view,
    list-item, list-pagination, linked-block, secret-list-header, secret-list-header-tab),
    overlays and flows (modal, confirm, confirm-action, confirmation-modal, shamir-flow,
    shamir-modal-flow, namespace-reminder), and small primitives (icon, chevron, tool-tip,
    info-tooltip, doc-link, external-link, download-button, empty-state, message-error,
    layout-loading, vault-logo-spinner). 69 of the 71 modules open with the HashiCorp
    MPL-2.0 SPDX header comment; alert-popup.js and page-header-level.js carry no
    header and are two lines long. For 70 modules the imported module name equals
    the file basename; vault-logo-spinner.js is the single exception and forwards
    core/components/openbao-logo-spinner.'
