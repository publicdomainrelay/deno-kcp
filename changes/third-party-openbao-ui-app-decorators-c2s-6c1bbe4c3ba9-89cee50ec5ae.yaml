  agentLog: Third-party OpenBao Ember UI decorators under `third_party/openbao/ui/app/decorators/`.
    Three modules export class decorators that extend ember-data models with form
    metadata. `model-expanded-attributes.js` exports `withExpandedAttributes()`, whose
    returned `decorator(SuperClass)` guards that the target is an ember-data `Model`,
    then returns a `ModelExpandedAttrs` subclass exposing a cached `allByKey` map
    of expanded attribute metadata and a `_expandGroups(groups)` helper that resolves
    named field groups against that map. `model-form-fields.js` exports `withFormFields(propertyNames,
    groupPropertyNames)`, which injects `formFields`, `formFieldGroups` and `allFields`
    on the decorated class from the store schema definition service. `model-validations.js`
    exports `withModelValidations(validations)`, which returns a `ModelValidations`
    subclass whose `validate()` walks the supplied rule object, runs built-in or custom
    validators, splits results into errors and warnings per key, and reports via `generateErrorCountMessage(errorCount)`.
    All three decorators share the same Model-prototype guard and log an error instead
    of applying when the target is not an ember-data Model.
