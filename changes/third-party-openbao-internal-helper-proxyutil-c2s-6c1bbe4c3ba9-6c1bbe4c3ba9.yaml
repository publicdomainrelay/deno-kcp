  agentLog: 'third_party/openbao/internal/helper/proxyutil/proxyutil.go is a small
    OpenBao helper that wraps a net.Listener in PROXY protocol handling. ProxyProtoConfig
    carries a Behavior string and a json-tagged AuthorizedAddrs list, and embeds sync.RWMutex
    so the address list can be refreshed while a listener is live. SetAuthorizedAddrs
    parses an arbitrary caller value into net addresses with parseutil.ParseAddrs
    and stores them, returning the parse error without touching the field when parsing
    fails. WrapInProxyProto reads Behavior, takes the config write lock for the call,
    and returns a proxyproto.Listener with a 10 second ReadHeaderTimeout: for use_always
    it accepts PROXY headers unconditionally, for allow_authorized and deny_unauthorized
    it installs a Policy closure that takes the read lock, parses the remote address
    with sockaddr.NewSockAddr, returns proxyproto.USE when the address is contained
    by an authorized address, and otherwise IGNORE for allow_authorized or REJECT
    with an error for deny_unauthorized. Any other Behavior value returns the original
    listener unchanged along with an unknown-behavior error.'
