status:
  agentLog: 'Ember Data adapters for the OpenBao PKI secrets engine live in third_party/openbao/ui/app/adapters/pki/.
    Seven files each export one default adapter class: PkiActionAdapter (action.js),
    PkiIssuerAdapter (issuer.js), PkiKeyAdapter (key.js), PkiRoleAdapter (role.js),
    PkiSignIntermediateAdapter (sign-intermediate.js), and PkiTidyAdapter (tidy.js),
    plus a cert.js adapter. Every adapter observed extends ApplicationAdapter and
    sets namespace = ''v1'', so all requests are built under the /v1 API prefix by
    this.buildURL(). The action adapter maps an adapterOptions.actionType plus optional
    issuerRef, mount and useIssuer flags onto generation, import, sign-intermediate
    and rotate-root endpoints. The key adapter lists and mutates keys under <backend>/keys
    and <backend>/key/<id>, generating or importing on create and posting key_name
    on update. The tidy adapter separates manual tidy records (POST <backend>/tidy,
    never update) from auto-tidy config (POST/GET <backend>/config/auto-tidy, never
    create), throwing when a model arrives on the wrong path. The issuer adapter reads
    and writes issuer records, resolves backend from the snapshot, and exposes deleteAllIssuers.
    All backend and mount path segments are passed through encodePath before being
    interpolated into URLs.'
