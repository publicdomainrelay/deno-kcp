  agentLog: 'This context is the Ember service layer of the OpenBao web UI, found
    under third_party/openbao/ui/app/services. It holds the browser-side singletons
    the UI depends on: path and console helpers, a file DownloadService, flash messages,
    host routing, the client-side data store with its dataset and lazy caches, plus
    the smaller supporting services for authentication, CSP reporting, cluster state,
    namespaces, permissions, replication mode, secret mount paths, path help, version
    and the setup wizard. The helpers sanitizePath and ensureTrailingSlash normalize
    user and mount paths, DownloadService turns strings into browser downloads with
    MIME-typed filenames, and store.js is the largest unit, implementing a paginated,
    cache-backed query layer over Ember Data models.'
