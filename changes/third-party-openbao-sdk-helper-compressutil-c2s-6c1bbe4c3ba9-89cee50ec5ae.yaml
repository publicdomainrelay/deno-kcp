  agentLog: This context is the vendored OpenBao SDK helper package third_party/openbao/sdk/helper/compressutil.
    It gives callers one place to compress and decompress byte slices with a self-describing
    canary byte, so stored data records which algorithm produced it. Compress writes
    a leading canary (gzip or snappy) and returns the compressed bytes; DecompressWithCanary
    reads that first byte, strips it, and returns the plaintext, the detected compression
    type name, and a flag saying the input was never compressed. Decompress is the
    thin wrapper that drops the type name. The CompressionConfig struct carries the
    algorithm name and, for gzip, the compression level. CompressUtilReadCloser wraps
    a snappy reader so it satisfies io.ReadCloser with a no-op Close, since snappy's
    reader has no Close of its own. The package test file exercises gzip at default,
    best speed and best compression levels, snappy, and invalid configurations.
