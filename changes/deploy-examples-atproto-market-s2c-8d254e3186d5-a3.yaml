  agentLog: |-
    ... plain-HTTP variant — writes only `ca.pem`/`DENO_CERT`, never tls.crt/tls.key nor TLS flags, write allowList `result.json`+`ca.pem`, sets `PDS_STATE_PATH` and `REPO_PRIVATE_KEY_HEX_PATH` into the run dir.
    - `40-alice-pds.yaml`: `PDS_CRAWLERS` → relay listener address `https://127.0.0.1:2584`.
    - `apply.sh`: workspaces `global relay alice bob`; preflight adds `atproto-market/hono-bidder`; three per-identity keys via `resolve_key` (`PDS_`/`BOB_PDS_`/`BIDDER_PRIVATE_KEY_HEX`, own key files); three distinct sed placeholders; order plc → alice pds → bob pds → relay → bidder; verifier gated on bounded wait for alice pds Running+ready (no `sleep 10`); summary loop covers bob pds + bob bidder.
    - `accept.sh` (new): whole topology under mktemp `ACCEPT_ROOT` on three kernel-issued ports; retry loop ≤3 attempts that restarts the provider only while no DenoPod exists; EXIT trap deletes DenoPods through kcp and waits before stopping provider/OpenBao/kcp; per-check results table, provider log tail on failure.
    - `README.md`: four workspaces, bob pds/bidder rows, bob OpenBao row, bidder TLS exception, `accept.sh` section, XRPC-dispatcher ceiling.

    **Gate fix:** all host checks now verify — no `-k` anywhere. `accept.sh` reads the market root CA from OpenBao (`/v1/pki/ca/pem`) and uses `curl --cacert … --resolve <name>:<port>:127.0.0.1`; `apply.sh`'s hint block prints the same verified form.

    **test-integration:** `examples.go` registers the ten market manifests with forward-slash relative paths, declares `nonExamples` (00-workspaces, 10-rbac), and `exampleFilesOnDisk` walks `deploy/examples` recursively; `offline_test.go` subtracts `nonExamples` before comparing.

    **Other:** `provider_runtime_test.go` asserted `mint calls == 1`; the FQDN layer mints one per-workspace token for `KCP_TOKENS` plus the pod's service-account token, so one pod costs two. Assertion now 2 with a comment naming both callers. No production change.

