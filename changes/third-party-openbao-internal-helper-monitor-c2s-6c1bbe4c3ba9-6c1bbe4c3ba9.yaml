status:
  agentLog: The package at third_party/openbao/internal/helper/monitor wraps a go-hclog
    InterceptLogger so a server can stream its own log lines to an HTTP client at
    a log level independent of the level set on the logger. NewMonitor validates the
    requested buffer size, builds a buffered byte-channel of that size, and attaches
    an unexported *monitor as the Output of a fresh log.SinkAdapter built from the
    caller's log.LoggerOptions. The returned Monitor interface exposes only Start,
    which registers the sink on the logger and returns a channel of log messages that
    a goroutine closes when shutdown is signalled, and Stop, which deregisters the
    sink and signals shutdown. The underlying monitor also implements io.Writer so
    the sink can push each record in; writes never block, and any record that does
    not fit in the full buffer is counted instead of queued, with the count flushed
    to the stream as a 'Monitor dropped N logs during monitor request' message on
    a periodic tick.
