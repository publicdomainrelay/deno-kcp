  agentLog: 'This context is the JWT auth method of the OpenBao agent proxy, a single
    Go package under third_party/openbao/internal/command/agentproxyshared/auth/jwt.
    NewJWTAuthMethod builds a jwtMethod from an auth.AuthConfig: it validates that
    the config and its data are present, requires a non-empty ''path'' and ''role'',
    reads the optional booleans remove_jwt_after_reading (default true) and remove_jwt_follows_symlinks
    (default false), and chooses a read period from the optional ''jwt_read_period''
    duration or a default of 500ms when JWTs are deleted after reading and 1 minute
    otherwise. It then starts a background watcher goroutine over a ticker and returns
    the method. At authentication time the method reads the JWT file, publishes the
    latest token through an atomic value, and returns the login path built from the
    mount path together with a request body carrying the role and the JWT. Credential
    refresh is signalled to the agent through a channel returned by NewCreds, and
    CredSuccess closes a gate exactly once using a sync.Once.'
