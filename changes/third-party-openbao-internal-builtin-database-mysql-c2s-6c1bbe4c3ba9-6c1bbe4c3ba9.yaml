status:
  agentLog: 'This context covers the Go package third_party/openbao/internal/builtin/database/mysql,
    the MySQL backend plugin for OpenBao''s database secrets engine. It holds two
    cooperating pieces: mySQLConnectionProducer, which implements the connutil ConnectionProducer
    interface (Initialize, Init, Connection, SecretValues, Close), and MySQL, a dbplugin.Plugin
    implementation that embeds the producer and adds the username template and the
    credential lifecycle methods Type, Initialize, NewUser, DeleteUser and UpdateUser.
    The producer decodes raw plugin config with mapstructure, substitutes username
    and password into the connection URL with dbutil.QueryHelper, parses multi-host
    DSNs for failover, applies pool limits (MaxOpenConnections default 4, MaxIdleConnections
    clamped to MaxOpenConnections, MaxConnectionLifetimeRaw default "0s"), registers
    a TLS config under a generated UUID name, and lazily opens a *sql.DB via mysql.NewConnector
    plus sql.OpenDB. Tests live beside the sources in connection_producer_test.go
    and mysql_test.go.'
