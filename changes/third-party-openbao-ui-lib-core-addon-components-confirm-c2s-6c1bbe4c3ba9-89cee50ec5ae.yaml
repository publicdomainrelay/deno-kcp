  agentLog: 'This context covers the OpenBao UI Ember component `confirm/message`,
    defined in `third_party/openbao/ui/lib/core/addon/components/confirm/message.js`.
    The component is an old-style `Ember.Component.extend` object that renders with
    no wrapping tag (`tagName: ''''`) and uses the template at `../../templates/components/confirm/message`.
    It is meant to be used only inside a `Confirm` component, where a child `<c.Message>`
    provides a trigger button and the confirmation dialog body. The component holds
    plain properties for its content and callbacks (`id`, `triggerText`, `title`,
    `message`, `confirmButtonText`, `cancelButtonText`) plus a `showConfirm` computed
    property that gates visibility by comparing `renderedTrigger` to `id`. Its `actions.onConfirm`
    invokes the passed-in `onConfirm` callback and then calls `resetTrigger`, which
    is how the owning `Confirm` component closes the message. The module doc block
    is the authoritative description of the public attribute surface and defaults.'
