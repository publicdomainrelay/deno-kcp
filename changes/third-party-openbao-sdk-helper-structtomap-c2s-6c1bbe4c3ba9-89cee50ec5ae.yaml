    as-is through Interface() with no deep copying, so slices and maps inside the
    struct stay shared. The test file structtomap_test.go defines Exported, unexported,
    ExportedEmbedded, ExportedPointerEmbedded, and Complex fixtures, and TestMap table-drives
    Map over struct values, pointers, non-structs, unexported fields, embedded and
    pointer-embedded structs, nil pointers, slices and maps, anonymous structs, and
