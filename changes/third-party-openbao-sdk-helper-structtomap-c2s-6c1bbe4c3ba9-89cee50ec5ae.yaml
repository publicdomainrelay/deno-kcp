  agentLog: 'This context covers the structtomap helper package from the OpenBao SDK,
    vendored under third_party/openbao/sdk/helper/structtomap. It contains one exported
    function, Map, which reflects over an arbitrary Go value and returns a map[string]any
    keyed by JSON tag names. The unexported structToMap walks struct fields: pointers
    are dereferenced, non-struct values yield an empty map, unexported fields (PkgPath
    != "") are skipped, anonymous embedded fields are flattened recursively via maps.Copy,
