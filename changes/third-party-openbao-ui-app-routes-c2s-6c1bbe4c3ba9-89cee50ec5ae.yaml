  phase: Succeeded
  agentLog: 'This context is the Ember.js route layer of the OpenBao (Vault fork)
    management UI, covering three top-level route modules under third_party/openbao/ui/app/routes/.
    application.js is the root application route: it services the ''router'' and ''namespace''
    services, scrolls the window to the top on every transition, and implements the
    error action that reconstructs the failed transition''s URL (via router.urlFor
    when transition.intent.url is absent), strips the ''/ui'' rootURL prefix, attaches
    it to the error object, syncs the namespace query param onto the vault.cluster
    controller, pushes the URL into browser history through router.location.setURL,
    and returns true to signal the error was handled. loading.js is the loading route
    used while models resolve; it overrides setupController to mark whether the current
    location.pathname includes ''oidc/callback'', exposing that as isCallback on the
    controller so the OIDC callback flow can render differently. vault.js is the top-level
    vault route: it fetches server version in beforeModel, pushes a hardcoded single
    ''cluster'' fixture record named ''vault'' into the store and resolves it after
    a splash delay (300 ms normally, 0 ms under Ember testing), and redirects to vault.cluster
    for that cluster when the target was vault.index and exactly one cluster exists.'
