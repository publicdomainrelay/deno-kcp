  agentLog: This context covers the OpenBao vendored helper package third_party/openbao/internal/helper/parseip,
    which normalizes textual IP addresses that carry leading zeroes in their dotted-quad
    octets. The package's exported surface is a single function, TrimLeadingZeroesCIDR,
    which splits a CIDR string on "/", delegates the address half to the unexported
    trimLeadingZeroesIP, and rejoins the pieces. The unexported helper scans backwards
    for the last colon followed by a parseable sloppy IP, so IPv6 addresses with an
    embedded IPv4 tail get their tail normalized while pure IPv4 input is normalized
    directly. Inputs that are not valid two-piece CIDR strings are returned unchanged.
    A table-driven test, Test_TrimLeadingZeroes, exercises both the CIDR and non-CIDR
    paths over a fixed set of IPv4 and IPv6 cases.
