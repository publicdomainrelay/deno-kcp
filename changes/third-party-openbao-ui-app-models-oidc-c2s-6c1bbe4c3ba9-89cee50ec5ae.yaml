  agentLog: 'This context is the OIDC model layer of the OpenBao (Vault) Ember UI,
    held under third_party/openbao/ui/app/models/oidc. It contains five Ember Data
    model classes, one per OIDC object type the UI manages: OidcAssignmentModel, OidcClientModel,
    OidcKeyModel, OidcProviderModel and OidcScopeModel. Each model declares the attributes
    the API returns for its object type, and each derives UI metadata and API paths
    from those attributes. OidcClientModel and OidcKeyModel both expose a formFields
    getter used to drive rendered forms, backed by an _attributeMeta declaration,
    and OidcClientModel additionally derives fieldGroups from a _fieldToAttrsGroups
    map. Every model exposes capability getters that resolve read, edit and delete
    permission for the object from a path property on the record, and OidcKeyModel
    adds a rotate capability. The files are vendored third-party source, so the spec
    records the shape the surrounding application depends on rather than proposing
    changes.'
