status:
  agentLog: 'Nine Ember.js component modules under third_party/openbao/ui/app/components/identity/
    make up the identity (entity and group) UI of the vendored OpenBao web app. They
    form three groups: a shared popup base (_popup-base.js) that injects flashMessages,
    defaults params to null, provides no-op onSuccess and a rollback onError, and
    asserts false in transaction so subclasses must override it, together with four
    thin subclasses that each perform one destructive mutation (popup-alias.js deletes
    a record, popup-members.js removes a member from a group, popup-metadata.js deletes
    a metadata key, popup-policy.js removes a policy); form and navigation components
    (edit-form.js with create/edit/merge modes and a cancelLink computed route, entity-nav.js
    which is an empty template-backed placeholder, item-details.js whose enable action
    flips the disabled flag and saves); and lookup-input.js, which resolves an entity
    or group through the identity/<type> store adapter by id, name, alias name, or
    alias mount accessor and transitions to the identity show route. All components
    are Ember classic Component.extend definitions using injected services and, where
    async, ember-concurrency tasks with the waitFor test waiter.'
