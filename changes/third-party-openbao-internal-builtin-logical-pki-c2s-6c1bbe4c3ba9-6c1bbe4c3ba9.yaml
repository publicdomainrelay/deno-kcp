  agentLog: This context is the ACME identifier layer of the OpenBao PKI secrets engine,
    held in third_party/openbao/internal/builtin/logical/pki/acme_authorizations.go
    and its helper in cert_util.go. ACMEIdentifierType is a string alias for the identifier
    "type" field, and ACMEIdentifier carries the parsed order identifier together
    with its original value, a wildcard flag and the reduced (wildcard-stripped) value.
    ACMEIdentifier.MaybeParseWildcard classifies an identifier as a wildcard when
    its type is dns and its value contains an asterisk, rejects wildcards that are
    not the entire left-most label or that consume the whole domain, and on success
    rewrites the stored value to the reduced name. ACMEIdentifier.NetworkMarshal renders
    the identifier as a {"type", "value"} map, choosing between the current and original
    value. ACMEAuthorization.NetworkMarshal builds the wire form of an authorization
    from that identifier, its status, its wildcard flag, an optional expiry and an
    optional list of challenges. The predicate isWildcardDomain in cert_util.go decides
    wildcard-ness by a plain asterisk containment test, so both RFC 6125 wildcard
    forms count as wildcards even when they are not valid for issuance.
