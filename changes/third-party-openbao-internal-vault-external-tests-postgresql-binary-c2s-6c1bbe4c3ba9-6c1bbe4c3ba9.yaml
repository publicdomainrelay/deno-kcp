  agentLog: 'This context is a single Go test file, third_party/openbao/internal/vault/external_tests/postgresql_binary/postgresql_test.go,
    that declares package raft_binary despite living in the postgresql_binary directory.
    It holds five acceptance-style tests that drive real OpenBao server binaries inside
    Docker clusters whose storage backend is PostgreSQL: TestPostgreSQL_FencedWrites,
    TestPostgreSQL_ParallelInit, TestPostgreSQL_FatalInit, TestPostgreSQL_Upgrade
    and TestPostgreSQL_Scalability. Every test begins by reading the BAO_BINARY environment
    variable through api.ReadBaoVariable and skips when it is empty, so the whole
    file is inert unless an operator supplies a binary path. The tests build a docker.NewPostgreSQLStorage
    or docker.NewPostgreSQLClusterStorage backend, wrap it in docker.DockerClusterOptions
    that pull quay.io/openbao/openbao:latest, start the cluster, and then assert on
    fenced-write rejection, concurrent self-initialization, refusal of a bad self-init
    config, rolling node upgrade with data persistence, and failover plus promotion
    behaviour across primary, replica and read-only nodes.'
