status:
  agentLog: 'internal/denorun holds the stateless deno-run decision engine for the
    deno-kcp operator. It defines the observation types a caller hands in (Observed,
    carrying a v1alpha1.DenoRun, an optional RunObservation of the running workload,
    and a clock reading) and the Result the decider hands back (target phase, run
    id, timestamps, exit code, message, outputs, retry count, conditions, a list of
    Ops, and requeue delay). Reconciler.Reconcile is the single entry point: it copies
    prior status forward, then dispatches on deletion timestamp, terminal phase, active
    deadline, absence of an execution observation, and finally the observed run state
    (running, succeeded, failed). Each branch sets the next phase, appends the Ops
    the provider must carry out (start-run, stop-run, delete, remove-finalizer), and
    stamps metav1 conditions against the run''s generation. The package is deliberately
    free of client and I/O concerns, so the provider owns all writes and the decider
    stays a pure function of what it is handed.'
