  agentLog: 'This context is the set of Ember Data model classes that back the OpenBao
    web UI forms for AWS auth method configuration. It holds four modules under third_party/openbao/ui/app/models/auth-config/aws:
    client.js, which extends the shared AuthConfig model with AWS credential and endpoint
    attributes plus a computed fieldGroups grouping them for form rendering; tidy.js,
    which extends AuthConfig with the periodic-tidy settings safetyBuffer (default
    ''72h'', rendered as a TTL) and disablePeriodicTidy (boolean, default false) plus
    a computed attrs list produced by expandAttributeMeta; and identity-accesslist.js
    and roletag-denylist.js, which both simply extend the tidy model with no added
    attributes or overrides, so the AWS identity access list and role tag denylist
    forms reuse the tidy field set verbatim. The channel wiring between model and
    form is done with the Ember attr/computed decorators and the vault/utils/field-to-attrs
    helpers.'
