status:
  agentLog: 'The queue package in third_party/openbao/sdk/queue is an in-memory priority
    queue of *Item values, adapted from the HashiCorp Vault SDK and vendored into
    this repository. PriorityQueue holds two synchronized structures: a queue slice
    driven by container/heap and a map from item key to the same *Item, both guarded
    by a sync.RWMutex. New builds an empty queue and initializes the heap. Push rejects
    nil items and empty keys, rejects a key already present with ErrDuplicateItem,
    and deep-copies the item through copystructure.Copy so later mutation of the caller''s
    value cannot reach the queued entry. Pop removes the lowest Priority value (int64,
    smallest is highest priority) and deletes the matching map entry, returning ErrEmpty
    on an empty queue. PopByKey looks the item up by key, removes it with heap.Remove,
    and returns nil, nil when the key is absent. The unexported queue type supplies
    the heap.Interface methods Len, Less, Swap, Push and Pop, and Swap plus the heap
    Push and Pop keep each item''s internal index field current so heap.Remove and
    heap.Fix targets stay valid. The test file pins the heap.Interface conformance
    with a compile-time assertion and exercises New, Push, Pop, PopByKey, duplicate
    and keyless rejection, and internal slice/map size agreement after drains.'
