  agentLog: 'This context covers the six Ember Data serializers under third_party/openbao/ui/app/serializers/pki
    — action.js, certificate.js, issuer.js, key.js, role.js and tidy.js. Together
    they adapt OpenBao''s PKI API payloads for the UI: PkiActionSerializer shapes
    request bodies per PKI action type through an allow-list and parses returned certificates
    into a parsed_certificate object; PkiIssuerSerializer and PkiKeySerializer rehydrate
    LIST responses keyed by issuer_id/key_id and parse issuer certificates; PkiRoleSerializer
    keeps an empty key_usage array in the serialized JSON and never serializes the
    role name; PkiTidySerializer strips enabled and intervalDuration from manual tidy
    requests; PkiCertificateSerializer inherits the generic certificate serializer
    unchanged. All six extend the application serializer (certificate via the cert
    serializer) and share the convention of marking server-owned or UI-only attributes
    with serialize: false.'
