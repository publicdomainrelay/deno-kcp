status:
  agentLog: 'This context is the OpenBao built-in Kubernetes credential backend, vendored
    at third_party/openbao/internal/builtin/credential/kubernetes. The package registers
    a logical credential backend through Factory, which calls Backend to build a kubeAuthBackend
    and then runs Setup on it. Backend wires a framework.Backend with BackendType
    logical.TypeCredential, registers the config and login paths plus the role paths,
    seals the config path in storage, and sets AuthRenew, InitializeFunc and Clean
    to the backend''s own handlers; the struct also holds caching readers for the
    in-cluster service account JWT and CA certificate, an HTTP client and TLS config,
    a token review factory defaulting to tokenReviewAPIFactory, and a namespace validator
    factory defaulting to newNsValidatorWrapper. Token review is abstracted behind
    the tokenReviewer interface, with tokenReviewAPI as the real Kubernetes TokenReview
    client (context, HTTP client, JWT, audiences) and mockTokenReview as the test
    double. Two receiver types carry the token-facing surfaces: cachingFileReader
    serves ReadFile from an in-memory buffer until its TTL expires and otherwise re-reads
    from disk, and DontVerifySignature offers VerifySignature that returns claims
    without checking the signature. The CLIHandler type implements the OpenBao CLI
    auth method contract with Auth and Help so `bao login -method=kubernetes` can
    exchange a service account token for a client token. Tests cover the backend,
    the caching reader, path config, path login and path roles, with shared helpers
    in helpers.go and common_test.go, and namespace pattern validation in namespace_validator.go.'
