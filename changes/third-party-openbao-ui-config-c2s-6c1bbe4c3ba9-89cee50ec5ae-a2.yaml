  phase: Succeeded
  agentLog: 'The vendored OpenBao web UI keeps its build-time configuration in three
    CommonJS modules under third_party/openbao/ui/config. environment.js exports a
    function that takes the Ember environment name and returns the ENV object: it
    fixes modulePrefix ''vault'', rootURL ''/ui/'', serviceWorkerScope ''/v1/sys/storage/raft/snapshot'',
    locationType ''history'', disables Date and String prototype extension, seeds
    APP with the polling URL list, the namespace-root URL list and DEFAULT_PAGE_SIZE
    100, sets flash-message defaults, then branches per environment — development
    turns on APP.LOG_TRANSITIONS and conditionally enables ember-cli-mirage from MIRAGE_DEV_HANDLER,
    test switches locationType to ''none'' and adopts the test harness selectors and
    a 50 ms flash timeout with Mirage off, and every non-production environment lowers
    the page size to 15 — and finally copies UI_AUTH_WELCOME into ENV.welcomeMessage.
    content-security-policy.js exports a function of the same environment name returning
    the ember-cli-content-security-policy settings, and targets.js exports the browserslist
    target list.'
