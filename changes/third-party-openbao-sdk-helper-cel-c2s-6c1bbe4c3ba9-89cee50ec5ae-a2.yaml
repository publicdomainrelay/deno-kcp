    EvalConfig.ToOptions and EvalConfig.ToEnv building the CEL environment, Program.Evaluate
    and Program.EvaluateVars running the program, Program.Validate, Program.ValidateVars
    and Variable.Validate checking it, plus JSONProgramFromRequest and FrameworkFieldSchema
    binding the program to framework field data. helpers_test.go exercises the helper
    functions.'
