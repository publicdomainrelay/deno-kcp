  agentLog: 'The OpenBao SDK CEL helper package at third_party/openbao/sdk/helper/cel
    has two source files. helpers.go builds CEL environment options and identity data:
    CheckValidEmailFunction registers a check_valid_email(string) bool overload; CelGoExtFunctions
    returns the CEL extension libraries (strings, lists, optional types, regex, math,
    sets, encoders); IdentityDeclarations declares the client_token, entity_id, entity_groups
