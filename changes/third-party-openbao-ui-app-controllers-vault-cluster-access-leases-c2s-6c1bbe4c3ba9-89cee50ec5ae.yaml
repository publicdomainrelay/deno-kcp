  agentLog: 'This context covers the Ember.js UI controllers for the OpenBao (Vault-compatible)
    leases section of the cluster access area: index.js, list-root.js, list.js and
    show.js under third_party/openbao/ui/app/controllers/vault/cluster/access/leases.
    Together they drive the leases list screen, its filter and pagination state, and
    the individual-lease detail screen. list.js holds the list state and the revoke-prefix
    action, show.js holds record cleanup plus renew and revoke actions for a single
    lease, index.js only routes a looked-up lease id into the show route, and list-root.js
    is a one-line re-export of list.js so the root list route shares the same controller
    behavior. The controllers talk to the API through the lease adapter obtained from
    the Ember store, use the flash-messages service for success and error notices,
    and use transitionToSafe for all navigation.'
