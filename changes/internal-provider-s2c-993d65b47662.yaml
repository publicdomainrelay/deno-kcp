  requirementCoverage:
  - id: r.watch-cache-keys-every-workspace
    implemented: true
    evidence: 'watch.go: new `workCacheKey(obj any)` returns `Ref{LogicalCluster:
      u.GetAnnotations()[kcp.ClusterAnnotation], Namespace: u.GetNamespace(), Name:
      u.GetName()}.Key()`, i.e. keyed by workspace+namespace+name; `newCacheStore()`
      returns `cache.NewIndexer(workCacheKey, watchIndexers)`; `registerInformer`
      replaces `indexer := informer.GetIndexer()` with `store := newCacheStore();
      reader.add(res.kind, store)` and fills it in AddFunc (`_ = store.Add(obj)`),
      UpdateFunc (`_ = store.Update(obj)`) and a new DeleteFunc (`_ = store.Delete(untombstone(obj))`),
      so the reader reads from the workspace-keyed store rather than the namespace/name
      informer indexer.'
  - id: r.watch-cache-keys-every-workspace-test
    implemented: true
    evidence: 'watch_test.go: `TestTwoWorkspacesKeepTheirSameNamedPods` builds `podObject("pds",
      "root:alice", "default", ...)` and `podObject("pds", "root:bob", "default",
      ...)` (same namespace and name, two workspaces), adds both to `newCacheStore()`,
      asserts `len(reader.allPods()) != 2` fails, reads each via `ReadPod(Ref{LogicalCluster:
      lc, Namespace: "default", Name: "pds"})` and checks the returned annotation
      equals lc, then `store.Update(bob)` and asserts alice''s pod is still readable.
      Offline (unstructured objects only). Against `cache.MetaNamespaceKeyFunc` both
      objects collide on key `default/pds`, so the second Add leaves `len(allPods())==1`
      and the `got != 2` assertion fails.'
