  agentLog: 'This context is the Ember.js route layer for one item type inside an
    auth method in the OpenBao/Vault web UI, under third_party/openbao/ui/app/routes/vault/cluster/access/method/item/.
    Four route modules exist: create.js, edit.js, list.js, and show.js. Each reads
    the :item_type dynamic segment plus the parent vault.cluster.access.method route''s
    path param and model, singularizes the item type, and derives an Ember Data model
    name of the form generated-<singular-item-type>-<auth-method-type>. create.js
