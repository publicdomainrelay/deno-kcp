  agentLog: 'The OpenBao SDK helper package `wrapping`, vendored under `third_party/openbao`,
    exposes one file in this context: `third_party/openbao/sdk/helper/wrapping/wrapinfo.go`.
    It defines the `ResponseWrapInfo` struct, the value type that describes a wrapped
    response. The struct carries the wrapping token and its accessor, the wrapping
    TTL, the creation time of the wrapping token, the accessor of an inner created
    token or approle secret-id, the entity identifier of the caller that asked for
    the wrap, the wrapping format, the original creation path, and the seal-wrap flag.
    Every field carries parallel `json`, `structs`, `mapstructure`, and `sentinel`
    tags on the same key name, so the value encodes into API responses and decodes
    from stored or plugin-transported data without a rename step. Callers read it
    back from a logical response''s `wrap_info` field.'
