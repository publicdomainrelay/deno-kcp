status:
  phase: Succeeded
  agentLog: 'This context covers the two Ember Data serializers under third_party/openbao/ui/app/serializers/kubernetes
    in the deno-kcp repository: config.js and role.js. Each file default-exports a
    serializer class named KubernetesConfigSerializer that extends the shared ApplicationSerializer,
    declares primaryKey = ''backend'', and overrides serialize(). Both overrides call
    super.serialize with the forwarded arguments and then delete the backend key from
    the resulting JSON so the backend is not sent in the request payload. The config.js
    override adds one more step: when the serialized disable_local_ca_jwt is exactly
    false, it also nulls kubernetes_ca_cert, kubernetes_host, and service_account_jwt,
    which clears values left over from a previous manual configuration. role.js does
    no such clearing. These serializers shape the JSON bodies that the Kubernetes
    secrets engine UI sends to the OpenBao backend when saving a config or a role.'
