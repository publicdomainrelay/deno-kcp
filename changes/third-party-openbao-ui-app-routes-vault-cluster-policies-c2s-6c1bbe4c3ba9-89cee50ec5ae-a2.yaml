status:
  agentLog: 'This context covers the two Ember.js route modules behind the OpenBao
    UI policy list and policy create screens in the vault cluster namespace. `third_party/openbao/ui/app/routes/vault/cluster/policies/index.js`
    is the list route: it resolves the active policy type from `paramsFor(''vault.cluster.policies'').type`,
    declares `page` and `pageFilter` as `refreshModel: true` query params, returns
    an empty model for every type other than `acl`, and otherwise issues `store.lazyPaginatedQuery(''policy/<type>'')`
    with `responsePath: ''data.keys''`, converting a 404 to an empty array only for
    non-ACL types. Its `setupController` copies `pageFilter`, `model.meta.currentPage`
    and the policy type onto the controller, `resetController` clears `pageFilter`
    and `filter` on exit, `willTransition` scrolls to the top and clears all store
    datasets when leaving the route, and the `reload` action clears datasets and calls
    `refresh()`. `third_party/openbao/ui/app/routes/vault/cluster/policies/create.js`
    is the new-policy route: it builds a `policy/<type>` record only for `acl`, otherwise
    redirecting to the list route with that type, mirrors the policy type onto the
    controller in `setupController`, calls the controller''s optional `cleanupModel`
    on exit, and guards navigation with a dirty-attribute confirmation prompt.'
