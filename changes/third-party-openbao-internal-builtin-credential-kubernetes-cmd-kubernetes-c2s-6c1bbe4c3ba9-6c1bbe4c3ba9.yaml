  agentLog: 'third_party/openbao/internal/builtin/credential/kubernetes/cmd/kubernetes/main.go
    is a package main that acts as the standalone plugin entry point for the OpenBao
    Kubernetes credential backend. Its main function allocates an api.PluginAPIClientMeta,
    parses flags from os.Args[1:] with the flag set that meta returns, reads the TLS
    config through GetTLSConfig, and wraps it with api.VaultPluginTLSProvider to build
    tlsProviderFunc. It then calls plugin.ServeMultiplex with a plugin.ServeOpts carrying
    kubeauth.Factory as BackendFactoryFunc and tlsProviderFunc as TLSProviderFunc,
    so the plugin stays backwards compatible with Vault versions that lack plugin
    AutoMTLS. Both the flag parse error and the ServeMultiplex error route to the
    unexported fatal helper, which logs through log.L() at Error level with the message
    ''plugin shutting down'' and the error under the ''error'' key, then calls os.Exit(1).
    The file exports no interfaces: both main and fatal are unexported.'
