  agentLog: 'This context covers third_party/openbao/ui/lib/pki/addon/decorators/check-config.js,
    a single-file Ember decorator for the OpenBao PKI UI engine. The file exports
    withConfig(), a factory that returns a route class decorator. The decorator guards
    its input: if the SuperClass is not an instance of the Ember Route class it logs
    an error and returns the class untouched. Otherwise it returns an anonymous class
    named CheckConfig that extends the SuperClass, injects the secretMountPath service,
    declares shouldPromptConfig = false, and overrides async beforeModel to query
    the pki/issuer store records with the backend set to the current secret mount
    path, flipping shouldPromptConfig to true when the query resolves and back to
    false when it rejects. The decorator is applied to PKI routes such as certificates/index,
    configuration/index, keys/index, overview, roles/index and tidy.'
