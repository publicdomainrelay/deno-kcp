  agentLog: The fairshare package in third_party/openbao/internal/helper/fairshare
    implements a fair-share job scheduler. A JobManager holds one FIFO queue per queueID
    and a dispatcher worker pool of fixed size. NewJobManager builds the manager,
    generating a uuid-suffixed name when the caller passes an empty name and falling
    back to a discarding logger when nil. AddJob appends a job to its queue, creating
    the queue and its worker counter on first use, and bumps metrics gauges when a
    metric sink is present. Start launches the worker pool and a background scheduling
    loop that pulls jobs round-robin across queues while capping the workers any one
    queue may hold at ceil(0.9 * numWorkers / numberOfActiveQueues); Stop closes the
    quit channel, waits for the scheduling loop and the workers, and is guarded so
    a manager can never be restarted. Intros, GetPendingJobCount, GetWorkerCounts
    and GetWorkQueueLengths expose the live state. SimpleJob adapts a plain func()
    into the Job interface and panics if its OnFailure is ever reached.
