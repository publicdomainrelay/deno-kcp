  agentLog: The custommetadata package in the OpenBao SDK helper tree holds one small
    source file and one test file. custom_metadata.go defines the two exported entry
    points Parse and Validate plus four package constants (maxKeys = 64, maxKeyLength
    = 128, maxValueLength = 512, validationErrorPrefix = "custom_metadata validation
    failed"). Parse converts an arbitrary map[string]any payload into the map[string]string
    form in which custom metadata is stored, using mapstructure.WeakDecode on each
    value and optionally dropping nil entries so that a PATCH can signal field removal.
    Validate enforces the size and printability limits on that stored form, short-circuiting
    on key count and otherwise collecting every per-key and per-value failure into
    a multierror. custom_metadata_test.go drives Validate through a table of six cases
    (valid, too_many_keys, key_too_long, value_too_long, unprintable_key, unprintable_value),
    each run in parallel in its own subtest.
