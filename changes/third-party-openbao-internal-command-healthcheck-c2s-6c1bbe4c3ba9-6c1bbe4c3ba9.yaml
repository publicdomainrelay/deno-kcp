  agentLog: 'This context is the healthcheck package of the vendored OpenBao third-party
    tree, at third_party/openbao/internal/command/healthcheck. It holds a small framework
    and a set of PKI checks built on it. The framework is an Executor that wraps an
    OpenBao api.Client and a mount path, keeps a per-check config map, caches fetched
    API paths so each logical operation reads a path at most once, and runs an ordered
    list of Check values. Each Check reports a name, whether it is enabled, its default
    config, a config loader, a FetchResources phase that pulls remote data through
    the executor, and an Evaluate phase that turns that data into Result values carrying
    a ResultStatus. On top of this framework the package ships PKI checks: audit visibility,
    ACME header allowance, ACME issuance enablement, automatic tidy enablement, CA
    and CRL validity periods, hardware backed root keys, role wildcard and localhost
    allowances, role no-store settings, leaves issued by the root, tidy last run recency,
    and certificate count, plus an If-Modified-Since allowance check. Shared helpers
    parse PEM certificates, validate that a mount has the expected type, coerce config
    values into string lists, and format durations. The package is internal to the
    vendored OpenBao command tree; it is not a cmd/ entrypoint and it defines no flags
    or environment variables of its own.'
