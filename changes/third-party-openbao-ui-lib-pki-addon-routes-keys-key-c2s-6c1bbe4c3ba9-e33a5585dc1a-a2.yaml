  agentLog: 'This context covers two Ember route classes in the OpenBao PKI UI addon
    that serve the key details and key edit pages under the keys.key resource. PkiKeyDetailsRoute
    (third_party/openbao/ui/lib/pki/addon/routes/keys/key/details.js:9) and PkiKeyEditRoute
    (third_party/openbao/ui/lib/pki/addon/routes/keys/key/edit.js:11) both extend
    Ember''s Route, inject the secretMountPath service, and both resolve their model
    by forwarding to the parent keys.key route via modelFor. In setupController each
    route calls super, then writes a four-entry breadcrumb array onto the controller:
    a ''secrets'' link marked linkExternal, the current mount path routed to ''overview''
    with the mount path as its model, a ''keys'' entry routed to ''keys.index'' with
    the same mount path model, and a final non-routed entry whose label is the resolved
    model''s id. The two routes are structurally identical apart from their class
    name and file location, so the details and edit pages present identical breadcrumb
    trails and identical model resolution.'
