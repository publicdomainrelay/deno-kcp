  agentLog: 'Vendored copy of the OpenBao SSH secrets engine, living under third_party/openbao/internal/builtin/logical/ssh.
    The package is a logical backend that mints and signs SSH credentials. It is constructed
    by Backend and exposed to the plugin catalog by Factory, which calls Setup. Its
    API surface is a set of path handlers: CA configuration, named issuer configuration
    and management, zero-address role binding, role storage and validation, certificate
    issue/sign and verify, OTP credential creation backed by a secret type, OTP lookup
    by IP and fetch, and cleanup of stale dynamic host keys. Request and response
    schemas are declared once in fields.go, crypto and conversion helpers in util.go,
    and persistence in storage.go plus storage_migrations.go. OTP generation salts
    a generated one-time password through the backend salt, and issuer key material
    is written through storageContext.ImportIssuer.'
