apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-certutil
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The context exists so deno-kcp can issue, sign and parse X.509 certificates
    and CSRs without reimplementing the OpenBao/Vault PKI core. It provides the reusable
    bundle model and the deterministic, injectable seams (RandomSource and KeyGenerator
    variants) that let callers supply their own entropy reader or key generator, which
    is what makes the package testable and usable for external key material. The spec
    below pins the exported surface and the invariants that surface must keep so downstream
    PKI code can depend on it.
  requirements:
  - id: r.bundle-conversion
    level: MUST
    text: CertBundle.ToParsedCertBundle convert a raw PEM bundle into the parsed form,
      ToParsedCertBundleWithExtractor use the supplied PrivateKeyExtractor to obtain
      external key material, ToPEMBundle reassemble a raw PEM bundle, and ParsedCertBundle.ToCertBundle
      convert back; CSRBundle.ToParsedCSRBundle and ParsedCSRBundle.ToCSRBundle provide
      the matching CSR conversions; OptionalExternalKeyExtractor return the given
      extractor or a nil-safe default.
    codeRefs:
    - function:71e27e1e074c7daec5f5a117fd658ec9
    - method:0098d3a3f254fdbf76fa8ad78880a2ee
    - method:8cb0813a0ea307cbd273751f37becfac
    - method:8f36dd95d1e4495453b8c186cbdd6cf1
    - method:93ee1f9f2095415c34d79be0b50d5b67
    - method:e4a6494e1007ca0c1176b190abdee57e
    - method:f97dc871a5c93c0bfdc9c684d8e016b1
    - type_alias:3c0369aa6f88f9367f008a742cd1d826
  - id: r.bundle-verification
    level: MUST
    text: ParsedCertBundle.Verify check that the stored private key, certificate chain
      and stored key material agree and report an error otherwise, ParsedCertBundle.GetCertificatePath
      return the certificate blocks that form the issuing path, and ParsedCertBundle.GetKeyBits
      report the bit length of the stored private key.
    codeRefs:
    - method:813bafa492ed85a38d523c974c83dd3c
    - method:861600b87978e3e83fc3edfda7e08a50
    - method:fbd4b0758a78465a57d092ab8a4a6b9d
  - id: r.certificate-creation
    level: MUST
    text: CreateCertificate build a parsed certificate bundle from a CreationBundle,
      delegating to CreateCertificateWithRandomSource with crypto/rand and to CreateCertificateWithKeyGenerator
      with the supplied KeyGenerator; CreateCertificateWithTemplate sign against a
      CAInfoBundle using caller-supplied evaluation data and certificate template.
    codeRefs:
    - function:4e9712f901fb801152426facd7ae1793
    - function:5b2fba7d7121f6983eeb8fc8a04cf991
    - function:72967fa5e2e4a53ecf0ae143891e141b
    - function:7415b6eb1dc399910aeb45cd10b7c57e
    - type_alias:9d52cf001e7f570966ac187f3dd96642
  - id: r.certificate-pool-and-public-key-inspection
    level: MUST
    text: NewCertPool read PEM certificates from the supplied reader into an x509.CertPool,
      GetPublicKeySize report the bit size of an RSA, ECDSA, Ed25519 or ML-DSA public
      key, GetPublicKeyType map a public key to its PrivateKeyType, and GetMLDSAParameterSetLabel
      report the ML-DSA parameter set label of a key.
    codeRefs:
    - function:ad0eb7790ed8e25af975db3021db1f5c
    - function:b3ae0be0192d5537a23508fbd70a1d54
    - function:cfe1676918218d8cb73df28bfa2a4f84
    - function:f3b2b8d406d4eddbd852d874c26306a7
  - id: r.certificate-signing
    level: MUST
    text: SignCertificate issue a certificate from a CreationBundle, delegating to
      SignCertificateWithRandomSource with crypto/rand, and SignCertificateWithTemplate
      issue one from a caller-supplied certificate request, evaluation data and template
      against a CAInfoBundle.
    codeRefs:
    - function:265419b99c324ffd6a97f938bf8e67fb
    - function:2a852689b1d2c1530dae5a7a7cecca45
    - function:46c5887c68146a5848cf0b8ca1aae665
  - id: r.crl-and-basic-constraint-extensions
    level: MUST
    text: CreateDeltaCRLIndicatorExt encode a delta CRL indicator extension carrying
      the complete CRL number, CreateFreshestCRLExt encode a freshest CRL extension
      over the given distribution paths, CreateBasicConstraintExtension encode a basic
      constraints extension from the CA flag and maximum path length, and ParseBasicConstraintExtension
      decode such an extension back into the CA flag and path length.
    codeRefs:
    - function:13b96c93120335518df3d3e0b3f6d972
    - function:2b82ecb6ec45e273929263b33ebc2d1b
    - function:a4cd0c670f2ac9f7462ebd95202fc49f
    - function:cc08d68277fdfc2d4a425076442e8889
  - id: r.csr-creation
    level: MUST
    text: CreateCSR build a parsed CSR bundle from a CreationBundle, optionally adding
      basic constraints, and route through CreateCSRWithRandomSource and CreateCSRWithKeyGenerator
      so callers can override the entropy reader and the key generator.
    codeRefs:
    - function:28827c8b61a4e84deeb30396a1adda23
    - function:c0dbf1d8c32f645cfc37528682075df4
    - function:c9ba9ad0fe51ac3b81fba19f5ba9ec30
  - id: r.hex-byte-format
    level: MUST
    text: GetHexFormatted render every byte of the input buffer as two lowercase hexadecimal
      digits, inserting the given separator between bytes and no separator before
      the first or after the last; ParseHexFormatted reverse that rendering by splitting
      on the separator and parsing each field as a base-16 byte, returning nil instead
      of a partial buffer when any field fails to parse.
    codeRefs:
    - file:third_party/openbao/sdk/helper/certutil/helpers.go
    - function:6b0ae26f4b5d7b3d70eaedb43292885a
    - function:6cc1b7ebce81e57ec2b40e80bfc64f6f
  - id: r.key-and-bundle-parsing
    level: MUST
    text: ParseDERKey and ParsePEMKey return a crypto.Signer together with the BlockType
      that names the encoding they found, and ParsePEMBundle return a fully populated
      ParsedCertBundle from a PEM bundle string; ParsePKIMap decode a generic map
      into a CertBundle and hand it to the parsed-bundle conversion, surfacing decode
      failures as a user error, and ParsePKIJSON do the same for a JSON byte slice.
    codeRefs:
    - function:0a7f2d501161b043fb2995f0a153c68b
    - function:0fdac3e716fa7d05f89deb80380ed47b
    - function:8b3855b2639ae257b54d5f1d2b2ecc9a
    - function:e5274aed47b4c73183f08c085a1241a1
    - function:fcabedf8f57cab17de957763d1c536f9
  - id: r.key-bits-validation
    level: MUST
    text: DefaultOrValueKeyBits and ValidateDefaultOrValueKeyTypeLength and ValidateDefaultOrValueKeyTypeSignatureLength
      resolve a zero bit length to the default for the key type and reject an explicitly
      requested length that the type does not support, while ValidateSignatureLength
      and ValidateKeyTypeLength reject unsupported type and hash-length combinations
      outright.
    codeRefs:
    - function:0376b30eb1aa077dfd9bad274eb2912c
    - function:339b6f9d0eb4d66e0b52d68697c667bd
    - function:9d8b42e48379b367188ac7efab419694
    - function:ba20fc2be29d9adfafe4249f48e2444d
    - function:d17e3e00e326b031a6d611db4bd624fb
  - id: r.key-bundle-construction
    level: MUST
    text: CreateKeyBundle return a KeyBundle of the requested type and bit length
      using the supplied reader, and CreateKeyBundleWithKeyGenerator use the supplied
      KeyGenerator instead of the built-in one.
    codeRefs:
    - function:3fcfe8a23047ebda8aed35e16ea0a9f2
    - function:5b4c9526744c7b7558a21b5d3ec7e2b7
  - id: r.key-type-derivation
    level: MUST
    text: GetPrivateKeyTypeFromSigner map a crypto.Signer to the PrivateKeyType that
      names its algorithm, and KeyBundle.ToPrivateKeyPemString serialize the bundle's
      private key back to a PEM string.
    codeRefs:
    - function:1f552596ba67b65eae92216834a6852b
    - method:d2b3e0031a1feed3e525432bfdbe0705
    - type_alias:147d71ecbb08ed568d334dded8045bd0
  - id: r.not-after-behavior-labels
    level: MUST
    text: NotAfterBehavior.String return the stored label for the not-after handling
      mode so the mode survives a round trip through textual configuration.
    codeRefs:
    - method:1ae6d7c651fd4cf2326c5ca12dd08eea
    - type_alias:eed31f0843b1392b61284038f6d6345d
  - id: r.oid-and-san-handling
    level: MUST
    text: StringToOid parse a dotted numeric string into an ASN.1 object identifier
      and fail on malformed input, HandleOtherSANs write non-standard subject alternative
      names onto a certificate and HandleOtherCSRSANs write them onto a certificate
      request, both rejecting unsupported SAN keys.
    codeRefs:
    - function:42ec8afa473528553abd99780d4c59f7
    - function:d0fe5cf685cb3355202ab5d337056457
    - function:d3564934772805b161d2801faa20727b
  - id: r.package-self-contained
    level: SHOULD
    text: The certutil package stay self-contained under third_party with its four
      files, depending only on the standard library crypto packages, the OpenBao internal
      error helpers and the ML-DSA package, and keep certutil_test.go and helpers_test.go
      covering the helper paths so a vendored copy can be updated wholesale.
    codeRefs:
    - file:third_party/openbao/sdk/helper/certutil/certutil_test.go
    - file:third_party/openbao/sdk/helper/certutil/helpers.go
    - file:third_party/openbao/sdk/helper/certutil/helpers_test.go
    - file:third_party/openbao/sdk/helper/certutil/types.go
  - id: r.parsed-private-key-container
    level: MUST
    text: The ParsedPrivateKeyContainer interface declare SetParsedPrivateKey and
      be implemented by ParsedCertBundle, ParsedCSRBundle and KeyBundle so a generated
      or parsed signer, its private key type and its raw bytes are stored uniformly
      on every bundle that can hold a private key.
    codeRefs:
    - interface:49a9b2a1ccd98566337696050d0057cd
    - method:4b0874a6b7802a7668857a9d60fc7abe
    - method:6a39fb976caf739b1325585dc1ffd795
    - method:73078b1ca6ee719e0685db4884765cba
    - method:a01bb9db8e8bebb1e44513797615f993
  - id: r.private-key-generation
    level: MUST
    text: GeneratePrivateKey generate a private key of the requested type and bit
      length into the supplied ParsedPrivateKeyContainer using the crypto/rand source,
      and GeneratePrivateKeyWithRandomSource do the same while reading entropy from
      the caller-provided reader so callers can pin determinism.
    codeRefs:
    - function:63f39b7b3124660d0a41cb437600a6d4
    - function:833f97d0b04f06af7e1d14170e2c233b
  - id: r.public-key-comparison
    level: MUST
    text: ComparePublicKeys report whether two public keys carry the same key material
      and ComparePublicKeysAndType additionally require the two keys to share a key
      type, both returning an error rather than a false result when a key cannot be
      interpreted.
    codeRefs:
    - function:bbe8f31af6131f678c06f32bdaa7f41c
    - function:c8c8cf1a306c02543dbf9b14837a2148
    - function:d92a2684c31945feab4c1b6c471db627
  - id: r.serial-number-generation
    level: MUST
    text: GenerateSerialNumber produce a certificate serial number from the crypto/rand
      source and GenerateSerialNumberWithRandomSource produce one from the caller-supplied
      reader, both returning the number as a big.Int and an error when the source
      fails.
    codeRefs:
    - function:232d7f231c6c10cf085afdcf705ccb6c
    - function:3eb22aa2cbcba0ca20230bee4155af9b
  - id: r.subject-key-id
    level: MUST
    text: GetSubjKeyID derive the subject key identifier as the SHA-1 hash of the
      marshaled public key per RFC 5280 section 4.2.1.2, returning an internal error
      when the signer is nil; GetSubjectKeyID accept an RSA, ECDSA, Ed25519 or ML-DSA
      public key, marshal the RSA key as PKCS#1 and take the ECDSA and Ed25519 and
      ML-DSA encodings directly, and reject any other public key type with an internal
      error naming the type.
    codeRefs:
    - function:55112192ada193ee197162fb1d8f4bd5
    - function:5dd6b6c88f931c1bec2b6201983a7d65
  - id: r.tls-config-and-ca-chain
    level: MUST
    text: ParsedCertBundle.GetTLSConfig build a *tls.Config for the requested TLSUsage
      from the bundle's certificate and key, and CAInfoBundle.GetCAChain and CAInfoBundle.GetFullChain
      return respectively the CA certificates and the full issuing chain as certificate
      blocks.
    codeRefs:
    - method:07710caea8555439c2b3f8282510b397
    - method:7a9c3b9a9fca4df36ef3753f4644c3d5
    - method:f26da7cd68a8dee286e6c9700a1ade27
    - type_alias:d3401168ee9846624f77bf26d02dd43d
  - id: r.usage-and-policy-extensions
    level: MUST
    text: AddKeyUsages and AddExtKeyUsageOids apply the key usage bits and extended
      key usage OIDs held on the CreationBundle to the certificate template, AddPolicyIdentifiers
      apply the configured policy identifiers, and GetPolicyIdentifierFromString parse
      a stored policy string into a PolicyIdentifierWithQualifierEntry that CreatePolicyInformationExtensionFromStorageStrings
      can turn into a pkix extension.
    codeRefs:
    - function:11bcdc15ddced7955980d5a8e7bdc6ee
    - function:591f11aaaa306b4b643dcde35ee41973
    - function:d4174ca444722aea5bf02f6f873f3d9c
    - function:f7fd4c1e83d181bbb120e46cb0aef7ba
    - function:ff46223bfeb7247ec80d247dd3fbaeab
    - struct:bff9ed8e5cb9e6a48591c1aa727503e9
