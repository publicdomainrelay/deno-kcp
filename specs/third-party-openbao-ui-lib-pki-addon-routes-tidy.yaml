apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:0c6fa2442378e648a8384f41475dcbf5 PkiTidyManualRoute@third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js:11
- class:31be8b2e00256012008212b057cecbb0 PkiTidyIndexRoute@third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js:7
- class:678ce8c2848108638f633bf218a253cb PkiTidyAutoRoute@third_party/openbao/ui/lib/pki/addon/routes/tidy/auto.js:3
- file:third_party/openbao/ui/lib/pki/addon/routes/tidy/auto.js auto.js@third_party/openbao/ui/lib/pki/addon/routes/tidy/auto.js
- file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js index.js@third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
- file:third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js manual.js@third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki-addon-routes-tidy
  namespace: default
spec:
  intent: This context exists to pin down the routing and controller-wiring behaviour
    of the PKI tidy feature in the vendored OpenBao UI, so that changes to the tidy
    status polling, the auto-tidy view model, or the manual tidy form's record creation
    and breadcrumbs can be made without breaking the rest of the addon. It is a slice
    of third_party code rather than first-party code, so the spec records what these
    three route modules actually do — the endpoints they call, the services they inject,
    the model keys they expose and the lifecycle hooks they implement — as the contract
    other route, controller and template modules in the same addon depend on.
  interfaces:
  - file: third_party/openbao/ui/lib/pki/addon/routes/tidy/auto.js
    kind: class
    name: PkiTidyAutoRoute
    signature: PkiTidyAutoRoute()
  - file: third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    kind: class
    name: PkiTidyIndexRoute
    signature: PkiTidyIndexRoute()
  - file: third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js
    kind: class
    name: PkiTidyManualRoute
    signature: PkiTidyManualRoute()
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:678ce8c2848108638f633bf218a253cb
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/auto.js
    id: r.tidy-auto-model-from-parent
    level: MUST
    text: PkiTidyAutoRoute.model calls modelFor('tidy'), destructures autoTidyConfig
      from the parent tidy model and returns it unchanged, so the auto-tidy route
      never issues its own network request and always reflects the configuration already
      resolved by the parent route.
  - codeRefs:
    - class:31be8b2e00256012008212b057cecbb0
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    id: r.tidy-index-model-hash
    level: MUST
    text: PkiTidyIndexRoute.model reads hasConfig, autoTidyConfig and engine from
      modelFor('tidy') and returns hash() combining the promise from fetchTidyStatus
      with those three values, so the status template sees the fetch result and the
      parent configuration together.
  - codeRefs:
    - class:31be8b2e00256012008212b057cecbb0
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    id: r.tidy-index-reset-controller
    level: MUST
    text: PkiTidyIndexRoute.resetController cancels all running pollTidyStatus tasks
      when isExiting is true, preventing the status poll from surviving after the
      user leaves the route; on any other exit it leaves polling untouched.
  - codeRefs:
    - class:31be8b2e00256012008212b057cecbb0
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    id: r.tidy-index-setup-controller
    level: MUST
    text: PkiTidyIndexRoute.setupController calls super.setupController, sets controller.notConfiguredMessage
      to PKI_DEFAULT_EMPTY_STATE_MSG, assigns resolvedModel.tidyStatus and this.fetchTidyStatus
      onto the controller, and starts polling by performing controller.pollTidyStatus.
  - codeRefs:
    - class:31be8b2e00256012008212b057cecbb0
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    id: r.tidy-index-status-fetch
    level: MUST
    text: PkiTidyIndexRoute.fetchTidyStatus resolves the application adapter through
      the injected store and issues a GET to `/v1/${this.secretMountPath.currentPath}/tidy-status`,
      then stamps the returned payload with responseTimestamp from timestamp.now()
      and returns tidyStatusResponse.data.
  - codeRefs:
    - class:0c6fa2442378e648a8384f41475dcbf5
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js
    id: r.tidy-manual-breadcrumbs
    level: MUST
    text: 'PkiTidyManualRoute.setupController calls super.setupController and then
      sets controller.breadcrumbs to the five-entry chain: secrets linked externally,
      the current secret mount path routed to overview with the path as its model,
      configuration.index, tidy, and the unlinked manual leaf — each of the first
      four entries carrying secretMountPath.currentPath in its models array.'
  - codeRefs:
    - class:0c6fa2442378e648a8384f41475dcbf5
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js
    id: r.tidy-manual-new-record
    level: MUST
    text: PkiTidyManualRoute.model creates an unsaved pki/tidy record through the
      store with backend set to secretMountPath.currentPath, so the manual tidy form
      starts from a blank record bound to the current mount.
  - codeRefs:
    - class:0c6fa2442378e648a8384f41475dcbf5
    - class:31be8b2e00256012008212b057cecbb0
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/index.js
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy/manual.js
    id: r.tidy-services-injected
    level: MUST
    text: PkiTidyIndexRoute and PkiTidyManualRoute each inject the store and secretMountPath
      services, and both use secretMountPath.currentPath as the backend path they
      operate on.
  upstream: self
