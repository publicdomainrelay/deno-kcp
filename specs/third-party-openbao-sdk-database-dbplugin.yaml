      *RevokeUserRequest) (*Empty, error); RotateRootCredentials(context.Context,
      *RotateRootCredentialsRequest) (*RotateRootCredentialsResponse, error); Init(context.Context,
      *InitRequest) (*InitResponse, error); Close(context.Context, *Empty) (*Empty,
