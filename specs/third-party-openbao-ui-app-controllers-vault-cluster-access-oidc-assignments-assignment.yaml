apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-oidc-assignments-assignment
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This controller exists to back the detail view of one OIDC assignment in
    the OpenBao web UI. It gives that view the behaviour needed to remove the assignment
    record and to tell the user what happened, so the UI file itself stays presentational
    and the deletion, feedback and navigation logic live in one place.
  requirements:
  - id: r.default-export-controller
    level: MUST
    text: The module exports OidcAssignmentDetailsController as its default, and the
      class extends Ember Controller. It injects the router service so it can navigate,
      and the flashMessages service so it can report outcomes to the user.
    codeRefs:
    - class:e712beb9955686afdceaf183bde6f15b
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/assignments/assignment/details.js
  - id: r.delete-action-failure
    level: MUST
    text: If destroying the record fails, the delete action catches the error, rolls
      the model back with rollbackAttributes so no half-deleted state is shown, and
      pushes a danger flash message. The message body is error.errors joined with
      '. ' when that array is present, and otherwise error.message.
    codeRefs:
    - class:e712beb9955686afdceaf183bde6f15b
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/assignments/assignment/details.js
  - id: r.delete-action-success
    level: MUST
    text: The delete action is exposed as an Ember action and is async. On success
      it destroys the current model record with destroyRecord, pushes a success flash
      message with the text 'Assignment deleted successfully', then calls transitionToSafe
      with the router and the route 'vault.cluster.access.oidc.assignments' to leave
      the detail page.
    codeRefs:
    - class:e712beb9955686afdceaf183bde6f15b
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/assignments/assignment/details.js
  interfaces:
  - name: OidcAssignmentDetailsController
    kind: class
    signature: export default class OidcAssignmentDetailsController extends Controller
    file: third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/assignments/assignment/details.js
codeRefIndex:
