apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-database-postgresql-postgresql-database-plugin
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists to pin down the executable entrypoint that registers
    the PostgreSQL database plugin with OpenBao''s dbplugin RPC layer. It is a packaging
    and wiring artifact, not behavior: its whole job is to hand a constructor, postgresql.New,
    to dbplugin.ServeMultiplex so the plugin binary can be spawned as a separate process
    and satisfy the dbplugin.Database interface (Initialize, NewUser, UpdateUser,
    DeleteUser, Type, Close). Anyone asking where the PostgreSQL database plugin process
    starts, or which constructor a build must link, gets that answer here.'
  requirements:
  - id: r.main-invokes-run
    level: MUST
    text: The package main function must call Run to start the plugin's RPC server.
    codeRefs:
    - file:third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
  - id: r.no-database-logic-in-entrypoint
    level: SHOULD
    text: 'The plugin entrypoint should stay a thin shim: PostgreSQL connection and
      credential logic should live in the postgresql package reached through postgresql.New,
      not in this file.'
    codeRefs:
    - file:third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
    - function:272db5b46bd8b16153d2b40a43c9e229
  - id: r.run-serves-postgresql-database-plugin
    level: MUST
    text: Run must instantiate the PostgreSQL database object by passing the postgresql.New
      constructor to dbplugin.ServeMultiplex, and must return nil after serving starts.
    codeRefs:
    - file:third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
    - function:272db5b46bd8b16153d2b40a43c9e229
  interfaces:
  - name: Run
    kind: function
    signature: func Run() error
    file: third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
codeRefIndex:
- file:third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
  main.go@third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go
- function:272db5b46bd8b16153d2b40a43c9e229 Run@third_party/openbao/internal/builtin/database/postgresql/postgresql-database-plugin/main.go:23
