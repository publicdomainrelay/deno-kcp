    id: r.config-schema-blocks
    level: MUST
    text: 'Config is the decoded agent configuration: Retry, Vault, APIProxy, Cache,
      AutoAuth, Method, Sink, TemplateConfig and ExecConfig are the HCL blocks LoadConfigFile
      decodes into it, so the loader''s field names and block names stay in step with
      the schema.'
  - codeRefs:
    - method:159bd10ec29b623bd2509959fbb3378d
    id: r.is-default-lister-defined
    level: MUST
    text: Config.IsDefaultListerDefined reports whether the config defines a listener
      at the default address, which drives the listener-related validation and defaults.
  - codeRefs:
    - function:cdf4d68dbad872e3cc019b30335916e8
    - method:14758788adb7aaacf8bc499df1e36609
    id: r.load-config-dir-merge
    level: MUST
    text: LoadConfigDir reads every configuration file in the directory and folds
      them into a single Config by merging, so later files override earlier ones instead
      of replacing the whole config.
  - codeRefs:
    - function:7d03046ef74c3b4828473c26ca07b14e
    - function:7de4097c49ecd17b3154c91c54c4bc66
    - function:cdf4d68dbad872e3cc019b30335916e8
    id: r.load-config-dispatch
    level: MUST
    text: LoadConfig takes a path and returns a *Config plus error; when the path
      names a directory it delegates to LoadConfigDir, otherwise it delegates to LoadConfigFile,
      so callers get one entry point for either source shape.
  - codeRefs:
    - function:7de4097c49ecd17b3154c91c54c4bc66
    - struct:ac66f17e5f4fabf2cf84d94fb54cb5ec
    id: r.load-config-file-hcl
    level: MUST
    text: LoadConfigFile reads one file, parses its HCL body into a *Config, records
      which keys were found and which were unused, and returns an error when the file
      cannot be read or decoded.
  - codeRefs:
    - file:third_party/openbao/internal/command/agent/config/config_test.go
    - method:2de5b2addd58dfa33ca845032bbc3fda
    id: r.loader-behaviour-tested
    level: SHOULD
    text: config_test.go should keep covering LoadConfigFile and LoadConfigDir across
      the cache, listener, auto-auth, vault, retry and templating blocks, pruning
      the parsed config before comparing it, so schema and loader changes are caught.
  - codeRefs:
    - file:third_party/openbao/internal/command/agent/config/config.go
    - method:14758788adb7aaacf8bc499df1e36609
    id: r.merge-overlay
    level: MUST
    text: Config.Merge takes a second Config and returns the receiver with the second
      config's set values applied on top, leaving unset fields at their existing values.
  - codeRefs:
    - function:294cb86e42204c2b1e779df712442e7c
    - struct:ac66f17e5f4fabf2cf84d94fb54cb5ec
    id: r.new-config-defaults
    level: MUST
    text: NewConfig returns a *Config pre-populated with the default agent settings,
      so callers have a base to merge parsed files onto.
  - codeRefs:
    - method:2de5b2addd58dfa33ca845032bbc3fda
    - struct:ac66f17e5f4fabf2cf84d94fb54cb5ec
    id: r.prune-clears-parse-bookkeeping
    level: MUST
    text: Config.Prune clears RawConfig, Profiling.UnusedKeys, Telemetry.UnusedKeys
      and CustomResponseHeaders on every listener, and nils FoundKeys and UnusedKeys
      on the config and on the telemetry block, so a loaded config carries no raw
      input or unused-key bookkeeping.
  - codeRefs:
    - struct:ddbfb0c13f698324033d443acb021af5
    id: r.retry-num-retries
    level: MUST
    text: Retry carries a single NumRetries int decoded from the HCL key "num_retries",
      giving the Vault block its retry count.
  - codeRefs:
    - method:33819d9eb533c481516c0e9f498b0efe
    - method:d51536a7e952ec0386af644c07169ec3
    id: r.transport-dialer-contract
    level: MUST
    text: The transportDialer interface requires Dial(network, address string) (net.Conn,
      error) and DialContext(ctx context.Context, network, address string) (net.Conn,
      error), matching net.Dialer, so the config can accept any dialer with the standard
      net signatures.
  - codeRefs:
    - method:159bd10ec29b623bd2509959fbb3378d
    - method:8fb9e5ef63e7856d62d727089b7b3173
    id: r.validate-config
    level: MUST
    text: Config.ValidateConfig returns an error when the assembled config is not
      usable, including checks around the default lister and the env template configuration,
      so a bad config fails before the agent starts.
  upstream: self
