kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agent-config
  namespace: default
spec:
  intent: 'This context exists so the OpenBao agent can be configured from files:
    it owns the schema of the agent configuration, the parsing of HCL config files
    and directories, the merge of several sources into one effective Config, validation
    of the result, and cleanup of parse bookkeeping before the config is used or printed.
    It is the config layer of third_party/openbao that the agent command depends on,
    and its behaviour is pinned by config_test.go.'
