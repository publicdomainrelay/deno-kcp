apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-identitytpl
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so that identity-aware strings in OpenBao policies and
    JSON payloads can be expanded from an entity, its aliases, its group memberships
    and metadata, without each caller reimplementing template parsing. It is a vendored
    third-party helper inside the deno-kcp repository, kept in third_party so the
    surrounding Go code can reference OpenBao templating semantics with a stable local
    copy. The spec pins the observable contract of PopulateString and the shape of
    its input struct so that changes to the vendored copy stay visible and callers
    can rely on specific return values and error conditions.
  requirements:
  - id: r.blocked-substitutions
    level: MUST
    text: After expanding each templated segment, PopulateString must check the expanded
      text against every entry in BlockedSubstitutions and return an error wrapping
      ErrTemplateWildcard, quoting the offending blocked value, on the first match.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
    - struct:dd4409fc828faf633e005ced43289975
  - id: r.empty-string-passthrough
    level: MUST
    text: PopulateString must treat an empty input String as a no-op and return false,
      the empty string, and a nil error, without inspecting the mode or entity.
    codeRefs:
    - file:third_party/openbao/sdk/helper/identitytpl/templating.go
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
  - id: r.group-preprocessing
    level: MUST
    text: PopulateString must flatten the input Groups into parallel groupNames and
      groupIDs slices before templating, so that templating tokens over groups can
      read names and IDs positionally.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
    - struct:dd4409fc828faf633e005ced43289975
  - id: r.mode-handler-selection
    level: MUST
    text: PopulateString must select an internal template handler from Mode, using
      the ACL handler for ACLTemplating and the JSON handler for JSONTemplating, and
      must fail with an error of the form "unknown mode %v" for any other mode value.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
    - struct:dd4409fc828faf633e005ced43289975
  - id: r.no-delimiter-passthrough
    level: MUST
    text: PopulateString must return false and the original String unchanged when
      the input contains no opening delimiter, so strings without templates pass through
      untouched.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
  - id: r.substitution-flag
    level: MUST
    text: PopulateString must report true as its first return value whenever at least
      one well-formed templated segment was found, and false otherwise, independent
      of whether output text was actually built.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
  - id: r.template-input-fields
    level: MUST
    text: PopulateStringInput must carry the template String, the ValidityCheckOnly
      flag, the Entity and Groups that substitutions read from, the NamespaceID, the
      Mode selecting ACL or JSON templating, an optional Now used as the reference
      time for time tokens, and the optional BlockedSubstitutions list, with handler
      and derived group slices kept unexported.
    codeRefs:
    - file:third_party/openbao/sdk/helper/identitytpl/templating.go
    - struct:dd4409fc828faf633e005ced43289975
  - id: r.test-coverage
    level: SHOULD
    text: The package should keep table-driven tests that exercise PopulateString
      through TestPopulate_Basic, TestPopulate_CurrentTime and TestPopulate_FullObject,
      covering time arithmetic tokens, metadata and custom-metadata lookups, nil entities,
      blocked substitutions and validity-only runs.
    codeRefs:
    - file:third_party/openbao/sdk/helper/identitytpl/templating_test.go
  - id: r.unbalanced-characters
    level: MUST
    text: PopulateString must return ErrUnbalancedTemplatingCharacter when a closing
      "}}" appears before any opening "{{", and also when a segment after an opening
      delimiter does not contain exactly one closing "]}" pair, so malformed templates
      never produce partial output.
    codeRefs:
    - file:third_party/openbao/sdk/helper/identitytpl/templating.go
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
  - id: r.validity-check-only
    level: MUST
    text: When ValidityCheckOnly is set on the input, PopulateString must validate
      structure and report substitution without invoking performTemplating or writing
      any text into the builder, so the returned string is empty while syntax errors
      still surface.
    codeRefs:
    - function:8a7ad43cd54daad745ecbf63b34f1b0b
    - struct:dd4409fc828faf633e005ced43289975
  interfaces:
  - name: PopulateString
    kind: function
    signature: (p PopulateStringInput) (bool, string, error)
    file: third_party/openbao/sdk/helper/identitytpl/templating.go
  - name: PopulateStringInput
    kind: struct
    signature: type PopulateStringInput struct
    file: third_party/openbao/sdk/helper/identitytpl/templating.go
codeRefIndex:
- file:third_party/openbao/sdk/helper/identitytpl/templating.go templating.go@third_party/openbao/sdk/helper/identitytpl/templating.go
- file:third_party/openbao/sdk/helper/identitytpl/templating_test.go templating_test.go@third_party/openbao/sdk/helper/identitytpl/templating_test.go
- function:8a7ad43cd54daad745ecbf63b34f1b0b PopulateString@third_party/openbao/sdk/helper/identitytpl/templating.go:107
