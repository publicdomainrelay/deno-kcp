kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agentproxyshared-cache-cacheboltdb
  namespace: default
spec:
  intent: This context exists so the agent proxy cache can survive restarts. It gives
    the lease cache a disk-backed persistent storage layer whose contents are encrypted
    at rest and whose schema can be upgraded in place. It is the bolt-backed implementation
    of the persistent cache contract, keeping leases ordered so parents are restored
    before children and keeping the latest auto-auth and retrieval tokens available
    for restore.
  interfaces:
