    kind: struct
    name: BoltStorage
    signature: type BoltStorage struct { db *bolt.DB; logger hclog.Logger; wrapper
      wrapping.Wrapper; aad string }
  - file: third_party/openbao/internal/command/agentproxyshared/cache/cacheboltdb/bolt.go
