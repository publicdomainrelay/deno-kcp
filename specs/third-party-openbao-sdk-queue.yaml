apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-queue
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists to record the vendored OpenBao SDK priority queue that
    this repository carries under third_party, so that its contract, its exported
    surface and its locking and copy semantics are described from the code as it stands
    rather than inferred. It matters because the package is third-party code retained
    verbatim except for the queue import path, and anything that consumes it needs
    to know that ordering is lowest-int64-wins, that keys are unique and immutable
    once pushed, that pushes clone their input, and that every public operation is
    mutex-guarded.
  requirements:
  - id: r.construction
    level: MUST
    text: New MUST return a *PriorityQueue whose heap slice and key map are both allocated
      empty, and the slice MUST be initialized through heap.Init so the queue is immediately
      usable.
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue.go
    - function:8c560b7d1b2182d690d8e2257c10f53c
  - id: r.data-map-sync
    level: MUST
    text: The dataMap keyed by Item.Key MUST stay in sync with the heap slice at all
      times, so that after any Push, Pop or PopByKey the map length equals the slice
      length and every map value points at the item held in the slice.
    codeRefs:
    - method:1e21ef9ecdbf74b7d1e82434a43b4fdc
    - method:329614106bb685f4fd551d53358daa97
    - method:e1751c7c2e16c44f7f95a526c610a29c
    - struct:d57b802de9250e42431273c1d2a8d46b
  - id: r.heap-interface
    level: MUST
    text: The unexported queue type MUST satisfy container/heap.Interface, with queue.Len
      reporting the slice length, queue.Swap exchanging elements in place, queue.Push
      appending an item, and queue.Pop removing the last element and clearing the
      vacated slot to avoid a memory leak.
    codeRefs:
    - method:34a9d798013468550f8b53ff68d3cd8d
    - method:63fa393a0e2e4d628f37acdd4f732467
    - method:6d4de202ef0f1f820ef44d730d9197f6
    - method:9d3108c5979daba6563ca673841d8f9b
  - id: r.index-maintenance
    level: MUST
    text: Swap, queue.Push and queue.Pop MUST keep each Item's unexported index field
      equal to its position in the heap slice, since heap.Remove and heap.Fix locate
      items by that index; queue.Pop MUST set the removed item's index to -1.
    codeRefs:
    - method:34a9d798013468550f8b53ff68d3cd8d
    - method:63fa393a0e2e4d628f37acdd4f732467
    - method:6d4de202ef0f1f820ef44d730d9197f6
  - id: r.item-fields
    level: MUST
    text: Item MUST expose Key as the unique string identifier, Value as an any-typed
      payload for callers, and Priority as the int64 ordering key, and MUST keep the
      heap bookkeeping index unexported so consumers cannot corrupt it.
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue.go
    - struct:54b043abf4de82c270fabef9612f374a
  - id: r.locked-access
    level: MUST
    text: 'Every operation that touches the heap slice or the key map MUST hold the
      PriorityQueue mutex: Len takes a read lock, while Pop, Push and PopByKey take
      the write lock for their full body.'
    codeRefs:
    - method:329614106bb685f4fd551d53358daa97
    - method:f985a2dedd426f7289a840dbcd24e30c
    - struct:d57b802de9250e42431273c1d2a8d46b
  - id: r.pop-by-key
    level: MUST
    text: PopByKey MUST return (nil, nil) when the key is absent, and when present
      MUST remove the item from the heap with heap.Remove using the item's stored
      index, delete the key from dataMap, and return the removed item.
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue.go
    - method:e1751c7c2e16c44f7f95a526c610a29c
  - id: r.pop-empty-error
    level: MUST
    text: Pop MUST return ErrEmpty when the queue holds no items, and otherwise MUST
      remove and return the highest priority item while deleting its key from dataMap.
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue.go
    - method:329614106bb685f4fd551d53358daa97
  - id: r.priority-ordering
    level: MUST
    text: Ordering MUST be by Item.Priority as an int64 with the lowest value treated
      as highest priority; queue.Less compares q[i].Priority < q[j].Priority, and
      the priority of items with equal values is undetermined.
    codeRefs:
    - method:27eeaabf9bcda277d96139bcd9789878
    - struct:54b043abf4de82c270fabef9612f374a
  - id: r.push-clones-item
    level: MUST
    text: Push MUST deep-copy the item with copystructure.Copy before storing it,
      so the queued entry and the dataMap entry are the clone and later modification
      of the caller's item cannot affect the queue.
    codeRefs:
    - method:1e21ef9ecdbf74b7d1e82434a43b4fdc
    - struct:54b043abf4de82c270fabef9612f374a
  - id: r.push-validation
    level: MUST
    text: 'Push MUST reject a nil item or an item with an empty Key by returning the
      error "error adding item: Item Key is required", and MUST reject a Key that
      is already in dataMap by returning ErrDuplicateItem rather than updating the
      existing entry.'
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue.go
    - method:1e21ef9ecdbf74b7d1e82434a43b4fdc
  - id: r.test-coverage
    level: SHOULD
    text: The package tests SHOULD assert heap.Interface conformance for queue at
      compile time and cover New leaving both structures empty, Push rejecting nil,
      duplicate and keyless items, Pop returning items in ascending priority together
      with their keys, PopByKey returning no error for a missing key, and the slice
      and map lengths agreeing after every mutation and drain.
    codeRefs:
    - file:third_party/openbao/sdk/queue/priority_queue_test.go
