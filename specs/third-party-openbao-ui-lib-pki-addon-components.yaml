apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki-addon-components
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'The context exists so PKI UI behaviour is specified rather than re-derived
    from source each time. It records what each component exposes to its template
    and parent route, and what each action must do: which model fields a constructor
    expands into form fields, when a save path validates and persists, when a capability
    probe gates a request, and how TTL, key bits, key usage and file upload inputs
    are normalized before they reach the model. Anyone editing the vendored OpenBao
    UI, or building against it, uses this context to know the component contracts
    without reading all fifteen files.'
  requirements:
  - id: r.certificate-info-row-fields
    level: MUST
    text: ParsedCertificateInfoRowsComponent.possibleFields derives display rows from
      parsedParameterKeys with common_name removed, attaching labels for other_sans,
      alt_names, uri_sans, ip_sans, permitted_dns_domains, exclude_cn_from_sans, use_pss,
      ttl and ou, and attaching the date format 'MMM d yyyy HH:mm:ss a zzzz' to not_valid_after
      and not_valid_before, so the certificate details view renders labeled rows.
    codeRefs:
    - class:f516f6e5fa372924354f163098d73f0f
    - file:third_party/openbao/ui/lib/pki/addon/components/parsed-certificate-info-rows.ts
    - method:a38b2a1c7d534bed9034b98103717793
  - id: r.csr-cancel
    level: MUST
    text: PkiGenerateCsrComponent.cancel unloads the model record and calls the parent-supplied
      onCancel, so abandoning the CSR form leaves no dirty record behind.
    codeRefs:
    - class:459247d6ed1cc91bf34a241c485f1019
    - method:653153a8679ed4d4c26acf2d43187b6d
  - id: r.csr-capability-probe
    level: MUST
    text: PkiGenerateCsrComponent.getCapability awaits model.generateIssuerCsrPath
      and returns true only when the resolved capabilities object has canCreate ===
      true, returning false when the lookup rejects, so an unreachable or forbidden
      issuer path silently disables the issuer-signed path.
    codeRefs:
    - class:459247d6ed1cc91bf34a241c485f1019
    - method:52d0af26bd417187a6d537c7e0c49ab0
  - id: r.csr-form-fields
    level: MUST
    text: PkiGenerateCsrComponent.constructor expands attribute metadata for the model
      fields type, commonName, excludeCnFromSans, format, subjectSerialNumber and
      addBasicConstraints into formFields, and the class keeps a separate showFields
      list (csr, keyId, privateKey, privateKeyType) for fields rendered only after
      the CSR is generated.
    codeRefs:
    - class:459247d6ed1cc91bf34a241c485f1019
    - file:third_party/openbao/ui/lib/pki/addon/components/pki-generate-csr.ts
    - method:784b6c42d5b6cc2840d4547174b5b798
  - id: r.csr-save
    level: MUST
    text: 'PkiGenerateCsrComponent.save prevents the default submit, validates the
      model and, when valid, yields getCapability then saves the model with adapterOptions
      { actionType: ''generate-csr'', useIssuer }, flashes ''Successfully generated
      CSR.'', invokes the optional onSave side-effect callback and scrolls the window
      to the top; when invalid it stores the validation state and invalidFormMessage
      on the component, and on exception it stores errorMessage(e) and the alert ''There
      was a problem generating the CSR.'''
    codeRefs:
    - class:459247d6ed1cc91bf34a241c485f1019
    - file:third_party/openbao/ui/lib/pki/addon/components/pki-generate-csr.ts
    - method:1f432cd85cc16169169dd2a312e9a0d1
  - id: r.generate-toggle-groups
    level: MUST
    text: PkiGenerateToggleGroupsComponent exposes keyParamFields, computes grouped
      key-parameter field metadata through groups, and toggles a named group's open
      state through toggleGroup(group, isOpen), so key parameter inputs are presented
      as collapsible sections.
    codeRefs:
    - class:73a29f6df7e0f7b1980f902b2439678c
    - method:aaf1480425fedc66e0afc0eb49a26361
    - method:d85e929adc16f01071342776b6322126
    - method:fb82d8e1cf40e96f705eba0b9e520557
  - id: r.import-pem-bundle
    level: MUST
    text: PkiImportPemBundle tracks the imported response for display (importedResponse),
      submits the PEM bundle through submitForm, accepts an uploaded file's contents
      through onFileUploaded({ value }), and cancels back to the parent.
    codeRefs:
    - class:6eedb95b7bb7f744014775b6d3adcc69
    - method:54f1448c9e2322a9a3d166b8d310806e
    - method:72afe8c4dd625152d4707b1774fd8859
    - method:8479e3b52acc06a87699ec64d5f96e84
    - method:d4f49b98faff44cd88c97cc8fb830e7f
  - id: r.issuer-cross-sign
    level: SHOULD
    text: PkiIssuerCrossSign is the component entry point for the issuer cross-sign
      flow and is registered from pki-issuer-cross-sign.js alongside the TypeScript
      generation components.
    codeRefs:
    - class:3c407aa5c5794b12f8698b5f842504df
    - file:third_party/openbao/ui/lib/pki/addon/components/pki-issuer-cross-sign.js
  - id: r.key-form-save
    level: MUST
    text: PkiKeyForm.save handles the form submit event for the key form, so creating
      or updating a key is driven by that action rather than by direct model mutation
      from the template.
    codeRefs:
    - class:91d9ccf7237ee52572095bf33283f754
    - method:f0101aea24e4a0c54ff3b2cd2e5153b0
  - id: r.key-import
    level: MUST
    text: PkiKeyImport submits the key material through submitForm, accepts an uploaded
      file's contents and name through onFileUploaded({ value, filename }), and cancels
      out of the import flow.
    codeRefs:
    - class:448e668669e8081bd29a94f3687853b3
    - method:abf118c4bb8f135c76faf1cc8503b761
    - method:eb78db33c855bbee1b5a148755ce987c
    - method:ef9421b266188b153965261bd02ea991
  - id: r.key-parameters
    level: MUST
    text: PkiKeyParameters derives keyBitOptions from the selected key type, applies
      a field name plus selection through handleSelection(name, selection), and normalizes
      the key-bits input event through onKeyBitsChange(event), keeping the key-size
      selector and its free-input consistent.
    codeRefs:
    - class:ea4f2b5dd094e0e0e084863cd0c5eb7a
    - method:437377083a778e88233451494b18b8a3
    - method:828d007fe5f91a15e0316bab0ea9be31
    - method:f9942f40c14e4439dda05a011f49c072
  - id: r.key-usage
    level: MUST
    text: 'PkiKeyUsage keeps the key-usage value in sync across its two input styles:
      onStringListChange(value: string[]) takes the free-text list and checkboxChange(name,
      value: string[]) takes a named checkbox group''s selected values.'
    codeRefs:
    - class:6948ad372f6a0e4438975220b6284694
    - method:507e0c8417803f4ee99f0b6439592caf
    - method:e19614fd241465d8012f86364f27c5c9
  - id: r.role-form
    level: MUST
    text: PkiRoleForm resolves the issuer list through the issuers getter, saves the
      role through save(event), toggles whether the default issuer field is shown
      through toggleShowDefaultIssuer, and takes its setup arguments through the constructor.
    codeRefs:
    - class:b4cb857a80b349b18f4a6b02e30c9b6d
    - method:0e3a71aef9a1c042abe94f46e01d315b
    - method:431089328fe36118fe720422274d6dd7
    - method:958d6377b9bad5d4fe0492aaebea1b00
    - method:a16b30602868de4b70861f368326f407
  - id: r.role-generate
    level: MUST
    text: PkiRoleGenerate exposes the request verb for the generate endpoint through
      the verb getter, submits the generation request through save(evt), and cancels
      the flow through cancel.
    codeRefs:
    - class:78fec1f6c2d2999a748b7f45e73f98f8
    - method:2ed28c6be683771c3329b7835385e841
    - method:84a03eefe6f0b96ca14dd56725981a5b
    - method:ea2a5a8713d86891a23aa8566833a04d
  - id: r.root-generation-form
    level: MUST
    text: PkiGenerateRootComponent separates the fields presented before generation
      (defaultFields) from the fields returned after generation (returnedFields),
      checks the submitted form's validity, handles submit through save, populates
      the generated URLs through setUrls, and offers cancel to leave the flow.
    codeRefs:
    - class:3cee11a98dd65f131e3dbf31974d1ccc
    - method:13eda11ba9cb482a60c74be7aec2f1c5
    - method:176929b8e81cbbab7a9a6090f01cb338
    - method:2e2a7b98576a62da8c73bd1a79459e96
    - method:32e524a8dd399008e20135fa3b465598
    - method:490a19d0f0e5e234056b086f6a1dfcd8
    - method:fc3824180288424c35ef5bb530deddc3
  - id: r.sign-intermediate-form
    level: MUST
    text: PkiSignIntermediateFormComponent groups its form fields through groups,
      lists the fields shown after signing through showFields, submits through save(event),
      and cancels through cancel.
    codeRefs:
    - class:7beddf2423d7ea73c0c18d31db6e9f49
    - method:5e686c775b68fd0ead84fa02beb8f8dc
    - method:5eb9da8f106ffc3ef5378c30ac4b0b4a
    - method:726f93139821f78dba8ccb9ebc68a895
    - method:e88266e20773f7a4adac004c9da55bf2
  - id: r.tidy-form
    level: MUST
    text: PkiTidyForm supplies the interval duration field attribute through intervalDurationAttr,
      normalizes TTL-style field input through handleTtl(attr, e) before saving, and
      submits the tidy configuration through save(event).
    codeRefs:
    - class:c0c737e4f019a906a66316ea74b9288e
    - method:852a19e9c519495676391652ccf43bad
    - method:e20babed63d3cb86f972f50e74a4076b
    - method:f6fca64f5ae6d4a8dccbe6e416f92e3a
  - id: r.ttl-or-date-selector
    level: MUST
    text: RadioSelectTtlOrString switches a validity field between a TTL string and
      an explicit date, computes a form date from a string through calculateFormDate,
      reacts to the radio selection through onRadioButtonChange(selection), broadcasts
      { enabled, goSafeTimeString } through setAndBroadcastTtl, and broadcasts raw
      input events through setAndBroadcastInput, so parent forms receive one normalized
      not-valid-after value.
    codeRefs:
    - class:7b57c6771c73c805edc7e76169f51c49
    - file:third_party/openbao/ui/lib/pki/addon/components/pki-not-valid-after-form.ts
    - method:2219e02d7490d605c0e62568e60c3a4f
    - method:793363f766ccab48191428bf9feb192e
    - method:8b34db5040531702ef45a544682f7628
    - method:b07890678892bc0eba4e88d503ecc7ba
    - method:dd81f79b63696749b1ce1b65320e7c22
