apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/tools/semgrep/hostport.yml hostport.yml@third_party/openbao/tools/semgrep/hostport.yml
- file:third_party/openbao/tools/semgrep/joinpath.yml joinpath.yml@third_party/openbao/tools/semgrep/joinpath.yml
- file:third_party/openbao/tools/semgrep/lock-not-unlocked-on-return.yml lock-not-unlocked-on-return.yml@third_party/openbao/tools/semgrep/lock-not-unlocked-on-return.yml
- file:third_party/openbao/tools/semgrep/logger-sprintf.yml logger-sprintf.yml@third_party/openbao/tools/semgrep/logger-sprintf.yml
- file:third_party/openbao/tools/semgrep/physical-storage.yml physical-storage.yml@third_party/openbao/tools/semgrep/physical-storage.yml
- file:third_party/openbao/tools/semgrep/replication-has-state.yml replication-has-state.yml@third_party/openbao/tools/semgrep/replication-has-state.yml
- file:third_party/openbao/tools/semgrep/self-equals.yml self-equals.yml@third_party/openbao/tools/semgrep/self-equals.yml
kind: SystemContext
metadata:
  name: third-party-openbao-tools-semgrep
  namespace: default
spec:
  intent: 'The context exists to statically catch Go mistakes that are cheap to make
    and expensive to debug: host/port concatenation done with fmt.Sprintf instead
    of net.JoinHostPort, path joining done with strings.Join, mutexes locked but not
    unlocked on a return branch, logger messages built with fmt.Sprintf, direct physical-storage
    access that bypasses encryption, replication state checks that should use IsPerfSecondary/IsDRSecondary
    helpers, and self-comparison expressions. It is a vendored copy, so it must keep
    the upstream rule ids, severities, messages, and suppression patterns intact so
    results stay comparable with upstream OpenBao.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/hostport.yml
    - file:third_party/openbao/tools/semgrep/joinpath.yml
    - file:third_party/openbao/tools/semgrep/lock-not-unlocked-on-return.yml
    - file:third_party/openbao/tools/semgrep/logger-sprintf.yml
    - file:third_party/openbao/tools/semgrep/physical-storage.yml
    - file:third_party/openbao/tools/semgrep/replication-has-state.yml
    - file:third_party/openbao/tools/semgrep/self-equals.yml
    id: r.go-only-scope
    level: MUST
    text: 'Every rule in every file of this context must declare languages: [go],
      so the rule set never reports on the non-Go code vendored in the same tree.'
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/hostport.yml
    id: r.host-port-flagging
    level: MUST
    text: hostport.yml must define Go rule sprintf-host-port at severity ERROR. It
      matches fmt.Sprintf calls that build a host:port string, either the literal
      formats "%s:%s" and "%s:%d" or a dynamic format string matching "%s:[0-9]+",
      and only when the other metavariable name matches the case-insensitive regex
      .*(port|addr|host|listen|bind|ip). The reported message tells the author to
      use net.JoinHostPort instead.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/lock-not-unlocked-on-return.yml
    id: r.lock-not-unlocked-flagging
    level: MUST
    text: lock-not-unlocked-on-return.yml must define Go rules lock_not_unlocked and
      read_lock_not_unlocked at severity WARNING. Each matches a Lock() or RLock()
      followed later by an if-branch that returns, and reports the lock and condition
      metavariables. Both must suppress the case where the lock is released before
      that return, where it is released anywhere before the branch, where the unlock
      goes through a function value assigned from $LOCK.Unlock or $LOCK.RUnlock, where
      unlock is deferred (directly, inside the branch, or inside a deferred closure),
      and where an earlier defer already covers a reacquired lock.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/logger-sprintf.yml
    id: r.logger-sprintf-flagging
    level: MUST
    text: logger-sprintf.yml must define Go rule logger-used-with-sprintf at severity
      WARNING. It matches a fmt.Sprintf argument passed to Trace, Debug, Info, Warn
      or Error on logger, on $PARENT.logger, and on $PARENT.Logger(), and reports
      that the logger message was generated by Sprintf.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/joinpath.yml
    id: r.path-join-flagging
    level: MUST
    text: joinpath.yml must define Go rule use-strings-join-path at severity ERROR.
      It matches strings.Join where the separator argument is "/", "\\" or a backtick
      backslash, and its message asks whether path.Join() or filepath.Join() was intended.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/physical-storage.yml
    id: r.physical-storage-flagging
    level: MUST
    text: physical-storage.yml must define Go rule physical-storage-bypass-encryption
      at severity WARNING. It matches Put calls on $CORE.physical and on $CORE.underlyingPhysical,
      and reports that encryption is bypassed by accessing physical storage directly.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/replication-has-state.yml
    id: r.replication-state-handler-and-logic
    level: MUST
    text: replication-has-state.yml must also define replication-state-in-handler-op
      at severity WARNING, matching $B.System().ReplicationState().HasState($STATE)
      only when it sits inside a framework handler with the context, *logical.Request
      and *framework.FieldData parameters, telling the author to use the framework
      ForwardPerformance* setting; and replication-state-bad-logic at severity ERROR,
      matching a local-mount check OR-ed with a negation of the performance-standby
      replication state check and reporting invalid replication state handling of
      local mounts.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/replication-has-state.yml
    id: r.replication-state-helper-suggestions
    level: MUST
    text: replication-has-state.yml must define Go rules replication-state-should-use-IsPerfSecondary
      and replication-state-should-use-IsDrSecondar at severity WARNING, matching
      HasState with consts.ReplicationPerformanceSecondary and consts.ReplicationDRSecondary
      respectively. Each carries a fix that rewrites the call to $CORE.IsPerfSecondary()
      or $CORE.IsDRSecondary(), and each must not fire inside the defining IsPerfSecondary
      or IsDRSecondary method, nor on calls reached through $BACKEND.System() or $IDENTITYSTORE.localNode.
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/self-equals.yml
    id: r.self-equals-flagging
    level: MUST
    text: self-equals.yml must define Go rule self-equals at severity ERROR, matching
      a value compared with itself through either == or !=, and report "Comparing
      with self".
  - codeRefs:
    - file:third_party/openbao/tools/semgrep/hostport.yml
    - file:third_party/openbao/tools/semgrep/joinpath.yml
    - file:third_party/openbao/tools/semgrep/lock-not-unlocked-on-return.yml
    - file:third_party/openbao/tools/semgrep/logger-sprintf.yml
    - file:third_party/openbao/tools/semgrep/physical-storage.yml
    - file:third_party/openbao/tools/semgrep/replication-has-state.yml
    - file:third_party/openbao/tools/semgrep/self-equals.yml
    id: r.upstream-identity-preserved
    level: SHOULD
    text: Because these files are a vendored copy of the OpenBao tooling, rule ids,
      severities, messages and the MPL-2.0 copyright and SPDX headers must stay as
      upstream defines them, so findings from this repository remain comparable with
      upstream and the license notice stays attached.
  upstream: self
