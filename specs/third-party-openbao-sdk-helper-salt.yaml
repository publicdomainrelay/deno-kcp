    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: HashFunc
    kind: type
    signature: type HashFunc func([]byte) []byte
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: NewNonpersistentSalt
    kind: function
    signature: func NewNonpersistentSalt() *Salt
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: NewSalt
    kind: function
    signature: func NewSalt(ctx context.Context, view logical.Storage, config *Config)
      (*Salt, error)
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: SHA1Hash
    kind: function
    signature: func SHA1Hash(inp []byte) []byte
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: SHA256Hash
    kind: function
    signature: func SHA256Hash(inp []byte) []byte
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt
    kind: struct
    signature: type Salt struct { config *Config; salt string; generated bool }
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt.DidGenerate
    kind: method
    signature: func (s *Salt) DidGenerate() bool
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt.GetHMAC
    kind: method
    signature: func (s *Salt) GetHMAC(data string) string
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt.GetIdentifiedHMAC
    kind: method
    signature: func (s *Salt) GetIdentifiedHMAC(data string) string
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt.SaltID
    kind: method
    signature: func (s *Salt) SaltID(id string) string
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: Salt.SaltIDHashFunc
    kind: method
    signature: func (s *Salt) SaltIDHashFunc(id string, hashFunc HashFunc) string
    file: third_party/openbao/sdk/helper/salt/salt.go
  - name: SaltID
    kind: function
    signature: func SaltID(salt, id string, hash HashFunc) string
    file: third_party/openbao/sdk/helper/salt/salt.go
