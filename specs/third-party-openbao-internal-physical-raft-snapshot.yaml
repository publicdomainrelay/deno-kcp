kind: SystemContext
metadata:
  name: third-party-openbao-internal-physical-raft-snapshot
  namespace: default
spec:
  intent: 'This context exists so the deno-kcp repository can read and write raft
    snapshots in OpenBao''s on-disk archive format without reimplementing the format:
    archive.go supplies the per-file checksum manifest that guards an extracted snapshot
    tree, and snapshot.go supplies the sealed, checksummed container that wraps a
    raft snapshot stream. It is vendored third-party code kept in tree (upstream:
    self) so the surrounding raft physical backend can call New, Write, Verify, Parse,
    Restore, and WriteToTempFile directly, and it exists here because the summary
    and spec must describe that vendored surface exactly as it stands.'
  interfaces:
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
    kind: function
    name: New
    signature: func New(logger hclog.Logger, r *raft.Raft) (*Snapshot, error)
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
    kind: function
    name: NewWithSealer
    signature: func NewWithSealer(logger hclog.Logger, r *raft.Raft, sealer Sealer)
      (*Snapshot, error)
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
    kind: function
    name: Parse
    signature: func Parse(in io.Reader, out io.Writer) (*raft.SnapshotMeta, error)
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
    kind: function
    name: Restore
    signature: func Restore(logger hclog.Logger, in io.Reader, r *raft.Raft) error
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
    kind: function
    name: RestoreWithSealer
    signature: func RestoreWithSealer(logger hclog.Logger, in io.Reader, r *raft.Raft,
      sealer Sealer) error
  - file: third_party/openbao/internal/physical/raft/snapshot/snapshot.go
