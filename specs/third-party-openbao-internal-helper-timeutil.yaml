kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-timeutil
  namespace: default
spec:
  intent: This context exists because the upstream OpenBao codebase needs a single,
    dependency-free place to do month arithmetic and time comparison, and to abstract
    the wall clock behind an interface so time-dependent code is testable. It is vendored
    into this repository as third-party code, so the spec records the behavior that
    the rest of the tree depends on rather than behavior we would design anew.
