apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:7d0592518b28ab7f726ef33cc07d1e2a CreateRoute@third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js:9
- file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js
  create.js@third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
