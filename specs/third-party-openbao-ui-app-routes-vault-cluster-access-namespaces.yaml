kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-namespaces
  namespace: default
spec:
  intent: 'These routes exist so the cluster access namespaces area can render two
    screens from the same store-backed data layer: a create screen that needs an unsaved
    namespace model bound to the form, and a list screen that needs a paged namespace
    query with query-string page state. The context exists to record the model-hook
    contracts, the query parameter behaviour, and the controller cleanup hooks that
    the matching controllers and templates depend on.'
  interfaces:
  - file: third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js
    kind: class
    name: CreateRoute
    signature: 'export default class CreateRoute extends Route.extend({ store: service(''store''),
      resetController(controller, isExiting) })'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:7d0592518b28ab7f726ef33cc07d1e2a
    id: r.create-model
    level: MUST
    text: CreateRoute.model() returns an unsaved record created through the injected
      store with the type name 'namespace', so the create form edits a new namespace
      rather than an existing one.
  - codeRefs:
    - class:7d0592518b28ab7f726ef33cc07d1e2a
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js
    id: r.create-reset-cleanup
    level: MUST
    text: When the route is exiting, its resetController calls cleanupModel on the
      controller if that method exists, discarding create-form state left behind by
      the previous visit.
  - codeRefs:
    - class:7d0592518b28ab7f726ef33cc07d1e2a
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/create.js
    id: r.create-services
    level: MUST
    text: CreateRoute declares the injected store and version services on the route,
      so the model hook can reach the store and templates or controllers can read
      the running version.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-404-empty
    level: MUST
    text: A namespace query that fails with HTTP status 404 resolves to an empty array
      instead of rejecting, so a cluster with no namespaces renders an empty list;
      any other error is rethrown.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-error-action
    level: MUST
    text: The index route error action aborts the transition and records has404 when
      the controller already had a model and the error status is 404, otherwise it
      returns true so the error keeps propagating.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-page-query-param
    level: MUST
    text: The index route declares page as a query parameter with refreshModel enabled,
      so changing the page in the URL refetches the namespace listing.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-paged-query
    level: MUST
    text: The index route model hook runs a lazyPaginatedQuery against the 'namespace'
      type with responsePath 'data.keys' and a page number taken from the route's
      page query parameter, defaulting to 1 when the parameter is absent or not numeric.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-setup-controller
    level: MUST
    text: The index route setupController passes the model, a has404 flag and hasModel
      true to the controller, and when no 404 was recorded also sets the controller
      page property from the model meta currentPage, defaulting to 1.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/namespaces/index.js
    id: r.index-transition-cache
    level: MUST
    text: The willTransition action scrolls the window to the top and clears all store
      datasets whenever the transition target is not this route, and the reload action
      clears all datasets before refreshing the route.
  upstream: self
