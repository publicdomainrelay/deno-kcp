apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki-addon-routes
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists to describe the routing layer of the vendored OpenBao
    PKI addon, so that changes to the deno-kcp host application can reason about how
    PKI screens are entered, what data each route loads before rendering, and what
    navigation and breadcrumb contract the addon expects from its host. It documents
    the route classes and the one exported helper rather than the templates or components
    they feed, and it pins the service dependencies (secretMountPath, store) and the
    check-config decorator behavior that the routes rely on.
  requirements:
  - id: r.application-route-loads-mount-path
    level: MUST
    text: PkiRoute in application.js must expose a secretMountPath property and a
      beforeModel hook, and must carry a pathHelp property, so every child route can
      resolve the current PKI engine mount path before rendering.
    codeRefs:
    - class:73b65d59cb55fc22d6ea2af358545a30
    - file:third_party/openbao/ui/lib/pki/addon/routes/application.js
  - id: r.configuration-route-model
    level: MUST
    text: PkiConfigurationRoute must inject the store service and implement a model
      hook that returns the data the configuration screen renders.
    codeRefs:
    - class:9eaaf31192f8310d2315e052649c8dd4
    - file:third_party/openbao/ui/lib/pki/addon/routes/configuration.js
  - id: r.error-route-controller-chrome
    level: MUST
    text: PkiRolesErrorRoute must read the secretMountPath service and, in setupController,
      set the controller's breadcrumbs to secrets and the current mount path, set
      tabs for Overview, Roles, Issuers, Keys, Certificates, Tidy and Configuration,
      and set the title to the current mount path.
    codeRefs:
    - class:733075519e4c913edd04f4dc054cb60c
    - file:third_party/openbao/ui/lib/pki/addon/routes/error.js
  - id: r.index-route-redirects
    level: MUST
    text: The index route must define a PkiRoute class that declares a 'host-router'
      property and a redirect hook, so a request to the bare PKI path is forwarded
      to the host router instead of rendering an empty page.
    codeRefs:
    - file:third_party/openbao/ui/lib/pki/addon/routes/index.js
  - id: r.overview-route-model-and-controller
    level: MUST
    text: PkiOverviewRoute must build the overview model and populate its controller
      in setupController, and the module must export getCliMessage, which returns
      the default empty-state message alone when given no message and otherwise appends
      the names of existing items with a CLI instruction to manage them until an issuer
      is configured.
    codeRefs:
    - class:46486ac4791e331ef34add20f83e3ebd
    - file:third_party/openbao/ui/lib/pki/addon/routes/overview.js
    - function:8f85141cd85289b6d132ef68ece56fc9
  - id: r.routes-share-mount-path-service
    level: SHOULD
    text: Routes that need the engine identity should read it from the secretMountPath
      service rather than from route params, so breadcrumb and model URLs stay consistent
      with the host application's current mount.
    codeRefs:
    - file:third_party/openbao/ui/lib/pki/addon/routes/application.js
    - file:third_party/openbao/ui/lib/pki/addon/routes/error.js
  - id: r.tidy-route-model-hash
    level: MUST
    text: PkiTidyRoute must inject the store service and, in its model hook, resolve
      the parent 'application' model as the engine and return a hash of hasConfig
      (from the check-config shouldPromptConfig flag), the engine, and the engine's
      'pki/tidy' auto-tidy record.
    codeRefs:
    - class:b35bc86acd26a0eaeeaf52ea82e7862f
    - file:third_party/openbao/ui/lib/pki/addon/routes/tidy.js
  interfaces:
  - name: PkiConfigurationRoute
    kind: class
    signature: class PkiConfigurationRoute extends Route { store; model() }
    file: third_party/openbao/ui/lib/pki/addon/routes/configuration.js
  - name: PkiOverviewRoute
    kind: class
    signature: class PkiOverviewRoute extends Route { model(); setupController(controller)
      }
    file: third_party/openbao/ui/lib/pki/addon/routes/overview.js
  - name: PkiRolesErrorRoute
    kind: class
    signature: class PkiRolesErrorRoute extends Route { secretMountPath; setupController(controller)
      }
    file: third_party/openbao/ui/lib/pki/addon/routes/error.js
  - name: PkiRoute
    kind: class
    signature: class PkiRoute extends Route { pathHelp; secretMountPath; beforeModel()
      }
    file: third_party/openbao/ui/lib/pki/addon/routes/application.js
  - name: PkiTidyRoute
    kind: class
    signature: class PkiTidyRoute extends Route { store; model() }
    file: third_party/openbao/ui/lib/pki/addon/routes/tidy.js
  - name: getCliMessage
    kind: function
    signature: const getCliMessage = (msg) => string
    file: third_party/openbao/ui/lib/pki/addon/routes/overview.js
codeRefIndex:
