apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-plugin
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: Exists so that the repository can compile against and link the OpenBao/Vault
    plugin protocol without depending on an external module path for the SDK. It defines
    the full server and client halves of the go-plugin gRPC contract for logical backends,
    plus the storage, system-view and logger brokers a backend needs, and the serve
    helpers a plugin binary's main function calls. Consumers inside this repository
    use it to build, dispense and host logical backends.
  requirements:
  - id: r.backend-client-forwarding
    level: MUST
    text: Every backendGRPCPluginClient method forwards to the remote backend over
      gRPC, so Initialize, HandleRequest, HandleExistenceCheck, SpecialPaths, Setup,
      InvalidateKey, Cleanup, Type, PluginVersion, System, Logger and IsExternal all
      reflect the plugin process's backend rather than local state.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_backend_client.go
    - method:1b7848a15e29d6ec84624977a059f707
    - method:2b4b94171d09bc27210585e5a91bcb4e
    - method:32468eb19e567c90f508f68e9638ac96
    - method:6171e5e250fab85daba7f4057e0f8361
    - method:849a48d975eba89fcea2bbba2cfe3767
  - id: r.backend-plugin-client-capabilities
    level: MUST
    text: BackendPluginClient carries the remote backend handle plus its version metadata,
      so Cleanup tears down the plugin client and PluginVersion reports the negotiated
      version; the v5 variant additionally reports IsExternal from the plugin handshake.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/plugin.go
    - method:0a9c4bf7a631037cad289dd4779bf323
    - method:d5e6e4ab01a24a7f082237abe1e18150
    - method:fa166f39c25c9aca21b6a93bae1fc16a
    - struct:4ff22f80117fe175971f2ca0995534e2
  - id: r.backend-server-dispatch
    level: MUST
    text: backendGRPCPluginServer decodes each protobuf request into the logical types,
      invokes the corresponding method on the obtained backend instance and encodes
      the result or the error into the protobuf reply.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_backend_server.go
    - method:174d5d0103acb1b2ed4a07af8ea49a70
    - method:1c58ea704d1ea3d538ed36c65bd1e213
    - method:69224966363a14fd3c53f406c3df600e
    - method:b9809ca3d0d49ddac6ce541c8c41bce2
  - id: r.grpc-client-construction
    level: MUST
    text: GRPCClient returns a backendGRPCPluginClient holding the Backend client,
      PluginVersion client, the broker, a fresh cleanup channel, the caller's done
      context and the plugin's MetadataMode.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/backend.go
    - method:997450692afef7e5ec0642502549ce4f
  - id: r.grpc-server-registration
    level: MUST
    text: GRPCServer builds a backendGRPCPluginServer from the plugin's Factory, MetadataMode-independent
      instance map and Logger, registers it as both the Backend and PluginVersion
      gRPC service, and additionally registers the multiplexing server when MultiplexingSupport
      is set.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/backend.go
    - method:0d2b3ec3df7e24317bcaa59cdffacde0
    - struct:a503c0d462a2d348fcc0594174abc825
  - id: r.logger-rpc-surface
    level: MUST
    text: LoggerServer exposes the log.Logger interface over RPC, forwarding Trace,
      Debug, Info, Warn, Error and Log to a shared logger, and reporting IsTrace,
      IsDebug, IsInfo and IsWarn through a LoggerReply; SetLevel adjusts the logger's
      level.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/logger.go
    - method:1ae9e1055c4c547f91bffecf87e3408b
    - method:3396e99d36fce725371b2778e424e876
    - method:488f91ae4607e2292d664b435e509be9
    - struct:e1626e6329eb97242334a06e3ae8490c
  - id: r.noop-storage
    level: MUST
    text: 'NOOPStorage implements the storage interface as a no-op: List and ListPage
      return empty results, Get returns a not-found error, and Put and Delete return
      nil errors.'
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_storage.go
    - method:3653e0f25154a788fd8bf3e5584cf0bb
    - method:b48d2ce520ef90129e6973a01e0f8074
    - method:b90b0c85be30968ce7d690be635d4af5
    - struct:3311490cc6926794ff20c280ed074776
  - id: r.reload-preserving-cleanup
    level: MUST
    text: BackendPluginClientV5.Cleanup checks the context for ContextKeyPluginReload
      and, when it is absent, cleans up the embedded backend and closes the plugin
      client, so a reload does not tear down the reused plugin process.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/plugin_v5.go
    - method:3b581a46e9f9f8d7182c6a41083e2d5f
    - method:bb98f92f7e7f53959d482198ae73019d
    - type_alias:de240a20b03c3acb677fe02691925b5b
  - id: r.serve-entrypoint
    level: MUST
    text: Serve runs the plugin main process from ServeOpts, defaulting the logger
      when none is supplied, applying the TLSProviderFunc when set, and serving the
      GRPCBackendPlugin built from BackendFactoryFunc; ServeMultiplex does the same
      with multiplexing support enabled.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/serve.go
    - function:ace0d2c743fe6cb870f3439eaeeef5fc
    - function:b052930f1568525b7416c6a7dd388b99
    - struct:093e9499ed0d32dc6fa3ba35860e4560
    - type_alias:ffcd33063c419df344c256774a320354
  - id: r.storage-broker-roundtrip
    level: MUST
    text: GRPCStorageClient exposes the logical storage surface (List, ListPage, Get,
      Put, Delete) by calling the gRPC storage server, and GRPCStorageServer serves
      those same operations against the mounted storage backend, returning the storage
      error in the reply rather than as a transport error.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_storage.go
    - method:2af708be0578b6d482b348656fbf5525
    - method:af0cce5180fd3f3a609687842173904d
    - method:c7c8d68ccf7cc2596400e9443b552e5e
    - method:e62d5db3e874584c8e85f7aa82ef3f23
    - method:f5fd3dce8409afac9488cce9128b1095
  - id: r.system-view-broker
    level: MUST
    text: gRPCSystemViewClient answers every logical.SystemView query (lease TTLs,
      tainted, caching disabled, replication state, mlock, local mount, entity and
      group lookups, plugin environment, Vault version, cluster ID, external key,
      response wrapping and new-plugin-client creation) by calling the corresponding
      gRPC system view server method, and gRPCSystemViewServer answers those calls
      from the embedded SystemView.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_system.go
    - method:0b9c4fcf76557462d9601358f6cd6b33
    - method:0c70f9c91b6db5de7bbec6912b73a289
    - method:2395253bf53d1ca1fa29f1fc054d3ac9
    - method:2827ddabfa1ea12b12ff2585eef1c0b5
    - method:3d20729ab9c557ad5d78002323aea05b
    - method:bb04f4e7d6300db0c9d9eb7d2b8d30d2
  - id: r.tracing-middleware
    level: SHOULD
    text: BackendTracingMiddleware wraps a logical.Backend and starts a tracing span
      around each forwarded call (Initialize, HandleRequest, HandleExistenceCheck,
      Setup, InvalidateKey, Cleanup) and delegates the non-traced accessors SpecialPaths,
      System, Logger, Type and PluginVersion unchanged.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/middleware.go
    - method:9986a138ce360977306f17709a79b2a9
    - method:a9b16dd37ca7f3262412072c70d2b980
    - method:f6a2cb63630585488da8793281efa51a
    - struct:f9823e24fba3e1260e837b886422d8ad
  - id: r.transactional-storage
    level: MUST
    text: GRPCTransactionalStorageClient begins read-only and read-write transactions
      through the storage server and returns a GRPCStorageClientTransaction whose
      Commit and Rollback call the matching server methods.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/grpc_storage.go
    - method:0bfc2e84c1c3f42c856a3c8e25811b37
    - method:497ac0debf7f4e2768f4ce31af9d5819
    - method:b118df18a01349acaff756f826bcde96
    - method:b21f0c9f65bfabbac120694d4f7c8d8a
    - method:ce75c71d01169b33386fcc1b37edfcf7
  - id: r.v5-dispense
    level: MUST
    text: Dispense inspects the plugin's handshake to decide the versioned client
      form, and NewPluginClientV5 builds a BackendPluginClientV5 that embeds the dispensed
      logical.Backend; NewBackendV5 resolves the runner by plugin name and version
      before dispensing.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/plugin_v5.go
    - function:a6733a8b57e4b20e4fa4378c8674dcf6
    - function:c9412851cff57cc07186a931b2d0570f
    - function:f10fd7cb843087c77654f7dd89ad9c38
  - id: r.versioned-backend-factory
    level: MUST
    text: NewBackendWithVersion, NewBackend and NewPluginClient resolve a plugin runner
      through the supplied LookRunnerUtil/RunnerUtil, dispense the client and return
      the logical.Backend, with NewBackend delegating to the versioned constructor
      with an empty version.
    codeRefs:
    - file:third_party/openbao/sdk/plugin/plugin.go
    - function:2102a0f2191f4030153f7abf9e3956e3
    - function:6e3505f1f4c72782efe70fd3a74447ac
    - function:c7b21232958a5b231b82265ec8ac21a2
