kind: SystemContext
metadata:
  name: third-party-openbao-sdk-plugin
  namespace: default
spec:
  intent: Exists so that the repository can compile against and link the OpenBao/Vault
    plugin protocol without depending on an external module path for the SDK. It defines
    the full server and client halves of the go-plugin gRPC contract for logical backends,
    plus the storage, system-view and logger brokers a backend needs, and the serve
    helpers a plugin binary's main function calls. Consumers inside this repository
    use it to build, dispense and host logical backends.
