apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-token
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so command code can read, write and clear the client
    token without knowing where it lives, and so tests can substitute an in-memory
    or subprocess-backed helper. It provides the storage abstraction behind OpenBao
    CLI login and token commands, plus the harness used to test the external-script
    and file-backed variants.
  requirements:
  - id: r.external-helper-subprocess
    level: MUST
    text: 'ExternalTokenHelper runs a configured external script through ExecScript,
      passing a verb argument for each operation: Erase invokes the script with "erase"
      and wraps combined stdout/stderr into the error when the command fails, and
      Get, Store and Path follow the same get/store/path dispatch through the script.
      ExternalTokenHelperPath resolves the executable path for the helper.'
    codeRefs:
    - file:third_party/openbao/internal/command/token/helper_external.go
    - function:54a4eccf095a762d8fbcbbe14292e7b9
    - function:fa36836d21c45a07ae1caee3edb73184
    - method:7f7097b3a1df264307d999d0db18ec27
    - method:c27b39c7e48d825d8e1fb017f7e48ded
    - method:eb1419d3304aec07d81f0fda4ef553a6
    - method:f8fb55f02dd273284d4c8c58f9e57b06
    - struct:0ff633f347418a596be8cbdb068158fa
  - id: r.internal-get-missing-is-empty
    level: MUST
    text: InternalTokenHelper.Get opens the token file and returns an empty string
      with a nil error when the file does not exist, so a first run is not an error
      condition; any other open or read failure is returned, and the file is closed
      via a deferred join into the named error. A successful read returns the file
      contents with surrounding whitespace trimmed.
    codeRefs:
    - file:third_party/openbao/internal/command/token/helper_internal.go
    - method:817e184d460765d3dea4d1820b63ace2
    - method:a67228461dc294162e503b20297b72d2
    - method:baedd47b0bf25b4a0aec00b7fc072bdf
  - id: r.internal-token-path-resolution
    level: MUST
    text: NewInternalTokenHelper reads the BAO token path environment variable (api.ReadBaoVariable(api.EnvTokenPath))
      and uses it directly when non-empty; otherwise it expands ~/.vault-token through
      homedir.Expand and fails with a wrapped "could not expand home directory" error
      if expansion fails. InternalTokenHelper.Path returns that resolved path unchanged.
    codeRefs:
    - file:third_party/openbao/internal/command/token/helper_internal.go
    - function:3f2a36bbcd1abbb0f005b16ea64490f2
    - method:5b0531242d9da60fc26badf2150fee17
    - struct:5cfa139b8fca97aee4597f90baccf686
  - id: r.shared-helper-test-harness
    level: SHOULD
    text: 'testing.go supplies the reusable harness: Test(t, h) drives any TokenHelper
      through its Path/Get/Store/Erase cycle so every implementation is checked against
      the same behavior, TestProcess and TestProcessPath build the re-exec subprocess
      invocation used to simulate the external script, and TestExternalTokenHelperProcessCLI
      registers the cli.Command that runs the external helper in the child process.'
    codeRefs:
    - file:third_party/openbao/internal/command/token/testing.go
    - function:23b3e236bbf6635196d7bf7fc1f93d32
    - function:43aa8625ae6454dbe879b173902fcd9e
    - function:afc47b32b6792cdfd4456db2bd76fde0
    - function:f32d71a999e8a937edbeb0342aa55ba5
  - id: r.testing-helper-in-memory
    level: MUST
    text: 'TestingTokenHelper holds the token in memory only: NewTestingTokenHelper
      constructs it, Store sets the held token, Get returns it, Erase clears it, and
      Path reports the in-memory location. It exists so command tests never touch
      the real token file.'
    codeRefs:
    - file:third_party/openbao/internal/command/token/helper_testing.go
    - function:a438cf4fa333d5311befcee1574798fe
    - method:542111467c677fe96b9bcd4cd053e25b
    - method:583caebeb553ae693c30651576da99ca
    - method:c3363c6a8a22099be31d31b7f76c712c
    - method:e992c760b3c5f07307af271d2c17c589
    - struct:bc7d6877e626118d9054aa5a11abea99
  - id: r.token-helper-contract
    level: MUST
    text: 'TokenHelper is the storage abstraction: Path reports where the token lives,
      Get returns the stored token, Store writes a token, and Erase removes it. Every
      implementation in this package satisfies the interface so callers can swap file,
      subprocess and in-memory backends.'
    codeRefs:
    - file:third_party/openbao/internal/command/token/helper.go
    - interface:245d0d200e4d2f5977a07ae0d13f38bb
    - method:023e1aa2dbad7c6e73d4ae37fdb94a65
