- class:5a8f356e26bdd7490c8fc016980b263b OidcScopeDetailsRoute@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/scopes/scope/details.js:8
- class:f84eedeee8c419f5ccb0c11400b1b8f8 OidcScopeEditRoute@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/scopes/scope/edit.js:8
- file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/scopes/scope/details.js
