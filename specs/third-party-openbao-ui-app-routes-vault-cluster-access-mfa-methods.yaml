apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-mfa-methods
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists to specify the routing behavior that backs the MFA methods
    list, detail, and creation pages of the OpenBao UI. It documents what each route
    fetches from the Ember Data store, how each handles missing or failing data, when
    the router redirects away, how the detail view correlates login enforcements with
    a method, and how the create route synchronizes the type query parameter with
    the form's model objects. The spec is the contract the controllers and templates
    of those pages depend on.
  requirements:
  - id: r.create-reset-type-on-exit
    level: MUST
    text: MfaLoginEnforcementCreateRoute.resetController must set the controller's
      'type' to null only when the isExiting flag is true, so saving or cancelling
      the create form resets the type query parameter while an in-place page refresh
      leaves the selection intact.
    codeRefs:
    - class:6454548d1b147ac2baaed64eaadef437
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/create.js
  - id: r.create-type-selected-models
    level: MUST
    text: MfaLoginEnforcementCreateRoute.setupController must delegate to the base
      Route.setupController with the original arguments, then read 'type' from the
      controller and call controller.createModels() when a type is present, so a refresh
      after type selection rebuilds the method and enforcement models the forms need.
    codeRefs:
    - class:6454548d1b147ac2baaed64eaadef437
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/create.js
  - id: r.method-detail-controller-model
    level: MUST
    text: MfaMethodRoute.setupController must set the resolved hash on the controller
      as 'model', with the store service injected into the route.
    codeRefs:
    - class:2a3554ca939b5f822ca112217a178343
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/method.js
  - id: r.method-detail-enforcement-filter
    level: MUST
    text: The enforcements branch must query all 'mfa-login-enforcement' records,
      keep only those whose hasMany('mfa_methods') relationship ids include the route
      id, and swallow any query rejection so a failure yields no enforcements rather
      than breaking the detail route.
    codeRefs:
    - class:2a3554ca939b5f822ca112217a178343
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/method.js
  - id: r.method-detail-hash
    level: MUST
    text: MfaMethodRoute.model must take the route's id parameter and resolve an RSVP
      hash with two keys, 'method' holding the 'mfa-method' record found by that id
      and 'enforcements' holding the filtered enforcement list, so the detail template
      receives both in one settled object.
    codeRefs:
    - class:2a3554ca939b5f822ca112217a178343
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/method.js
  - id: r.methods-list-controller-model
    level: MUST
    text: MfaMethodsRoute.setupController must set the resolved model on the controller
      as 'model', injecting the store and router services into the route.
    codeRefs:
    - class:0129648ecf0331d7c7a9ba3e6bcb1cff
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/index.js
  - id: r.methods-list-empty-redirect
    level: MUST
    text: MfaMethodsRoute.afterModel must transition to the 'vault.cluster.access.mfa'
      route whenever the resolved model is an empty list, so the bare methods page
      never renders with zero methods.
    codeRefs:
    - class:0129648ecf0331d7c7a9ba3e6bcb1cff
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/index.js
  - id: r.methods-list-query
    level: MUST
    text: MfaMethodsRoute.model must query the 'mfa-method' store with an empty filter
      object and return the resulting collection, and must return an empty array when
      the query fails with httpStatus 404, rethrowing any other error so non-404 failures
      still surface.
    codeRefs:
    - class:0129648ecf0331d7c7a9ba3e6bcb1cff
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/index.js
  - id: r.routes-extend-ember-route
    level: SHOULD
    text: Each of the three route classes should remain an ES module default export
      extending '@ember/routing/route' Route, with store (and router where used) injected
      through the '@ember/service' decorator, matching the surrounding OpenBao UI
      route conventions.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/create.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/index.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/method.js
  interfaces:
  - name: MfaLoginEnforcementCreateRoute
    kind: class
    signature: class MfaLoginEnforcementCreateRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/create.js
  - name: MfaMethodRoute
    kind: class
    signature: class MfaMethodRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/method.js
  - name: MfaMethodsRoute
    kind: class
    signature: class MfaMethodsRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/mfa/methods/index.js
