apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-logical-pkiext-pkiext-binary
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the OpenBao PKI extension can exercise real ACME
    issuance against a real multi-node Vault/OpenBao cluster inside docker rather
    than against a mock. It provides the fixture layer: cluster bootstrap and topology
    inspection, DNS and host-file plumbing so ACME clients can resolve challenge domains,
    mount creation for PKI and ACME, and API-level operations for building certificate
    hierarchies and ACME configuration. The acme_test.go subtests are the consumers;
    everything here is test-support code guarded by the `BAO_BINARY` environment variable.'
  requirements:
  - id: r.acme-key-and-ca-retrieval
    level: MUST
    text: VaultPkiMount.GetEabKey fetches the external account binding key ID, key
      value and error for a given ACME directory path, and GetCACertPEM returns the
      mount's CA certificate as a PEM string, giving ACME subtests the credentials
      and trust anchor they need.
    codeRefs:
    - method:765f4e34a7317219b406da4484a562a9
    - method:e383767a1aa2d4027fcf4ca479fce31d
  - id: r.acme-subtests-consume-harness
    level: SHOULD
    text: The ACME test suite consumes this harness across its subtests (Caddy, certbot,
      certbot with EAB, IP and DNS, wildcard DNS, prevention of ICA DNS, and step-down
      node), so any change to the cluster or mount surface must keep those subtests
      buildable.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/pkiext_binary/acme_test.go
  - id: r.active-node-wait
    level: MUST
    text: GetActiveClusterNode waits up to 60 seconds for a node to become active
      and returns it; when no node becomes active within the window it panics with
      a message naming the timeout failure, so callers never receive a nil active
      node.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/pkiext_binary/pki_cluster.go
    - method:e59db6b960c0e5b47bc518975cd9d5ef
  - id: r.certificate-hierarchy
    level: MUST
    text: 'VaultPkiMount builds certificate hierarchies over the API: GenerateRootInternal
      and GenerateIntermediateInternal generate a root and an intermediate from caller-supplied
      property maps and return the API secret, SignIntermediary signs a CSR with a
      named signing issuer under extra properties, and ImportBundle imports a PEM
      bundle with properties, so tests can assemble root-to-intermediate chains on
      the cluster.'
    codeRefs:
    - method:463b87cdab66460f04c2e946fa0ea5a9
    - method:8984fe72b80f3626cd5d97bc983a5d7a
    - method:cbc8183511af527b6fa02e64bdb66b07
    - method:d51bc803931d37dae021f30d24b6cc48
  - id: r.cleanup-teardown
    level: MUST
    text: VaultPkiCluster.Cleanup tears down the cluster resources so a test leaves
      no containers behind after it finishes.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/pkiext_binary/pki_cluster.go
    - method:9a8536a708a604691e34aa6126267a31
  - id: r.cluster-requires-bao-binary
    level: MUST
    text: NewVaultPkiCluster reads the BAO_BINARY environment variable and calls t.Skip
      when it is empty, so container tests run only when a Vault/OpenBao binary path
      is supplied; when present, it starts a docker cluster using that binary over
      image quay.io/openbao/openbao:latest with TRACE log level and 3 cores, and returns
      a VaultPkiCluster wrapping it.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/pkiext_binary/pki_cluster.go
    - function:c997624527a7b677725dde6d9e51cd3f
    - struct:edd27c7fe3f423b1d448cf7d9f2823f9
  - id: r.dns-cluster-variant
    level: MUST
    text: NewVaultPkiClusterWithDNS builds a cluster with NewVaultPkiCluster, then
      attaches a test DNS server for the domain dadgarcorp.com on the cluster's container
      network and stores it on the returned cluster, so DNS-dependent ACME subtests
      resolve challenge names.
    codeRefs:
    - function:9eaae345fdc57ae816fc40eb0786fa08
    - function:c997624527a7b677725dde6d9e51cd3f
    - method:5a05da1ae3644ea9574ed6c9adda789f
  - id: r.host-and-dns-manipulation
    level: MUST
    text: 'VaultPkiCluster can map a hostname to an IP for the cluster and mutate
      the test DNS server: AddHostname and AddNameToHostFiles register a hostname/IP
      pair, AddDNSRecord adds a record of a caller-given type, RemoveDNSRecord removes
      one domain/record/value triple, RemoveDNSRecordsOfTypeForDomain removes a type
      for a domain, RemoveDNSRecordsForDomain removes all records for a domain, and
      RemoveAllDNSRecords clears everything; each reports an error rather than panicking
      when the operation fails.'
    codeRefs:
    - method:272023ce0f6d0ba54f2c0b9d231b6b76
    - method:5592a94865af2c0cc40fdfc166cfad44
    - method:7471a9800221a22f6c320f240f8c2b08
    - method:81e31d3976a83aa28bd7a05ffa29f4e1
    - method:892278ed6844d08f864a570fd92fcfa6
    - method:894299a2bb5070bf1ce58e073443c268
    - method:9be16e343bf52f3d11d9093c06054b8b
  - id: r.issuer-and-role-updates
    level: MUST
    text: 'VaultPkiMount updates issuer and role state: UpdateDefaultIssuer sets the
      default issuer by ID with extra properties, UpdateIssuer updates a named issuer
      reference with properties, and UpdateRole writes a role''s configuration map
      under a role name; each returns an error when the API call fails.'
    codeRefs:
    - method:782cfb8f1fcdedacfe38281788b9c47f
    - method:8fd3fd478b2bf259c102cb3e9bccb4cb
    - method:d1fd934cc7870f5c5ae76e3c1b4b6098
  - id: r.mount-configuration
    level: MUST
    text: 'VaultPkiMount writes cluster and ACME configuration through the API: UpdateClusterConfig
      applies a caller-supplied config map, UpdateClusterConfigLocalAddr reads back
      the cluster''s local address as a string, and UpdateAcmeConfig sets the ACME
      enable flag together with a config map.'
    codeRefs:
    - method:2192940a606ebfc5254769062c6fef69
    - method:a0bb53a10c45f7f7b9756e37a8d20217
    - method:f637bfa6f3165a25614fa806acc5451a
  - id: r.mount-creation
    level: MUST
    text: CreateMount enables a PKI secrets engine at the given mount name on the
      active node and returns a VaultPkiMount for it, and CreateAcmeMount enables
      an ACME-capable PKI mount under the given mount name; both return an error instead
      of a mount when enabling fails.
    codeRefs:
    - method:2dd0b692b59a28efdce91a8b728cfe36
    - method:dcaccd9c31d26ee0674de4e393597b13
    - struct:5d0e2ae3198df0d9bf25f6c7a829cef5
  - id: r.non-active-node-selection
    level: MUST
    text: GetNonActiveNodes returns every cluster node that reports a leader via Sys().Leader()
      with IsSelf false, silently skipping nodes whose leader query returns an error
      so a transiently unreachable node does not fail the caller.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/pkiext_binary/pki_cluster.go
    - method:4d9d1aca602ade0801d4626b02307809
  - id: r.topology-accessors
    level: MUST
    text: VaultPkiCluster exposes the active node's container host port, network name,
      IP, container ID and API client, plus the listener CA certificate as PEM bytes,
      so tests can address the cluster from the host and from inside the container
      network and trust its listener certificate.
    codeRefs:
    - method:2bbff707a0712d921b3c3e76f0d1d9d6
    - method:5a05da1ae3644ea9574ed6c9adda789f
    - method:766c97cabad6def992956a67235dec8c
    - method:c6f4d78b33dfc2896722daa9acdebf3a
    - method:f02d0147d48ec1c0baa749dac63b63f9
    - method:ff56478b91a4db4309b8983b4af1669c
