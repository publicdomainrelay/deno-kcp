apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:0c231d92d2ed3d2fb91e19247e23cb12 KubernetesRolesRoute@third_party/openbao/ui/lib/kubernetes/addon/routes/roles/index.js:12
- class:42e8a3960e1f95ab7d2b43366f5be9de KubernetesRolesCreateRoute@third_party/openbao/ui/lib/kubernetes/addon/routes/roles/create.js:9
- file:third_party/openbao/ui/lib/kubernetes/addon/routes/roles/create.js create.js@third_party/openbao/ui/lib/kubernetes/addon/routes/roles/create.js
