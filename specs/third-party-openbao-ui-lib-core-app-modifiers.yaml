apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-core-app-modifiers
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so that the app-layer modifier namespace in the OpenBao
    UI has an entry for `code-mirror` without duplicating the implementation. Ember
    classic layout resolves modifiers from both the core and app trees; the app tree
    file is a thin alias that re-points the app path at the core path. Keeping it
    as a pure re-export means there is exactly one definition of the modifier, and
    any change to the modifier lands in the core module only.
  requirements:
  - id: r.preserve-upstream-header
    level: MUST
    text: 'The file must keep the upstream HashiCorp copyright and `SPDX-License-Identifier:
      MPL-2.0` header comment unchanged, because this file is vendored third-party
      OpenBao source.'
    codeRefs:
    - file:third_party/openbao/ui/lib/core/app/modifiers/code-mirror.js
  - id: r.re-export-core-code-mirror
    level: MUST
    text: The app-level modifier module must re-export the default binding of `core/modifiers/code-mirror`
      as its own default export, so `import codeMirror from 'core/app/modifiers/code-mirror'`
      yields the same value as importing the core module directly. The module must
      define no local modifier implementation of its own.
    codeRefs:
    - file:third_party/openbao/ui/lib/core/app/modifiers/code-mirror.js
codeRefIndex:
- file:third_party/openbao/ui/lib/core/app/modifiers/code-mirror.js code-mirror.js@third_party/openbao/ui/lib/core/app/modifiers/code-mirror.js
