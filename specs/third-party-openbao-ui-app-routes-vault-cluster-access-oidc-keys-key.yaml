- file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/keys/key/details.js
  details.js@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/keys/key/details.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/keys/key/edit.js
  edit.js@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/keys/key/edit.js
