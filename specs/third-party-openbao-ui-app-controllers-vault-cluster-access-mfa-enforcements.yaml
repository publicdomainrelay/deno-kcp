apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:23a3872c16d0d338fabe3c587cda66e7 MfaEnforcementListController@third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/enforcements/index.js:8
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/enforcements/index.js
