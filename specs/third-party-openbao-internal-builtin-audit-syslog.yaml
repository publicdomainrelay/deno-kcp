kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-audit-syslog
  namespace: default
spec:
  intent: This context exists to pin down the contract of the syslog audit device
    so that the vendored OpenBao audit subsystem can construct it and route audit
    entries through it without reading the implementation. It records that syslog
    plugs into the same Factory/Backend interface that the audit package declares
    and that the file, http and socket packages also satisfy, which lets the registry
    treat every sink uniformly and lets a change to one backend be checked against
    the shared contract.
  interfaces:
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: struct
    name: Backend
    signature: type Backend struct
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.GetHash
    signature: func (b *Backend) GetHash(ctx context.Context, data string) (string,
      error)
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.Invalidate
    signature: func (b *Backend) Invalidate(_ context.Context)
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.LogRequest
    signature: func (b *Backend) LogRequest(ctx context.Context, in *logical.LogInput)
      error
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.LogResponse
    signature: func (b *Backend) LogResponse(ctx context.Context, in *logical.LogInput)
      error
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.LogTestMessage
    signature: func (b *Backend) LogTestMessage(ctx context.Context, in *logical.LogInput,
      config map[string]string) error
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.Reload
    signature: func (b *Backend) Reload(_ context.Context) error
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
    kind: method
    name: Backend.Salt
    signature: func (b *Backend) Salt(ctx context.Context) (*salt.Salt, error)
  - file: third_party/openbao/internal/builtin/audit/syslog/backend.go
