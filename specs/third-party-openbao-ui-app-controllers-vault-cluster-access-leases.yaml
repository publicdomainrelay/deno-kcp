apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-leases
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the leases UI controllers can be described and changed
    as a unit: they share the list-root alias, the cluster breadcrumb, the lease adapter
    calls, and the safe-transition helper, and a change to one of them (for example
    the revoke flow or the filter behavior) usually has to stay consistent with the
    others. It exists to pin down what the list and detail screens must do, without
    restating the templates or routes that consume them.'
  requirements:
  - id: r.adapter-access
    level: SHOULD
    text: Lease mutations should be issued through the lease adapter resolved from
      the Ember store (adapterFor('lease')) rather than direct network calls, so revoke,
      force-revoke and renew stay behind one adapter surface.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  - id: r.index-lookup-lease-transition
    level: MUST
    text: The index controller defines a lookupLease action that takes a lease id
      and navigates with transitionToSafe to the route vault.cluster.access.leases.show,
      passing that id as the model argument.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/index.js
  - id: r.list-backend-crumb
    level: MUST
    text: The list controller computes backendCrumb from the vault.cluster controller
      model name, producing a crumb labelled and titled leases whose path is vault.cluster.access.leases.list-root
      and whose model is that cluster name.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-empty-title
    level: MUST
    text: 'The list controller computes emptyTitle from the base key id and the filter:
      when the id is empty it reads ''There are currently no leases.'', when the filter
      is a folder it distinguishes an exact prefix match from a missing prefix match
      with the two filter-specific messages, and otherwise it yields an empty string.'
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-filter-computeds
    level: MUST
    text: The list controller derives filterIsFolder from whether the filter is a
      key folder, filterMatchesKey from whether any model entry has an id equal to
      the filter, and firstPartialMatch by matching model ids against a regular expression
      built from the escaped filter, returning null when the filter already matches
      a key or nothing matches, the single match when the filter equals the shared
      prefix of the model or only one entry matches, and otherwise an object carrying
      the shared prefix as its id.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-filter-state
    level: MUST
    text: The list controller holds filter, filterFocused and isLoading state, and
      its setFilter and setFilterFocus actions write the submitted value into filter
      and filterFocused respectively.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-query-params
    level: MUST
    text: The list controller declares page and pageFilter as query params, backed
      by the page property defaulting to 1 and pageFilter defaulting to null, so list
      position and filter survive a route transition.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-refresh-bubbles
    level: MUST
    text: The list controller's refresh action sends the reload action so the refresh
      request bubbles to the list route rather than being handled in the controller.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-revoke-prefix
    level: MUST
    text: The list controller's revokePrefix action takes a prefix and an isForce
      flag, picks forceRevokePrefix or revokePrefix on the lease adapter obtained
      from the store, and on success transitions safely to vault.cluster.access.leases.list-root
      and raises a success flash message saying all leases under the prefix will be
      revoked, while on failure it joins the error messages and raises a danger flash
      message naming the prefix.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  - id: r.list-root-alias
    level: MUST
    text: list-root.js must re-export the default export of ./list, so the root leases
      list route uses the same controller implementation as the nested list route
      instead of a separate copy.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list-root.js
  - id: r.safe-transitions
    level: SHOULD
    text: All navigation performed by these controllers should go through the transitionToSafe
      helper instead of a plain transitionTo, so an aborted or failed transition does
      not raise an unhandled rejection.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/index.js
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  - id: r.show-backend-crumb
    level: MUST
    text: The show controller computes the same leases backendCrumb from the vault.cluster
      controller model name, with path vault.cluster.access.leases.list-root, so the
      detail screen keeps the list route in its breadcrumb.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  - id: r.show-cleanup-model
    level: MUST
    text: The show controller's cleanupModel must return without touching the model
      when there is no model or when the model is saving, destroyed or destroying,
      and otherwise unset the controller's model and unload the record through removeRecord
      when the model exposes unloadRecord, because controllers are singletons.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  - id: r.show-renew-lease
    level: MUST
    text: The show controller's renewLease action takes a model and an increment,
      calls renew on the lease adapter obtained from the model's store with the model
      id and the increment seconds when present, then sends refreshModel and schedules
      a success flash message naming the renewed lease id, and on failure joins the
      error messages into a danger flash message about renewing the lease.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  - id: r.show-revoke-lease
    level: MUST
    text: The show controller's revokeLease action calls destroyRecord on the passed
      model and then transitions safely to vault.cluster.access.leases.list-root.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
codeRefIndex:
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/index.js
  index.js@third_party/openbao/ui/app/controllers/vault/cluster/access/leases/index.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list-root.js
  list-root.js@third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list-root.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
  list.js@third_party/openbao/ui/app/controllers/vault/cluster/access/leases/list.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
  show.js@third_party/openbao/ui/app/controllers/vault/cluster/access/leases/show.js
