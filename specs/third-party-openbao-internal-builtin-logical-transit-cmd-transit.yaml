apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-logical-transit-cmd-transit
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The context exists so the transit logical backend can be built and run as
    a standalone multiplexed plugin process rather than being linked into a server.
    It separates process wiring, argument and TLS handling from the backend logic
    in the transit package, and it deliberately sets TLSProviderFunc so the plugin
    keeps backwards compatibility with Vault versions that do not support plugin AutoMTLS.
  requirements:
  - id: r.configuration-surface-is-inherited-flag-set
    level: MUST
    text: 'main defines no flags of its own: the whole configuration surface is the
      flag set registered by api.PluginAPIClientMeta.FlagSet() and parsed from os.Args[1:],
      covering the plugin API client address, retry and TLS options (the flags backed
      by the VAULT_ADDR, VAULT_MAX_RETRIES, VAULT_SKIP_VERIFY, VAULT_CACERT, VAULT_CAPATH,
      VAULT_CLIENT_CERT, VAULT_CLIENT_KEY and VAULT_TLS_SERVER_NAME environment variables),
      and when a flag is absent the value registered by that flag set, including its
      environment lookup, applies.'
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
  - id: r.exits-nonzero-on-serve-failure
    level: MUST
    text: When plugin.ServeMultiplex returns an error, main must create an hclog logger,
      log the failure as "plugin shutting down" with the error attached, and call
      os.Exit(1).
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
  - id: r.parses-plugin-api-client-flags
    level: MUST
    text: main must build an api.PluginAPIClientMeta, take its FlagSet and parse os.Args[1:]
      into it, so plugin API client options reach the process from the command line.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
  - id: r.provides-tls-config-to-plugin
    level: MUST
    text: main must read the TLS configuration with apiClientMeta.GetTLSConfig() and
      set it as ServeOpts.TLSProviderFunc through api.VaultPluginTLSProvider, so the
      plugin keeps backwards compatibility with Vault versions that do not support
      plugin AutoMTLS.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
  - id: r.serves-transit-factory-as-plugin
    level: MUST
    text: main must start the transit backend through plugin.ServeMultiplex, passing
      transit.Factory as BackendFactoryFunc, so the transit logical backend is served
      as a multiplexed plugin process.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
codeRefIndex:
- file:third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go main.go@third_party/openbao/internal/builtin/logical/transit/cmd/transit/main.go
