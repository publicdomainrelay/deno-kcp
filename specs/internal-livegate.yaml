apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: internal-livegate
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.deno-kcp
  intent: This context exists to hold the gate that decides whether a test requiring
    live infrastructure runs, fails or skips, so that ordinary runs stay green without
    the kcp, kine, kubectl and deno toolchain while a live-required run (DENO_KCP_REQUIRE_LIVE=1)
    cannot silently skip the live tests. It keeps that decision in one small exported
    surface, RequiresLive for callers that gate early, Require for callers that want
    fail-or-skip behavior, and Short for callers that additionally want the test to
    skip under go test -short.
  requirements:
  - id: r.helpers-attribute-caller
    level: MUST
    text: Require and Short MUST call t.Helper() before deciding anything, so failure
      and skip reports attribute the caller's line rather than the gate's own line.
    codeRefs:
    - file:internal/livegate/livegate.go
    - function:105aa5910047c1743f2bbed1f73895c8
    - function:cc9c12855dee252d71eac5766360e2f9
  - id: r.live-flag-from-env
    level: MUST
    text: RequiresLive MUST report true if and only if the environment variable DENO_KCP_REQUIRE_LIVE
      equals the exact string "1"; any other value, including an unset variable, MUST
      report false.
    codeRefs:
    - file:internal/livegate/livegate.go
    - function:0e31bdc8610f1db91dd40606eac8d2a2
  - id: r.require-fails-when-live-required
    level: MUST
    text: Require MUST call t.Fatalf with the caller's format string and args when
      RequiresLive reports true, so a test gated on live infrastructure fails loudly
      rather than skipping when the run requires live.
    codeRefs:
    - file:internal/livegate/livegate.go
    - function:0e31bdc8610f1db91dd40606eac8d2a2
    - function:cc9c12855dee252d71eac5766360e2f9
  - id: r.require-skips-otherwise
    level: MUST
    text: Require MUST call t.Skipf with the caller's format string and args when
      RequiresLive reports false, so a live test skips quietly and the message text
      is the caller's skip reason.
    codeRefs:
    - file:internal/livegate/livegate.go
    - function:0e31bdc8610f1db91dd40606eac8d2a2
    - function:cc9c12855dee252d71eac5766360e2f9
  - id: r.short-delegates-to-require
    level: MUST
    text: Short MUST call Require with the same format string and args exactly when
      testing.Short() is true, and MUST do nothing when short mode is off, so the
      test keeps running outside short mode.
    codeRefs:
    - file:internal/livegate/livegate.go
    - function:105aa5910047c1743f2bbed1f73895c8
    - function:cc9c12855dee252d71eac5766360e2f9
  interfaces:
  - name: Require
    kind: function
    signature: func Require(t *testing.T, format string, args ...any)
    file: internal/livegate/livegate.go
  - name: RequiresLive
    kind: function
    signature: func RequiresLive() bool
    file: internal/livegate/livegate.go
  - name: Short
    kind: function
    signature: func Short(t *testing.T, format string, args ...any)
    file: internal/livegate/livegate.go
codeRefIndex:
- file:internal/livegate/livegate.go livegate.go@internal/livegate/livegate.go
- function:0e31bdc8610f1db91dd40606eac8d2a2 RequiresLive@internal/livegate/livegate.go:8
- function:105aa5910047c1743f2bbed1f73895c8 Short@internal/livegate/livegate.go:20
- function:cc9c12855dee252d71eac5766360e2f9 Require@internal/livegate/livegate.go:12
