  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers.go
    - function:8e228c24cb7d4873ab46c74eee1bf034
    id: r.add-identity
    level: MUST
    text: AddIdentity must write client_token and entity_id from the logical request
      into the data map, and when entity_id is non-empty must resolve groups through
      view.GroupsForEntity and entity info through view.EntityInfo into entity_groups
      and entity_info, returning an error wrapping the cause as "unable to resolve
      groups" or "unable to resolve entity info" on failure; when entity_id is empty
      it must set entity_groups and entity_info to nil and return nil.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers.go
    - function:87c9bd82e4d2219acc7dbab3eb9d5f53
    id: r.cel-extension-functions
    level: MUST
    text: 'CelGoExtFunctions must return a slice of cel.EnvOption that enables the
      CEL extension libraries: strings, lists, optional types, regex, math, sets and
      encoders, appended in that order.'
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers.go
    - function:217536dc3d8611f03fbd0bdc93a8c780
    id: r.check-valid-email
    level: MUST
    text: CheckValidEmailFunction must register a CEL function named check_valid_email
      with an overload check_valid_email_string that takes one string argument and
      returns bool, bound to the internal checkValidEmail implementation.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - method:506431c8fa963826b50d515c8c677c97
    - method:9fec7e2ecc4848e6520deaf1f6911923
    - struct:b8c5f354c902b6956f2b927c9847eaa0
    id: r.eval-config-environment
    level: MUST
    text: EvalConfig.ToOptions must assemble the environment options for the program,
      including the CEL extension functions, the identity declarations and the check_valid_email
      function; EvalConfig.ToEnv must turn the config into a compiled *cel.Env, returning
      an error when the environment cannot be built.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - function:58f702756fac08f5ba5e092531541b26
    id: r.framework-field-schema
    level: MUST
    text: FrameworkFieldSchema must return the framework.FieldSchema that describes
      how a CEL program is declared as a field, so engines can accept a program through
      framework field data.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers_test.go
    id: r.helper-test-coverage
    level: SHOULD
    text: TestCELHelpers in helpers_test.go should exercise the environment options
      produced by CheckValidEmailFunction and CelGoExtFunctions, so changes to the
      extension set or the email function are caught by the package tests.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers.go
    - function:97fd18ecd0deba8e960b5448c9634251
    id: r.identity-declarations
    level: MUST
    text: 'IdentityDeclarations must declare four CEL variables for the identity subsystem:
      client_token as dyn, entity_id as string, entity_groups as a list of dyn, and
      entity_info as a map from string to dyn.'
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/helpers.go
    - function:a15efeda210e88bf6a901b97ae33b5d7
    - function:ae4893d22b69a3a9d4196b3a6c02495f
    id: r.json-functions
    level: MUST
    text: EncodeJSONFunction must register a CEL function named encode_json and DecodeJSONFunction
      must register one named decode_json, each with a single-string overload that
      returns dyn through its unary binding.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - function:950d1b6de5662233c5a63816d5b62a2e
    id: r.json-program-from-request
    level: MUST
    text: JSONProgramFromRequest must build a *Program from framework.FieldData, returning
      an error when the field data cannot be read into a program.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - method:3c4b9a623c352969ba180f77da6d359e
    - method:7c8435f0735ddb61e1c7cd45db47f88b
    - struct:6a56695d0522bd7f30ba29ae36cc8ac8
    id: r.program-evaluate
    level: MUST
    text: Program.Evaluate must evaluate the program under the given context and EvalConfig
      with the supplied evaluation data and return the resulting ref.Val, first evaluating
      the program's variables so that computed variables are added to the evaluation
      data.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - method:39a89e07c0007d44ab33d00d86a16aa7
    - method:b545eff1ac521ba68f9512e2203d4e8b
    - method:cf1b8b5a35d9e0d7b5e7471fd17171ba
    id: r.program-validate
    level: MUST
    text: Program.Validate must check the program against the environment produced
      from the given EvalConfig and report an error when the expressions do not compile;
      Program.ValidateVars and Variable.Validate must perform the same check for the
      program's variables, returning the environment that carries them.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/cel/program.go
    - method:569442811997bf2ff6bd8e0f200bfd77
    - struct:5fabc76fc387175cfee71ef415a06024
    id: r.variable-evaluate
    level: MUST
    text: Variable.Evaluate must evaluate one variable's expression against the environment
      and evaluation data and return the environment carrying the variable's result,
      so that later expressions can reference it.
