    - method:dd0c7dd26901375dc159bc6bb8b7895e
    id: r.access-delegates-to-wrapper
    level: MUST
    text: 'Every access method forwards to the wrapped wrapping.Wrapper: KeyId, SetConfig,
      Init, Type, Encrypt, Decrypt and Finalize take a context and the caller''s wrapping.Option
      values and return the wrapped wrapper''s results unchanged, so the access type
      adds no policy of its own.'
  - codeRefs:
    - interface:afaac00a9d21de40718500c5552db29b
    - method:950b7978c38d4d12e8235cca4cf10175
    id: r.access-interface-shape
    level: MUST
    text: Access is satisfied only by a type that is simultaneously a wrapping.Wrapper
      with an InitFinalizer and that also provides GetWrapper returning the wrapping.Wrapper
      behind it, so callers can both use the seal directly and reach the concrete
      wrapper underneath.
  - codeRefs:
    - function:3e10133f89ef87ae59ed5ee7d8a3b7f4
    - struct:cde35b63b8efef4de773f1fe38d109cc
    id: r.envelope-lazy-init
    level: MUST
    text: Envelope performs its initialization exactly once, on the first call to
      Encrypt, through a sync.Once guard, so that a zero-value Envelope obtained from
      NewEnvelope is usable without any separate setup call.
  - codeRefs:
    - method:89fa7ef068356304b22bb4e499ea7e7d
    id: r.envelope-metrics
    level: SHOULD
    text: Envelope.Encrypt measures its own duration under the metrics key seal/envelope/encrypt
      before returning, so envelope encryption latency is observable.
  - codeRefs:
    - method:08dd01392a2ffad48955b6e6d56b4249
    - method:89fa7ef068356304b22bb4e499ea7e7d
    id: r.envelope-round-trip
    level: MUST
    text: Envelope.Encrypt takes plaintext and additional authenticated data and returns
      a wrapping.EnvelopeInfo produced by wrapping.EnvelopeEncrypt with wrapping.WithAad(aad);
      Envelope.Decrypt takes a wrapping.EnvelopeInfo and the same additional authenticated
      data and returns the recovered plaintext, so that data encrypted by Envelope
      can be decrypted by the same Envelope.
  - codeRefs:
    - file:third_party/openbao/internal/vault/seal/envelope_test.go
    id: r.envelope-test-coverage
    level: SHOULD
    text: The envelope test exercises Envelope through NewEnvelope, encrypting and
      then decrypting with matching additional authenticated data to assert the recovered
      plaintext equals the input.
  - codeRefs:
    - function:7b45c9a04bd194309dce481869223099
    - method:a5e27741c3a39dd34050d0b0e1961eb8
    id: r.newaccess-wraps-wrapper
    level: MUST
    text: NewAccess takes a wrapping.Wrapper and returns an Access whose GetWrapper
      returns that same wrapper, making any wrapping.Wrapper usable as a seal Access
      without the caller implementing the interface.
  - codeRefs:
    - function:1aaf573ed2a8369b18e6a50d2749296a
    - method:406d3ef61e8e1597a161b9ded005a763
    - struct:34990802a106e2116f074603b03f9633
    id: r.shamir-wrapper-type
    level: MUST
    text: ShamirWrapper implements the wrapper Type query and reports the Shamir wrapper
      type, and NewShamirWrapper returns a ready-to-use *ShamirWrapper so the type
      can be obtained without constructing the struct literal.
  - codeRefs:
    - function:6e518653c302086fa5426b31ecc2f2ae
    - function:cca408f342c172647650ff95c4dd9415
    - struct:479850c12230725a85d5623e41c503de
    id: r.test-seal-construction
    level: MUST
    text: NewTestSeal takes a *TestSealOpts and returns both an Access and the *ToggleableWrapper
      backing it, while NewToggleableTestSeal takes the same options and returns an
      Access plus a func(error) that sets the failure on that wrapper, so tests can
      hold the Access and still reach in to break it.
  - codeRefs:
    - method:2fb2247f7429da01a67ba082d67f21f6
    - method:3c14682bf7bce86369e14e82117840c6
    - method:bc4a91e21f497d9d9430cf90f7a7ac3e
    - struct:a72f879be1bbf0cdf0f1372de5ca30cb
    id: r.toggleable-error-injection
    level: MUST
    text: ToggleableWrapper.SetError records an error, and while it is set ToggleableWrapper.Encrypt
      and ToggleableWrapper.Decrypt return that error instead of performing the operation,
      letting tests drive the error paths of callers that hold only the Access.
  - codeRefs:
    - method:78a01eaa48707823c0b739d357034194
    id: r.toggleable-wrapper-type
    level: MUST
    text: ToggleableWrapper answers the wrapper Type query as well, so a toggleable
      test seal is interchangeable with a production wrapper anywhere an Access or
      wrapping.Wrapper is accepted.
  upstream: self
