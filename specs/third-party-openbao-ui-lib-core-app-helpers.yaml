kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-core-app-helpers
  namespace: default
spec:
  intent: 'This context exists so the OpenBao UI core addon can expose its helper
    set to the host app''s resolver: the app/helpers directory must re-export, under
    the app-namespace paths Ember looks up, the helpers that are implemented once
    in the core addon. The spec records that contract together with the observable
    behaviour of each re-exported helper, so that a change to a shim (a dropped named
    export, a renamed module path) or to the underlying formatting, state-mapping,
    route-matching, sanitizing or flash-message logic is detectable as a spec violation.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/changelog-url-for.js
    id: r.changelog-url
    level: MUST
    text: changelogUrlFor must return the base URL `https://www.github.com/openbao/openbao/blob/main/CHANGELOG.md#`.
      For a falsy version it must return that bare URL. Otherwise it must strip any
      `+suffix` from the version, remove the periods, and append the resulting digits
      only when that numeric value is greater than or equal to 143; any value below
      that threshold, and any error thrown while parsing, must yield the bare URL
      rather than a partial anchor.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/cluster-states.js
    id: r.cluster-states
    level: MUST
    text: 'CLUSTER_STATES must map each cluster and connection state to a record of
      glyph name, isOk and isSyncing: running, ready and stream-wals are ok and not
      syncing with glyph check-circle; merkle-diff, connecting and merkle-sync are
      ok and syncing with glyph sync-reverse; idle is not ok and not syncing with
      glyph x-square; transient_failure and shutdown are not ok and not syncing with
      glyph x-circle. clusterStates must return the record for the given state, or
      the fallback `{ glyph: '''', isOk: null, isSyncing: null }` for an unknown state,
      so the status menu and replication dashboards render identical glyphs and booleans.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/date-format.js
    id: r.date-format
    level: MUST
    text: dateFormat must format a date with the given date-fns style. When isFormatted
      is true it must treat the input as already-formatted and pass `new Date(date)`
      through date-fns format. Otherwise it must parse a string input with parseISO,
      leave a falsy value undefined, and treat a value whose string form is exactly
      10 characters long as epoch seconds and multiply by 1000. It must append the
      local short timezone name only when withTimeZone is true, swallowing any error
      while resolving the zone. It must be usable both as a `{{date-format}}` helper
      and as the exported function.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/format-duration.js
    id: r.format-duration
    level: MUST
    text: duration must treat its argument as a count of seconds, multiply by 1000,
      and return a date-fns formatDuration of the resulting interval. When the nullable
      option is true and the value is the number 0 or the string '0' it must return
      null instead of a zero-filled duration. A value that does not parse to a number
      must be returned unchanged rather than throwing.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/format-number.js
    id: r.format-number
    level: MUST
    text: formatNumber must format a numeric input with `Intl.NumberFormat()` so the
      digits follow the browser locale, and must return any non-number input unchanged.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/img-path.js
    id: r.img-path
    level: MUST
    text: The img-path helper must rewrite a leading `~/` in the given path to `ENV.rootURL`
      followed by `images/`, so templates can reference bundled assets by app-relative
      path.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/is-active-route.js
    id: r.is-active-route
    level: MUST
    text: The is-active-route helper must read the current route name and current
      URL from the injected `host-router` service, strip any query parameters from
      the URL, and return false when there is no current route. It must compare with
      strict equality when the isExact option is true and with a starts-with test
      otherwise. An array route name must be true when any element matches. When a
      model is given it must compare the current URL against `router.urlFor(routeName,
      model)` with the rootURL slice removed; otherwise it must compare against the
      route name.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/loose-equal.js
    id: r.loose-equal
    level: MUST
    text: looseEqual must compare two values with the loose `==` operator so that
      template uses such as a `<select>` selected option match a numeric API value
      against a string option, but it must return false for the 0-versus-empty-string
      pair in either order, which `==` would otherwise report as equal.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/message-types.js
    id: r.message-types
    level: MUST
    text: 'MESSAGE_TYPES must map each message type to its Bulma class, glyph class,
      glyph name and, except for rotation, display text: info (is-info/has-text-info/info/Info),
      success (is-success/has-text-success/check-circle-fill/Success), danger (is-danger/has-text-danger/x-square-fill/Error),
      warning (is-highlight/has-text-highlight/alert-triangle-fill/Warning), loading
      (is-success/has-text-success/loading/Loading) and rotation (is-info/has-text-grey/rotate-cw).
      messageTypes must return the record for the requested type and must raise an
      Ember assertion when the type is not a key of the map.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/options-for-backend.js
    id: r.options-for-backend
    level: MUST
    text: optionsForBackend must resolve the display options for a secret backend
      from a table keyed by backend name. When the selected backend declares tabs
      it must merge the tab whose `name` equals the requested tab, else the tab whose
      `modelPrefix` equals it, else the first tab, into the backend options. A backend
      with no tabs must be returned as-is. An unknown backend must fall back to the
      default display record (searchPlaceholder 'Filter secrets', item 'secret', create
      'Create secret', navigateTree true, editComponent 'secret-edit', listItemPartial
      'secret-list/item') with displayName 'KV' for the kv backend and the capitalized
      backend name otherwise. A pki backend must use the PKI engine option table,
      with tabs overview, roles, issuers, keys, certificates, tidy and configuration
      and navigateTree false, when the isEngine argument is true.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/path-or-array.js
    id: r.path-or-array
    level: MUST
    text: pathOrArray must return its first argument unchanged when that argument
      is an array, and otherwise must read the string path off the second argument
      with `target.get(path)`, so templates that may be handed either a literal list
      or a model path resolve uniformly.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/changelog-url-for.js
    - file:third_party/openbao/ui/lib/core/app/helpers/cluster-states.js
    - file:third_party/openbao/ui/lib/core/app/helpers/date-format.js
    - file:third_party/openbao/ui/lib/core/app/helpers/format-duration.js
    - file:third_party/openbao/ui/lib/core/app/helpers/format-number.js
    - file:third_party/openbao/ui/lib/core/app/helpers/img-path.js
    - file:third_party/openbao/ui/lib/core/app/helpers/is-active-route.js
    - file:third_party/openbao/ui/lib/core/app/helpers/loose-equal.js
    - file:third_party/openbao/ui/lib/core/app/helpers/message-types.js
    - file:third_party/openbao/ui/lib/core/app/helpers/options-for-backend.js
    - file:third_party/openbao/ui/lib/core/app/helpers/path-or-array.js
    - file:third_party/openbao/ui/lib/core/app/helpers/sanitized-html.js
    - file:third_party/openbao/ui/lib/core/app/helpers/set-flash-message.js
    id: r.reexport-shim-contract
    level: MUST
    text: 'Each file in this context must remain a re-export shim that forwards its
      bindings from the corresponding `core/helpers/<basename>` module; it must not
      contain helper logic of its own. Helpers with an extra named export must forward
      both the default and that named binding: `changelogUrlFor` (changelog-url-for),
      `clusterStates` and `CLUSTER_STATES` (cluster-states), `formatNumber` (format-number),
      `isActiveRoute` (is-active-route), `messageTypes` and `MESSAGE_TYPES` (message-types),
      `setFlashMessage` (set-flash-message). The remaining files forward only the
      default export.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/sanitized-html.js
    id: r.sanitized-html
    level: MUST
    text: The sanitized-html helper must pass the input string through DOMPurify `sanitize`
      and wrap the result with `htmlSafe` so it can be rendered with `{{{...}}}`.
      If sanitizing throws it must report the failure through Ember `debug` and return
      the original string as a fallback rather than raising.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/helpers/set-flash-message.js
    id: r.set-flash-message
    level: MUST
    text: The set-flash-message helper must be an Ember Helper class that injects
      the `flash-messages` service and whose compute returns a closure over the message
      and type arguments; invoking that closure must call the service method named
      by the type, defaulting to `success` when no type is given, with the message,
      so templates can bind a message-setting action without invoking it during render.
  upstream: self
