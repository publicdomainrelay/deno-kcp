- struct:f505aca759e0d5ab602240d7661125bd Catalog@third_party/openbao/internal/helper/kmsplugin/catalog.go:32
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-kmsplugin
  namespace: default
spec:
  intent: This context exists because KMS plugins in OpenBao must be usable before
    core is created and are declarative only, so they need their own catalog separate
    from the main core plugin catalog. It gives core a stable way to obtain a sealed/unsealed
    KMS, key or auto-unseal wrapper by name from either a builtin or an external plugin,
    and it keeps those long-lived objects correct across plugin process restarts and
    configuration reloads without the caller seeing ErrPluginShutdown.
