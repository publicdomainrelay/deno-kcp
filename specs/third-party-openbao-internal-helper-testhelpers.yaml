  requirements:
  - codeRefs:
    - function:21743d8240cf38ae3cd19bac795ee3b3
    - function:8b3b190b83e6e05f1ea50e98e6412633
    id: r.active-standby-derivation
    level: MUST
    text: DeriveActiveCore MUST return the cluster core that is currently active,
      and DeriveStandbyCores MUST return the list of cores that are currently standby.
  - codeRefs:
    - function:1bf262f53639f879880380b7009fee08
    - function:436f64f1678732bb106ab188189b598b
    id: r.attempt-unseal-error-variants
    level: MUST
    text: AttemptUnsealCores MUST attempt to unseal all cores and return an error
      rather than failing the test, and AttemptUnsealCore MUST do the same for a single
      core, so callers inside retry loops can observe failure.
  - codeRefs:
    - function:ef29ceb1f08e98afb25e211fd44b8bb0
    id: r.await-leader
    level: MUST
    text: AwaitLeader MUST wait for a leader to be elected and MUST return the index
      of the leader core along with an error if no leader appears.
  - codeRefs:
    - function:37236339a25c57350e293ef4d2f722d6
    id: r.debug-logs
    level: MUST
    text: GenerateDebugLogs MUST start background collection of debug logs from the
      client's server and return a channel the caller closes to stop the collection.
  - codeRefs:
    - function:302c449890b0c3b9d0b09f24ba9f684b
    id: r.entity-and-alias
    level: MUST
    text: CreateEntityAndAlias MUST create an entity and an alias tied to the given
      mount accessor, returning a client logged in through the alias together with
      the entity ID and alias ID.
  - codeRefs:
    - function:1fd6b768199dbc80afb802f7532c2edf
    id: r.local-or-regression-tests
    level: MUST
    text: IsLocalOrRegressionTests MUST report whether the current run is a local
      or regression test run, derived from the environment, so callers can gate expensive
      tests.
  - codeRefs:
    - function:32db13d5818b5c9b29ab24d7c5f06bbf
    id: r.metric-sink-provider
    level: MUST
    text: TestMetricSinkProvider MUST return a constructor that yields a ClusterMetricSink
      and MetricsHelper pair for a named cluster, using the supplied gauge interval.
  - codeRefs:
    - function:3d5461c9a630812f4a426fc83e64be1d
    - function:5a0df139bcdf9762186ccf0b06a366d0
    - function:a17a7881f8bd84728587efb4503e3951
    - function:e3a15668d2382d67f14badae384f4a4a
    id: r.mfa-login-fixtures
    level: MUST
    text: SetupMFALoginEnforcement MUST enable MFA login enforcement from the supplied
      config, SetupUserpassMountAccessor MUST mount userpass and return its accessor,
      GetTOTPCodeFromEngine MUST read a current TOTP code from the engine path, and
      SetupLoginMFATOTP MUST return a client logged in with the named MFA method after
      waiting the given period.
  - codeRefs:
    - function:e87641998499d197dc1aa67c96a2d4e7
    id: r.non-root-token
    level: MUST
    text: SetNonRootToken MUST replace the client's token with a newly created non-root
      token so tests can exercise unprivileged request paths.
  - codeRefs:
    - function:ae9e53d72d0ae633ad773b2f12948ec7
    - method:6095ad68e04632546b4650a1a541f298
    - method:a49201ce012d0f8203c20b3d2a9440ae
    - struct:20e4118e5266add4726d4aa98dfe6fdd
    - struct:68b3f8695f83f0e80c632049ae3c1e50
    id: r.raft-address-providers
    level: MUST
    text: TestRaftServerAddressProvider and HardcodedServerAddressProvider MUST each
      implement ServerAddr, mapping a raftlib.ServerID to a raftlib.ServerAddress
      with an error; NewHardcodedServerAddressProvider MUST build a provider that
      derives each core's address from the core count and base cluster port.
  - codeRefs:
    - function:8f23d03f0b747d2140f9d13391fbfe66
    - function:ec7fdc011e697b2f32c7888e4e813dd3
    id: r.raft-applied-index-track
    level: MUST
    text: RaftAppliedIndex MUST read the core's current Raft applied index, and WaitForRaftApply
      MUST block until the given core's applied index reaches the index supplied by
      the caller.
  - codeRefs:
    - function:87448f4f0ba0db35247dff3872cb59b0
    id: r.raft-join-nodes
    level: MUST
    text: RaftClusterJoinNodes MUST join every non-leader core of the cluster into
      the Raft configuration of the leader so the cluster reaches a full peer set.
  - codeRefs:
    - function:bf37a5e57742bce9377b7cdcb34c3ff5
    id: r.random-prefix
    level: MUST
    text: RandomWithPrefix MUST return the given name with a random suffix appended,
      giving tests collision-free identifiers.
  - codeRefs:
    - function:83bb56c06e94990379ecf08da6210633
    - function:8cbb65d829bcf17da27aaf0c62ee4727
    id: r.retry-until
    level: MUST
    text: RetryUntil MUST re-run the supplied function until it returns nil or the
      timeout elapses, failing the test on timeout; RetryUntilAtCadence MUST do the
      same while sleeping for the given interval between attempts.
  - codeRefs:
    - function:703af259939ff65da6c347d01f1e7d37
    - function:d3d9594a475c6663bf76f86cc8806955
    id: r.root-token-generation
    level: MUST
    text: GenerateRoot MUST produce a root token for the target cluster by delegating
      to GenerateRootWithError and calling t.Fatal when it returns an error, so a
      failed generation aborts the test instead of returning an empty token.
  - codeRefs:
    - function:703af259939ff65da6c347d01f1e7d37
    - type_alias:06e4e821cea607cd83b10c678e2d292a
    id: r.root-token-key-selection
    level: MUST
    text: GenerateRootWithError MUST select cluster.RecoveryKeys when the first core's
      seal reports RecoveryKeySupported, otherwise cluster.BarrierKeys; it MUST clear
      and later restore the client namespace, submit keys until status.Required is
      reached, fail when the cluster holds fewer keys than required, fail when the
      operation ends with Complete false, and decode the encoded token with the OTP
      and OTP length from a follow-up status call.
  - codeRefs:
    - function:fdd708143b528687cfbf48522c28b089
    id: r.rotate-cluster-keys
    level: MUST
    text: RotateClusterKeys MUST rotate the cluster's keys, taking a recovery flag
      that selects recovery or barrier key rotation, and MUST return the new key material.
  - codeRefs:
    - function:4d861313f82326fd7947a103450a7074
    - function:59e09f932f21088e386327849ca9ed08
    id: r.seal-cores-and-wait
    level: MUST
    text: SealCores MUST seal every core of the cluster, and WaitForNCoresSealed MUST
      block until at least n cores report sealed.
  - codeRefs:
    - function:7880d499797fb5694927bf18bfc817e5
    - function:ab43d3579c9e5e476b9217a89a3e4e38
    id: r.seal-whole-cluster
    level: MUST
    text: EnsureCoresSealed MUST seal every core in the cluster by calling EnsureCoreSealed
      on each; EnsureCoreSealed MUST call core.Seal, then poll core.Sealed every 250
      milliseconds until it reports true, and fail the test after 60 seconds.
  - codeRefs:
    - function:05864e22ac19e6534f7e220b6886d355
    id: r.skip-unless-env-vars
    level: MUST
    text: SkipUnlessEnvVarsSet MUST skip the calling test when any of the named environment
      variables is unset, so environment-gated tests do not run by accident.
  - codeRefs:
    - function:8ed3fa31f5d52ab149fa4eb6b7c6ea62
    - function:f376e294816572fec48c1ec97a942d33
    id: r.stable-active-core
    level: MUST
    text: EnsureStableActiveNode MUST wait until the cluster has a stable active node,
      and DeriveStableActiveCore MUST return that core; both tolerate leadership changes
      during startup.
  - codeRefs:
    - function:77cc70cdab53f20062738496d9836b36
    - struct:e1235dc4562f38361be34e00c8f8d4a7
    id: r.sys-metrics-request
    level: MUST
    text: SysMetricsReq MUST query the cluster's sys/metrics endpoint through the
      client and decode the response into SysMetricsJSON, taking an unauth flag that
      selects an unauthenticated request.
  - codeRefs:
    - function:78a42a5948fc8f761ec7a8c367cc4a63
    - function:7f0c11f062929b8c4968d5fadb169848
    - function:eeb4e671874f9c2eeafad251d4f029d3
    id: r.totp-fixtures
    level: MUST
    text: SetupTOTPMount MUST mount a TOTP secrets engine, SetupTOTPMethod MUST create
      a TOTP MFA method from the supplied config and return its method ID, and RegisterEntityInTOTPEngine
      MUST create a TOTP key in the engine for the given entity and method, returning
      the engine path.
  - codeRefs:
    - function:606391be36c093942c10d1d46278023a
    - function:a51d6542e6e80e13d7c89c57223fecb5
    id: r.unseal-whole-cluster
    level: MUST
    text: EnsureCoresUnsealed MUST unseal every core in the cluster by calling EnsureCoreUnsealed;
      EnsureCoreUnsealed MUST bring the given core back to unsealed state before returning.
  - codeRefs:
    - function:350eafd6e6856bc9d221420336605e91
    id: r.verify-raft-configuration
    level: MUST
    text: VerifyRaftConfiguration MUST inspect the Raft configuration of the given
      core and return an error unless the configuration contains the expected number
      of cores.
  - codeRefs:
    - function:f639aebaaa92880411a2fc7928c996e8
    id: r.verify-raft-peers
    level: MUST
    text: VerifyRaftPeers MUST compare the client's observed Raft peers against the
      expected peer set and return an error describing any mismatch.
  - codeRefs:
    - function:61673ce1b352f97bb54a78df456daee3
    - function:9bdce641e42530d70e0b2c5ebe9766ff
    id: r.wait-active-and-standby-node
    level: MUST
    text: WaitForActiveNode MUST return the core of the cluster that becomes active,
      while WaitForStandbyNode MUST block until the given core is serving as standby.
  - codeRefs:
    - function:adb76c6fb2245412c67f7d20cd62636a
    - function:de12107bf9f24730724a8095cf46ebc8
    id: r.wait-active-with-standbys
    level: MUST
    text: WaitForActiveNodeAndStandbys MUST wait until the cluster has an active node
      together with its standby nodes, and WaitForNodesExcludingSelectedStandbys MUST
      do the same while skipping the core indexes passed as variadic arguments.
  - codeRefs:
    - function:b20cfe56018941079e9bb4b1e7f6f52e
    id: r.wait-unsealed-count
    level: MUST
    text: WaitForNCoresUnsealed MUST block until at least n cores of the cluster report
      unsealed.
  upstream: self
