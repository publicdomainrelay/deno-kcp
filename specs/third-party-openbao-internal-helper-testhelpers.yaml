metadata:
  name: third-party-openbao-internal-helper-testhelpers
  namespace: default
spec:
  intent: Keep cluster-lifecycle boilerplate out of individual tests so every OpenBao
    test can seal, unseal, join and await nodes through one reviewed implementation.
    The file exists because these operations are timing sensitive and duplicated across
    many packages; centralizing them (with polling loop and timeouts) makes tests
    deterministic and gives the tree one place to fix cluster-readiness bugs.
