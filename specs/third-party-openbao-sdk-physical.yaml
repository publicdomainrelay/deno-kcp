    - method:eced766ac933e67ac9dc3b887af8dee0
    id: r.ha-and-fencing
    level: MUST
    text: HABackend must let a node take a lock on a key with LockWith and report
      whether HA is available, FencingHABackend must let the lock of the active node
      be registered for fencing, and Lock plus RemoteLock must model lock, unlock,
      value retrieval and active-hold checks so leadership and fencing work over any
      backend that implements them.
  - codeRefs:
    - file:third_party/openbao/sdk/physical/latency.go
    - function:2773de0d74caf975495b1df34f2aa3f2
    - method:bfb76404b2485cdaed97b99a6ed2bb69
