apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-physical
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so that every storage engine in deno-kcp and the third_party/openbao
    tree can be programmed against one small interface while cache, encoding, fault
    injection, view scoping, pagination and notification behaviour are composed as
    wrappers instead of being baked into each engine. Callers depend on Backend plus
    whichever optional capability interfaces a particular engine implements, and the
    Exercise* helpers define what a correct implementation must do, so they act as
    the executable specification for every backend and decorator.
  requirements:
  - id: r.backend-conformance-tests
    level: MUST
    text: ExerciseBackend, ExerciseBackend_ListPrefix, ExerciseHABackend and ExerciseTransactionalBackend
      must be the conformance suite a backend runs against itself, covering basic
      read, write and delete, prefix listing, locking across two HA backends, and
      commit and rollback semantics, so every backend in the project is held to one
      behaviour.
    codeRefs:
    - file:third_party/openbao/sdk/physical/testing.go
    - function:34f9a200d286ca26f172fafe9c35b6d9
    - function:ab3724de969fbcf4b7c60877fe893a52
    - function:cdf9401bd1ce3d8e201d0bb21c095eb2
    - function:f38102f89c2dd4dd5ab77bd257bb3242
  - id: r.backend-contract
    level: MUST
    text: Backend must define exactly the storage contract Put(ctx, *Entry), Get(ctx,
      key), Delete(ctx, key), List(ctx, prefix) and ListPage(ctx, prefix, after, limit),
      so that every storage engine and every decorator in the package is programmable
      against one interface.
    codeRefs:
    - interface:c42dc92aaf803810f2890fe01b5c2e74
    - method:90d0f26d835b68dfd2e2fb5cf369ecc9
    - method:b0109019be0473eecfda55b4725fe9e7
    - method:c70a44f71273e5619bc9d984abbe0eb7
    - method:df5b7487ed3c9362165f313858b129bc
    - method:e0dd79955ca589a7e7a28ff75e3f99bd
  - id: r.cache-invalidate
    level: SHOULD
    text: The cache must expose Invalidate so a single key can be dropped from memory
      without a full purge, and must not cache keys that ShouldCache rejects, so health
      and lock keys bypass the cache.
    codeRefs:
    - file:third_party/openbao/sdk/physical/cache.go
    - method:38a1adf14495b6d3bf7c358c6cc3ac83
    - method:b7a2798b7fe8309ddb44db1c630f1e2e
    - method:dce8a4574d05b37899f35f8737f03cd9
  - id: r.cache-layer
    level: MUST
    text: NewCache must wrap a Backend in an LRU cache of the given size that serves
      Get from memory, writes through on Put and Delete, purges or disables itself
      through ToggleablePurgemonster, and returns a cacheTransaction from BeginTx
      and BeginReadOnlyTx that applies its buffered writes to the cache only after
      the underlying transaction commits; CacheRefreshContext opts a call into a cache
      refresh and that flag must be honoured on read.
    codeRefs:
    - function:34327220403569fa0aff0977c0c1f591
    - function:ff4d7eee1ee723e8b6728c7b4904d7b3
    - interface:3e369c75b5f78584ecb1fb21b4e3f76d
    - interface:c551f864d0a2d50fbce634ac814b194c
    - method:49c2c5b43f002a86e6cdd21df5e236fc
    - method:59757faeb1505f1513aaed08368aecd6
    - method:606a138a7fec3d3e2de986b2e445a895
    - method:669f632567fcb141c59621312cd2ada1
    - method:d2a50636c0acef479ab5a8d4dcd20399
  - id: r.entry-record
    level: MUST
    text: Entry must be the unit of stored data carrying Key, Value and SealWrap,
      with String rendering a human-readable form and Clone returning a copy whose
      Value does not alias the original, so cached entries can be handed out without
      letting callers mutate the store's copy.
    codeRefs:
    - file:third_party/openbao/sdk/physical/entry.go
    - method:1e9458db4df54ab1e095336d02ec8291
    - method:e4831f61ffb6b9b38ea13833b9d1c4e6
    - struct:6d1685314383067122ddde5e7575b72e
  - id: r.error-injector
    level: MUST
    text: NewErrorInjector must wrap a Backend and fail a percentage of read and write
      operations set by SetErrorPercentage, starting from the percentage passed to
      the constructor, so failure handling can be exercised; its transactional form
      must delegate BeginTx and BeginReadOnlyTx to the wrapped backend.
    codeRefs:
    - function:714984d2ed75dac6bfd87f642ad23447
    - interface:5b84e8caa4286b4b2b689fd80ebd982c
    - method:21ad4cfa5e9d435d4e7b98662c286b7c
    - method:54e8311f600071e530e66c8829de81a5
    - method:8ce0c799baa8cb5521a15ff709d4f9ad
    - method:9d4210c668df313546cd914b87438b82
  - id: r.ha-and-fencing
    level: MUST
    text: HABackend must let a node take a lock on a key with LockWith and report
      whether HA is available, FencingHABackend must let the lock of the active node
      be registered for fencing, and Lock plus RemoteLock must model lock, unlock,
      value retrieval and active-hold checks so leadership and fencing work over any
      backend that implements them.
    codeRefs:
    - interface:05f1884eee66d15665c49c8df37093e2
    - interface:78bc32a027b56ca8606681d66c086d75
    - interface:8c498e2cc09fa8cf2e6cebb864101897
    - interface:c4f6350d056e8dd0c44a4be82e5f4d52
    - method:39e64095b3c2731bec496e6f9d83a437
    - method:b4b2d66682d3ff1690be03763052bc7e
    - method:eced766ac933e67ac9dc3b887af8dee0
  - id: r.latency-injector
    level: MUST
    text: NewLatencyInjector must wrap a Backend and delay every Put, Get, Delete,
      List and ListPage by the configured latency plus or minus a jitter percentage,
      with SetLatency changing the delay at runtime so timing behaviour can be tuned
      without rebuilding the backend chain.
    codeRefs:
    - function:2773de0d74caf975495b1df34f2aa3f2
    - method:bfb76404b2485cdaed97b99a6ed2bb69
    - method:df9fbb73cfa0e176f7558a5f99cf146f
    - method:fc4b85d6d89264444aa804cbab2f4b5e
    - struct:6814c01d24d533bd86c51d633e3ed326
  - id: r.list-pagination
    level: MUST
    text: List must return the keys directly under a prefix, and ListPage must return
      the same keys but starting after the given key and capped at limit, so a caller
      can page through a large prefix by feeding the last key of one page back as
      after.
    codeRefs:
    - interface:c42dc92aaf803810f2890fe01b5c2e74
    - method:b0109019be0473eecfda55b4725fe9e7
    - method:df5b7487ed3c9362165f313858b129bc
  - id: r.lister-pagination
    level: SHOULD
    text: Lister must drive paginated listing over a backend, exposing SeekPrefix
      to set the cursor and ListPage to return the current page of keys together with
      the keys still remaining, so callers can stream a large prefix without holding
      it all in memory.
    codeRefs:
    - file:third_party/openbao/sdk/physical/listing.go
    - method:082b9444e66f470df2382ba626b3d47c
    - method:903301af689bb47f9423be6a2c91683a
    - struct:bdca7bea47a8a839f16a5d2320c1c5bf
  - id: r.operation-and-factory-aliases
    level: MAY
    text: Operation, InvalidateFunc, Factory and WriteNotificationFunc may stay named
      types so operation verbs, invalidation callbacks, backend constructors and write
      notification callbacks are self-describing in signatures.
    codeRefs:
    - type_alias:088e88cc51204d45396356d351d30b3c
    - type_alias:33b86ed3a30df440a3be670b55c5e8ba
    - type_alias:92241f5fc12edd1a43cc696311e80203
    - type_alias:cfca255d3a7b14ad2dcb681120ee5002
  - id: r.optional-capabilities
    level: MUST
    text: ToggleablePurgemonster, CacheInvalidationBackend and RedirectDetect must
      stay separate from Backend so cache purging, invalidation hook-up and host address
      detection are discovered by type assertion, and a backend that does not support
      them still satisfies Backend.
    codeRefs:
    - interface:105a98988cc407ace2a693c323fe82f0
    - interface:3d13c6617dfad919aaca553fabf6b528
    - interface:d74a7bde4c43f84103136095df7eeee9
    - method:87f1c1ae650ab54554e746f7c2823ed4
    - method:9c6852a96169247050fd8ccce0f56037
  - id: r.permit-pool
    level: MUST
    text: NewPermitPool must bound the number of concurrent operations to the given
      permit count, blocking in Acquire until a permit frees, releasing it in Release,
      and reporting the outstanding count from CurrentPermits.
    codeRefs:
    - function:561c6b9266d3a78ad6b74428ac50ec7d
    - method:73f4f5e3dbdbc2785e422a2c07f8bf80
    - method:c25fb5faa3f522a39ad67f58a5437f14
    - method:c60fd2c06818cef2fb49cc9198048173
    - struct:03a3c1fe3ff0e393c6f0e45c695c5798
  - id: r.physical-access-purge
    level: MUST
    text: NewPhysicalAccess must expose a Backend plus Purge over the wrapped store,
      so an operator-facing path can delete a whole keyspace by listing and deleting
      keys rather than touching single keys only.
    codeRefs:
    - file:third_party/openbao/sdk/physical/physical_access.go
    - function:2c3211f729a5fb94085fd69b2f0be6c1
    - method:06bfe54d55d7d12ca01fad789ea1d1c5
    - method:7388501859c23bf4f54700997e6b21cb
    - struct:df3721d3c77a1d9a71bc36b0792ebaa9
  - id: r.prefix-view
    level: MUST
    text: 'NewView must scope a Backend to a fixed prefix: Get, Put and Delete must
      address keys inside that prefix and List and ListPage must return results with
      the prefix already stripped, so a caller sees a self-contained subtree and cannot
      reach outside it.'
    codeRefs:
    - function:74f5abaeca87696c252646165f7d64bb
    - method:4a2d96ce2188c5b8bc883354eb54e8dc
    - method:66c85653a25af6fe5b7fc5933ea73fb2
    - method:acf6ac641ccd2a39961630501c372d56
    - method:bfdd975da6282f8d7d8b51d053b0d10d
    - method:d2e603651f28a5362f2db38d7adda611
    - struct:5bc75dfe5fc1d9713f0aa85b4d53da4e
  - id: r.prefixes-helper
    level: SHOULD
    text: Prefixes must return the ancestor prefixes of a key path so cache and invalidation
      code can walk from a leaf key up to its parent prefixes without re-parsing the
      separators.
    codeRefs:
    - function:53225bb6c155915c3d2308b06988e63d
  - id: r.replication-index
    level: MUST
    text: ReplicationIndexBackend must report the applied replication index and compare
      two index values for greater-or-equal, so a follower can decide whether it is
      behind the leader without decoding the index itself.
    codeRefs:
    - interface:13bd2e0d23b764cee32c11c2f8dc9018
    - method:3e0174bce2e864f3d2829e37dc7583c4
    - method:80d9c59fdb37241fac49f6caeac1b43e
  - id: r.storage-encoding
    level: MUST
    text: NewStorageEncoding must return a Backend wrapping the given backend that
      applies a storage encoding on every entry it writes and reverses it on every
      entry it reads, and its transactional form must return a StorageEncodingTransaction
      that applies the encoding on Put and passes Commit and Rollback through to the
      wrapped transaction.
    codeRefs:
    - function:72f695e0a898c83f112db456c8a1d4b1
    - interface:0047ee89f59f43dfe4e94ec0eee269e1
    - interface:3abc2ea0c97155337bff68b1c25b282d
    - interface:c55488afd8098351787fbc2017fc50be
    - method:0775930799b3c6c71386dbd6956849ae
    - method:0bd332eb0420eae831a35b27de7a080e
    - method:a5ccf39e4acbab3fa36e5a1b3eb7791c
  - id: r.transactions
    level: MUST
    text: Transactional must offer BeginReadOnlyTx and BeginTx returning a Transaction,
      and Transaction must offer Commit and Rollback; TransactionalBackend must combine
      Transactional with Backend so a caller can hold one value that is both a store
      and a transaction factory.
    codeRefs:
    - interface:08ffcc14df3c8b65543b0d305373c3e9
    - interface:9852d12ad0d3e5dbdf54721c45db0b05
    - interface:a169b37932f13dfaab67c2887a0b2628
    - method:5c8e9fb8611f650250e76ffef962a5a2
    - method:6bc6aa931a840535c0cce016b506112b
    - method:a8de377adade7c00825c85121c76f056
    - method:e584b81c98057c68f9a170f9266091d2
  - id: r.unfenced-write-context
    level: MUST
    text: UnfencedWriteCtx must mark a context as an unfenced write and IsUnfencedWrite
      must read that mark back, so a write that must bypass the active-node fence
      is distinguishable from an ordinary write further down the backend chain.
    codeRefs:
    - function:535042a02a24c9c58620a8f8f73e5bf3
    - function:7a68fe5f09705029eb92a822dd50d285
  - id: r.write-notifier
    level: MUST
    text: NewWriteNotifier must return a Backend that calls the supplied WriteNotificationFunc
      after a successful Put and after a transaction commits, and that accepts an
      InvalidateFunc through HookInvalidate so other components learn the keyspace
      changed.
    codeRefs:
    - function:3aee5dde26ea2637ff9ca7a8b4120606
    - method:9486c15807ce309a30801a9300fb6beb
    - method:a45e787aaed05d32de40a9159ea18d20
    - method:e8833094d318122c1592c109f76a4f0c
    - type_alias:92241f5fc12edd1a43cc696311e80203
