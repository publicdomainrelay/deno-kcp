    id: r.prefix-view
    level: MUST
    text: 'NewView must scope a Backend to a fixed prefix: Get, Put and Delete must
      address keys inside that prefix and List/ListPage must return results with the
      prefix already stripped, so a caller sees a self-contained subtree and cannot
      reach outside it.'
