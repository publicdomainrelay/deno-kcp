kind: SystemContext
metadata:
  name: third-party-openbao-sdk-physical
  namespace: default
spec:
  intent: It exists so that every storage engine in the project (file, in-memory,
    raft, and the deno-kcp consumers) can be programmed against one small interface
    while cache, encoding, injection, notification, view scoping and listing behaviour
    are composed as wrappers rather than baked into each engine. Callers depend on
    Backend and on the optional capability interfaces; the Exercise* helpers define
    what a correct implementation must do, so they act as the executable specification
    for every backend.
  interfaces:
  - file: third_party/openbao/sdk/physical/physical.go
    kind: interface
    name: Backend
    signature: type Backend interface { Put(ctx context.Context, entry *Entry) error;
      Get(ctx context.Context, key string) (*Entry, error); Delete(ctx context.Context,
      key string) error; List(ctx context.Context, prefix string) ([]string, error);
      ListPage(ctx context.Context, prefix string, after string, limit int) ([]string,
      error) }
