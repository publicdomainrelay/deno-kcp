- method:fded460c7078778ffea2cd85a93b850d State.Get@third_party/openbao/internal/serviceregistration/kubernetes/testing/testserver.go:192
- struct:228e3f72d1b3b05693c0021e9a24d507 Conf@third_party/openbao/internal/serviceregistration/kubernetes/testing/testserver.go:61
