apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-secrets
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so the secrets-engine list and single-engine URLs of
    the OpenBao/Vault UI resolve to real model data and to a sensible default child
    route. backends.js gives the secrets overview a model of all secret engines; backend.js
    resolves one engine by path, records that path in the shared secretMountPath service
    so descendants and components know the active mount, and forwards the intermediate
    route to the engine's list-root child when no child route claimed the transition.
    Together they are the routing seam between URL parameters and the secret-engine
    ember-data records that every secrets screen reads.
  requirements:
  - id: r.backend-route-keeps-old-model-slot
    level: MAY
    text: backend.js may keep an oldModel field initialized to null on the route object
      to carry the previously resolved engine across transitions.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
  - id: r.backend-route-redirects-to-list-root
    level: MUST
    text: backend.js must implement afterModel(model, transition) so that when transition.targetName
      equals the route's own routeName it replaces the current transition with vault.cluster.secrets.backend.list-root,
      passing the model's path; the redirect must not run for transitions that target
      a deeper child route.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
  - id: r.backend-route-resolves-one-engine-by-path
    level: MUST
    text: 'The single-engine route in backend.js must inject the store, flashMessages
      and secretMountPath services, and its model hook must read the backend value
      out of params, call secretMountPath.update(backend) before querying, then return
      store.query(''secret-engine'', { path: backend }) and resolve to the first record
      of the result, or to a falsy value when the query returns nothing.'
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
  - id: r.backends-index-route-lists-engines
    level: MUST
    text: The secrets route in backends.js must inject the store service and, in its
      model hook, return store.query('secret-engine', {}) so the route's model is
      every mounted secrets engine record.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backends.js
  - id: r.both-routes-default-export
    level: MUST
    text: Both files must extend Ember's Route and expose the result as the module's
      default export; they export no named bindings.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backends.js
codeRefIndex:
- file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js backend.js@third_party/openbao/ui/app/routes/vault/cluster/secrets/backend.js
- file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backends.js backends.js@third_party/openbao/ui/app/routes/vault/cluster/secrets/backends.js
