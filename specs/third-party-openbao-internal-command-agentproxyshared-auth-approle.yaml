apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agentproxyshared-auth-approle
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The context exists so the agent proxy can log in to OpenBao with AppRole
    credentials that live on disk rather than in memory, reading a required role ID
    file and an optional secret ID file at authentication time, with support for unwrapping
    a response-wrapped secret ID and for deleting the secret ID file once read. It
    defines the configuration surface for that login path (role_id_file_path, secret_id_file_path,
    remove_secret_id_file_after_reading, secret_id_response_wrapping_path) and implements
    the auth.AuthMethod interface used by the shared auth package, including the no-op
    rotation hooks NewCreds, CredSuccess and Shutdown that tell the caller this method
    has no credential watch channel.
  requirements:
  - id: r.config-validation
    level: MUST
    text: NewApproleAuthMethod returns an error when the auth.AuthConfig or its Config
      map is nil, when role_id_file_path is absent, not a string, or empty, and when
      secret_id_file_path or secret_id_response_wrapping_path is present but not a
      string or is the empty string; remove_secret_id_file_after_reading is parsed
      with parseutil.ParseBool and any parse failure is returned as an error.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - function:23702cdb560ebaf22d5fff5fe0a2c7b2
  - id: r.login-request-shape
    level: MUST
    text: Authenticate returns the path "<mountPath>/login" with a request body containing
      role_id only when secretIDFilePath is empty, and containing both role_id and
      secret_id once a cached secret ID exists; it returns an empty path with the
      error "no known secret ID" when a secret ID path is configured but no secret
      ID could be resolved.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:ae0e8df4f98addd9a1a546ad3ef7d460
  - id: r.role-id-read-cache
    level: MUST
    text: Authenticate stats the role ID file path and, when it exists, reads it and
      stores the trimmed contents in cachedRoleID; a read error or an empty file is
      fatal with errors "error reading role ID file and no cached role ID known" or
      "role ID file empty and no cached role ID known" unless a cached role ID is
      already known, in which case it logs a warning and continues; an empty cachedRoleID
      at the end of this step returns the error "no known role ID".
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:ae0e8df4f98addd9a1a546ad3ef7d460
  - id: r.rotation-hooks-noop
    level: MUST
    text: approleMethod.NewCreds returns a nil channel and CredSuccess and Shutdown
      do nothing, which tells the shared auth package that this method has no credential-update
      channel and needs no cleanup on shutdown.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:7b0e6de5a77ea6d0d6cffa4a561afdf9
    - method:9efa2f8bd29ab6444a35fa65ae08f0ca
    - method:a052addb3a943fe663c151d4ec54fa5a
  - id: r.secret-id-file-after-reading-default
    level: MUST
    text: NewApproleAuthMethod sets removeSecretIDFileAfterReading to true by default
      and only overrides it when the remove_secret_id_file_after_reading key is present
      in the config, so an absent key means the secret ID file is deleted after it
      is read.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - function:23702cdb560ebaf22d5fff5fe0a2c7b2
  - id: r.secret-id-file-removal
    level: SHOULD
    text: After a non-wrapped secret ID is read and cached, Authenticate removes the
      secret ID file when removeSecretIDFileAfterReading is enabled, logging the error
      and continuing rather than failing when the removal fails.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:ae0e8df4f98addd9a1a546ad3ef7d460
  - id: r.secret-id-read-cache
    level: MUST
    text: When secretIDFilePath is set, Authenticate stats and reads that file, trims
      the value into cachedSecretID, and on read error or empty content fails with
      the matching "... secret ID ..." error unless a cached secret ID is already
      known, in which case it logs a warning and reuses the cached value.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:ae0e8df4f98addd9a1a546ad3ef7d460
  - id: r.wrapping-path-validation
    level: MUST
    text: When secret_id_response_wrapping_path is configured, Authenticate clones
      the API client, sets the file contents as its token, looks up sys/wrapping/lookup,
      requires the response and its data and the creation_path field to be present
      and a string, and rejects the login with "unable to validate wrapping token
      creation path" when creation_path differs from the configured path; it then
      unwraps the token and takes the secret_id from the response data, returning
      specific errors for a nil response, nil data, missing key, or non-string secret_id.
    codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
    - method:ae0e8df4f98addd9a1a546ad3ef7d460
  interfaces:
  - name: NewApproleAuthMethod
    kind: function
    signature: func NewApproleAuthMethod(conf *auth.AuthConfig) (auth.AuthMethod,
      error)
    file: third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
  - name: approleMethod.Authenticate
    kind: method
    signature: func (a *approleMethod) Authenticate(ctx context.Context, client *api.Client)
      (string, http.Header, map[string]any, error)
    file: third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
  - name: approleMethod.CredSuccess
    kind: method
    signature: func (a *approleMethod) CredSuccess()
    file: third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
  - name: approleMethod.NewCreds
    kind: method
    signature: func (a *approleMethod) NewCreds() chan struct{}
    file: third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
  - name: approleMethod.Shutdown
    kind: method
    signature: func (a *approleMethod) Shutdown()
    file: third_party/openbao/internal/command/agentproxyshared/auth/approle/approle.go
