kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-forwarding
  namespace: default
spec:
  intent: 'The context exists so the request-forwarding wire protocol, the HA gating
    rules, the certificate lookups, and the client heartbeat/namespace-key/invalidation
    loops can be reasoned about and changed as one unit. It is the seam between a
    standby node and the active node: a standby must forward HTTP requests, ship and
    fetch namespace seal keys, and stay current on invalidations, while the active
    node must answer those RPCs and push invalidations. The proto service is named
    `RequestForwarding` for legacy reasons but carries health, forwarding, key sharing
    and invalidation RPCs, so the specification must record all of them together.'
