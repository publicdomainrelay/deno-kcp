  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    - method:1803b44005543fb410369fc6775894fa
    id: r.advertise-key-intersection
    level: MUST
    text: forwardedRequestRPCServer.AdvertiseNamespaceKeys returns the intersection
      of the core's namespaces missing keys and the namespaces named in the request,
      preserving the order of the missing-keys list.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.check-invalidations-blocks
    level: MUST
    text: forwardedRequestRPCServer.CheckInvalidations registers the stream as an
      invalidation peer, returns the error `not registered; check active server's
      logs for information` when registration fails, and otherwise blocks on the peer
      stop channel until the stream is finished so the stream stays open while invalidations
      are delivered.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    - method:1b067542b829f0468655cbb5452cc6f2
    id: r.check-replication-index-uuid
    level: MUST
    text: Client.CheckReplicationIndex returns the error `active node has not returned
      a uuid` when the stored peer uuid is nil or empty, otherwise calls StartInvalidations
      with that uuid and propagates transport failures, a nil response as `no replication
      index returned by active node`, and a non-empty response error field; on success
      it returns the response index.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    id: r.client-cert-lookup
    level: MUST
    text: RequestForwardingClusterClient.ClientLookup returns nil certificate and
      nil error when the parsed cluster certificate is nil or the stored cluster certificate
      is empty, copies the stored certificate bytes, and returns a TLS certificate
      carrying that certificate, the local cluster private key and the parsed cert
      leaf only when one of the acceptable CA subjects equals the parsed certificate
      raw issuer; otherwise it returns nil, nil.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    - function:0cb099a795e1619529e0e06329fa7eeb
    id: r.client-heartbeat-loop
    level: MUST
    text: Client.Start runs an immediate echo tick and immediate key sync in a goroutine,
      then loops on the task context, the echo ticker and the namespace sync ticker;
      on task context cancellation it stops the echo ticker and sets the active node
      replication state to unknown.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.client-stop-nil-safe
    level: MUST
    text: Client.Stop returns nil on a nil receiver, otherwise stops invalidations
      and closes the gRPC connection; Client.StopInvalidations returns without action
      when no invalidations cancel function was set.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.client-timeouts-and-guard
    level: MUST
    text: Each echo tick is bounded by a two second context timeout and stores the
      active node replication state from the reply after verifying a non-nil `pong`
      reply; each namespace key synchronization is bounded by a two minute context
      timeout and is guarded by an atomic boolean so overlapping syncs log a warning
      and return instead of running concurrently.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    - method:1c4479bf1a1523c08050547f1ef627b1
    id: r.cluster-info-contract
    level: MUST
    text: 'The package must obtain all cluster identity from its `core` interface:
      the cluster address, replication state getter and setter, redirect address,
      local cluster private key, parsed certificate, raw certificate pointer and effective
      SDK version, plus raft backend access, logging, namespace key listing and mutation,
      restart, invalidation peer registration and invalidation awaiting; the handler
      stores only the narrower `clusterInfoGetter` view of the core.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.echo-heartbeat
    level: MUST
    text: forwardedRequestRPCServer.Echo caches an incoming node connection info entry
      keyed by cluster address when the request cluster address is non-empty, updates
      raft follower states only when the raft applied index is positive, the raft
      node id is non-empty and follower states are configured, and replies with message
      `pong` plus the core replication state and, when a raft backend exists, its
      applied index and node id.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.forward-request-serves-http
    level: MUST
    text: forwardedRequestRPCServer.ForwardRequest parses an HTTP request out of the
      forwarded request, serves it through the configured HTTP handler using the RPC
      response writer, recovers and logs panics with path, error and stack trace instead
      of failing the RPC, and copies status code, body and header entries into the
      response.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.get-keys-fetch
    level: MUST
    text: getKeys returns nil when the core reports no namespaces missing keys, requests
      those namespaces from the active node, returns nil when the reply carries no
      keys, and otherwise writes the returned batch back through core.SetNamespaceKeys,
      wrapping failures as `failed loading namespace keys`.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.get-namespace-keys-partial
    level: MUST
    text: forwardedRequestRPCServer.GetNamespaceKeys returns an empty reply after
      logging an error when the core call fails and returned no keys, logs a warning
      but continues when it fails and returned some keys, and otherwise returns every
      returned key as a uuid/key pair.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    - function:026de1a79700fc1f78d3fd8fe04f7fcd
    id: r.grpc-tuning
    level: MUST
    text: The constructor builds the gRPC server with server keepalive time equal
      to twice `cfg.ClusterHeartbeatInterval` and with max receive and max send message
      size both set to `math.MaxInt32`.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    - function:026de1a79700fc1f78d3fd8fe04f7fcd
    id: r.ha-gates-server-registration
    level: MUST
    text: NewRequestForwardingHandler resolves `ha := cfg.HA != nil` once to avoid
      races, and registers the forwarded request RPC server on the gRPC server only
      when `ha` is true and `cfg.ClusterHandler` is non-nil; the returned handler
      records the `ha` flag, the named logger `request-forward`, the HTTP/2 server,
      and a fresh stop channel.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    id: r.handoff-non-ha-closes
    level: MUST
    text: Handoff returns nil after warning and closing the TLS connection when the
      handler is not in HA mode; in HA mode it registers two wait-group units, closes
      the connection when any of quit channel, caller close channel, or the handler
      stop channel fires, and serves the connection through the HTTP/2 server with
      the gRPC server as handler.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    - function:684d05cae83340677266163547b53c6d
    id: r.legacy-package-fallback
    level: SHOULD
    text: LegacyPackageFallback must behave as a gRPC unary client interceptor that
      retries only when the first call returned the Unimplemented status code, rewriting
      the method from `/forwarding.RequestForwarding/Echo` and `/forwarding.RequestForwarding/ForwardRequest`
      to the `/vault.RequestForwarding/...` names and returning the original error
      for any other method or status, so OpenBao 2.6 and later interoperate with nodes
      up to 2.5.
  - codeRefs:
    - interface:4e11799c5ea2b292ced25f57a07d324b
    - interface:b38b7cf9fd528e74ae80012ff2edcdd3
    id: r.namespace-key-exchange-two-step
    level: MUST
    text: Namespace key sharing must stay a two-step advertise-then-send exchange
      for the standby-to-active direction, as stated by the service comments, so keys
      the active node already holds are never sent over the wire; the active-to-standby
      direction is a single GetNamespaceKeys call used for refresh.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    - method:247989895b4739874b94fa41cbeed1e4
    id: r.send-namespace-keys-retry-not-error
    level: MUST
    text: 'forwardedRequestRPCServer.SendNamespaceKeys flattens the repeated uuid/key
      pairs into a map, calls core.SetNamespaceKeys, logs and replies with `Retry:
      true` when that call fails, and otherwise replies with an empty reply; the RPC
      never turns this failure into a gRPC transport error.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    id: r.server-lookup-errors
    level: MUST
    text: ServerLookup copies the local cluster certificate and returns a TLS certificate
      with the local private key and parsed leaf, and returns the error `got forwarding
      connection but no local cert` when the stored certificate is empty; CALookup
      returns a single-element slice of the parsed certificate and errors with `forwarding
      connection client but no local cert` when that certificate is nil.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    id: r.server-name-and-ca
    level: MUST
    text: RequestForwardingClusterClient.ServerName returns the parsed cluster certificate
      subject common name, or the empty string when the parsed certificate is nil;
      CACert returns the parsed local cluster certificate.
  - codeRefs:
    - function:5746c17f5551e7b23f705b7db65f052f
    - function:fc4a929af8ea5f97ae855ee4d8ffcb5c
