    id: r.service-rpcs
    level: MUST
    text: 'The RequestForwarding service exposes exactly seven RPCs: the unary Echo,
      ForwardRequest, AdvertiseNamespaceKeys, SendNamespaceKeys, GetNamespaceKeys
      and StartInvalidations, plus the server-streaming CheckInvalidations; the generated
      client interface, server interface and unimplemented server must all carry these
      seven methods, and RegisterRequestForwardingServer must register a handler for
      each.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.ship-keys-two-step
    level: MUST
    text: shipKeys returns nil when the core reports no namespaces with keys, advertises
      the core's namespaces with keys, returns nil when the active node requests none
      of them, fetches keys for exactly the requested namespaces, returns the fetch
      errors when no keys came back, and otherwise sends the keys and returns a multi-error
      combining any fetch errors with a send failure.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.start-invalidations-error-in-body
    level: MUST
    text: forwardedRequestRPCServer.StartInvalidations calls core.MarkPeerStarted
      with the request uuid and always returns a response, carrying the error text
      `failed to start invalidations; check active logs for more info` in the response
      Err field rather than returning a gRPC error.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding.go
    id: r.stop-drains
    level: MUST
    text: Stop of the request forwarding handler sleeps for `cluster.ListenerAcceptDeadline`
      to let existing RPCs drain, then closes the stop channel and stops the gRPC
      server, returning nil.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.stream-invalidations-restart
    level: MUST
    text: Client.StreamInvalidations clears the stored peer uuid, opens the check-invalidations
      stream, stores the uuid from the first received invalidation, and then hands
      the rest of the loop to a goroutine that awaits each invalidation through the
      core and stops on a restart indication or receive error; its cleanup cancels
      the peer loop and calls core.Restart so read state is rebuilt from scratch instead
      of resuming a stale stream.
  - codeRefs:
    - file:third_party/openbao/internal/vault/forwarding/request_forwarding_rpc.go
    id: r.synchronize-keys-both-directions
    level: MUST
    text: Client.SynchronizeKeys runs shipKeys and getKeys concurrently in a wait
      group and waits for both, logging an error for each direction that fails without
      aborting the other direction.
