    level: MUST
    text: BuildOpt must be an option interface whose Apply mutates a `client.ImageBuildOptions`,
      and BuildRemove, BuildForceRemove, BuildPullParent, BuildArgs and BuildTags
      must each implement it to set their respective image build settings.
