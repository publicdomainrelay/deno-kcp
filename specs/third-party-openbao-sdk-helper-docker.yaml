kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-docker
  namespace: default
spec:
  intent: This context exists so that OpenBao integration tests can stand up external
    services (databases, plugins, LDAP, and similar) in Docker and talk to them over
    the network without hand-rolling Docker client plumbing in each test package.
    The file centralizes container lifecycle, port/address discovery, in-container
    command execution, file provisioning, and image building behind one small runner
    API, so a caller supplies a `RunOptions` describing the image, command, environment,
    ports and files, and gets back a started service plus the addresses needed to
    connect to it.
