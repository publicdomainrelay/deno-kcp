    - method:8d7bef7509bedcd9c91d89cb299fde51
    id: r.service-start-lifecycle
    level: MUST
    text: Runner.StartNewService must start the configured container, optionally adding
      a name suffix and forcing a local address, and must return both the Service,
      the container ID, and any error; Runner.StartService must be the variant that
      starts with default suffix and address behaviour.
