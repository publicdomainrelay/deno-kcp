    level: MUST
    text: Runner must expose Stop, Restart and RefreshFiles against a container ID,
      each taking a context and returning an error, so a test can pause, resume and
      re-synchronize a running service.
  - codeRefs:
    - method:1698022a332a83b2b0f1d1acd98af8df
    - struct:e28ff49a59207e853f03dd68a5cd6681
    id: r.container-start-result
    level: MUST
    text: Runner.Start must pull the image and start the container, returning a StartResult
      carrying the container ID and the network addresses the test can connect to.
  - codeRefs:
    - function:372e27fd642fdd81548db64a253746eb
    - struct:a7bcbc35e907c919502f88df93032e8f
    id: r.default-container-name
    level: MUST
    text: NewServiceRunner must default the container name to `ImageRepo` when it
      contains no slash, and must reject a non-library image repo (one containing
      a slash) that has no explicit `ContainerName`.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/docker/testhelpers.go
    - function:8bd6cb0ad6ef23b212cfda763eb0d5f3
    id: r.docker-api-from-env
    level: MUST
    text: NewDockerAPI must build a Docker client from the process environment (`client.FromEnv`)
      and pin the API version to `client.MinAPIVersion`, so tests talk to a daemon
      configured the same way as the docker CLI.
  - codeRefs:
    - function:027659abee07bbb1f22f66b64670f7ca
    - function:dfefbe8ad9f3777864b0abfc546ef5fb
    - method:19038821dfcd10e814c23e8cdbe172d9
    - method:9138348dffd470d5c20805adb0b1ace9
    id: r.exec-in-container
    level: MUST
    text: Runner.RunCmdWithOutput and Runner.RunCmdInBackground must execute a command
      inside a named container with the supplied RunCmdOpt options, returning stdout,
      stderr and exit code for the synchronous form and a background handle string
      for the asynchronous form; the package-level RunCmdWithOutput and RunCmdInBackground
      functions must offer the same behaviour against an explicitly supplied Docker
      client.
  - codeRefs:
    - method:9d073ce521d509a0990c6363223ba5ac
    - method:c91a9a9ef5aecdd92b3b8c78ec82479b
    id: r.file-transfer
    level: MUST
    text: Runner.CopyTo must copy a BuildContext into a destination path inside a
      container, and Runner.CopyFrom must extract a source path from a container as
      a BuildContext together with its `container.PathStat`.
  - codeRefs:
    - function:ed64d8f3ff7b12c0710a6552de82c78d
    - method:dd456d0b9822d3c7464c69c79bc76e68
    id: r.image-build
    level: MUST
    text: Runner.BuildImage must build an image from a containerfile path and BuildContext
      applying the given BuildOpt values and return the build output bytes, and the
      package-level BuildImage must do the same against an explicitly supplied Docker
      client.
  - codeRefs:
    - method:9813d04e9afad26e6f01e75a9ea46e34
    - struct:2255596c02d0a79bb5cc88c2059d1457
    - struct:a7bcbc35e907c919502f88df93032e8f
    id: r.log-writing
    level: MUST
    text: LogConsumerWriter must implement `io.Writer` so container log streams can
      be redirected into a `RunOptions.LogConsumer` callback.
  - codeRefs:
    - method:db190a05f468cec2d3266a767c9d59cf
    id: r.network-addresses
    level: MUST
    text: Runner.GetNetworkAndAddresses must return a map of network name to container
      address for a container, so a test can discover which networks the service joined
      and where it is reachable.
  - codeRefs:
    - function:372e27fd642fdd81548db64a253746eb
    id: r.network-lookup-uniqueness
    level: MUST
    text: A named network lookup must succeed only when exactly one network matches;
      zero or multiple matches must return an error naming the network and the count
      found.
  - codeRefs:
    - function:372e27fd642fdd81548db64a253746eb
    - struct:a7bcbc35e907c919502f88df93032e8f
    id: r.network-name-resolution
    level: MUST
    text: NewServiceRunner must use `opts.NetworkName` when set, otherwise fall back
      to the `TEST_DOCKER_NETWORK_NAME` environment variable, look the network up
      by name, and store its ID on the options; when no network ID is known it must
      fall back to `TEST_DOCKER_NETWORK_ID`.
