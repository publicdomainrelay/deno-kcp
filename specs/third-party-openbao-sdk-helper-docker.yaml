    id: r.path-contents
    level: MUST
    text: PathContents must model a provisioned file through Get (returning the bytes),
      UpdateHeader (mutating a tar header), SetMode and SetOwners, and PathContentsFromBytes
      and PathContentsFromString must return PathContents values backed by the given
      data; FileContents must implement the same four methods.
  - codeRefs:
    - method:9d073ce521d509a0990c6363223ba5ac
    - struct:a7bcbc35e907c919502f88df93032e8f
    id: r.pre-start-provisioning
    level: SHOULD
    text: RunOptions.WriteInto should be honored before the container starts so initial
      data can be provisioned, in place of calling CopyTo after start.
  - codeRefs:
