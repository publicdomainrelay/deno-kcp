    id: r.build-context-roundtrip
    level: MUST
    text: NewBuildContext must return an empty BuildContext, BuildContextFromTarball
      must reconstruct one from a tar stream, and BuildContext.ToTarball must serialize
      it back to an `io.Reader`, so a build context can be written into a container
      and read back out.
