    id: r.service-addressing
    level: MUST
    text: ServiceHostPort and ServiceURL must both satisfy ServiceConfig, each returning
      a host:port string from Address() and a `*url.URL` from URL(), so callers can
      treat either representation uniformly.
  - codeRefs:
