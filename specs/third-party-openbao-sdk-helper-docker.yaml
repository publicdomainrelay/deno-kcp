    - method:acf33f96904e552d5d61a413f94b9d7c
    - method:eec43ee288a8f5f5879496cc58d89ea5
    - type_alias:ccb13f26d6b290434c6aab1692a4fa8a
    id: r.run-cmd-options
    level: MUST
    text: RunCmdOpt must be an option interface whose Apply mutates a `client.ExecCreateOptions`,
      and RunCmdUser must implement it to set the user the command runs as, so callers
      can decorate an exec without touching the Docker types directly.
  - codeRefs:
    - struct:a7bcbc35e907c919502f88df93032e8f
    id: r.run-options-surface
    level: MAY
    text: RunOptions may carry image repo and tag, container name, user, command,
      entrypoint, environment, network, copy map, ports, auto-remove, auth credentials,
      log timestamps and sinks, capabilities, volume mounts, publish-port map, pre-delete
      and post-start hooks.
  - codeRefs:
    - method:40680e298fa36128a35487b8fde8c44e
    - type_alias:69ecae07474f1a7eefa0303ad3af5d14
    id: r.service-adapter
    level: SHOULD
    text: ServiceAdapter should stay the callback type a caller implements to adapt
      a freshly started container into the caller's own service representation, so
      start logic stays independent of the test package that consumes it.
  - codeRefs:
    - function:adf178adbf827a175b03d2bbe4aa5a62
    - function:e47570b4b99eaba234dbfd1512a74b5c
    id: r.service-address-construction
    level: MUST
    text: NewServiceHostPort must build a ServiceHostPort from an explicit host and
      port, and NewServiceURL must build a ServiceURL from a `url.URL` value without
      re-parsing a string.
  - codeRefs:
    - function:f61be835e23d55870bda470c202ea330
    - function:f62059fd3220bc5d6c452507ace175b0
    id: r.service-address-parsing
    level: MUST
    text: NewServiceHostPortParse must split a string into host and integer port and
      return an error on a malformed input, and NewServiceURLParse must parse a string
      into a ServiceURL, returning an error rather than a partial value when the URL
      is invalid.
  - codeRefs:
