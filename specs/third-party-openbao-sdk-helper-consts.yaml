  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/deprecation_status.go
    - method:a619c1dae8d260b20d3bfc690a5f4d1a
    - type_alias:c76b2b23f452aceb28be226af48e3a11
    id: r.deprecation-status-enum-and-string
    level: MUST
    text: DeprecationStatus must be a uint32 enum whose String method maps the known
      statuses to exactly the lowercase names "supported", "deprecated", "pending
      removal" and "removed", and returns the empty string for any unrecognized value.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/replication.go
    - type_alias:b23bf938996d535c99277465d06f6b3d
    id: r.ha-state-enum
    level: MUST
    text: HAState must remain a distinct enumerated type describing high-availability
      roles, separate from ReplicationState so the two role spaces cannot be mixed
      in one value.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/plugin_types.go
    - function:b06db33048aa54f8f98977535f4e91b1
    - method:8a41ac131e1d78566490e6813163511d
    id: r.parse-plugin-type-round-trip
    level: MUST
    text: ParsePluginType must convert a plugin type string into a PluginType, accepting
      the same spellings that PluginType.String emits, and must return an error rather
      than a silent zero value when the string names no known plugin kind.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/plugin_types.go
    - method:8a41ac131e1d78566490e6813163511d
    - type_alias:1cfcc74ba481d7da441d964a55a65319
    id: r.plugin-type-enum-and-string
    level: MUST
    text: PluginType must be a uint32 enum, and PluginType.String must return the
      lowercase name for each known plugin kind so callers can print a plugin kind
      without a lookup table.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/agent.go
    - file:third_party/openbao/sdk/helper/consts/consts.go
    - file:third_party/openbao/sdk/helper/consts/error.go
    - file:third_party/openbao/sdk/helper/consts/jwt.go
    - file:third_party/openbao/sdk/helper/consts/proxy.go
    - file:third_party/openbao/sdk/helper/consts/token_consts.go
    id: r.remaining-const-files
    level: SHOULD
    text: The package must keep agent, general, error, JWT, proxy and token constants
      in their own files (agent.go, consts.go, error.go, jwt.go, proxy.go, token_consts.go)
      so that importers get the constant group they name without the enumerated type
      files coming along.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/replication.go
    - method:c4f7f56dd4854bebce85c3a9cfc5033c
    - method:d8e8f30059e7b9314b375cac0374a509
    id: r.replication-primary-state-predicate
    level: MUST
    text: IsPrimaryState must report true only when the state carries a primary-role
      replication flag, so callers can gate primary-only behavior on a single predicate
      instead of testing individual flags.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/replication.go
    - method:84a38dabdcb15fe92172b46fa5303d31
    - method:bd6b6832c68eea69e8ca3c8e11a23711
    - method:c4f7f56dd4854bebce85c3a9cfc5033c
    - method:efd0ce8b64d6ef103fd3c3e3887b8e5a
    - type_alias:6b40d65118dc01cf1f2320ee33c4aaf4
    id: r.replication-state-bitmask
    level: MUST
    text: 'ReplicationState must be an integer bitmask: HasState reports whether a
      flag is set, AddState sets it, ClearState removes it, and ToggleState flips
      it, with each mutation applied to the receiver so the caller''s state value
      is updated.'
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/replication.go
    - method:64d67f41e41a0df76d54cb869a8d6f08
    - method:f85fbafd94459c1127eb2f2118c4cb58
    id: r.replication-state-dr-and-performance-strings
    level: MUST
    text: GetDRString must collapse the DR flags to a single mode name, preferring
      bootstrapping over primary over secondary over disabled, and must return "unknown"
      when none of those DR flags is set; GetPerformanceString must do the same for
      the performance flags and must return an empty string when no performance flag
      is set.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/consts/replication.go
    - method:6d7379614118cf626e8ea41acda37ac8
    id: r.replication-state-strings
    level: MUST
    text: ReplicationState.StateStrings must return one short tag per set flag, in
      the fixed order perf-secondary, perf-primary, perf-bootstrapping, perf-disabled,
      dr-primary, dr-secondary, dr-bootstrapping, dr-disabled, perfstandby, and must
      return no elements when no flag is set.
  upstream: self
