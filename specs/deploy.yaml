- file:deploy/denoruntime-apiexport.yaml denoruntime-apiexport.yaml@deploy/denoruntime-apiexport.yaml
- file:deploy/openbao-apiresourceschema.yaml openbao-apiresourceschema.yaml@deploy/openbao-apiresourceschema.yaml
- file:deploy/policyengine-apiresourceschema.yaml policyengine-apiresourceschema.yaml@deploy/policyengine-apiresourceschema.yaml
- file:deploy/policyworkflowpod-apiresourceschema.yaml policyworkflowpod-apiresourceschema.yaml@deploy/policyworkflowpod-apiresourceschema.yaml
