apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: deploy
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.deno-kcp
  intent: This context exists to describe the deployment manifests that register the
    deno.computer kinds with kcp and make them bindable by tenant workspaces. It states
    the fixed group, scope, version, naming and status shape every schema must carry,
    the resource membership of each APIExport, and the default API bindings each WorkspaceType
    applies, so the YAML stays a faithful, machine-checked mirror of the Go types
    rather than a hand-maintained duplicate.
  requirements:
  - id: r.api-group-version-scope
    level: MUST
    text: Every APIResourceSchema declares spec.group deno.computer, spec.scope Namespaced,
      and exactly one version named v1alpha1 with served and storage both true, so
      each kind is a namespaced tenant resource in one group at one stored version.
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.apiexport-denoruntime
    level: MUST
    text: 'APIExport denoruntime lists seven resources in group deno.computer with
      the schema reference carried per entry: denopods to v1alpha1-3.denopods.deno.computer,
      denoruns to v1alpha1-2.denoruns.deno.computer, denojobs to v1alpha1-4.denojobs.deno.computer,
      runtriggers to v1alpha1-3.runtriggers.deno.computer, policyengines to v1alpha1-2.policyengines.deno.computer,
      policyworkflowpods to v1alpha1-5.policyworkflowpods.deno.computer and openbaos
      to v1alpha1-1.openbaos.deno.computer, so one export publishes the whole runtime
      chain.'
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/denoruntime-apiexport.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.apiexport-policyworkflowruns
    level: MUST
    text: APIExport policyworkflowruns publishes the single policyworkflowruns resource
      in group deno.computer against schema v1alpha1-4.policyworkflowruns.deno.computer,
      so a workspace that only needs the direct run path binds this export instead
      of the denoruntime one.
    codeRefs:
    - file:deploy/policyworkflowrun-apiexport.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
  - id: r.names-block
    level: MUST
    text: 'Each spec.names declares kind, listKind as the kind with List appended,
      plural, singular as the lowercased kind, and a one-element shortNames list:
      DenoPod denopods denopod dpod, DenoRun denoruns denorun drun, DenoJob denojobs
      denojob djob, RunTrigger runtriggers runtrigger rtrig, PolicyEngine policyengines
      policyengine peng, PolicyWorkflowPod policyworkflowpods policyworkflowpod pwpod,
      PolicyWorkflowRun policyworkflowruns policyworkflowrun pwr, OpenBao openbaos
      openbao obao; the short name is what the Go types carry as api.short and the
      plural is what they carry as api.resource.'
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.operational-scripts
    level: MAY
    text: The shell helpers install-provider.sh, start-kcp.sh, start-openbao.sh, stop-kcp.sh,
      demo.sh and demo-deno-runtime.sh sit beside the manifests for bring-up, install,
      teardown and demos; they carry no schema and are not part of the manifest cross-check.
    codeRefs:
    - file:deploy/demo-deno-runtime.sh
    - file:deploy/demo.sh
    - file:deploy/install-provider.sh
    - file:deploy/start-kcp.sh
    - file:deploy/start-openbao.sh
    - file:deploy/stop-kcp.sh
  - id: r.phase-enums
    level: MUST
    text: 'Status phase enums are fixed per kind and mirror the Go Phase constants:
      DenoPod, DenoRun and DenoJob use Pending, Running, Succeeded, Failed; RunTrigger
      uses Pending, Triggered, Skipped, Failed; PolicyEngine and PolicyWorkflowPod
      use Pending, Running, Failed; PolicyWorkflowRun adds Cancelled to the four-state
      set; OpenBao declares no phase and reports ready plus message instead.'
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.required-spec-fields
    level: MUST
    text: Required spec fields are exactly DenoPod script, DenoRun script, DenoJob
      template, RunTrigger policyWorkflowPod and jobTemplate, PolicyWorkflowPod workflow
      and policyEngine, and OpenBao namespace; PolicyEngine and PolicyWorkflowRun
      declare no required spec field, so their spec may be empty.
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.schema-names-versioned
    level: MUST
    text: 'Each APIResourceSchema metadata.name is v1alpha1-N.<plural>.deno.computer
      with the index fixed per plural, not globally unique: openbaos 1, denoruns 2,
      policyengines 2, denopods 3, runtriggers 3, denojobs 4, policyworkflowruns 4,
      policyworkflowpods 5, so the APIExport schema references resolve to one schema
      each.'
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.status-conditions
    level: MUST
    text: Every kind's status carries a conditions array whose items are objects marked
      x-kubernetes-preserve-unknown-fields, so a standard condition set can be attached
      without a schema change and the Condition constants the Go types declare stay
      expressible.
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.status-subresource
    level: MUST
    text: Every version enables subresources.status, so phase and conditions are written
      by the provider through the status subresource and not by the tenant through
      the main resource.
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.validate-cross-check
    level: SHOULD
    text: 'The .tools/open-architecture/validate.py check_values pass keeps the manifests
      consistent with the Go types: KIND_MANIFESTS maps each sc.kind.* id to its schema
      file and APIEXPORTS maps denoruntime and policyworkflowruns to their export
      files, then the upstream api.short is compared against names.shortNames[0],
      api.resource against names.plural, and the upstream phase and condition lists
      against the Go Phase and Condition constants, reporting an error for each pair
      that differs.'
    codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/denoruntime-apiexport.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiexport.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
  - id: r.workspacetype-denoruntime
    level: MUST
    text: WorkspaceType denoruntime extends workflow and universal, both from path
      root, and declares two default API bindings at path root:deno-provider, policyworkflowruns
      first and denoruntime second, so a workspace of this type gets the direct run
      path and the whole runtime chain together.
    codeRefs:
    - file:deploy/workspacetype-denoruntime.yaml
  - id: r.workspacetype-workflow
    level: MUST
    text: WorkspaceType workflow extends universal from path root and declares one
      default API binding, export policyworkflowruns at path root:deno-provider, so
      a workspace of this type can create PolicyWorkflowRun objects without an explicit
      binding.
    codeRefs:
    - file:deploy/workspacetype-workflow.yaml
  arch:
    id: ov.apiexport-vw
    kind: node
    section: system_contexts
    form: list
    parent: sc.kcp.apiexport-vw
    slot: overlay[1]
    code:
    - file:deploy/denoruntime-apiexport.yaml
    - file:deploy/policyworkflowrun-apiexport.yaml
    node:
      data:
        client_host: <endpoint url>/clusters/*
        endpoint_slice:
          reads: status.endpoints[].url
          resource: apis.kcp.io/v1alpha1/apiexportendpointslices
          workspace: root:deno-provider
        identity: cred.admin-kubeconfig
        namespaces: all
        permissionClaims: []
      id: ov.apiexport-vw
      source:
      - deploy/denoruntime-apiexport.yaml
      - deploy/policyworkflowrun-apiexport.yaml
      - internal/provider/watch.go
codeRefIndex:
- file:deploy/demo-deno-runtime.sh demo-deno-runtime.sh@deploy/demo-deno-runtime.sh
- file:deploy/demo.sh demo.sh@deploy/demo.sh
- file:deploy/denojob-apiresourceschema.yaml denojob-apiresourceschema.yaml@deploy/denojob-apiresourceschema.yaml
- file:deploy/denopod-apiresourceschema.yaml denopod-apiresourceschema.yaml@deploy/denopod-apiresourceschema.yaml
- file:deploy/denorun-apiresourceschema.yaml denorun-apiresourceschema.yaml@deploy/denorun-apiresourceschema.yaml
- file:deploy/denoruntime-apiexport.yaml denoruntime-apiexport.yaml@deploy/denoruntime-apiexport.yaml
- file:deploy/install-provider.sh install-provider.sh@deploy/install-provider.sh
- file:deploy/openbao-apiresourceschema.yaml openbao-apiresourceschema.yaml@deploy/openbao-apiresourceschema.yaml
- file:deploy/policyengine-apiresourceschema.yaml policyengine-apiresourceschema.yaml@deploy/policyengine-apiresourceschema.yaml
- file:deploy/policyworkflowpod-apiresourceschema.yaml policyworkflowpod-apiresourceschema.yaml@deploy/policyworkflowpod-apiresourceschema.yaml
- file:deploy/policyworkflowrun-apiexport.yaml policyworkflowrun-apiexport.yaml@deploy/policyworkflowrun-apiexport.yaml
- file:deploy/policyworkflowrun-apiresourceschema.yaml policyworkflowrun-apiresourceschema.yaml@deploy/policyworkflowrun-apiresourceschema.yaml
- file:deploy/runtrigger-apiresourceschema.yaml runtrigger-apiresourceschema.yaml@deploy/runtrigger-apiresourceschema.yaml
- file:deploy/start-kcp.sh start-kcp.sh@deploy/start-kcp.sh
- file:deploy/start-openbao.sh start-openbao.sh@deploy/start-openbao.sh
- file:deploy/stop-kcp.sh stop-kcp.sh@deploy/stop-kcp.sh
- file:deploy/workspacetype-denoruntime.yaml workspacetype-denoruntime.yaml@deploy/workspacetype-denoruntime.yaml
- file:deploy/workspacetype-workflow.yaml workspacetype-workflow.yaml@deploy/workspacetype-workflow.yaml
