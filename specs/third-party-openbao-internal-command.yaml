kind: SystemContext
metadata:
  name: third-party-openbao-internal-command
  namespace: default
spec:
  intent: The context exists because deno-kcp vendors OpenBao, and the vendored CLI
    command package is the layer that turns user arguments into agent, audit, auth,
    KV, operator, and policy operations. It is specified here so that the command
    surface of the agent command — what it prints, how it predicts arguments, how
    it loads and reloads configuration, and how it manages its process and HTTP endpoints
    — is described from the code that is present rather than from assumptions about
    OpenBao's documentation. Reading this context tells a consumer which command methods
    are available, what each returns, and that the whole family of commands is wired
    into one registry.
  interfaces:
  - file: third_party/openbao/internal/command/agent.go
    kind: struct
    name: AgentCommand
    signature: type AgentCommand struct
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.AutocompleteArgs
    signature: func (c *AgentCommand) AutocompleteArgs() complete.Predictor
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.AutocompleteFlags
    signature: func (c *AgentCommand) AutocompleteFlags() complete.Flags
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.Flags
    signature: func (c *AgentCommand) Flags() *FlagSets
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.Help
    signature: func (c *AgentCommand) Help() string
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.Run
    signature: func (c *AgentCommand) Run(args []string) int
  - file: third_party/openbao/internal/command/agent.go
    kind: method
    name: AgentCommand.Synopsis
    signature: func (c *AgentCommand) Synopsis() string
  - file: third_party/openbao/internal/command/agent_generate_config.go
    kind: method
    name: AgentGenerateConfigCommand.AutocompleteArgs
    signature: func (c *AgentGenerateConfigCommand) AutocompleteArgs() complete.Predictor
  - file: third_party/openbao/internal/command/audit_disable.go
    kind: method
    name: AuditDisableCommand.AutocompleteArgs
    signature: func (c *AuditDisableCommand) AutocompleteArgs() complete.Predictor
  - file: third_party/openbao/internal/command/base_predict.go
    kind: method
    name: BaseCommand.PredictVaultAudits
    signature: func (b *BaseCommand) PredictVaultAudits() complete.Predictor
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-arg-autocomplete-none
    level: MUST
    text: '`AgentCommand.AutocompleteArgs` returns `complete.PredictNothing`, so the
      shell completion layer offers no positional argument candidates for `bao agent`.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-config-load-and-override
    level: MUST
    text: Configuration flows through `loadConfig(paths []string) (*agentConfig.Config,
      error)` to read agent configuration from the given paths, and through `applyConfigOverrides(f
      *FlagSets, config *agentConfig.Config)` to let command-line flags win over values
      read from those files. `reloadConfig(paths []string) error` re-applies the same
      paths later without restarting the process.
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-flag-autocomplete
    level: MUST
    text: '`AgentCommand.AutocompleteFlags` returns `complete.Flags`, supplying flag-name
      completion for the command independently of the argument predictor.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-flag-fallback
    level: MUST
    text: '`setStringFlag(f *FlagSets, configVal string, fVar *StringVar)` and `setBoolFlag(f
      *FlagSets, configVal bool, fVar *BoolVar)` seed a flag variable from a configuration
      value only when the flag itself was not supplied, so an explicit flag on the
      command line is never overwritten by the configuration file.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-flags-surface
    level: MUST
    text: '`AgentCommand.Flags` returns the command''s `*FlagSets`, and `Help` and
      `Run` both obtain the flag surface through that method, so flag definitions
      live in one place and are rendered by both help and parsing.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-help-composition
    level: MUST
    text: '`AgentCommand.Help` builds its text by concatenating a literal usage block
      (usage line `bao agent [options]`, a sentence saying the command starts an OpenBao
      Agent that can perform automatic authentication in certain environments, an
      example invocation `bao agent -config=/etc/openbao/config.hcl`, and a pointer
      to the documentation) with the output of `c.Flags().Help()`, then returns `strings.TrimSpace`
      of the result. The help output therefore always reflects the flag set rather
      than a hand-maintained flag list.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-http-handlers
    level: MUST
    text: '`handleMetrics() http.Handler` returns the metrics handler and `handleQuit(enabled
      bool) http.Handler` returns a quit handler that is gated on the boolean, so
      the quit endpoint can be left unregistered when it is not enabled.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-logger-and-errors
    level: MUST
    text: '`newLogger() (hclog.InterceptLogger, error)` constructs the agent''s interceptable
      logger and `outputErrors(err error)` renders an error to the command''s output;
      `notifySystemd(status string)` reports a status string to systemd when the agent
      runs under it.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-pidfile-lifecycle
    level: MUST
    text: '`storePidFile(pidPath string) (err error)` writes the agent''s pid file
      and `removePidFile(pidPath string) error` deletes it, giving the command an
      explicit create-then-clean-up lifecycle for the path it is given.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-run-entrypoint
    level: MUST
    text: '`AgentCommand.Run(args []string) int` is the execution entry point: it
      consumes the raw argument slice and returns the process exit code, so all agent
      startup, configuration, and shutdown behavior is reachable only through it.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-runtime-reload
    level: MUST
    text: The command exposes three independent reload operations — `reloadLogLevel()
      error`, `reloadCerts() error`, and `reloadVaultTLS() error` — each returning
      an error so a failed reload can be reported without terminating the running
      agent.
  - codeRefs:
    - file:third_party/openbao/internal/command/agent.go
    id: r.agent-synopsis
    level: MUST
    text: '`AgentCommand.Synopsis` returns the fixed string "Start an OpenBao agent",
      so the command list shows that one-line description for the agent subcommand.'
  - codeRefs:
    - file:third_party/openbao/internal/command/commands.go
    id: r.command-registry
    level: MUST
    text: Command types in this package are collected by `initCommands` in commands.go,
      which instantiates `AgentCommand` and its siblings into the CLI command map,
      so every command described here is reachable as a subcommand of the `bao` binary.
  - codeRefs:
    - file:third_party/openbao/internal/command/agent_generate_config.go
    - file:third_party/openbao/internal/command/audit_disable.go
    - file:third_party/openbao/internal/command/base_predict.go
    id: r.sibling-arg-completion
    level: SHOULD
    text: 'Sibling commands follow the same completion contract as the agent command
      but may return a real predictor: `AgentGenerateConfigCommand.AutocompleteArgs`
      returns `complete.PredictNothing`, while `AuditDisableCommand.AutocompleteArgs`
      returns `c.PredictVaultAudits()`, which resolves through `BaseCommand.PredictVaultAudits`
      to `NewPredict().VaultAudits()`.'
  upstream: self
