kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agentproxyshared-auth
  namespace: default
spec:
  intent: 'This context exists because agent and proxy auto-auth needs one place that
    owns the token lifecycle: it defines the contract credential methods implement,
    decides when to re-authenticate or renew, fans the token out to file/template/exec
    sinks, and keeps retry behavior uniform across all auth methods. It is the shared
    dependency of the approle, cert, jwt, kubernetes and token-file method packages,
    so its interfaces and configuration structs are the seam those packages and the
    agent/sink code compile against.'
  interfaces:
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: struct
    name: AuthConfig
    signature: type AuthConfig struct { Logger hclog.Logger; MountPath string; WrapTTL
      time.Duration; Config map[string]any }
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: struct
    name: AuthHandler
    signature: type AuthHandler struct { OutputCh chan string; TemplateTokenCh chan
      string; ExecTokenCh chan string; ... }
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: method
    name: AuthHandler.Run
    signature: func (ah *AuthHandler) Run(ctx context.Context, am AuthMethod) error
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: struct
    name: AuthHandlerConfig
    signature: type AuthHandlerConfig struct { Logger hclog.Logger; Client *api.Client;
      WrapTTL time.Duration; MaxBackoff time.Duration; MinBackoff time.Duration; Token
      string; UserAgent string; MetricsSignifier string; EnableReauthOnNewCredentials
      bool; EnableTemplateTokenCh bool; EnableExecTokenCh bool; ExitOnError bool }
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: interface
    name: AuthMethod
    signature: type AuthMethod interface { Authenticate(context.Context, *api.Client)
      (string, http.Header, map[string]any, error); NewCreds() chan struct{}; CredSuccess();
      Shutdown() }
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: method
    name: AuthMethod.Authenticate
    signature: Authenticate(context.Context, *api.Client) (string, http.Header, map[string]any,
      error)
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: method
    name: AuthMethod.CredSuccess
    signature: CredSuccess()
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
    kind: method
    name: AuthMethod.NewCreds
    signature: NewCreds() chan struct{}
  - file: third_party/openbao/internal/command/agentproxyshared/auth/auth.go
