    level: MUST
    text: '`mockStorageBackend` implements the physical backend contract in memory:
      `Put`, `Get`, `Delete`, `List` and `ListPage` operate on stored entries by key
      or prefix, and `GetConfigurationOffline` returns a raft configuration response;
      the `RaftConfigurableStorageBackend` interface requires `GetConfigurationOffline`.'
