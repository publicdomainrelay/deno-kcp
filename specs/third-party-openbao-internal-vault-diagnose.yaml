    id: r.check-running
    level: MUST
    text: '`SpotCheck` runs a check function and translates its error into a spot
      error event and returned error, or a spot ok event on success; `Test` runs a
      named check under a fresh span, sets error status when the function fails, and
      always ends the span; `WithTimeout` wraps a test function so it is abandoned
      after the given duration; `CapitalizeFirstLetter` upper-cases the first letter
      of a message.'
  - codeRefs:
