    id: r.result-rendering
    level: MUST
    text: '`Result.Write` renders the collected diagnostics to a writer with a wrap
      limit, `Result.String` renders it unwrapped and `Result.StringWrapped` renders
      it at a given wrap limit; `Result.ZeroTimes` clears the timing data; the `status`
      type renders as text through `status.String` and as JSON through `status.MarshalJSON`.'
