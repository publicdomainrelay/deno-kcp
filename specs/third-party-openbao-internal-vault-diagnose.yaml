    level: MUST
    text: '`EndToEndLatencyCheckWrite`, `EndToEndLatencyCheckRead` and `EndToEndLatencyCheckDelete`
      each time a write, read and delete of a uuid-keyed entry against a `physical.Backend`,
      returning the elapsed duration and any error; `ConsulDirectAccess` inspects
      a storage config map and reports when direct Consul access is detectable.'
