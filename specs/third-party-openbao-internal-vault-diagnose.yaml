    id: r.file-check-primitives
    level: MUST
    text: '`IsDir` reports whether a `fs.FileInfo` is a directory; `HasDB` joins the
      database filename onto a path and reports whether that file exists; `IsOwnedByRoot`
      reports whether the file is owned by root; `CheckFilePerms` returns whether
      the file has owner read+write and nothing else, plus warning strings for other/group
      permission bits set, missing owner read or write, and symlinks.'
