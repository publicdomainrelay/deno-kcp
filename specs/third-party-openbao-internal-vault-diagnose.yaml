    id: r.span-status-helpers
    level: MUST
    text: 'Each outcome helper records its verdict on the current span: `Success`
      and `SpotOk` mark ok, `Fail`, `Error` and `SpotError` mark error (returning
      the error for `Error` and `SpotError`), `Skipped` and `SpotSkipped` mark a skipped
      event with error status, and `Warn` and `SpotWarn` add a warning event; `StartSpan`
      opens the span each helper writes to.'
