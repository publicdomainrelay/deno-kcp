    level: MUST
    text: 'The MFABackend interface must declare the MFA surface the identity store
      depends on: Lock and Unlock for mutual exclusion, HandleMFAGenerateTOTP for
      TOTP generation, ValidateAuthEntriesForAccessorOrType for mount-entry validation,
