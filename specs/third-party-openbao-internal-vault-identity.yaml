    level: SHOULD
    text: 'The store should expose entity counts for callers that report usage: CountEntities
      returns the total for the context''s namespace, CountEntitiesByNamespace returns
      counts keyed by namespace, and CountEntitiesByMountAccessor returns counts keyed
      by mount accessor.'
