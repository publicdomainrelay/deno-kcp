  - codeRefs:
    - file:third_party/openbao/internal/vault/identity/store.go
    - function:9a1e70541a717e1949d53fe2f0ac3aac
    id: r.alias-change-index
    level: MUST
    text: ChangedAliasIndex must report which index of an entity's alias set changed
      when a new logical.Alias is compared with the stored entity, so the caller can
      reindex only the affected alias.
  - codeRefs:
    - method:8be38da73603a4cb468469039b0f023f
    - method:ef9dbf1c0811044044ec43f38d700e5e
    - method:f82048ee07d9401969d6d31a6cdc2e3d
    id: r.bucket-key-lookups
    level: MUST
    text: 'Case-folded lookups must be served by the bucket-key helpers: MemDBEntitiesByBucketKeyInTxn,
      MemDBLocalAliasesByBucketKeyInTxn and MemDBGroupsByBucketKeyInTxn return the
      entities, local aliases or groups whose sanitized bucket key matches, so name
      matching is case-insensitive when lower-casing is enabled.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_structs.go
    - method:334dffd43a818fe841b839be92297131
    - struct:25c4a7c8828bf08b24f1410429d70485
    id: r.case-sensitivity-switch
    level: MUST
    text: Case sensitivity handling must be driven by the CaseSensitivity setting
      on the store, and DisableLowerCasedNames must let a caller turn off the lower-casing
      of entity and group names.
  - codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_entities.go
    id: r.classify-user-error
    level: MAY
    text: A helper may classify an entity or alias persistence failure as a user error
      so the API layer can return a validation response instead of a server error.
