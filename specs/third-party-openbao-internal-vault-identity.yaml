    text: 'Deletion must remove both the memdb rows and the persisted record: MemDBDeleteEntityByID
      and MemDBDeleteEntityByIDInTxn remove an entity, MemDBDeleteAliasByIDInTxn removes
      an alias with the groupAlias switch, MemDBDeleteGroupByIDInTxn removes a group,
      and DeleteAliasesInEntityInTxn removes a set of aliases from an entity.'
