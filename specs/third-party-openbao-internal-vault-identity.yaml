    id: r.entity-and-alias-persistence
    level: MUST
    text: 'The store must persist and load entities and groups in transactions: UpsertEntity
      and UpsertEntityInTxn write an entity with its previous entity for index maintenance;
      MemDBUpsertAliasInTxn, MemDBUpsertEntityInTxn and MemDBUpsertGroupInTxn write
      aliases, entities and groups into the memdb tables; MemDBAliasByID, MemDBAliasByFactors,
      MemDBEntityByID and MemDBEntityByName read them back with the clone and groupAlias
      switches.'
