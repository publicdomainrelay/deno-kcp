apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-identity
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the vendored identity store can be described and
    checked as a unit: what the store persists, which external collaborators it depends
    on, how OIDC key material and provider resources are created and cached, and how
    MFA state is read and written. Requirements here pin the exported surface and
    the contracts the rest of the vault relies on when it mounts the identity backend.'
  requirements:
  - id: r.alias-change-index
    level: MUST
    text: ChangedAliasIndex must report which index of an entity's alias set changed
      when a new logical.Alias is compared with the stored entity, so the caller can
      reindex only the affected alias.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store.go
    - function:9a1e70541a717e1949d53fe2f0ac3aac
  - id: r.bucket-key-lookups
    level: MUST
    text: 'Case-folded lookups must be served by the bucket-key helpers: MemDBEntitiesByBucketKeyInTxn,
      MemDBLocalAliasesByBucketKeyInTxn and MemDBGroupsByBucketKeyInTxn return the
      entities, local aliases or groups whose sanitized bucket key matches, so name
      matching is case-insensitive when lower-casing is enabled.'
    codeRefs:
    - method:8be38da73603a4cb468469039b0f023f
    - method:ef9dbf1c0811044044ec43f38d700e5e
    - method:f82048ee07d9401969d6d31a6cdc2e3d
  - id: r.case-sensitivity-switch
    level: MUST
    text: Case sensitivity handling must be driven by the CaseSensitivity setting
      on the store, and DisableLowerCasedNames must let a caller turn off the lower-casing
      of entity and group names.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_structs.go
    - method:334dffd43a818fe841b839be92297131
    - struct:25c4a7c8828bf08b24f1410429d70485
  - id: r.classify-user-error
    level: MAY
    text: A helper may classify an entity or alias persistence failure as a user error
      so the API layer can return a validation response instead of a server error.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_entities.go
  - id: r.deletion
    level: MUST
    text: 'Deletion must remove both the memdb rows and the persisted record: MemDBDeleteEntityByID
      and MemDBDeleteEntityByIDInTxn remove an entity, MemDBDeleteAliasByIDInTxn removes
      an alias with the groupAlias switch, MemDBDeleteGroupByIDInTxn removes a group,
      and DeleteAliasesInEntityInTxn removes a set of aliases from an entity.'
    codeRefs:
    - method:0cf022ee549eea43a0fb802944d4e1cb
    - method:0e19a5ac8051c394c89093819228b606
    - method:2397801a430831cf40592f799c125b6c
    - method:45e1f75dd3da4df336ac85be3292ffcf
    - method:702b987cbc8cdb0b3eec38de2190888e
  - id: r.entity-and-alias-persistence
    level: MUST
    text: 'The store must persist and load entities and groups in transactions: UpsertEntity
      and UpsertEntityInTxn write an entity with its previous entity for index maintenance;
      MemDBUpsertAliasInTxn, MemDBUpsertEntityInTxn and MemDBUpsertGroupInTxn write
      aliases, entities and groups into the memdb tables; MemDBAliasByID, MemDBAliasByFactors,
      MemDBEntityByID and MemDBEntityByName read them back with the clone and groupAlias
      switches.'
    codeRefs:
    - method:40907425f90cd33349b5d501a88f1792
    - method:4d14129885b104ee521e2c2ff17ad0c9
    - method:54ba4c2c57631f5317b1a0a149a8faed
    - method:764a73d1288d001707d23f9ef2a05002
    - method:8628069f25702724a5a7a4b50dd209f2
    - method:99833b68aa34c300262e6cd606e7d38b
    - method:d0be938c0b20ed86d90edc1f537f22a5
    - method:ee248d871fe76799058b8908404b6a2f
    - method:f6333f77c2de189d5203a13ff75c7b6d
  - id: r.entity-counting
    level: SHOULD
    text: 'The store should expose entity counts for callers that report usage: CountEntities
      returns the total for the context''s namespace, CountEntitiesByNamespace returns
      counts keyed by namespace, and CountEntitiesByMountAccessor returns counts keyed
      by mount accessor.'
    codeRefs:
    - method:4a17ae36ae45b2f6ef9efa446f406196
    - method:5adcbd272bf40772ea76adc2d80c70a6
    - method:6fdd3bf13cbba07d6af8cd29fd2e0256
  - id: r.entity-loading
    level: MUST
    text: LoadEntities and LoadGroups must populate the in-memory tables for a namespace,
      honouring a read-only flag that skips writes, so the store reflects the persisted
      entities and groups after startup or namespace activation.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_util.go
    - method:580532707f8d60689d0aa586d4cad04b
    - method:6481e5ccab2066e1ba3d9a465c947fc4
  - id: r.entity-resolution-by-alias
    level: MUST
    text: Entity lookup by authentication factors must resolve an entity from a mount
      accessor and alias name via EntityByAliasFactors, and CreateOrFetchEntity must
      return the existing entity for a logical.Alias or create a new one, reporting
      whether it was created, or an error.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_util.go
    - method:88bc3aeb162242d2ddae04b2213bef4e
    - method:beff5b008d06ce0e2c8830afe300e45d
  - id: r.external-collaborators
    level: MUST
    text: 'The store must depend on narrow interfaces rather than concrete vault types:
      LocalNode supplies ReplicationState and HAState, Namespacer supplies NamespaceByID
      and ListNamespaces, TOTPPersister persists a TOTP key for a config and entity,
      and TokenStorer supplies LookupToken and CreateToken.'
    codeRefs:
    - interface:40c34ef251254636285fb26d3e668695
    - interface:6ee494f9715a75f9c94fa1951d1977eb
    - interface:c43b10edf46f93df414f23fb18c0371f
    - interface:dc053fc95cbbf99260aeb61705cbc006
  - id: r.external-group-refresh
    level: MUST
    text: External group membership must be refreshed from login-time aliases by RefreshExternalGroupMembershipsByEntityID,
      which takes the entity ID, the group aliases and the mount accessor and returns
      the aliases that were not consumed.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_util.go
    - method:9d180dbe9396d017207157a1f17d914c
  - id: r.group-membership
    level: MUST
    text: 'Group membership must be queryable in both directions: MemDBGroupsByMemberEntityID
      and MemDBGroupsByMemberEntityIDInTxn return the groups holding an entity, MemDBGroupsByParentGroupID
      and MemDBGroupsByParentGroupIDInTxn return groups nested under a member group,
      GroupsByEntityID must split internal and external groups, GroupPoliciesByEntityID
      must collect policies by group, and MemberGroupIDsByID must list member group
      IDs of a group.'
    codeRefs:
    - method:12ae58ebb7ecdfbbed3d0f3dd183ba60
    - method:549293f5cfdea45470586a0d5b0804f8
    - method:873827fe07a2a7d1f5dba14fd9751a26
    - method:9e70a731e026a7b1ca22a3c414f90401
    - method:a557162e64e736c44bd3c48544383469
    - method:bfbfa7dfb0ddc89c3af9b2ac084efdaf
    - method:ec8211c3ffc6d6a8545c9c6a34eb8288
  - id: r.identity-store-construction
    level: MUST
    text: IdentityStore must be created by NewIdentityStore, which takes a context,
      an *IdentityStoreConfig, a *logical.BackendConfig and a log.Logger, and must
      return the constructed *IdentityStore or an error.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store.go
    - struct:0ede9debc97cbb6c04dd0d3907f50c49
  - id: r.logger-injection
    level: MUST
    text: LoggerAdder must let a namespace view attach a log.Logger and report UnsafeCrossNamespaceIdentity,
      so the store can decide whether cross-namespace identity reads are permitted
      for that view.
    codeRefs:
    - interface:09cc5be174c8f1018c819ded7cd0c9e3
    - method:7dfa4a74f9d9502de24b3b7688860806
    - method:f5a04adc2239a6f00910e072a58a7923
  - id: r.memdb-transactions
    level: MUST
    text: Reads and writes against the in-memory tables must go through Txn, which
      returns a *memdb.Txn according to the write flag; Invalidate must evict the
      cached entry for a key so later reads reload from storage; ResetDB must clear
      store state for a context.
    codeRefs:
    - method:75043e5898a811b6c7b51d8e45397e98
    - method:90e27c76662bd923b4f672afe90c9995
    - method:cf432b723fdc3483f380967684c148a2
  - id: r.mfa-backend-contract
    level: MUST
    text: 'The MFABackend interface must declare the MFA surface the identity store
      depends on: Lock and Unlock for mutual exclusion, HandleMFAGenerateTOTP for
      TOTP generation, ValidateAuthEntriesForAccessorOrType for mount-entry validation,
      CleanupNamespace for namespace teardown, config CRUD via PutMFAConfigByID, ReadMFAConfigByMethodID,
      DeleteMFAConfigByMethodID and MfaMethodList, login-enforcement CRUD via PutMFALoginEnforcementConfig,
      ReadMFALoginEnforcementConfigByNameAndNamespace, DeleteMFALoginEnforcementConfigByNameAndNamespace
      and MfaLoginEnforcementList, plus the memdb accessors MemDBUpsertMFAConfig,
      MemDBMFAConfigByID, MemDBMFAConfigByName, MemDBMFALoginEnforcementConfigByNameAndNamespace
      and MemDBUpsertMFALoginEnforcementConfig.'
    codeRefs:
    - interface:63a95dd01b6529284ad740a4b8b7dc0a
    - method:0e1bdf77b25885fbec153395a9bef2ff
    - method:179eb06308243620e986a3ddba7dc4c6
    - method:1e5d1ca2caa6c30a4c050926d116835f
    - method:4fecf670e8db3debcea0950165b2bba0
    - method:818ce45a701337d73ac783726ae468a4
  - id: r.namespace-views
    level: MUST
    text: 'The store must attach and detach per-namespace storage: AddNamespaceView
      registers a LoggerAdder, namespace and logical.Storage, RemoveNamespaceView
      drops it, View returns the logical.Storage for the context''s namespace, and
      EntityPacker, LocalAliasPacker and GroupPacker return the storagepacker.StoragePacker
      bound to that namespace.'
    codeRefs:
    - method:2e1769494250abb917955e29ba861ba2
    - method:358b35cd59930abb7b0d0c205899058e
    - method:50d1fe9b806aa50f51ef1526d59691e3
    - method:6b53248416cf502f0da609b431960c62
    - method:bba61404e4a1fb0031fe8893b771108f
    - method:fa4cc35fc8de4f8bd9cf702de5c4337d
  - id: r.oidc-cache
    level: MUST
    text: The OIDC cache must be built by NewOIDCCache from a default expiration and
      cleanup interval, must key entries by namespace through Get, Set, Delete, Flush
      and Items, and IsTargetNamespacedKey must decide whether a namespaced key belongs
      to a target namespace.
    codeRefs:
    - function:25eef2407a8fbe0908712bfa26a12b59
    - function:5e198781c89dfa398d767fa65f225c67
    - method:531f6c4a017218beb87b755e15aa45ca
    - method:961d5b7f9ab61e072343e603a88a16d4
    - method:c9fd534d50a1803195c35821494e554a
    - method:d95ba02b14e5d0b20905b483a9fc52b2
  - id: r.oidc-identity-id-normalization
    level: MUST
    text: LowercaseIdentityIDs must return the given identity IDs with their letter
      case lowered, and ClientType.String must render a client type as its string
      form.
    codeRefs:
    - function:a0682dc3ca805b467ae2b0927d07169d
    - method:6f82ee8b2ff7dc043be416faf54e236c
  - id: r.oidc-key-cache-header
    level: MUST
    text: GetKeysCacheControlHeader must return the HTTP cache-control header value
      for a namespace's OIDC keys, or an error when it cannot be determined.
    codeRefs:
    - file:third_party/openbao/internal/vault/identity/store_oidc.go
    - method:9316f225d37c42370876acabbc3231c8
  - id: r.oidc-key-rotation
    level: MUST
    text: 'NamedKey must generate and persist OIDC signing keys: GenerateAndSetKey
      writes the current key, GenerateAndSetNextKey writes the next key used for rotation,
      and OidcPeriodicFunc must run the periodic rotation work driven by those keys.'
    codeRefs:
    - method:131e56190aca454a5788dfddbc2d18fe
    - method:13efc92be0a1ccdf2b70f2c6ef0895e1
    - method:48c24b8efa35d44c39c361dc6421f6c0
    - struct:327887a6af149bab86c832aa4943218c
  - id: r.oidc-provider-resources
    level: MUST
    text: 'OIDC provider state must be created, checked and loaded: StoreOIDCDefaultResources
      writes the default assignment, scope, client and provider records for a namespace,
      LoadOIDCClients loads stored clients into the store, and the PathOIDCKeyExistenceCheck,
      PathOIDCRoleExistenceCheck, PathOIDCAssignmentExistenceCheck, PathOIDCScopeExistenceCheck,
      PathOIDCClientExistenceCheck and PathOIDCProviderExistenceCheck handlers report
      whether the named resource exists, returning an error when the read fails.'
    codeRefs:
    - method:064df75847df7716da78d8ff1c0d070e
    - method:3be4241024aefbf2af6d1021e84ab8a3
    - method:63cb03a74c1795132d4a233975b01c6e
    - method:665b1259379675b9a6c6c20f4c6e1f91
    - method:91b46d7b74eb8ff055d57263a296ce2e
    - method:cac1ae7eae7c80160ef0f98e1335da16
    - method:e0c97f4025bcbd4f1d979fff4069f109
    - method:fff8ec6f4207753a31104db8ed759d8d
  - id: r.sanitization
    level: MUST
    text: 'Before persistence the store must normalize input: SanitizeAlias and SanitizeEntity
      clean an alias and entity against the store''s case and namespace rules, and
      SanitizeAndUpsertGroup cleans a group and its member group IDs then upserts
      it.'
    codeRefs:
    - method:4ab931c63f0f41717b92385076035ffb
    - method:ad833aa8670ac9ce3394b4927b392a4e
    - method:c9042761b81ca3a5cb215ea684d91024
  - id: r.user-error
    level: MUST
    text: 'userError must wrap an underlying error and satisfy the error interface:
      Error returns the message, Unwrap returns the wrapped error, and Is reports
      whether the wrapped error matches, so callers can distinguish user-input failures
      from internal failures.'
    codeRefs:
    - method:0ebd56effc14bcb2474fa49f4f48be90
    - method:46134ecc343959c97e5702df31730108
    - method:da642fabad8c9379b5e740750ae3d05c
