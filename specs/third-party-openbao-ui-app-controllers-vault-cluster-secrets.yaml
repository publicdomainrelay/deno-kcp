apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-secrets
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The context exists so the secrets-engine index page can present a filtered,
    sorted list of mountable secret engines and let the operator hide internal engines,
    filter by engine type and name, and disable a selected engine. The backend.js
    controller carries per-route editor state for an individual secrets engine, kept
    separate from the list-level controller.
  requirements:
  - id: r.backend-editor-state
    level: MAY
    text: The single-engine controller defaults preferAdvancedEdit to false and holds
      no other state, so the backend editor opens in basic edit mode until the operator
      switches it.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend.js
  - id: r.disable-engine-drop-task
    level: MUST
    text: The disableEngine dropTask yields engine.destroyRecord(); on success it
      pushes a success flash message naming the engine type and path, and on error
      it pushes a danger flash message containing the engine type, path, and the joined
      err.errors strings. Because it is a dropTask, a second disable request that
      arrives while one is running is dropped.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.displayable-backends-filter
    level: MUST
    text: The displayableBackends getter returns model entries that have shouldIncludeInList
      true and that are either not internal or are internal while showInternalEngines
      is true; the filter runs inside a Glimmer createCache and the getter reads it
      with getValue, so the result is recomputed only when model or showInternalEngines
      changes.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
    - file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backends.js
  - id: r.engine-name-option-list
    level: MUST
    text: The secretEngineArrayByName getter maps sortedDisplayableBackends to name/id
      pairs where both name and id come from modelObject.id, so the name filter offers
      one entry per visible backend.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.engine-type-option-list
    level: MUST
    text: The secretEngineArrayByType getter maps sortedDisplayableBackends to its
      engineType values, removes duplicates with a Set, and returns an array of name/id
      pairs keyed by engine type for the type filter dropdown.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.filter-actions-unpack-arrays
    level: MUST
    text: The filterEngineType and filterEngineName actions take a single array argument,
      destructure its first element, and assign it to selectedEngineType and selectedEngineName
      respectively; both selections default to null so no filter is active on load.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.internal-engines-toggle
    level: MUST
    text: The toggleShowInternalEngines action sets showInternalEngines to the checked
      argument, and showInternalEngines defaults to false so internal engines stay
      hidden until the operator opts in.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.sorted-backends-order
    level: MUST
    text: The sortedDisplayableBackends getter sorts displayable backends so supported
      backends come first, then orders by descending isSupportedBackend difference
      and ascending id, before any filtering is applied.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  - id: r.type-and-name-filter-combination
    level: MUST
    text: When selectedEngineType is set, sortedDisplayableBackends matches backend.engineType,
      or matches backend.id when selectedEngineName is also set; when only selectedEngineName
      is set it matches backend.id; when neither is set it returns the full sorted
      list.
    codeRefs:
    - class:21d0b621a698e03c7df822b3b38419f5
  interfaces:
  - name: VaultClusterSecretsBackendController
    kind: class
    signature: class VaultClusterSecretsBackendController extends Controller
    file: third_party/openbao/ui/app/controllers/vault/cluster/secrets/backends.js
codeRefIndex:
- class:21d0b621a698e03c7df822b3b38419f5 VaultClusterSecretsBackendController@third_party/openbao/ui/app/controllers/vault/cluster/secrets/backends.js:12
- file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend.js backend.js@third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backends.js backends.js@third_party/openbao/ui/app/controllers/vault/cluster/secrets/backends.js
