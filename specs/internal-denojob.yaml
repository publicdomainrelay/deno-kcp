            decides: none
            when: on_create
          startTime:
            by: internal/denojob/denojob.go:Reconcile
            decides: none
            when: on_create
          succeeded:
            by: internal/denojob/denojob.go:Reconcile
            decides: none
            when: on_every_pass
        types: api/v1alpha1/types_denojob.go
