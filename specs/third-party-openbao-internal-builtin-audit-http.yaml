kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-audit-http
  namespace: default
spec:
  intent: 'This context exists so that the HTTP audit device can be described, tested
    and reimplemented without reading the vendored source: it fixes the contract the
    audit subsystem depends on (a Backend that hashes with a salt, encodes log input
    through a JSON formatter, and POSTs the entry to a configured URI), the exact
    configuration keys and defaults Factory honours, and the failure modes callers
    must see at construction time rather than at first log. It also records the test-only
    handler the package uses to stand in for a remote audit endpoint, so end-to-end
    behaviour of the HTTP path is observable from tests.'
  interfaces:
  - file: third_party/openbao/internal/builtin/audit/http/backend.go
    kind: struct
    name: Backend
    signature: type Backend struct
  - file: third_party/openbao/internal/builtin/audit/http/backend.go
    kind: method
    name: Backend.GetHash
    signature: func (b *Backend) GetHash(ctx context.Context, data string) (string,
      error)
  - file: third_party/openbao/internal/builtin/audit/http/backend.go
