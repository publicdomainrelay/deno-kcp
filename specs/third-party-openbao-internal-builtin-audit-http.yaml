    id: r.format-config-defaults
    level: MUST
    text: Factory sets hmacAccessor true by default, logRaw false by default, and
      elideListResponses false by default, parsing each config value as a bool when
      present and failing on a parse error.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/audit/http/backend.go
