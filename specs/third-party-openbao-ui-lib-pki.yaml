apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/lib/pki/index.js index.js@third_party/openbao/ui/lib/pki/index.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki
  namespace: default
spec:
  intent: The context exists to pin down the entrypoint that registers the PKI feature
    area of the OpenBao web UI as an Ember engine addon, so consumers of this repository
    know how the PKI UI is packaged, under what name it is mounted, and that it is
    loaded eagerly rather than lazily. It is part of the vendored third_party/openbao
    subtree, kept as-is from upstream rather than reimplemented, and it sits upstream
    of the component and model code that the PKI engine renders.
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.commonjs-export
    level: MUST
    text: The addon must be published through module.exports using a require of ember-engines/lib/engine-addon,
      matching the CommonJS build-tool convention that Ember addon index files are
      loaded with, rather than ESM export syntax.
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.developing-addon-true
    level: MUST
    text: The definition must supply an isDevelopingAddon method that returns true
      unconditionally, so Ember treats the addon as under development for every build
      rather than only when linked locally.
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.engine-name-pki
    level: MUST
    text: The engine addon definition must set name to the string 'pki', which is
      the identifier the host application mounts and resolves the engine under.
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.lazy-loading-disabled
    level: MUST
    text: The engine must disable lazy loading by setting lazyLoading.enabled to false,
      so the PKI UI assets are emitted into the main build instead of being fetched
      as a separate bundle on route entry.
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.mpl-2.0-header
    level: MUST
    text: 'The file must retain the HashiCorp copyright notice and the SPDX-License-Identifier:
      MPL-2.0 header comment, because this is vendored upstream code redistributed
      under the Mozilla Public License 2.0.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/index.js
    id: r.pki-engine-addon
    level: MUST
    text: The module must export an Ember engine addon built by calling buildEngine
      imported from ember-engines/lib/engine-addon, so the PKI UI is consumed as an
      engine rather than a plain addon.
  upstream: self
