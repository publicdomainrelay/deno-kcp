kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-locking
  namespace: default
spec:
  intent: The context describes a vendored third-party helper whose only job is to
    make lock selection a type choice instead of a call-site change. Code that needs
    mutual exclusion or reader/writer exclusion declares a field of type `Mutex` or
    `RWMutex` from this package; configuration then decides whether that field is
    backed by `sync` or by `deadlock`, giving deadlock diagnostics in the detection
    build and plain, cheaper locks otherwise. The spec must record the two interface
    shapes exactly, the four concrete embedders, and the invariant that each concrete
    type satisfies the interface of its kind, plus the config-option name and the
    diagnostic prefix the comments state.
  interfaces:
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: struct
    name: DeadlockMutex
    signature: type DeadlockMutex struct { deadlock.Mutex }
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: struct
    name: DeadlockRWMutex
    signature: type DeadlockRWMutex struct { deadlock.RWMutex }
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: interface
    name: Mutex
    signature: type Mutex interface { Lock(); Unlock() }
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: method
    name: Mutex.Lock
    signature: Lock()
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: method
    name: Mutex.Unlock
    signature: Unlock()
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: interface
    name: RWMutex
    signature: type RWMutex interface { Lock(); RLock(); RLocker() sync.Locker; RUnlock();
      Unlock() }
  - file: third_party/openbao/internal/helper/locking/lock.go
    kind: method
