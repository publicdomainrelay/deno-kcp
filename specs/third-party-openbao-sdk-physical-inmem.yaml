    - struct:433127d50c193842a0b1f3ca0ba2d6bd
    id: r.backend-contract
    level: MUST
    text: 'InmemBackend must satisfy physical.Backend: Put, Get, Delete and List operate
      on an internally synchronized map, and each exported operation must delegate
      to its Internal counterpart (PutInternal, GetInternal, DeleteInternal, ListInternal)
      so tests and callers can bypass the failure switches.'
  - codeRefs:
    - function:92955b55e1abdc8afbaa395116e4e364
    - function:c019f4a22f383dc72eccdef8d9c0f0f2
    id: r.constructors
    level: MUST
    text: NewInmem must return a TransactionalInmemBackend so callers get transactional
      support, while NewDirectInmem must return the plain InmemBackend without transactions;
      both take the backend config map and a logger and return physical.Backend or
      an error.
  - codeRefs:
    - method:393c7df9a35883ea59c0adec45409a7c
    - method:74e406f96705c0d0e72d5501915b441c
    - method:800402a0b3c8d2c671bce53ead64e1cd
    - method:d195bf63851ddf91db7d6336fb640822
    id: r.failure-injection
    level: MUST
    text: InmemBackend must expose FailPut, FailGet, FailDelete and FailList setters
      that toggle per-operation error injection, and while a switch is on the corresponding
      exported operation must return an error instead of touching the map.
  - codeRefs:
    - function:b323d9f5d39c7f416fbfac9dad196fc3
    - method:39d6aaeb07abb8bb3686f001a8d57d5c
    - method:7253cc2049f88538d67b5ad10141893d
    - method:83e66da284c9013a6b103a26f187c911
    - method:94bb327c33212189635d340fa6746144
    - struct:70bd01e4484635d5c2e3ccf8049945b9
    id: r.ha-backend
    level: MUST
    text: InmemHABackend must embed the in-memory backend, implement LockWith to hand
      out an InmemLock for a key and value, implement HookInvalidate to register a
      physical.InvalidateFunc, and report lock count and HA state through LockMapSize
      and HAEnabled; NewInmemHA must build this backend.
  - codeRefs:
    - method:616da0007e46a4628fdb7f765fb27c67
    - method:d5e0cabb4753f261dcbcad8dd0676c07
    id: r.ha-put-delete-invalidate
    level: SHOULD
    text: InmemHABackend.Put and InmemHABackend.Delete must update the in-memory data
      and, when the key is lock-related, notify registered invalidate hooks so lock
      holders learn their value changed.
  - codeRefs:
    - method:4bee182a484f430f1c6c3a51381d5441
    - method:bc30b838af03d4362af5ce8b9b79a4c5
    - method:fb8dd39628f33fdfc2bbbeff7dcdfac6
    - struct:605223dc185e0eeb8f8537f0bf596ad0
    id: r.lock-semantics
    level: MUST
    text: InmemLock.Lock must acquire the named lock, emitting on the returned channel
      when the lock is lost and honoring stopCh to abort waiting; Unlock must release
      it, and Value must report whether the lock is held together with its value.
  - codeRefs:
    - function:67470801f4aada872caf1408df246d21
    - struct:f0f24e705179292bd318eb8daf67f1e0
    id: r.op-naming
    level: MUST
    text: OpName must map each in-memory operation constant (put, delete, list, list-page,
      get, begin-tx, begin-ro-tx, commit-tx, rollback-tx) to its lowercase name and
      return "unknown" for any other value.
  - codeRefs:
    - method:3f8fb42701c6fbbab889e38d19785fd5
    - method:5e7184e26097a7ac26054b5656d8ab53
    id: r.paginated-list
    level: MUST
    text: InmemBackend.ListPage and the internal ListPaginatedInternal must return
      keys under prefix in sorted order, skipping keys at or before the after cursor
      and returning at most limit keys when limit is positive.
  - codeRefs:
    - file:third_party/openbao/sdk/physical/inmem/cache_test.go
    - file:third_party/openbao/sdk/physical/inmem/inmem_ha_test.go
    - file:third_party/openbao/sdk/physical/inmem/inmem_test.go
    - file:third_party/openbao/sdk/physical/inmem/physical_view_test.go
    id: r.test-coverage
    level: SHOULD
    text: The package tests must exercise the plain backend, the HA backend and the
      cache and view layers, covering CRUD, paginated listing, failure injection and
      lock behavior.
  - codeRefs:
    - method:705d52ff7b4f4df84dc5294474090947
    - method:d21e06b62fb07aa815fd38f8e8d9291a
    - struct:efc12d86c49e3285916bf6e41a1d988b
    id: r.transaction-begin
    level: MUST
    text: TransactionalInmemBackend.BeginTx must start a read-write transaction and
      BeginReadOnlyTx must start one that rejects writes, both returning physical.Transaction
      or an error.
  - codeRefs:
    - method:304c80ffef2cd2f743ea3bdc7f6a8784
    - method:eaa3ba9fbe82faa210aeb03c2f6307c5
    id: r.transaction-commit-rollback
    level: MUST
    text: InmemBackendTransaction.Commit must apply all staged operations to the parent
      backend, and Rollback must discard them without mutating the parent; both must
      consume the transaction so it cannot be reused.
  - codeRefs:
    - method:3e0f1595c88e7a20ae01bea792ec8df5
    - method:8153482cc71bfa19cbfe74e22a7f9b6d
    - method:96fcde07ad2ea1cf9ae5ee6ec522f37a
    - method:da23dda1d9aaee72a6f3dfa2566046a7
    - method:f53097ef61ea8e68a22cc816f1aa5044
    - struct:ebb7d2f72be01a983dbdded0ecbb4f62
    id: r.transaction-staging
    level: MUST
    text: 'InmemBackendTransaction must keep staged writes and reads in a dirty overlay:
      Put and Delete record pending changes, Get and List/ListPage read the overlay
      before the parent backend, and no change reaches the parent map before Commit.'
  upstream: self
