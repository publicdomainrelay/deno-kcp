kind: SystemContext
metadata:
  name: third-party-openbao-sdk-physical-inmem
  namespace: default
spec:
  intent: 'This context specifies the in-memory physical backend that the OpenBao
    SDK ships for tests and for embedders that need a throwaway store. It exists so
    readers can tell exactly what the backend guarantees: the synchronized map behind
    the physical.Backend contract, the delibrate failure injection used to exercise
    error paths, the transaction overlay that stages writes until Commit, and the
    in-process HA lock map that simulates lock contention without a real cluster.
    Read it before relying on in-memory durability, transaction isolation, or HA lock
    behavior.'
