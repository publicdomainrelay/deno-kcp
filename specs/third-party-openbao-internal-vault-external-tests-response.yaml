apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
  allowed_response_headers_test.go@third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-response
  namespace: default
spec:
  intent: 'This context exists to pin down the observable contract of the response-header
    allow-list in the vendored third_party/openbao vault HTTP handler, independent
    of this repository''s own code: a plugin mount must not be able to leak arbitrary
    HTTP response headers to clients, and an operator must be able to opt a specific
    header back in per mount through the allowed_response_headers tuning, including
    when the configured casing differs from the emitted casing. Because the file is
    an external black-box test that speaks only over the HTTP API (client.Logical().ReadRaw,
    client.Sys().TuneMount) and not over internal Go packages, it documents the behaviour
    the vendored handler is expected to preserve across upstream updates rather than
    behaviour authored in this repo.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
    id: r.allowed-response-headers-tuning
    level: MUST
    text: 'After client.Sys().TuneMount("auth/headtest", api.MountConfigInput{AllowedResponseHeaders:
      []string{"WwW-AuthenTicate"}}), the www-authenticate header value Negotiate
      must appear on both the 200 response from auth/headtest/loginnoerror and the
      401 response from auth/headtest/login, so the allowed-list comparison must ignore
      letter case.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
    id: r.credential-mount-header-emission
    level: MUST
    text: The test registers a credential backend named headtest whose login and loginnoerror
      read callbacks each return a logical.Response carrying Headers map[string][]string
      with key www-authenticate and value Negotiate; login additionally returns logical.CodedError(401,
      "authentication required") and loginnoerror returns an empty logical.Auth with
      a nil error. The backend is mounted through the API as auth type headtest on
      a test cluster built from vault.CoreConfig with that factory.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
    id: r.headers-stripped-when-not-allowed
    level: MUST
    text: When the mount has not been tuned, reading auth/headtest/loginnoerror must
      return HTTP status 200 with an empty www-authenticate header, and reading auth/headtest/login
      must return an error with HTTP status 401 and an empty www-authenticate header;
      the test fails if any of these headers is present.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
    id: r.raw-response-inspection
    level: SHOULD
    text: Header assertions must inspect the raw HTTP response through client.Logical().ReadRaw,
      which returns the status code and the header collection directly rather than
      the decoded logical response.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/response/allowed_response_headers_test.go
    id: r.test-cluster-lifecycle
    level: MUST
    text: The test must run against a vault.NewTestCluster configured with HandlerFunc
      vaulthttp.Handler and DisableStandbyReads true, start it with cluster.Start(),
      wait for the active core with vault.TestWaitActive, and defer cluster.Cleanup()
      so the cluster is always torn down.
  upstream: self
