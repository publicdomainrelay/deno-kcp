apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-framework
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The package exists so that a plugin can declare its HTTP surface as data
    — a list of Path values with patterns, fields and an OperationFunc each — and
    let the framework do routing, existence checks, field decoding and validation,
    response shaping, lease extension, and OpenAPI emission. It is vendored third-party
    code under third_party/openbao/sdk, consumed by this repository rather than authored
    here, so the spec records the exported API surface and the behaviour the code
    must keep for the depending backends to work.
  requirements:
  - id: r.backend-existence-check
    level: MUST
    text: Backend.HandleExistenceCheck runs the path's ExistenceFunc when one is defined
      and reports checkFound plus exists, so callers can distinguish a missing object
      from a path that has no existence semantics.
    codeRefs:
    - file:third_party/openbao/sdk/framework/backend.go
    - method:0849067c783a880306c88ea24c0ca2f8
    - type_alias:f558f7e3ee8f515876ff1de886d8e692
  - id: r.backend-lifecycle
    level: MUST
    text: Backend exposes the lifecycle hooks Setup, Initialize, Cleanup and InvalidateKey,
      plus accessors SpecialPaths, Logger, System, Type, PluginVersion, GetRandomReader,
      Route and Secret, so a backend embedded in the SDK types satisfies the logical
      backend contract and can look up its own registered paths and secrets by name.
    codeRefs:
    - file:third_party/openbao/sdk/framework/backend.go
    - method:61ffda091909f4266a0e8630158e919c
    - method:72a6184451cb24c52e1c211ade1e0a28
    - method:8e55eaefd50196fa98908dd1ac839131
    - method:951bde2f613bae1db766a10294f1ba1f
    - method:b53fa91104f4d17ae2ff4a092e1d3d4b
    - method:c0e758a1909cca92bdbf5e226212a251
    - method:fba8990f5a13a69f7f3c1b5dd2da8cac
  - id: r.backend-request-routing
    level: MUST
    text: Backend.HandleRequest matches the incoming logical.Request against the registered
      Path patterns and calls the matching path's OperationFunc, returning its logical.Response
      and error; when no path matches it returns a logical error response instead
      of panicking.
    codeRefs:
    - file:third_party/openbao/sdk/framework/backend.go
    - method:4d000e56c49b0a74a8c5fa7ac5acc18c
    - struct:b948ee87a0d5135bae78a695dd180af5
  - id: r.backend-route-testing
    level: SHOULD
    text: TestBackendRoutes is the exported test helper that asserts every supplied
      route string resolves through the Backend, used by backends to guard their route
      tables in tests.
    codeRefs:
    - file:third_party/openbao/sdk/framework/testing.go
    - function:023464880305b582c393e68bfa96807d
  - id: r.field-data-accessors
    level: MUST
    text: 'FieldData reads values by key: Get returns the value or nil, GetOk and
      GetOkErr report presence, GetDefaultOrZero falls back to the schema default,
      GetFirst returns the first present key from a list, GetWithExplicitDefault and
      GetTimeWithExplicitDefault return a caller-supplied fallback, and CloneSchema
      produces a copy of the decoded data.'
    codeRefs:
    - file:third_party/openbao/sdk/framework/field_data.go
    - method:2e7f4d928ea6e952f6f0ca474c4c53ec
    - method:5e7893ce99d080d26de55007fe26f8c2
    - method:ad8d0bbfa19c63914d6318185fd370b2
    - method:b44fff07724ea9db6ca5a4fcd0a530f3
    - method:ce8e60c7e09089be6ef70b5a4684a2b2
    - method:ced451fcb6cca683466cc6cab591ce69
    - method:e9138168d90b74779c933d375ec603e6
    - method:f9a2a22284007d4e484b22290ea994f1
  - id: r.field-data-validation
    level: MUST
    text: 'FieldData validates decoded request fields against the FieldSchema map:
      Validate rejects unknown fields and type mismatches, ValidateStrict additionally
      enforces that no extra fields were supplied, and ValidateRequiredFields fails
      when a field marked Required is missing.'
    codeRefs:
    - file:third_party/openbao/sdk/framework/field_data.go
    - method:0c7624f86becdfaaef55b346bd8c6012
    - method:562e3910558bc1390750d4d09c84de1e
    - method:dfc1754ea84fb26ab65a9da5a1701fa0
    - struct:f12d62b8b9f5345bb3715239122bb712
  - id: r.field-type-parse-and-render
    level: MUST
    text: ParseFieldType maps a textual type name to a FieldType and returns an error
      for an unknown name, FieldType.String renders the type name back, FieldType.Zero
      gives the type's zero value, and FieldSchema.DefaultOrZero returns the declared
      default when set and the zero value otherwise.
    codeRefs:
    - file:third_party/openbao/sdk/framework/backend.go
    - file:third_party/openbao/sdk/framework/field_type.go
    - function:7cb155705ab33f37dec1f85c9cfb30c3
    - method:6d32781687fbfdef1d96f9619678184f
    - method:b3394c11e57b663fd83c9f4201329482
    - method:e4c55d146525004c3e11f01c1556a8ba
    - struct:7e047a43258d6c1e0b1035d0e0359c8f
    - type_alias:5c04d6de929504187477cc56ae7f2280
  - id: r.glob-list-filter
    level: MUST
    text: GlobListFilter wraps an OperationFunc so that a list operation filters its
      returned keys by the glob pattern supplied in the named field, returning only
      matching entries and the computed filter metadata.
    codeRefs:
    - file:third_party/openbao/sdk/framework/filter.go
    - function:5f111d929f25de87bbc5447daefb0b95
  - id: r.identity-templates
    level: MUST
    text: ValidateIdentityTemplate reports whether a template string is well formed
      and returns an error describing the fault, and PopulateIdentityTemplate substitutes
      the entity ID template placeholders using the logical.SystemView.
    codeRefs:
    - file:third_party/openbao/sdk/framework/identity.go
    - function:82e414d2c78ae16af09375033079b5e3
    - function:d0b90263b7114903892f00914d31cfcb
  - id: r.lease-extension
    level: MUST
    text: LeaseExtend returns an OperationFunc that renews the response lease within
      the backend increment and backend maximum, and CalculateTTL computes the resulting
      TTL from the increment, backend TTL, period, backend maximum, explicit maximum
      and start time, returning warnings when a value had to be capped.
    codeRefs:
    - file:third_party/openbao/sdk/framework/lease.go
    - function:46246a69971342055d0735001ad50723
    - function:93827947b27e47ac9bf58a0e2838d4c3
  - id: r.openapi-document
    level: MUST
    text: NewOASDocument builds an OASDocument for the given version and NewOASDocumentFromMap
      decodes one from a generic map, NewOASOperation allocates an operation, and
      OASDocument.CreateOperationIDs assigns unique operation IDs derived from the
      context string to every operation in the document.
    codeRefs:
    - file:third_party/openbao/sdk/framework/openapi.go
    - function:0028be1de12ba6bef00d3e1fb60e4b52
    - function:af6e936ef7bef04c1d426ab90b823361
    - function:bae938f2213cd5d05c587e1b40efd91b
    - method:6b3e61b2f68113c9a21bd771fdcc3d10
    - struct:40c27eadfb22b660f72bf6346bcdea4d
  - id: r.operation-handler-contract
    level: MUST
    text: OperationHandler is the interface a path operation implements, exposing
      Handler for the OperationFunc and Properties for the OperationProperties, and
      PathOperation is the concrete implementation of that interface.
    codeRefs:
    - file:third_party/openbao/sdk/framework/path.go
    - interface:bec23c61feb51a19cac02ea5ec15d026
    - method:17d0557aea6cf1cc4d85cef1f2da72eb
    - method:39d3202d080618c9707cfb8074acc4d0
    - method:3c90bd8055bafd921780f31bac6e2914
    - method:518b1b3e9a5f878b55ea64991e48db75
  - id: r.patch-operation
    level: MUST
    text: HandlePatchOperation applies a JSON patch built from the FieldData input
      onto the existing resource map and returns the merged JSON bytes, invoking the
      supplied PatchPreprocessorFunc first when one is given.
    codeRefs:
    - file:third_party/openbao/sdk/framework/backend.go
    - function:78e6b547965e022d718e82362df72f11
    - type_alias:0a5f926cd39070df2e6b094a7afeb37c
  - id: r.path-append
    level: MUST
    text: PathAppend concatenates any number of Path slices into one flat slice, so
      backends can compose their route tables from several path constructors.
    codeRefs:
    - file:third_party/openbao/sdk/framework/path.go
    - function:05a495b2d9c18fd5b278b7577edd9569
  - id: r.path-map-storage
    level: MUST
    text: PathMap reads, writes, deletes and lists map[string]any records at keys
      under its configured prefix in logical.Storage, and Paths returns the list,
      read/write and delete Path definitions that expose those operations.
    codeRefs:
    - file:third_party/openbao/sdk/framework/path_map.go
    - method:1a6987d0b01134fcad2cef5f4282ff97
    - method:3bd00eec4941ae599849b34865ff40e2
    - method:b5159c7f6d36a9988483871fe7a05bee
    - method:d6c98bab3ae0c6317dc3d886391f18b8
    - method:f873f45250e10e0f7b6f19ba9479842d
    - struct:1733cd6299ad444f48a453c0024d62b3
  - id: r.path-pattern-regexes
    level: MUST
    text: 'The path regex helpers build route patterns with a named capture group
      for the parameter: GenericNameRegex requires a value, OptionalGenericNameRegex
      makes it optional, GenericNameWithAtRegex allows an at-sign, OptionalParamRegex
      captures an optional parameter, and MatchAllRegex matches any trailing segment.'
    codeRefs:
    - file:third_party/openbao/sdk/framework/path.go
    - function:0de629d000606114b1ef2e4580e6d5a9
    - function:33e77a0b87122f030c420983e426f2e9
    - function:4f52da51e339e7114337d715edaeb9f7
    - function:8465914540267955672f669e8d9dbef2
    - function:97ba9e3269067a0a17fe3af55b2e7bd2
  - id: r.path-struct-storage
    level: MUST
    text: PathStruct reads, writes and deletes a single struct-shaped map at one storage
      key, and Paths returns the read/write/delete Path definitions for that key.
    codeRefs:
    - file:third_party/openbao/sdk/framework/path_struct.go
    - method:3e4df317f3f0aacc0eb6dbd673cf136b
    - method:470bda6606470657b10c0b19a7f8e233
    - method:d56c0f7d6c029319a7064354b9ff9b21
    - method:dd1d4f072ef5fab5cb6dde5280b8e7dc
    - struct:b521d161bd07bdcc12ddf383ab4772f1
  - id: r.policy-map-listing
    level: MUST
    text: PolicyMap.Policies lists the policy names present in logical.Storage, returning
      all of them when no names are given and only the requested ones otherwise.
    codeRefs:
    - file:third_party/openbao/sdk/framework/policy_map.go
    - method:f4c4e249d9de6545c9ec080076d4b3e7
    - struct:42c860827bf37a318b3dae262834790e
  - id: r.secret-response-and-lease
    level: MUST
    text: Secret builds a logical.Response from the data and internal maps, reports
      whether it is renewable, and handles renew and revoke requests through HandleRenew
      and HandleRevoke using the configured lease and revocation callbacks.
    codeRefs:
    - file:third_party/openbao/sdk/framework/secret.go
    - method:4bb16e0761c6a7fc7f76a95567954967
    - method:564f24766b134f320b88a43781afb0c3
    - method:8baeaa250a6ca163a577626c4560715e
    - method:aba27504927b0d3a3433d8d60908f827
    - struct:f667f7143dce728d79ff7d29444f4fd6
  - id: r.wal-persistence
    level: MUST
    text: PutWAL writes a WALEntry of the given kind holding arbitrary data and returns
      its generated ID, GetWAL loads the entry by ID, DeleteWAL removes it, and ListWAL
      lists the stored WAL IDs from the logical.Storage.
    codeRefs:
    - file:third_party/openbao/sdk/framework/wal.go
    - function:0c6f85a813572cc33c3f91839c85fcd2
    - function:6ac2ae45010883122cff7c87f0b3c39a
    - function:aa979bbdc44e7694c80d2d2b93c3640b
    - function:c3834b0cf7aafae27971beeea1dbe846
    - struct:158286e9f505700f38c457cf4c8f9583
