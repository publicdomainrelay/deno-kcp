kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-secrets-backend
  namespace: default
spec:
  intent: 'This context exists so that the secrets-backend route subtree of the OpenBao
    UI is described as a unit: which route modules exist, which of them export a class
    the graph can see, and what those classes do to the Ember store and controller.
    It gives the spec an anchor for the navigation and data-loading contract of secret
    engines (parameter extraction from the parent backend route, secret-v2 record
    lookup, controller priming for tabs) without restating the UI''s controllers,
    templates, or adapters. It marks the boundary between routes that only exist to
    define a nested path and the two routes whose hook bodies are actually known.'
  interfaces:
  - file: third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/edit-metadata.js
    kind: class
    name: EditMetadataRoute
    signature: class EditMetadataRoute extends Metadata
  - file: third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/metadata.js
    kind: class
    name: MetadataShow
    signature: class MetadataShow
  - file: third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/diff.js
    kind: class
    name: diff
    signature: class diff extends Route
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/index.js
    id: r.backend-index-route
    level: MUST
    text: index.js defines the route entered when no operation segment follows the
      backend name, so a bare secrets-backend URL resolves to a route instead of falling
      through to the parent.
  - codeRefs:
    - class:806b1b72918850a9776256f86ac9a879
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/diff.js
    id: r.backend-param-extraction
    level: MUST
    text: The diff route's beforeModel hook reads the backend parameter from the vault.cluster.secrets.backend
      parent route via paramsFor and assigns it to this.backend, so the backend name
      is available to later hooks without re-parsing the URL.
  - codeRefs:
    - class:806b1b72918850a9776256f86ac9a879
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/diff.js
    id: r.diff-controller-priming
    level: MUST
    text: The diff route's setupController hook sets backend (for backendCrumb), id
      (for navigation on tabs), and model on the controller, so the diff template
      can render the backend breadcrumb and link between secret tabs.
  - codeRefs:
    - class:806b1b72918850a9776256f86ac9a879
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/diff.js
    id: r.diff-model-query
    level: MUST
    text: The diff route's model hook destructures id from its params and returns
      a store queryRecord for the secret-v2 type scoped to this.backend and that id,
      so the route loads the compared secret version through the secret-v2 model.
  - codeRefs:
    - class:ea242026a9cf956a82d48e6262ee9cd8
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/edit-metadata.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/metadata.js
    id: r.edit-metadata-subclass
    level: MUST
    text: EditMetadataRoute must remain a subclass of the Metadata route with no additional
      members, so the metadata edit screen inherits the metadata route's model and
      setup behavior unchanged.
  - codeRefs:
    - class:e040711efe37f148df075441136a6961
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/metadata.js
    id: r.metadata-show-hooks
    level: MUST
    text: The MetadataShow route declares store and noReadAccess properties and implements
      beforeModel, model(params), and setupController(controller, model), so secret
      metadata display is resolved before render and a missing read capability is
      represented rather than thrown.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/actions.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/configuration.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/create.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/credentials.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/diff.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/edit-metadata.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/edit.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/list.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/metadata.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/overview.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/secret-edit.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/show.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/sign.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/versions.js
    id: r.operation-routes
    level: MUST
    text: 'The backend directory provides a route module per secret operation: list.js,
      show.js, create.js, edit.js, secret-edit.js, versions.js, credentials.js, sign.js,
      configuration.js, overview.js, metadata.js, edit-metadata.js, diff.js, and actions.js,
      so every secrets-backend screen reachable under the backend route has a matching
      route definition.'
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/create-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/credentials-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/edit-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/list-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/show-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/sign-root.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/secrets/backend/versions-root.js
    id: r.root-route-variants
    level: MUST
    text: Each operation route has a paired "-root" module (list-root.js, show-root.js,
      create-root.js, edit-root.js, credentials-root.js, sign-root.js, versions-root.js)
      that carries the parent route of the pair, so the backend segment can hold a
      resource route while the child renders the operation itself.
  upstream: self
