apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/helper/systemd/notify.go notify.go@third_party/openbao/internal/helper/systemd/notify.go
- function:5a861bf0e5d16ced0557d16459574b49 Notify@third_party/openbao/internal/helper/systemd/notify.go:19
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-systemd
  namespace: default
spec:
  intent: This context exists because the OpenBao server, agent, and proxy commands
    need to tell systemd that the process has finished starting up, and the vendored
    helper provides that capability in-tree. Keeping the sd_notify logic in its own
    package means the command layer only needs to call Notify with a state string
    such as "READY=1", and the helper decides from NOTIFY_SOCKET whether a systemd
    supervisor is actually present. It is a third-party vendored component inside
    this repository, so its behavior must keep matching upstream.
  interfaces:
  - file: third_party/openbao/internal/helper/systemd/notify.go
    kind: function
    name: Notify
    signature: func Notify(state string) (bool, error)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/helper/systemd/notify.go
    - function:5a861bf0e5d16ced0557d16459574b49
    id: r.notify-absent-socket-is-noop
    level: MUST
    text: Notify must read the NOTIFY_SOCKET environment variable, and when that variable
      is empty it must return (false, nil) without dialing any socket, so a process
      running outside systemd sees no error.
  - codeRefs:
    - file:third_party/openbao/internal/helper/systemd/notify.go
    - function:5a861bf0e5d16ced0557d16459574b49
    id: r.notify-reports-success-and-error
    level: MUST
    text: Notify must return (true, nil) after the state string is written successfully,
      and must return (false, err) carrying the underlying error when either the unixgram
      dial or the write fails.
  - codeRefs:
    - file:third_party/openbao/internal/helper/systemd/notify.go
    - function:5a861bf0e5d16ced0557d16459574b49
    id: r.notify-writes-datagram-to-socket
    level: MUST
    text: When NOTIFY_SOCKET is set, Notify must dial it as a unixgram UnixAddr and
      write the given state string as the datagram body, closing the connection afterwards.
  upstream: self
