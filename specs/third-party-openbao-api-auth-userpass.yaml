- function:f736e7e6a1f4575d2650107dd15dd744 NewUserpassAuth@third_party/openbao/api/auth/userpass/userpass.go:48
- method:9afc106af9cd9785e2aa574c2189b084 UserpassAuth.Login@third_party/openbao/api/auth/userpass/userpass.go:94
- struct:96e3f457b1325f85ffcedcb95a8bb314 Password@third_party/openbao/api/auth/userpass/userpass.go:25
- struct:a59bb055a5013978de35ac677b4ec239 UserpassAuth@third_party/openbao/api/auth/userpass/userpass.go:17
- type_alias:d9885a92c719f1e783f19725804a4044 LoginOption@third_party/openbao/api/auth/userpass/userpass.go:38
