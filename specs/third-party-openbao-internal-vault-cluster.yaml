    id: r.inmem-cluster
    level: MUST
    text: NewInmemLayerCluster builds a named cluster of the requested number of nodes
      and wires every node to every other node; ConnectCluster joins two clusters
      by connecting all of their layers; Layers exposes the cluster's layers as a
      NetworkLayerSet; and the cluster-level SetConnectionCh, SetReaderDelay, and
      SetForceTimeout apply the corresponding fault to every node.
