kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-cluster
  namespace: default
spec:
  intent: This context documents the transport seam that lets OpenBao run its cluster
    traffic either over real TCP/TLS or entirely in memory. It exists so that the
    cluster Listener, its ALPN-based client/handler registries, and both NetworkLayer
    implementations are described by the code as it stands, giving a fixed contract
    for the TLS certificate lookups, connection handoff, address advertisement, and
    the in-memory fault-injection knobs that tests depend on.
