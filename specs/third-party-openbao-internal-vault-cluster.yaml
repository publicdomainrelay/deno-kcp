    text: 'InmemLayer injects transport faults: SetReaderDelay makes reads on its
      connections wait the given delay, SetForceTimeout makes connections sourced
      from a given address fail with a deadline error, and SetConnectionCh delivers
      a ConnectionInfo on the supplied channel whenever a new connection appears.'
