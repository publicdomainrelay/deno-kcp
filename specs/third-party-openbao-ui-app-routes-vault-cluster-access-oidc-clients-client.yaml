kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-oidc-clients-client
  namespace: default
spec:
  intent: 'These files exist to give each OIDC client detail screen its own routable
    sub-state: a details view, an edit view, and a providers list view reachable at
    .../clients/client/providers. The empty details and edit routes are deliberate
    placeholders that rely on the parent route''s model and on the corresponding templates;
    only the providers route needs its own data fetch, because the set of identity
    providers allowed to use a given client is not part of the client record itself
    and must be queried separately by allowed_client_id. The nested route structure
    lets the UI render client details, client edit form, and client-to-provider associations
    under a single client model without refetching the client for each tab.'
  interfaces:
  - file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
    kind: class
    name: OidcClientDetailsRoute
    signature: class OidcClientDetailsRoute extends Route
  - file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
    kind: class
    name: OidcClientEditRoute
    signature: class OidcClientEditRoute extends Route
  - file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
    kind: class
    name: OidcClientProvidersRoute
    signature: class OidcClientProvidersRoute extends Route
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
    id: r.default-export-route-class
    level: MUST
    text: Each file must default-export its single route class (OidcClientDetailsRoute,
      OidcClientEditRoute, OidcClientProvidersRoute) so Ember's route resolver can
      map the module path .../clients/client/<name> onto the matching route.
  - codeRefs:
    - class:7f1cb0f1c4fee1deecf68d6f592c15b5
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
    id: r.details-route-inherits-parent-model
    level: MUST
    text: OidcClientDetailsRoute must extend Ember's Route without overriding any
      hook or injecting services, so the details view resolves its model through the
      parent vault.cluster.access.oidc.clients.client route.
  - codeRefs:
    - class:56f63b8c4d657f5b5b97e5a1e90267fe
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
    id: r.edit-route-inherits-parent-model
    level: MUST
    text: OidcClientEditRoute must extend Ember's Route without overriding any hook
      or injecting services, so the edit view reuses the already-loaded client model
      from the parent route instead of fetching its own.
  - codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
    id: r.providers-route-404-empty
    level: MUST
    text: OidcClientProvidersRoute.model() must convert an error whose httpStatus
      is 404 into an empty array rather than propagating it, and must rethrow every
      other error unchanged.
  - codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
    id: r.providers-route-queries-by-client
    level: MUST
    text: OidcClientProvidersRoute.model() must read the parent route model via modelFor('vault.cluster.access.oidc.clients.client')
      and query the oidc/provider record type with the filter allowed_client_id bound
      to that model's clientId, returning the query promise as the route model.
  - codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
    id: r.providers-route-store-injected
    level: MUST
    text: OidcClientProvidersRoute must obtain its data layer through the injected
      store service, queried as this.store.query, so the provider list is loaded through
      Ember Data rather than direct HTTP calls.
  upstream: self
