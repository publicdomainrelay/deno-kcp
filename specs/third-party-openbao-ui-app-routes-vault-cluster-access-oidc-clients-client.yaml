  details.js@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
  edit.js@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
