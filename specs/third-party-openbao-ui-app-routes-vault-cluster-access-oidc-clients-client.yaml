apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-oidc-clients-client
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the client details view, the client edit form, and
    the client-to-provider associations can each be addressed as their own nested
    route under a single client model. The details and edit routes are deliberately
    empty: they need no data of their own because the parent route already fetched
    the client, and the corresponding templates render against that inherited model.
    Only the providers route owns a fetch, because the set of identity providers permitted
    to use a given client is not a field on the client record; it is discovered by
    querying the oidc/provider type with the allowed_client_id filter, and a 404 from
    that query means no providers are linked rather than an error worth surfacing.
    The split keeps one client load shared across three tabs instead of refetching
    per screen.'
  requirements:
  - id: r.default-export-route-class
    level: MUST
    text: Each of the three modules default-exports its single route class, OidcClientDetailsRoute
      from details.js, OidcClientEditRoute from edit.js and OidcClientProvidersRoute
      from providers.js, so Ember's route resolver maps the module path .../clients/client/<name>
      onto the matching route.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
  - id: r.details-route-inherits-parent-model
    level: MUST
    text: OidcClientDetailsRoute extends Ember's Route with an empty body and no overridden
      hook or injected service, so the details template resolves its model through
      the parent vault.cluster.access.oidc.clients.client route instead of loading
      the client again.
    codeRefs:
    - class:7f1cb0f1c4fee1deecf68d6f592c15b5
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
  - id: r.edit-route-inherits-parent-model
    level: MUST
    text: OidcClientEditRoute extends Ember's Route with an empty body and no overridden
      hook or injected service, so the edit form reuses the already-loaded client
      model from the parent route rather than fetching its own.
    codeRefs:
    - class:56f63b8c4d657f5b5b97e5a1e90267fe
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
  - id: r.providers-route-404-empty
    level: MUST
    text: OidcClientProvidersRoute.model() attaches a catch to the query promise that
      returns an empty array when err.httpStatus is 404 and rethrows the error unchanged
      in every other case, so an unlinked client renders an empty provider list while
      real failures still reach Ember's error handling.
    codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
  - id: r.providers-route-queries-by-client
    level: MUST
    text: 'OidcClientProvidersRoute.model() reads the parent route model through this.modelFor(''vault.cluster.access.oidc.clients.client'')
      and returns this.store.query(''oidc/provider'', { allowed_client_id: model.clientId
      }) as the route model, so the provider list is the set of providers whose allowed_client_id
      matches the current client''s clientId.'
    codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
  - id: r.providers-route-store-injected
    level: MUST
    text: OidcClientProvidersRoute declares store as a service-injected property and
      reaches its data only through this.store.query, so the provider list loads through
      Ember Data rather than a direct HTTP call.
    codeRefs:
    - class:d81a601a448cf767deb20b2bd5266e2e
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
  interfaces:
  - name: OidcClientDetailsRoute
    kind: class
    signature: class OidcClientDetailsRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js
  - name: OidcClientEditRoute
    kind: class
    signature: class OidcClientEditRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js
  - name: OidcClientProvidersRoute
    kind: class
    signature: class OidcClientProvidersRoute extends Route
    file: third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js
codeRefIndex:
- class:56f63b8c4d657f5b5b97e5a1e90267fe OidcClientEditRoute@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/edit.js:8
- class:7f1cb0f1c4fee1deecf68d6f592c15b5 OidcClientDetailsRoute@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/details.js:7
- class:d81a601a448cf767deb20b2bd5266e2e OidcClientProvidersRoute@third_party/openbao/ui/app/routes/vault/cluster/access/oidc/clients/client/providers.js:9
