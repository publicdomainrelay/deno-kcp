apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-models-auth-config-aws
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the OpenBao UI can edit the AWS auth method''s client
    configuration, periodic tidy behavior, identity access list, and role tag denylist
    through the same Ember Data models the rest of the UI uses. It is a declarative
    form-schema layer: the models decide which attributes exist, their labels, defaults,
    edit types, and how they group into form fields, and the shared AuthConfig base
    supplies the save/read mechanics against the auth-config API path.'
  requirements:
  - id: r.client-extends-auth-config
    level: MUST
    text: The AWS client model must extend the shared AuthConfig model and declare
      the string attributes secretKey, accessKey, endpoint (labeled 'EC2 Endpoint'),
      iamEndpoint (labeled 'IAM Endpoint'), stsEndpoint (labeled 'STS Endpoint'),
      and iamServerIdHeaderValue (labeled 'IAM Server ID Header Value'), so the AWS
      client form edits exactly those credential and endpoint fields.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/client.js
  - id: r.client-field-groups
    level: MUST
    text: The AWS client model must expose a computed fieldGroups that passes attribute
      names through fieldToAttrs and groups accessKey and secretKey into the unnamed
      default group while placing endpoint, iamEndpoint, stsEndpoint, and iamServerIdHeaderValue
      under an 'AWS Options' group.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/client.js
  - id: r.copyright-headers
    level: SHOULD
    text: Each model module should carry the HashiCorp copyright header and the MPL-2.0
      SPDX license identifier comment at the top of the file, matching the other models
      in this tree.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/client.js
    - file:third_party/openbao/ui/app/models/auth-config/aws/identity-accesslist.js
    - file:third_party/openbao/ui/app/models/auth-config/aws/roletag-denylist.js
    - file:third_party/openbao/ui/app/models/auth-config/aws/tidy.js
  - id: r.identity-accesslist-reuses-tidy
    level: MUST
    text: The AWS identity access list model must extend the tidy model without adding
      attributes or overriding anything, so the identity access list form presents
      the same safetyBuffer and disablePeriodicTidy fields as the tidy form.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/identity-accesslist.js
  - id: r.roletag-denylist-reuses-tidy
    level: MUST
    text: The AWS role tag denylist model must extend the tidy model without adding
      attributes or overriding anything, so the role tag denylist form presents the
      same safetyBuffer and disablePeriodicTidy fields as the tidy form.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/roletag-denylist.js
  - id: r.tidy-attributes-and-defaults
    level: MUST
    text: The AWS tidy model must extend AuthConfig and declare safetyBuffer with
      editType 'ttl' and a default value of '72h', and disablePeriodicTidy as a boolean
      defaulting to false, so an unset tidy form shows a 72 hour safety buffer with
      periodic tidy enabled.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/tidy.js
  - id: r.tidy-attrs-meta
    level: MUST
    text: The AWS tidy model must expose a computed attrs property that returns expandAttributeMeta(this,
      ['safetyBuffer', 'disablePeriodicTidy']), so the tidy form field metadata is
      derived from those two attribute names only.
    codeRefs:
    - file:third_party/openbao/ui/app/models/auth-config/aws/tidy.js
codeRefIndex:
- file:third_party/openbao/ui/app/models/auth-config/aws/client.js client.js@third_party/openbao/ui/app/models/auth-config/aws/client.js
- file:third_party/openbao/ui/app/models/auth-config/aws/identity-accesslist.js identity-accesslist.js@third_party/openbao/ui/app/models/auth-config/aws/identity-accesslist.js
- file:third_party/openbao/ui/app/models/auth-config/aws/roletag-denylist.js roletag-denylist.js@third_party/openbao/ui/app/models/auth-config/aws/roletag-denylist.js
- file:third_party/openbao/ui/app/models/auth-config/aws/tidy.js tidy.js@third_party/openbao/ui/app/models/auth-config/aws/tidy.js
