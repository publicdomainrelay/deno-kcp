apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-homedir
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so that OpenBao-derived code in this repository has
    one place to resolve the home directory portably and to turn user-supplied `~`-prefixed
    configuration paths into absolute ones. It isolates the platform difference in
    home-directory discovery and the caching of that lookup, and gives callers a single
    expansion routine that fails loudly instead of silently mishandling `~user` paths.
  requirements:
  - id: r.behaviour-covered-by-tests
    level: SHOULD
    text: The package's behaviour for Dir() and Expand() stay covered by the unit
      tests in homedir_test.go.
    codeRefs:
    - file:third_party/openbao/internal/helper/homedir/homedir_test.go
  - id: r.cache-concurrency-safe
    level: MUST
    text: Dir() hold the package cache lock around the cache check and the discovery
      call so concurrent callers cannot race on the cached value.
    codeRefs:
    - function:4cb6dd1a877c5fa72a15a67c31238a1e
  - id: r.discovery-error
    level: MUST
    text: Dir() return an empty string together with the discovery error when the
      underlying OS-specific routine fails.
    codeRefs:
    - function:4cb6dd1a877c5fa72a15a67c31238a1e
  - id: r.expand-propagates-error
    level: MUST
    text: Expand() return an empty string and propagate the error from Dir() when
      home directory discovery fails.
    codeRefs:
    - function:c145f28b3a5d3aef304d86cc7e6ad2d5
  - id: r.home-directory-cached
    level: MUST
    text: Dir() cache the first successful home directory in a package-level variable
      and return that cached value on subsequent calls without repeating discovery.
    codeRefs:
    - file:third_party/openbao/internal/helper/homedir/homedir.go
    - function:4cb6dd1a877c5fa72a15a67c31238a1e
  - id: r.home-directory-discovery
    level: MUST
    text: 'Dir() return the home directory of the executing user, choosing the discovery
      routine by operating system: dirWindows on windows and dirUnix on every other
      OS.'
    codeRefs:
    - file:third_party/openbao/internal/helper/homedir/homedir.go
    - function:4cb6dd1a877c5fa72a15a67c31238a1e
  - id: r.tilde-prefix-expansion
    level: MUST
    text: Expand() replace a leading `~` in the path with the home directory returned
      by Dir() and join it with the remainder using filepath.Join.
    codeRefs:
    - function:c145f28b3a5d3aef304d86cc7e6ad2d5
  - id: r.untouched-paths
    level: MUST
    text: Expand() return the input path unchanged, with no error, when the path is
      empty or does not begin with `~`.
    codeRefs:
    - function:c145f28b3a5d3aef304d86cc7e6ad2d5
  - id: r.user-specific-rejected
    level: MUST
    text: Expand() return an error with the text "cannot expand user-specific home
      directory" when the path begins with `~` followed by a character other than
      `/` or `\`.
    codeRefs:
    - function:c145f28b3a5d3aef304d86cc7e6ad2d5
  interfaces:
  - name: Dir
    kind: function
    signature: func Dir() (string, error)
    file: third_party/openbao/internal/helper/homedir/homedir.go
  - name: Expand
    kind: function
    signature: func Expand(path string) (string, error)
    file: third_party/openbao/internal/helper/homedir/homedir.go
codeRefIndex:
- file:third_party/openbao/internal/helper/homedir/homedir.go homedir.go@third_party/openbao/internal/helper/homedir/homedir.go
- file:third_party/openbao/internal/helper/homedir/homedir_test.go homedir_test.go@third_party/openbao/internal/helper/homedir/homedir_test.go
- function:4cb6dd1a877c5fa72a15a67c31238a1e Dir@third_party/openbao/internal/helper/homedir/homedir.go:24
- function:c145f28b3a5d3aef304d86cc7e6ad2d5 Expand@third_party/openbao/internal/helper/homedir/homedir.go:50
