apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-adapters-database
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'These adapters exist so the OpenBao UI can present and edit database secrets
    engine state (connections, roles and generated credentials) through the standard
    Ember Data store API instead of raw fetch calls. They exist as a separate context
    because each adapter encodes a distinct piece of the database engine''s URL and
    error semantics: the connection adapter owns the /config endpoint plus the rotate-root
    and reset sub-resources, the credential adapter owns /creds and /static-creds
    and has to reconcile the ambiguity between dynamic and static credential roles,
    and the role adapter owns /roles and /static-roles and must keep the allowed_roles
    back-reference on the owning connection consistent on create and delete. The context
    is the boundary where Ember Data conventions meet the database engine''s HTTP
    API.'
  requirements:
  - id: r.connection-delete
    level: MUST
    text: Deleting a connection must issue a DELETE against the config URL for the
      backend and id taken from the snapshot.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-fetch-annotates-response
    level: MUST
    text: After fetching a connection, the adapter must copy the backend onto the
      response and, when an id was supplied, set the response id to that id, so the
      store record carries the mount path it came from.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-list-query
    level: MUST
    text: When the connection adapter fetches without an id, it must send a 'list'
      query parameter set to true so the engine returns the key list rather than a
      single configuration record.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-query-passthrough
    level: MUST
    text: Both query and queryRecord on the connection adapter must route through
      the same fetchByQuery helper so list and single-record reads share identical
      URL and annotation behavior.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-root-and-reset
    level: MUST
    text: The connection adapter must expose rotateRootCredentials(backend, id) and
      resetConnection(backend, id), each issuing a POST to the rotate-root and reset
      URLs respectively.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-url-shape
    level: MUST
    text: The connection adapter must build URLs of the form <base>/<backend>/config
      when no id is given and <base>/<backend>/config/<id> when an id is given, and
      must special-case type 'ROTATE' to <base>/<backend>/rotate-root/<id> and type
      'RESET' to <base>/<backend>/reset/<id>.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.connection-write-status
    level: MUST
    text: Creating and updating a connection must POST serialized attributes to the
      config URL, and because the engine may answer 204 the adapter must synthesize
      a payload containing the name id and the serialized data instead of returning
      an empty body. Update must delegate to create.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
  - id: r.credential-endpoints
    level: MUST
    text: The credential adapter must read static credentials from <base>/<backend>/static-creds/<secret>
      and dynamic credentials from <base>/<backend>/creds/<secret>, URL-encoding both
      the backend and the secret, and must tag each response with roleType 'static'
      or 'dynamic' respectively.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/credential.js
  - id: r.credential-error-selection
    level: MUST
    text: If both credential requests reject, the adapter must rethrow the rejection
      carrying the higher httpStatus; when the statuses are not comparable it must
      fall back to the static request's reason.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/credential.js
  - id: r.credential-rotate
    level: MUST
    text: The credential adapter must expose rotateRoleCredentials(backend, id), issuing
      a POST to <base>/<backend>/rotate-role/<id> with both path segments URL-encoded.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/credential.js
  - id: r.credential-type-dispatch
    level: MUST
    text: When the caller supplies query.roleType 'static' or 'dynamic' the credential
      adapter must issue only that one request; when the role type is absent it must
      request both in parallel and resolve to whichever returned a value.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/credential.js
  - id: r.namespace-v1
    level: MUST
    text: Every adapter in this context extends the shared ApplicationAdapter and
      sets namespace to 'v1', so all request URLs it builds are rooted at the v1 API
      prefix.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/connection.js
    - file:third_party/openbao/ui/app/adapters/database/credential.js
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-allowed-roles-sync
    level: MUST
    text: Creating a role must add the role name to the allowed_roles of its owning
      database connection and save that connection before the role POST; deleting
      a role must remove the role name from allowed_roles before the role DELETE.
      A failure to update allowed_roles on create must surface as the error 'Could
      not update allowed roles for selected database. Check the OpenBao logs for details'.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-list-query-param
    level: MUST
    text: Role list requests must send the 'list' query parameter set to true when
      no id is supplied, matching the connection adapter's list convention.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-path-for-type-asserts
    level: MUST
    text: The role adapter must override pathForType to fail an assertion, because
      role URLs are generated from the role type instead of the model name.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-query-list
    level: MUST
    text: A list query must request both static and dynamic roles, throw when both
      reject, and otherwise return both key sets concatenated into data.keys while
      also keeping the separate staticRoles and dynamicRoles arrays and the backend
      on the response, because role names are distinct across the two types and each
      list may individually fail.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-query-single
    level: MUST
    text: A single-role query must return the request annotated with its type, backend
      and id; when query.type is absent the adapter must request both static and dynamic
      roles and use the one that returned a value, merging its data into a response
      that records the resolved type.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-url-shape
    level: MUST
    text: The role adapter must map role type 'static' to the 'static-roles' path
      segment and every other type, including the default, to 'roles', giving <base>/<backend>/<segment>
      for a list and <base>/<backend>/<segment>/<id> for a single role.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
  - id: r.role-write-status
    level: MUST
    text: Creating and updating a role must POST serializer output to the type-appropriate
      role URL and return a payload carrying the name as id, since the engine may
      answer 204 to a non-DELETE write.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/database/role.js
codeRefIndex:
- file:third_party/openbao/ui/app/adapters/database/connection.js connection.js@third_party/openbao/ui/app/adapters/database/connection.js
- file:third_party/openbao/ui/app/adapters/database/credential.js credential.js@third_party/openbao/ui/app/adapters/database/credential.js
- file:third_party/openbao/ui/app/adapters/database/role.js role.js@third_party/openbao/ui/app/adapters/database/role.js
