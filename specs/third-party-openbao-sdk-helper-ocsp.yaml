kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-ocsp
  namespace: default
spec:
  intent: 'The context exists so the OpenBao OCSP helper can be described, depended
    on, and reasoned about as a bounded unit inside deno-kcp. It captures the public
    surface a caller needs to perform OCSP revocation checks: client construction
    and logging, response caching and invalidation, transport construction from verification
    config, the leaf and peer certificate verification paths, and the bulk chain-wide
    status query. Separating the single-method clientInterface makes the network dependency
    injectable for tests, and FailOpenMode makes the failure policy an explicit type
    rather than an implicit choice.'
  interfaces:
  - file: third_party/openbao/sdk/helper/ocsp/client.go
    kind: struct
    name: Client
    signature: type Client struct
  - file: third_party/openbao/sdk/helper/ocsp/client.go
    kind: method
