  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/ocsp/client.go
    - struct:9d7253948a82824679daf26deaa7fccc
    id: r.cache-concurrency
    level: MUST
    text: Client must guard its LRU two-queue OCSP response cache, keyed by certificate
      identity, with an RWMutex and must hold the CA root map and x509.CertPool so
      cached lookups stay safe under concurrent verification.
  - codeRefs:
    - function:3376a31a266cc7ff397b4ce00f65f5f6
    - struct:9d7253948a82824679daf26deaa7fccc
    id: r.client-construction
    level: MUST
    text: New must build and return a *Client from a logger factory function and an
      integer cache size, so callers control both the logger source and the response
      cache capacity.
  - codeRefs:
    - struct:1502cf82ddf1050a7e575c9bca401097
    - type_alias:ea227630d671f16d66b25c32a72387c2
    id: r.fail-open-policy
    level: SHOULD
    text: FailOpenMode must remain a distinct uint32 type so the client's behaviour
      when the OCSP responder is unreachable is an explicit, named policy value rather
      than a bare boolean or integer.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/ocsp/ocsp_test.go
    - method:a1ac36723bd07e66be7e1569756399b8
    id: r.http-seam
    level: SHOULD
    text: The package must keep its HTTP dependency behind the single-method clientInterface,
      whose Do takes a retryablehttp.Request and returns an *http.Response or error,
      so the transport is substitutable in tests.
  - codeRefs:
    - function:3376a31a266cc7ff397b4ce00f65f5f6
    - method:14470b7e3d46a4b1a136e9166e919851
    id: r.logger-access
    level: SHOULD
    text: Logger must return the hclog.Logger the client was constructed with, so
      callers and tests can observe the same logger instance the client uses.
  - codeRefs:
    - method:9d62cd6d2fec6a5b8b6df1802d5f4aaa
    id: r.response-cache-invalidation
    level: MUST
    text: ClearCache must purge every entry from the client's OCSP response cache,
      so a caller can force subsequent revocation checks to refetch from the responder.
  - codeRefs:
    - method:1aeb18c73040fcf1d3bd7c24977c3165
    - struct:1502cf82ddf1050a7e575c9bca401097
    id: r.revocation-status-chain
    level: MUST
    text: GetAllRevocationStatus must take a context, a verified certificate chain
      and a VerifyConfig, and return the ocspStatus for each certificate in the chain,
      or an error.
  - codeRefs:
    - method:820258d8c6442010c896c9f78025aabd
    - struct:1502cf82ddf1050a7e575c9bca401097
    id: r.revocation-status-single
    level: MUST
    text: GetRevocationStatus must take a context, a subject certificate, an issuer
      certificate and a VerifyConfig, and return the ocspStatus for that subject or
      an error.
  - codeRefs:
    - method:8e12b6a7ab468ddd6c97d8e76438b2e6
    - struct:1502cf82ddf1050a7e575c9bca401097
    id: r.transport-from-config
    level: MUST
    text: NewTransport must derive an *http.Transport from a VerifyConfig so the OCSP
      responder connection inherits the caller's verification settings.
  - codeRefs:
    - method:c28076bc66f812643875a6af5c48b2e6
    - struct:1502cf82ddf1050a7e575c9bca401097
    id: r.verify-leaf
    level: MUST
    text: VerifyLeafCertificate must check the revocation state of a single subject
      certificate against its issuer under the supplied VerifyConfig and report failure
      as an error.
  - codeRefs:
    - method:d4594d58e0a8f3a1bba0559752fcb60b
    - struct:1502cf82ddf1050a7e575c9bca401097
    id: r.verify-peer
    level: MUST
    text: VerifyPeerCertificate must accept the context, the verified chains produced
      during the TLS handshake and a VerifyConfig, and must judge revocation across
      those chains so it can be used directly as a TLS peer-verification callback.
