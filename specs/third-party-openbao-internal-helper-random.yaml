kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-random
  namespace: default
spec:
  intent: 'This context exists so callers can declare a password or random-string
    policy as HCL and get back an executable generator, and so the same package can
    be driven from the server''s logical API layer. It is a vendored copy of OpenBao''s
    internal/helper/random inside deno-kcp, so its public surface must keep the upstream
    shapes: ParsePolicy and ParsePolicyBytes for direct use, PolicyParser for callers
    that need a custom rule registry, the Rule interface plus CharsetRule for custom
    constraints, JSON serialization for storing policies, and HandleRandomAPI for
    the HTTP-facing endpoint.'
