    - file:third_party/openbao/internal/helper/random/string_generator_test.go
    id: r.behaviour-pinned-by-tests
    level: MUST
    text: 'The package''s behaviour must stay pinned by its table tests: parser_test.go
      covers ParsePolicy and PolicyParser.ParsePolicy including failures, rules_test.go
      covers CharsetRule and ParseCharset, serializing_test.go covers the JSON round
      trip and runes ordering, registry_test.go covers name-to-constructor lookup,
      and string_generator_test.go covers Generate and the JSON form of a generator.'
  - codeRefs:
    - function:c4b5f5a3889e1ec2e05ff25c971b1b37
    - method:2341e00b57531841a647bd5422db45e5
    - method:48a355dd1f9413870240d730867f64a5
    - method:a4c331df70b129bcf50ccf335af59e5f
    - method:ad9ab2c14df85914d8d9b69a60885bee
    - struct:88ddd19e7a92d20b4baeb08319dd30cf
    id: r.charset-rule
    level: MUST
    text: 'CharsetRule must satisfy Rule over a configured rune set and minimum length:
      Type must return its rule type name, Chars must expose the configured runes,
      MinLength must expose the configured minimum count, and Pass must report true
      only when the candidate value is drawn from the charset and meets the minimum
      length. ParseCharset must build such a rule from a decoded map[string]any, returning
      the rule or an error when the map is malformed.'
  - codeRefs:
    - function:7689ecd13f7905f0a597e578d1cf4d02
    - function:82a1a2a5bdf10e6a0f641b84bc861e7e
    - struct:843ef098b5721935b75f4ad9c3d485c5
    id: r.convenience-parse-entrypoints
    level: MUST
    text: ParsePolicy must build a PolicyParser whose RuleRegistry is a Registry holding
      defaultRuleNameMapping and delegate to PolicyParser.ParsePolicy, so a caller
      gets the default rule set without constructing a parser. ParsePolicyBytes must
      accept a []byte and delegate to ParsePolicy after converting it to a string.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/string_generator.go
    - method:6f856173083ecef6ca7a7f88d331e0a8
    - struct:4f34fce2ae663b6eeabe145d17902950
    id: r.generator-produces-valid-string
    level: MUST
    text: StringGenerator.Generate must take a context and an io.Reader source of
      randomness and return a generated string together with an error, drawing from
      the supplied reader rather than a package-global source so callers control entropy.
      Generation must honour the generator's configured length and reject candidates
      that fail its rules, and it must stop and return an error when the context is
      done or the reader fails.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/parser.go
    - method:3bbceea9fc1070a46f3c6c872071f738
    - struct:51cf85ee3939be72e2149d2915d4077b
    id: r.policyparser-hcl-decode
    level: MUST
    text: PolicyParser.ParsePolicy must accept an HCL string, decode it into a map[string]any,
      decode the top level into a StringGenerator with mapstructure using the stringToRunesFunc
      decode hook, extract the "rule" blocks with getMapSlice, parse them with parseRules
      against the parser's RuleRegistry, rebuild the StringGenerator with the decoded
      Length and the parsed Rules, run validateConfig on it, and return the generator
      or a wrapped error naming the failing stage.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/random_api.go
    - function:3f3e8dbed91b70337191211abb27d48c
    id: r.random-api-handler
    level: MUST
    text: HandleRandomAPI must serve the random endpoint from a framework.FieldData
      request, returning a logical.Response on success and an error when the request
      is malformed or generation fails, so the string generator is reachable from
      the server's logical API layer without that layer knowing about policies or
      rules.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/rules.go
    - interface:91060efc84605a1dcc13fac3225ac3cb
    - method:7791c4f5e9663e368d09393c766799b7
    - method:d63e6912f0d0b2ec36617d0deca1cb30
    id: r.rule-interface-contract
    level: MUST
    text: Rule must be the interface every constraint implements, with Pass reporting
      whether a candidate []rune value satisfies the rule and Type returning the rule's
      name as it appears in a policy. Every Rule implementation must be interchangeable
      through this interface so the generator can test a candidate against a heterogeneous
      rule list.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/registry.go
    - method:3bbceea9fc1070a46f3c6c872071f738
    - struct:843ef098b5721935b75f4ad9c3d485c5
    id: r.rule-registry-lookup
    level: MUST
    text: Registry must hold a Rules map from rule type name to a Rule constructor,
      and PolicyParser must resolve every rule block in the policy through that map,
      so that a policy naming an unregistered rule type fails at parse time instead
      of silently producing a generator with fewer constraints.
  - codeRefs:
    - file:third_party/openbao/internal/helper/random/serializing.go
    - method:52d709fdbcb3d5abff37bae4d4c491f7
    - method:568211382744bcfb5f1135a67e9dfc3e
    - method:72b586bc845844cdbd3aa5078d60105c
    - method:9922db73c27392b37ee0544ee75ff10d
    - method:c465fc94b0e91b28f163f676a57e35a3
    - method:d5223fc9f9ab59cab1707241025106b8
    - method:e91ab7a8656012a88fd93a6f6c734e5f
    id: r.rules-json-round-trip
    level: MUST
    text: serializableRules.MarshalJSON must encode a rule list to JSON and serializableRules.UnmarshalJSON
      must decode that encoding back into the same rules, so a parsed policy can be
      persisted and reloaded. The runes type must support that encoding by marshalling
      and unmarshalling a rune slice, and must supply Len, Less and Swap so the slice
      can be sorted through sort.Interface before comparison or encoding.
  upstream: self
