apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-forwarding
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so a request that arrives at one OpenBao node can be
    serialized, shipped to another node, and replayed there with no observable difference.
    The forwarding package is that wire contract: the protobuf types define what travels,
    GenerateForwardedRequest and ParseForwardedRequest define the two directions of
    the translation, and RPCResponseWriter defines the symmetric path back, letting
    a remote handler write an HTTP response that is later reconstructed on the origin
    node. It is vendored third-party code inside deno-kcp, so the spec records the
    behavior deno-kcp depends on rather than behavior deno-kcp owns.'
  requirements:
  - id: r.buf-closer
    level: MUST
    text: bufCloser MUST implement io.Closer over an embedded *bytes.Buffer, with
      Close resetting the buffer and returning a nil error, so a forwarded body can
      be closed by net/http without an error.
    codeRefs:
    - method:d39f028f6b6a3bd1bdb83d4d9bb1ec35
  - id: r.generate-forwarded-request
    level: MUST
    text: GenerateForwardedRequest MUST read the whole body of the incoming *http.Request
      and copy its method, host, remote address, the URL split into Scheme, Opaque,
      Host, Path, RawPath, RawQuery and Fragment, and each header key mapped to a
      HeaderEntry holding that key's values into a new Request; it MUST return the
      body read error rather than a partial Request when io.ReadAll fails.
    codeRefs:
    - function:b8568c161515348cfb8ef657bace5561
  - id: r.nil-safe-getters
    level: MUST
    text: 'Every field getter MUST tolerate a nil receiver, returning the field when
      the receiver is non-nil and the zero value otherwise: empty string for Method,
      Host, RemoteAddr and the URL and HeaderEntry string fields, a nil *URL, nil
      header-entry maps, nil byte slices, zero for StatusCode and LastRemoteWal, so
      callers can read a possibly-absent message without a nil check.'
    codeRefs:
    - method:05d9a1031d8bdf3f1a3fb793cd8acd22
    - method:0907af7baf3826385ff446e5982625a8
    - method:13a6261d028d646098b751550c2f615a
    - method:3d8b88f0b5f09ec6105369579c27b8c0
    - method:4cc358c15f9d99ada9addfb32ff450b9
    - method:70b5b987b382ff167cae83aa609119b7
    - method:855ca89d5a821c2733f018f4e9af0189
    - method:919e77e4f3f03f833306fb3b13dc271d
    - method:98491b48464b9a184d94381466d3c463
    - method:a06f0de6ab12dced65208463d457b269
    - method:a8eabbca4c18d736e03bd730006f71b8
    - method:afa4f96f5512e360b5dc5f7836318191
    - method:c04e90ea67db87e4bb4390ae9aea2960
    - method:ff876c606a24bfc76930f67aebd53591
  - id: r.parse-forwarded-request
    level: MUST
    text: ParseForwardedRequest MUST rebuild an *http.Request from a Request, wrapping
      the carried body bytes in a seekable reader (the body must be re-readable),
      reassembling the URL from the same seven fields, expanding HeaderEntries back
      into a net/http header map, and returning an error when the seekable reader
      or TLS certificate parsing fails.
    codeRefs:
    - function:082e936a1c00963155cc670a2fe46313
  - id: r.peer-certificates
    level: MUST
    text: When the source request has TLS peer certificates, GenerateForwardedRequest
      MUST store each certificate's raw DER bytes, and only when that list is non-empty;
      ParseForwardedRequest MUST reverse this by calling x509.ParseCertificate on
      each entry into a tls.ConnectionState, returning an error if any certificate
      fails to parse.
    codeRefs:
    - function:082e936a1c00963155cc670a2fe46313
    - function:b8568c161515348cfb8ef657bace5561
  - id: r.protobuf-messages
    level: MUST
    text: 'Request, URL, HeaderEntry and Response MUST each be a protobuf message:
      Reset MUST zero the receiver and store its message info, String MUST return
      the protobuf text form, ProtoMessage MUST be present, ProtoReflect MUST return
      a protoreflect.Message, and Descriptor MUST return the raw descriptor bytes
      and index path.'
    codeRefs:
    - method:061890f7b7cd27f07cea82ea910e9d65
    - method:15a22bfef564e01876fe7e0df8d28f38
    - method:166db75dde33ccd2881abb8315b2decb
    - method:2949e079d49b8b2b2bc96a567b5f0304
    - method:3a51396072f3854c4c686fd86b3ba62f
    - method:401c02c7f59adec9c29666d7af4cf15d
    - method:5f0d0ac0f7e5beee1ea6fbc18cce15be
    - method:72b312d54025afb1b09c9c3498b1c8bc
    - method:8fee0003c423b0aac55bff87ac6aa8b5
    - method:9976a1d446de524031e8eca4d9e9fd36
    - method:b30736d14e51cbc76996664ab1181e04
    - method:d4cf1e41267a5fd399e2a2dd53d237c7
  - id: r.response-shape
    level: MUST
    text: Response MUST carry the handler result across RPC as a status code, a body
      byte slice, a map of header name to HeaderEntry, and a last-remote-WAL counter,
      mirroring Request's method/url/header/body/host/remote-addr shape so both directions
      of the proxy share one encoding.
    codeRefs:
    - file:third_party/openbao/internal/helper/forwarding/types.pb.go
    - file:third_party/openbao/internal/helper/forwarding/util.go
  - id: r.round-trip-fidelity
    level: MUST
    text: Generating a forwarded request from a server-parsed http.Request and then
      parsing it back MUST yield a request identical in Method, RemoteAddr, Host,
      URL (deep equality), Header (deep equality) and body bytes; this equality is
      what util_test.go asserts and any change to either conversion function must
      keep it.
    codeRefs:
    - file:third_party/openbao/internal/helper/forwarding/util_test.go
    - function:082e936a1c00963155cc670a2fe46313
    - function:b8568c161515348cfb8ef657bace5561
  - id: r.rpc-response-writer-behavior
    level: MUST
    text: 'RPCResponseWriter MUST satisfy http.ResponseWriter while buffering instead
      of writing to a socket: Header returns the mutable header map, Write appends
      to the internal buffer and returns len(buf) with a nil error, WriteHeader records
      the given code, and StatusCode and Body expose the recorded status and buffered
      body so the response can be serialized into a Response message.'
    codeRefs:
    - method:1347bb480406752b342a722de55b02a2
    - method:247026ba0f0c70414219936367e326b5
    - method:38daa9079160fb9dcb07e2ea4c11a91c
    - method:4c3b777458d7c60a3de9241da96c5760
    - method:7c463df0e506427717da44c2b3fc585f
  - id: r.rpc-response-writer-init
    level: MUST
    text: NewRPCResponseWriter MUST return an initialized RPCResponseWriter with a
      live http.Header, an empty bytes.Buffer body, and a status code defaulting to
      200, so a handler that never calls WriteHeader still reports success.
    codeRefs:
    - function:0529bc4b1fcefbc7fdbc2346d8fd9213
