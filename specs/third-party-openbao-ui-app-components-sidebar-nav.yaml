kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-components-sidebar-nav
  namespace: default
spec:
  intent: This context exists so the specification records the exported surface and
    the delegation behavior of the sidebar cluster navigation component without re-reading
    the source. It gives downstream readers the class name and file location, the
    four injected service dependencies, and the fact that the only public member is
    a getter that proxies the cluster value from the currentCluster service. It is
    a documentation anchor for a vendored third-party file, not a specification of
    behavior that the repository itself implements.
  interfaces:
  - file: third_party/openbao/ui/app/components/sidebar/nav/cluster.js
    kind: class
    name: SidebarNavClusterComponent
    signature: class SidebarNavClusterComponent extends Component
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:f8da6f2e7636894abc232fd2194036a2
    - file:third_party/openbao/ui/app/components/sidebar/nav/cluster.js
    id: r.cluster-getter-delegates
    level: MUST
    text: The cluster getter must return the cluster property of the injected currentCluster
      service, reading it through on every access instead of caching or copying it,
      and must apply no transformation to the returned value.
  - codeRefs:
    - class:f8da6f2e7636894abc232fd2194036a2
    - file:third_party/openbao/ui/app/components/sidebar/nav/cluster.js
    id: r.exports-cluster-nav-component
    level: MUST
    text: The file third_party/openbao/ui/app/components/sidebar/nav/cluster.js must
      export exactly one default class, SidebarNavClusterComponent, which extends
      the Component base class imported from @glimmer/component.
  - codeRefs:
    - class:f8da6f2e7636894abc232fd2194036a2
    - file:third_party/openbao/ui/app/components/sidebar/nav/cluster.js
    id: r.injects-four-services
    level: MUST
    text: 'SidebarNavClusterComponent must declare four Ember service injections with
      the @service decorator: currentCluster, version, auth, and namespace. Only currentCluster
      is read inside the class body; version, auth, and namespace are declared and
      never used.'
  upstream: self
