apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: internal-denopod
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.api-v1alpha1
  - sc.deno-kcp
  arch:
    id: type.DenoRestartPolicy
    kind: node
    section: types
    form: map
    position: 2
    code:
    - file:internal/denopod/denopod.go
    node:
      code:
        default:
        - internal/denopod/denopod.go:Reconcile
        - internal/policyengine/policyengine.go:Reconcile
        type: api/v1alpha1/types_shared.go
      default: Always
      enum:
      - Always
      - OnFailure
      - Never
      held_by:
      - sc.kind.denopod.spec.restartPolicy
      - sc.kind.policyengine.spec.restartPolicy
codeRefIndex:
- file:internal/denopod/denopod.go denopod.go@internal/denopod/denopod.go
- file:internal/denopod/denopod_test.go denopod_test.go@internal/denopod/denopod_test.go
