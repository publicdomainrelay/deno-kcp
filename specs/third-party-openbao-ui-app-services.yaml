kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-services
  namespace: default
spec:
  intent: 'The context exists to describe the shared behavior that every route and
    component in the OpenBao UI inherits from injected services, so a reader can reason
    about path normalization, downloads, flash messaging, and the client-side query
    cache without reading each template or route. It documents the contract of the
    service layer: what each exported function and service method accepts, what side
    effects it has on the browser, and what state it keeps between queries.'
