apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: deploy-examples
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the deploy/examples directory and the test-side
    registry that describes it are specified as one unit rather than as an untracked
    pile of YAML. The examples are the smoke-test fixtures for every custom resource
    the operator ships, so the specification pins three things at once: which ten
    manifests are present, which Kind/resource/schema each one maps to, and the invariant
    that the on-disk listing and the in-code listing stay in step. Anything that adds,
    renames or removes an example breaks the pairing, and the requirements below make
    that breakage explicit instead of silent.'
  requirements:
  - id: r.deno-job-kind
    level: MUST
    text: deno-job.yaml instantiates Kind DenoJob, resource denojobs, checked against
      denojob-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/deno-job.yaml
  - id: r.deno-pod-kind
    level: MUST
    text: deno-pod.yaml instantiates Kind DenoPod, resource denopods, checked against
      denopod-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/deno-pod.yaml
  - id: r.deno-run-kind
    level: MUST
    text: deno-run.yaml instantiates Kind DenoRun, resource denoruns, checked against
      denorun-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/deno-run.yaml
  - id: r.disk-listing-yaml-only-sorted
    level: MUST
    text: exampleFilesOnDisk reads the local examples directory, skips subdirectories
      and every entry that is not a .yaml file, and returns the surviving names sorted.
  - id: r.examples-are-fixtures
    level: SHOULD
    text: Every manifest in deploy/examples is referenced by the integration registry,
      so the directory holds no manifest that the suite does not validate.
  - id: r.lookup-by-file-name
    level: MUST
    text: exampleByName returns the registry entry matching a given file name and
      reports false when no entry matches, so an unknown example is a lookup miss
      and not a zero value.
  - id: r.one-kind-many-examples
    level: SHOULD
    text: DenoPod is exercised by three separate manifests (deno-pod.yaml, native-fire-pod.yaml,
      openbao-tls-pod.yaml) so a single Kind is covered by more than one configuration.
    codeRefs:
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
  - id: r.openbao-kind
    level: MUST
    text: openbao.yaml instantiates Kind OpenBao, resource openbaos, checked against
      openbao-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/openbao.yaml
  - id: r.policy-workflow-run-kind
    level: MUST
    text: policy-workflow-run.yaml instantiates Kind PolicyWorkflowRun, resource policyworkflowruns,
      checked against policyworkflowrun-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/policy-workflow-run.yaml
  - id: r.policyengine-kind
    level: MUST
    text: policyengine.yaml instantiates Kind PolicyEngine, resource policyengines,
      checked against policyengine-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/policyengine.yaml
  - id: r.policyworkflowpod-kind
    level: MUST
    text: policyworkflowpod.yaml instantiates Kind PolicyWorkflowPod, resource policyworkflowpods,
      checked against policyworkflowpod-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/policyworkflowpod.yaml
  - id: r.registry-enumerates-examples
    level: MUST
    text: exampleFiles returns the registry of all ten examples in a fixed order,
      each entry carrying File, Kind, Resource and Schema.
  - id: r.registry-matches-disk
    level: MUST
    text: The names returned by exampleFilesOnDisk equal the set of File fields in
      exampleFiles, so adding or removing a manifest on disk without updating the
      registry fails the integration suite.
  - id: r.runtrigger-kind
    level: MUST
    text: runtrigger.yaml instantiates Kind RunTrigger, resource runtriggers, checked
      against runtrigger-apiresourceschema.yaml.
    codeRefs:
    - file:deploy/examples/runtrigger.yaml
  - id: r.second-deno-pod-kind
    level: MUST
    text: native-fire-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, demonstrating the same kind with a different
      runtime path.
    codeRefs:
    - file:deploy/examples/native-fire-pod.yaml
  - id: r.ten-example-manifests
    level: MUST
    text: 'deploy/examples contains exactly ten YAML manifests: deno-job.yaml, deno-pod.yaml,
      deno-run.yaml, native-fire-pod.yaml, openbao-tls-pod.yaml, openbao.yaml, policy-workflow-run.yaml,
      policyengine.yaml, policyworkflowpod.yaml and runtrigger.yaml.'
    codeRefs:
    - file:deploy/examples/deno-job.yaml
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/deno-run.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
    - file:deploy/examples/openbao.yaml
    - file:deploy/examples/policy-workflow-run.yaml
    - file:deploy/examples/policyengine.yaml
    - file:deploy/examples/policyworkflowpod.yaml
    - file:deploy/examples/runtrigger.yaml
  - id: r.third-deno-pod-kind
    level: MUST
    text: openbao-tls-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, showing the pod wired to OpenBao over
      TLS.
    codeRefs:
    - file:deploy/examples/openbao-tls-pod.yaml
  interfaces:
  - name: exampleByName
    kind: function
    signature: func exampleByName(file string) (example, bool)
    file: test/integration/examples.go
  - name: exampleFiles
    kind: function
    signature: func exampleFiles() []example
    file: test/integration/examples.go
  - name: exampleFilesOnDisk
    kind: function
    signature: func exampleFilesOnDisk() ([]string, error)
    file: test/integration/examples.go
  arch:
    id: tb.child-process
    kind: node
    section: system_contexts
    form: list
    parent: tb.workload
    slot: children[0]
    node:
      basis: example
      code:
      - deploy/examples/atproto/market/20-global-plc.yaml:Deno.execPath
      - deploy/examples/atproto/market/20-global-plc.yaml:childEnv
      - deploy/examples/atproto/market/30-relay-relay.yaml:Deno.execPath
      - deploy/examples/atproto/market/30-relay-relay.yaml:childEnv
      - deploy/examples/atproto/market/40-alice-pds.yaml:Deno.execPath
      - deploy/examples/atproto/market/40-alice-pds.yaml:childEnv
      enforced_by: []
      id: tb.child-process
      kind: process
      principals: {}
      runs_in: tb.host
codeRefIndex:
- file:deploy/examples/deno-job.yaml deno-job.yaml@deploy/examples/deno-job.yaml
- file:deploy/examples/deno-pod.yaml deno-pod.yaml@deploy/examples/deno-pod.yaml
- file:deploy/examples/deno-run.yaml deno-run.yaml@deploy/examples/deno-run.yaml
- file:deploy/examples/native-fire-pod.yaml native-fire-pod.yaml@deploy/examples/native-fire-pod.yaml
- file:deploy/examples/openbao-tls-pod.yaml openbao-tls-pod.yaml@deploy/examples/openbao-tls-pod.yaml
- file:deploy/examples/openbao.yaml openbao.yaml@deploy/examples/openbao.yaml
- file:deploy/examples/policy-workflow-run.yaml policy-workflow-run.yaml@deploy/examples/policy-workflow-run.yaml
- file:deploy/examples/policyengine.yaml policyengine.yaml@deploy/examples/policyengine.yaml
- file:deploy/examples/policyworkflowpod.yaml policyworkflowpod.yaml@deploy/examples/policyworkflowpod.yaml
- file:deploy/examples/runtrigger.yaml runtrigger.yaml@deploy/examples/runtrigger.yaml
