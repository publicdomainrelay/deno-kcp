kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-logical-ssh
  namespace: default
spec:
  intent: The context exists so the repository can carry a vendored copy of the OpenBao
    SSH secrets engine rather than depend on an external module. It defines the engine's
    factory entry point, its storage layout and migrations, and the wire-level path
    handlers that make up its API surface. The specification records which paths the
    engine must register, how CA and issuer key material is stored and imported, and
    how OTP credentials are salted and generated, so the vendored code can be reasoned
    about and modified in place.
  interfaces:
  - file: third_party/openbao/internal/builtin/logical/ssh/backend.go
    kind: function
    name: Backend
    signature: func Backend(conf *logical.BackendConfig) (*backend, error)
  - file: third_party/openbao/internal/builtin/logical/ssh/backend.go
    kind: function
    name: Factory
    signature: func Factory(ctx context.Context, conf *logical.BackendConfig) (logical.Backend,
      error)
  - file: third_party/openbao/internal/builtin/logical/ssh/path_creds_create.go
    kind: method
    name: backend.GenerateOTPCredential
    signature: func (b *backend) GenerateOTPCredential(ctx context.Context, req *logical.Request,
      sshOTPEntry *sshOTP) (string, error)
  - file: third_party/openbao/internal/builtin/logical/ssh/path_creds_create.go
    kind: method
    name: backend.GenerateSaltedOTP
    signature: func (b *backend) GenerateSaltedOTP(ctx context.Context) (string, string,
      error)
  - file: third_party/openbao/internal/builtin/logical/ssh/backend.go
    kind: method
    name: backend.Salt
    signature: func (b *backend) Salt(ctx context.Context) (*salt.Salt, error)
  - file: third_party/openbao/internal/builtin/logical/ssh/storage.go
    kind: method
    name: storageContext.ImportIssuer
    signature: func (s *storageContext) ImportIssuer(publicKey string, privateKey
      string, generatedKeyMaterial bool, issuerName string, setDefault bool) (*issuerEntry,
      bool, error)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/backend.go
    - function:037f39ba0ac57e174e05ae9374e76e10
    id: r.backend-construction
    level: MUST
    text: Backend builds the SSH secrets engine from the config, returning the concrete
      *backend, and that backend registers the engine's path set and its storage helpers.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/backend_test.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_ca_test.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_issuers_test.go
    id: r.backend-tests
    level: SHOULD
    text: Backend construction and the CA and issuer configuration paths stay covered
      by backend_test.go, path_config_ca_test.go, and path_config_issuers_test.go.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_ca.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_issuers.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issuers.go
    - file:third_party/openbao/internal/builtin/logical/ssh/storage.go
    id: r.ca-and-issuer-storage
    level: MUST
    text: CA and issuer key material is read and written through the storage layer,
      which owns the entry types and keys used by the config/ca, config/issuers, and
      issuers paths.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_cleanup_dynamic_host_keys.go
    id: r.dynamic-host-key-cleanup
    level: MUST
    text: The cleanup dynamic host keys path removes stored dynamic host key entries
      that are no longer valid.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/backend.go
    - function:c2b7d0361f5eafc6475122f4c56203c6
    id: r.factory-entrypoint
    level: MUST
    text: Factory accepts a context and a logical.BackendConfig, constructs the SSH
      backend through Backend, calls Setup on it with the same config, and returns
      the resulting logical.Backend or the setup error.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/storage.go
    - method:6cded66dc09b14f10f6cdf87c2bfbb94
    id: r.import-issuer
    level: MUST
    text: storageContext.ImportIssuer takes a public key, a private key, a flag marking
      whether the key material was generated rather than supplied, an issuer name,
      and a set-default flag; it stores the issuer, reports whether the stored issuer
      became the default, and returns the resulting issuerEntry or an error.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_creds_create.go
    - method:dd56bad67918a3338d35147c3aaac35d
    - method:fe22f086c35e63161dcc4274917101f5
    id: r.otp-generation
    level: MUST
    text: backend.GenerateSaltedOTP returns a generated OTP together with its salted
      form, and backend.GenerateOTPCredential takes the logical request and the sshOTP
      entry and returns the OTP credential string that is handed back to the caller.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_creds_create.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_fetch.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_lookup.go
    - file:third_party/openbao/internal/builtin/logical/ssh/secret_otp.go
    id: r.otp-lifecycle
    level: MUST
    text: 'The OTP lifecycle is split across creds/create, secret_otp, lookup, and
      fetch: creation issues an OTP credential and stores it, lookup reads the stored
      entry by IP, fetch returns stored credentials, and secret_otp is the secret
      type backing an issued OTP.'
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_cleanup_dynamic_host_keys.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_ca.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_issuers.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_zeroaddress.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_creds_create.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_fetch.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issue.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issue_sign.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issuers.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_lookup.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_roles.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_sign.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_verify.go
    - file:third_party/openbao/internal/builtin/logical/ssh/secret_otp.go
    id: r.path-registration
    level: MUST
    text: 'The backend must register the handlers implemented across the path files:
      CA configuration, issuer configuration and issuer management, zero-address configuration,
      roles, issue, sign, verify, credentials creation, OTP secret, lookup, fetch,
      and dynamic host key cleanup.'
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/fields.go
    id: r.request-fields
    level: MUST
    text: Path request and response schemas are declared centrally in fields.go and
      shared by the issue, sign, creds, roles, and configuration handlers instead
      of being declared per handler.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_config_zeroaddress.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_roles.go
    id: r.roles-and-zeroaddress
    level: MUST
    text: Roles are stored and validated by path_roles.go, and path_config_zeroaddress.go
      binds the role used when a request arrives from the zero address, so OTP issuance
      can resolve a role for that case.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/backend.go
    - method:b711565dc7aa5d7abd2bc98af43d3910
    id: r.salt-accessor
    level: MUST
    text: backend.Salt returns the salt.Salt bound to the context, and is the salting
      function used by the OTP credential flow.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/util.go
    id: r.shared-helpers
    level: SHOULD
    text: Cryptographic and conversion helpers shared by the path handlers live in
      util.go rather than being duplicated in each handler.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issue.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_issue_sign.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_sign.go
    - file:third_party/openbao/internal/builtin/logical/ssh/path_verify.go
    id: r.sign-issue-verify
    level: MUST
    text: The issue, sign, and verify paths sign a caller-supplied public key with
      the configured CA and validate a presented certificate, sharing the signing
      logic in path_issue_sign.go.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/ssh/storage_migrations.go
    - file:third_party/openbao/internal/builtin/logical/ssh/storage_migrations_test.go
    id: r.storage-migrations
    level: MUST
    text: Storage migrations upgrade data written by earlier versions of the engine
      into the current layout, and are covered by storage_migrations_test.go.
  upstream: self
