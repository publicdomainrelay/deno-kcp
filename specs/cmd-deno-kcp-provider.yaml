apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: cmd-deno-kcp-provider
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.deno-kcp
  - sc.internal-provider
  intent: 'This context exists to pin down the provider''s process boundary: the single
    main that turns operator input (flags and environment) into the registry, engine
    runner, pod runner and provider the controller needs, and the failure and shutdown
    behaviour around them. Everything else in the repository assumes a configured
    provider already exists; this context is what makes one.'
  requirements:
  - id: r.bundled-actions-default
    level: MUST
    text: When --bundled-actions-dir is empty, main derives it as the policy engine
      directory joined with "/../policies/gha-lite/bundled-actions" rather than leaving
      it unset.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.ca-data-fallback
    level: MUST
    text: caData returns the REST config's CAData when it is non-empty, otherwise
      the contents of CAFile when that file reads successfully, otherwise nil.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.config-surface
    level: MUST
    text: 'Every setting is a flag whose default is the environment variable and then
      a fixed fallback, in the order flag, then environment, then default: --kubeconfig
      (KUBECONFIG, empty), --host (KCP_HOST, empty), --runs-dir (RUNS_DIR, "runs"),
      --policy-engine-dir (POLICY_ENGINE_DIR, "../policy-engine/lib/policy-engine-server-gha-lite"),
      --bundled-actions-dir (BUNDLED_ACTIONS_DIR, empty), --deno-bin (DENO_BIN, "deno"),
      --pod-timeout (no environment variable, 5m), --token-ttl (no environment variable,
      1h), --metrics-listen (METRICS_LISTEN, empty, disabling the endpoint), --run-ttl-seconds
      (RUN_TTL_SECONDS, 3600, negative disables), --write-status (no environment variable,
      true), --service-domain (KCP_SERVICE_DOMAIN, "kcp.local"), --openbao-addr (OPENBAO_ADDR,
      empty), --openbao-token (OPENBAO_TOKEN, empty), --openbao-ca-cert (OPENBAO_CACERT,
      empty), --openbao-mount (OPENBAO_MOUNT, "pki"), --openbao-role (OPENBAO_ROLE,
      "denopod"), --openbao-intermediate-ttl (OPENBAO_INTERMEDIATE_TTL, "43800h")
      and --openbao-leaf-ttl (OPENBAO_LEAF_TTL, "720h").'
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.construction-order
    level: MUST
    text: main builds the registry with provider.NewRegistry, the engine runner with
      execrunner.NewEngine, the exec pod runner with execrunner.NewPod, and then the
      provider with provider.New, passing the registry as runtime and minter and the
      pod and engine runners in; each failure logs its own message ("building registry",
      "building engine runner", "building exec pod runner", "building provider") and
      exits with status 1.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.deferred-trust-bundle
    level: MUST
    text: The exec pod runner's TrustBundle is a closure that returns caData(restCfg)
      while the provider is still nil and providerImpl.TrustBundle() once it exists,
      because the OpenBao root CA does not exist until a namespace has asked for a
      certificate and the provider that generates it is built from this runner.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.disable-watch-list-client
    level: MUST
    text: main sets KUBE_FEATURE_WatchListClient to false before any client-go call,
      because kcp's APIExport virtual workspace sends no bookmark and an informer's
      initial list would otherwise never complete, leaving a provider that looks healthy
      and reconciles nothing.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.flag-env-fallback
    level: MUST
    text: envOr answers the environment variable when it is non-empty and the fallback
      otherwise, and envOrInt64 answers the parsed base-10 64-bit value when the variable
      is non-empty and parses, otherwise the fallback; both feed flag defaults so
      an unset or unparseable variable never overrides the compiled-in value.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.negative-run-ttl-disables
    level: MUST
    text: defaultRunTTL answers nil for a negative seconds value, which disables the
      default run TTL, and otherwise returns a pointer to a copy of the value, which
      main passes on as DefaultRunTTLSeconds.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.openbao-ca-read-nonfatal
    level: SHOULD
    text: readIfSet returns nil for an empty path, and for a path it cannot read it
      logs a warning naming the path and returns nil rather than failing startup,
      so a mistyped CA path surfaces as failed TLS verification instead of a provider
      that will not start.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.require-kubeconfig
    level: MUST
    text: 'main writes "deno-kcp-provider: --kubeconfig or KUBECONFIG is required"
      to stderr and exits with status 2 when the kubeconfig setting is empty.'
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.rest-config-and-host
    level: MUST
    text: 'main builds the REST config with clientcmd.BuildConfigFromFlags from the
      kubeconfig path, exits 1 with a logged "loading kubeconfig" error when that
      fails, and passes the same host to the registry and the provider: the kubeconfig''s
      server unless --host is set, in which case the flag wins.'
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.run-until-signal
    level: MUST
    text: main runs providerImpl.Run under a context cancelled by SIGINT or SIGTERM
      and exits with status 1 after logging "provider stopped" if Run returns an error.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.single-binary-entrypoint
    level: MUST
    text: The package provides one main function that acts as the provider process
      entrypoint, declares a config struct for its settings, and holds no reconcile
      logic; the remaining behaviour lives in the helpers envOr, envOrInt64, defaultRunTTL,
      caData and readIfSet.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  arch:
    id: ov.provider-flags
    kind: node
    section: system_contexts
    form: list
    parent: sc.deno-kcp-provider
    slot: overlay[0]
    code:
    - file:cmd/deno-kcp-provider/main.go
    node:
      data:
        flags:
          bundled-actions-dir:
            binds: up.gha-lite-bundled-actions
            env: BUNDLED_ACTIONS_DIR
          deno-bin:
            default: deno
            env: DENO_BIN
          host:
            env: KCP_HOST
          kubeconfig:
            env: KUBECONFIG
          metrics-listen:
            env: METRICS_LISTEN
          openbao-addr:
            env: OPENBAO_ADDR
          openbao-ca-cert:
            env: OPENBAO_CACERT
          openbao-intermediate-ttl:
            default: 43800h
            env: OPENBAO_INTERMEDIATE_TTL
          openbao-leaf-ttl:
            default: 720h
            env: OPENBAO_LEAF_TTL
          openbao-mount:
            default: pki
            env: OPENBAO_MOUNT
          openbao-role:
            default: denopod
            env: OPENBAO_ROLE
          openbao-token:
            env: OPENBAO_TOKEN
            secret: true
          pod-timeout:
            default: 5m
          policy-engine-dir:
            binds: up.policy-engine
            default: ../policy-engine/lib/policy-engine-server-gha-lite
            env: POLICY_ENGINE_DIR
          run-ttl-seconds:
            default: 3600
            env: RUN_TTL_SECONDS
            negative: disables
          runs-dir:
            default: runs
            env: RUNS_DIR
          service-domain:
            default: kcp.local
            env: KCP_SERVICE_DOMAIN
          token-ttl:
            default: 1h
          write-status:
            default: true
        precedence:
        - flag
        - env
        - default
      id: ov.provider-flags
      source: cmd/deno-kcp-provider/main.go
codeRefIndex:
- file:cmd/deno-kcp-provider/main.go main.go@cmd/deno-kcp-provider/main.go
