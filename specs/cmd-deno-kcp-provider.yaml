apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: cmd-deno-kcp-provider
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.internal-provider
  intent: 'This context exists to be the process entrypoint for the deno-kcp provider
    controller. Everything it does is wiring: turn command line flags and environment
    variables into a config, refuse to start without a kubeconfig, build the registry,
    engine runner, pod runner and provider in the order their dependencies require,
    and then run the provider until a termination signal arrives. The two non-obvious
    behaviours it encodes are the KUBE_FEATURE_WatchListClient opt-out, which stops
    a streaming list from hanging when kcp''s APIExport virtual workspace sends no
    bookmark, and the deferred TrustBundle closure, which exists because the OpenBao
    root CA does not exist until a namespace has requested a certificate and the provider
    that generates it is built from the runner being constructed. It is deliberately
    thin, holding no reconcile logic of its own.'
  requirements:
  - id: r.bundled-actions-default
    level: MUST
    text: When --bundled-actions-dir is empty, main derives it as the policy engine
      directory joined with /../policies/gha-lite/bundled-actions.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.ca-data-fallback
    level: MUST
    text: caData returns the rest config's CAData when present, otherwise the contents
      of CAFile when it can be read, otherwise nil.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.construction-order
    level: MUST
    text: main builds the registry, the engine runner, the exec pod runner, and then
      the provider, exiting with status 1 and a logged error when any construction
      fails.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.deferred-trust-bundle
    level: MUST
    text: The exec pod runner's TrustBundle is a closure that returns the kubeconfig
      CA data from caData while the provider is nil and providerImpl.TrustBundle once
      the provider exists, because the OpenBao root CA does not exist before a namespace
      requests a certificate.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.disable-watch-list-client
    level: MUST
    text: main sets KUBE_FEATURE_WatchListClient to false before any client-go call,
      because kcp's APIExport virtual workspace sends no bookmark and an informer's
      initial list would otherwise never complete.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.flag-env-fallback
    level: MUST
    text: Every configuration value comes from a flag whose default is the environment
      variable, and the environment is read through envOr for strings and envOrInt64
      for integers, which ignore an empty or unparseable variable and use the fallback.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.host-override
    level: MUST
    text: The host passed to the registry and the provider is the kubeconfig's server
      unless --host is set, in which case the flag wins.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.negative-run-ttl-disables
    level: MUST
    text: defaultRunTTL answers nil for a negative seconds value, which disables the
      default run TTL, and otherwise returns a pointer to the value.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.openbao-ca-read-nonfatal
    level: SHOULD
    text: readIfSet returns nil and logs a warning, rather than failing startup, when
      the PEM file named by the OpenBao CA flag cannot be read, so an https vault
      surfaces as a failed TLS verification instead of a provider that will not start.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.require-kubeconfig
    level: MUST
    text: main exits with status 2 and a message on stderr when neither --kubeconfig
      nor KUBECONFIG is set.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.run-until-signal
    level: MUST
    text: main runs providerImpl.Run under a context cancelled by SIGINT or SIGTERM,
      and exits with status 1 and a logged error if Run returns an error.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  - id: r.single-binary-entrypoint
    level: MUST
    text: The package provides a main function that acts as the provider process entrypoint
      and holds no reconcile logic.
    codeRefs:
    - file:cmd/deno-kcp-provider/main.go
  arch:
    id: ov.provider-flags
    kind: node
    section: system_contexts
    form: list
    parent: sc.deno-kcp-provider
    slot: overlay[0]
    code:
    - file:cmd/deno-kcp-provider/main.go
    node:
      data:
        flags:
          bundled-actions-dir:
            binds: up.gha-lite-bundled-actions
            env: BUNDLED_ACTIONS_DIR
          deno-bin:
            default: deno
            env: DENO_BIN
          host:
            env: KCP_HOST
          kubeconfig:
            env: KUBECONFIG
          metrics-listen:
            env: METRICS_LISTEN
          openbao-addr:
            env: OPENBAO_ADDR
          openbao-ca-cert:
            env: OPENBAO_CACERT
          openbao-intermediate-ttl:
            default: 43800h
            env: OPENBAO_INTERMEDIATE_TTL
          openbao-leaf-ttl:
            default: 720h
            env: OPENBAO_LEAF_TTL
          openbao-mount:
            default: pki
            env: OPENBAO_MOUNT
          openbao-role:
            default: denopod
            env: OPENBAO_ROLE
          openbao-token:
            env: OPENBAO_TOKEN
            secret: true
          pod-timeout:
            default: 5m
          policy-engine-dir:
            binds: up.policy-engine
            default: ../policy-engine/lib/policy-engine-server-gha-lite
            env: POLICY_ENGINE_DIR
          run-ttl-seconds:
            default: 3600
            env: RUN_TTL_SECONDS
            negative: disables
          runs-dir:
            default: runs
            env: RUNS_DIR
          service-domain:
            default: kcp.local
            env: KCP_SERVICE_DOMAIN
          token-ttl:
            default: 1h
          write-status:
            default: true
        precedence:
        - flag
        - env
        - default
      id: ov.provider-flags
      source: cmd/deno-kcp-provider/main.go
codeRefIndex:
- file:cmd/deno-kcp-provider/main.go main.go@cmd/deno-kcp-provider/main.go
