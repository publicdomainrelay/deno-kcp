    id: r.config-parsing
    level: MUST
    text: 'The config parsers turn an HCL ast.ObjectList into typed configs: ParseOuterConfig
      returns OuterConfig values for a named outer block type, ParseRequestConfig
      returns RequestConfig values carrying operation, path, token, data, headers,
      when and allow_failure, ParseInputConfig returns one InputConfig, ParseFieldSchemaConfig
      returns FieldSchemaConfig values, and ParseOutputConfig returns one OutputConfig.'
