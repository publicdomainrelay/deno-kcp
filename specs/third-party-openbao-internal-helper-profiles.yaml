apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-profiles
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The package exists so OpenBao can describe a request/response profile in
    HCL and evaluate it with pluggable data sources. The CEL source exposes `requests`,
    `responses` and `input` variables only when the matching source is present, so
    a profile can reference request and response data without failing at compile time
    when that data is unavailable. The engine evaluates the profile against a recorded
    `EvaluationHistory`, produces a `logical.Response`, and can dump a debug map.
    Sources are decoupled behind the `Source` interface, so each backend (CEL expression,
    template, environment variable, file, request, response, plugin input) is registered
    by name and built lazily.
  requirements:
  - id: r.cel-evaluate
    level: MUST
    text: CELSource validates its expression against the environment options, evaluates
      the compiled program on Evaluate and returns the resulting value, and Close
      is a no-op that returns nil.
    codeRefs:
    - file:third_party/openbao/internal/helper/profiles/cel_source.go
    - method:5796a9c7f5bc2d6c7089d0fe1e21eaa3
    - method:58e91ee2bfcb2a743ceb4b1c85e25626
    - method:d567f11e618ea695527c8d4ba809d57a
  - id: r.cel-variable-gating
    level: MUST
    text: CELSourceBuilder adds the CEL variable `requests` only when HasRequestSource
      is true, `responses` only when HasResponseSource is true, and `input` only when
      HasInputSource is true, so a CEL profile cannot reference a source the engine
      does not carry.
    codeRefs:
    - function:202569d4c2113ce28fb68010ce7a9d84
    - function:58c56653fc17a408d5bdbef4fdecea3b
    - function:7440863d3b705c5c7b02d3c7b773d01d
    - function:cdbb9695d2eaa3b214f1af0aaf6298df
  - id: r.config-parsing
    level: MUST
    text: 'The config parsers turn an HCL ast.ObjectList into typed configs: ParseOuterConfig
      returns OuterConfig values for a named outer block type, ParseRequestConfig
      returns RequestConfig values carrying operation, path, token, data, headers,
      when and allow_failure, ParseInputConfig returns one InputConfig, ParseFieldSchemaConfig
      returns FieldSchemaConfig values, and ParseOutputConfig returns one OutputConfig.'
    codeRefs:
    - file:third_party/openbao/internal/helper/profiles/config.go
    - function:2b5ce51dd66011a62fca2a66cb5e4674
    - function:39f3d1626f87193fde2cb76639343afa
    - function:9d316051199ccc5ff72bd1b16f009389
    - function:db601ac1cfd1d383939a33a98ca0a788
    - function:e81776a949f43073d6248bcb022b06fd
  - id: r.create-outer-config
    level: MUST
    text: CreateOuterConfig builds a slice of OuterConfig from a slice of RequestConfig,
      assigning the requests to the outer blocks the engine will evaluate.
    codeRefs:
    - function:543faf615015d36261bf8d0eda0b0e4c
    - struct:03bfea6fb1f372aabed584dd4478af8d
    - struct:40e139a8c1e23879be4183fbe96911c2
  - id: r.engine-construction
    level: MUST
    text: NewEngine builds a ProfileEngine by applying each option function in order
      and returns an error when construction fails; the resulting engine carries the
      profile, source-builder registry and configuration set by the options.
    codeRefs:
    - file:third_party/openbao/internal/helper/profiles/profiles.go
    - function:155d2435b3754382c8642401ed9d149a
    - struct:71b3d9ae9c979326d66c78de0fa770d0
  - id: r.engine-evaluate
    level: MUST
    text: ProfileEngine.Evaluate walks the configured profile and evaluates each outer
      block's requests, EvaluateResponse returns the resulting logical.Response or
      an error, and Debug returns a map of internal evaluation state for inspection.
    codeRefs:
    - method:2d44bebf34957ec9a296259dca154b63
    - method:8aef40d0037c066b58cbf6229ca2a07b
    - method:ecb95cbfe00ccb6a3eb1b0a7a4dd2600
    - struct:71b3d9ae9c979326d66c78de0fa770d0
  - id: r.engine-options
    level: MUST
    text: 'The remaining option functions configure the engine before evaluation:
      WithProfile sets the outer configs, WithOuterBlockName sets the block name used
      in error paths, WithDefaultToken sets the token for generated requests, WithRequestHandler
      installs the RequestHandlerFunc used to dispatch requests, WithLogger attaches
      an hclog.Logger, WithOutput attaches the OutputConfig, and WithRequestIdentifierPrefix
      sets the prefix for request identifiers.'
    codeRefs:
    - function:3f9fe99fb6d8427b2e3fe9bdfecd48ed
    - function:6268fe8d5d14693c2294fb531b923dbe
    - function:8f91cf64a50ef678a372b4b3141f3144
    - function:a4edad98ad1fbf739964c91ed23e4867
    - function:bc10320ce81be88e0ad986fdbb06a30b
    - function:e36f098ae160e2f79398e7b87cc36cd5
    - function:eaaaead63a5f93196c1303b471fc1764
    - type_alias:669d78e644c095dd23c347c0f24611cb
  - id: r.env-file-template-sources
    level: MUST
    text: EnvSource resolves its value from the environment, FileSource reads its
      value from a file path, and TemplateSource renders a template against the evaluation
      history; each validates its inputs first and Close returns nil for all three.
    codeRefs:
    - method:1c70ab6cce21359494fc05457b665b25
    - method:5ab8b2184a331f98bc67933f3f98bb8d
    - method:77d1e0bee40987e54c50e14884728262
    - struct:72fce4c115bf43ae2d07e64886a920b5
    - struct:811804c8b46c320e3a2afd0ade984b10
    - struct:a15daa6fb68a51426d73a1e79276e136
  - id: r.field-schema
    level: MUST
    text: FieldSchemaConfig.ToSchema converts a parsed field schema config into a
      framework.FieldSchema used by the plugin input surface.
    codeRefs:
    - method:4d0a3169e02d24e4605ee0ffdefdbb5e
    - struct:e18ee562bfd6799920b3c28e964d9b6e
  - id: r.history
    level: MUST
    text: EvaluationHistory records a request or response under an outer block name
      and request block name, accepting either a logical.Request/logical.Response
      or a raw map, and the getters return the stored map or resolve a field selector
      path against it, erroring when the entry is absent.
    codeRefs:
    - file:third_party/openbao/internal/helper/profiles/history.go
    - method:2cc50e89ac0dd5fe1ee663cb7db5d327
    - method:331aa1d241f627156569bc74b121ad5c
    - method:5f2e0cb3eeb47941ff720ffe8ab1d989
    - method:806c7a4822b7810693d3a192e9659f47
    - method:93ba3188b169e946727981f39d888ace
    - method:9753974bddaa559e0268a95fb3693a8e
    - method:e19aeda13f48e9d609519161c9d14960
    - method:f0c8ca777a97c3e187690e1c463238d5
    - struct:1f6ed880a611960bfd876db94e3ffd50
  - id: r.input-source
    level: MUST
    text: WithInputSource binds an InputConfig together with the live logical.Request
      and framework.FieldData into an engine option, HasInputSource reports whether
      an input source is registered, and InputSource.Evaluate reads the input values
      from the evaluation history.
    codeRefs:
    - function:359ea69acfc44b6fc044a6256a377f19
    - function:cdbb9695d2eaa3b214f1af0aaf6298df
    - method:369a652fcfe948c5a75410ba9dcc3f90
    - method:7bb3e7df2c0cda77b4af343478036ffe
    - struct:4c1e04c79ed4b6912c79840be3ea9cc3
  - id: r.request-response-sources
    level: MUST
    text: RequestSource and ResponseSource read the recorded request or response for
      the current outer and request block out of the EvaluationHistory, and HasRequestSource
      and HasResponseSource report whether the engine carries each source so CEL variables
      and validation can be gated on them.
    codeRefs:
    - function:202569d4c2113ce28fb68010ce7a9d84
    - function:449b6e660ac993d089ec2f52cea30801
    - function:49a7a08966690cc4a81a852f5a5e8c15
    - function:7440863d3b705c5c7b02d3c7b773d01d
    - method:ac1a875ee094af1b513ddd3414cc8569
    - method:df271b3a7f7ccd3ba8392be5c155c37a
  - id: r.source-builder-registry
    level: MUST
    text: 'WithSourceBuilder registers a SourceBuilder under a name in the engine''s
      sourceBuilders map, and each dedicated option registers its builder under a
      fixed key: "cel", "env", "file", "request", "response" and "template".'
    codeRefs:
    - function:1a0c90b0e69fbddeb3383ea2b3a276ef
    - function:22db8d00156e8649ca124a8b6a112694
    - function:3b585a3d10a6f512523323a39ddcb11f
    - function:7dfb6c1d2bdf0f29fe730a5dc3eca6f0
    - function:87be9e15c14e4388c9147a4c9fd1b95b
    - function:a729a90be183ca380faf1cfa1ee10468
    - function:fbf8a60e633396798ffd2c0797c4a5fe
  - id: r.source-close
    level: MUST
    text: Closing a source releases anything it opened and returns an error on failure;
      the stateless sources (CEL, environment, file, request, response, template)
      return nil, so an engine can always tear its sources down after evaluation.
    codeRefs:
    - method:15f86f5c1b4b8b6c229169dff63be267
    - method:235d32510a4a853ef6d8f5c00ec33af9
    - method:40be7f9be0a95531e1d621b331ddf001
    - method:58e91ee2bfcb2a743ceb4b1c85e25626
    - method:6064f552e1cd175b7f6b41e3e7f85331
    - method:ef80a98d503316c6d0e367e93b53609b
    - method:faae5160e965467d292a3e407f940fbb
  - id: r.source-interface
    level: MUST
    text: Every source implements the Source interface with Validate returning request
      and response dependency names, Evaluate returning a value from the evaluation
      history, and Close releasing resources; every SourceBuilder returns a Source
      built from the engine and the block's field map.
    codeRefs:
    - interface:60595c584e4aa69f24c5d82c63983159
    - method:2026bd9d6124b25a0bc1647c7a559aa9
    - method:7d662016928418f81f7fef4cb677f2fb
    - method:9c6331c1c669948bcc7a9a59bcd2c01d
    - type_alias:352639b417bf65bd1a4b476947b6e9e1
  - id: r.validate-unused
    level: MUST
    text: Each config type reports unrecognised HCL keys at a given path through ValidateUnused,
      and OuterConfig.ValidateUnused additionally recurses into each of its requests
      so unused keys in a nested request block are reported.
    codeRefs:
    - method:92167f01c76019391397338b9fad330b
    - method:9777bb1614ab1257bad5214c0e1bdfcb
    - method:afb2f3ad4d4725c3cc0e399141730f63
    - method:b66c002243e2a09d77510306b0ef7bd2
    - method:f7424d95015b30a99100eb3f61d6c6af
