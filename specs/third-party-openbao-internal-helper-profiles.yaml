    id: r.cel-variable-gating
    level: MUST
    text: CELSourceBuilder adds the CEL variable `requests` only when HasRequestSource
      is true, `responses` only when HasResponseSource is true, and `input` only when
      HasInputSource is true, so a CEL profile cannot reference a source the engine
      does not carry.
