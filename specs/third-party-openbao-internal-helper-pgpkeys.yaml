kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-pgpkeys
  namespace: default
spec:
  intent: 'This context exists so command entrypoints across OpenBao can accept PGP
    recipients uniformly: operators name key files or keybase users on the command
    line, the package resolves them to entities, encrypts each share to its recipient,
    and reports fingerprints that operators verify out of band. It is a third-party
    vendored dependency under third_party/openbao, described so the surrounding repository
    can reason about its contract without re-reading the upstream source.'
  interfaces:
  - file: third_party/openbao/internal/helper/pgpkeys/encrypt_decrypt.go
    kind: function
    name: DecryptBytes
    signature: func DecryptBytes(encodedCrypt, privKey string) (*bytes.Buffer, error)
  - file: third_party/openbao/internal/helper/pgpkeys/encrypt_decrypt.go
    kind: function
    name: EncryptShares
    signature: func EncryptShares(input [][]byte, pgpKeys []string) ([]string, [][]byte,
      error)
  - file: third_party/openbao/internal/helper/pgpkeys/keybase.go
    kind: function
    name: FetchKeybasePubkeys
    signature: func FetchKeybasePubkeys(input []string) (map[string]string, error)
  - file: third_party/openbao/internal/helper/pgpkeys/encrypt_decrypt.go
    kind: function
    name: GetEntities
    signature: func GetEntities(pgpKeys []string) ([]*openpgp.Entity, error)
  - file: third_party/openbao/internal/helper/pgpkeys/encrypt_decrypt.go
    kind: function
    name: GetFingerprints
    signature: func GetFingerprints(pgpKeys []string, entities []*openpgp.Entity)
      ([]string, error)
  - file: third_party/openbao/internal/helper/pgpkeys/flag.go
