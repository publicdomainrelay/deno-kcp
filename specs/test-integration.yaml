apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test-integration
  namespace: default
spec:
  repository: deno-kcp
  upstream: up.kcp
  overlay:
  - ov.runtime-rbac
  - ov.test-cluster
  - ov.test-integration-install
  - sc.demo.native-fire
  - sc.demo.on-policy-allow
  - sc.demo.open-policy-pod
  - sc.demo.policy-engine
  - sc.example.deno-job
  - sc.example.deno-pod
  - sc.example.deno-run
  - sc.example.openbao
  - sc.example.openbao-tls-pod
  - sc.internal-baoembed-cmd-baoembed
  - sc.test.direct-run
  orchestrator: orch.test-integration
  dependsOn:
  - sc.api-v1alpha1
  - sc.internal-livegate
  - sc.internal-provider
  intent: This context exists to hold the one test package that proves deno-kcp works
    against real infrastructure and against the checked-in examples. It separates
    what can be verified from the repository alone (offline_test.go, examples.go)
    from what needs a running kcp, kine, deno and policy-engine (live_test.go, fixture_test.go)
    from what additionally needs the pinned OpenBao (bao_test.go, openbao_live_test.go),
    so the cheap checks run everywhere and the expensive ones are gated behind explicit
    opt-in. The fixture layer exists so that every live test describes intent in terms
    of typed Kubernetes objects and named expectations rather than raw HTTP, and so
    the OpenBao version certificates are issued by is the one the repository pins,
    never whatever binary happens to be on PATH. The example registry covers every
    kcp-kind manifest the repository ships, including the atproto market manifests
    under deploy/examples/atproto/market, so the offline tier decodes and schema-fits
    them with no cluster.
  requirements:
  - id: r.deno-binaries-are-located-by-name-or-env
    level: SHOULD
    text: Required binaries are looked up by name and may be overridden through the
      environment (requireBinary, envOr); the policy-engine and bundled-actions directories
      honour POLICY_ENGINE_DIR and BUNDLED_ACTIONS_DIR.
    codeRefs:
    - file:test/integration/fixture_test.go
  - id: r.embedded-bao-runs-in-development-mode
    level: MUST
    text: startEmbeddedBao runs the pinned server in development mode so the hierarchy
      under test is namespace and PKI behaviour, not storage or seal behaviour; startEmbeddedBaoTLS
      also returns the generated CA so a client can verify it.
    codeRefs:
    - file:test/integration/bao_test.go
  - id: r.every-example-decodes
    level: MUST
    text: Every example file loads from disk and decodes into its declared kind through
      decodeExample without error.
    codeRefs:
    - file:test/integration/examples.go
    - file:test/integration/offline_test.go
  - id: r.example-inventory-matches-disk
    level: MUST
    text: The declared example inventory must agree with the example files actually
      present on disk.
    codeRefs:
    - file:test/integration/examples.go
    - file:test/integration/offline_test.go
  - id: r.examples-fit-installed-schemas
    level: MUST
    text: Each example must validate against the schema installed for its kind, and
      APIExports must name the schemas they declare.
    codeRefs:
    - file:test/integration/offline_test.go
  - id: r.live-cluster-fixture-bootstraps-workspaces
    level: MUST
    text: startCluster bootstraps the tenancy and provider workspaces (runtime, deno-provider)
      before a live test applies any example.
    codeRefs:
    - file:test/integration/fixture_test.go
  - id: r.live-expectations-are-polled-with-timeouts
    level: MUST
    text: Live tests wait on cluster state through liveCluster.expect with an explicit
      timeout rather than sleeping a fixed duration.
    codeRefs:
    - file:test/integration/fixture_test.go
  - id: r.live-suite-requires-explicit-opt-in
    level: MUST
    text: Live tests call requireLive first and skip with 'set DENO_KCP_REQUIRE_LIVE=1
      and provide kcp, kine, deno and a sibling policy-engine checkout' unless the
      environment opts in.
    codeRefs:
    - file:test/integration/fixture_test.go
    - file:test/integration/live_test.go
  - id: r.live-tests-drive-the-example-chain
    level: SHOULD
    text: The live suite drives the published example chain end to end, and separately
      a direct run with its readers, against a real kcp.
    codeRefs:
    - file:test/integration/live_test.go
  - id: r.market-examples-are-registered
    level: MUST
    text: The offline example registry covers the atproto market manifests. exampleFiles()
      in test/integration/examples.go carries an entry for every kcp-kind manifest
      under deploy/examples/atproto/market -- 15-openbao-global.yaml, 15-openbao-relay.yaml,
      15-openbao-alice.yaml, 15-openbao-bob.yaml, 20-global-plc.yaml, 30-relay-relay.yaml,
      40-alice-pds.yaml, 50-verifier.yaml, 60-bob-pds.yaml and 70-bidder.yaml -- with
      File holding the manifest's path relative to deploy/examples (e.g. atproto/market/70-bidder.yaml),
      and loadExampleFile joining that path onto localExamples(). exampleFilesOnDisk()
      walks deploy/examples recursively and returns the same relative paths. The two
      non-kcp manifests 00-workspaces.yaml and 10-rbac.yaml are declared non-examples
      by name in examples.go, and TestExampleInventoryMatchesDisk subtracts them from
      the disk walk so the inventory still agrees with disk. TestEveryExampleDecodesFromDisk
      and TestExamplesFitTheInstalledSchemas then decode and schema-fit the market
      manifests with the existing DenoPod and OpenBao entries and the existing denopod
      and openbao APIResourceSchemas.
    codeRefs:
    - file:test/integration/examples.go
    - file:test/integration/offline_test.go
  - id: r.namespace-certificate-hierarchy-is-covered
    level: MUST
    text: Tests must cover that a Kubernetes namespace gets its own OpenBao namespace
      whose intermediate is signed by the root, that a workload's certificate verifies
      against the root alone, that the same holds over TLS, and that a namespace with
      no OpenBao object gets no certificate.
    codeRefs:
    - file:test/integration/bao_test.go
    - file:test/integration/openbao_live_test.go
  - id: r.offline-suite-needs-no-cluster
    level: MUST
    text: The example-decoding, inventory, wiring, schema-fit and APIExport-name checks
      in offline_test.go run with no kcp, kine, deno or policy-engine present.
    codeRefs:
    - file:test/integration/examples.go
    - file:test/integration/offline_test.go
  - id: r.openbao-under-test-is-the-pinned-checkout
    level: MUST
    text: The OpenBao server under test is built from the third_party/openbao checkout
      the repository pins, not taken from PATH, and the build happens once per test
      binary.
    codeRefs:
    - file:test/integration/bao_test.go
  - id: r.spawned-processes-are-reaped
    level: MUST
    text: TestMain reaps every child process the fixture spawned (killSpawned, process.kill)
      so a failing live run does not leave kcp, kine or bao behind.
    codeRefs:
    - file:test/integration/fixture_test.go
