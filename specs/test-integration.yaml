apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test-integration
  namespace: default
spec:
  repository: deno-kcp
  upstream: sc.deno-kcp
  overlay:
  - ov.runtime-rbac
  - ov.test-cluster
  - ov.test-integration-install
  - sc.demo.native-fire
  - sc.demo.on-policy-allow
  - sc.demo.open-policy-pod
  - sc.demo.policy-engine
  - sc.example.deno-job
  - sc.example.deno-pod
  - sc.example.deno-run
  - sc.example.openbao
  - sc.example.openbao-tls-pod
  - sc.internal-baoembed-cmd-baoembed
  - sc.test.direct-run
  orchestrator: orch.test-integration
  dependsOn:
  - sc.api-v1alpha1
  - sc.deno-kcp
  - sc.internal-livegate
  - sc.internal-provider
  arch:
    id: sc.test.integration-cluster
    kind: node
    section: system_contexts
    form: list
    position: 5
    upstream: sc.deno-kcp
    overlay:
    - ov.runtime-rbac
    - ov.test-cluster
    - ov.test-integration-install
    - sc.demo.native-fire
    - sc.demo.on-policy-allow
    - sc.demo.open-policy-pod
    - sc.demo.policy-engine
    - sc.example.deno-job
    - sc.example.deno-pod
    - sc.example.deno-run
    - sc.example.openbao
    - sc.example.openbao-tls-pod
    - sc.openbao-embedded
    - sc.test.direct-run
    orchestrator: orch.test-integration
    code:
    - file:test/integration/bao_test.go
    - file:test/integration/examples.go
    - file:test/integration/fixture_test.go
    - file:test/integration/live_test.go
    - file:test/integration/offline_test.go
    - file:test/integration/openbao_live_test.go
    node:
      code:
        bao: test/integration/bao_test.go
        examples: test/integration/examples.go
        fixture: test/integration/fixture_test.go
        offline: test/integration/offline_test.go
        tests:
        - test/integration/live_test.go
        - test/integration/openbao_live_test.go
      context: tb.host
      harness:
      - drives:
        - deploy/examples
        - deploy/policyworkflowrun-apiexport.yaml
        - deploy/denoruntime-apiexport.yaml
        file: test/integration/offline_test.go
        funcs:
        - TestEveryExampleDecodesFromDisk
        - TestExampleInventoryMatchesDisk
        - TestExamplesAreWiredToEachOther
        - TestExamplesFitTheInstalledSchemas
        - TestAPIExportsNameDeclaredSchemas
      - creates:
        - sc.demo.policy-engine
        - sc.demo.open-policy-pod
        - sc.demo.on-policy-allow
        - sc.demo.native-fire
        - sc.test.direct-run
        - sc.example.deno-run
        - sc.example.deno-job
        - sc.example.deno-pod
        drives:
        - deploy/examples/policyengine.yaml
        - deploy/examples/policyworkflowpod.yaml
        - deploy/examples/runtrigger.yaml
        - deploy/examples/native-fire-pod.yaml
        - deploy/examples/policy-workflow-run.yaml
        - deploy/examples/deno-run.yaml
        - deploy/examples/deno-job.yaml
        - deploy/examples/deno-pod.yaml
        file: test/integration/live_test.go
        funcs:
        - TestExampleChainOnRealKCP
        - TestDirectRunAndReadersOnRealKCP
      - creates:
        - sc.example.openbao
        - sc.example.openbao-tls-pod
        drives:
        - deploy/examples/openbao.yaml
        - deploy/examples/openbao-tls-pod.yaml
        file: test/integration/openbao_live_test.go
        funcs:
        - TestOpenBaoAuthorityIssuesTheCertificateADenoPodServesWith
        - TestOpenBaoOverTLSIssuesTheCertificateADenoPodServesWith
        - TestANamespaceWithoutAnOpenBaoObjectGetsNoCertificate
      - file: test/integration/fixture_test.go
        role: 'startCluster: kine, kcp, the in-process provider, the workspace bootstrap
          and the typed reads'
      - file: test/integration/bao_test.go
        role: builds and starts the pinned embedded OpenBao, returning its address,
          root token and CA
      - file: test/integration/examples.go
        role: the example inventory table and the decode and repo-root helpers
      id: sc.test.integration-cluster
      orchestrator: orch.test-integration
      overlay:
      - ov.test-cluster
      - ov.test-integration-install
      - ov.runtime-rbac
      - sc.openbao-embedded
      - sc.demo.policy-engine
      - sc.demo.open-policy-pod
      - sc.demo.native-fire
      - sc.demo.on-policy-allow
      - sc.test.direct-run
      - sc.example.deno-run
      - sc.example.deno-job
      - sc.example.deno-pod
      - sc.example.openbao
      - sc.example.openbao-tls-pod
      upstream: sc.deno-kcp
codeRefIndex:
- file:test/integration/bao_test.go bao_test.go@test/integration/bao_test.go
- file:test/integration/examples.go examples.go@test/integration/examples.go
- file:test/integration/fixture_test.go fixture_test.go@test/integration/fixture_test.go
- file:test/integration/live_test.go live_test.go@test/integration/live_test.go
- file:test/integration/offline_test.go offline_test.go@test/integration/offline_test.go
- file:test/integration/openbao_live_test.go openbao_live_test.go@test/integration/openbao_live_test.go
