    signature: func TestExampleInventoryMatchesDisk(t *testing.T)
  - file: test/integration/offline_test.go
    kind: function
    name: TestExamplesAreWiredToEachOther
    signature: func TestExamplesAreWiredToEachOther(t *testing.T)
  - file: test/integration/offline_test.go
