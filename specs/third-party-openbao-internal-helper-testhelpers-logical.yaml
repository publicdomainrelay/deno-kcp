    file: third_party/openbao/internal/helper/testhelpers/logical/testing.go
  - name: TestCheckAuthDisplayName
    kind: function
    signature: func TestCheckAuthDisplayName(n string) TestCheckFunc
    file: third_party/openbao/internal/helper/testhelpers/logical/testing.go
  - name: TestCheckAuthEntityAliasMetadataName
    kind: function
    signature: func TestCheckAuthEntityAliasMetadataName(key string, value string)
