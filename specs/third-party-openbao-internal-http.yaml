apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-http
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The context exists to explain how the vendored OpenBao HTTP front end is
    structured so that deno-kcp can reason about, patch or call it without re-reading
    the whole vendored tree. It names the request/response wire types of the sys endpoints,
    the handler anchors and adapters used to inject a handler into the Vault core,
    the JSON complexity enforcement, the UI asset wrapper, and the test harness helpers.
    Every requirement here describes behaviour already present in the observed files,
    not a proposed change.
  requirements:
  - id: r.copy-response-writer
    level: MUST
    text: 'copyResponseWriter wraps an http.ResponseWriter: Header delegates to the
      wrapped writer, Write appends the bytes to an internal buffer while also writing
      them through, and WriteHeader records the status code before forwarding it,
      so the response body and status can be inspected after the handler runs.'
    codeRefs:
    - method:4d96008ed49146f640748d9606499ead
    - method:5412779bc9a7ee61e2eff3d2b8384a63
    - method:c831c4945e58cf05c1efba63b5fd62bf
  - id: r.cors-and-help
    level: SHOULD
    text: cors.go handles cross-origin request policy for the API and UI, and help.go
      renders the help output for mount and auth paths; both are wired into the shared
      route table in handler.go.
    codeRefs:
    - file:third_party/openbao/internal/http/cors.go
    - file:third_party/openbao/internal/http/handler.go
    - file:third_party/openbao/internal/http/help.go
  - id: r.handler-anchor
    level: MUST
    text: HandlerAnchor is the no-argument anchor type that the Vault core mounts;
      its Handler method takes the listener properties and returns the package-level
      handler built from those properties.
    codeRefs:
    - file:third_party/openbao/internal/http/handler.go
    - method:84eb5fb6f1aae6434f6d6f06dbfd80cf
    - struct:016c00b4b99172fccb45188271ef7f5d
  - id: r.handler-func-adapter
    level: MUST
    text: HandlerFunc is a func type over the same signature, and its Handler method
      lets an arbitrary function be used wherever a handler provider is required,
      so tests and callbacks can install their own handler.
    codeRefs:
    - method:a5cca87321744db3c1ee18a1dc79bd40
    - type_alias:28a21571ba0b776aa360350f41d08ee0
  - id: r.json-complexity-limits
    level: MUST
    text: EnforceJSONComplexityLimits reads a JSON body from the reader under a context,
      validates it against the configured complexity limits, and reports the observed
      size values along with an error when the limits are exceeded, so oversized or
      deeply nested request bodies are rejected instead of decoded.
    codeRefs:
    - file:third_party/openbao/internal/http/json.go
    - function:b106bcd2d6184b15afb7677cff3a396c
  - id: r.logical-routing
    level: MUST
    text: logical.go forwards non-sys paths to the Vault core as logical requests,
      and index.go serves the index route, forming the passthrough from HTTP to secret
      engine operations.
    codeRefs:
    - file:third_party/openbao/internal/http/index.go
    - file:third_party/openbao/internal/http/logical.go
  - id: r.multi-reader-closer
    level: MAY
    text: multiReaderCloser combines several readers and closes them as one; its Close
      method releases every underlying reader so request bodies assembled from multiple
      sources are fully drained.
    codeRefs:
    - file:third_party/openbao/internal/http/util.go
    - method:00f873e3b91b9528ca4d0b27b8ec4360
  - id: r.sys-route-files
    level: MUST
    text: 'Each sys concern has its own handler file registering its routes on the
      shared mux: audit, auth, config CORS, config state, generate-root, health, host
      info, in-flight requests, init, internal, leader, lease, metrics, monitor, mount,
      mounts, namespaces, policy, raft, rekey, rotate, seal and wrapping, and each
      ships a paired _test.go exercising those routes.'
    codeRefs:
    - file:third_party/openbao/internal/http/sys_generate_root.go
    - file:third_party/openbao/internal/http/sys_health.go
    - file:third_party/openbao/internal/http/sys_in_flight_requests.go
    - file:third_party/openbao/internal/http/sys_init.go
    - file:third_party/openbao/internal/http/sys_leader.go
    - file:third_party/openbao/internal/http/sys_metrics.go
    - file:third_party/openbao/internal/http/sys_raft.go
    - file:third_party/openbao/internal/http/sys_rekey.go
    - file:third_party/openbao/internal/http/sys_seal.go
  - id: r.sys-wire-types
    level: MUST
    text: 'The sys endpoint files define the request and response structs that fix
      the JSON wire shape of each operation: generate-root init/status/update, health,
      init request, init response, init status, raft join request and response, rekey
      request, rekey status, rekey update request and response, rekey verification
      update request, verification status and verification update response, and the
      unseal request. The HTTP handlers decode into and encode from these types.'
    codeRefs:
    - struct:00c3694b43bc074ff8e885b14fd2742a
    - struct:0be9dca687b6bc4a7250ba145ece21c1
    - struct:30a67a6afdd05f4539608e1c5b492034
    - struct:5145c7dfa28a9d4e42cf239a95151f57
    - struct:73bb07faf010373b79a04aac61e398ef
    - struct:878734e749075a5f33055d05e2141217
    - struct:9516c58a3e2ce7506455850e5efe3ff7
    - struct:a100ab592585fb4f37e0b3742df1df7c
    - struct:b78c5904da11db12bd1bb73047f41b5f
    - struct:b9f82c89b9e865f4ae188c1228608441
    - struct:bc7f306e4d035f955d01e9846abc92cf
    - struct:bf0c13e2cc2e82e9088408c856ce3266
    - struct:c1feb31f25bc79ac7c3f575c3cf72a87
    - struct:db8c14b6eed4f3bbb3c4adea7202dd64
    - struct:f3f3f40f449d5956118c6e73d5851eb7
    - struct:f4eaf8acd7e99e98cc5c232bba9d84a3
    - struct:f930638200133c35808bc2881f2f701f
  - id: r.test-harness
    level: SHOULD
    text: 'testing.go exposes helpers that build a real listener on a free address
      and stand up a fully wired test server: TestListener returns the listener and
      address, TestServer builds a server from a core, TestServerWithListener and
      TestServerWithListenerAndProperties accept a caller-supplied listener and optional
      handler properties, TestServerWithCertForwarding enables the certificate-forwarding
      path, and TestServerAuth returns a server that requires the given token.'
    codeRefs:
    - file:third_party/openbao/internal/http/testing.go
    - function:1a39cf4e86eccf88009e235523d16614
    - function:9721f01f2945a7644f94f41f0c466613
    - function:a1732bf9310d647b993a51edae99c0af
    - function:b0d52dd8e11ccd15f45fb886f9fb5082
    - function:e06335d0c0882c762de0d50399455bd9
    - function:ee89a43f24c3e910320d9f6364f5b1e4
  - id: r.ui-asset-wrapper
    level: SHOULD
    text: UIAssetWrapper serves the web UI file set; its Open method returns an http.File
      for a requested asset name, backed by embedded assets when the embed build tag
      is on and by assets_stub.go otherwise.
    codeRefs:
    - file:third_party/openbao/internal/http/assets.go
    - file:third_party/openbao/internal/http/assets_stub.go
    - method:54a0c4654f2f6b8ed2ad71d828455b96
    - struct:fefbc685630821c5a39e1c2f581b33d8
  - id: r.wrap-http-server-handler
    level: MUST
    text: WrapHttpServerHandler takes an http.Handler plus a listener configuration
      and returns the handler to serve, applying the listener-derived wrapping (transport,
      TLS, proxy and similar concerns) that the configured listener requires.
    codeRefs:
    - function:2e8c896a6a31adb733c76bde2edca6e5
