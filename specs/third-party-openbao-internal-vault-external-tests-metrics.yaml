apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
  core_metrics_int_test.go@third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-metrics
  namespace: default
spec:
  intent: 'The context exists to pin down the externally observable behaviour of OpenBao''s
    core metrics endpoint as seen from outside the vault package: which mount-table
    gauges appear, what their labels and values are, how they move when a new mount
    is added, and that leader and unseal gauges follow a leadership change. It is
    a black-box acceptance layer that talks to a real two-core cluster over the HTTP
    API rather than to internal metric registries, so it guards the metric names,
    label names and endpoint shape that operators and monitoring depend on.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.gauge-condition-check
    level: SHOULD
    text: gaugeConditionCheck returns an error equality gauge check for comparison
      failed only when the comparator is the string eq and the two integers differ;
      any other comparator value passes without error.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.gauge-search-helper-labels
    level: MUST
    text: gaugeSearchHelper returns the collected core.mount_table.size value on success;
      it selects only gauges whose local label is the string false and whose type
      label is the string logical, requires the core.mount_table.num_entries gauge
      to be seen and otherwise returns the sentinel max-int value together with the
      error No metrics reported for mount sizes, and returns the same sentinel together
      with an error when the entry gauge value fails the eq check against the expected
      value.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.kv-mount-increments-entry-gauge
    level: MUST
    text: After mounting a kv version 2 backend at path kv with version option 2,
      the same nonlocal logical core.mount_table.num_entries gauge equals 4 and core.mount_table.size
      stays non-zero; the test documents that on a transactional storage backend the
      size gauge reports only the new table entry, not a running total.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.leader-reelection-metrics-endpoint
    level: MUST
    text: TestLeaderReElectionMetrics requests GET /v1/sys/metrics with cluster.RootToken
      in the consts.AuthHeaderName header, reads and JSON-unmarshals the body into
      testhelpers.SysMetricsJSON, and errors when either the core.active or the core.unsealed
      gauge is absent or does not equal 1.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.leader-stepdown-metrics-follow
    level: MUST
    text: After calling client.Sys().StepDown on the active core, the test waits for
      core 1 to report active and repeats the same GET /v1/sys/metrics assertions
      through the core 1 client, so the core.active and core.unsealed gauges must
      both be present and equal 1 on the new leader.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.mount-table-nonlocal-logical-gauges
    level: MUST
    text: Before any user mount is added, the test asserts that the core.mount_table.num_entries
      gauge carrying labels local=false and type=logical equals 3, covering the cubbyhole,
      identity and kv mounts, and that the matching core.mount_table.size gauge is
      non-zero; a size of zero or less is a fatal failure.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.mount-table-test-cluster-shape
    level: MUST
    text: TestMountTableMetrics starts a two-core test cluster named mycluster with
      corehelpers.NewMockBuiltinRegistry as the builtin registry, vaulthttp.Handler
      as the handler, KeepStandbysSealed false, and a testhelpers.TestMetricSinkProvider
      sink on a one-minute interval, waits for core 0 to report active with vault.TestWaitActive
      before reading metrics, and defers cluster.Cleanup.
  upstream: self
