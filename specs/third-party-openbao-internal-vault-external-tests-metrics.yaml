apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
  core_metrics_int_test.go@third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-metrics
  namespace: default
spec:
  intent: 'The context exists to pin down the externally observable behaviour of OpenBao''s
    core metrics endpoint as seen from outside the vault package: which mount-table
    gauges appear, what their labels and values are, how they move when a new mount
    is added, and that leader and unseal gauges follow a leadership change. It is
    a black-box acceptance layer that talks to a real two-core cluster over the HTTP
    API rather than to internal metric registries, so it guards the metric names,
    label names and endpoint shape that operators and monitoring depend on.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.gauge-condition-check
    level: SHOULD
    text: gaugeConditionCheck compares two integers and returns an error only when
      the comparator is the string eq and the values differ; any other comparator
      value passes without error.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.gauge-search-helper-labels
    level: MUST
    text: gaugeSearchHelper selects only gauges whose local label is the string false
      and whose type label is the string logical; it treats a missing core.mount_table.num_entries
      gauge as an error and returns the sentinel max-int value together with that
      error, and it returns the collected core.mount_table.size value on success.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.kv-mount-increments-entry-gauge
    level: MUST
    text: After mounting a kv version 2 backend at path kv, the same nonlocal logical
      core.mount_table.num_entries gauge equals 4 and core.mount_table.size stays
      non-zero; the test documents that on a transactional storage backend the size
      gauge reports only the new table entry, not a running total.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.leader-reelection-metrics-endpoint
    level: MUST
    text: The re-election test requests GET /v1/sys/metrics with the cluster root
      token in the auth header, reads and JSON-unmarshals the body into testhelpers.SysMetricsJSON,
      and fails when either the core.active or the core.unsealed gauge is absent or
      does not equal 1.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.leader-stepdown-metrics-follow
    level: MUST
    text: After calling sys/step_down on the active core, the test waits for core
      1 to report active and repeats the same sys/metrics assertions against that
      core, so the leader and unseal gauges must follow the leadership change.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.mount-table-nonlocal-logical-gauges
    level: MUST
    text: Before any user mount is added, the test asserts that the core.mount_table.num_entries
      gauge carrying labels local=false and type=logical equals 3, covering the cubbyhole,
      identity and kv mounts, and that the matching core.mount_table.size gauge is
      non-zero.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/metrics/core_metrics_int_test.go
    id: r.mount-table-test-cluster-shape
    level: MUST
    text: The mount-table test starts a two-core test cluster named mycluster with
      MockBuiltinRegistry and a TestMetricSinkProvider sink on a one-minute interval,
      keeps standbys unsealed, waits for core 0 to report active before reading metrics,
      and cleans the cluster up on exit.
  upstream: self
