apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-barrier
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the repository can use OpenBao''s barrier implementation
    from inside its own tree rather than as an external module. The barrier is the
    trust boundary for stored data: it holds the root key, seals and unseals, owns
    the keyring of encryption terms, and mediates every Put/Get/Delete/List against
    physical storage through AES-GCM. It also defines the contracts (SecurityBarrierCore,
    SecurityBarrier, TransactionalSecurityBarrier, Encryptor, View, TransactionalView,
    ViewTransaction) that the rest of the vault depends on, and it adapts to backends
    that implement physical.TransactionalBackend.'
  requirements:
  - id: r.aes-gcm-storage
    level: MUST
    text: Put encrypts the StorageEntry value with the active term's AES-GCM AEAD
      and Get decrypts it, with the AES-GCM version byte prefixed to the ciphertext
      (the barrier initializes currentAESGCMVersionByte to AESGCMVersion2) and the
      storage path bound into the sealed payload; a term whose AEAD is not cached
      is derived from that term's key and cached.
    codeRefs:
    - method:01f46b2e1487c02a24ffbe9e07454e05
    - method:a23c5f5c4babee1315ccc9f662729c36
    - struct:962a16b48956480703dd1587051b0cd8
  - id: r.encryption-count-tracking
    level: MUST
    text: 'The barrier counts local encryptions, unaccounted encryptions and encryptions
      reported by other nodes: TotalLocalEncryptions exposes the local total, ConsumeEncryptionCount
      hands the accumulated count to a consumer callback and resets it, AddRemoteEncryptions
      adds counts reported by peers, and CheckBarrierAutoRotate reads the persisted
      counts and triggers a rotation when they exceed the configured limit.'
    codeRefs:
    - method:1c12ece98e58fef4e317440c506c67c1
    - method:5007ee83aefc7a05c30270e8b4403cb7
    - method:7506adb0b90c855b60a65848d3954aba
    - method:901e4cf6fed657e682fb3cbef0aefbd0
  - id: r.interface-contracts
    level: MUST
    text: 'The package exports the barrier contracts as interfaces: SecurityBarrierCore
      for the unsealed keyring and encryption surface, SecurityBarrier for the core
      plus Initialize, TransactionalSecurityBarrier for the transactional door, SecurityBarrierTransaction
      for a single transaction, Encryptor for path-keyed Encrypt/Decrypt, and View/TransactionalView/ViewTransaction
      for prefix-scoped storage, so consumers bind to these rather than to AESGCMBarrier.'
    codeRefs:
    - interface:0d8475f05a238a682dc72e8d4a9f5455
    - interface:1b96c08c3514ee79d57ae665713d52bd
    - interface:207898b6e4cd19e2d7fa89cc07044e22
    - interface:a367f77e485ff5f9a8787e3f91db2843
    - interface:ea02f92865540d966019e6a844381766
    - interface:ed5e38b34fcfa33e1a7cf94fa7ccd051
    - interface:f0e627c72ef8d3aa115f0653867c751b
    - interface:f5eddde16b4c4941ccf3302e837e6419
  - id: r.key-material-confidentiality
    level: MUST
    text: GenerateKey returns a random key of the barrier's key length, Keyring.Zeroize
      wipes the root key and, when asked, the term keys in place, and Keyring.Serialize/DeserializeKey
      plus Key.Serialize/DeserializeKey round-trip key material through the encoded
      on-disk form.
    codeRefs:
    - function:212ac5b5fd50f9ea86b12a89c0b268b8
    - method:5a3057998ce4d6a8c52108c3fe889ee7
    - method:8e78c43284969cef78f02e52bf6c35a3
    - method:e7cfbb1c57f2659c929b4352d6fc8b98
  - id: r.key-terms-monotonic
    level: MUST
    text: Keyring.AddKey rejects term zero, rejects a term that is not exactly one
      greater than the current active term, and rejects a term that already exists,
      while RemoveKey rejects removal of the active term and only removes a term that
      exists, so key terms form a strictly increasing series with exactly one active
      term.
    codeRefs:
    - method:6ed00f9f3524113c1b3faacdac5850d8
    - method:ccc747c00eca5def1c14d9c855a7ba7b
    - method:f22126c175339aca7d384cf5db59da9a
  - id: r.keyring-persistence
    level: MUST
    text: The barrier serializes its keyring with Keyring.Serialize, encrypts it under
      the root key, writes it to the configured storage, and reads it back with DeserializeKeyring;
      persistKeyringInternal performs the write and marks best-effort writes so a
      failed metadata write does not abort the caller, while ReloadKeyring and ReloadRootKey
      re-read the persisted keyring from storage.
    codeRefs:
    - function:f04155311a4b35251245e079d6615601
    - method:4a9bb0c3ed75639fdbcbd35f4ff46808
    - method:55e76a86eb68a84d01a3e081430e8fc3
    - method:fbeca9db1b221ce4fe510c7eff8b3b91
  - id: r.namespace-meta-prefix
    level: MUST
    text: A barrier whose namespace is not the root namespace stores its keyring and
      metadata under the path NamespacePrefix joined with the namespace UUID and a
      trailing slash; the root namespace uses an empty prefix. A nil namespace is
      replaced with namespace.RootNamespace.
    codeRefs:
    - function:d5a8564281df503f3fd2e06388caf481
    - method:86799e2a2cf0d0c55f257ef93c84724f
  - id: r.read-only-mode
    level: MUST
    text: SetReadOnly puts the barrier into a read-only state in which writing operations
      such as Put and Delete fail while reads continue to work.
    codeRefs:
    - method:356fb99e742cb25010fbb4e6e2f5e34e
    - method:5bec7786c5b5f0229dd883914e9ea186
    - method:a23c5f5c4babee1315ccc9f662729c36
  - id: r.root-key-verification
    level: MUST
    text: VerifyRoot decrypts a candidate root key against the persisted keyring and
      returns an error when the key does not authenticate, so a wrong root key cannot
      unseal the barrier and cannot be installed by SetRootKey or RotateRootKey.
    codeRefs:
    - method:5eeba8615ebf09e0d655597264ecee1c
    - method:9d6d26d7000227a62ba2e6bdb70ca708
    - method:ac9333e3ef4ccebd7343e60d43cddc65
  - id: r.rotation
    level: MUST
    text: Rotate generates a new term key, appends it with AddKey so the new term
      becomes active, and persists the keyring, returning the new term number; Init
      also seeds the first term during Initialize.
    codeRefs:
    - method:521e63107d93903c4bb8529b6c199c07
    - method:754d8d0a0fb4984159a1e8b6b909760c
    - method:ccc747c00eca5def1c14d9c855a7ba7b
  - id: r.rotation-config
    level: MUST
    text: RotationConfig returns a clone of the keyring's KeyRotationConfig and errors
      when no keyring is loaded; SetRotationConfig sanitizes the supplied config,
      stores it on the keyring, and persists the keyring, and KeyRotationConfig exposes
      Clone, Sanitize and Equals for manipulating and comparing it.
    codeRefs:
    - method:28339de270d301e0fd81b191a3775f29
    - method:3c0cd9988a47cc0dc81f14427b7517c5
    - method:62f8f381356ba05dd86b86a98a12d940
    - method:6a8811a124377f7afa0a192f6172eaa6
    - method:e7adcc1a2a6c350ce2842d7672c4a41e
  - id: r.sealed-by-construction
    level: MUST
    text: A barrier built by NewAESGCMBarrier starts with sealed=true and no keyring,
      so storage operations are refused until Unseal succeeds with a root key that
      matches the persisted keyring; Sealed reports the current state and Seal returns
      the barrier to the sealed state and zeroizes the keyring.
    codeRefs:
    - function:d5a8564281df503f3fd2e06388caf481
    - method:5031496eec0f4397be30e92ab07ff38b
    - method:692e11e7114b27e785c016841cd41ded
    - method:7055ced9179cdc4dd0f0e0afeb97b99a
  - id: r.storage-namespace-operations
    level: MUST
    text: 'The barrier implements the full logical.Storage surface over the encrypted
      backend: Get, Put, Delete, List and the paginated ListPage(prefix, after, limit)
      which returns names after the given cursor up to the limit.'
    codeRefs:
    - method:01f46b2e1487c02a24ffbe9e07454e05
    - method:1ea2514dab7b64705327ac0b243dbdb9
    - method:5bec7786c5b5f0229dd883914e9ea186
    - method:6e74975244ca408dd501942fc0e8270c
    - method:a23c5f5c4babee1315ccc9f662729c36
  - id: r.test-support
    level: SHOULD
    text: MockBarrier returns an in-memory physical backend, a barrier with that backend,
      and the root key, so tests can obtain an initialized barrier without touching
      real storage; the accompanying _test.go files exercise the barrier and view
      behaviour against it.
    codeRefs:
    - file:third_party/openbao/internal/vault/barrier/aes_gcm_test.go
    - file:third_party/openbao/internal/vault/barrier/barrier_test.go
    - file:third_party/openbao/internal/vault/barrier/keyring_test.go
    - file:third_party/openbao/internal/vault/barrier/testing.go
    - file:third_party/openbao/internal/vault/barrier/view_test.go
    - function:fcf85cd1dc11b0be141bc2116f96ce2a
  - id: r.transactional-backend-selection
    level: MUST
    text: NewAESGCMBarrier inspects the supplied physical.Backend and, when it also
      implements physical.TransactionalBackend, returns the storage wrapped in a TransactionalAESGCMBarrier
      that shares the same barrier state instead of the plain AESGCMBarrier.
    codeRefs:
    - function:d5a8564281df503f3fd2e06388caf481
    - struct:5e07ca6d982a18bd4974120a606630fd
  - id: r.transactions
    level: MUST
    text: A TransactionalAESGCMBarrier opens a logical.Transaction with BeginTx (read-write)
      or BeginReadOnlyTx, returning an AESGCMBarrierTransaction that delegates List,
      ListPage, Put, Get and Delete to the underlying physical.Transaction and finishes
      with Commit or Rollback.
    codeRefs:
    - method:51dbf17ac96193a82d77f4a8f106b086
    - method:6ef0110b96f65df9ab701964c1b1c572
    - method:a8f1a23a7d98d00d6ab24e152c54bff4
    - method:ac792316dadddd7cce03da36586377ee
    - struct:43b407078e598cfbdab3c6ecfed29e6f
  - id: r.upgrade-terms
    level: MUST
    text: CreateUpgrade and DestroyUpgrade add and remove special upgrade terms tracked
      separately from the active keyring term, and CheckUpgrade reports whether an
      upgrade is pending together with the pending term number.
    codeRefs:
    - method:18a38a790007525544cf0b64d40e6998
    - method:52d9cdf63f579f8686aaad00a3dc3b93
    - method:9595c1df1b3c369e9c874c66fbfbab40
  - id: r.view-prefixing
    level: MUST
    text: NewView joins the caller's prefix with a trailing slash and returns a View
      whose Prefix reports it; Get, Put, Delete, List, ListPage and SubView operate
      only under that prefix, with SubView appending a further prefix so nested views
      stay inside their parent's key space.
    codeRefs:
    - function:cc55fdbd079856880adf56c011277b95
    - method:52a2c3b0bc89e7a9a2a83f5475995f7b
    - method:68101b0c2efca8b0530923e4e7c9bf4f
    - method:76c8d76ac6191a2f39a6fe14f35179a4
    - method:7aa212734bfbd585798e840d687c6599
    - method:ea0268d5a918db181418a803702f84fb
  - id: r.view-read-only-error
    level: MUST
    text: A view carries a read-only error through SetReadOnlyErr and GetReadOnlyErr;
      when one is set, Put and Delete return it instead of writing, and a sub-view
      inherits the error from its parent.
    codeRefs:
    - method:76c8d76ac6191a2f39a6fe14f35179a4
    - method:7a6602d5e5996a19b6053e9b9878988c
    - method:7aa212734bfbd585798e840d687c6599
    - method:82c525e846e24f3030b74a8cd94208bc
  - id: r.view-transactions
    level: MUST
    text: A TransactionalView opens transactions against its underlying transactional
      barrier with BeginTx or BeginReadOnlyTx and returns a ViewTransaction whose
      Commit and Rollback finish the transaction while keeping the view's prefix applied
      to all operations.
    codeRefs:
    - method:378543af250556d7ec61185e20e1a22f
    - method:67d1129e203d6fbdc58805c6d1a9f231
    - method:d04f60d6ab8c776f64a86636648d9876
    - method:e891e19c6d658a1d085c35d7a53893f8
