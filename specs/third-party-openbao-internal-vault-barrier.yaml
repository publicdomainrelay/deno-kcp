kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-barrier
  namespace: default
spec:
  intent: 'This context exists so the repository can use OpenBao''s barrier implementation
    from inside its own tree rather than as an external module. The barrier is the
    trust boundary for stored data: it holds the root key, seals and unseals, owns
    the keyring of encryption terms, and mediates every Put/Get/Delete/List against
    physical storage through AES-GCM. It also defines the contracts (SecurityBarrierCore,
    SecurityBarrier, TransactionalSecurityBarrier, Encryptor, View, TransactionalView,
    ViewTransaction) that the rest of the vault depends on, and it adapts to backends
    that implement physical.TransactionalBackend.'
