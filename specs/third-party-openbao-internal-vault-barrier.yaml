    - method:5031496eec0f4397be30e92ab07ff38b
    - method:692e11e7114b27e785c016841cd41ded
    - method:7055ced9179cdc4dd0f0e0afeb97b99a
    id: r.sealed-by-construction
    level: MUST
    text: A barrier built by NewAESGCMBarrier starts with sealed=true and no keyring,
      so storage operations are refused until Unseal succeeds with a root key that
      matches the persisted keyring; Sealed reports the current state and Seal returns
      the barrier to the sealed state and zeroizes the keyring.
