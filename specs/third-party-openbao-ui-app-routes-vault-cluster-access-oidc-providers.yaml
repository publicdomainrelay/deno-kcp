kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-oidc-providers
  namespace: default
spec:
  intent: 'This context exists to specify the data-loading contract of the OIDC provider
    routes in the OpenBao UI: which Ember Data operations each route performs, how
    a missing provider list is tolerated, and how a single provider is resolved from
    the route''s name parameter, so that templates and downstream route behaviour
    can rely on a predictable model shape.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:5223045743ca9c232c6d7a2b4f6d13a3
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/providers/create.js
    id: r.create-unsaved-record
    level: MUST
    text: OidcProvidersCreateRoute.model must return store.createRecord('oidc/provider'),
      giving the create route an unsaved OIDC provider record to populate, and must
      not persist it.
  - codeRefs:
    - class:69e35f6ddd1442a6558b17a92dc370e0
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/providers/index.js
    id: r.list-404-empty
    level: MUST
    text: When the oidc/provider query rejects with httpStatus 404, OidcProvidersRoute.model
      must resolve to an empty array instead of propagating the error; any other rejection
      must be re-thrown.
  - codeRefs:
    - class:69e35f6ddd1442a6558b17a92dc370e0
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/providers/index.js
    id: r.list-query
    level: MUST
    text: OidcProvidersRoute.model must return the result of store.query('oidc/provider',
      {}) so the index route renders the collection of OIDC providers.
  - codeRefs:
    - class:51b2eeb3751f81c43ba06efd38e2a1a8
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/oidc/providers/provider.js
    id: r.resolve-by-name
    level: MUST
    text: OidcProviderRoute.model must read the name value from its route params and
      return store.findRecord('oidc/provider', name), so the single-provider route
      loads the record identified by the URL's name segment.
  - codeRefs:
    - class:51b2eeb3751f81c43ba06efd38e2a1a8
    - class:5223045743ca9c232c6d7a2b4f6d13a3
    - class:69e35f6ddd1442a6558b17a92dc370e0
    id: r.store-injection
    level: MUST
    text: Each of the three route classes must inject the Ember Data store service
      and perform all model loading through this.store, keeping data access in the
      route rather than the template.
  upstream: self
