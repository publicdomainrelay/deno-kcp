apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
  create.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/edit.js
  edit.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/edit.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
  index.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/merge.js
  merge.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/merge.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-identity
  namespace: default
spec:
  intent: 'This context exists so the identity management routes of the OpenBao UI
    have describable controller behavior: a single create controller carries the post-save/post-delete
    navigation and record cleanup contract, the edit and merge controllers reuse it
    verbatim, and the index controller carries the list screen''s filtering, pagination,
    deletion, and enable/disable toggling contract. It captures the code as written,
    including that edit and merge add no behavior of their own.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
    id: r.create-cleanup-model
    level: MUST
    text: The create controller's cleanupModel method must return early when there
      is no model or the model is saving, destroyed, or destroying; otherwise it must
      roll back dirty attributes when the model supports rollbackAttributes, always
      null the singleton controller's model, and unload the record through removeRecord
      when the model supports unloadRecord.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
    id: r.create-nav-after-save
    level: MUST
    text: The create controller's navAfterSave task must derive the identity type
      from the saved model and, for a non-delete save, transition to the showRoute
      with the model id and showTab; for a delete save it must transition to the type-specific
      list route taken from a lookup table mapping 'entity-alias' and 'group-alias'
      to the aliases index route and 'group' and 'entity' to the identity index route.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/edit.js
    id: r.edit-reuses-create
    level: MUST
    text: The edit controller must extend the create controller without adding or
      overriding behavior, so the edit route inherits create's navAfterSave and cleanupModel
      contract.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
    id: r.index-delete
    level: MUST
    text: The index controller's delete action must call destroyRecord on the model
      and, on success, send reload to the list route and flash a success message naming
      the identity type and id; on failure it must flash the type, id, and the joined
      error list or error message.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
    id: r.index-filter-matching
    level: MUST
    text: The index controller must compute filterMatchesKey as true only when the
      model list is non-empty and contains a record whose id equals the filter, and
      firstPartialMatch as the first id matching a regex anchored at the escaped filter,
      returning null when the filter already matches a key or nothing matches, and
      otherwise returning either that match or the model list's common prefix when
      the filter equals the shared prefix or only one entry matched.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
    id: r.index-list-actions
    level: MUST
    text: The index controller must provide setFilter and setFilterFocus actions that
      set the filter and filterFocused state, a refresh action that sends reload to
      the list route, and a reloadRecord action that reloads the given model.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
    id: r.index-query-params
    level: MUST
    text: The index controller must expose page and pageFilter as query params backed
      by the string keys 'page' and 'pageFilter', defaulting to page 1 and a null
      pageFilter, and must hold filter, filterFocused, and isLoading state.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/index.js
    id: r.index-toggle-disabled
    level: MUST
    text: The index controller's toggleDisabled action must pick the enable or disable
      verb pair from the model's current disabled flag, toggle the model's disabled
      property, save the model, and flash a message built from that verb and the identity
      type and id on both success and failure.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/create.js
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/merge.js
    id: r.merge-reuses-create
    level: MUST
    text: The merge controller must extend the create controller without adding or
      overriding behavior, so the merge route inherits create's navAfterSave and cleanupModel
      contract.
  upstream: self
