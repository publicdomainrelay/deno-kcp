apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/vault/external_tests/raft/raft.go raft.go@third_party/openbao/internal/vault/external_tests/raft/raft.go
- file:third_party/openbao/internal/vault/external_tests/raft/raft_autopilot_test.go
  raft_autopilot_test.go@third_party/openbao/internal/vault/external_tests/raft/raft_autopilot_test.go
- file:third_party/openbao/internal/vault/external_tests/raft/raft_test.go raft_test.go@third_party/openbao/internal/vault/external_tests/raft/raft_test.go
- function:3a883b33c1bea1968582334abdc0aae3 Raft_Configuration_Test@third_party/openbao/internal/vault/external_tests/raft/raft.go:14
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-raft
  namespace: default
spec:
  intent: This context exists so that the raft external tests have a reusable, cluster-agnostic
    assertion for Raft configuration state instead of each test spelling out the sys/storage/raft/configuration
    parse and leader checks itself. The helper parameterizes the cluster as a testcluster.VaultCluster,
    so any cluster implementation the test suite builds can be handed to it, and it
    derives the expected membership from cluster.Nodes() rather than from a literal
    list, which keeps the expectation correct as the node count changes. The two test
    files exist to invoke that helper (TestRaft_Configuration) and to exercise autopilot
    behavior against the same cluster shape; the context is defined by the shared
    assertion, not by the individual test names.
  interfaces:
  - file: third_party/openbao/internal/vault/external_tests/raft/raft.go
    kind: function
    name: Raft_Configuration_Test
    signature: func Raft_Configuration_Test(t *testing.T, cluster testcluster.VaultCluster)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/raft/raft.go
    - file:third_party/openbao/internal/vault/external_tests/raft/raft_autopilot_test.go
    - file:third_party/openbao/internal/vault/external_tests/raft/raft_test.go
    id: r.helper-reused-by-suite
    level: SHOULD
    text: 'The assertion lives in raft.go and is driven from the package''s test files:
      raft_test.go calls Raft_Configuration_Test from TestRaft_Configuration, so the
      helper stays free of test-registration side effects and remains callable by
      other tests in third_party/openbao/internal/vault/external_tests/raft/raft_autopilot_test.go
      and raft_test.go.'
  - codeRefs:
    - function:3a883b33c1bea1968582334abdc0aae3
    id: r.leader-is-core-0
    level: MUST
    text: For every server entry in secret.Data["config"]["servers"], the helper reads
      node_id and leader; the entry whose node_id is core-0 must have leader true,
      and every other entry must have leader false. A violation fails the test with
      t.Fatalf carrying the offending server value.
  - codeRefs:
    - function:3a883b33c1bea1968582334abdc0aae3
    id: r.membership-matches-node-count
    level: MUST
    text: The helper builds the set of observed node_id values and an expected set
      of names core-0 through core-(N-1), where N is len(cluster.Nodes()), and fails
      the test when deep.Equal between the two sets returns a non-empty diff, reporting
      the diff with t.Fatalf.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/raft/raft.go
    - function:3a883b33c1bea1968582334abdc0aae3
    id: r.reads-raft-configuration
    level: MUST
    text: Raft_Configuration_Test takes a *testing.T and a testcluster.VaultCluster,
      takes the API client of the cluster's first node via cluster.Nodes()[0].APIClient(),
      and reads the path sys/storage/raft/configuration with Logical().Read; a read
      error is reported with t.Fatal and stops the test.
  upstream: self
