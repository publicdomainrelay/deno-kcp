apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki-addon-components-page
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'The context exists so that the PKI addon''s page components are specified
    as a unit: what each page class is, which action methods it exposes, and what
    those methods must do when a user downloads a certificate, revokes it, edits or
    deletes configuration, generates or rotates an issuer, imports an issuer, deletes
    a key or role, navigates from the overview, or watches tidy state. It anchors
    the page layer of the vendored OpenBao UI PKI addon inside this repository so
    that downstream consumers and tests can refer to the exported component and method
    identities without depending on the rest of the OpenBao UI tree.'
  requirements:
  - id: r.certificate-details-page
    level: MUST
    text: PkiCertificateDetailsComponent MUST declare flashMessages and download services.
      downloadCert MUST strip whitespace and colon runs from the model's serialNumber
      to form the download file name, pass that name together with the model certificate
      to the download service's pem method, and flash an info message that the download
      started; on failure it MUST flash a danger message using errorMessage(err, 'Unable
      to prepare certificate for download.'). revoke MUST be a @task wrapped in @waitFor,
      MUST save the model (the adapter's updateRecord is what calls the revoke endpoint),
      flash success 'The certificate has been revoked.', and invoke the optional args.onRevoke
      callback; on failure it MUST flash a danger message 'Could not revoke certificate.
      See OpenBao logs for details.'
    codeRefs:
    - class:042af804a1152d09b5f3aa40ee17bd89
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-certificate-details.ts
    - method:3f8f9868e2c774e395d7301cd3df7f87
    - method:b1011d685e033c8e820a3078ff7eec8d
  - id: r.component-service-injection
    level: MUST
    text: Every page component in this context MUST extend the Ember Component base
      class and obtain store, flash-messages, download, version and host-router capabilities
      through injected services rather than constructing them, so the pages stay testable
      and route-scoped.
    codeRefs:
    - class:03443fa317a40c9720cceb2702dd9e6d
    - class:042af804a1152d09b5f3aa40ee17bd89
    - class:6ab8b4d3a63582a85d8733677ce9836f
    - class:783a6b16e07971cc5af21c44644f4421
    - class:9cae3ec33a0743a8dd6ca475f3fc9707
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-certificate-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-edit.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configure-create.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-edit.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-generate-intermediate.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-generate-root.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-import.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-rotate-root.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-key-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-overview.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-role-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-tidy-status.ts
  - id: r.configuration-details-delete-all-issuers
    level: MUST
    text: PkiConfigurationDetails MUST declare store, host-router, flashMessages and
      version services and a tracked showDeleteAllIssuers flag. deleteAllIssuers MUST
      await the pki/issuer adapter's deleteAllIssuers for args.backend, flash success
      'Successfully deleted all issuers and keys', clear the confirmation flag, and
      transition to the vault.cluster.secrets.backend.pki.configuration.index route;
      on error it MUST clear the flag and flash the error message.
    codeRefs:
    - class:783a6b16e07971cc5af21c44644f4421
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-details.ts
    - method:31982a1aecc0be5e2dd39860838d94b9
  - id: r.configuration-edit-actions
    level: MUST
    text: PkiConfigurationEditComponent MUST expose a save action taking an Event,
      a cancel action taking no arguments, and a handleTtl action taking a FormField
      attribute plus a TtlEvent so that TTL fields are kept in step before the configuration
      is persisted or the edit is abandoned.
    codeRefs:
    - class:6ab8b4d3a63582a85d8733677ce9836f
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-edit.ts
    - method:5584db6d2eef83e700f582f107a0f0f5
    - method:c43e6500c5409e6069d4fd358493fa19
    - method:e04e6c513b53b87a45ad3cd1dba9917c
  - id: r.configure-create-types
    level: MUST
    text: PkiConfigureCreate MUST expose a configTypes getter that supplies the selectable
      PKI configuration types the create flow offers to the user.
    codeRefs:
    - class:fe0c392a1135c1dbe649fc75db66b747
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configure-create.ts
    - method:48b6b8fa20dc92d53ea5723c01139284
  - id: r.flash-message-error-reporting
    level: SHOULD
    text: Destructive and download actions on these pages SHOULD report failure through
      the flash-messages service's danger channel with a caller-supplied fallback
      string rather than letting the exception escape the component action.
    codeRefs:
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-certificate-details.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-details.ts
    - method:31982a1aecc0be5e2dd39860838d94b9
    - method:3f8f9868e2c774e395d7301cd3df7f87
    - method:b1011d685e033c8e820a3078ff7eec8d
  - id: r.host-router-transitions
    level: SHOULD
    text: Page components that finish a workflow SHOULD leave the screen through the
      injected host-router service (transitionTo) rather than mutating route state
      directly, as PkiConfigurationDetails does after deleting all issuers.
    codeRefs:
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-configuration-details.ts
    - method:31982a1aecc0be5e2dd39860838d94b9
  - id: r.issuer-details-parsing-errors
    level: MUST
    text: PkiIssuerDetailsComponent MUST expose a parsingErrors getter so the issuer
      details page can surface certificate parsing problems to the user rather than
      failing silently.
    codeRefs:
    - class:65429ed003be2a7085ca65ca1dab4f75
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-details.ts
    - method:11db9fa769e4457d918b5bb385d2d15b
  - id: r.issuer-edit-actions
    level: MUST
    text: 'PkiIssuerEditComponent MUST take owner and Args in its constructor and
      MUST expose toDetails and cancel actions that leave the edit screen, a setUsage(value:
      string) action that sets the issuer usage from a string, and a save action taking
      an Event that persists the edited issuer. These actions MUST be the only mutation
      surface for the issuer edit form.'
    codeRefs:
    - class:99b26cd67379da25566a3bfa47fef7ac
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-edit.ts
    - method:2a84b75298df704d66a42e39a77e0868
    - method:58bc8e7c47aed0494960cf7032887a3c
    - method:78c63f0d66c1cbb99eebc15f5133e114
    - method:baed083c37ede026e1ed23979af403f4
    - method:c0d8304dd633427e6dc631d3c35a02ef
  - id: r.issuer-generate-screens
    level: MUST
    text: 'The issuer generation screens MUST exist as three separate page components:
      PagePkiIssuerGenerateIntermediateComponent for intermediates, PagePkiIssuerGenerateRootComponent
      for roots, and PagePkiIssuerImportComponent for importing an existing issuer,
      so that each generation path has its own route-level component.'
    codeRefs:
    - class:30c1b23d75e18f095846bd4627b3ac62
    - class:84ac2e01971c3c0d27bfcd3b3e07d328
    - class:f09c6133fe4aca09ede0a3598fe048ac
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-generate-intermediate.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-generate-root.ts
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-import.ts
  - id: r.issuer-rotate-root-actions
    level: MUST
    text: 'PagePkiIssuerRotateRootComponent MUST expose generateOptions and displayFields
      accessors that describe the rotate-root form, a checkFormValidity action used
      to gate submission, a save action taking an Event that performs the rotation,
      and fetchDataForDownload(format: string) that fetches the generated material
      in the requested format for download.'
    codeRefs:
    - class:a5128d01d2f16e2290fdea94e6dc1f8d
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-issuer-rotate-root.ts
    - method:1db87298f78d14e7c853654c52f24e6f
    - method:3ee0ce017d7808870b007d869ce43b68
    - method:a290e3ac97d9d4daadf8399fd3e7f82f
    - method:ac4708ea3c940c0c95bffd4d16c48981
    - method:db923ac87fd205fe9c0e786bc776d838
  - id: r.key-details-delete
    level: MUST
    text: PkiKeyDetails MUST expose a deleteKey action that removes the key shown
      on the key details page.
    codeRefs:
    - class:e6f53d9f3f2fdd5456126bc18cd06ac6
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-key-details.ts
    - method:9e72ddde964c47a4f1bef797da46b921
  - id: r.overview-navigation-and-input
    level: MUST
    text: 'PkiOverview MUST expose transitionToViewCertificates, transitionToIssueCertificates
      and transitionToIssuerDetails actions that route from the overview to the certificates,
      issue-certificate and issuer-details screens, plus handleRolesInput(roles: string),
      handleCertificateInput(certificate: string) and handleIssuerSearch(issuers:
      string) actions that accept user input and drive the corresponding role lookup,
      certificate lookup and issuer search.'
    codeRefs:
    - class:9cae3ec33a0743a8dd6ca475f3fc9707
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-overview.ts
