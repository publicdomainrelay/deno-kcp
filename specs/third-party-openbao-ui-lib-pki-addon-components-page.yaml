    - method:7b5bdb0477d4375629c693412971f8db
    - method:ca050b0960369e0a161df4c69a051ade
  - id: r.tidy-status-reporting
    level: MUST
    text: PkiTidyStatusComponent MUST expose a tidyState getter reporting the current
      tidy run state, a hasTidyConfig getter reporting whether a tidy configuration
      exists, a tidyStateAlertBanner getter that maps the tidy state to the alert
      banner shown to the user, and a cancelTidy action that cancels a running tidy
      operation.
    codeRefs:
    - class:03443fa317a40c9720cceb2702dd9e6d
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-tidy-status.ts
