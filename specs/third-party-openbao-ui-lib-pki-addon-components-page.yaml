    - method:ae5eebd185306bd12081420aa3945ffe
    - method:f5bd04459a4239cc47858712fd621afa
  - id: r.role-details-page
    level: MUST
    text: The role details page class DetailsPage MUST expose a breadcrumbs getter
      for the role route trail, an arrayAttrs getter that marks which role attributes
      are rendered as arrays, and a deleteRole action that deletes the role from the
      details screen.
    codeRefs:
    - class:644b8fc180d7bcafa46548dd7df9946b
    - file:third_party/openbao/ui/lib/pki/addon/components/page/pki-role-details.ts
