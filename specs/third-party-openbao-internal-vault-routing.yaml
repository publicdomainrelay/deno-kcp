    id: r.mount-table-lookup-and-mutation
    level: MUST
    text: MountTable resolves entries by path, by backend UUID and by namespace, returns
      an error when a lookup has no match, deletes the entry at a path and returns
      it from Remove, marks the entry at a namespace and path as tainted through SetTaint,
      and supports a ShallowClone that copies the table without deep-copying its entries.
