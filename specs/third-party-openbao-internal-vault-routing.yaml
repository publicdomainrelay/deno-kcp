kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-routing
  namespace: default
spec:
  intent: 'This context exists so the routing layer of the vendored OpenBao tree can
    be described and reasoned about on its own: how mounts are registered, looked
    up, tainted, remounted and removed, how a request path is matched to a backend,
    and how unauthenticated login paths are parsed into radix trees. It gives the
    specification a single place to state the invariants the router must keep, because
    the surrounding vault core calls into these functions on every request and on
    every mount change.'
