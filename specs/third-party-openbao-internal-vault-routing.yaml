    id: r.mount-entry-api-path
    level: MUST
    text: MountEntry.APIPath returns the namespace path joined with the mount path,
      prefixed with CredentialRoutePrefix when the entry's Table is CredentialTableType;
      MountEntry.APIPathNoNamespace returns the same path without the namespace prefix.
  - codeRefs:
