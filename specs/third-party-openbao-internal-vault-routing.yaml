    id: r.mount-entry-deep-clone
    level: MUST
    text: MountEntry.Clone returns a deep copy of the mount entry made through copystructure,
      and returns the copy error instead of a partial entry when the copy fails.
  - codeRefs:
    - file:third_party/openbao/internal/vault/routing/mount_entry.go
    - method:3c3190192be061f1c6343c2818263c34
    id: r.mount-entry-mount-class
    level: MUST
    text: MountEntry.MountClass returns the empty string when the entry has no accessor
      or its path is under the system mount path prefix, returns the credential plugin
      type for credential-table entries, and the secrets plugin type for all other
      entries.
  - codeRefs:
