    id: r.router-identity-lookups
    level: MUST
    text: Router.MatchingMountByUUID and Router.MatchingMountByAccessor return the
      mount entry for a barrier UUID and for a human-readable accessor respectively,
      Router.MatchingMountByAPIPath returns the API path of the matching mount, Router.ValidateMountByAccessor
      returns a ValidateMountResponse for an accessor, and Router.MountConflict reports
      the conflicting mount path for a proposed path.
