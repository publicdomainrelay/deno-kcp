    id: r.router-mount-lifecycle
    level: MUST
    text: Router.Mount registers a logical backend at a prefix together with its mount
      entry and storage view and fails on a conflicting prefix, Router.Unmount removes
      the route at a prefix, Router.Remount moves a route from source to destination
      while running a callback on the moved entry, and Router.Taint and Router.Untaint
      flip the taint flag of the route at a path.
