    id: r.mount-config-structs
    level: MUST
    text: MountConfig, APIMountConfig, UserLockoutConfig and APIUserLockoutConfig
      carry the per-mount settings that travel with a MountEntry, each field tagged
      for json, structs and mapstructure decoding so the same config round-trips through
      storage, command-line and HCL paths, and ListingVisibilityType names the allowed
      listing visibility values.
