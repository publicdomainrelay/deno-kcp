    id: r.mount-table-delta-and-order
    level: MUST
    text: MountTable.Delta compares the receiver against a new table and reports the
      additions and the deletions between them, and the sort helpers order a table
      by path, with the depth variant putting deeper paths first so longest-prefix
      matching works.
  - codeRefs:
