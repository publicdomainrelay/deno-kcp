    id: r.mount-entry-cache-refresh
    level: SHOULD
    text: MountEntry.SyncCache refreshes the synthesized config cache of the entry
      so audit key lists and similar derived values are read without recomputing them
      on every request, and MountEntry.IsExternalPlugin reports whether the entry's
      backend is an external plugin.
  - codeRefs:
