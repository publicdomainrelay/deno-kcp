    id: r.router-path-matching
    level: MUST
    text: Router.MatchingMount and Router.MatchingPrefixInternal return the longest
      matching mount prefix for a request path, Router.MatchingMountEntry, Router.MatchingBackend
      and Router.MatchingSystemView return the backend objects registered for that
      prefix, and the storage lookups translate an API or storage path into the matching
      logical.Storage, with MatchingStoragePrefixByAPIPath and MatchingAPIPrefixByStoragePath
      reporting the prefixes in both directions.
