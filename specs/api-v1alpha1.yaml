apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: api-v1alpha1
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.deno-kcp
  intent: 'This context exists because the CRD types are the contract between the
    deno-kcp controllers and everything outside them: clients, informers and the denospec
    library all read these structs, so their field shape, phase vocabulary and deep-copy
    semantics must stay fixed and reviewable in one place. denospec.go is the bridge
    that keeps the Kubernetes-facing spelling of permissions and service accounts
    from drifting away from the library''s own types.'
  requirements:
  - id: r.deepcopy-implements-runtime-object
    level: MUST
    text: Every kind and list carries generated DeepCopyInto, DeepCopy and DeepCopyObject
      methods so it satisfies runtime.Object and can be cached by informers, and the
      copies must not alias any nested map, slice or pointer from the source object.
    codeRefs:
    - file:api/v1alpha1/deno_types_test.go
    - file:api/v1alpha1/zz_generated.deepcopy.go
  - id: r.group-version-registers-all-kinds
    level: MUST
    text: The package registers one group/version and adds every custom kind (DenoJob,
      DenoPod, DenoRun, OpenBao, PolicyEngine, PolicyWorkflowPod, PolicyWorkflowRun,
      RunTrigger) to its scheme, so a controller can build a client for any of them.
    codeRefs:
    - file:api/v1alpha1/groupversion_info.go
    - struct:8592ae201b80a86fa2aea2b4ff73a6a7
    - struct:9f31aa5c4a5874f591d074bb6f87c0d7
    - struct:ad8c97baa6157384096c06159cfb2dbe
  - id: r.kinds-pair-spec-status-and-list
    level: MUST
    text: Every custom kind pairs a Spec holding the desired state with a Status holding
      observed state, and ships a List companion, so controllers and clients can reconcile
      and enumerate each resource.
    codeRefs:
    - file:api/v1alpha1/types_denojob.go
    - file:api/v1alpha1/types_denopod.go
    - file:api/v1alpha1/types_denorun.go
    - file:api/v1alpha1/types_openbao.go
    - file:api/v1alpha1/types_policyengine.go
    - file:api/v1alpha1/types_policyworkflowpod.go
    - file:api/v1alpha1/types_policyworkflowrun.go
    - file:api/v1alpha1/types_runtrigger.go
  - id: r.permissions-convert-to-denospec
    level: MUST
    text: DenoPermissions.DenoSpec converts the CRD permission set into a denospec.Permissions
      value, copying the scalar flags directly and routing each per-resource permission
      through the DenoPermission converter; a nil receiver yields nil instead of panicking.
    codeRefs:
    - file:api/v1alpha1/denospec.go
    - method:4853a11212ee93729970106d66fe9a6c
    - struct:da40f37a9ba38a5f2a353dd41f480892
    - struct:e95b0c824023d610cd8dd79e9b10330c
  - id: r.service-account-converts-to-denospec
    level: MUST
    text: ServiceAccountRef.DenoSpec converts the reference into a denospec.ServiceAccountRef
      carrying Name and Namespace, and returns nil for a nil receiver so a missing
      service account stays distinguishable from an empty one.
    codeRefs:
    - file:api/v1alpha1/denospec.go
    - method:3846c936f898af39cc3e185598df8409
    - struct:05cdd79e23617fbecdb398d34c9d5ad7
  - id: r.shared-types-single-source
    level: MUST
    text: Permission, service-account, pod-template, exec-probe, restart-policy and
      concurrency-policy types live once in types_shared.go and are embedded by the
      workload kinds, so those shapes have a single definition that all kinds inherit.
    codeRefs:
    - file:api/v1alpha1/types_shared.go
    - struct:05cdd79e23617fbecdb398d34c9d5ad7
    - struct:a6b2c82ee80cb3d8639351da73b016d6
    - struct:b1b033afbaf6fab9e420675da77463a6
    - type_alias:f1737f67a27a8469e8d83ac7bc87a249
    - type_alias:f821022f3e38a5407c14bb767eba914b
  - id: r.status-reports-a-phase
    level: MUST
    text: Each kind's status reports its lifecycle through a dedicated phase type,
      giving DenoJob, DenoPod, DenoRun, OpenBao-era workloads, PolicyEngine, PolicyWorkflowPod,
      PolicyWorkflowRun and RunTrigger a shared vocabulary of states that other code
      can switch on.
    codeRefs:
    - struct:78eecda4a2199493218816c567945e6d
    - struct:c8831499bb53beff7d2fc49579535570
    - type_alias:0e2883e159e4826141f3b8dbf5a8951d
    - type_alias:3228acbcc876296a83b038db20f5ba53
    - type_alias:71e9ec98b426f5ba2a6f0fa861505f90
    - type_alias:95711bd9c109c1c963d90415abeb221a
    - type_alias:b301d0b47a8b87747f72eb4dd29c1213
    - type_alias:cb7db6e321bd704e6960895aa2922ada
    - type_alias:f1812e2547cdacd2b9d3b0c4591ef2e2
  - id: r.tests-pin-copy-and-absence-semantics
    level: SHOULD
    text: Tests assert that a deep copy of a kind shares no backing storage with its
      original and that an absent service-account reference is distinguishable from
      a present but zero-valued one, since both properties are silent failures when
      they regress.
    codeRefs:
    - file:api/v1alpha1/deno_types_test.go
    - file:api/v1alpha1/types_test.go
