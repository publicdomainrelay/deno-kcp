    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: ClusterSetupMutator
    kind: type
    signature: type ClusterSetupMutator func(*vault.CoreConfig, *vault.TestClusterOptions)
    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
