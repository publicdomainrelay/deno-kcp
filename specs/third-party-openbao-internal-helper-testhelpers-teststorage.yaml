    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: InmemLatentBackendSetup
    kind: function
    signature: func InmemLatentBackendSetup(conf *vault.CoreConfig, opts *vault.TestClusterOptions)
    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: MakeFileBackend
    kind: function
    signature: func MakeFileBackend(t testing.T, logger hclog.Logger) *vault.PhysicalBackendBundle
    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: MakeInmemBackend
    kind: function
    signature: func MakeInmemBackend(t testing.T, logger hclog.Logger) *vault.PhysicalBackendBundle
    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: MakeLatentInmemBackend
    kind: function
    signature: func MakeLatentInmemBackend(t testing.T, logger hclog.Logger) *vault.PhysicalBackendBundle
    file: third_party/openbao/internal/helper/testhelpers/teststorage/teststorage.go
  - name: MakeRaftBackend
