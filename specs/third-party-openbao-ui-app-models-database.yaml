apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/app/models/database/connection.js connection.js@third_party/openbao/ui/app/models/database/connection.js
- file:third_party/openbao/ui/app/models/database/credential.js credential.js@third_party/openbao/ui/app/models/database/credential.js
- file:third_party/openbao/ui/app/models/database/role.js role.js@third_party/openbao/ui/app/models/database/role.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-models-database
  namespace: default
spec:
  intent: 'This context exists so the UI database models can be described and regenerated
    as a unit: the connection form, the role form and the credential read-model that
    the database secrets engine routes render. It records the attribute surfaces each
    model must declare, the plugin-name-driven field derivation that makes one connection
    model serve every supported database plugin, the special-casing that hides revocation
    statements for elasticsearch, and the capability aliases templates read instead
    of calling the API directly.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/connection.js
    id: r.connection-attributes
    level: MUST
    text: The database connection model must declare connection attributes covering
      the required name and plugin_name, the common connection_url, url, username
      and password, the optional TLS material (ca_cert, ca_path, client_cert, client_key,
      tls, tls_ca, tls_server_name), host/hosts/port, pool limits (max_open_connections
      default 4, max_idle_connections default 0, max_connection_lifetime default '0s'),
      verify_connection defaulting to true, insecure defaulting to false, password_policy,
      username_template, write_concern and root_rotation_statements; backend and allowed_roles
      are read-only.
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/connection.js
    id: r.connection-capabilities
    level: MUST
    text: 'The connection model must expose capabilities through lazyCapabilities
      paths so templates can gate actions: canEdit and canDelete alias the update
      and delete rights on `${backend}/config/${id}`, canReset covers update-or-create
      on `${backend}/reset/${id}`, canRotateRoot covers update-or-create on `${backend}/rotate-root/${id}`,
      and canAddRole covers create on either `${backend}/role/*` or `${backend}/static-role/*`.'
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/connection.js
    id: r.connection-plugin-metadata
    level: MUST
    text: 'The connection model must derive its form metadata from the plugin selected
      in plugin_name: isAvailablePlugin reports whether plugin_name matches an entry
      in AVAILABLE_PLUGIN_TYPES, showAttrs returns the expanded metadata of that plugin''s
      non-hidden fields plus allowed_roles, fieldAttrs falls back to plugin_name,
      name, connection_url, verify_connection and password_policy when no plugin is
      chosen and otherwise uses the plugin''s ungrouped fields, pluginFieldGroups
      groups the plugin''s pluginConfig fields by subgroup (naming an absent subgroup
      ''default'') and returns null when plugin_name is empty, and statementFields
      returns the plugin''s statements-group fields or just root_rotation_statements
      when plugin_name is empty.'
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/credential.js
    id: r.credential-fields
    level: MUST
    text: The credential model must be a flat Ember Data model declaring the generated-credential
      response fields username, password, leaseId, leaseDuration, lastVaultRotation,
      rotationPeriod, ttl and roleType as attributes, with no computed properties
      or capability paths.
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/role.js
    id: r.role-capabilities
    level: MUST
    text: 'The role model must expose capability aliases over lazyCapabilities paths:
      canEditRole and canDelete from `${backend}/${path}/${id}`, canCreateDynamic
      from `${backend}/roles/+`, canCreateStatic from `${backend}/static-roles/+`,
      canGenerateCredentials from read on `${backend}/creds/${id}`, canGetCredentials
      from read on `${backend}/static-creds/${id}`, canUpdateDb from update on `${backend}/config/${database[0]}`,
      and canRotateRoleCredentials from update on `${backend}/rotate-role/${id}`.'
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/role.js
    id: r.role-form-fields
    level: MUST
    text: 'The role model must compute its form metadata: fieldAttrs covers name,
      database and type for the create and edit form; showFields covers name, database,
      type, the type-specific fields returned by getRoleFields and creation_statements,
      and appends revocation_statements only when the selected connection is not ''elasticsearch'';
      roleSettingAttrs expands the full role-settings field list, including the JSON-edit
      creation_statement and revocation_statement, and leaves the choice of which
      to display to DatabaseRoleSettingForm.'
  - codeRefs:
    - file:third_party/openbao/ui/app/models/database/role.js
    id: r.role-id-prefix-and-attributes
    level: MUST
    text: The database role model must set idPrefix to 'role/' and declare a read-only
      backend, the role name, a searchSelect database attribute limited to one existing
      database/connection model, a no-default type limited to 'static' or 'dynamic',
      default_ttl defaulting to '1h', max_ttl defaulting to '24h', username, rotation_period
      defaulting to '24h', and array attributes for creation_statements, revocation_statements,
      rotation_statements, rollback_statements and renew_statements plus the JSON-edit
      creation_statement and revocation_statement variants.
  upstream: self
