kind: SystemContext
metadata:
  name: third-party-openbao-internal-physical-pebbledb
  namespace: default
spec:
  intent: This context exists so the OpenBao physical storage layer has a PebbleDB-backed
    implementation with real interactive transactions. The package adapts Pebble's
    non-interactive, snapshot-based API to the physical.Backend and physical.TransactionalBackend
    contracts, including the conflict detection and rollback semantics those contracts
    promise. It exists because Pebble offers no check-and-set primitive of its own;
    rather than taking a global write lock, the code tracks each transaction's reads,
    writes and list results and invalidates on conflicts, so parallel writers can
    proceed until an actual overlap is proven.
