apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/add.js
  add.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/add.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/edit.js
  edit.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/edit.js
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
  index.js@third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-identity-aliases
  namespace: default
spec:
  intent: This context exists to pin down the behavior of the identity-alias add,
    edit and list controllers in the OpenBao UI, so that the create/edit forms' reuse
    of the shared identity create controller with an alias-specific show route, and
    the alias list's filtering, pagination params and reload behavior, stay specified
    independently of the templates and routes that consume them.
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/add.js
    id: r.add-controller-extends-create
    level: MUST
    text: The alias add controller extends the shared identity create controller imported
      from '../create' and sets showRoute to the route name 'vault.cluster.access.identity.aliases.show',
      so a successful creation navigates to the alias show route.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/edit.js
    id: r.edit-controller-extends-add
    level: MUST
    text: The alias edit controller extends the alias add controller with no further
      overrides, inheriting its create form behavior and the alias show route.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
    id: r.filter-matches-key
    level: MUST
    text: 'The list controller computes filterMatchesKey from filter and model: it
      is true only when the model is non-empty and contains an item whose id equals
      the current filter.'
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
    id: r.first-partial-match
    level: MUST
    text: The list controller computes firstPartialMatch by escaping the filter with
      escape-string-regexp, anchoring it at the start of item ids, and returning null
      when the filter exactly matches a key or nothing matches; otherwise it returns
      the single matching item, or an object with the model's shared prefix from core/utils/common-prefix
      when the filter already equals that prefix.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
    id: r.list-actions
    level: MUST
    text: 'The list controller actions set the filter, set the filter focus flag,
      and reload the list: setFilter and setFilterFocus write their argument to filter
      and filterFocused, while refresh and onDelete both send ''reload'' to the parent
      list route.'
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/identity/aliases/index.js
    id: r.list-query-params
    level: MUST
    text: The alias list controller binds query params page to 'page' and pageFilter
      to 'pageFilter', defaults page to 1 and pageFilter to null, and exposes filter,
      filterFocused (false) and isLoading (false) as its remaining state.
  upstream: self
