  requirements:
  - codeRefs:
    - method:9eff9c5894c27395cd43737fb5d364a4
    - struct:aac12544428d4d44fc72971986a2d518
    id: r.initialize-deferred
    level: MUST
    text: PluginBackend.Initialize must be a no-op returning nil, because the real
      backend Initialize is called explicitly by startBackend with the request storage
      after the plugin process starts.
  - codeRefs:
    - method:1d5b59bbcacffc0d501f10e5157bc440
    - method:25485adf3c6948547038555a16260759
    - method:e9311d1022b961fc21571d99db324f56
    id: r.lazy-load-on-request
    level: MUST
    text: HandleRequest and HandleExistenceCheck must route through lazyLoadBackend,
      which starts the plugin under the write lock only when loaded is false, re-checking
      loaded after the lock upgrade so concurrent first requests start the plugin
      once.
  - codeRefs:
    - function:279285827f28c5fefc4e75c39b7fc39b
    - struct:aac12544428d4d44fc72971986a2d518
    id: r.metadata-mode-probe
    level: MUST
    text: Backend must start the plugin with bplugin.NewBackendWithVersion in metadata
      mode (isMetadataMode true), read its SpecialPaths, Type and, when it implements
      logical.PluginVersioner, its PluginVersion().Version, then Cleanup the probe
      process and install a placeholder framework.Backend carrying those paths, type
      and running version so the plugin is not yet loaded.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/plugin/backend.go
    - struct:aac12544428d4d44fc72971986a2d518
    id: r.mismatch-guard
    level: MUST
    text: While the backend has not yet been loaded, startBackend must refuse a plugin
      whose Type differs from the metadata probe (ErrMismatchType) or whose SpecialPaths
      are not reflect.DeepEqual to the probe (ErrMismatchPaths), cleaning up the new
      process, logging a warning with the plugin name and error, and returning the
      sentinel error.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/plugin/backend.go
    - function:54cad82c274bb42c350b1fc292eccfd2
    id: r.plugin-name-required
    level: MUST
    text: Factory must reject a config that has no "plugin_name" key, returning the
      error "plugin_name not provided" before attempting to start any backend.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/plugin/backend.go
    - function:279285827f28c5fefc4e75c39b7fc39b
    id: r.plugin-type-parsed
    level: MUST
    text: Both Factory/Backend and startBackend must parse conf.Config["plugin_type"]
      with consts.ParsePluginType and return that error unchanged when the type string
      is invalid.
  - codeRefs:
    - method:eb22d417068f282674a039b8d17d06a4
    - struct:aac12544428d4d44fc72971986a2d518
    id: r.plugin-version-delegation
    level: MUST
    text: PluginVersion must return the wrapped backend's PluginVersion when it implements
      logical.PluginVersioner, and logical.EmptyPluginVersion otherwise; PluginBackend
      must satisfy logical.PluginVersioner via a compile-time assertion.
  - codeRefs:
    - method:1827cfcd152d3afd0a38f2a6e8f0fc68
    - method:1d5b59bbcacffc0d501f10e5157bc440
    - method:2ca5bfb1f82e31c97888163ed21ba51a
    - method:5720d926d077fea76c8590513e3d5138
    - method:5dbccf29070dfb9dc7c08eea2b372bb7
    - method:740d924e05ea66e53ffa1d14d8a26c4e
    - method:dccf4dff09449e12f867f360073b5537
    id: r.read-locked-accessors
    level: MUST
    text: SpecialPaths, System, Logger, Cleanup, InvalidateKey, Setup and Type must
      each take the PluginBackend read lock for the duration of the delegated call
      so the wrapped backend pointer can be swapped under lock without races.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/plugin/backend.go
    - method:1d5b59bbcacffc0d501f10e5157bc440
    id: r.reload-on-shutdown
    level: MUST
    text: When a wrapped call fails with rpc.ErrShutdown or bplugin.ErrPluginShutdown,
      lazyLoadBackend must restart the plugin once, guarded by comparing the captured
      canary against the current UUID canary so only the first observer reloads, then
      retry the method wrapper exactly once.
  - codeRefs:
    - method:1d5b59bbcacffc0d501f10e5157bc440
    - method:5dbccf29070dfb9dc7c08eea2b372bb7
    id: r.setup-delegates
    level: SHOULD
    text: Setup must delegate to the currently wrapped backend under the read lock,
      so a plugin that is already loaded receives the backend config directly.
  - codeRefs:
    - function:279285827f28c5fefc4e75c39b7fc39b
    - function:54cad82c274bb42c350b1fc292eccfd2
    id: r.v5-then-v1-fallback
    level: MUST
    text: 'Factory must first call v5.Backend and, on success, Setup and return it;
      when the v5 backend fails it must fall back to Backend, accumulate both errors
      in a multierror, and if the fallback also fails return an error of the form
      "invalid backend version: <multierror>".'
  upstream: self
