kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-plugin
  namespace: default
spec:
  intent: This context exists so OpenBao can mount a plugin as a builtin logical backend
    without paying plugin startup cost until the mount is first used. It resolves
    a plugin by name, type and version from the backend config, validates at load
    time that the lazily started plugin still matches the type and special paths observed
    in metadata mode, and survives plugin crashes by relaunching and retrying the
    failed method exactly once.
  interfaces:
  - file: third_party/openbao/internal/builtin/plugin/backend.go
    kind: function
    name: Backend
    signature: func Backend(ctx context.Context, conf *logical.BackendConfig) (*PluginBackend,
      error)
  - file: third_party/openbao/internal/builtin/plugin/backend.go
    kind: function
    name: Factory
    signature: func Factory(ctx context.Context, conf *logical.BackendConfig) (logical.Backend,
      error)
  - file: third_party/openbao/internal/builtin/plugin/backend.go
    kind: struct
    name: PluginBackend
    signature: type PluginBackend struct { Backend logical.Backend; sync.RWMutex;
      config *logical.BackendConfig; canary string; loaded bool }
  - file: third_party/openbao/internal/builtin/plugin/backend.go
    kind: method
    name: PluginBackend.Cleanup
    signature: func (b *PluginBackend) Cleanup(ctx context.Context)
  - file: third_party/openbao/internal/builtin/plugin/backend.go
