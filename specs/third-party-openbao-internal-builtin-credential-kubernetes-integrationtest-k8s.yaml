apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-credential-kubernetes-integrationtest-k8s
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists to give integration tests of the Kubernetes auth backend
    a way to talk to a Vault/OpenBao instance that runs inside a Kubernetes pod. Because
    the container is not reachable directly from the test host, the package provides
    the two primitives the tests need: an authenticated clientset built from a caller-named
    kubeconfig context, and a port-forward that exposes the pod''s Vault port 8200
    on a free local port, together with a close function so the tunnel can be torn
    down. Both helpers share the same kubeconfig resolution path, and every failure
    is returned as a wrapped error naming the step that failed, so a broken test setup
    reports where it broke.'
  requirements:
  - id: r.client-from-kube-context
    level: MUST
    text: ClientFromKubeConfig must get its REST config from kubeConfig(kubeContext)
      and return a *kubernetes.Clientset built by kubernetes.NewForConfig, returning
      nil and the config error unwrapped if config loading fails, and nil with an
      error wrapping the cause as "failed to create client" if client construction
      fails.
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/client.go
    - function:fe4918691279e6a1d0666d8cef18d89f
  - id: r.kube-context-selection
    level: MUST
    text: Config resolution must select the kubeconfig context named by kubeContext,
      applied as CurrentContext on clientcmd.ConfigOverrides over clientcmd.NewDefaultClientConfigLoadingRules
      via clientcmd.NewNonInteractiveDeferredLoadingClientConfig, and a failure must
      surface as an error wrapping the cause as "failed to setup config".
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/client.go
  - id: r.port-forward-config-and-client
    level: MUST
    text: SetupPortForwarding must resolve its config through kubeConfig(kubeContext)
      and build its clientset with kubernetes.NewForConfig, returning local port 0,
      a nil close function and the config error unwrapped on config failure, and wrapping
      client construction failure as "failed to create client".
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
    - function:d25c5f13b828e6338775ee8d7712b2a2
  - id: r.port-forward-local-port-and-close
    level: MUST
    text: On readiness SetupPortForwarding must read the assigned port from forwarder.GetPorts,
      returning 0, nil and an error wrapping the cause as "failed to get forwarded
      ports" on failure, and on success return ports[0].Local as the local port together
      with a close function that sends on the stop channel and then calls forwarder.Close.
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
    - function:d25c5f13b828e6338775ee8d7712b2a2
  - id: r.port-forward-random-local-port
    level: MUST
    text: SetupPortForwarding must forward from a random free local port to port 8200
      in the target pod, passing the forwarding spec "0:8200" to portforward.New with
      a fresh stop channel, a fresh ready channel, io.Discard for output and os.Stderr
      for errors, and must return 0, nil and the error unwrapped if portforward.New
      fails.
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
    - function:d25c5f13b828e6338775ee8d7712b2a2
  - id: r.port-forward-ready-or-error
    level: MUST
    text: SetupPortForwarding must run forwarder.ForwardPorts in a goroutine that
      reports its error on a channel, and must select between that error channel and
      the ready channel; an error arriving before readiness must return local port
      0, a nil close function and an error wrapping the cause as "failed to start
      forwarding".
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
    - function:d25c5f13b828e6338775ee8d7712b2a2
  - id: r.port-forward-spdy-dialer
    level: MUST
    text: SetupPortForwarding must build the dialer over the pod's portforward subresource
      URL (RESTClient POST on Resource "pods", the given namespace and pod name, SubResource
      "portforward") using spdy.RoundTripperFor(config) and spdy.NewDialer with method
      POST on an http.Client carrying that transport, returning 0, nil and an error
      wrapping the cause as "failed to create transport" if the round tripper cannot
      be made.
    codeRefs:
    - file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
    - function:d25c5f13b828e6338775ee8d7712b2a2
  interfaces:
  - name: ClientFromKubeConfig
    kind: function
    signature: (kubeContext string) (*kubernetes.Clientset, error)
    file: third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/client.go
  - name: SetupPortForwarding
    kind: function
    signature: (kubeContext, namespace, pod string) (localPort int, close func(),
      err error)
    file: third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
codeRefIndex:
- file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/client.go
  client.go@third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/client.go
- file:third_party/openbao/internal/builtin/credential/kubernetes/integrationtest/k8s/portforward.go
