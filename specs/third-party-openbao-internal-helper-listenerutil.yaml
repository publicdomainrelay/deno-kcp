    id: r.acme-cert-getter
    level: MUST
    text: NewCertificateGetter returns a ReloadableCertGetter backed by an ACMECertGetter
      built from a configutil.Listener, a cli.Ui and an hclog.Logger. The getter implements
      Reload, GetCertificate, ALPNProtos, which reports the ALPN protocol list, HandleHTTPChallenge,
      which serves an HTTP-01 challenge request and reports whether it handled it,
      and Close, which releases the ACME client's resources.
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/bufconn.go
    - function:a82b61c4d5b2635503aaae5496eb6481
    id: r.bufconn-constructor
    level: MUST
    text: NewBufConnWrapper builds a BufConnWrapper from a supplied bufconn.Listener,
      holding that listener so Dial and DialContext can delegate to it.
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/bufconn.go
    - method:80950f0bf26ac573a83d76b841f108ac
    - method:abedc81857554c1e51b7a810322a28bd
    - struct:69069c4c5bdb6e0af39fb1a2d70de474
    id: r.bufconn-wrapper
    level: MUST
    text: BufConnWrapper wraps an existing *bufconn.Listener and exposes a Dial and
      DialContext that ignore the address arguments and dial the in-memory listening
      end, so callers such as consul-template's TransportDialer interface can open
      client connections to an in-process listener.
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/listener_test.go
    - file:third_party/openbao/internal/helper/listenerutil/tls_acme_test.go
    - file:third_party/openbao/internal/helper/listenerutil/tls_autoreload_test.go
    id: r.listener-tests
    level: MUST
    text: The package tests verify the unix socket config by creating a temporary
      socket, applying a UnixSocketsConfig with user, group and mode given both as
      names and as numeric ids, and asserting the resulting file permissions equal
      the requested mode.
