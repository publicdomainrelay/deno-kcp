    id: r.reloadable-cert-getter
    level: MUST
    text: 'ReloadableCertGetter is the interface TLS listeners depend on: Reload re-reads
      or re-acquires the certificate and GetCertificate serves it to a TLS handshake,
      so ACME-backed and file-backed rotation are interchangeable.'
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/listener.go
    - function:8d308b72974ac29a34f96bf99a2c94ea
    - struct:6ebe737b4dbbb5ee1564c516b701d770
    id: r.tls-config
    level: MUST
    text: TLSConfig derives a *tls.Config and a ReloadableCertGetter from a configutil.Listener,
      a properties map, a cli.Ui and an hclog.Logger, so server commands get both
      the TLS settings and the certificate source from one call.
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/tls_autoreload.go
    - function:5510d98d2ab4d1fbcff27a3dcc84253f
    - method:6f0874635cf31f04e9abb3bc6b8e4f12
    id: r.tls-reload-listener
    level: MUST
    text: NewTLSReloadListener decorates any net.Listener with a watcher over the
      given file paths that invokes the supplied reload function when those files
      change, polling every interval and logging through the supplied hclog.Logger,
      so rotated certificate files take effect without restarting the server. Closing
      the returned listener stops the watcher before closing the underlying listener.
  - codeRefs:
    - file:third_party/openbao/internal/helper/listenerutil/listener.go
    - function:ef7cace533196f8046df8aecdabca006
    - method:6fcfa9c9313be3dd282730630cc2ae71
    - struct:01f8eea6c1bc5ccb81a3105665bc2100
    id: r.unix-socket-listener
    level: MUST
    text: UnixSocketListener removes any pre-existing file at the given path, ignoring
      a not-exist result but failing on other removal errors, then listens on that
      unix path. When a UnixSocketsConfig is supplied it applies its User, Group and
      Mode to the socket file, accepting either numeric ids or names, and fails with
      a wrapped error if permissions cannot be set. The returned listener is an rmListener
      that deletes the socket file on Close.
