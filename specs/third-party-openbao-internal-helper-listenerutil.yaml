kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-listenerutil
  namespace: default
spec:
  intent: 'The context exists so that OpenBao''s command layer can construct listeners
    without owning the file-permission, TLS and certificate-reload mechanics. It factors
    out three concerns that every server command needs: connecting a client to an
    in-process bufconn, creating a unix-domain socket with correct ownership and mode
    that cleans up after itself, and producing a tls.Config whose certificates can
    be rotated either by an ACME client or by watching files on disk. Keeping these
    helpers in one package lets agent, proxy and server commands share identical listener
    semantics, and the ReloadableCertGetter interface lets ACME-backed and file-backed
    rotation be swapped without changing the TLS configuration code.'
