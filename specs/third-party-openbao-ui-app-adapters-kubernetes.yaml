apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:4ccde46e2def7df4b8568c996f3e847f KubernetesRoleAdapter@third_party/openbao/ui/app/adapters/kubernetes/role.js:9
- class:79c09b75c4ee536ddd9bf3addc6df266 KubernetesConfigAdapter@third_party/openbao/ui/app/adapters/kubernetes/config.js:9
- file:third_party/openbao/ui/app/adapters/kubernetes/config.js config.js@third_party/openbao/ui/app/adapters/kubernetes/config.js
- file:third_party/openbao/ui/app/adapters/kubernetes/role.js role.js@third_party/openbao/ui/app/adapters/kubernetes/role.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-adapters-kubernetes
  namespace: default
spec:
  intent: 'This context exists to specify the browser-side Kubernetes secrets engine
    integration of the bundled OpenBao UI: the read and write paths the UI uses against
    a Kubernetes mount, so the config singleton and the per-mount roles plus credential
    generation stay addressable and serializable. It records which HTTP verbs and
    URL shapes the adapters emit, how the backend mount path travels through query,
    snapshot and response objects, and which fields the models expect back, so the
    UI layer keeps working unchanged against the Kubernetes secrets engine API.'
  interfaces:
  - file: third_party/openbao/ui/app/adapters/kubernetes/config.js
    kind: class
    name: KubernetesConfigAdapter
    signature: class KubernetesConfigAdapter extends ApplicationAdapter
  - file: third_party/openbao/ui/app/adapters/kubernetes/role.js
    kind: class
    name: KubernetesRoleAdapter
    signature: class KubernetesRoleAdapter extends NamedPathAdapter
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:79c09b75c4ee536ddd9bf3addc6df266
    - file:third_party/openbao/ui/app/adapters/kubernetes/config.js
    id: r.config-check
    level: MUST
    text: KubernetesConfigAdapter.checkConfigVars GETs the 'check' subpath of the
      backend's config URL so the UI can verify the mount's configuration variables.
  - codeRefs:
    - class:79c09b75c4ee536ddd9bf3addc6df266
    - file:third_party/openbao/ui/app/adapters/kubernetes/config.js
    id: r.config-namespace
    level: MUST
    text: KubernetesConfigAdapter extends ApplicationAdapter and sets namespace to
      'v1', so every request it builds is rooted at the versioned UI API namespace.
  - codeRefs:
    - class:79c09b75c4ee536ddd9bf3addc6df266
    - file:third_party/openbao/ui/app/adapters/kubernetes/config.js
    id: r.config-query-record
    level: MUST
    text: KubernetesConfigAdapter.queryRecord GETs the config URL for the queried
      backend and returns the raw response with the backend name attached to it.
  - codeRefs:
    - class:79c09b75c4ee536ddd9bf3addc6df266
    - file:third_party/openbao/ui/app/adapters/kubernetes/config.js
    id: r.config-save-record
    level: MUST
    text: KubernetesConfigAdapter.createRecord and updateRecord both delegate to _saveRecord,
      which serializes the snapshot through the store serializer for the record's
      modelName, takes the record id from snapshot.id or the snapshot's backend attribute,
      POSTs the serialized data to that URL, and resolves with the serialized data
      plus backend and id set to that id.
  - codeRefs:
    - class:79c09b75c4ee536ddd9bf3addc6df266
    - file:third_party/openbao/ui/app/adapters/kubernetes/config.js
    id: r.config-url-shape
    level: MUST
    text: KubernetesConfigAdapter.getURL joins the adapter buildURL with the encoded
      backend mount path and a path segment that defaults to 'config'; urlForUpdateRecord
      returns that config URL from the snapshot's backend attribute and urlForDeleteRecord
      returns it from the backend argument.
  - codeRefs:
    - class:4ccde46e2def7df4b8568c996f3e847f
    - file:third_party/openbao/ui/app/adapters/kubernetes/role.js
    id: r.role-generate-credentials
    level: MUST
    text: KubernetesRoleAdapter.generateCredentials POSTs the request data with its
      role field removed to the backend's creds path for the named role, and resolves
      with an object holding lease_id, lease_duration and the flattened response data.
  - codeRefs:
    - class:4ccde46e2def7df4b8568c996f3e847f
    - file:third_party/openbao/ui/app/adapters/kubernetes/role.js
    id: r.role-query
    level: MUST
    text: KubernetesRoleAdapter.query GETs the roles collection URL with list=true
      and maps each key in the response data to a role object carrying that name and
      the queried backend.
  - codeRefs:
    - class:4ccde46e2def7df4b8568c996f3e847f
    - file:third_party/openbao/ui/app/adapters/kubernetes/role.js
    id: r.role-query-record
    level: MUST
    text: KubernetesRoleAdapter.queryRecord GETs the named role URL and returns the
      response data with backend and name written onto it, so the record is addressable
      after load.
  - codeRefs:
    - class:4ccde46e2def7df4b8568c996f3e847f
    - file:third_party/openbao/ui/app/adapters/kubernetes/role.js
    id: r.role-url-shape
    level: MUST
    text: KubernetesRoleAdapter extends NamedPathAdapter and builds role URLs as the
      adapter buildURL plus the encoded backend plus '/roles', appending the role
      name only when a name is given; urlForQuery, urlForUpdateRecord and urlForDeleteRecord
      all resolve through that helper using the backend carried by the query object
      or the snapshot.
  upstream: self
