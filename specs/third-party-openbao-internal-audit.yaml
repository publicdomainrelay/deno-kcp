    level: MUST
    text: An audit backend must be the Backend interface, exposing LogRequest(context.Context,
      *logical.LogInput) error, LogResponse(context.Context, *logical.LogInput) error,
      LogTestMessage(context.Context, *logical.LogInput, map[string]string) error,
      GetHash(context.Context, string) (string, error), Reload(context.Context) error
      and Invalidate(context.Context).
