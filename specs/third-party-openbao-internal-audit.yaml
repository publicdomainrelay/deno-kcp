kind: SystemContext
metadata:
  name: third-party-openbao-internal-audit
  namespace: default
spec:
  intent: 'This context exists to fix the contract of the audit package as a stable
    boundary between audit device backends and the rest of the server: a device supplies
    a Backend and a Formatter, the formatter serialises requests and responses into
    an AuditFormatWriter, and the hashing layer guarantees that secrets, tokens and
    potentially sensitive values are salted or HMAC''d before they leave the process.
    It is written so that the formatting and hashing behaviour cannot drift silently,
    because audit output is the forensic record and a leak or an unverifiable field
    is unrecoverable. The exported names, signatures and the required test files below
    are the parts that other packages and downstream devices depend on.'
