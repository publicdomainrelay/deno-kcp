kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-dbtxn
  namespace: default
spec:
  intent: This context exists so backend database plugins and storage code in OpenBao
    can run small parameterised SQL statements without repeating prepare, execute,
    and resource-release boilerplate. Callers pick a prepared variant when a statement
    benefits from reuse within the driver, and a direct variant when the statement
    runs once. The package isolates the template substitution of {{name}} tokens behind
    an unexported parseQuery helper, so no caller must do string replacement on SQL
    by hand. Only the four Execute* entry points are exported; parseQuery and execute
    stay internal to the file.
  interfaces:
  - file: third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    kind: function
    name: ExecuteDBQuery
    signature: func ExecuteDBQuery(ctx context.Context, db *sql.DB, params map[string]string,
      query string) error
  - file: third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    kind: function
    name: ExecuteDBQueryDirect
    signature: func ExecuteDBQueryDirect(ctx context.Context, db *sql.DB, params map[string]string,
      query string) error
  - file: third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    kind: function
    name: ExecuteTxQuery
    signature: func ExecuteTxQuery(ctx context.Context, tx *sql.Tx, params map[string]string,
      query string) error
  - file: third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    kind: function
    name: ExecuteTxQueryDirect
    signature: func ExecuteTxQueryDirect(ctx context.Context, tx *sql.Tx, params map[string]string,
      query string) error
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    - function:0a158cecb80a3a8c10637412fa09a53a
    - function:3425084f5e86168aaebb7f5cfeb53f0e
    - function:77c9c70ae684912661590dc7bd08d0b7
    - function:f0e460014493f1673ed1e45d1c19f042
    id: r.context-required
    level: MUST
    text: All four helpers must accept the caller's context and use it for the prepare
      or exec call, so statement lifetime and cancellation follow the caller, and
      they must return the resulting error rather than panicking or logging it.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    - function:0a158cecb80a3a8c10637412fa09a53a
    - function:77c9c70ae684912661590dc7bd08d0b7
    id: r.direct-execution-single-call
    level: MUST
    text: ExecuteDBQueryDirect and ExecuteTxQueryDirect must run the parsed query
      with one ExecContext call on the database or transaction and return that error
      directly, without preparing or closing a statement.
  - codeRefs:
    - function:0a158cecb80a3a8c10637412fa09a53a
    - function:3425084f5e86168aaebb7f5cfeb53f0e
    - function:77c9c70ae684912661590dc7bd08d0b7
    - function:f0e460014493f1673ed1e45d1c19f042
    id: r.params-placeholder-substitution
    level: MUST
    text: 'Every exported helper must pass the params map and query through parseQuery
      first: when the map is empty the query is returned unchanged, and otherwise
      each {{key}} occurrence is replaced with its map value, so callers can build
      statement text from named tokens.'
  - codeRefs:
    - file:third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    - function:3425084f5e86168aaebb7f5cfeb53f0e
    - function:f0e460014493f1673ed1e45d1c19f042
    id: r.prepared-execution-releases-resources
    level: MUST
    text: ExecuteDBQuery and ExecuteTxQuery must prepare the parsed query with the
      caller's context, defer the close of the returned statement, and then run the
      statement through the shared execute helper, so the statement is always released
      after one execution.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/dbtxn/dbtxn.go
    id: r.single-statement-only
    level: SHOULD
    text: 'Each helper should carry exactly one statement: the package exposes no
      multi-statement or transaction-lifecycle API, so callers manage Begin and Commit
      themselves and use these helpers only for the individual statements inside a
      transaction.'
  upstream: self
