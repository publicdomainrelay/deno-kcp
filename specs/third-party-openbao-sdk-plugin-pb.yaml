  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:123693961ad24e736fe93713d19e7ea6
    - function:192e2432192e44343b4b1d69c8e62869
    id: r.auth-round-trip
    level: MUST
    text: A logical.Auth converts to a protobuf Auth and back again, carrying policies,
      metadata, lease options, internal data, display name, token type, alias and
      group aliases, boundary fields and token pieces across the boundary.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:348f5fd828ea8290998821b2b0b0df72
    - function:8db14a4b71a0b242cfedb160f2460883
    id: r.certificate-chain-round-trip
    level: MUST
    text: A slice of X.509 certificates converts to a protobuf CertificateChain and
      back again, so an ordered peer or verified chain keeps its length and order
      across the boundary.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:1bb243c4435a77e4098c805577d2d7f6
    - function:9c0e78ed0210499dec5123b087ead447
    id: r.certificate-round-trip
    level: MUST
    text: A single X.509 certificate converts to a protobuf Certificate and back again,
      preserving the ASN.1 DER bytes of the certificate.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:1f74a6d454623f380249a4d5d5eb83bc
    - function:a33aa608d83889b76d6b0680949537d4
    id: r.connection-round-trip
    level: MUST
    text: A logical.Connection converts to a protobuf Connection and back again, keeping
      the remote address, remote port and the embedded TLS connection state of the
      caller.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/backend.pb.go
    id: r.empty-message-proto-contract
    level: MUST
    text: 'The Empty message implements the protobuf reflection contract: Reset zeroes
      the message, String renders the protobuf text form, ProtoMessage marks the type
      as a proto message, ProtoReflect returns the message state, and Descriptor returns
      the file descriptor bytes and message index.'
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:113b893fe730eb7e8c1a01ced3530f10
    - function:1e28d194f9dc562c43ebb2f7662ed455
    - function:a708bdca0eb298347a4f9f739a2b9900
    id: r.error-round-trip
    level: MUST
    text: 'Errors cross the boundary as ProtoError values: ErrToProtoErr encodes a
      Go error into a protobuf error, ProtoErrToErr rebuilds an error from a protobuf
      error, and ErrToString renders an error as a string; a nil error maps to a nil
      protobuf error and back to nil.'
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/backend_grpc.pb.go
    - function:e9339dd86caa9c1c45d1e6ef1ef87b94
    - function:f291efb232dd7c2a8fba6e9deecb6f0a
    - function:f8167309389e05e3aae650d7810c515b
    id: r.grpc-client-constructors
    level: MUST
    text: Client constructors build a Backend, Storage or SystemView client from a
      gRPC client connection interface, so a host or plugin can call the remote service
      through the generated client interface.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/backend_grpc.pb.go
    - function:13d5a22678315405dcbdd2e97a25ac9f
    - function:463ec18822e4cb57aec2558f69826480
    - function:e58fc3b63ff98284fb6b8b699c4e4d00
    id: r.grpc-service-registration
    level: MUST
    text: The package registers the Backend, Storage and SystemView gRPC services
      on a service registrar, each binding the service's full protobuf name to the
      supplied server implementation so a plugin host can serve the plugin over gRPC.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:674c79b73b38accb373fb8ad072f2c94
    - function:9c7dc920e2349a7481c0b4c045b825a5
    id: r.lease-options-round-trip
    level: MUST
    text: A logical.LeaseOptions converts to a protobuf LeaseOptions and back again,
      preserving the TTL, max TTL, renewable flag and increment value.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:71f4d73d14deaefb98dfbecaf0df2f3f
    - function:e94f68c53cc2e933980def6ec71ca839
    id: r.request-round-trip
    level: MUST
    text: A logical.Request converts to a protobuf Request and back again, so operation,
      path, data, storage, auth, headers, client token, display name, connection info
      and mount metadata survive the plugin boundary; conversion reports an error
      when a logical value cannot be represented.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:8bb911b2ec4325cf9613fb0a4430168d
    - function:ec0345d4f50215c910e9286ef3be5391
    id: r.response-round-trip
    level: MUST
    text: A logical.Response converts to a protobuf Response and back again, preserving
      data, the list of secret and auth entries, redirects, warnings, wrap info and
      the response's own secret and auth payloads.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:30f94e1705dae88776d5211240b4ec41
    - function:a1e53cfaba720972ed85b4e022df4b6b
    id: r.secret-round-trip
    level: MUST
    text: A logical.Secret converts to a protobuf Secret and back again, preserving
      lease options, internal data, lease identifier, renewable flag and the dynamic
      and raw secret markers.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:82de4419b94f26095828187c923442c4
    - function:889a712b204e6aad4573f6689e0e1128
    id: r.storage-entry-round-trip
    level: MUST
    text: A logical.StorageEntry converts to a protobuf StorageEntry and back again,
      so the key, value bytes and seal-wrap flag survive storage traffic over the
      plugin link.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:501d2a43738c1a9841678b2c8dc95b11
    - function:9a48bdc8ef94566f60f1a8f65139c162
    id: r.tls-connection-state-round-trip
    level: MUST
    text: A TLS connection state converts to a protobuf ConnectionState and back again,
      preserving version, handshake completion, negotiated protocol, server name,
      peer certificates, verified chains and the cipher suite.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:2a09dd18cf27041fa3e9b89cd66b179e
    - function:e3747be14be02a90c4731d9178c7101a
    id: r.token-entry-round-trip
    level: MUST
    text: A logical.TokenEntry converts to a protobuf TokenEntry and back again, so
      token identity, path, policies, metadata, expiry, role, namespace and bound
      CIDRs keep their values in both directions.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation_test.go
    id: r.translation-tests
    level: MUST
    text: The package's tests exercise the protobuf to logical translation functions
      so a change that breaks a round trip, drops a field, or changes error conversion
      fails the test suite.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/backend_grpc.pb.go
    - interface:2a7740268af7f35d1a6e204cec1157db
    - interface:3a350b8c316d3a28a3e8b3d23e9cedfc
    id: r.unsafe-server-interfaces
    level: SHOULD
    text: The generated UnsafeBackendServer and UnsafeStorageServer interfaces carry
      the must-embed marker that tells implementers forward compatibility is not guaranteed,
      so servers embed the interface and keep compiling when the service gains methods.
  - codeRefs:
    - file:third_party/openbao/sdk/plugin/pb/translation.go
    - function:36b7fdcb0b0304deadaf026d10433ffa
    - function:48aa627c782f197b53c67cf74e74390e
    - function:c928346a8487d9b8555f87d195f1a64f
    - function:d2c86f17e1fdbc5d286c1aa810d55b66
    id: r.wrap-info-round-trip
    level: MUST
    text: 'Request and response wrap info convert in both directions: a logical.RequestWrapInfo
      becomes a protobuf RequestWrapInfo and a ResponseWrapInfo becomes a protobuf
      ResponseWrapInfo, with TTL, token, accessor, creation time, creation path, wrapped
      accessor and seal-wrapping state preserved.'
  upstream: self
