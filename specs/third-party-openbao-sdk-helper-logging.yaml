kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-logging
  namespace: default
spec:
  intent: This context exists so that SDK consumers and OpenBao components share one
    definition of log format and one place to construct a logger, rather than each
    caller re-implementing format parsing or logger wiring. The LogFormat type carries
    the three accepted states so callers can compare results by value, the parsers
    centralise the accepted spellings of each format (including the trimmed, lower-cased,
    and vault-prefixed aliases), and the constructors fix the logger options — level,
    independent levels, output writer, and JSON formatting decided from the environment
    — so that a logger created through this package behaves consistently no matter
    which entry point is used.
  interfaces:
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: type_alias
    name: LogFormat
    signature: type LogFormat int
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: method
    name: LogFormat.String
    signature: func (l LogFormat) String() string
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: function
    name: NewVaultLogger
    signature: func NewVaultLogger(level log.Level) log.Logger
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: function
    name: NewVaultLoggerWithWriter
    signature: func NewVaultLoggerWithWriter(w io.Writer, level log.Level) log.Logger
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: function
    name: ParseEnvLogFormat
    signature: func ParseEnvLogFormat() LogFormat
  - file: third_party/openbao/sdk/helper/logging/logging.go
    kind: function
    name: ParseLogFormat
    signature: func ParseLogFormat(format string) (LogFormat, error)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging.go
    - method:e8e74a2a6c5eaf339e3198cee0b346de
    - type_alias:190b85ecd7b82dddf7e2d027143cac81
    id: r.log-format-enum
    level: MUST
    text: LogFormat must be an integer enum with exactly three defined values — UnspecifiedFormat,
      StandardFormat and JSONFormat — so callers can compare parse results by value,
      and its String method must render those three values as the strings "unspecified",
      "standard" and "json" respectively, falling back to "unknown" for any value
      outside that set.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging.go
    - function:14579d465d86403647209873e941c97d
    - function:9ba0bab216e904df7cc422f1ce26c15d
    id: r.new-vault-logger-default-output
    level: MUST
    text: NewVaultLogger must create a logger at the requested level that writes to
      log.DefaultOutput by delegating to NewVaultLoggerWithWriter with that writer,
      so both constructors produce identically configured loggers apart from the writer.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging.go
    - function:9ba0bab216e904df7cc422f1ce26c15d
    - function:f429f14084efc1889a39feef98b72677
    id: r.new-vault-logger-with-writer
    level: MUST
    text: NewVaultLoggerWithWriter must build a log.Logger through log.New with a
      log.LoggerOptions carrying the caller's level, the caller's writer as Output,
      IndependentLevels set to true, and JSONFormat set from ParseEnvLogFormat() equalling
      JSONFormat, so that JSON output is selected by the environment variable rather
      than by an argument.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging.go
    - function:f429f14084efc1889a39feef98b72677
    id: r.parse-env-log-format
    level: MUST
    text: ParseEnvLogFormat must read the BAO_LOG_FORMAT variable via api.ReadBaoVariable,
      lower-case its value, map "json", "vault_json", "vault-json" and "vaultjson"
      to JSONFormat and "standard" to StandardFormat, and return UnspecifiedFormat
      for an unset variable or any unrecognised value, without ever returning an error.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging.go
    - function:c93ea2090c966df5cc25488e76155619
    id: r.parse-log-format
    level: MUST
    text: 'ParseLogFormat must lower-case and trim the supplied string before matching,
      so that "" and whitespace-only input yield UnspecifiedFormat with a nil error,
      "standard" in any case yields StandardFormat, and "json" in any case including
      surrounding whitespace yields JSONFormat; any other input must yield UnspecifiedFormat
      together with an error whose message is "unknown log format: <format>" carrying
      the original, untrimmed argument.'
  - codeRefs:
    - file:third_party/openbao/sdk/helper/logging/logging_test.go
    - function:c93ea2090c966df5cc25488e76155619
    id: r.parse-log-format-tested
    level: SHOULD
    text: ParseLogFormat's accepted inputs and error text must stay covered by Test_ParseLogFormat
      in logging_test.go, which asserts the empty string, a single space, "standard",
      "STANDARD", "json", " json " and "bogus", and must hold both the expected LogFormat
      and the expected error for each case.
  upstream: self
