    id: r.root-variant-pairing
    level: SHOULD
    text: Each -root controller must pair with its non-root sibling of the same screen
      name (actions, create, credentials, edit, list, show, sign), with the root variant
      carrying the backend-level breadcrumb and the non-root variant carrying the
      item-level screen state.
