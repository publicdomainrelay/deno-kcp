kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-secrets-backend
  namespace: default
spec:
  intent: This context exists so the secrets-backend controller layer can be specified
    and tracked as one unit. These controllers bind the backend name into breadcrumbs
    and toolbar state, and they translate user actions on secrets engines into route-level
    messages and model refreshes. The diff and metadata controllers are the two whose
    members are fully resolved, so they anchor the requirements; the remaining files
    are the siblings that complete the same directory and follow the same controller
    pattern.
  interfaces:
  - file: third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend/diff.js
    kind: class
    name: DiffController
    signature: class DiffController extends Controller
  - file: third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend/metadata.js
    kind: class
    name: MetadataController
    signature: class MetadataController extends Controller
  repository: deno-kcp
  requirements:
