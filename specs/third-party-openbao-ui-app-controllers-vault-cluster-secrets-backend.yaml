    - file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend/versions.js
    id: r.backend-controller-set
    level: MUST
    text: 'The directory must provide one controller module per secrets-backend screen:
      actions-root, actions, configuration, create-root, create, credentials-root,
      credentials, diff, edit-root, edit, list-root, list, metadata, show-root, show,
      sign-root, sign, and versions, so every backend route resolves a controller.'
  - codeRefs:
    - class:a8c93823983cd358bb964edeea1ddcaf
    - file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend/diff.js
    id: r.diff-controller-breadcrumb
    level: MUST
    text: DiffController extends Ember Controller, tracks the current backend name
      in a tracked backend property, and its backendCrumb getter must return a breadcrumb
      object whose label, text, and model are the backend name and whose path is vault.cluster.secrets.backend.list-root,
      so the diff screen links back to the backend root.
  - codeRefs:
    - class:303a8df6e2e1b1f99e088b8d9891c288
