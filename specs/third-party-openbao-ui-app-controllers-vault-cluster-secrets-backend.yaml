      name in a tracked backend property, and its backendCrumb getter must return
      a breadcrumb object whose label, text, and model are the backend name and whose
      path is vault.cluster.secrets.backend.list-root.
  - codeRefs:
    - class:303a8df6e2e1b1f99e088b8d9891c288
    - file:third_party/openbao/ui/app/controllers/vault/cluster/secrets/backend/metadata.js
    id: r.metadata-refresh-action
    level: MUST
    text: MetadataController.refreshModel is an Ember @action that sends the refreshModel
      message to its route, so the metadata view can reload its model without a full
      transition.
