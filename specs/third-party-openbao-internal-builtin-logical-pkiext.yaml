kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-logical-pkiext
  namespace: default
spec:
  intent: This context exists so the PKI extension package can turn a stream of docker
    container log output into per-line callbacks during tests. The container log writer
    in this package duplicates the LogConsumerWriter type that also exists in the
    sdk/helper/docker and sdk/helper/testcluster/docker packages, differing only in
    that its callback field is exported as Consumer rather than unexported. The context
    documents that helper and the test files that depend on the pkiext package's test
    scaffolding, so that changes to log handling or to the pkiext test helpers keep
    the observed behaviour intact.
  interfaces:
  - file: third_party/openbao/internal/builtin/logical/pkiext/test_helpers.go
    kind: struct
    name: LogConsumerWriter
    signature: type LogConsumerWriter struct { Consumer func(string) }
  - file: third_party/openbao/internal/builtin/logical/pkiext/test_helpers.go
    kind: method
    name: LogConsumerWriter.Write
    signature: func (l LogConsumerWriter) Write(p []byte) (n int, err error)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - method:6122b5e075e25cc10903a024ace8994a
    - struct:f8a7e9b9c122ff59fce7fe136e4259e4
    id: r.exported-consumer-field
    level: MUST
    text: The pkiext LogConsumerWriter must expose its per-line callback as an exported
      Consumer field, unlike the sdk copies of the same type whose callback field
      is unexported, so that callers outside the package can construct the writer
      by setting the callback directly.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/test_helpers.go
    - method:6122b5e075e25cc10903a024ace8994a
    - struct:f8a7e9b9c122ff59fce7fe136e4259e4
    id: r.log-consumer-writer-line-splitting
    level: MUST
    text: 'LogConsumerWriter must satisfy io.Writer: its Write method must scan the
      received byte slice as newline-separated lines using a bufio.Scanner over a
      bytes.Reader, invoke the recipient''s Consumer callback once per scanned line
      with the line text, and return the full length of the input slice with a nil
      error so callers see the whole buffer as consumed.'
  - codeRefs:
    - file:third_party/openbao/internal/builtin/logical/pkiext/nginx_test.go
    - file:third_party/openbao/internal/builtin/logical/pkiext/test_helpers.go
    - file:third_party/openbao/internal/builtin/logical/pkiext/zlint_test.go
    id: r.pkiext-test-files
    level: MAY
    text: The pkiext package may keep nginx_test.go and zlint_test.go as test files
      alongside test_helpers.go, so that PKI extension behaviour is exercised in the
      same package as the log-consumer test helper.
  - codeRefs:
    - method:6122b5e075e25cc10903a024ace8994a
    id: r.scanner-buffer-bounds
    level: MUST
    text: The scanner used by LogConsumerWriter.Write must be given an initial buffer
      of 64*1024 bytes with bufio.MaxScanTokenSize as the maximum token size, so that
      long log lines are accepted up to that ceiling instead of failing on the scanner
      default.
  upstream: self
