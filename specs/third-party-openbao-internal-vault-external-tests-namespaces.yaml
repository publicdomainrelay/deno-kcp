apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-namespaces
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists to specify the black-box behavior the external namespace
    tests assert about OpenBao: how namespace deletion must survive an interrupted
    (cancelled) deletion and leave a tainted namespace that a second delete can finish,
    and how per-namespace seal/unseal state must propagate across all cores of a cluster,
    including after seal, step-down, restart and resync. It documents the acceptance
    rules these integration tests enforce so that changes to namespace deletion, tainting
    or namespace sealing can be checked against them.'
  requirements:
  - id: r.ci-skip-for-repeated-deletion
    level: MUST
    text: TestNamespaceRepeatedDeletion skips itself when the CI environment variable
      is non-empty, because creating 500 KV and userpass objects causes context cancellation
      timeouts, and otherwise runs in parallel.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
  - id: r.deletion-completes-and-clears-storage
    level: MUST
    text: Once the second delete is issued, sys/namespaces must become empty within
      the eventual timeout, and listing sys/raw/namespaces/<uuid> for the deleted
      namespace must return nil, showing namespace storage is gone.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
  - id: r.deletion-interrupted-leaves-tainted-namespace
    level: MUST
    text: After the namespace is deleted and the active core is stepped down, the
      namespace must still appear under sys/namespaces, a read of sys/namespaces/ns1
      must report tainted true, and a second delete must be accepted.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
  - id: r.namespace-population-uses-v2-kv-and-userpass
    level: MUST
    text: Namespace population must enable KV-v2 mounts named kv-v2, kv-v1 and kv
      under the kv logical backend factory plus userpass credential backend, wait
      for the KV-v2 mount config to expose cas_required before writing entries, and
      write entries and users concurrently in the namespace of the admin policy.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
  - id: r.sealed-namespace-creation-returns-shares
    level: MUST
    text: Creating a namespace with a seal configuration must return a response carrying
      key_shares, and the Shamir configuration with shares 3 and threshold 2 must
      yield 3 share strings.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
  - id: r.sealed-state-on-every-node
    level: MUST
    text: A sealed namespace must reject mount listing with an error containing "is
      sealed" and a nil mount list on every core of the cluster, and an unsealed namespace
      must list non-empty mounts without error.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
  - id: r.three-core-cluster-with-eventual-checks
    level: MUST
    text: TestNamespaceClusterSealing runs a three-core test cluster in parallel and
      uses eventual assertions with 25 second timeouts and 100 millisecond polling
      for namespace creation, unsealing and resealing, because standby nodes can lag
      behind.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
  - id: r.unseal-and-seal-propagate-across-cluster
    level: MUST
    text: Unsealing a namespace from any core must unseal it immediately on the active
      core and eventually on all other nodes, and sealing a namespace must make it
      sealed again on all nodes.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
  - id: r.unsealed-state-resyncs-after-restart
    level: MUST
    text: After cores are sealed, stepped down and unsealed, namespaces that were
      unsealed must become reachable again on all nodes, showing unsealed namespace
      state is synchronized when nodes rejoin.
    codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
codeRefIndex:
- file:third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
  namespace_test.go@third_party/openbao/internal/vault/external_tests/namespaces/namespace_test.go
- file:third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
  sealing_test.go@third_party/openbao/internal/vault/external_tests/namespaces/sealing_test.go
