apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-healthcheck
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so that PKI health can be checked against a live OpenBao
    server through one uniform executor, instead of one bespoke script per concern.
    The Executor gives every check the same client, mount, config plumbing and path
    cache, so a check only has to declare what it needs and how to judge it. The documented
    surface is what the surrounding command code depends on: the Check interface and
    the constructors that produce checks, the Executor lifecycle (add, build config,
    execute), the cached fetch and its classification predicates, and the shared parsing
    and formatting helpers used across the individual PKI checks.'
  requirements:
  - id: r.build-config
    level: MUST
    text: BuildConfig must take an external map[string]any, merge each check's default
      configuration with the supplied per-check configuration, and report an error
      when the supplied configuration cannot be applied.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:61cd38eea299a604d0aedee7bf9e2430
  - id: r.check-contract
    level: MUST
    text: The Check interface must require Name, IsEnabled, DefaultConfig, LoadConfig,
      FetchResources and Evaluate, and every check in the package must satisfy it
      so the executor can treat them uniformly.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - interface:13fa7f9db19906441b5ec0e8114f755a
    - method:1d2a57ceb86b7d83466ed6de90b18177
    - method:5500f0e6a49a2ab36d423f5843216db4
    - method:56efce7a5b070904db4bf06ffa375390
    - method:662f8b0a53635bbcd173fd267b205fde
    - method:6a0cc06c0bc8c6fea48bdb67b07af536
    - method:6d8744c3018fb7b0600143bb79618de2
  - id: r.check-enablement-and-config
    level: MUST
    text: Each check must report its enabled state through IsEnabled, publish its
      defaults through DefaultConfig, and accept external settings through LoadConfig,
      so configuration can turn a check off or retune it before Execute runs.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:662f8b0a53635bbcd173fd267b205fde
    - method:6a0cc06c0bc8c6fea48bdb67b07af536
    - method:6d8744c3018fb7b0600143bb79618de2
  - id: r.check-two-phase
    level: MUST
    text: Each check must split its work into a FetchResources phase that gathers
      remote data through the executor and an Evaluate phase that turns the gathered
      data into []*Result, so fetching and judging stay separate.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:1d2a57ceb86b7d83466ed6de90b18177
    - method:5500f0e6a49a2ab36d423f5843216db4
  - id: r.config-value-coercion
    level: SHOULD
    text: StringList must accept a loosely typed config value and return it as []string,
      returning an error when the value cannot be read as a list of strings.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/shared.go
    - function:a240f05e1200f40f0e8fefbfd9b4505a
  - id: r.duration-formatting
    level: SHOULD
    text: FormatDuration must render a time.Duration as a human-readable string so
      checks that report validity periods and elapsed tidy times print consistent
      text.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/util.go
    - function:54151063fbf0369ccf78f584562776b5
  - id: r.execute-all-checks
    level: MUST
    text: Execute must run the registered checks and return their results grouped
      by check name in a map[string][]*Result, returning an error instead of partial
      results when the run fails.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:0411c690a98eda426fdf6148f1163e55
  - id: r.executor-defaults
    level: MUST
    text: NewExecutor must return an executor whose DefaultEnabled is true and whose
      Config and Resources maps are initialized, so a caller can add checks and fetch
      paths without further setup.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - function:c24e52358e5abe8d906baeb02bc8b1e0
  - id: r.executor-registry
    level: MUST
    text: The Executor struct must own the api client, the mount path, the per-check
      configuration map and the fetched-resource cache, and AddCheck must append each
      supplied Check to the executor's checker list so Execute runs them in registration
      order.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:95d229150c4b8f8be156f956a8cbb3c7
    - struct:6f83eee817b431df747ba6b6192eabef
  - id: r.fetch-once-per-operation
    level: MUST
    text: FetchIfNotFetched must read a raw path at most once per logical operation
      and per path, returning the cached *PathFetch on later calls so checks sharing
      a path do not repeat API traffic.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:b240af5af0ea94bf248c5c8de0b8bfd2
    - struct:c2542e9fadad6ee439121ce316a0a050
  - id: r.mount-type-validation
    level: MUST
    text: ValidateMountType must confirm that the named mount reports the expected
      type and return a non-nil error when the mount is missing or its type differs,
      so a check run against the wrong mount fails before any check evaluates.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - function:a9cc1007b9b56fe138dbf440ce6d99c0
  - id: r.pathfetch-classification
    level: MUST
    text: 'PathFetch must let a check classify a fetch outcome: IsOK and IsSecretOK
      report usable data, FetchSurfaceError reports the surface-level error, and IsSecretPermissionsError,
      IsUnsupportedPathError, IsMissingResource and Is404NotFound separate permission
      denial, unsupported path, missing resource and plain 404 so a check can downgrade
      or skip instead of failing hard.'
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:203dfba5d97de1c106c7e63b864a55ee
    - method:3f31381121011fd3a0d614321a89b1fc
    - method:47ddf3321e43daa2267e6f1be5cbd7fd
    - method:8aafccf81e6b0223a7e5941a1a5071c8
    - method:8f8d957c56e58deb9123430717f18a8f
    - method:ba222c4349c36446a5b6d00a5aeb4488
    - method:d0b387111db280483ed94bb19c21ad3e
  - id: r.pem-parsing
    level: MUST
    text: ParsePEMCert must decode PEM certificate contents into an *x509.Certificate
      and return an error when the contents are not a parseable certificate, since
      the certificate-oriented checks depend on it.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/pki.go
    - function:0ef5f642d30a554a0000f2cd937b320e
  - id: r.pki-check-set
    level: MUST
    text: The package must provide PKI checks covering audit visibility, ACME header
      allowance, ACME issuance, If-Modified-Since allowance, automatic tidy, CA validity
      period, CRL validity period, hardware backed root, role glob wildcards, role
      localhost allowance, role no-store-false, leaves issued by the root, tidy last
      run and excessive certificate counts, each built by its own New* constructor
      returning a Check.
    codeRefs:
    - function:095916289a578670387e0c999a08558f
    - function:1e1246a377112ae07852c5297cbfc93f
    - function:29c57787bee6a0f0aaaea01696396bb2
    - function:2fae00b4adc47924ab586547fae4c624
    - function:33a4632b3c7ba9d554a2aad89a88864d
    - function:525a8f3a99ef64f1fc0a155612e676f5
    - function:6f16c4461b84933efd80d7ad5a028896
    - function:830d611f7e5599ce053a0bbcd4a239d0
    - function:8b24c7f72f2aa1a37b4edf282a607373
    - function:c2e7757edd9294fa5bbcecdd3fbeb87b
    - function:d5a14ada5df01ecebbc5101d6149b1de
    - function:d7a2768569c134402c572a052a60cb71
    - function:e0270b356fd39d43e4fa6d4f90a867ee
    - function:ec12110960e308662c5366933cfc5724
  - id: r.result-shape
    level: MUST
    text: Every check must report findings as Result values tagged with a ResultStatus,
      and the result set returned by Execute must preserve that per-check grouping
      so callers can render one section per check.
    codeRefs:
    - file:third_party/openbao/internal/command/healthcheck/healthcheck.go
    - method:0411c690a98eda426fdf6148f1163e55
    - struct:44ae149a27be8e3ad4eeb2eba8e2deeb
    - type_alias:daac9847e15849439ef7a7e1eb6a71cf
