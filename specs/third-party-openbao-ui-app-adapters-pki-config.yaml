apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-adapters-pki-config
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so that the PKI configuration HTTP surface of the OpenBao
    UI stays described in one place: a single generic adapter holds all request logic
    (GET for findRecord, POST for updateRecord) while thin subclasses supply only
    the URL for each of the four PKI config endpoints. It documents that contract
    so future refactors of the adapters preserve the v1 namespace, the mount-path
    encoding through encodePath, and the unwrapping of resp.data on find.'
  requirements:
  - id: r.base-extends-application-adapter
    level: MUST
    text: PkiConfigBaseAdapter must extend the UI application adapter and declare
      namespace 'v1', so every PKI config request is issued under that API namespace.
    codeRefs:
    - class:7013746357be30dc3099a721f1e46d65
    - file:third_party/openbao/ui/app/adapters/pki/config/base.js
  - id: r.find-record-gets-and-unwraps
    level: MUST
    text: findRecord must issue an HTTP GET to the URL produced by _url(backend) and
      must resolve with the response body's data property, not the raw response, so
      callers receive the record payload directly.
    codeRefs:
    - class:7013746357be30dc3099a721f1e46d65
    - file:third_party/openbao/ui/app/adapters/pki/config/base.js
  - id: r.subclasses-supply-only-url
    level: MUST
    text: PkiConfigAcmeAdapter, PkiConfigClusterAdapter, PkiConfigCrlAdapter and PkiConfigUrlsAdapter
      must extend PkiConfigBaseAdapter, keep namespace 'v1', and override only _url(backend),
      so find and update behavior stays inherited and identical across the four config
      endpoints.
    codeRefs:
    - class:0ae4baeedbb44b011a1bb8b77ebcd63d
    - class:b07ea4beb4f13b0976ed4043f7e6deca
    - class:e7161dbfd2de9d32ca59cd636e4daa5f
    - class:f085aea2fe7d8234f29b97c5b51d4929
  - id: r.update-record-posts-serialized-snapshot
    level: MUST
    text: updateRecord must serialize the snapshot and issue an HTTP POST with that
      serialized payload as data to _url(snapshot.record.id), so the record's id supplies
      the backend mount path.
    codeRefs:
    - class:7013746357be30dc3099a721f1e46d65
    - file:third_party/openbao/ui/app/adapters/pki/config/base.js
  - id: r.url-helpers-import-path-encoding
    level: SHOULD
    text: The four subclasses should import encodePath from vault/utils/path-encoding-helpers
      rather than hand-rolling path escaping, keeping encoding behavior consistent
      with the rest of the UI.
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/pki/config/acme.js
    - file:third_party/openbao/ui/app/adapters/pki/config/cluster.js
    - file:third_party/openbao/ui/app/adapters/pki/config/crl.js
    - file:third_party/openbao/ui/app/adapters/pki/config/urls.js
  - id: r.url-shape-encoded-backend-plus-config-path
    level: MUST
    text: 'Each _url(backend) must return this.buildURL() joined with the URL-encoded
      backend mount path and then the adapter''s own fixed segment: /config/acme for
      ACME, /config/cluster for cluster, /config/crl for CRL, and /config/urls for
      URLs; the backend must be passed through encodePath so mounts containing reserved
      characters stay addressable.'
    codeRefs:
    - file:third_party/openbao/ui/app/adapters/pki/config/acme.js
    - file:third_party/openbao/ui/app/adapters/pki/config/cluster.js
    - file:third_party/openbao/ui/app/adapters/pki/config/crl.js
    - file:third_party/openbao/ui/app/adapters/pki/config/urls.js
  interfaces:
  - name: PkiConfigAcmeAdapter
    kind: class
    signature: class PkiConfigAcmeAdapter extends PkiConfigBaseAdapter
    file: third_party/openbao/ui/app/adapters/pki/config/acme.js
  - name: PkiConfigBaseAdapter
    kind: class
    signature: class PkiConfigBaseAdapter extends ApplicationAdapter
    file: third_party/openbao/ui/app/adapters/pki/config/base.js
  - name: PkiConfigClusterAdapter
    kind: class
    signature: class PkiConfigClusterAdapter extends PkiConfigBaseAdapter
    file: third_party/openbao/ui/app/adapters/pki/config/cluster.js
  - name: PkiConfigCrlAdapter
    kind: class
    signature: class PkiConfigCrlAdapter extends PkiConfigBaseAdapter
    file: third_party/openbao/ui/app/adapters/pki/config/crl.js
  - name: PkiConfigUrlsAdapter
    kind: class
    signature: class PkiConfigUrlsAdapter extends PkiConfigBaseAdapter
    file: third_party/openbao/ui/app/adapters/pki/config/urls.js
codeRefIndex:
- class:0ae4baeedbb44b011a1bb8b77ebcd63d PkiConfigCrlAdapter@third_party/openbao/ui/app/adapters/pki/config/crl.js:9
