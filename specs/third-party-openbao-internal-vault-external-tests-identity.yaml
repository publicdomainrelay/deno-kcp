kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-identity
  namespace: default
spec:
  intent: 'The suite exists to verify the identity secrets engine from outside its
    implementation package, so engine behaviour stays testable as internal code is
    refactored. Because the tests are external, they pin the externally observable
    contract of the engine: request paths, response fields, and error conditions.
    Each file targets one slice of identity, and together they must keep passing while
    the engine internals change, which makes the tests the standing specification
    of the engine''s public behaviour rather than a description of any particular
    implementation.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/cross_namespace_test.go
    id: r.cross-namespace-identity
    level: MUST
    text: The suite must verify identity objects across namespaces, confirming which
      entities, groups, and aliases are visible or resolvable from a namespace other
      than the one that owns them.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/entities_test.go
    id: r.entities-lifecycle
    level: MUST
    text: 'The suite must cover the full entity lifecycle end to end: create an entity,
      list and read it back, update its metadata, attach and detach aliases, and delete
      it, asserting the API response fields at each step.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/aliases_test.go
    id: r.entity-aliases-covered
    level: MUST
    text: The suite must exercise entity alias creation, read, update, and deletion
      through the identity engine's public API, including the case where an alias
      is moved between entities, so alias reassignment stays observable from outside
      the engine package.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/aliases_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/cross_namespace_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/entities_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/group_aliases_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/groups_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/identity_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/login_mfa_duo_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/login_mfa_totp_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/oidc_provider_test.go
    - file:third_party/openbao/internal/vault/external_tests/identity/userlockouts_test.go
    id: r.external-package-boundary
    level: MUST
    text: Every file in this context must remain an external test, driving the identity
      engine only through exported API and the shared test harness, so the suite never
      depends on identity package internals and the package exports no interface of
      its own beyond test functions.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/group_aliases_test.go
    id: r.group-aliases-covered
    level: MUST
    text: The suite must exercise group alias creation, read, update, and deletion,
      including adding an alias to a group and checking that membership resolves through
      the alias after it is attached.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/groups_test.go
    id: r.groups-lifecycle
    level: MUST
    text: 'The suite must cover internal and external groups: create, list, read,
      update membership by entity and by group, and delete, asserting that membership
      edits take effect on subsequent reads.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/identity_test.go
    id: r.identity-baseline
    level: MUST
    text: The suite must contain the baseline identity engine checks that mount the
      engine and assert the core read and lookup paths, giving the other identity
      test files a shared starting contract for the request paths and response fields
      they build on.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/login_mfa_duo_test.go
    id: r.login-mfa-duo
    level: SHOULD
    text: The suite should cover login MFA using a Duo MFA method, driving the MFA
      enrollment and validation path for a login that requires a second factor, and
      should skip or gate cleanly when Duo credentials are not configured.
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/login_mfa_totp_test.go
    id: r.login-mfa-totp
    level: MUST
    text: 'The suite must cover login MFA using TOTP: enroll a TOTP method for an
      entity, attempt a login without the code and assert it is rejected, then supply
      a valid code and assert the login succeeds.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/oidc_provider_test.go
    id: r.oidc-provider
    level: MUST
    text: 'The suite must exercise the identity OIDC provider: configure a provider
      and its scopes, assign clients and keys, and assert the discovery and authorization
      endpoints respond as the provider contract requires.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/external_tests/identity/userlockouts_test.go
    id: r.user-lockouts
    level: MUST
    text: 'The suite must verify user lockout behaviour: after the configured number
      of failed logins the user is locked out, locked-out logins are rejected, and
      an unlock operation or lockout expiry restores the ability to log in.'
  upstream: self
