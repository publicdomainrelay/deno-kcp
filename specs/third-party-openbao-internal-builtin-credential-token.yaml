apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/builtin/credential/token/cli.go cli.go@third_party/openbao/internal/builtin/credential/token/cli.go
- method:c0f8ecd2eba308d3bd0e3a89d53ac47f CLIHandler.Help@third_party/openbao/internal/builtin/credential/token/cli.go:147
- method:eaccceebed764c4834f9052a32fb9496 CLIHandler.Auth@third_party/openbao/internal/builtin/credential/token/cli.go:23
- struct:1d7501e1dbe7dfbad42059c8f401e31c CLIHandler@third_party/openbao/internal/builtin/credential/token/cli.go:18
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-credential-token
  namespace: default
spec:
  intent: 'This context exists to pin down the token auth method''s CLI surface: the
    exact handler type, the exact Auth signature the login command calls, and the
    exact help text and configuration keys the token method advertises. It is one
    of five sibling credential handler contexts, so recording the shared two-method
    contract here keeps the token variant distinguishable from cert, jwt, kubernetes
    and userpass variants that export identically named types and methods. Requirements
    are anchored to the observed declarations so the handler cannot drift from the
    login command''s dynamic interface expectations or from its own documented flags.'
  interfaces:
  - file: third_party/openbao/internal/builtin/credential/token/cli.go
    kind: struct
    name: CLIHandler
    signature: type CLIHandler struct{}
  - file: third_party/openbao/internal/builtin/credential/token/cli.go
    kind: method
    name: CLIHandler.Auth
    signature: func (h *CLIHandler) Auth(c *api.Client, m map[string]string, nonInteractive
      bool) (*api.Secret, error)
  - file: third_party/openbao/internal/builtin/credential/token/cli.go
    kind: method
    name: CLIHandler.Help
    signature: func (h *CLIHandler) Help() string
  repository: deno-kcp
  requirements:
  - codeRefs:
    - method:eaccceebed764c4834f9052a32fb9496
    id: r.auth-signature
    level: MUST
    text: CLIHandler.Auth accepts the API client, the string-keyed configuration map,
      and a nonInteractive flag, and returns an API secret or an error, so the login
      command can dispatch to it dynamically.
  - codeRefs:
    - method:c0f8ecd2eba308d3bd0e3a89d53ac47f
    id: r.help-documents-lookup-key
    level: MUST
    text: Help documents the configuration key lookup=<bool>, which controls whether
      the token's metadata and policies are looked up.
  - codeRefs:
    - method:c0f8ecd2eba308d3bd0e3a89d53ac47f
    id: r.help-documents-token-key
    level: MUST
    text: Help documents the configuration key token=<string>, the token used for
      authentication, which is normally supplied directly on the `bao login` command
      line.
  - codeRefs:
    - method:c0f8ecd2eba308d3bd0e3a89d53ac47f
    id: r.help-no-other-options
    level: SHOULD
    text: Help states that there are no configuration options for this auth method
      other than the documented token and lookup keys.
  - codeRefs:
    - method:c0f8ecd2eba308d3bd0e3a89d53ac47f
    id: r.help-signature
    level: MUST
    text: CLIHandler.Help takes no arguments and returns a string, matching the login
      command's help dispatch.
  - codeRefs:
    - method:c0f8ecd2eba308d3bd0e3a89d53ac47f
    id: r.help-usage-line
    level: MUST
    text: 'Help returns a trimmed string whose usage line is `Usage: bao login TOKEN
      [CONFIG K=V...]`.'
  - codeRefs:
    - file:third_party/openbao/internal/builtin/credential/token/cli.go
    - struct:1d7501e1dbe7dfbad42059c8f401e31c
    id: r.token-cli-handler-declared
    level: MUST
    text: The token credential package declares an exported CLIHandler type as an
      empty struct that carries the login handler behavior.
  upstream: self
