kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster
  namespace: default
spec:
  intent: The context exists to specify the behavior of the OpenBao UI's vault/cluster
    controllers so that the cluster-level user flows (init, unseal, authenticate with
    optional MFA and OIDC, namespace selection, cluster settings) stay described independently
    of the templates and routes that consume them. It records which state each controller
    tracks, which query parameters it binds, and which transitions or adapter calls
    it performs, so that changes to these controllers can be checked against the documented
    contract.
  interfaces:
  - file: third_party/openbao/ui/app/controllers/vault/cluster/init.js
    kind: class
    name: InitController
    signature: class InitController extends Controller
  - file: third_party/openbao/ui/app/controllers/vault/cluster/mfa-setup.js
    kind: class
    name: VaultClusterMfaSetupController
    signature: class VaultClusterMfaSetupController extends Controller
  - file: third_party/openbao/ui/app/controllers/vault/cluster/oidc-provider.js
    kind: class
    name: VaultClusterOidcProviderController
    signature: class VaultClusterOidcProviderController extends Controller
  - file: third_party/openbao/ui/app/controllers/vault/cluster/oidc-provider-ns.js
    kind: class
    name: VaultClusterOidcProviderNsController
    signature: class VaultClusterOidcProviderNsController extends VaultClusterOidcProviderController
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/auth.js
    id: r.auth-mfa-branching
    level: MUST
    text: The auth controller binds queryParams authMethod and oidcProvider, debounces
      namespace updates by 500 ms before setting the namespace and the namespace query
      param, and on onAuthResponse stores mfaAuthData with the requirement, backend
      and data when the response carries mfa_requirement, otherwise calls authSuccess;
      onMfaSuccess completes the login and onMfaErrorDismiss clears mfaAuthData and
      mfaErrors.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/auth.js
    id: r.auth-redirect-and-root-warning
    level: MUST
    text: The auth controller aliases namespaceQueryParam, wrappedToken and redirectTo
      from its vault and cluster controllers, and after a transition it warns the
      user through flashMessages when the login used a root token, since the token
      is not stored by the browser; authSuccess redirects to redirectTo when set,
      clearing it afterwards, and otherwise transitions to vault.cluster with the
      namespace query parameter.
  - codeRefs:
    - class:6fa21011585db592c4ced9808a05fc38
    - file:third_party/openbao/ui/app/controllers/vault/cluster/init.js
    id: r.init-cluster-payload
    level: MUST
    text: initCluster(event) prevents the default event, builds the init payload from
      the controller fields, and treats the seal as a cloud seal when model.sealType
      is set and is not 'shamir'; in that case shares and threshold are sent as recovery_shares
      and recovery_threshold, otherwise as secret_shares and secret_threshold, both
      parsed as base-10 integers.
  - codeRefs:
    - class:6fa21011585db592c4ced9808a05fc38
    - file:third_party/openbao/ui/app/controllers/vault/cluster/init.js
    id: r.init-controller-state
    level: MUST
    text: InitController tracks keyData, secret_shares, secret_threshold, pgp_keys,
      use_pgp, loading and prefersInit; its constructor calls reset(), which sets
      keyData, secret_shares, secret_threshold and the pgp key to null, use_pgp and
      loading to false.
  - codeRefs:
    - class:6fa21011585db592c4ced9808a05fc38
    - file:third_party/openbao/ui/app/controllers/vault/cluster/init.js
    id: r.init-key-filename
    level: MUST
    text: The keyFilename getter derives the download filename as 'vault-cluster-'
      followed by the model name, and setPrefersInit() sets prefersInit to true.
  - codeRefs:
    - class:6fa21011585db592c4ced9808a05fc38
    - file:third_party/openbao/ui/app/controllers/vault/cluster/init.js
    id: r.init-pgp-payload
    level: MUST
    text: When use_pgp is set, initCluster sends pgp_keys, and additionally sends
      recovery_pgp_keys when the seal is a cloud seal; when use_pgp_for_root is set
      it sends the pgp key collected by setRootKey as root_token_pgp_key. setKeys(data)
      stores the given PGP keys and setRootKey([key]) stores the first element as
      the root token PGP key.
  - codeRefs:
    - class:6fa21011585db592c4ced9808a05fc38
    - file:third_party/openbao/ui/app/controllers/vault/cluster/init.js
    id: r.init-request-outcome
    level: MUST
    text: initCluster sets loading true and clears errors before calling initCluster(data)
      on the cluster adapter; initSuccess(resp) clears loading, stores the response
      in keyData and reloads the model; initError(e) clears loading and assigns e.errors
      to the controller when e.httpStatus is 400, and otherwise rethrows the error.
  - codeRefs:
    - class:790ce691d60cbf30223e9aaf406544a6
    - file:third_party/openbao/ui/app/controllers/vault/cluster/mfa-setup.js
    id: r.mfa-setup-save-warning
    level: MUST
    text: saveUUIDandQrCode(uuid, qrCode) stores both values, where qrCode may be
      an empty string if admin-generate failed, and showWarning(warning) stores the
      warning and moves onStep to 2.
  - codeRefs:
    - class:790ce691d60cbf30223e9aaf406544a6
    - file:third_party/openbao/ui/app/controllers/vault/cluster/mfa-setup.js
    id: r.mfa-setup-steps
    level: MUST
    text: VaultClusterMfaSetupController tracks onStep starting at 1, warning, uuid
      and qrCode as empty strings; entityId is a getter returning auth.authData.entity_id;
      restartFlow() returns onStep to 1, and isUUIDVerified(verified) clears warning
      and advances to step 2 when verified, otherwise calls restartFlow().
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/oidc-callback.js
    id: r.oidc-callback-query-params
    level: MUST
    text: The oidc-callback controller exposes exactly the state and code query parameters,
      both initialized to null.
  - codeRefs:
    - class:65db596087c8cd3083db7d9a79e6210a
    - file:third_party/openbao/ui/app/controllers/vault/cluster/oidc-provider-ns.js
    id: r.oidc-provider-ns-inherits
    level: MUST
    text: VaultClusterOidcProviderNsController extends VaultClusterOidcProviderController
      with an empty body, so the namespace-scoped OIDC provider route uses the same
      query parameter set as the base route.
  - codeRefs:
    - class:6f341448bd8e5078e740d7692f1d79fa
    - file:third_party/openbao/ui/app/controllers/vault/cluster/oidc-provider.js
    id: r.oidc-provider-query-params
    level: MUST
    text: VaultClusterOidcProviderController declares queryParams scope, response_type,
      client_id, redirect_uri, state, nonce, display, prompt, max_age, code_challenge,
      code_challenge_method, request and request_uri, and initializes every one of
      them to null.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/settings.js
    id: r.settings-namespace-service
    level: MUST
    text: The cluster settings controller injects the namespace service so the settings
      route can read and change the active namespace.
  - codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/unseal.js
    id: r.unseal-transition
    level: MUST
    text: The unseal controller's transitionToCluster action reloads the model and
      then transitions safely to vault.cluster with the model name, and isUnsealed(data)
      reports unsealed as data.sealed being exactly false.
  upstream: self
