apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/sdk/helper/xor/xor.go xor.go@third_party/openbao/sdk/helper/xor/xor.go
- file:third_party/openbao/sdk/helper/xor/xor_test.go xor_test.go@third_party/openbao/sdk/helper/xor/xor_test.go
- function:3a5b1b307f6da1e8d7cfd677e6a37901 XORBase64@third_party/openbao/sdk/helper/xor/xor.go:32
- function:9c0ecf693088b895977e7459db29c29e XORBytes@third_party/openbao/sdk/helper/xor/xor.go:15
kind: SystemContext
metadata:
  name: third-party-openbao-sdk-helper-xor
  namespace: default
spec:
  intent: 'This context exists so that callers needing a simple, dependency-free XOR
    primitive -- typically for splitting or recombining a secret into two shares --
    can do so without reimplementing length checking, base64 decoding, and error wrapping.
    The package is vendored third-party code from the OpenBao SDK, so its behavior
    is fixed: unequal lengths, malformed base64, and empty decoded inputs are all
    hard errors rather than silently truncated or padded results.'
  interfaces:
  - file: third_party/openbao/sdk/helper/xor/xor.go
    kind: function
    name: XORBase64
    signature: func XORBase64(a, b string) ([]byte, error)
  - file: third_party/openbao/sdk/helper/xor/xor.go
    kind: function
    name: XORBytes
    signature: func XORBytes(a, b []byte) ([]byte, error)
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/sdk/helper/xor/xor_test.go
    id: r.tests-cover-base64-path
    level: SHOULD
    text: xor_test.go should keep TestBase64XOR covering XORBase64, including the
      error paths for malformed and empty base64 input, so the documented failure
      behavior stays verified.
  - codeRefs:
    - function:3a5b1b307f6da1e8d7cfd677e6a37901
    id: r.xorbase64-decoding
    level: MUST
    text: 'XORBase64 must decode both arguments with base64.StdEncoding, returning
      an error wrapping the decoder failure as "error decoding first base64 value:
      %w" or "error decoding second base64 value: %w" respectively, and must not proceed
      to XOR when either decode fails.'
  - codeRefs:
    - function:3a5b1b307f6da1e8d7cfd677e6a37901
    - function:9c0ecf693088b895977e7459db29c29e
    id: r.xorbase64-delegates
    level: MUST
    text: After both decodes succeed XORBase64 must pass the decoded byte slices to
      XORBytes and return its result and error unchanged, so that unequal decoded
      lengths surface the XORBytes length error rather than a base64 error.
  - codeRefs:
    - function:3a5b1b307f6da1e8d7cfd677e6a37901
    id: r.xorbase64-empty-rejected
    level: MUST
    text: XORBase64 must reject a decoded value that is nil or empty, first position
      with "decoded first base64 value is nil or empty" and second position with "decoded
      second base64 value is nil or empty", so an empty input never yields a zero-length
      result.
  - codeRefs:
    - file:third_party/openbao/sdk/helper/xor/xor.go
    - function:9c0ecf693088b895977e7459db29c29e
    id: r.xorbytes-equal-length
    level: MUST
    text: 'XORBytes must reject inputs whose lengths differ, returning a nil slice
      and an error of the form "length of byte slices is not equivalent: %d != %d"
      that reports both lengths, and must never read past the shorter slice.'
  - codeRefs:
    - function:9c0ecf693088b895977e7459db29c29e
    id: r.xorbytes-result
    level: MUST
    text: On equal-length inputs XORBytes must return a newly allocated slice of that
      same length whose element i is a[i] XOR b[i], leaving both input slices unmodified.
  upstream: self
