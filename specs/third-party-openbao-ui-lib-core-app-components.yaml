    - file:third_party/openbao/ui/lib/core/app/components/shamir-modal-flow.js
    id: r.overlays-and-flows
    level: MUST
    text: 'Confirmation and multi-step flows are forwarded by role: modal.js for the
      base overlay, confirm.js, confirm-action.js and confirmation-modal.js for confirmation,
      popup-menu.js and menu-loader.js for menus, and shamir-flow.js plus shamir-modal-flow.js
      for the Shamir unseal flow in inline and modal form.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/components/chevron.js
    - file:third_party/openbao/ui/lib/core/app/components/doc-link.js
