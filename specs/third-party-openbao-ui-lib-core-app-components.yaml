    level: SHOULD
    text: 'Small primitives and status surfaces keep dedicated modules so they can
      be dropped into any template: icon.js, chevron.js, tool-tip.js, info-tooltip.js,
      doc-link.js, external-link.js, download-button.js, empty-state.js, message-error.js,
      layout-loading.js, namespace-reminder.js and vault-logo-spinner.js each forward
      one addon component.'
  - codeRefs:
