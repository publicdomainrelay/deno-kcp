apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-flag-slice
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: The package exists so a CLI command can accept a flag that appears more
    than once, with each occurrence contributing one more string to an ordered list.
    It is a leaf helper in the vendored third-party tree, depending only on the standard
    library strings package for joining. It exists because the standard flag package
    has no built-in repeated string flag, and the OpenBao command layer needs the
    raw values in the order they were given.
  requirements:
  - id: r.both-methods-on-pointer-receiver
    level: MUST
    text: Both String and Set must be declared on a pointer receiver to StringFlag,
      so appending in Set mutates the caller's slice and the type satisfies the flag.Value
      interface when registered by address.
    codeRefs:
    - method:034969529844a720667adcf3ed37c437
    - method:7200b0805cd103fa07c81138c4863073
  - id: r.set-appends-value
    level: MUST
    text: StringFlag.Set must append the received value to the slice through the pointer
      receiver, so successive calls grow the collection instead of overwriting the
      previous entry, and it must return a nil error on every call because no input
      is rejected.
    codeRefs:
    - file:third_party/openbao/internal/helper/flag-slice/flag.go
    - method:034969529844a720667adcf3ed37c437
  - id: r.string-flag-is-string-slice
    level: MUST
    text: StringFlag must be defined as a named type whose underlying type is a slice
      of strings, so a repeated flag accumulates an ordered list of the values passed
      on the command line rather than a single value.
    codeRefs:
    - file:third_party/openbao/internal/helper/flag-slice/flag.go
    - type_alias:718f3bbeb4da00e52797b13de56943dd
  - id: r.string-joins-with-comma
    level: MUST
    text: StringFlag.String must return the elements of the slice joined with a single
      comma and no surrounding spaces, giving the flag package a stable textual rendering
      of the accumulated values.
    codeRefs:
    - file:third_party/openbao/internal/helper/flag-slice/flag.go
    - method:7200b0805cd103fa07c81138c4863073
  - id: r.tests-cover-behaviour
    level: SHOULD
    text: The package's behaviour should stay covered by the accompanying test file,
      which exercises the flag slice helper alongside the implementation.
    codeRefs:
    - file:third_party/openbao/internal/helper/flag-slice/flag_test.go
  interfaces:
  - name: StringFlag
    kind: type_alias
    signature: type StringFlag []string
    file: third_party/openbao/internal/helper/flag-slice/flag.go
  - name: StringFlag.Set
    kind: method
    signature: func (s *StringFlag) Set(value string) error
    file: third_party/openbao/internal/helper/flag-slice/flag.go
  - name: StringFlag.String
    kind: method
    signature: func (s *StringFlag) String() string
    file: third_party/openbao/internal/helper/flag-slice/flag.go
codeRefIndex:
- file:third_party/openbao/internal/helper/flag-slice/flag.go flag.go@third_party/openbao/internal/helper/flag-slice/flag.go
- file:third_party/openbao/internal/helper/flag-slice/flag_test.go flag_test.go@third_party/openbao/internal/helper/flag-slice/flag_test.go
- method:034969529844a720667adcf3ed37c437 StringFlag.Set@third_party/openbao/internal/helper/flag-slice/flag.go:16
- method:7200b0805cd103fa07c81138c4863073 StringFlag.String@third_party/openbao/internal/helper/flag-slice/flag.go:12
- type_alias:718f3bbeb4da00e52797b13de56943dd StringFlag@third_party/openbao/internal/helper/flag-slice/flag.go:10
