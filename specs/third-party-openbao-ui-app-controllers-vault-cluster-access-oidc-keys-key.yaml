apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-oidc-keys-key
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists to describe the behaviour of the OIDC key detail controller
    in the vendored OpenBao UI, so that the rotate and delete flows for a single OIDC
    key are specified in one place. It matters because these two actions mutate key
    material and delete it: rotation must pass both the key name and the verification
    TTL to the adapter, and deletion must leave the record consistent (rollback on
    failure) and navigate away only after a successful destroy. The context gives
    the controller''s service dependencies and its success/error reporting contract,
    which is what any change to the OIDC key detail screen has to preserve.'
  requirements:
  - id: r.controller-default-export
    level: MUST
    text: The module exports as its default a class OidcKeyDetailsController that
      extends the Ember Controller base class, and it injects the store, router, and
      flashMessages services into the class.
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  - id: r.delete-destroys-and-navigates
    level: MUST
    text: delete is an action that destroys the model record, flashes a success message
      on completion, and only then transitions through transitionToSafe on the injected
      router to the vault.cluster.access.oidc.keys route.
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  - id: r.delete-rollback-on-error
    level: MUST
    text: When the destroy in delete throws, the controller rolls back the model attributes,
      does not navigate away, and flashes a danger message built from the error's
      errors joined with '. ' when that list is present, otherwise from error.message.
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  - id: r.rotate-key-feedback
    level: MUST
    text: 'rotateKey reports the outcome through flashMessages: a success message
      naming the rotated key when the adapter call resolves, and a danger message
      carrying the caught error''s errors when it rejects.'
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  - id: r.rotate-key-task-wrapper
    level: SHOULD
    text: rotateKey is wrapped as an ember-concurrency task with the waitFor decorator,
      so the rotation runs as a managed, non-reentrant task while the UI waits on
      it.
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  - id: r.rotate-key-uses-adapter-and-ttl
    level: MUST
    text: rotateKey looks up the adapter for the oidc/key model through the injected
      store and calls its rotate method with the model's name and the model's verificationTtl,
      so both the key name and the verification TTL are sent for the rotation.
    codeRefs:
    - class:602b9abb5aa9578164145a739b5d6722
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
  interfaces:
  - name: OidcKeyDetailsController
    kind: class
    signature: export default class OidcKeyDetailsController extends Controller
    file: third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
codeRefIndex:
- class:602b9abb5aa9578164145a739b5d6722 OidcKeyDetailsController@third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js:13
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/oidc/keys/key/details.js
