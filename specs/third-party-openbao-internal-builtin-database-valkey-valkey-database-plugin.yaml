apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-database-valkey-valkey-database-plugin
  namespace: default
spec:
  intent: 'This context exists to describe the plugin binary boundary for the Valkey
    database secrets engine: the process-level entrypoint that turns the Valkey backend
    implementation into a servable database plugin. It matters because the plugin
    is launched as a separate process by OpenBao, so the contract here is narrow but
    load-bearing, namely successful construction of the backend, faithful error propagation
    when construction fails, and registration of the backend with the dbplugin RPC
    server so that the plugin''s Initialize, NewUser, UpdateUser, DeleteUser, Type
    and Close operations become reachable over the plugin protocol.'
  interfaces:
  - file: third_party/openbao/internal/builtin/database/valkey/valkey-database-plugin/main.go
    kind: function
    name: Run
    signature: func Run() error
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/builtin/database/valkey/valkey-database-plugin/main.go
    - function:cab50f04ee6e5d8d3846ed8e911fa937
    id: r.run-constructs-valkey-backend
    level: MUST
    text: Run must construct the Valkey database backend by calling valkey.New and
      must return the construction error unchanged when that call fails, before any
      RPC server is started.
  - codeRefs:
    - function:cab50f04ee6e5d8d3846ed8e911fa937
    id: r.run-returns-nil-on-success
    level: MUST
    text: Run must return nil when construction and serving complete without error.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/database/valkey/valkey-database-plugin/main.go
    - function:cab50f04ee6e5d8d3846ed8e911fa937
    id: r.run-serves-dbplugin
    level: MUST
    text: Run must assert the constructed backend to dbplugin.Database and pass it
      to dbplugin.Serve so the plugin exposes the database plugin interface over RPC.
  upstream: self
