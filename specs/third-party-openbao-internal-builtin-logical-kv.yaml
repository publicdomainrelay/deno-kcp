apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-logical-kv
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: This context exists so the versioned KV v2 engine and its legacy passthrough
    sibling can be changed without breaking their storage layout, their upgrade path,
    or their delete-version-after and version-pruning rules. It fixes the factory
    entry points, the path set a mount exposes, the seal-wrap prefixes, and the protobuf-backed
    metadata semantics that the path handlers read and write.
  requirements:
  - id: r.add-version
    level: MUST
    text: KeyMetadata.AddVersion must append a new version with the given created
      and deletion timestamps, return the new VersionMetadata and its version number,
      and keep the version map within configMaxVersions by evicting the oldest entries.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/path_data.go
    - method:1a6df70c296f2a6e7d8aa4a3d3d5abb2
  - id: r.behaviour-tests
    level: SHOULD
    text: 'Each non-generated file must keep its sibling test file covering the behaviour
      it defines: delete-version-after, passthrough, path config, path data, path
      delete, path destroy, path metadata, path subkeys and upgrade.'
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/delete_version_after_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/passthrough_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_config_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_data_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_delete_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_destroy_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_metadata_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/path_subkeys_test.go
    - file:third_party/openbao/internal/builtin/logical/kv/upgrade_test.go
  - id: r.cleanup-cancels-upgrade
    level: MUST
    text: versionedKVBackend.Cleanup must cancel the upgrade context when one was
      created, so background upgrade work stops when the mount is cleaned up.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - method:f5909d260f563448d984345fbd09d030
  - id: r.configuration-fields
    level: MUST
    text: Configuration must hold the mount-wide max versions, CAS-required, delete-version-after
      and metadata-CAS-required settings, all readable through generated getters and
      resettable through Reset.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:43c8a046b7f3e9d4474ff332247435b4
    - method:5b122daa4a84b8f06fb18c8d59a921ab
    - method:5cdd63e5d66feecd8add8f17b2ad22c1
    - method:846b341836637f13f26955fcb8f60911
    - method:f3a70af10d3f80a7e3e6a73554de9223
    - struct:602c72e936a6725a7d0d8bf7a7d02223
  - id: r.delete-version-after-getter
    level: MUST
    text: deleteVersionAfterGetter must expose GetDeleteVersionAfter returning a *durationpb.Duration,
      so both Configuration and KeyMetadata can be read through one policy interface.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/delete_version_after.go
    - method:8c335d66de99d3f69de17e0138118ac1
  - id: r.delete-version-after-policy
    level: MUST
    text: 'Configuration must express the delete-version-after policy: IsDeleteVersionAfterDisabled
      reports the disabled state, DisableDeleteVersionAfter sets it, and ResetDeleteVersionAfter
      clears it back to the unset value.'
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/delete_version_after.go
    - method:1a0d09d668b21f82b5e0182563b41385
    - method:48872ceadb4870f7b55413de370307f4
    - method:63a13ea1b4728b1bba83a69cf1ee2620
  - id: r.factory-alias
    level: MUST
    text: Factory must expose the versioned KV engine under the package's logical.Factory
      signature, taking a context and backend config and returning a logical.Backend
      or an error.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - function:5fcdf7982ae03bba4203bc39c5406900
  - id: r.invalidate-key
    level: MUST
    text: versionedKVBackend.Invalidate must be wired as the framework invalidate
      hook and must drop cached state for the given key.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - method:ecb117f78d684863ae523519b5e3af95
  - id: r.key-metadata-fields
    level: MUST
    text: KeyMetadata must carry the key name, the versions map, the current and oldest
      version numbers, the created and updated times, the max versions, the CAS-required
      flags, the delete-version-after duration and the custom metadata map, each readable
      through its getter.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:4b18eb3baf24c04dcb2c0cf759e72258
    - method:599e5305ed222a21773656d9594cda2b
    - method:82171a9381c918072e55f4ed4e84ffbc
    - method:d52f89735b4f3b670dfb0b1d5e56467d
    - struct:fc97c951480eea58123fbac86e4df12b
  - id: r.one-time-upgrade
    level: MUST
    text: The factory must check upgradeDone on the storage view and run Upgrade only
      when the upgrade has not already completed, so repeated mounts do not re-run
      the storage migration.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/upgrade.go
    - function:84e679d44e00f2f0fa66550bce1db1bc
    - method:fdd05a5d8c350a1c63d475834bfa2416
  - id: r.passthrough-factories
    level: MUST
    text: PassthroughBackendFactory and LeasedPassthroughBackendFactory must both
      delegate to LeaseSwitchedPassthroughBackend, passing leases false and true respectively,
      so a single constructor covers both mount types.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/passthrough.go
    - function:778fef452fd9feebfb8741bdccad3f35
    - function:90356317fc490e84ebfd192e84cb6157
    - function:d43fb0f0c8c3c2c25ec72221964346b4
  - id: r.passthrough-interface
    level: SHOULD
    text: The Passthrough interface must name the operations the passthrough backend
      family supports, so lease-generating and plain variants stay interchangeable
      behind it.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/passthrough.go
    - interface:53ea5d2d60b2adc53a6ac04664c96914
  - id: r.passthrough-lease-switch
    level: MUST
    text: A PassthroughBackend built with leases enabled must report true from GeneratesLeases,
      and one built without must report false.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/passthrough.go
    - method:c5e0e72d4faa4d927a79851e31cdc6fe
    - struct:a99b80262036efd07220ce3d5cec7438
  - id: r.path-registration-order
    level: MUST
    text: The versioned backend must register the config, data, metadata, detailed
      metadata, destroy and subkeys paths plus the delete paths, and must append the
      invalid path last so valid paths match first.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - function:84e679d44e00f2f0fa66550bce1db1bc
  - id: r.protobuf-message-contract
    level: MUST
    text: Every protobuf type in types.pb.go must implement the proto.Message surface
      — Reset, String, ProtoMessage, ProtoReflect and Descriptor — so the metadata
      records serialize to and from the storage format.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:0672e4f40697d72f6b93499722d1d493
    - method:2e1528ea4c97b2e57195886dd7e3f097
    - method:7b042dd4f0a69c5d18a91bd7dcac61ed
    - method:c095ed7b9c7da8c3cd0a61c11192fa48
  - id: r.salt-accessor
    level: MUST
    text: versionedKVBackend.Salt must return the salt.Salt for the given storage,
      used to hash sensitive metadata in responses.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - method:0fbd0f3cf35d1f1d1ec161fc87fe3661
  - id: r.seal-wrap-storage
    level: MUST
    text: The versioned backend must seal-wrap the versioned data prefix, the key
      policy prefix and the archived key policy prefix, so those three storage subtrees
      are never written unsealed.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - function:84e679d44e00f2f0fa66550bce1db1bc
  - id: r.upgrade-info-done
    level: MUST
    text: UpgradeInfo must carry StartedTime and Done so the upgrade records when
      it began and whether it finished, and Done must be readable through GetDone.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:37f0bb7dc1e0d867af2f2979d72969e3
    - method:6c4cece2ad1f07035c21e58b88820c58
  - id: r.version-fields
    level: MUST
    text: Version must store the opaque data blob together with its created time and
      deletion time, so a read can return the payload and its lifecycle timestamps.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:0731b8446cfba4fcbe3a49dc76d27c73
    - method:3dc9638c8f97f4ba51a1290d931e5183
    - method:4a69613ad0bf60102650a922b801e483
    - struct:9592f5063b50dc739a3be3a50f36d882
  - id: r.version-metadata-fields
    level: MUST
    text: VersionMetadata must record created time, deletion time and the destroyed
      flag per version, so deleted and destroyed versions stay distinguishable after
      the fact.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/types.pb.go
    - method:6e3e20ca59f6690b6e50bc3f72ce286c
    - method:8f53bbd4a8bf9299292fb50cab63aff7
    - method:f9d661b94003b422417cdedcfa5f644e
    - struct:1b3bc262aee3825d7be629949168940b
  - id: r.versioned-factory-entry
    level: MUST
    text: VersionedKVFactory must build a versionedKVBackend, reject a config whose
      BackendUUID is empty with an error, and use that UUID as the backend storage
      prefix so all keys are namespaced per mount.
    codeRefs:
    - file:third_party/openbao/internal/builtin/logical/kv/backend.go
    - function:84e679d44e00f2f0fa66550bce1db1bc
