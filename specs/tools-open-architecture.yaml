apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: tools-open-architecture
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  dependsOn:
  - sc.deno-kcp
  intent: 'The context exists so that deno-kcp''s architecture is a checked artifact
    rather than prose: arch.yaml states the repo''s upstreams, kinds, boundaries,
    crossings, risks and reconcile passes, and validate.py is the gate that refuses
    a document whose ids, paths, symbols, boundary tree, crossing accounting or reconcile
    wiring do not hold together. It keeps the declared architecture in step with the
    Go source by checking kind names, resources, phases, conditions and status facts
    against the APIResourceSchema manifests and Go type files, and it keeps the document
    itself honest by rejecting duplicate YAML keys and schema nodes that lack descriptions.'
  requirements:
  - id: r.arch-document-is-open-architecture
    level: MUST
    text: arch.yaml must declare $schema pointing at arch.schema.json, apiVersion
      open-architecture.dffml.github.io/v0alpha1, kind OpenArchitecture, and metadata
      naming the repo, the root id and the axes prefixes.
    codeRefs:
    - file:.tools/open-architecture/arch.yaml
  - id: r.boundary-tree-one-root
    level: MUST
    text: The execution-context boundary tree must have exactly one root, every context
      must carry enforced_by, and an instance carrying an object must sit in a namespace
      context whose workspace is listed by an ancestor.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.crossings-and-risks-accounted
    level: MUST
    text: A crossing's from and to must both be execution contexts in the boundary
      tree, and a crossing whose auth is none or whose gate is empty must be named
      by at least one risk.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.declared-refs-resolve
    level: MUST
    text: Every reference in the document must resolve to an id the index holds; a
      ref naming an id that nothing defines is an error, and knowing one id's kind
      from the prefix lets validate.py require the referenced id to be of a compatible
      kind.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.duplicate-yaml-keys-error
    level: MUST
    text: Loading arch.yaml must report a duplicate mapping key at its line number
      rather than silently taking the last value.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.ids-are-prefixed-refs
    level: MUST
    text: Every id must match the prefixed ref form, one of up, orch, type, cred,
      ov, sc, tb, x, r, rec or flow, followed by a dotted name; an id defined twice
      is an error and must be a ref to the existing definition instead.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.orphans-warned
    level: SHOULD
    text: An id that nothing references and that metadata.roots does not list should
      be reported as an orphan warning, while a root that is referenced elsewhere
      or that is not an unreferenced entry point is an error.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.outline-mode
    level: MAY
    text: validate.py may print the document's shape, its ids, kinds and refs without
      values, optionally limited to one subtree by a prefix argument, instead of running
      the checks.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.paths-and-symbols-exist
    level: MUST
    text: Every path-valued key must name a file that exists under the repo, and a
      path:Symbol value must name a symbol found in that file; orchestrator path keys
      and upstream executes entries are checked the same way.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.reconcile-wiring-closed
    level: MUST
    text: Each kind must have exactly one reconcile pass that writes its status; every
      read must name the spec or status of a kind and a field that kind declares;
      every wake named by a read must exist, and every declared wake must be used
      by some read.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.schema-check-first
    level: MUST
    text: validate.py must check the schema document itself before validating arch.yaml
      against it with jsonschema Draft202012Validator, and must report a schema node
      that carries a type without a description.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.spec-fields-read-or-unread
    level: MUST
    text: Every spec field of a kind must either be read by a reconciler or listed
      as unread, and a field listed unread must not also be read or fall outside the
      kind's spec fields.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.system-context-tree-checks
    level: MUST
    text: Each system context must carry upstream, overlay and orchestrator, must
      not name itself as its own upstream or overlay, and the upstream, overlay, depends_on
      and introduces graph must be free of cycles.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.validate-exits-nonzero-on-error
    level: MUST
    text: validate.py must exit 1 when any error is reported and exit 0 otherwise;
      warnings must never change the exit code.
    codeRefs:
    - file:.tools/open-architecture/validate.py
  - id: r.values-match-go-source
    level: MUST
    text: A kind's short name, plural resource, phases and conditions must agree with
      its APIResourceSchema manifest and Go type file, its status_facts keys must
      equal its status list, and each decides value must be a phase, a condition,
      self or none.
    codeRefs:
    - file:.tools/open-architecture/arch.yaml
    - file:.tools/open-architecture/validate.py
codeRefIndex:
- file:.tools/open-architecture/arch.yaml arch.yaml@.tools/open-architecture/arch.yaml
- file:.tools/open-architecture/validate.py validate.py@.tools/open-architecture/validate.py
