apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/.release/nfpm.yaml nfpm.yaml@third_party/openbao/.release/nfpm.yaml
kind: SystemContext
metadata:
  name: third-party-openbao-release
  namespace: default
spec:
  intent: 'The context exists so that OpenBao releases can be produced as native Linux
    packages without hand-written per-format stubs: nfpm reads this one YAML manifest
    and emits both deb and rpm artifacts. It pins the packaging contract that release
    automation depends on — package name and metadata, GOARCH/GOOS/VERSION substitution,
    the install layout and file modes, the config files that must survive upgrades,
    the maintainer script hooks, and the signing key source — so a change to any of
    those is a change to what ships to package repositories.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.build-time-substitution
    level: MUST
    text: Architecture, platform and version are not hard-coded; they are taken from
      the GOARCH, GOOS and VERSION environment variables respectively, so the same
      manifest yields per-target packages when release automation sets those variables.
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.install-layout-and-modes
    level: MUST
    text: 'Packaged contents map build outputs to install paths with explicit file
      modes: ./bin/bao goes to /usr/bin/bao with mode 0755, and ./LICENSE goes to
      /usr/share/doc/openbao/copyright with mode 0644.'
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.maintainer-scripts
    level: MUST
    text: The manifest wires the maintainer script hooks preinstall to ./.release/linux/preinst,
      postinstall to ./.release/linux/postinst, and postremove to ./.release/linux/postrm.
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.package-identity
    level: MUST
    text: 'The manifest declares the package identity and metadata that both deb and
      rpm artifacts carry: name openbao, vendor OpenBao, homepage https://openbao.org,
      maintainer OpenBao <openbao@lists.openssf.org>, license MPL-2.0, section default,
      and the multi-line description stating that OpenBao manages, stores and distributes
      sensitive data including secrets, certificates and keys.'
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.package-signing
    level: MUST
    text: Both the deb and rpm sections take their signature key file from the GPG_KEY_FILE
      environment variable, so signed packages require that variable to name a readable
      key file at build time.
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.preserved-config-files
    level: MUST
    text: 'Three files are installed as config|noreplace with mode 0644 so a package
      upgrade does not overwrite operator edits: ./.release/linux/package/etc/openbao/openbao.env
      to /etc/openbao/openbao.env, ./.release/linux/package/etc/openbao/openbao.hcl
      to /etc/openbao/openbao.hcl, and ./.release/linux/package/usr/lib/systemd/system/openbao.service
      to /usr/lib/systemd/system/openbao.service.'
  - codeRefs:
    - file:third_party/openbao/.release/nfpm.yaml
    id: r.relationship-declarations
    level: MUST
    text: The package declares it provides openbao, conflicts with the bao and bao-hsm
      packages, replaces bao, and depends on openssl, so a package manager treats
      an OpenBao install as mutually exclusive with the legacy bao packages and pulls
      in the OpenSSL runtime dependency.
  upstream: self
