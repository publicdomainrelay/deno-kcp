apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/internal/helper/buffer/buffer.go buffer.go@third_party/openbao/internal/helper/buffer/buffer.go
- function:d9f2047357fc09c009595c28886fbb98 NewSeekableReader@third_party/openbao/internal/helper/buffer/buffer.go:18
- method:a95c6c9f0e48d067e588a3810e481dbd nopSeekableReader.Close@third_party/openbao/internal/helper/buffer/buffer.go:16
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-buffer
  namespace: default
spec:
  intent: This context exists so the OpenBao code that needs to seek and close a stream
    can do so even when the caller supplies a plain io.Reader. It hides the buffering
    cost behind one constructor, lets already-seekable or already-closable readers
    pass through without a copy, and keeps the Close contract uniform through a no-op
    implementation for readers that were never closable.
  interfaces:
  - file: third_party/openbao/internal/helper/buffer/buffer.go
    kind: function
    name: NewSeekableReader
    signature: func NewSeekableReader(orig io.Reader) (io.ReadSeekCloser, error)
  - file: third_party/openbao/internal/helper/buffer/buffer.go
    kind: method
    name: nopSeekableReader.Close
    signature: func (n nopSeekableReader) Close() error
  repository: deno-kcp
  requirements:
  - codeRefs:
    - function:d9f2047357fc09c009595c28886fbb98
    id: r.buffer-fallback
    level: MUST
    text: When the input is neither an io.ReadSeekCloser nor an io.ReadSeeker, NewSeekableReader
      reads the input to exhaustion with io.ReadAll and returns a nopSeekableReader
      over a bytes.Reader built from that data.
  - codeRefs:
    - file:third_party/openbao/internal/helper/buffer/buffer.go
    - method:a95c6c9f0e48d067e588a3810e481dbd
    id: r.close-is-noop
    level: MUST
    text: nopSeekableReader.Close always returns nil and never closes or mutates the
      embedded reader, so callers can close a buffered or seek-only reader without
      disturbing the underlying source.
  - codeRefs:
    - function:d9f2047357fc09c009595c28886fbb98
    id: r.close-source-on-buffer
    level: MUST
    text: In the buffering fallback, if the original reader also implements io.Closer,
      NewSeekableReader closes it after the successful read; a close error is returned
      to the caller together with a nil reader.
  - codeRefs:
    - file:third_party/openbao/internal/helper/buffer/buffer.go
    - function:d9f2047357fc09c009595c28886fbb98
    id: r.pass-through-readseekcloser
    level: MUST
    text: NewSeekableReader returns the original reader unchanged, without copying
      or wrapping, when the input already implements io.ReadSeekCloser.
  - codeRefs:
    - function:d9f2047357fc09c009595c28886fbb98
    id: r.read-error-propagates
    level: MUST
    text: NewSeekableReader returns a nil reader and the underlying error when io.ReadAll
      fails, and does not close the source reader in that case.
  - codeRefs:
    - function:d9f2047357fc09c009595c28886fbb98
    id: r.wrap-readseeker
    level: MUST
    text: When the input implements io.ReadSeeker but not io.ReadSeekCloser, NewSeekableReader
      returns a nopSeekableReader value embedding that seeker, so seeking is delegated
      to the original and closing becomes a no-op.
  upstream: self
