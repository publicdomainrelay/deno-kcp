apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/config/content-security-policy.js content-security-policy.js@third_party/openbao/ui/config/content-security-policy.js
- file:third_party/openbao/ui/config/environment.js environment.js@third_party/openbao/ui/config/environment.js
- file:third_party/openbao/ui/config/targets.js targets.js@third_party/openbao/ui/config/targets.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-config
  namespace: default
spec:
  intent: 'These files exist so the OpenBao UI has one declarative place for its environment-dependent
    build settings, its Content-Security-Policy directives, and its browser support
    targets. The context documents the contract each config module must keep: what
    ember-cli reads from ENV, what the CSP plugin enforces, and which browsers the
    build targets, so that changes to the vendored OpenBao UI stay reviewable and
    auditable.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/config/environment.js
    id: r.app-endpoint-lists
    level: MUST
    text: The returned ENV.APP must carry the polling endpoint list ['sys/health',
      'sys/seal-status'], the namespace-root endpoint list ['sys/health', 'sys/seal-status',
      'sys/internal/counters/config'], and DEFAULT_PAGE_SIZE 100 for the client-side
      pagination default.
  - codeRefs:
    - file:third_party/openbao/ui/config/targets.js
    id: r.browser-targets
    level: MUST
    text: targets.js must export a browsers list naming the last 1 Chrome, Firefox,
      and Safari versions, which the build uses as its browserslist targets.
  - codeRefs:
    - file:third_party/openbao/ui/config/content-security-policy.js
    id: r.csp-config
    level: MUST
    text: 'content-security-policy.js must export a function of the environment name
      that returns the ember-cli-content-security-policy config: delivery [''header'',
      ''meta''], enabled for every environment except production, failTests true,
      reportOnly false, and the directive map default-src ''none''; script-src, font-src,
      connect-src, media-src ''self''; img-src ''self'' and data:; style-src ''unsafe-inline''
      and ''self''; form-action ''none''.'
  - codeRefs:
    - file:third_party/openbao/ui/config/environment.js
    id: r.environment-branches
    level: MUST
    text: 'The function must branch on the environment name: in development it enables
      APP.LOG_TRANSITIONS and enables ember-cli-mirage with the handler from process.env.MIRAGE_DEV_HANDLER
      when that variable is defined; in test it sets locationType ''none'', rootElement
      ''#ember-testing'', autoboot false, flashMessageDefaults.timeout 50, and mirage
      disabled; in any non-production environment it lowers APP.DEFAULT_PAGE_SIZE
      to 15.'
  - codeRefs:
    - file:third_party/openbao/ui/config/environment.js
    id: r.environment-exports-env-function
    level: MUST
    text: environment.js must export a function that takes the Ember environment name
      (development, test, or production) and returns the ENV object, populated with
      modulePrefix 'vault', rootURL '/ui/', serviceWorkerScope '/v1/sys/storage/raft/snapshot',
      locationType 'history', and the EmberENV flags that disable Date and String
      prototype extension.
  - codeRefs:
    - file:third_party/openbao/ui/config/environment.js
    id: r.welcome-message-env
    level: MUST
    text: The returned ENV must set welcomeMessage from the UI_AUTH_WELCOME environment
      variable, so the login welcome text is configured outside the build.
  upstream: self
