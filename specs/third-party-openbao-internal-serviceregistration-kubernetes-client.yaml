    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Client.Shutdown
    kind: method
    signature: func (c *Client) Shutdown()
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Config
    kind: struct
    signature: type Config struct
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/config.go
  - name: ErrNotFound
    kind: struct
    signature: type ErrNotFound struct
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: ErrNotFound.Error
    kind: method
    signature: func (e *ErrNotFound) Error() string
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Metadata
    kind: struct
    signature: type Metadata struct
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: New
    kind: function
    signature: func New(logger hclog.Logger) (*Client, error)
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Patch
    kind: struct
    signature: type Patch struct
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: PatchOperation
    kind: type_alias
    signature: type PatchOperation string
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Pod
    kind: struct
    signature: type Pod struct
    file: third_party/openbao/internal/serviceregistration/kubernetes/client/client.go
  - name: Sanitize
    kind: function
