  - name: JobManager
    kind: struct
    signature: type JobManager struct { name string; queues map[string]*list.List;
      quit chan struct{}; newWork chan struct{}; workerPool *dispatcher; workerCount
      map[string]int; onceStart sync.Once; onceStop sync.Once; logger log.Logger;
      totalJobs int; metricSink *metricsutil.ClusterMetricSink; wg sync.WaitGroup;
      l sync.RWMutex; queuesIndex []string; lastQueueAccessed int }
    file: third_party/openbao/internal/helper/fairshare/jobmanager.go
  - name: JobManager.AddJob
    kind: method
    signature: func (j *JobManager) AddJob(job Job, queueID string)
    file: third_party/openbao/internal/helper/fairshare/jobmanager.go
