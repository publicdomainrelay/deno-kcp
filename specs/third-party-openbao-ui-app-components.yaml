    - file:third_party/openbao/ui/app/components/date-dropdown.js
    id: r.date-dropdown-bounds
    level: MUST
    text: DateDropdown defaults currentDate to now, derives currentYear and currentMonthIdx,
      and offers the last five years with all months selectable. selectMonth(month,
      dropdown) disables the current year when the chosen month is later than the
      current month; selectYear(year, dropdown) caps selectable months at the current
      month when the current year is chosen; both close the dropdown. handleSubmit
      runs args.validateDate when provided, stores the returned error in invalidDate
      and aborts the submit when a date is invalid.
  - codeRefs:
    - class:facc46287237c39f58512dce1fb176a2
    - file:third_party/openbao/ui/app/components/diff-version-selector.js
    id: r.diff-version-selector
    level: MUST
    text: DiffVersionSelector tracks leftSideVersionDataSelected, leftSideVersionSelected,
      rightSideVersionDataSelected, rightSideVersionSelected, statesMatch and visualDiff
      on the secret-v2-version adapter. It initialises the left side at the model's
      currentVersion and the right side at rightSideVersionInit, which is currentVersion
      minus one and 0 when currentVersion is 1; both queries resolve to null on failure
      rather than rejecting. The constructor calls createVisualDiff, which feeds the
      selected or initial version data through jsondiffpatch to produce the visual
      diff.
