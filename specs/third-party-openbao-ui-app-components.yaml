  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/components/auth-form-options.js
    - file:third_party/openbao/ui/app/components/auth-form.js
    - file:third_party/openbao/ui/app/components/auth-jwt.js
    - file:third_party/openbao/ui/app/components/b64-toggle.js
    id: r.auth-components
    level: MUST
    text: auth-form.js drives login by rendering the auth methods offered by the backend
      and dispatching the chosen method, auth-jwt.js and auth-form-options.js render
      the JWT/OIDC and method-option variants of that form, and b64-toggle.js toggles
      base64 display of a value in the auth payload.
  - codeRefs:
    - class:0f8cd80e96c67a9863b0e49142868be5
    - class:e79c402a8d34bbb5ea5438c598c80662
    - file:third_party/openbao/ui/app/components/configure-aws-secret.js
    id: r.aws-secret-config
    level: MUST
    text: 'ConfigureAwsSecretComponent persists AWS secrets engine configuration:
      saveRootCreds(data, event) writes the root credentials, saveLease(data, event)
      writes the lease settings, and handleTtlChange(name, ttlObj) reconciles the
      submitted TTL object with the form state.'
  - codeRefs:
    - class:4a0e74f4d3f1e7b0d11b2be3e7764c64
    - file:third_party/openbao/ui/app/components/calendar-widget.js
    id: r.calendar-widget-range
    level: MUST
    text: CalendarWidget keeps currentDate, calendarDisplayDate, showCalendar, tooltipTarget
      and tooltipText as state; it derives startDate, endDate, displayYear and the
      disableFutureYear and disablePastYear bounds from them, builds the month grid
      with widgetMonths, and reacts to addTooltip, removeTooltip, addYear, subYear,
      toggleShowCalendar, handleDateShortcut(dropdown, { target }) and selectMonth(month,
      dropdown) by moving the displayed month or toggling the popup.
