kind: SystemContext
metadata:
  name: third-party-openbao-internal-vault-external-tests-kms
  namespace: default
spec:
  intent: 'The context exists so that the builtin-transit and external-transit test
    entrypoints can drive the same transit and PKI scenarios against a real server
    without duplicating the flow. It separates the reusable exercise functions from
    the thin test functions, letting a KMS implementation be validated by mounting
    transit or PKI, binding keys through the sys/external-keys config and grant API,
    and exercising encrypt/decrypt and sign/verify or CA issuance over that external
    key. Its purpose is coverage of the external key workflow: the negative case where
    a transit external-key write is rejected before a grant, and the positive cases
    after the grant is written.'
  interfaces:
  - file: third_party/openbao/internal/vault/external_tests/kms/testing.go
    kind: function
    name: ExercisePKICA
    signature: func ExercisePKICA(t *testing.T, client *api.Client, mountName string,
      issuerName string)
  - file: third_party/openbao/internal/vault/external_tests/kms/testing.go
    kind: function
    name: ExercisePKIForKey
    signature: func ExercisePKIForKey(t *testing.T, client *api.Client, baseName string)
  - file: third_party/openbao/internal/vault/external_tests/kms/testing.go
    kind: function
    name: ExercisePKIIntermediateCA
    signature: func ExercisePKIIntermediateCA(t *testing.T, client *api.Client, mountName
      string, keyName string, extKeyRef string)
  - file: third_party/openbao/internal/vault/external_tests/kms/testing.go
    kind: function
    name: ExercisePKIRootCA
    signature: func ExercisePKIRootCA(t *testing.T, client *api.Client, mountName
      string, keyName string, extKeyRef string)
  - file: third_party/openbao/internal/vault/external_tests/kms/testing.go
