    level: MUST
    text: 'The encrypted storage decorator implements the logical.Storage surface:
      Put encrypts the entry key before writing, Get resolves it back, Delete removes
      it, and List and ListPage return the decrypted child names under a prefix with
      ListPage honouring the after and limit paging arguments.'
