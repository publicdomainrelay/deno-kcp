    text: NewEncryptedKeyStorageWrapper validates the config policy and returns ErrPolicyDerivedKeys
      when the policy has derived keys or ErrPolicyConvergentEncryption when it lacks
      convergent encryption, so only a convergent, non-derived AES256-GCM96 policy
      is accepted; the returned wrapper's Wrap method decorates a logical.Storage
