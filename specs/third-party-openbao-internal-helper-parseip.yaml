codeRefIndex:
- file:third_party/openbao/internal/helper/parseip/parseip.go parseip.go@third_party/openbao/internal/helper/parseip/parseip.go
- file:third_party/openbao/internal/helper/parseip/parseip_test.go parseip_test.go@third_party/openbao/internal/helper/parseip/parseip_test.go
- function:1461006423d5a06241fef7e963c65dcd TrimLeadingZeroesCIDR@third_party/openbao/internal/helper/parseip/parseip.go:69
kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-parseip
  namespace: default
spec:
  intent: 'This context exists to document the small text-normalization helper OpenBao
    uses before parsing addresses, kept as vendored third-party code inside the deno-kcp
    repository. Its purpose is to make address strings with leading zeroes in octets
    (for example 010.010.20.5 or ::192.00.002.33) comparable and parseable by canonicalizing
    them, since Go''s net.ParseIPSloppy rejects or mishandles such forms. The spec
    pins down the contract that callers depend on: CIDR input has only its address
    portion rewritten and its prefix length preserved verbatim, while anything that
    is not a well-formed CIDR string passes through untouched.'
  interfaces:
  - file: third_party/openbao/internal/helper/parseip/parseip.go
    kind: function
    name: TrimLeadingZeroesCIDR
    signature: func TrimLeadingZeroesCIDR(s string) string
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/helper/parseip/parseip.go
    id: r.embedded-ipv4-tail
    level: MUST
    text: 'Address normalization handles IPv6 addresses whose final colon-delimited
      segment is an embedded IPv4 address: the helper scans from the end of the string
      for a colon at which the remainder parses as a sloppy IP, strips leading zeroes
      from that IPv4 tail, and keeps the IPv6 prefix unchanged; if no such colon is
      found, the whole string is treated as IPv4.'
  - codeRefs:
    - function:1461006423d5a06241fef7e963c65dcd
    id: r.invalid-cidr-passthrough
    level: MUST
    text: When the input does not split into exactly two "/"-separated pieces, TrimLeadingZeroesCIDR
      returns the input string unchanged, so plain IP addresses, empty strings, and
      strings with multiple or zero slashes are passed through byte for byte.
  - codeRefs:
    - file:third_party/openbao/internal/helper/parseip/parseip_test.go
    id: r.table-driven-test
    level: SHOULD
    text: The package's behavior is pinned by a table-driven test that, for each case,
      asserts trimLeadingZeroesIP produces the canonical address, that TrimLeadingZeroesCIDR
      returns non-CIDR input verbatim, and that appending "/32" to the input yields
      the canonical address followed by "/32".
  - codeRefs:
    - file:third_party/openbao/internal/helper/parseip/parseip.go
    - function:1461006423d5a06241fef7e963c65dcd
    id: r.trim-leading-zeroes-cidr
    level: MUST
    text: TrimLeadingZeroesCIDR accepts a string, splits it on "/", and, when the
      split yields exactly two pieces, rewrites the address piece with trimLeadingZeroesIP
      and rejoins the pieces with "/", returning the normalized CIDR; the prefix-length
      piece is never altered.
  upstream: self
