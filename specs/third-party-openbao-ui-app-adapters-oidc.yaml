- class:fac811cefc7294c3c17c59cf40355943 OidcKeyAdapter@third_party/openbao/ui/app/adapters/oidc/key.js:8
- file:third_party/openbao/ui/app/adapters/oidc/assignment.js assignment.js@third_party/openbao/ui/app/adapters/oidc/assignment.js
- file:third_party/openbao/ui/app/adapters/oidc/client.js client.js@third_party/openbao/ui/app/adapters/oidc/client.js
