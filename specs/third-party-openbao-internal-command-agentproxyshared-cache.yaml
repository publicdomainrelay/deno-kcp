  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/api_proxy.go
    - function:61da32d59d1876de30750dc2b8ef71cb
    - struct:64c3ca80392f178b7b9e63336363a071
    - struct:71206f4260b7c0740a7b5274d0137482
    id: r.apiproxy-requires-client
    level: MUST
    text: NewAPIProxy must reject a nil APIProxyConfig.Client by returning a nil Proxier
      and an error reading "nil API client"; otherwise it must construct an APIProxy
      carrying the config's client, logger, user agent string and user agent string
      function.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - method:2f668cb9c6e9d5d886d9578ca327b6ca
    id: r.cache-clear-handler
    level: MUST
    text: LeaseCache.HandleCacheClear must return an http.Handler that clears cached
      entries for the request, so an operator or the agent's own control path can
      invalidate the cache over HTTP.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/proxy.go
    - struct:61462adc6d54d695c8ca3ff258d691cc
    - struct:d59c403f865347a2ace07e80ecde86c1
    id: r.cache-meta-in-response
    level: MAY
    text: SendResponse may carry CacheMeta describing the cache state of the response
      so handlers and clients can tell a cached answer from a freshly proxied one.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - function:3ba9a60a8e419435a75f9021654ae94b
    - struct:9143649ff40bd03257d57780ef07a3db
    - struct:bee91e04aef303ad1a5b51866eb68823
    id: r.lease-cache-construction
    level: MUST
    text: NewLeaseCache must construct a LeaseCache from a LeaseCacheConfig, returning
      an error rather than a partially usable cache when the configuration is invalid,
      and the resulting LeaseCache must serve as the Proxier that stores and reuses
      responses.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - method:7a0834e74012cfdbf5dc1e53d3b28f90
    - method:8e9496434f57eac64a19d4af20b14795
    - method:d255a5ce2644390517f61e30993d649a
    id: r.lease-cache-entry-maintenance
    level: MUST
    text: 'LeaseCache must expose entry maintenance that acts on the in-memory cache
      index: Set inserts or updates an index entry, Evict removes one, and Flush clears
      the cache, each returning an error when the underlying cache operation fails.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - method:7a0834e74012cfdbf5dc1e53d3b28f90
    - method:bc8c62bda0b52028e90875ca129e4a4f
    id: r.lease-cache-send-caching
    level: MUST
    text: LeaseCache.Send must decide per request whether the response is cacheable,
      serve a matching entry from the in-memory index when one is valid, and otherwise
      fetch through the upstream client and store the result with its lease so later
      identical requests are satisfied without hitting upstream.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - method:496e34e748f8a4229e4c5331cadd644d
    - method:4a536980b121b274b6f9d2986b0498f4
    id: r.lease-cache-shutdown-and-autoauth
    level: MUST
    text: LeaseCache must track shutdown state through SetShuttingDown so in-flight
      behavior changes once the agent stops, and must accept a token through RegisterAutoAuthToken
      so requests can be authorized with the auto-auth token rather than the client's
      own.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/listener.go
    - function:066c605bd6c667b70919d2eda8f85cc7
    - struct:222f85cecb09886cfd7361ac8fdbaa58
    id: r.listener-bootstrap
    level: MUST
    text: StartListener must turn a configutil.Listener plus an hclog.Logger into
      a ListenerBundle containing the bound listeners and the address they serve on,
      returning an error when the listener cannot be created.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/lease_cache.go
    - method:364f71fd5698665d24456387697a4f56
    - method:56c8c42ddf9d4760b9b507484a2fdd29
    - method:c871dd4238246c098b6f7ee62180f629
    id: r.persistent-storage-hooks
    level: MUST
    text: 'LeaseCache must support optional BoltDB-backed persistence: SetPersistentStorage
      attaches a *cacheboltdb.BoltStorage, PersistentStorage returns the attached
      storage, and Restore repopulates the in-memory cache from that storage for the
      given context.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/proxy.go
    - interface:3f99f353c860aac9aee1e27f73bc3d1f
    - method:0ed25ce68f40e2ae40e2f92048b8e3a9
    - method:bc251d186b496bc9f4f8985663659102
    - method:bc8c62bda0b52028e90875ca129e4a4f
    id: r.proxier-single-method
    level: MUST
    text: 'The Proxier interface must stay the single-method contract for sending
      a request through the cache layer: Send takes a context and a *SendRequest and
      returns a *SendResponse or an error, and both APIProxy and LeaseCache must satisfy
      it.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/handler.go
    - function:f1d3ae36f34877a17d3cb0f6ca86a806
    id: r.proxy-handler-wiring
    level: MUST
    text: ProxyHandler must build an http.Handler that sends requests through the
      supplied Proxier, writes to the supplied inmemSink, logs through the supplied
      hclog.Logger, and honors the proxyVaultToken flag when deciding whether the
      client's Vault token is forwarded.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/proxy.go
    - struct:416f160565b75ca927b9a8e36d0e2885
    id: r.send-request-shape
    level: MUST
    text: SendRequest must remain the unit of work handed to a Proxier, carrying the
      outgoing *http.Request plus the request metadata the cache needs to key and
      authorize the call, so both the plain proxy and the lease cache accept the same
      input.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/proxy.go
    - function:d57ef6e3217c3f808459e2842d0ccc2d
    - struct:61462adc6d54d695c8ca3ff258d691cc
    - struct:d59c403f865347a2ace07e80ecde86c1
    id: r.send-response-construction
    level: MUST
    text: NewSendResponse must combine an api.Response with its already-read response
      body bytes into a SendResponse, so downstream cache and handler code can inspect
      status, headers and CacheMeta together with the body.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/testing.go
    - function:6eb376e38d7382717ba68c6c77a986c9
    - method:4896fbe21f146c34696c144198741f67
    - method:7fe2b11ccf35ad5e4244a767541e3b35
    - method:8b6939d4b3c2cc7219f9d32d2e199324
    - method:d13c8469f09338bf6f418c467acbd39d
    - method:e2ec35611b55f1b7fd75bf5326a89404
    id: r.test-doubles-implement-proxier
    level: SHOULD
    text: 'The testing helpers must keep mock Proxiers implementing the Proxier interface
      so cache tests can substitute the upstream: NewMockProxier returns a mock that
      serves a fixed list of responses and reports its position through ResponseIndex,
      while mockTokenVerifierProxier and mockDelayProxier add request-token capture
      and delayed responses respectively.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/api_proxy.go
    - method:bc251d186b496bc9f4f8985663659102
    - struct:64c3ca80392f178b7b9e63336363a071
    id: r.user-agent-annotated
    level: SHOULD
    text: APIProxy.Send should set the outgoing User-Agent from the userAgentStringFunction
      applied to the proxied client's user agent, falling back to the configured userAgentString
      when the proxied client supplies none.
  upstream: self
