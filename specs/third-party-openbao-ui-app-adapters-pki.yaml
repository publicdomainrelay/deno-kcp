kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-adapters-pki
  namespace: default
spec:
  intent: This context pins down the client-side HTTP contract that the OpenBao web
    UI uses to talk to the PKI secrets engine. Each adapter owns one PKI model family
    and exists to translate Ember Data operations (create, update, query, queryRecord,
    findRecord, deleteRecord) into the correct PKI mount URLs and payloads. The specification
    records which endpoint each operation must hit, which adapterOptions drive URL
    selection, and which invalid state combinations must be rejected, so that the
    UI behaves correctly against either the legacy PKI endpoints (root/generate, intermediate/generate,
    config/ca) or the newer issuer endpoints (issuers/generate/..., issuers/import/bundle).
  interfaces:
  - file: third_party/openbao/ui/app/adapters/pki/action.js
    kind: class
    name: PkiActionAdapter
    signature: class PkiActionAdapter extends ApplicationAdapter
  - file: third_party/openbao/ui/app/adapters/pki/issuer.js
    kind: class
    name: PkiIssuerAdapter
    signature: class PkiIssuerAdapter
  - file: third_party/openbao/ui/app/adapters/pki/key.js
    kind: class
    name: PkiKeyAdapter
    signature: class PkiKeyAdapter extends ApplicationAdapter
  - file: third_party/openbao/ui/app/adapters/pki/role.js
    kind: class
    name: PkiRoleAdapter
    signature: class PkiRoleAdapter
  - file: third_party/openbao/ui/app/adapters/pki/sign-intermediate.js
    kind: class
    name: PkiSignIntermediateAdapter
    signature: class PkiSignIntermediateAdapter
  - file: third_party/openbao/ui/app/adapters/pki/tidy.js
    kind: class
    name: PkiTidyAdapter
    signature: class PkiTidyAdapter extends ApplicationAdapter
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:8bcf804472eb5da0200699200b48d780
    - file:third_party/openbao/ui/app/adapters/pki/action.js
    id: r.action-create-record
    level: MUST
    text: createRecord obtains the serializer for the model name from the store, resolves
      the URL through urlForCreateRecord, and POSTs the serialized snapshot to it
      so generation, import and rotation actions all flow through one write path.
  - codeRefs:
    - class:8bcf804472eb5da0200699200b48d780
    - file:third_party/openbao/ui/app/adapters/pki/action.js
    id: r.action-url-selection
    level: MUST
    text: 'urlForCreateRecord picks the backend as adapterOptions.mount when present
      and otherwise snapshot.record.backend, throws when either backend or adapterOptions.actionType
      is missing, and then maps actionType onto an endpoint: import to issuers/import/bundle
      when useIssuer is set else config/ca; generate-root to issuers/generate/root/<type>
      when useIssuer is set else root/generate/<type>; generate-csr to issuers/generate/intermediate/<type>
      when useIssuer is set else intermediate/generate/<type>; sign-intermediate to
      issuer/<encoded issuerRef>/sign-intermediate; and rotate-root to root/rotate/<type>.
      Any other actionType fails the assert.'
  - codeRefs:
    - file:third_party/openbao/ui/app/adapters/pki/action.js
    - file:third_party/openbao/ui/app/adapters/pki/key.js
    - file:third_party/openbao/ui/app/adapters/pki/tidy.js
    id: r.encode-path-segments
    level: MUST
    text: Backend mount names, key ids and issuer refs are passed through encodePath
      before being interpolated into URLs, so names containing URL-unsafe characters
      still address the right mount.
  - codeRefs:
    - class:93f6fcfe084a87fdc87df1a1e76109fe
    - file:third_party/openbao/ui/app/adapters/pki/issuer.js
    id: r.issuer-backend-resolution
    level: MUST
    text: PkiIssuerAdapter derives the mount from the snapshot through _getBackend
      and builds issuer URLs through urlForQuery(backend, id), with optionsForQuery(id)
      supplying the request options, so issuer reads and writes are always scoped
      to the resolved backend.
  - codeRefs:
    - class:93f6fcfe084a87fdc87df1a1e76109fe
    - file:third_party/openbao/ui/app/adapters/pki/issuer.js
    id: r.issuer-delete-all
    level: MUST
    text: 'deleteAllIssuers(backend) is exposed on the adapter and declared on the
      matching PkiIssuerAdapter type as deleteAllIssuers(backend: string), so callers
      can remove every issuer under one mount without enumerating records.'
  - codeRefs:
    - class:93f6fcfe084a87fdc87df1a1e76109fe
    - file:third_party/openbao/ui/app/adapters/pki/issuer.js
    id: r.issuer-metadata-and-write
    level: MUST
    text: query and queryRecord load issuer records and getIssuerMetadata(store, type,
      query, response, id) normalizes the response payload, while updateRecord(store,
      type, snapshot) writes issuer changes back through the same backend-scoped URL.
  - codeRefs:
    - class:3c0112d28f50400745990510767759a0
    - file:third_party/openbao/ui/app/adapters/pki/key.js
    id: r.key-base-url
    level: MUST
    text: _baseUrl returns <encoded backend>/keys when no id is given and <encoded
      backend>/key/<encoded id> when an id is given, so collection and single-record
      requests differ by path shape.
  - codeRefs:
    - class:3c0112d28f50400745990510767759a0
    - file:third_party/openbao/ui/app/adapters/pki/key.js
    id: r.key-create-and-id-fallback
    level: MUST
    text: createRecord POSTs to <keys url>/import when adapterOptions.import is set
      and to <keys url>/generate/<record.type> otherwise; when the response is not
      an import and carries no data.key_id, the adapter injects key_id from the snapshot's
      keyName attribute so the record id stays stable.
  - codeRefs:
    - class:3c0112d28f50400745990510767759a0
    - file:third_party/openbao/ui/app/adapters/pki/key.js
    id: r.key-query-and-update
    level: MUST
    text: updateRecord POSTs only the serialized key_name to the single-key URL; query
      GETs the collection URL with list=true; queryRecord GETs the single-key URL
      built from query.backend and query.id; deleteRecord removes the single key.
  - codeRefs:
    - class:3c0112d28f50400745990510767759a0
    - class:8bcf804472eb5da0200699200b48d780
    - class:cc61e15fb8e344ac63c02f60b7085f42
    - file:third_party/openbao/ui/app/adapters/pki/issuer.js
    id: r.namespace-v1
    level: MUST
    text: Each PKI adapter sets namespace = 'v1' so that buildURL() prefixes every
      request path with the v1 API namespace, and the mount is appended to that base.
  - codeRefs:
    - class:35ae48da17ffe424cf063c5fbab11046
    - class:5f748f52e8ff0c08e3cfa27b072fddea
    - file:third_party/openbao/ui/app/adapters/pki/role.js
    - file:third_party/openbao/ui/app/adapters/pki/sign-intermediate.js
    id: r.role-and-sign-intermediate-adapters
    level: MUST
    text: PkiRoleAdapter and PkiSignIntermediateAdapter exist as the default exports
      for the pki role and sign-intermediate record families, giving those models
      their own HTTP adapter alongside the action, key, tidy and issuer adapters.
  - codeRefs:
    - class:cc61e15fb8e344ac63c02f60b7085f42
    - file:third_party/openbao/ui/app/adapters/pki/tidy.js
    id: r.tidy-base-url
    level: MUST
    text: _baseUrl returns the built URL joined with the encoded backend mount, and
      every tidy request appends either /tidy or /config/auto-tidy to that value.
  - codeRefs:
    - class:cc61e15fb8e344ac63c02f60b7085f42
    - file:third_party/openbao/ui/app/adapters/pki/tidy.js
    id: r.tidy-create-manual-only
    level: MUST
    text: PkiTidyAdapter.createRecord throws Error('Auto tidy type models are never
      new, please use findRecord') when adapterOptions.tidyType is 'auto'; otherwise
      it serializes the snapshot with that tidy type, POSTs to <backend>/tidy, and
      resolves a synthesized record with id set to the backend and type 'pki/tidy'.
  - codeRefs:
    - class:cc61e15fb8e344ac63c02f60b7085f42
    - file:third_party/openbao/ui/app/adapters/pki/tidy.js
    id: r.tidy-update-auto-only
    level: MUST
    text: PkiTidyAdapter.updateRecord throws Error('Manual tidy type models are always
      new, please use createRecord') when adapterOptions.tidyType is 'manual'; otherwise
      it POSTs the serialized snapshot to <backend>/config/auto-tidy using the record
      id as the backend, and findRecord GETs the same config/auto-tidy path because
      only auto-tidy is ever read.
  upstream: self
