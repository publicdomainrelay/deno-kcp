apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-physical-inmem
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'This context exists so the deno-kcp repository carries a self-contained,
    dependency-free physical storage backend for OpenBao tests and local runs, without
    touching a real disk or network store. It is the transactional and HA-capable
    in-memory implementation: tests can inject failures per operation, drive transactions
    and roll them back, and take advisory locks that simulate HA leader election,
    all with deterministic in-process state. Read it to learn what guarantees the
    in-memory backend offers before relying on it as a stand-in for a durable backend,
    and to see exactly which failure and locking knobs tests can turn.'
  requirements:
  - id: r.backend-inmem-store
    level: MUST
    text: InmemBackend stores physical entries in an in-memory map guarded by an RWMutex
      and serves the physical.Backend operations Put, Get, Delete, List and ListPage;
      Get on a missing key returns a nil entry, and List returns the keys under a
      prefix.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - method:1e31f66440b30209f4f5a9e6726329ce
    - method:3c04295126306cdfd876bc07e3908a2e
    - method:43c21050c4a345d827af6367dc7a44cf
    - method:5038c7c5d7c5db20d739315dc4cd59f1
    - method:ba9e633c846c0ed09e884c1d09bb6648
    - struct:2d6b4ee3aec00b51abb859f5c1e03bed
  - id: r.constructor-split
    level: MUST
    text: NewDirectInmem returns a physical.Backend that is a plain InmemBackend with
      no transaction support, while NewInmem returns a physical.Backend backed by
      TransactionalInmemBackend, so callers choose whether transactional semantics
      are available.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - function:01e86591f7c08850e492d37a5e08dd52
    - function:4c046da44025634cd7e25283ce278dcc
    - struct:df217a5c171aa38af804e782d2d8a41a
  - id: r.failure-injection
    level: MUST
    text: FailPut, FailGet, FailDelete and FailList flip a per-operation failure flag
      so the matching call returns an error instead of touching the store, letting
      tests exercise error paths deterministically.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - method:4ead8adefd1962fb73444884ef8bc234
    - method:620d69cb359873a4adafa368fcd4ab69
    - method:aebafecb8fd45638f9e01ac42bcb48e6
    - method:bdd3cf66911c67d4a387fc651363cbf5
  - id: r.ha-backend
    level: MUST
    text: 'NewInmemHA returns a physical.Backend whose InmemHABackend embeds InmemBackend
      for storage and additionally implements the HA surface: LockWith hands out an
      advisory lock, LockMapSize reports how many locks are held, HookInvalidate registers
      an invalidation callback, and HAEnabled reports true.'
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem_ha.go
    - function:b235eded961c4abe0863e2855edea225
    - method:305ccbdfd456a4b1edc8fab49f0be2ec
    - method:72fb45d6d398553c65fc86ed64c4007c
    - method:8d276904195680b59b907b4fad500fcc
    - method:ccae56ea1b2267afd14f3f6b8e9882d0
    - struct:679b872bd8d4cddf89e45879d844de42
  - id: r.ha-put-delete-invalidate
    level: MUST
    text: InmemHABackend.Put stores the entry and InmemHABackend.Delete removes the
      key, each delegating to the embedded in-memory backend and then notifying the
      registered invalidation hook for that key so lock holders learn their state
      changed.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem_ha.go
    - method:72fb45d6d398553c65fc86ed64c4007c
    - method:7b7b36e795b1775fa162674183f074b1
    - method:e0db7897f317070fb2c3a4b7c30828e5
  - id: r.list-page-ordering
    level: MUST
    text: ListPage returns the sorted keys under a prefix that fall after the given
      after key, truncated to limit entries, so callers can walk a keyspace in stable
      pages.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - method:5038c7c5d7c5db20d739315dc4cd59f1
  - id: r.lock-semantics
    level: MUST
    text: InmemLock.Lock acquires the named lock and returns a channel closed when
      the lock is lost, blocking until acquisition or until stopCh closes; Unlock
      releases the lock and removes it from the lock map; Value reports whether the
      lock is currently held and the value it was acquired with.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem_ha.go
    - method:187ff6f6b3a871a5185e2aa1b6cd94b8
    - method:499e07b68ff4edbe764e64d9fcb1f28b
    - method:7c18f4d6c4f9da42655ac6302f0f3e75
    - struct:5d362beb6e121438856c6710c4b52f89
  - id: r.op-name
    level: MUST
    text: OpName maps each in-memory operation constant (put, delete, list, list-page,
      get, begin-tx, begin-ro-tx, commit-tx, rollback-tx) to its lowercase name and
      returns "unknown" for any other value, and InmemOp carries the operation type,
      transaction type, arguments and results of a single traced operation.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - function:3d2e06bf2d872877c88d4efd08239508
    - struct:1d80bbbee5698efde6ed532fa3090786
  - id: r.tests-cover-backend
    level: SHOULD
    text: The package tests exercise the in-memory backend behaviours, the HA locking
      behaviours and the physical view over the backend, so changes to storage, transaction
      and lock semantics are caught by go test.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem_ha_test.go
    - file:third_party/openbao/internal/physical/inmem/inmem_test.go
    - file:third_party/openbao/internal/physical/inmem/physical_view_test.go
  - id: r.transactions
    level: MUST
    text: TransactionalInmemBackend.BeginTx and BeginReadOnlyTx return an InmemBackendTransaction
      that stages writes against the parent store; Commit applies the staged operations
      and Rollback discards them without changing the store.
    codeRefs:
    - file:third_party/openbao/internal/physical/inmem/inmem.go
    - method:09f4611c045b886c99193978e5fffc60
    - method:599cf2c9ab84549195412caf4c4bb3a8
    - method:d85856c01a2035e79927288ebd527cd5
    - method:e411a886bada2ea8e9ea5fa106f9bc23
    - struct:4347fdb9d9109c660bbfc2ea4ab407f0
