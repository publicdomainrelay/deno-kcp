    id: r.database-interface
    level: MUST
    text: The Database interface must expose exactly Initialize, NewUser, UpdateUser,
      DeleteUser, Type and Close, each taking a context and the corresponding request
      struct and returning the corresponding response struct plus an error; Type and
      Close take no arguments and Close returns only an error.
