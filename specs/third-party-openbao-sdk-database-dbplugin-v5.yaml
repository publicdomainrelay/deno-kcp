    level: MUST
    text: gRPCClient must satisfy Database by converting each SDK request into the
      matching protobuf message, issuing the call on the gRPC client connection, and
      converting the protobuf response back into the SDK response; PluginVersion must
      return the logical.PluginVersion of the transport and Close must tear down the
      connection.
