    level: MUST
    text: gRPCServer must implement the generated protobuf service by resolving or
      creating the backing Database instance and dispatching each RPC to the matching
      Database method, marshalling requests into SDK types and responses back into
      protobuf, and it must also answer the Version RPC with the logical version reply.
