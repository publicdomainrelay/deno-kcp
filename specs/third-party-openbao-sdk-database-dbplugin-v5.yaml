    text: 'GRPCDatabasePlugin must supply the go-plugin gRPC hooks: GRPCServer must
      register the gRPCServer implementation on the given grpc.Server, and GRPCClient
      must build the gRPCClient for the given client connection and return it as the
      plugin implementation value.'
