kind: SystemContext
metadata:
  name: third-party-openbao-sdk-database-dbplugin-v5
  namespace: default
spec:
  intent: This context is the client/server contract for running an OpenBao database
    secrets engine backend as a separate plugin process. It exists so that a plugin
    binary implements one Go interface and the host can call it over gRPC without
    sharing a type identity, while the host keeps tracing, metrics and error sanitization
    in front of every call.
