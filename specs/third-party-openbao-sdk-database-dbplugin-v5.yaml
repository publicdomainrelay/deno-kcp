    text: NewDatabaseErrorSanitizerMiddleware must wrap a Database with a secret-provider
      function so that errors returned from Initialize, NewUser, UpdateUser, DeleteUser,
      Type and Close have the secret values stripped before they reach the caller,
      and the wrapper must pass through PluginVersion unchanged.
