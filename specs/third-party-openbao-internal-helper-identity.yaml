    id: r.sdk-alias-projection
    level: MUST
    text: ToSDKAlias must return nil for a nil input, and otherwise build a logical.Alias
      carrying Name, ID, MountAccessor, MountType, NamespaceID and CustomMetadata
      from the internal alias, with Metadata copied element by element into a newly
      allocated map of the same capacity so later mutation of the SDK value does not
      alias the internal map.
  - codeRefs:
    - file:third_party/openbao/internal/helper/identity/identity.go
    - function:2dea232655a7227c40ee3249769304c2
    - function:f0dbc95dbc4552d8b598838dc3963d39
    id: r.sdk-entity-projection
    level: MUST
    text: ToSDKEntity must return nil for a nil input; otherwise it must allocate
      an alias slice of the same length as the entity's Aliases and convert every
      element through ToSDKAlias, copy Metadata into a new map, and carry ID, Name,
      Disabled, Aliases and NamespaceID onto the resulting logical.Entity.
  - codeRefs:
    - file:third_party/openbao/internal/helper/identity/identity.go
    - function:565b69f3842b1e6add6876bc37af887b
    - function:a56aa82127d755b088d2dbb960f2f300
    id: r.sdk-group-projection
    level: MUST
    text: ToSDKGroup must return nil for a nil input and otherwise project ID, Name,
      a copied Metadata map and NamespaceID onto a logical.Group; ToSDKGroups must
      return nil for a nil input slice and otherwise allocate a slice of the same
      length and map each element through ToSDKGroup in order, so index correspondence
      with the input is preserved.
