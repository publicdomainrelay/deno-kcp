kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-identity
  namespace: default
spec:
  intent: 'This context exists to describe the vendored OpenBao identity helper package
    that deno-kcp carries under third_party. It is the boundary between the generated
    protobuf identity records and the rest of the system: the storage layer clones
    and mutates these messages, policy evaluation reads them through sentinel, and
    the logical layer consumes them only after the ToSDK projection functions run.
    The spec records that projection, the deep-copy semantics, the alias upsert rule
    and the sentinel key surface, because callers outside this package depend on those
    behaviors and on the exact set of message fields the generated types carry.'
