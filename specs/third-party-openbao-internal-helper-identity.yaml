    id: r.clone-deep-copy
    level: MUST
    text: 'Clone must return a value independent of the receiver, produced by marshaling
      the message with proto.Marshal and unmarshaling the bytes into a fresh local
      value, so callers can mutate the copy without touching the original. A marshal
      failure must return an error of the form "failed to marshal group/entity/alias:
      %w" and an unmarshal failure "failed to unmarshal group/entity/alias: %w", each
      wrapping the underlying error.'
  - codeRefs:
    - method:2ac86f8dcde200fcf7386b4ec3cd12e3
    - method:8084eb55189c0096ec47357ee88503e1
    - method:bfcd35be44bbca752cd28184e592c0ea
    id: r.clone-nil-receiver-guard
    level: MUST
    text: Group.Clone, Entity.Clone and Alias.Clone must return a nil result and a
      non-nil error when the receiver is nil, so callers that clone optional records
      never panic. Group.Clone returns the error "nil group" and Entity.Clone returns
      "nil entity".
