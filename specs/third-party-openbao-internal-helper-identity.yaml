    id: r.alias-fields
    level: MUST
    text: The Alias message must expose generated getters for ID, CanonicalID, MountType,
      MountAccessor, MountPath, Metadata, Name, CreationTime, LastUpdateTime, MergedFromCanonicalIDs,
      NamespaceID, CustomMetadata, Local and LocalBucketKey, returning zero values
      for a nil receiver, covering both the mount binding and the local-alias bookkeeping
      a login alias needs.
  - codeRefs:
