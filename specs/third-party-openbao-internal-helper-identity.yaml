    id: r.protobuf-message-contract
    level: MUST
    text: 'Group, LocalAliases, Entity, Alias, EntityStorageEntry and PersonaIndexEntry
      must each implement the protobuf message contract: Reset to clear the message
      to its zero state, String for a textual rendering, ProtoMessage as the marker
      method, ProtoReflect returning a protoreflect.Message, and Descriptor returning
      the compressed file descriptor bytes and the message''s index path.'
  - codeRefs:
