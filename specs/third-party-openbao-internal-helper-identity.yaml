    level: MUST
    text: Entity.SentinelGet, Alias.SentinelGet and Group.SentinelGet must return
      the field value for a supported key and report an unrecognized key as an error
      rather than falling through with a nil value and no error, so policy evaluation
      never silently reads a missing field as nil.
