kind: SystemContext
metadata:
  name: third-party-openbao-sdk-physical-file
  namespace: default
spec:
  intent: This context exists to pin down the behaviour of the file physical backend
    that deno-kcp vendors from the OpenBao SDK, so that the storage contract it offers
    to the rest of the system is explicit rather than inferred from the Go source.
    It matters because the backend is deprecated but still reachable through the physical.Backend
    interface, so its construction rules, path safety checks and not-found semantics
    must stay fixed while the surrounding tree changes.
  interfaces:
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: struct
    name: FileBackend
    signature: type FileBackend struct
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: method
    name: FileBackend.Delete
    signature: func (b *FileBackend) Delete(ctx context.Context, path string) error
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: method
    name: FileBackend.DeleteInternal
    signature: func (b *FileBackend) DeleteInternal(ctx context.Context, path string)
      error
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: method
    name: FileBackend.Get
    signature: func (b *FileBackend) Get(ctx context.Context, k string) (*physical.Entry,
      error)
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: method
    name: FileBackend.GetInternal
    signature: func (b *FileBackend) GetInternal(ctx context.Context, k string) (*physical.Entry,
      error)
  - file: third_party/openbao/sdk/physical/file/file.go
    kind: method
