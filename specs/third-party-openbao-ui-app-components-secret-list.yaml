apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- class:bc88e2dbcf655ddde7b5f9a44d105440 DatabaseListItem@third_party/openbao/ui/app/components/secret-list/database-list-item.js:23
- file:third_party/openbao/ui/app/components/secret-list/database-list-item.js database-list-item.js@third_party/openbao/ui/app/components/secret-list/database-list-item.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-components-secret-list
  namespace: default
spec:
  intent: This context exists so the database secret list can render per-row type
    information and offer per-row connection and credential operations without owning
    backend logic. The component delegates all mutation to Ember Data adapters and
    reports outcomes through the flash message service, keeping the template thin.
    The specification records which path values map to which key type and which adapter
    each action must talk to, so the list item's contract with the adapters and the
    user-visible flash strings stay stable.
  interfaces:
  - file: third_party/openbao/ui/app/components/secret-list/database-list-item.js
    kind: class
    name: DatabaseListItem
    signature: DatabaseListItem()
  repository: deno-kcp
  requirements:
  - codeRefs:
    - class:bc88e2dbcf655ddde7b5f9a44d105440
    - file:third_party/openbao/ui/app/components/secret-list/database-list-item.js
    id: r.component-state-and-services
    level: MUST
    text: The component must declare roleType as a tracked property initialized to
      the empty string, and must inject the store and flashMessages services, because
      the action methods depend on those services to resolve adapters and report results.
  - codeRefs:
    - class:bc88e2dbcf655ddde7b5f9a44d105440
    - file:third_party/openbao/ui/app/components/secret-list/database-list-item.js
    id: r.key-type-from-path
    level: MUST
    text: 'The keyTypeValue getter must derive the key type from the current item''s
      path, not from the item''s type field: a path of ''roles'' must return ''dynamic'',
      a path of ''static-roles'' must return ''static'', and any other path must return
      an empty string.'
  - codeRefs:
    - class:bc88e2dbcf655ddde7b5f9a44d105440
    - file:third_party/openbao/ui/app/components/secret-list/database-list-item.js
    id: r.reset-connection
    level: MUST
    text: 'resetConnection(id) must read the backend from the current item, obtain
      the ''database/connection'' adapter from the store, call resetConnection with
      the backend and id, flash the success message `Success: ${id} connection was
      reset` when the promise resolves, and flash the rejection''s errors as a danger
      message when it fails.'
  - codeRefs:
    - class:bc88e2dbcf655ddde7b5f9a44d105440
    - file:third_party/openbao/ui/app/components/secret-list/database-list-item.js
    id: r.rotate-role-cred
    level: MUST
    text: 'rotateRoleCred(id) must read the backend from the current item, obtain
      the ''database/credential'' adapter from the store, call rotateRoleCredentials
      with the backend and id, flash the success message `Success: Credentials for
      ${id} role were rotated` when the promise resolves, and flash the rejection''s
      errors as a danger message when it fails.'
  - codeRefs:
    - class:bc88e2dbcf655ddde7b5f9a44d105440
    - file:third_party/openbao/ui/app/components/secret-list/database-list-item.js
    id: r.rotate-root-cred
    level: MUST
    text: 'rotateRootCred(id) must read the backend from the current item, obtain
      the ''database/connection'' adapter from the store, call rotateRootCredentials
      with the backend and id, flash the success message `Success: ${id} connection
      was rotated` when the promise resolves, and flash the rejection''s errors as
      a danger message when it fails.'
  upstream: self
