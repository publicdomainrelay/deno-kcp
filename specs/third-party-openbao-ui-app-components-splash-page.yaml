apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/app/components/splash-page/splash-content.js splash-content.js@third_party/openbao/ui/app/components/splash-page/splash-content.js
- file:third_party/openbao/ui/app/components/splash-page/splash-footer.js splash-footer.js@third_party/openbao/ui/app/components/splash-page/splash-footer.js
- file:third_party/openbao/ui/app/components/splash-page/splash-header.js splash-header.js@third_party/openbao/ui/app/components/splash-page/splash-header.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-components-splash-page
  namespace: default
spec:
  intent: 'This context documents the vendored splash-page component trio in the OpenBao
    UI that this repository carries as third-party source. It exists so the leaf components
    can be reasoned about, replaced or re-synced from upstream without rereading the
    files: the contract here is deliberately minimal, and the value of the spec is
    in pinning down that minimality (tagless, default-export-only, no injected state,
    MPL-2.0 header) so that any divergence introduced later is detectable as a real
    change rather than mistaken for the components'' normal form. It also marks the
    boundary: splash-page.js, which does hold services and a getter, is not part of
    this context and must not be described from here.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.default-export-only
    level: MUST
    text: Each module must expose exactly one default export and no named exports,
      so consumers resolve the component through the module's default binding and
      the Ember resolver can locate it by file path alone.
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.import-source
    level: MUST
    text: Each module must obtain its Component base by importing the default binding
      from '@ember/component', matching the classic (non-Ember-Octane) component style
      used by the surrounding vendored OpenBao UI.
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.license-header
    level: MUST
    text: 'Each vendored file must retain the HashiCorp, Inc. copyright notice and
      the SPDX-License-Identifier: MPL-2.0 comment at the top of the file, since the
      contents are copied third-party source rather than code authored in this repository.'
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.no-injected-state
    level: MUST
    text: These leaf components must not declare service injections, computed getters,
      arguments, lifecycle hooks or internal state; any state the splash page needs
      is held by the parent splash-page.js component and passed down, keeping the
      leaves stateless.
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.tagless-components
    level: MUST
    text: Each of the three modules must default-export an Ember component created
      with Component.extend and must set tagName to the empty string, so the component
      renders its template without emitting a wrapping DOM element.
  - codeRefs:
    - file:third_party/openbao/ui/app/components/splash-page/splash-content.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-footer.js
    - file:third_party/openbao/ui/app/components/splash-page/splash-header.js
    id: r.upstream-parity
    level: SHOULD
    text: The three files should stay identical to one another except for their file
      name, so that a future re-sync from upstream OpenBao can be applied as a whole
      and any asymmetry between header, content and footer is visible as an intentional
      local change.
  upstream: self
