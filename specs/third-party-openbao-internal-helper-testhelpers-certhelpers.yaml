    file: third_party/openbao/internal/helper/testhelpers/certhelpers/cert_helpers.go
  - name: IsCA
    kind: function
    signature: func IsCA(isCA bool) CertOpt
    file: third_party/openbao/internal/helper/testhelpers/certhelpers/cert_helpers.go
  - name: KeyWrapper
    kind: struct
    signature: type KeyWrapper struct
    file: third_party/openbao/internal/helper/testhelpers/certhelpers/cert_helpers.go
  - name: NewCert
    kind: function
    signature: func NewCert(t *testing.T, opts ...CertOpt) (cert Certificate)
    file: third_party/openbao/internal/helper/testhelpers/certhelpers/cert_helpers.go
  - name: NewPrivateKey
    kind: function
    signature: func NewPrivateKey(t *testing.T) (key KeyWrapper)
    file: third_party/openbao/internal/helper/testhelpers/certhelpers/cert_helpers.go
  - name: Parent
    kind: function
