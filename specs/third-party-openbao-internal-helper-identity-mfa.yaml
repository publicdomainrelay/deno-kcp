    id: r.totp-secret-fields
    level: MUST
    text: TOTPSecret must hold the per-user TOTP material Issuer, Period, Algorithm,
      Digits, Skew, KeySize, AccountName and Key, exposed through the matching getters
      on TOTPSecret. It repeats the TOTPConfig parameter set and adds AccountName
      and Key, so a stored secret is self-describing without a lookup of the parent
      method config.
