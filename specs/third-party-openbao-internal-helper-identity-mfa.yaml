kind: SystemContext
metadata:
  name: third-party-openbao-internal-helper-identity-mfa
  namespace: default
spec:
  intent: 'This context exists to describe the identity MFA configuration types and
    the small amount of behavior layered on top of them: the deep-copy helper used
    when MFA configs are read from and written to storage, and the sentinel field
    exposure that lets policy code read MFA method fields by name. It documents the
    shape of the protobuf-generated messages so that callers know which provider block
    a Config carries, which fields each provider block holds, and how a Secret wraps
    a TOTP secret.'
