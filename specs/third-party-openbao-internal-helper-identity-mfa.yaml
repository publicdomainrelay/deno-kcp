    id: r.config-scalar-fields
    level: MUST
    text: Config must carry the identifying scalars Type, Name, ID, MountAccessor,
      UsernameFormat and NamespaceID, each with a generated getter that returns the
      field value. These getters must be usable on a nil receiver without panicking,
      returning the zero value.
