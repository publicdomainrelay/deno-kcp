    id: r.secret-wraps-totp
    level: MUST
    text: Secret must carry a MethodName plus a Secret_Value oneof that currently
      admits only TOTPSecret. Secret.GetValue must return the set variant, Secret.GetTOTPSecret
      must return the TOTPSecret when that variant is set and nil otherwise, and Secret.GetMethodName
      must return the method name.
