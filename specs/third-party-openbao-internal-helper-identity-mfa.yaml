    id: r.enforcement-config-fields
    level: MUST
    text: MFAEnforcementConfig must describe one enforcement rule through Name, NamespaceID,
      ID, the repeated lists MFAMethodIDs, AuthMethodAccessors, AuthMethodTypes, IdentityGroupIds
      and IdentityEntityIDs, each reachable through its getter. The rule therefore
      combines required methods with selector lists over auth mounts, auth types,
      identity groups and identity entities.
