    level: MUST
    text: Config.SentinelKeys must return exactly the three key names "type", "name"
      and "mount_accessor", and Config.SentinelGet must resolve each of those keys
      to the Config field of the same meaning (Type, Name, MountAccessor). Any other
      key, and a nil receiver, must yield a nil value with a nil error rather than
