    id: r.config-carries-one-provider-block
    level: MUST
    text: Config must be a protobuf message whose Config_Config oneof holds at most
      one provider configuration, chosen from TOTPConfig, OktaConfig, DuoConfig and
      PingIDConfig. Config.GetConfig must return the set variant, and each typed accessor
      (GetTOTPConfig, GetOktaConfig, GetDuoConfig, GetPingIDConfig) must return the
      variant when it is that type and nil when another variant is set.
  - codeRefs:
    - file:third_party/openbao/internal/helper/identity/mfa/mfa.go
    - method:4ed78e7d24da77b9464df4544679afed
    id: r.config-clone-deep-copy
    level: MUST
    text: Config.Clone must return an independent copy of the receiver produced by
      marshaling the receiver to protobuf and unmarshaling into a new Config, so mutating
      the clone never mutates the original. A nil receiver must return an error whose
      text is "nil config" rather than panic. Marshal and unmarshal failures must
      be wrapped with the messages "failed to marshal config" and "failed to unmarshal
      config" respectively.
  - codeRefs:
    - method:3b9dc039c67498a9027c5ccea02648f1
    - method:6563d39617903e4aa5c41f9a2d0f93c1
