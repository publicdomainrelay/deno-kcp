    id: r.proto-message-contract
    level: MUST
    text: 'Every message type in the package (Config, TOTPConfig, DuoConfig, OktaConfig,
      PingIDConfig, Secret, TOTPSecret, MFAEnforcementConfig) must satisfy the proto.Message
      contract: Reset must zero the receiver back to a fresh empty message, String
      must render the message text, ProtoMessage must exist as the marker method,
      ProtoReflect must return the message reflection view, and Descriptor must return
      the file descriptor bytes and message index.'
