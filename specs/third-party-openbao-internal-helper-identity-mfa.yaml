    id: r.totp-config-fields
    level: MUST
    text: 'TOTPConfig must hold the TOTP parameters of an MFA method: Issuer, Period,
      Algorithm, Digits, Skew, KeySize, QRSize and MaxValidationAttempts, exposed
      through GetIssuer, GetPeriod, GetAlgorithm, GetDigits, GetSkew, GetKeySize,
      GetQRSize and GetMaxValidationAttempts. Numeric parameters (Period, Skew, KeySize,
      MaxValidationAttempts) are unsigned 32-bit, while Algorithm, Digits and QRSize
      are signed 32-bit, so algorithm and digit selection are carried as enums.'
