apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
  add.js@third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/edit.js
  edit.js@third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/edit.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
  index.js@third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
- file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/show.js
  show.js@third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/show.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-access-identity-aliases
  namespace: default
spec:
  intent: 'This context exists to specify the routing behavior of the OpenBao UI identity-alias
    screens: how each of the add, edit, index and show routes resolves its model,
    which params drive it, how it reacts to an invalid section, and how it cleans
    up controller state and cached datasets when leaving. It defines the contract
    that the templates and controllers of the alias screens rely on, without describing
    those templates.'
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
    id: r.add-confirms-dirty-navigation
    level: MUST
    text: The add route's willTransition action must return true when there is no
      current model, prompt with window.confirm when the current model has dirty attributes,
      return true when the user accepts, and otherwise abort the transition and return
      false.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
    id: r.add-creates-unsaved-alias
    level: MUST
    text: The add route's model hook must create a new, unsaved record of the derived
      alias model type and set its canonicalId to the item_id route param, so the
      new alias is bound to the identity the user came from.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/edit.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.alias-model-type-derived-from-parent
    level: MUST
    text: Every alias route must read the parent identity item type with modelFor('vault.cluster.access.identity')
      and use it to build the Ember Data model name 'identity/<itemType>-alias', so
      the alias model follows the identity type resolved by the parent route rather
      than a hard-coded alias type.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/edit.js
    id: r.edit-loads-alias-by-id
    level: MUST
    text: The edit route's model hook must load the alias record of the derived model
      type using findRecord with the item_alias_id route param as the identifier.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.index-controller-state
    level: MUST
    text: The index route's setupController must set identityType on the controller
      from the parent identity modelFor value, set filter to the pageFilter param
      or an empty string when absent, and set page to the resolved model's meta.currentPage,
      defaulting to 1.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.index-paginated-query
    level: MUST
    text: The index route's model hook must run a lazyPaginatedQuery on the derived
      alias model type with responsePath 'data.keys', the page and pageFilter params,
      and sortBy 'name'; it must convert an HTTP 404 error into an empty array and
      rethrow every other error.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.index-refreshing-query-params
    level: MUST
    text: The index route must declare page and pageFilter as query params with refreshModel
      true, so that changing either one re-runs the model hook.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.index-reset-controller
    level: MUST
    text: The index route's resetController must call super and, when exiting, clear
      the controller's pageFilter and filter properties to null.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/index.js
    id: r.index-transition-and-reload
    level: SHOULD
    text: The index route's willTransition action must scroll the window to the top
      and clear all cached datasets when the transition leaves this route, and its
      reload action must clear all cached datasets before refreshing the route.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/add.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/edit.js
    id: r.reset-controller-cleanup
    level: MUST
    text: The add and edit routes must call the super resetController implementation
      and, only when the controller is exiting the route, invoke cleanupModel on the
      controller when that method exists.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/show.js
    id: r.show-model-and-controller
    level: MUST
    text: The show route's model hook must resolve a hash of the alias record found
      by item_alias_id together with the section param, and its setupController must
      set both model and section on the controller from that resolved hash.
  - codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/access/identity/aliases/show.js
    id: r.show-validates-section
    level: MUST
    text: The show route must take the tabs registered in TABS for the '<itemType>-alias'
      identity type and, when the requested section param is not one of them, throw
      an AdapterError with httpStatus set to 404.
  upstream: self
