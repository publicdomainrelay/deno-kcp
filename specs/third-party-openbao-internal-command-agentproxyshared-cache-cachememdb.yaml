kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agentproxyshared-cache-cachememdb
  namespace: default
spec:
  intent: The package exists so the agent proxy cache can store and look up cached
    responses in memory by several independent keys instead of a single map key. memdb
    supplies the multi-index lookup, prefix iteration and schema-level uniqueness,
    while the atomic pointer lets a `Flush` replace the whole database without racing
    in-flight readers. Serialization exists so an index can be persisted or transferred
    between the memory cache and the persistent bolt cache; the renewal context is
    deliberately excluded because a cancel func cannot be serialized. This context
    is a third-party vendored dependency inside deno-kcp, not code the repository
    authors.
  interfaces:
  - file: third_party/openbao/internal/command/agentproxyshared/cache/cachememdb/cache_memdb.go
    kind: struct
