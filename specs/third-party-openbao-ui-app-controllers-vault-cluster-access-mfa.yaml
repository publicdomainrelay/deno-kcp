apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-controllers-vault-cluster-access-mfa
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'The context exists to record the interface and behavior of MfaMethodsListController,
    the Ember controller backing the MFA methods list route in the OpenBao UI. It
    is needed so that the pagination contract of the MFA methods list screen is described
    in the specification: the controller exposes queryParams so Ember serializes the
    page into the URL, and it seeds page to 1 so a fresh visit to the list starts
    on the first page rather than an undefined or empty page value.'
  requirements:
  - id: r.controller-extends-ember-controller
    level: MUST
    text: MfaMethodsListController must extend Ember's Controller base class so it
      can act as the route's controller and participate in Ember's controller lifecycle
      and query-parameter binding.
    codeRefs:
    - class:440062a628c6eae4794a86ba8179be4e
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
  - id: r.default-export
    level: SHOULD
    text: The module should export MfaMethodsListController as its default export
      so Ember's resolver can look the controller up by route name.
    codeRefs:
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
  - id: r.page-default-one
    level: MUST
    text: The controller must initialize its page property to the numeric value 1,
      so the MFA methods list starts on the first page when no page query parameter
      is present in the URL.
    codeRefs:
    - class:440062a628c6eae4794a86ba8179be4e
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
  - id: r.query-params-contains-page
    level: MUST
    text: The controller must declare queryParams as an array containing exactly the
      string 'page', so Ember binds the page property to the 'page' URL query parameter
      for the MFA methods list route.
    codeRefs:
    - class:440062a628c6eae4794a86ba8179be4e
    - file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
  interfaces:
  - name: MfaMethodsListController
    kind: class
    signature: class MfaMethodsListController extends Controller { queryParams = ['page'];
      page = 1; }
    file: third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
codeRefIndex:
- class:440062a628c6eae4794a86ba8179be4e MfaMethodsListController@third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js:8
- file:third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
  methods.js@third_party/openbao/ui/app/controllers/vault/cluster/access/mfa/methods.js
