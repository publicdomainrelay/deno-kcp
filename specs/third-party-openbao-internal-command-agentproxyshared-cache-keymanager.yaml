  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    - function:d44e09ab3af0fd99b64a10c3f2faa4d2
    id: r.constructor-key-size
    level: MUST
    text: 'NewPassthroughKeyManager must branch on the length of the supplied key:
      a zero-length key causes it to draw 32 fresh bytes from crypto/rand and use
      them as the root key, a 32-byte key is used verbatim, and any other length must
      return a nil manager with the error formatted as "invalid key size, should be
      32, got %d" carrying the observed length.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    - function:d44e09ab3af0fd99b64a10c3f2faa4d2
    - struct:194fd2b46e2244a6f7f3f7de2e915e3f
    id: r.constructor-wrapper-setup
    level: MUST
    text: NewPassthroughKeyManager must build an aead wrapper, set its config with
      key_id mapped to KeyID, install the resolved root key bytes through SetAesGcmKeyBytes,
      and return a PassthroughKeyManager holding that wrapper; a failure from the
      random read, SetConfig or SetAesGcmKeyBytes must abort with a nil manager and
      the underlying error.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/manager.go
    - interface:d00c51a0235874fb732e081ad66bc03a
    - method:08219df992da36d79b44d2a92e7f0c51
    - method:ff0d80c0ab9cc136eac0d0a232e1c88a
    id: r.interface-contract
    level: MUST
    text: 'The package must expose a KeyManager interface whose contract is exactly
      two methods: Wrapper, which returns a wrapping.Wrapper usable for key-related
      operations, and RetrievalToken, which takes a context and returns the byte material
      that lets a caller source back the encryption key, where that material may be
      the encryption key itself or a token or identifier exchanged for it.'
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/manager.go
    id: r.keyid-constant
    level: MUST
    text: The package must define the constant KeyID with the value "root" and use
      it as the key_id config entry when configuring a wrapper.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    - interface:d00c51a0235874fb732e081ad66bc03a
    - struct:194fd2b46e2244a6f7f3f7de2e915e3f
    id: r.passthrough-implements-keymanager
    level: MUST
    text: PassthroughKeyManager must satisfy KeyManager, enforced at compile time
      by the assertion var _ KeyManager = (*PassthroughKeyManager)(nil); a change
      that removes either method from the type must break the build.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    - method:1d7f8031128f2daa290c05a3247b7687
    - struct:194fd2b46e2244a6f7f3f7de2e915e3f
    id: r.retrieval-token-passthrough
    level: MUST
    text: PassthroughKeyManager.RetrievalToken must return the key bytes held by the
      wrapper, obtained through KeyBytes with the caller's context, and must return
      a nil token with the error "unable to get wrapper for token retrieval" when
      the wrapper is nil; because the manager is a passthrough it must not abstract,
      re-wrap or transform the key material before returning it.
  - codeRefs:
    - file:third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough_test.go
    id: r.test-coverage
    level: SHOULD
    text: The package should keep passthrough_test.go exercising the passthrough constructor
      together with both Wrapper and RetrievalToken, so the key-size branches and
      the nil-wrapper error path stay covered.
  - codeRefs:
    - method:a129007c172ebe0a5d8127eb26368b58
    - struct:194fd2b46e2244a6f7f3f7de2e915e3f
    id: r.wrapper-accessor
    level: MUST
    text: PassthroughKeyManager.Wrapper must return the manager's stored *aead.Wrapper
      unchanged, so callers perform key operations against the same wrapper the constructor
      configured.
  upstream: self
