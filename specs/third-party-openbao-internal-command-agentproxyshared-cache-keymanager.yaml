kind: SystemContext
metadata:
  name: third-party-openbao-internal-command-agentproxyshared-cache-keymanager
  namespace: default
spec:
  intent: 'This context exists to specify the key-material boundary of the agent proxy
    shared cache. The cache needs a wrapper to encrypt and decrypt cached responses
    and a way to hand back the material that reproduces the cache key, but it should
    not care how that material is produced or whether it is abstracted behind an external
    KMS. The KeyManager interface states that boundary in two methods, and PassthroughKeyManager
    supplies the simplest conforming behavior: one locally held AES-GCM root key,
    generated if absent, returned unchanged as the retrieval token. Reading this context
    tells a maintainer what the contract requires, what the passthrough implementation
    accepts and rejects, and which error strings and constants downstream code can
    depend on.'
  interfaces:
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/manager.go
    kind: interface
    name: KeyManager
    signature: type KeyManager interface { Wrapper() wrapping.Wrapper; RetrievalToken(ctx
      context.Context) ([]byte, error) }
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/manager.go
    kind: method
    name: KeyManager.RetrievalToken
    signature: RetrievalToken(ctx context.Context) ([]byte, error)
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/manager.go
    kind: method
    name: KeyManager.Wrapper
    signature: Wrapper() wrapping.Wrapper
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    kind: function
    name: NewPassthroughKeyManager
    signature: func NewPassthroughKeyManager(ctx context.Context, key []byte) (*PassthroughKeyManager,
      error)
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    kind: struct
    name: PassthroughKeyManager
    signature: type PassthroughKeyManager struct { wrapper *aead.Wrapper }
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
    kind: method
    name: PassthroughKeyManager.RetrievalToken
    signature: func (w *PassthroughKeyManager) RetrievalToken(ctx context.Context)
      ([]byte, error)
  - file: third_party/openbao/internal/command/agentproxyshared/cache/keymanager/passthrough.go
