apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: internal-provider
  namespace: default
spec:
  repository: deno-kcp
  upstream: sc.deno-kcp
  overlay:
  - ov.test-cluster
  - ov.test-provider-live-install
  orchestrator: orch.test-live
  dependsOn:
  - sc.api-v1alpha1
  - sc.deno-kcp
  - sc.internal-denojob
  - sc.internal-denopod
  - sc.internal-denorun
  - sc.internal-livegate
  - sc.internal-policyengine
  - sc.internal-policyworkflowpod
  - sc.internal-policyworkflowrun
  - sc.internal-trigger
  intent: 'This context exists because the provider is the only place in the repository
    that knows both the deno.computer API surface and the kcp-libs machinery that
    reads and writes it. It exists to keep three concerns in one describable unit:
    the API facade (Registry plus the Instances, Reader, Runtime and TokenMinter seams
    that let tests substitute a fake or a watch cache), the controller loop (watch,
    admit, decide, write status, finalize), and the operational surfaces a deployment
    depends on (metrics endpoint, DNS shim, service FQDN resolution, OpenBao PKI,
    trust bundle). It also carries the live cluster harnesses, so the contract this
    document states is the contract those harnesses exercise against a real KCP.'
  requirements:
  - id: r.active-run-accounting
    level: MUST
    text: ActiveRuns must count workloads started and not yet seen terminal, MaxActiveRuns
      must hold the high-water mark taken with a compare-and-swap loop, and RunStarts
      must count every start; the inactive decrement must clamp at zero.
    codeRefs:
    - method:2188f1b23ffddba57fd070190f3dfab1
    - method:23233a41823fe7b5628f032a2767752f
    - method:a6a75598b35908e08153f182c3febf00
  - id: r.admission-capacity-blockers
    level: MUST
    text: admissionSource.Capacity must return a Blocker with ReasonPolicyWorkflowPodMissing
      when the pod does not exist and ReasonEngineNotReady when the pod has no status
      endpoint, and must default the policy to ConcurrencyForbid when the pod names
      no concurrency policy, otherwise carrying the pod's MaxConcurrent.
    codeRefs:
    - file:internal/provider/admission.go
    - method:a07bdbb2bda3bec3a983caa0cbe3f545
  - id: r.admission-lease-and-lifecycle
    level: MUST
    text: The admitter must be built with a queue.Leases store, a two-minute leaseTTL,
      the provider clock and the workflow-run lifecycle that treats denocomputer.RunningPhase
      as running and TerminalPolicyWorkflow as terminal; the admitted run must carry
      the pod endpoint, workflow bytes, inputs and the run TTL from policyworkflowpod.RunTTL
      with DefaultRunTTLSeconds as fallback.
    codeRefs:
    - file:internal/provider/admission.go
    - file:internal/provider/provider.go
  - id: r.admission-parent-resolution
    level: MUST
    text: admissionSource.Parent must read the policy run, take the parent pod name
      from spec.policyWorkflowPod and fall back to the PolicyWorkflowPodLabel, and
      report no parent when the object is absent or the name is empty.
    codeRefs:
    - file:internal/provider/admission.go
    - method:dedfd34a67b569d3bd5df1bbfd2d518e
  - id: r.admission-runs-lists-labelled-only
    level: MUST
    text: admissionSource.Runs must list only the runs the pod's label index returns;
      a run that names the pod through spec.policyWorkflowPod alone is not in that
      list and must be appended and admitted by the admitter rather than passed through
      un-gated.
    codeRefs:
    - file:internal/provider/admission.go
    - method:ea874e105ac66c1a2a0d988371fa3509
  - id: r.cluster-path-from-id
    level: MUST
    text: Registry.ClusterPath must resolve a logical cluster ID to its workspace
      path through the store, because objects carry only the kcp.io/cluster ID and
      a name built from that ID alone would read wrong.
    codeRefs:
    - file:internal/provider/cluster_path.go
    - method:1711073a6a2c66ef8dbc0850814be58e
  - id: r.degrade-rather-than-fail-construction
    level: MUST
    text: A DNS shim that cannot be materialised from RunsDir, or an OpenBao client
      or PKI provisioner that cannot be built, must log a warning and leave that feature
      off; only the metrics bind may fail construction.
    codeRefs:
    - file:internal/provider/provider.go
    - function:f4e5cfdbb89305e5310f8800b3c5e307
  - id: r.finalizer-removal-known-list
    level: MUST
    text: removeRunFinalizer must call RemoveRunFinalizerKnown with the finalizers
      the caller already holds when the runtime offers it and the list is non-empty,
      and otherwise fall back to RemoveRunFinalizer so the patch does not need its
      own GET.
    codeRefs:
    - file:internal/provider/reconcile_run.go
    - method:9c58b2e5cdc887157dd853e80e10a086
  - id: r.identity-ref-for-admission
    level: MUST
    text: admitRun must hand the admitter a Ref with the resource version cleared,
      because the queue keys runs, leases and preempt lists on the whole Ref while
      an informer-sourced ref carries a resource version the source never puts on
      listed runs.
    codeRefs:
    - file:internal/provider/admission.go
  - id: r.label-indexes-and-fallback-lister
    level: MUST
    text: The informers must carry the by-cluster, by-cluster-name, by-cluster-pod,
      by-cluster-job and by-cluster-trigger-pod indexes; the cache reader must answer
      job-scoped, pod-scoped and trigger-scoped lists from those indexes, and a reader
      without the jobRunLister or podWorkflowRunLister method must fall back to listing
      the whole workspace and filtering on namespace plus label, never dropping the
      namespace argument.
    codeRefs:
    - file:internal/provider/provider.go
    - file:internal/provider/watch_cache.go
  - id: r.live-cluster-harness
    level: MUST
    text: 'The package''s live tests must drive a real KCP cluster through the shared
      kubectl helper and the one API installation in live_helpers_test.go: the deno
      runtime lifecycle, max-concurrent admission, native admission with queue drain,
      denojob allow-drain and pod-run TTL reaping, creating the policy workflow pods,
      engines, pods, jobs and runs each needs; main_test.go must reap every spawned
      process group on exit and on SIGINT or SIGTERM.'
    codeRefs:
    - file:internal/provider/live_denojob_drain_test.go
    - file:internal/provider/live_denoruntime_test.go
    - file:internal/provider/live_helpers_test.go
    - file:internal/provider/live_maxconcurrent_test.go
    - file:internal/provider/live_native_admission_test.go
    - file:internal/provider/live_ttl_test.go
    - file:internal/provider/main_test.go
  - id: r.metrics-endpoint-binds-at-construction
    level: MUST
    text: 'When MetricsListen is set, New must bind the metrics endpoint immediately
      and return a "provider: bind metrics endpoint on %s" error, so a caller learns
      the port is taken at construction and not at first scrape; Close must shut that
      server down.'
    codeRefs:
    - file:internal/provider/metrics.go
    - method:bedc23e806b40419ad4ae31c624ffdf9
  - id: r.metrics-surface
    level: MUST
    text: initMetrics must register queue_depth, cache_age_seconds, reconciles_total,
      conflicts_total, errors_total, active_runs and max_active_runs as gauge functions
      read from the provider's own atomics and a reconcile_seconds summary; cache_age_seconds
      must report NaN before the first informer event rather than a zero age.
    codeRefs:
    - file:internal/provider/metrics.go
    - method:783d67229120389163d8738cc3d1a3ec
  - id: r.new-fills-defaults
    level: MUST
    text: 'New must install a decider for each of the seven kinds when the caller
      left it nil, and fill missing options: TokenTTL one hour, Interval defaultRequeueAfter,
      MinTransitionPoll minTransitionPoll, WatchWorkers from watchWorkers(), RunsDir
      runs, ServiceDomain kcp.DefaultServiceDomain, ProviderWorkspace root:deno-provider,
      Now time.Now and Log slog.Default; BundledActionsDir is made absolute when set.'
    codeRefs:
    - function:f4e5cfdbb89305e5310f8800b3c5e307
    - struct:616ab943fe3365809df93a906c1942bc
  - id: r.new-requires-registry-and-rest-config
    level: MUST
    text: 'New must reject a nil Registry with "provider: Registry is required" and
      a nil RestConfig with "provider: RestConfig is required for the watch driver",
      returning no Provider in either case.'
    codeRefs:
    - file:internal/provider/provider.go
    - function:f4e5cfdbb89305e5310f8800b3c5e307
  - id: r.provider-initial-list-is-bounded-and-retried
    level: MUST
    text: Waiting for a kind's cache to sync must be bounded by a deadline; an attempt
      that does not sync must be abandoned, the informers must be started again, and
      the attempt must repeat while the context lives; the provider must log at info
      level each time a cache has synced and each time it retries.
  - id: r.provider-initial-list-is-bounded-and-retried-test
    level: MUST
    text: An offline test must drive the bounded wait with a factory that never reports
      synced and must assert that it returns within its deadline, reports the retry
      and starts the next attempt; the test must fail against a provider that waits
      on its first attempt without a deadline.
  - id: r.reconcile-observation
    level: MUST
    text: Provider.Reconcile must read the policy run, admit it, and pass the decider
      an Observed carrying the admission, the effective TTL and the clock; when the
      run has a RunID, is not cancelling and is not being deleted, and the endpoint
      is set, it must first ask the policy client for the run's state, exit status,
      outputs and message.
    codeRefs:
    - file:internal/provider/provider.go
    - method:8bfddbaa8080d45fcb240bd22d4cd5eb
  - id: r.reconcile-run-ops
    level: MUST
    text: The run reconciler must stop a running workload on OpStopRun only when a
      run ID exists, must not start on OpStartRun when alreadyStarted holds, must
      skip all writes when WriteStatus is off, and must space a mid-transition re-check
      at MinTransitionPoll.
    codeRefs:
    - file:internal/provider/driver.go
    - file:internal/provider/reconcile_run.go
  - id: r.refuse-duplicate-run-start
    level: MUST
    text: The provider must record a run ref the moment a workload starts, refresh
      it once per pass, and refuse to start a second workload for a run it has already
      started; a retry whose status carries Retries or StartTime and a recreated object
      carrying a new UID must not be mistaken for staleness. runRefTTL bounds the
      record for a run deleted before its status reads terminal.
    codeRefs:
    - file:internal/provider/reconcile_run.go
    - file:internal/provider/run_refs.go
  - id: r.registry-crud-semantics
    level: MUST
    text: 'Registry must implement the Instances and Reader seams directly on the
      store: Read and ListWorkflowRuns on policyworkflowruns, WriteStatus through
      a status patch body, Delete, RemoveFinalizer with FinalizerPolicyWorkflowRun,
      plus the run, pod, job, trigger, engine, openbao and workflowpod reads and lists,
      and it must assert `var _ Reader = (*Registry)(nil)`.'
    codeRefs:
    - file:internal/provider/registry.go
    - method:0336e9c05327f7b15cb6ddb11d9ecda3
  - id: r.registry-requires-host
    level: MUST
    text: 'NewRegistry must reject an empty Host with "provider: Host is required",
      then build one kcpstore store and hold one typed kcpstore.Resource per deno.computer
      resource: policyworkflowruns, denoruns, denopods, denojobs, runtriggers, policyengines,
      policyworkflowpods and openbaos.'
    codeRefs:
    - file:internal/provider/registry.go
    - function:d8299700880b325d38c3aa20aa84ac24
  - id: r.run-drives-the-watch-loop
    level: MUST
    text: Provider.Run must delegate to RunWatch, and Reconciles must report the reconcile
      counter the metrics gauges also read.
    codeRefs:
    - method:83f50090d7ebe3148f7aa5e0db332b4d
    - method:e77a20a79e63ff4ddd7d130f60aff357
  - id: r.service-dns-and-pod-env
    level: MUST
    text: buildServices must construct the servicenames resolver from the provider's
      pod source, path cache, token minter, ServiceDomain, TokenTTL, DefaultServiceAccountNamespace
      and the materialised shim; podEnv must merge the CR's own env first and then
      the service env, and the resolver must be built once under a sync.Once so concurrent
      callers agree.
    codeRefs:
    - file:internal/provider/service_dns.go
  - id: r.trust-bundle-content
    level: MUST
    text: TrustBundle must return kcp's own CA data so a workload can reach the API
      server, append the cached OpenBao root PEM when a provisioner exists, and read
      only what has been provisioned so a vault that is down costs certificates and
      not the workloads that need none.
    codeRefs:
    - file:internal/provider/provider.go
    - method:f57c1668b886e5485cb302198237df3c
  - id: r.wake-queued-runs-on-capacity-change
    level: MUST
    text: wakeQueuedRuns must re-read the pod, list its runs, compute the wake list
      from queue.WakeList with the pod's capacity limit, enqueue each woken run and
      then enqueue the pod itself, returning quietly when the pod name is empty or
      the pod cannot be read.
    codeRefs:
    - file:internal/provider/admission.go
  - id: r.watch-cache-keys-every-workspace
    level: MUST
    text: The provider's watch cache must key every object by its workspace, namespace
      and name, so that two DenoPods named default/pds in two different workspaces
      both stay in the store and both are reconciled; a store keyed by namespace and
      name alone evicts the first, and the evicted workload never reports ready.
  - id: r.watch-cache-keys-every-workspace-test
    level: MUST
    text: An offline test must drive the cache with two objects that share a namespace
      and name in two workspaces, assert that both are present and that an event for
      one does not evict the other, and must fail against a cache keyed by namespace
      and name alone.
  - id: r.watch-seven-kinds-shared-cache
    level: MUST
    text: RunWatch must await the workspace endpoints, then bind dynamic informers
      for policyengines, policyworkflowpods, runtriggers, denoruns, denojobs, denopods
      and openbaos from every denoruntime endpoint and for policyworkflowruns from
      every policyworkflowruns endpoint, feeding one shared cache reader and one rate-limited
      typed work queue; workers may start before cache sync because handlers enqueue
      only after the object is in the store.
    codeRefs:
    - file:internal/provider/watch.go
    - method:8e551c9ad36f9dc79cabaaddcf8a4242
  - id: r.work-dispatch-vocabulary
    level: SHOULD
    text: Dispatch must stay on the local workKind and workKey vocabulary covering
      the eight kinds, with the seven deciders keeping their own Result and Op types;
      the migration to the library's reconcile.Key and reconcile.Result seam is left
      as separate work and nothing else in the provider depends on which vocabulary
      the deciders use.
    codeRefs:
    - file:internal/provider/driver.go
