    level: MUST
    text: The provider must inject service DNS configuration into workloads, with
      tests asserting the injected values.
    codeRefs:
    - file:internal/provider/service_dns.go
    - file:internal/provider/service_dns_inject_test.go
  - id: r.token-minter-mints-service-account-token
    level: MUST
    text: TokenMinter must mint a service-account token for a logical cluster, namespace
      and name with a requested TTL, returning the token string and an error.
    codeRefs:
    - file:internal/provider/provider_runtime.go
    - interface:d81c0020017b8c1b77c14748b34a1695
    - method:08cbdd1a97d2aeb9d9187918def0a3ff
    - method:9630ebc295fc1d2ed8be58298913156a
  - id: r.watch-cache-keys-every-workspace
    level: MUST
    text: The provider watches every workspace through one wildcard informer, and
      the same namespace and name can exist in more than one workspace -- a DenoPod
      named pds in namespace default exists in root:alice and in root:bob. The watch
      cache must key every object by its logical cluster as well as its namespace
      and name, so that two such objects are two independent cache entries. Both survive
      an informer re-list, both are returned by allPods and so appear in the virtual
      DNS table of every pod, and each is read back by a Ref that names its own workspace.
      A workload must never be evicted from the cache, dropped from the DNS table
      or skipped by the reconcile loop because another workspace holds an object with
      the same namespace and name; a DenoPod that is not ready must keep being reconciled
      and re-probed on its own key until it is ready or reaches a terminal phase.
    codeRefs:
    - file:internal/provider/watch.go
    - file:internal/provider/watch_cache.go
  - id: r.watch-cache-keys-every-workspace-test
    level: MUST
    text: An offline unit test inserts two DenoPods that share a namespace and a name
      but carry different kcp.io/cluster annotations into the watch cache and asserts
      that allPods returns both and that ReadPod resolves each one from its own workspace.
      The test must fail when the cache keys objects by namespace and name alone.
    codeRefs:
    - file:internal/provider/watch_test.go
  - id: r.watch-cache-serves-reader
    level: MUST
    text: cacheReader must implement the Reader port from the informer cache, providing
      Read, ReadRun, ListRuns, ListRunsForJob, ReadPod, ReadJob, ReadTrigger, ReadOpenBao,
      ReadEngine, ReadWorkflowPod, ListWorkflowRuns and ListWorkflowRunsForPod, and
      Provider.RunWatch must drive it.
    codeRefs:
    - file:internal/provider/watch.go
    - file:internal/provider/watch_cache.go
    - method:0c338b727be3207f28cbf878427e832a
    - method:233229f09be3f2275ac69f207bb6268b
    - method:3fdfde3c1a480d83c360edc8c048bc7b
    - method:f34958b11727b06606bdafed3381d854
    - method:fec4d29b214cd73931b1d89410112759
