  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - function:5772199666331f7c0f94f82198491e7c
    - struct:62b5160d9e68721a22ab930b4b1938b3
    id: r.acl-construction
    level: MUST
    text: 'NewACL builds an ACL from a policy list in the namespace carried by the
      context: it errors when the context has no namespace, rejects any policy whose
      Type is not the ACL type, and when a policy named root is present it must be
      the only policy or construction fails; the root policy''s namespace becomes
      the ACL root.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - method:4ab79a60637351660208f7c4f2c7deda
    - struct:371d5c892dfcdf97850cdaf02babeab2
    - struct:57a79c9c6bfdb92f3ab2ba33495f8638
    id: r.allow-operation
    level: MUST
    text: ACL.AllowOperation evaluates a logical.Request against the exact, prefix
      and segment-wildcard rules and reports the outcome in ACLResults, filling in
      whether the request is allowed, whether it comes from the root policy, whether
      root privileges were required and any per-path permission detail; capCheckOnly
      limits the work to a capability check.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - struct:de4b98edcce02741d471969e78ba3642
    - struct:fe8c6ce3c52f7c364909dc2284c1cb76
    id: r.auth-and-sentinel-results
    level: MUST
    text: 'AuthResults carries the combined verdict of a policy check: the ACL result,
      the sentinel result, the final Allowed and RootPrivs flags, whether the denial
      should be reported as an error, and a multierror aggregating failures, so callers
      have one value describing the whole decision.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - method:385c4428fe000811076219ea30564019
    - method:c79bd3b75e88d2fd9c26607baad52176
    id: r.capabilities-and-nonexact
    level: MUST
    text: ACL.Capabilities returns the capability names granted to a path, and ACL.CheckAllowedFromNonExactPaths
      resolves permissions from the non-exact rules for a path, optionally treating
      it as a bare mount, returning nil when no rule applies.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - struct:57a79c9c6bfdb92f3ab2ba33495f8638
    id: r.check-opts
    level: MUST
    text: CheckOpts tells the check whether root privileges are required for the request
      and whether the request is unauthenticated, so a caller can run only external
      policy checks against a login path.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy.go
    - method:2184800defb24e18f0dba03a3ecc5c39
    - method:8f33ee80e8bbe8f111a332cb8b2d33fd
    id: r.clone-deep-copy
    level: MUST
    text: ACLPermissions.Clone and ControlGroup.Clone return deep copies of their
      receiver and report an error rather than returning a partially copied value,
      so merging rules never aliases the source policy's maps.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy.go
    - struct:05f347d1fbdc6c51bbdab5a7415843b7
    - struct:436d5b1c473a3ddb04137ad40ba1f640
    - struct:559109d5bbd2034ca10c2370c75c77cc
    - struct:88615c2a235941916f17e6ba0a35d97c
    id: r.control-group-model
    level: MUST
    text: 'A policy can carry control-group requirements: ControlGroup holds the factors
      and the identity list, ControlGroupFactor names a factor, IdentityFactor describes
      an identity-based factor with its entity and group names, and ControlGroupIdentity
      names an entity and its groups, so the store can express and copy multi-factor
      access conditions.'
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy.go
    - function:1d9c2c3940c5da04dbce8d9e331379c4
    - function:ce5e405b18d53239274e1cde29e712e0
    id: r.parse-acl-policy
    level: MUST
    text: ParseACLPolicy turns a raw rules string into a Policy bound to the given
      namespace, and ParseACLPolicyWithTemplating does the same while optionally performing
      identity templating with a list of blocked substitutions, an entity and its
      groups; both return an error instead of a partial policy when the rules do not
      parse.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy.go
    - method:01c2ad9feafa4ceb043e92af913fc35f
    - method:d83a713f7ea4d281722e0ef8e988b427
    id: r.policy-decode-clone
    level: MUST
    text: Policy.Decode materialises the policy named by the caller against a namespace,
      and Policy.ShallowClone returns a copy that shares the path and rule data so
      callers can rename or retype a policy without mutating the cached original.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy.go
    - method:deb628b9c3bba5d41c6afa6a68b3846f
    - type_alias:8e3ac3f57ee83613aa804e40e82f2199
    id: r.policy-type
    level: MUST
    text: Type names the kind of policy and Type.String renders it as the text used
      in storage paths and error messages, so a policy's type round-trips from its
      stored name.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - method:552774ae484b2143f6b5bd4511e31143
    - method:9c5bb123f79dec394830b362c902d972
    - method:a9f33f7f348d42e360c597d841e489fa
    id: r.rule-accessors
    level: SHOULD
    text: ACL.ExactRules and ACL.PrefixRules expose the internal radix trees and ACL.Root
      exposes the namespace of a root ACL so that callers such as list filtering can
      inspect the rule set directly.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/acl.go
    - function:5772199666331f7c0f94f82198491e7c
    - struct:8b3dac7fc8f3ab481be70c7b3793fae8
    id: r.rule-indexing
    level: MUST
    text: NewACL indexes each non-expired policy path into exact rules or prefix rules
      by its IsPrefix flag, keeps segment-wildcard paths in a separate map, and clones
      and merges permissions when several policies name the same path, so the ACL
      holds one merged permission set per path.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - function:5772199666331f7c0f94f82198491e7c
    - method:dd0ae629ad8c7b89df9a52d973cd6ab6
    id: r.store-acl-assembly
    level: MUST
    text: Store.ACL assembles an ACL from the named token policies of each namespace
      in the policy-name map, appends any pre-fetched policies passed by the caller,
      and for templated ACL policies re-parses the raw text with the entity and its
      direct and inherited groups before handing everything to NewACL; it errors when
      a namespace is missing, when a policy cannot be fetched or parsed, or when the
      ACL cannot be constructed.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:d9104fe028812ab6b4227fae29cf9c5e
    id: r.store-acl-view
    level: MUST
    text: Store.GetACLView returns the barrier view that holds the ACL policies for
      a namespace, so callers read and write that namespace's policy storage instead
      of the base view.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
