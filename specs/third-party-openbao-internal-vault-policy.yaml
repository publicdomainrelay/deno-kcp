    - method:b10e674c11742296bbd9abf79070307c
    id: r.store-delete-and-invalidate
    level: MUST
    text: Store.DeletePolicy removes a named policy and Store.DeletePolicyForce removes
      it even when it is protected from ordinary deletion; Store.Invalidate drops
      one named policy of a type from the cache, Store.InvalidateNamespace drops every
      cached policy of a namespace, and Store.PurgeCache clears the whole cache.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:3a2f0325460fe600950e469ee8b73c1e
    - method:798df78fa8b25a2d25259650b35b811d
    id: r.store-list
    level: MUST
    text: Store.ListPolicies lists stored policies of one type and Store.ListPoliciesWithPrefix
      narrows that list to names starting with a prefix; both accept omitNonAssignable
      and drop non-assignable policies when it is set, returning an error if the barrier
      listing fails.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:8be19924c6ef7697f8e558f70cee8749
    id: r.store-name-sanitisation
    level: MUST
    text: Store.SanitizeName maps a caller-supplied policy name to the canonical form
      used as the storage key, so the same policy is addressed by one name regardless
      of the spelling given.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:207ba1a4feab95a4024bf1f0f7429b3d
    - method:c90ecedb2a9deed751092ccf278372f3
    - method:cbcfaa9c7bcac2d27131232d89f8f77a
    id: r.store-set-and-get
    level: MUST
    text: Store.SetPolicy writes a policy to the barrier for its namespace and can
      enforce a compare-and-swap version, while Store.GetPolicy reads a policy by
      name and type and Store.GetNonEGPPolicyType reports the stored type of a non-endpoint-governing
      policy, all returning errors on storage failure and nil when nothing is stored.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - function:ce5e405b18d53239274e1cde29e712e0
    - method:dd0ae629ad8c7b89df9a52d973cd6ab6
    id: r.templating-substitution-limits
    level: MUST
    text: 'When re-parsing a templated policy the store blocks the substitutions the
      policy did not opt into: it blocks "/" unless AllowSlashesInIdentityTemplates
      is set, and blocks "*" and "+" unless AllowWildcardsInIdentityTemplates is set,
      so a template can never widen a policy path beyond its declared permissions.'
