    id: r.store-construction
    level: MUST
    text: NewStore builds a policy Store over the supplied core, base barrier view,
      system view and logger, and returns an error when the store cannot be initialised;
      the same core supplies namespace lookup by ID, the identity store and the namespace
      barrier view through core.NamespaceByID, core.IdentityStore and core.NamespaceView.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:56de26f3a784e2f2c3445714a7f84130
    - method:862e5a93cdad4e55579a070d96e86a2c
    id: r.store-default-and-load
    level: SHOULD
    text: Store.LoadDefaultPolicies installs the built-in default policies when they
      are absent, and Store.LoadACLPolicy stores the given policy text under the given
      name, both returning an error if the write fails.
  - codeRefs:
    - file:third_party/openbao/internal/vault/policy/policy_store.go
    - method:1728f8a4efd8925dc0f89123c8b08bfb
