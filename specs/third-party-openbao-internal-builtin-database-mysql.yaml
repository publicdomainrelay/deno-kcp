apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-internal-builtin-database-mysql
  namespace: default
spec:
  intent: 'This context exists to specify the MySQL database secrets engine backend:
    the code that turns plugin configuration into a live, pooled MySQL connection
    and that issues, rotates and revokes database credentials for roles. It is the
    boundary where OpenBao''s generic database plugin contracts (dbplugin and connutil)
    meet the go-sql-driver/mysql driver, so the spec must pin the configuration contract,
    the connection and failover behavior, the secret redaction rule, and the credential
    lifecycle entry points that the rest of the engine calls.'
  interfaces:
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: struct
    name: MySQL
    signature: type MySQL struct
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: method
    name: MySQL.DeleteUser
    signature: (ctx context.Context, req dbplugin.DeleteUserRequest) (dbplugin.DeleteUserResponse,
      error)
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: method
    name: MySQL.Initialize
    signature: (ctx context.Context, req dbplugin.InitializeRequest) (dbplugin.InitializeResponse,
      error)
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: method
    name: MySQL.NewUser
    signature: (ctx context.Context, req dbplugin.NewUserRequest) (dbplugin.NewUserResponse,
      error)
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: method
    name: MySQL.Type
    signature: () (string, error)
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: method
    name: MySQL.UpdateUser
    signature: (ctx context.Context, req dbplugin.UpdateUserRequest) (dbplugin.UpdateUserResponse,
      error)
  - file: third_party/openbao/internal/builtin/database/mysql/mysql.go
    kind: function
    name: New
    signature: (defaultUsernameTemplate string) func() (any, error)
  - file: third_party/openbao/internal/builtin/database/mysql/connection_producer.go
    kind: method
    name: mySQLConnectionProducer.Close
    signature: () error
  - file: third_party/openbao/internal/builtin/database/mysql/connection_producer.go
    kind: method
    name: mySQLConnectionProducer.Connection
    signature: (ctx context.Context) (any, error)
  - file: third_party/openbao/internal/builtin/database/mysql/connection_producer.go
    kind: method
    name: mySQLConnectionProducer.Init
    signature: (ctx context.Context, conf map[string]any, verifyConnection bool) (map[string]any,
      error)
  - file: third_party/openbao/internal/builtin/database/mysql/connection_producer.go
    kind: method
    name: mySQLConnectionProducer.Initialize
    signature: (ctx context.Context, conf map[string]any, verifyConnection bool) error
  - file: third_party/openbao/internal/builtin/database/mysql/connection_producer.go
    kind: method
    name: mySQLConnectionProducer.SecretValues
    signature: () map[string]string
  repository: deno-kcp
  requirements:
  - codeRefs:
    - method:ccc37717bb59483c31e56f15b56eb65a
    id: r.close-signature
    level: MUST
    text: Close takes no arguments and returns an error, satisfying the ConnectionProducer
      close contract.
  - codeRefs:
    - method:1dcf4d26b3f813c8c805c7be795ed38d
    id: r.connection-builds-from-dsn
    level: MUST
    text: 'Connection must parse ConnectionURL with mysql.ParseDSN, returning "unable
      to parse connectionURL: %w" on failure, set config.TLSConfig to tlsConfigName
      when set, and set config.DialFunc to dialWithFailover when more than one host
      is configured.'
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.connection-lifetime-default
    level: MUST
    text: 'Init must default MaxConnectionLifetimeRaw to "0s" and parse it with parseutil.ParseDurationSecond,
      returning "invalid max_connection_lifetime: %w" on failure.'
  - codeRefs:
    - method:1dcf4d26b3f813c8c805c7be795ed38d
    id: r.connection-opens-pool
    level: MUST
    text: 'Connection must create the handle with mysql.NewConnector then sql.OpenDB,
      returning "unable to create mysql connector: %w" on connector failure, and must
      apply SetMaxOpenConns, SetMaxIdleConns and SetConnMaxLifetime from the configured
      values.'
  - codeRefs:
    - method:1dcf4d26b3f813c8c805c7be795ed38d
    id: r.connection-requires-initialized
    level: MUST
    text: Connection must return connutil.ErrNotInitialized when the producer has
      not been initialized.
  - codeRefs:
    - method:1dcf4d26b3f813c8c805c7be795ed38d
    id: r.connection-reuses-pinged-db
    level: MUST
    text: Connection must reuse an existing db handle when PingContext succeeds, and
      when the ping fails must close that handle and ignore the close error so a new
      handle is established.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.connection-url-required
    level: MUST
    text: Init must fail with the error "connection_url cannot be empty" when ConnectionURL
      is empty.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.connection-url-substitution
    level: MUST
    text: Init must rewrite ConnectionURL through dbutil.QueryHelper, substituting
      username as url.PathEscape(Username) and password verbatim, because MySQL passwords
      must not have special characters escaped.
  - codeRefs:
    - method:0b8132995d14bfa7b27f7f8395282f08
    - method:a5bc8db241ea4458270d9852cb464d37
    - method:c3614388cef34b7f1d861709b81d21f1
    id: r.credential-lifecycle
    level: MUST
    text: 'MySQL must implement the dbplugin credential lifecycle: NewUser, DeleteUser
      and UpdateUser each take a context and their request type and return their response
      type plus an error.'
  - codeRefs:
    - file:third_party/openbao/internal/builtin/database/mysql/mysql.go
    id: r.get-connection-narrows-to-sql-db
    level: SHOULD
    text: MySQL.getConnection should call Connection and type-assert the result to
      *sql.DB, returning the assertion failure as an error.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.init-locks-and-decodes
    level: MUST
    text: Init must take the producer write lock for its whole body, store conf in
      RawConfig, and weak-decode conf into the producer with mapstructure.WeakDecode,
      returning the decode error unwrapped.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.init-returns-raw-config
    level: MUST
    text: Init must return RawConfig as its first result on success.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.init-verify-connection
    level: MUST
    text: 'Init must set Initialized to true once all fields are populated, and when
      verifyConnection is true must open a connection and then call PingContext, returning
      "error verifying - connection: %w" or "error verifying - ping: %w" respectively.'
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    - method:e50b9f1a12554552068bc1ef044fe986
    id: r.initialize-delegates-to-init
    level: MUST
    text: Initialize takes ctx, conf and verifyConnection, calls Init with the same
      arguments and returns only the error, discarding the returned raw config.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.multihost-dsn-parsed
    level: MUST
    text: 'Init must call parseMultiHostDSN and return a wrapped error "error parsing
      multi-host DSN: %w" on failure.'
  - codeRefs:
    - struct:76f64e78002f3990882f31fc4fa973cd
    id: r.mysql-embeds-producer
    level: MUST
    text: MySQL must embed *mySQLConnectionProducer and carry usernameProducer of
      type template.StringTemplate plus the defaultUsernameTemplate string.
  - codeRefs:
    - function:ab7a97517afe8744ec208e49efaa382c
    id: r.new-constructor
    level: MUST
    text: New must accept a defaultUsernameTemplate string and return a func() (any,
      error) constructor for the plugin.
  - codeRefs:
    - method:0d811a165342ca2e1598b6fcbf4cd993
    id: r.plugin-initialize
    level: MUST
    text: MySQL.Initialize must accept a dbplugin.InitializeRequest and return a dbplugin.InitializeResponse
      and error.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.pool-defaults
    level: MUST
    text: Init must default MaxOpenConnections to 4 when zero, default MaxIdleConnections
      to MaxOpenConnections when zero, and clamp MaxIdleConnections down to MaxOpenConnections
      when it exceeds it.
  - codeRefs:
    - method:1dcf4d26b3f813c8c805c7be795ed38d
    - method:3dec55da06dfc4b9ab79d175e9c5f669
    - method:442bc4e61ba09f7de989ce75450cf291
    - method:ccc37717bb59483c31e56f15b56eb65a
    - method:e50b9f1a12554552068bc1ef044fe986
    id: r.producer-satisfies-connutil
    level: MUST
    text: mySQLConnectionProducer must implement the connutil ConnectionProducer contract
      by providing Initialize, Init, Connection, SecretValues and Close.
  - codeRefs:
    - method:3dec55da06dfc4b9ab79d175e9c5f669
    id: r.secret-values-redaction
    level: MUST
    text: SecretValues must map the configured Password to the literal placeholder
      "[password]" so it is redacted in output.
  - codeRefs:
    - file:third_party/openbao/internal/builtin/database/mysql/connection_producer_test.go
    - file:third_party/openbao/internal/builtin/database/mysql/mysql_test.go
    id: r.tests-beside-sources
    level: SHOULD
    text: The producer and plugin behavior should stay covered by connection_producer_test.go
      and mysql_test.go alongside the sources.
  - codeRefs:
    - method:442bc4e61ba09f7de989ce75450cf291
    id: r.tls-config-registration
    level: MUST
    text: Init must obtain a TLS config from getTLSAuth, and when one is returned
      must generate a UUID for tlsConfigName if it is empty and register the config
      with mysql.RegisterTLSConfig under that name.
  - codeRefs:
    - method:428289802a4f07b84a7410d39be9bcd0
    id: r.type-name
    level: MUST
    text: MySQL.Type must return mySQLTypeName with a nil error.
  upstream: self
