apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/lib/pki/app/utils/action-params.js action-params.js@third_party/openbao/ui/lib/pki/app/utils/action-params.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-pki-app-utils
  namespace: default
spec:
  intent: The context exists to pin down the app-level utility directory of the vendored
    OpenBao PKI UI as a thin compatibility shim rather than a place with real behavior.
    Any consumer or test that imports keyParamsByType from the app utils path depends
    on this file forwarding to the library utils module; the context records that
    dependency so a refactor of the re-export is known to break pki-generate-root
    component tests.
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/app/utils/action-params.js
    id: r.license-header
    level: MUST
    text: The module keeps the HashiCorp copyright notice and the SPDX-License-Identifier
      MPL-2.0 header at the top of the file.
  - codeRefs:
    - file:third_party/openbao/ui/lib/pki/app/utils/action-params.js
    id: r.reexport-key-params-by-type
    level: MUST
    text: The app utils module re-export keyParamsByType from pki/utils/action-params
      as a named export, with no local definition or transformation of the value,
      so that the pki-generate-root component tests resolve the symbol through the
      app path.
  upstream: self
