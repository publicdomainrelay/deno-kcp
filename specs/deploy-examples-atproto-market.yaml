- file:.tools/open-architecture/arch.yaml arch.yaml@.tools/open-architecture/arch.yaml
- file:deploy/examples/atproto/market/00-workspaces.yaml 00-workspaces.yaml@deploy/examples/atproto/market/00-workspaces.yaml
- file:deploy/examples/atproto/market/10-rbac.yaml 10-rbac.yaml@deploy/examples/atproto/market/10-rbac.yaml
- file:deploy/examples/atproto/market/15-openbao-alice.yaml 15-openbao-alice.yaml@deploy/examples/atproto/market/15-openbao-alice.yaml
- file:deploy/examples/atproto/market/15-openbao-bob.yaml 15-openbao-bob.yaml@deploy/examples/atproto/market/15-openbao-bob.yaml
- file:deploy/examples/atproto/market/15-openbao-global.yaml 15-openbao-global.yaml@deploy/examples/atproto/market/15-openbao-global.yaml
- file:deploy/examples/atproto/market/15-openbao-relay.yaml 15-openbao-relay.yaml@deploy/examples/atproto/market/15-openbao-relay.yaml
