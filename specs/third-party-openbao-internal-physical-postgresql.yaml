kind: SystemContext
metadata:
  name: third-party-openbao-internal-physical-postgresql
  namespace: default
spec:
  intent: The context exists so the repository carries a self-contained, buildable
    copy of the OpenBao PostgreSQL storage driver rather than importing it from an
    external module. It records the backend's configuration entry point, its physical.Backend
    read and write surface, its transaction surface, its HA lock surface, and its
    replication-index semantics, plus the test helpers the package's test file depends
    on. Describing it here lets other parts of the repository see exactly which storage
    guarantees the vendored driver offers without reading the vendored source.
  interfaces:
  - file: third_party/openbao/internal/physical/postgresql/testing.go
    kind: function
    name: GetTestPostgreSQLBackend
    signature: (t *testing.T, logger log.Logger) (physical.Backend, func())
  - file: third_party/openbao/internal/physical/postgresql/testing.go
    kind: function
    name: GetTestReplicatedPostgreSQLBackend
    signature: (t *testing.T, name string, logger log.Logger) (physical.Backend, physical.Backend,
      func())
  - file: third_party/openbao/internal/physical/postgresql/postgresql.go
    kind: function
    name: NewPostgreSQLBackend
    signature: (conf map[string]string, logger log.Logger) (physical.Backend, error)
