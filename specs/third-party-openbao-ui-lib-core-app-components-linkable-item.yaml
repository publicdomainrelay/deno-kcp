apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:third_party/openbao/ui/lib/core/app/components/linkable-item/content.js content.js@third_party/openbao/ui/lib/core/app/components/linkable-item/content.js
- file:third_party/openbao/ui/lib/core/app/components/linkable-item/menu.js menu.js@third_party/openbao/ui/lib/core/app/components/linkable-item/menu.js
kind: SystemContext
metadata:
  name: third-party-openbao-ui-lib-core-app-components-linkable-item
  namespace: default
spec:
  intent: This context exists as a thin aliasing layer between the app-level components
    directory and the core/components implementation of the linkable-item content
    and menu components in the vendored OpenBao UI app. It lets the Ember resolver
    resolve linkable-item pieces through the app/components path without duplicating
    any implementation, and it keeps the third_party tree layout consistent with the
    upstream OpenBao UI source it was vendored from.
  repository: deno-kcp
  requirements:
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/content.js
    id: r.content-reexports-core-default
    level: MUST
    text: content.js must re-export, as its default export, the default export of
      the module 'core/components/linkable-item/content', and must define no other
      exports or logic of its own, so that a consumer importing the app-level content
      component receives exactly the core component.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/content.js
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/menu.js
    id: r.license-header-retained
    level: MUST
    text: 'Both files must keep the HashiCorp copyright notice and the SPDX-License-Identifier:
      MPL-2.0 header comment at the top of the file.'
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/menu.js
    id: r.menu-reexports-core-default
    level: MUST
    text: menu.js must re-export, as its default export, the default export of the
      module 'core/components/linkable-item/menu', and must define no other exports
      or logic of its own, so that a consumer importing the app-level menu component
      receives exactly the core component.
  - codeRefs:
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/content.js
    - file:third_party/openbao/ui/lib/core/app/components/linkable-item/menu.js
    id: r.module-path-fidelity
    level: MUST
    text: Each re-export must keep pointing at the core/components/linkable-item path,
      so that consumers importing from the app/components path resolve the same component
      the core path provides and the shim never diverges from the core implementation.
  upstream: self
