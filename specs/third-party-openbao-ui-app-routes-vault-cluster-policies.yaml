apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: third-party-openbao-ui-app-routes-vault-cluster-policies
  namespace: default
spec:
  repository: deno-kcp
  upstream: self
  intent: 'The context exists so the policy list and policy create routes of the OpenBao
    UI can be described and reasoned about as one unit: both routes derive their behavior
    from a single `policyType()` lookup on the `vault.cluster.policies` params, both
    treat only the `acl` type as a first-class supported type, and both share controller-facing
    setup and reset semantics. Documenting them together keeps the type dispatch,
    pagination, transition guards, and cleanup contract visible as a whole rather
    than split across two files.'
  requirements:
  - id: r.create-acl-only-record
    level: MUST
    text: The create route's model hook must create a new `policy/<policyType>` store
      record only when the policy type is `acl`; for any other type it must instead
      transition to `vault.cluster.policies` with that policy type.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
  - id: r.create-cleanup-on-exit
    level: MUST
    text: The create route's `resetController` must invoke the controller's optional
      `cleanupModel` method when the route is exiting, after delegating to the superclass
      implementation.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
  - id: r.create-controller-policy-type
    level: MUST
    text: The create route's `setupController` must call the superclass implementation
      and then set `policyType` on the controller to the resolved policy type.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
  - id: r.create-dirty-transition-guard
    level: MUST
    text: The create route's `willTransition` action must allow the transition when
      there is no current model or the model has no dirty attributes, and when the
      model has dirty attributes must show a confirmation reading 'You have unsaved
      changes. Navigating away will discard these changes. Are you sure you want to
      discard your changes?', returning true on confirmation and aborting the transition
      with `transition.abort()` otherwise.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
  - id: r.index-404-tolerance
    level: MUST
    text: A 404 from the store query must resolve to an empty array when the policy
      type is not `acl`, and must otherwise be rethrown, because ACL policies can
      never be empty while other policy types may legitimately return 404.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-empty-model-for-non-acl
    level: MUST
    text: The index route must return an empty model when the policy type is not `acl`,
      using `shouldReturnEmptyModel(policyType)` which is true for every type other
      than `acl`, and skip the store query entirely in that case.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-lazy-paginated-query
    level: MUST
    text: 'For ACL policies the index route must load records with `store.lazyPaginatedQuery(''policy/<type>'')`,
      passing `page`, `pageFilter`, and `responsePath: ''data.keys''` from the route
      params.'
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-refresh-on-paging-params
    level: MUST
    text: 'The index route must declare `page` and `pageFilter` query params with
      `refreshModel: true`, so changing either param re-runs the model hook and re-queries
      the store.'
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-reload-action
    level: MUST
    text: The index route's `reload` action must clear all store datasets and then
      call `refresh()` so the list is rebuilt against fresh server data.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-reset-controller-on-exit
    level: MUST
    text: The index route's `resetController` must clear `pageFilter` to null and
      `filter` to the empty string when the route is exiting, after delegating to
      the superclass implementation.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-setup-controller-properties
    level: MUST
    text: The index route's `setupController` must set `model`, `filter` (from `pageFilter`,
      defaulting to empty string), `page` (from `model.meta.currentPage`, defaulting
      to 1), and `policyType`; when the model is falsy it must instead set `model`
      to null together with `policyType`.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.index-transition-dataset-reset
    level: MUST
    text: The index route's `willTransition` action must scroll the window to the
      top and, when the transition target is not this route, call `store.clearAllDatasets()`;
      it must return true so the transition proceeds.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
  - id: r.policy-type-from-route-params
    level: MUST
    text: Both route modules must resolve the active policy type by reading the `type`
      parameter of the `vault.cluster.policies` route via `paramsFor('vault.cluster.policies').type`,
      so that the list and create routes agree on which policy family is being viewed.
    codeRefs:
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
    - file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
codeRefIndex:
- file:third_party/openbao/ui/app/routes/vault/cluster/policies/create.js create.js@third_party/openbao/ui/app/routes/vault/cluster/policies/create.js
- file:third_party/openbao/ui/app/routes/vault/cluster/policies/index.js index.js@third_party/openbao/ui/app/routes/vault/cluster/policies/index.js
