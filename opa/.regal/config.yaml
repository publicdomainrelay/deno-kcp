rules:
  style:
    line-length:
      max-line-length: 200
      level: ignore
    todo-comment:
      level: error
    external-reference:
      level: ignore
    pointless-reassignment:
      level: error
  idiomatic:
    directory-package-mismatch:
      level: ignore
  testing:
    test-outside-test-package:
      level: error
    identical-terms:
      level: error
  performance:
    with-outside-test-context:
      level: ignore
  custom:
    naming-convention:
      level: error
      conventions:
        - pattern: '^deno_kcp(\.[a-z0-9_]+)*$'
          targets:
            - package
        - pattern: '^[a-z][a-z0-9_]*$'
          targets:
            - rule
