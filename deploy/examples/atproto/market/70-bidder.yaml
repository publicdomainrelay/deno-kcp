apiVersion: deno.computer/v1alpha1
kind: DenoPod
metadata:
  name: bidder
  namespace: default
  finalizers:
    - denopod.deno.computer/run
spec:
  restartPolicy: Always
  serviceAccount:
    name: deno-runner
    namespace: default
  env:
    SERVICE_ENTRY: "/home/johnandersen777/src/publicdomainrelay-kcp/atproto-market/hono-bidder/mod.ts"
    SERVICE_CWD: "/home/johnandersen777/src/publicdomainrelay-kcp/atproto-market"
    # --serve-port is the bidder's own name for its listener; the provider's name
    # table only reads --port or PORT, so SERVICE_ENV carries PORT 2586 as well.
    # The deno-worker compute provider is the one that needs no cloud credential.
    SERVICE_ARGS: '["--serve-addr","127.0.0.1","--serve-port","2586","--plc-directory-url","https://plc.default.global.svc.kcp.local","--relay-url","https://relay.default.relay.svc.kcp.local","--skip-qr","--no-ingress-proxy","--compute-provider-deno-worker"]'
    SERVICE_DENO_FLAGS: '["--unstable-kv"]'
    SERVICE_ENV: '{"PORT":"2586","HOSTNAME":"127.0.0.1","REPO_PRIVATE_KEY_HEX":"__BIDDER_PRIVATE_KEY_HEX__"}'
    SERVICE_TLS: "true"
  script: |
    const entry = Deno.env.get("SERVICE_ENTRY") ?? "";
    const cwd = Deno.env.get("SERVICE_CWD") ?? "";
    const args: string[] = JSON.parse(Deno.env.get("SERVICE_ARGS") ?? "[]");
    const denoFlags: string[] = JSON.parse(Deno.env.get("SERVICE_DENO_FLAGS") ?? "[]");
    const serviceEnv: Record<string, string> = JSON.parse(Deno.env.get("SERVICE_ENV") ?? "{}");

    if (!entry || !cwd) {
      await Deno.writeTextFile(
        "result.json",
        JSON.stringify({ error: "SERVICE_ENTRY and SERVICE_CWD are required" }),
      );
      Deno.exit(2);
    }

    const runDir = Deno.cwd();
    const childEnv: Record<string, string> = {
      PATH: Deno.env.get("PATH") ?? "",
      HOME: Deno.env.get("HOME") ?? "",
      ...serviceEnv,
    };

    // The bidder consumes the trust bundle only. It has no --tls-cert-file or
    // --tls-key-file option and its parser rejects unknown flags, so a leaf
    // injected here would kill it on startup.
    const caBundle = Deno.env.get("KCP_CA_BUNDLE") ?? "";
    if (caBundle) {
      const caPath = `${runDir}/ca.pem`;
      await Deno.writeTextFile(caPath, caBundle);
      childEnv.DENO_CERT = caPath;
    }

    // The bidder reaches the PLC directory and the relay with the same shim this
    // pod was probed with. A workload's own argv cannot carry --preload, so it
    // is added here, before the entry module.
    const shim = Deno.env.get("KCP_SHIM") ?? "";
    if (shim) denoFlags.unshift("--preload", shim);

    const child = new Deno.Command(Deno.execPath(), {
      args: ["run", "-A", ...denoFlags, entry, ...args],
      cwd,
      env: childEnv,
      stdin: "null",
      stdout: "inherit",
      stderr: "inherit",
    });

    const status = await child.spawn().status;
    await Deno.writeTextFile("result.json", JSON.stringify({ exitCode: String(status.code) }));
    Deno.exit(status.code);
  permissions:
    read:
      allow: true
    write:
      allowList:
        - result.json
        - ca.pem
    run:
      allow: true
    env:
      allowList:
        - SERVICE_ENTRY
        - SERVICE_CWD
        - SERVICE_ARGS
        - SERVICE_DENO_FLAGS
        - SERVICE_ENV
        - SERVICE_TLS
        - KCP_SHIM
        - KCP_TLS_CERT
        - KCP_TLS_KEY
        - KCP_CA_BUNDLE
        - KCP_SERVICE_NAME
        - KCP_SERVICE_DOMAIN
        - KCP_DNS_TABLE
        - KCP_TOKENS
        - KCP_SERVER
        - KCP_NAMESPACE
        - PATH
        - HOME
    noPrompt: true
  readinessProbe:
    command:
      - kcpdns
      - bidder.default.bob.svc.kcp.local
      - /oauth-client-metadata.json
    periodSeconds: 5
    failureThreshold: 6
    timeoutSeconds: 10
