apiVersion: deno.computer/v1alpha1
kind: PolicyWorkflowRun
metadata:
  name: open-policy
  namespace: default
  finalizers:
    - policyworkflowrun.deno.computer/run
spec:
  engineEndpoint: http://127.0.0.1:8080
  workflow:
    name: open policy
    on:
      workflow_dispatch:
        inputs:
          self-did:
            required: true
    jobs:
      evaluate:
        runs-on: self-hosted
        steps:
        - uses: tangy/policy-open@v1
          id: policy
          with:
            self-did: ${{ inputs.self-did || '' }}
        - run: echo "allow=${{ steps.policy.outputs.allow }} violations=${{ steps.policy.outputs.violations }}"
        - run: test "${{ steps.policy.outputs.allow }}" = "true"
  inputs:
    self-did: did:plc:example
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
