apiVersion: deno.computer/v1alpha1
kind: DenoPod
metadata:
  name: read-policy-result
  namespace: default
  finalizers:
    - denopod.deno.computer/run
spec:
  denoJson:
    fmt:
      lineWidth: 100
  denoLock: |
    {
      "version": "5"
    }
  restartPolicy: Always
  script: |
    const token = Deno.env.get("KCP_TOKEN") ?? "";
    const server = Deno.env.get("KCP_SERVER") ?? "";
    const name = Deno.env.get("POD_WORKFLOW") ?? "open-policy";
    const url = `${server}/apis/deno.computer/v1alpha1/namespaces/default/policyworkflowruns/${name}`;
    while (true) {
      const res = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
      const body = await res.json();
      const allow = body?.status?.outputs?.allow ?? "";
      await Deno.writeTextFile(
        "result.json",
        JSON.stringify({ httpStatus: String(res.status), allow }),
      );
      await new Promise((resolve) => setTimeout(resolve, 5000));
    }
  permissions:
    read:
      allow: true
    write:
      allowList:
        - result.json
    net:
      allow: true
    env:
      allowList:
        - KCP_TOKEN
        - KCP_SERVER
        - KCP_WORKSPACE
        - POD_WORKFLOW
    noPrompt: true
  serviceAccount:
    name: deno-runner
    namespace: default
  env:
    POD_WORKFLOW: open-policy
  readinessProbe:
    command:
      - "true"
    periodSeconds: 2
    failureThreshold: 3
    timeoutSeconds: 2
