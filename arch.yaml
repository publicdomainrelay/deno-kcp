  id: sc.api-v1alpha1
  intent: This context exists so the operator can persist and reconcile deno-kcp custom
    resources through the Kubernetes API machinery. The package defines the on-cluster
    schema (specs, statuses, phase enums), the list types the informers and clientsets
    need, the kubebuilder deep-copy implementations that keep informer caches free
    of aliasing bugs, and the bridge that turns the CRD-shaped DenoPermissions and
    ServiceAccountRef into the denospec types the runtime layer consumes. It is the
    shared vocabulary between the controllers, the provider registry and the denospec
    execution library.
