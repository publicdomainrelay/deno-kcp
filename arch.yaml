  - test/integration/offline_test.go
  - test/integration/openbao_live_test.go
  id: sc.test-integration
  intent: This context exists to hold the one test package that proves deno-kcp works
    against real infrastructure and against the checked-in examples. It separates
    what can be verified from the repository alone (offline_test.go, examples.go)
    from what needs a running kcp, kine, deno and policy-engine (live_test.go, fixture_test.go)
    from what additionally needs the pinned OpenBao (bao_test.go, openbao_live_test.go),
    so the cheap checks run everywhere and the expensive ones are gated behind explicit
    opt-in. The fixture layer exists so that every live test describes intent in terms
    of typed Kubernetes objects and named expectations rather than raw HTTP, and so
    the OpenBao version certificates are issued by is the one the repository pins,
    never whatever binary happens to be on PATH. The example registry covers every
    kcp-kind manifest the repository ships, including the atproto market manifests
    under deploy/examples/atproto/market, so the offline tier decodes and schema-fits
    them with no cluster.
  interfaces:
  - file: test/integration/openbao_live_test.go
    kind: function
    name: TestANamespaceWithoutAnOpenBaoObjectGetsNoCertificate
    signature: func TestANamespaceWithoutAnOpenBaoObjectGetsNoCertificate(t *testing.T)
