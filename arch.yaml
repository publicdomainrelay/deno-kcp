  id: sc.internal-provider
  intent: 'This context exists to hold the provider-side controller logic of deno-kcp
    as a single describable unit: the reconcile engines and their per-kind reconcile
    files, the Reader/Runtime/TokenMinter port interfaces the engines depend on, the
    Registry implementation that satisfies those ports against Kubernetes, the admission
    adapter that gates runs by capacity, the informer-backed watch cache, and the
    metrics surface. It is the boundary between the queue/reconcile library code and
    the concrete cluster API, so the spec here fixes which ports exist, what each
    method must do, and which invariants (default concurrency policy, finalizer removal,
    cache-served reads, cluster path resolution) must hold.'
