- code:
  - cmd/deno-kcp-provider/main.go
  id: sc.cmd-deno-kcp-provider
  intent: 'This context exists to be the process entrypoint for the deno-kcp provider
    controller. Everything it does is wiring: turn command line flags and environment
    variables into a config, refuse to start without a kubeconfig, build the registry,
    engine runner, pod runner and provider in the order their dependencies require,
    and then run the provider until a termination signal arrives. The two non-obvious
    behaviours it encodes are the KUBE_FEATURE_WatchListClient opt-out, which stops
    a streaming list from hanging when kcp''s APIExport virtual workspace sends no
    bookmark, and the deferred TrustBundle closure, which exists because the OpenBao
    root CA does not exist until a namespace has requested a certificate and the provider
    that generates it is built from the runner being constructed. It is deliberately
    thin, holding no reconcile logic of its own.'
  name: cmd-deno-kcp-provider
  requirements:
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.bundled-actions-default
    level: MUST
    text: When --bundled-actions-dir is empty, main derives it as the policy engine
      directory joined with /../policies/gha-lite/bundled-actions.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.ca-data-fallback
    level: MUST
    text: caData returns the rest config's CAData when present, otherwise the contents
      of CAFile when it can be read, otherwise nil.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.construction-order
    level: MUST
    text: main builds the registry, the engine runner, the exec pod runner, and then
      the provider, exiting with status 1 and a logged error when any construction
      fails.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.deferred-trust-bundle
    level: MUST
    text: The exec pod runner's TrustBundle is a closure that returns the kubeconfig
      CA data from caData while the provider is nil and providerImpl.TrustBundle once
      the provider exists, because the OpenBao root CA does not exist before a namespace
      requests a certificate.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.disable-watch-list-client
    level: MUST
    text: main sets KUBE_FEATURE_WatchListClient to false before any client-go call,
      because kcp's APIExport virtual workspace sends no bookmark and an informer's
      initial list would otherwise never complete.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.flag-env-fallback
    level: MUST
    text: Every configuration value comes from a flag whose default is the environment
      variable, and the environment is read through envOr for strings and envOrInt64
      for integers, which ignore an empty or unparseable variable and use the fallback.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.host-override
    level: MUST
    text: The host passed to the registry and the provider is the kubeconfig's server
      unless --host is set, in which case the flag wins.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.negative-run-ttl-disables
    level: MUST
    text: defaultRunTTL answers nil for a negative seconds value, which disables the
      default run TTL, and otherwise returns a pointer to the value.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.openbao-ca-read-nonfatal
    level: SHOULD
    text: readIfSet returns nil and logs a warning, rather than failing startup, when
      the PEM file named by the OpenBao CA flag cannot be read, so an https vault
      surfaces as a failed TLS verification instead of a provider that will not start.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.require-kubeconfig
    level: MUST
    text: main exits with status 2 and a message on stderr when neither --kubeconfig
      nor KUBECONFIG is set.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.run-until-signal
    level: MUST
    text: main runs providerImpl.Run under a context cancelled by SIGINT or SIGTERM,
      and exits with status 1 and a logged error if Run returns an error.
  - codeRefs:
    - file:cmd/deno-kcp-provider/main.go
    id: r.single-binary-entrypoint
    level: MUST
    text: The package provides a main function that acts as the provider process entrypoint
      and holds no reconcile logic.
  upstream: self
- code:
  - deploy/denojob-apiresourceschema.yaml
  - deploy/denopod-apiresourceschema.yaml
  - deploy/denorun-apiresourceschema.yaml
  - deploy/denoruntime-apiexport.yaml
  - deploy/openbao-apiresourceschema.yaml
  - deploy/policyengine-apiresourceschema.yaml
  - deploy/policyworkflowpod-apiresourceschema.yaml
  - deploy/policyworkflowrun-apiexport.yaml
  - deploy/policyworkflowrun-apiresourceschema.yaml
  - deploy/runtrigger-apiresourceschema.yaml
  - deploy/workspacetype-denoruntime.yaml
  - deploy/workspacetype-workflow.yaml
  id: sc.deploy
  intent: 'This context exists so the deno.computer API surface can be installed into
    a local kcp instance as declarative YAML: the APIResourceSchemas are the single
    definition of each kind''s spec and status, the APIExports are what tenant workspaces
    bind to, and the WorkspaceTypes are what gives a tenant workspace that binding
    by default. Tooling and scripts consume these files by path, so the file names,
    schema names, kind names, shortNames and phase enums are a contract and not decoration.'
  name: deploy
  requirements:
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.api-group-version-scope
    level: MUST
    text: Every APIResourceSchema declares group deno.computer, scope Namespaced,
      and a single v1alpha1 version that is both served and stored.
  - codeRefs:
    - file:deploy/denoruntime-apiexport.yaml
    id: r.apiexport-denoruntime
    level: MUST
    text: APIExport denoruntime lists denopods, denoruns, denojobs, runtriggers, policyengines,
      policyworkflowpods and openbaos in group deno.computer, each pointing at its
      versioned APIResourceSchema name with CRD storage.
  - codeRefs:
    - file:deploy/policyworkflowrun-apiexport.yaml
    id: r.apiexport-policyworkflowruns
    level: MUST
    text: APIExport policyworkflowruns publishes the single policyworkflowruns resource
      in group deno.computer against schema v1alpha1-4.policyworkflowruns.deno.computer.
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.names-block
    level: MUST
    text: 'Each schema spec.names declares kind, listKind, plural, singular and shortNames:
      DenoPod/dpod, DenoRun/drun, DenoJob/djob, RunTrigger/rtrig, PolicyEngine/peng,
      PolicyWorkflowPod/pwpod, PolicyWorkflowRun/pwr, OpenBao/obao.'
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.phase-enums
    level: MUST
    text: 'Status phase enums are fixed per kind: DenoPod, DenoRun and DenoJob use
      Pending/Running/Succeeded/Failed; RunTrigger uses Pending/Triggered/Skipped/Failed;
      PolicyEngine and PolicyWorkflowPod use Pending/Running/Failed; PolicyWorkflowRun
      uses Pending/Running/Succeeded/Failed/Cancelled; OpenBao carries no phase and
      reports ready plus message instead.'
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.required-spec-fields
    level: MUST
    text: 'Required spec fields are exactly: DenoPod script; DenoRun script; DenoJob
      template; RunTrigger policyWorkflowPod and jobTemplate; PolicyWorkflowPod workflow
      and policyEngine; OpenBao namespace. PolicyEngine and PolicyWorkflowRun declare
      no required spec fields.'
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.schema-names-versioned
    level: MUST
    text: 'Each schema metadata.name is the versioned resource string v1alpha1-N.<plural>.deno.computer,
      with N unique per kind: openbaos 1, denoruns 2, policyengines 2, denopods 3,
      runtriggers 3, denojobs 4, policyworkflowruns 4, policyworkflowpods 5.'
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.status-conditions
    level: SHOULD
    text: Each kind's status carries a conditions array of objects with x-kubernetes-preserve-unknown-fields,
      so standard condition sets can be added without a schema change.
  - codeRefs:
    - file:deploy/denojob-apiresourceschema.yaml
    - file:deploy/denopod-apiresourceschema.yaml
    - file:deploy/denorun-apiresourceschema.yaml
    - file:deploy/openbao-apiresourceschema.yaml
    - file:deploy/policyengine-apiresourceschema.yaml
    - file:deploy/policyworkflowpod-apiresourceschema.yaml
    - file:deploy/policyworkflowrun-apiresourceschema.yaml
    - file:deploy/runtrigger-apiresourceschema.yaml
    id: r.status-subresource
    level: MUST
    text: Every schema version enables subresources.status, so phase and conditions
      are written by the provider and not by the tenant.
  - codeRefs:
    - file:deploy/denoruntime-apiexport.yaml
    - file:deploy/policyworkflowrun-apiexport.yaml
    id: r.validate-cross-check
    level: SHOULD
    text: 'The deploy manifests stay consistent with the Go types: validate.py maps
      each sc.kind.* to its schema file and each APIExport to its export file, then
      checks upstream api.short against names.shortNames[0], api.resource against
      names.plural, and upstream phases and conditions against the Go Phase* and Condition*
      constants.'
  - codeRefs:
    - file:deploy/workspacetype-denoruntime.yaml
    id: r.workspacetype-denoruntime
    level: MUST
    text: WorkspaceType denoruntime extends workflow and universal from root and defaults
      both API bindings, policyworkflowruns and denoruntime, at path root:deno-provider.
  - codeRefs:
    - file:deploy/workspacetype-workflow.yaml
    id: r.workspacetype-workflow
    level: MUST
    text: WorkspaceType workflow extends universal from root and defaults the API
      binding for export policyworkflowruns at path root:deno-provider.
  upstream: self
- code:
  - deploy/examples/deno-job.yaml
  - deploy/examples/deno-pod.yaml
  - deploy/examples/deno-run.yaml
  - deploy/examples/native-fire-pod.yaml
  - deploy/examples/openbao-tls-pod.yaml
  - deploy/examples/openbao.yaml
  - deploy/examples/policy-workflow-run.yaml
  - deploy/examples/policyengine.yaml
  - deploy/examples/policyworkflowpod.yaml
  - deploy/examples/runtrigger.yaml
  id: sc.deploy-examples
  intent: 'This context exists so the deploy/examples directory and the test-side
    registry that describes it are specified as one unit rather than as an untracked
    pile of YAML. The examples are the smoke-test fixtures for every custom resource
    the operator ships, so the specification pins three things at once: which ten
    manifests are present, which Kind/resource/schema each one maps to, and the invariant
    that the on-disk listing and the in-code listing stay in step. Anything that adds,
    renames or removes an example breaks the pairing, and the requirements below make
    that breakage explicit instead of silent.'
  interfaces:
  - file: test/integration/examples.go
    kind: function
    name: exampleByName
    signature: func exampleByName(file string) (example, bool)
  - file: test/integration/examples.go
    kind: function
    name: exampleFiles
    signature: func exampleFiles() []example
  - file: test/integration/examples.go
    kind: function
    name: exampleFilesOnDisk
    signature: func exampleFilesOnDisk() ([]string, error)
  name: deploy-examples
  requirements:
  - codeRefs:
    - file:deploy/examples/deno-job.yaml
    id: r.deno-job-kind
    level: MUST
    text: deno-job.yaml instantiates Kind DenoJob, resource denojobs, checked against
      denojob-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/deno-pod.yaml
    id: r.deno-pod-kind
    level: MUST
    text: deno-pod.yaml instantiates Kind DenoPod, resource denopods, checked against
      denopod-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/deno-run.yaml
    id: r.deno-run-kind
    level: MUST
    text: deno-run.yaml instantiates Kind DenoRun, resource denoruns, checked against
      denorun-apiresourceschema.yaml.
  - id: r.disk-listing-yaml-only-sorted
    level: MUST
    text: exampleFilesOnDisk reads the local examples directory, skips subdirectories
      and every entry that is not a .yaml file, and returns the surviving names sorted.
  - id: r.examples-are-fixtures
    level: SHOULD
    text: Every manifest in deploy/examples is referenced by the integration registry,
      so the directory holds no manifest that the suite does not validate.
  - id: r.lookup-by-file-name
    level: MUST
    text: exampleByName returns the registry entry matching a given file name and
      reports false when no entry matches, so an unknown example is a lookup miss
      and not a zero value.
  - codeRefs:
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
    id: r.one-kind-many-examples
    level: SHOULD
    text: DenoPod is exercised by three separate manifests (deno-pod.yaml, native-fire-pod.yaml,
      openbao-tls-pod.yaml) so a single Kind is covered by more than one configuration.
  - codeRefs:
    - file:deploy/examples/openbao.yaml
    id: r.openbao-kind
    level: MUST
    text: openbao.yaml instantiates Kind OpenBao, resource openbaos, checked against
      openbao-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policy-workflow-run.yaml
    id: r.policy-workflow-run-kind
    level: MUST
    text: policy-workflow-run.yaml instantiates Kind PolicyWorkflowRun, resource policyworkflowruns,
      checked against policyworkflowrun-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policyengine.yaml
    id: r.policyengine-kind
    level: MUST
    text: policyengine.yaml instantiates Kind PolicyEngine, resource policyengines,
      checked against policyengine-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policyworkflowpod.yaml
    id: r.policyworkflowpod-kind
    level: MUST
    text: policyworkflowpod.yaml instantiates Kind PolicyWorkflowPod, resource policyworkflowpods,
      checked against policyworkflowpod-apiresourceschema.yaml.
  - id: r.registry-enumerates-examples
    level: MUST
    text: exampleFiles returns the registry of all ten examples in a fixed order,
      each entry carrying File, Kind, Resource and Schema.
  - id: r.registry-matches-disk
    level: MUST
    text: The names returned by exampleFilesOnDisk equal the set of File fields in
      exampleFiles, so adding or removing a manifest on disk without updating the
      registry fails the integration suite.
  - codeRefs:
    - file:deploy/examples/runtrigger.yaml
    id: r.runtrigger-kind
    level: MUST
    text: runtrigger.yaml instantiates Kind RunTrigger, resource runtriggers, checked
      against runtrigger-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/native-fire-pod.yaml
    id: r.second-deno-pod-kind
    level: MUST
    text: native-fire-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, demonstrating the same kind with a different
      runtime path.
  - codeRefs:
    - file:deploy/examples/deno-job.yaml
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/deno-run.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
    - file:deploy/examples/openbao.yaml
    - file:deploy/examples/policy-workflow-run.yaml
    - file:deploy/examples/policyengine.yaml
    - file:deploy/examples/policyworkflowpod.yaml
    - file:deploy/examples/runtrigger.yaml
    id: r.ten-example-manifests
    level: MUST
    text: 'deploy/examples contains exactly ten YAML manifests: deno-job.yaml, deno-pod.yaml,
      deno-run.yaml, native-fire-pod.yaml, openbao-tls-pod.yaml, openbao.yaml, policy-workflow-run.yaml,
      policyengine.yaml, policyworkflowpod.yaml and runtrigger.yaml.'
  - codeRefs:
    - file:deploy/examples/openbao-tls-pod.yaml
    id: r.third-deno-pod-kind
    level: MUST
    text: openbao-tls-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, showing the pod wired to OpenBao over
      TLS.
  upstream: self
- code:
  - deploy/examples/atproto/market/00-workspaces.yaml
  - deploy/examples/atproto/market/10-rbac.yaml
  - deploy/examples/atproto/market/15-openbao-alice.yaml
  - deploy/examples/atproto/market/15-openbao-global.yaml
  - deploy/examples/atproto/market/15-openbao-relay.yaml
  - deploy/examples/atproto/market/20-global-plc.yaml
  - deploy/examples/atproto/market/30-relay-relay.yaml
  - deploy/examples/atproto/market/40-alice-pds.yaml
  - deploy/examples/atproto/market/50-verifier.yaml
  id: sc.deploy-examples-atproto-market
  intent: 'This context exists to pin down the deploy/examples/atproto/market example
    as an executable specification of what the kcp deno runtime must support: three
    peer services that reach each other only by cluster-local name over TLS, with
    identity and certificates supplied from outside the pod. It is the reference topology
    that exercises workspace creation, per-workspace API bindings, per-workspace RBAC,
    per-workspace OpenBao certificate authority selection, the provider''s virtual
    DNS table and shim, and the TLS leaf injection path, and it exists so that a regression
    in any of those surfaces shows up as a failing verifier pod rather than as an
    untested assumption in the provider.'
  interfaces:
  - file: .tools/open-architecture/validate.py
    kind: variable
    name: MARKET_WORKSPACES
    signature: MARKET_WORKSPACES = "deploy/examples/atproto/market/00-workspaces.yaml"
  - file: test/integration/examples.go
    kind: function
    name: exampleByName
    signature: func exampleByName(file string) (example, bool)
  - file: test/integration/examples.go
    kind: function
    name: exampleFiles
    signature: func exampleFiles() []example
  name: deploy-examples-atproto-market
  requirements:
  - codeRefs:
    - file:deploy/examples/atproto/market/15-openbao-alice.yaml
    - file:deploy/examples/atproto/market/15-openbao-global.yaml
    - file:deploy/examples/atproto/market/15-openbao-relay.yaml
    id: r.openbao-object-per-workspace
    level: MUST
    text: 'Each workspace applies one OpenBao object named openbao in namespace default,
      carrying the finalizer openbao.deno.computer/namespace and naming the OpenBao
      namespace that serves it: global.default, relay.default and alice.default respectively.'
  - codeRefs:
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.pds-pod
    level: MUST
    text: The alice workspace runs DenoPod pds under the deno-runner service account
      with restartPolicy Always, SERVICE_TLS true, --unstable-kv in SERVICE_DENO_FLAGS,
      port 2583, PDS_PUBLIC_HOSTNAME pds.default.alice.svc.kcp.local, PDS_PLC_DIRECTORY_URL
      pointed at the global PLC name, PDS_CRAWLERS pointed at the relay name, and
      PDS_PRIVATE_KEY_HEX in SERVICE_ENV.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    id: r.plc-directory-pod
    level: MUST
    text: The global workspace runs DenoPod plc with restartPolicy Always, the denopod.deno.computer/run
      finalizer, SERVICE_TLS true, port 2587, and a readiness probe that resolves
      plc.default.global.svc.kcp.local and requests /health.
  - codeRefs:
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    id: r.relay-pod
    level: MUST
    text: The relay workspace runs DenoPod relay with restartPolicy Always, SERVICE_TLS
      true, HOSTNAME relay.default.relay.svc.kcp.local on port 2584, and a readiness
      probe that resolves relay.default.relay.svc.kcp.local and requests /xrpc/_health.
  - codeRefs:
    - file:deploy/examples/atproto/market/10-rbac.yaml
    id: r.runner-rbac-reads-denopods
    level: MUST
    text: The example creates a ServiceAccount named deno-runner in namespace default,
      a ClusterRole named deno-runner-read-pods granting get and list on deno.computer
      denopods, and a ClusterRoleBinding of that role to that ServiceAccount.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.supervisor-env-allowlist
    level: MUST
    text: Every service pod's env allowList admits the shim's keys (SERVICE_*, KCP_SHIM,
      KCP_TLS_CERT, KCP_TLS_KEY, KCP_CA_BUNDLE, KCP_SERVICE_NAME, KCP_SERVICE_DOMAIN,
      KCP_DNS_TABLE, KCP_TOKENS, KCP_SERVER, KCP_NAMESPACE, PATH, HOME) and its write
      allowList admits only result.json, tls.crt, tls.key and ca.pem, with read and
      run allowed and noPrompt true.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.supervisor-injects-tls-and-shim
    level: MUST
    text: The service pods' supervisor script writes the injected KCP_CA_BUNDLE to
      ca.pem and sets DENO_CERT to it, writes KCP_TLS_CERT and KCP_TLS_KEY to tls.crt
      and tls.key and appends --tls-cert-file and --tls-key-file to the child argv,
      prepends KCP_SHIM to the Deno flags as --preload, spawns the entry module as
      a child process with stdin null and inherited stdio, and writes the child exitCode
      to result.json.
  - codeRefs:
    - file:deploy/examples/atproto/market/00-workspaces.yaml
    id: r.three-workspaces-at-root
    level: MUST
    text: The example creates exactly the three workspaces global, relay and alice,
      each with spec.type.name denoruntime and spec.type.path root.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-bounded-wait
    level: MUST
    text: The verifier's relay watch settles exactly once, with a 90 second timeout,
      closing the WebSocket on settle and reporting error or closed instead of hanging.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-end-to-end-check
    level: MUST
    text: The alice workspace runs DenoPod verifier with restartPolicy Never, importing
      KCP_SHIM before anything else, creating an account on VERIFY_PDS, reading the
      returned DID back from VERIFY_PLC, making a first write so the PDS announces
      itself, then writing a second record while watching VERIFY_RELAY's subscribeRepos
      WebSocket, and exiting 0 only when plcStatus is 200, gotAccessJwt is yes and
      relaySawCommit is yes.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-judges-decode-frames
    level: SHOULD
    text: The verifier treats relay frames as bytes, decoding ArrayBuffer and Blob
      payloads with TextDecoder before searching for its own DID, because the relay
      emits DRISL where a CBOR string is its bytes verbatim.
  upstream: self
- code:
  - internal/baoembed/cmd/baoembed/main.go
  id: sc.internal-baoembed-cmd-baoembed
  intent: 'This context exists to give the repository''s integration tests and developers
    a runnable OpenBao server without an external install. The `test/integration`
    helpers build this package (see `baoembedBinary`, which runs `go build -o bin
    ./cmd/baoembed` with its working directory at `internal/baoembed`) and start it
    with `startProcess`, which launches the binary with stdout and stderr redirected
    into a log file and a new process group. Because the tests need to know when the
    server is up and, under TLS, which CA to trust, the command''s contract is its
    readiness line: everything here is shaped around emitting `BAOEMBED <url>` (with
    the CA path when TLS is on) only after the embedded server accepts connections,
    and around accepting its configuration from flags with environment fallbacks so
    a test can drive it either way.'
  name: internal-baoembed-cmd-baoembed
  requirements:
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.flag-env-fallbacks
    level: MUST
    text: 'Each configuration value is taken from a flag that falls back to an environment
      variable: `-addr` from `BAOEMBED_ADDR` defaulting to `127.0.0.1:8200`, `-root-token`
      from `BAOEMBED_ROOT_TOKEN` defaulting to `root`, `-tls` from `BAOEMBED_TLS`
      being `1`, and `-tls-dir` from `BAOEMBED_TLS_DIR` defaulting to empty.'
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.poll-until-server-answers
    level: MUST
    text: The command polls the server address on a fixed interval rather than trusting
      an address the server reports, and only emits the readiness line once the embedded
      server accepts connections.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.readiness-line-prefix
    level: MUST
    text: The command signals readiness by printing a line that begins with the constant
      `readyPrefix`, whose value is "BAOEMBED ".
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.root-token-export
    level: MUST
    text: 'The command sets the environment variable `BAO_DEV_ROOT_TOKEN_ID` to the
      configured root token before starting the embedded server; if `os.Setenv` fails
      it writes `baoembed: setting the root token: %v` to stderr and exits with status
      1.'
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.serve-before-ready
    level: MUST
    text: The command is a `main` package entry point invoked as `main`, so it starts
      the embedded OpenBao development server on the configured address and holds
      it running rather than returning.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.test-build-and-start
    level: SHOULD
    text: Integration tests build this command once (cached behind a `sync.Once`)
      by running `go build -o bin ./cmd/baoembed` with its working directory set to
      `internal/baoembed`, and gate the run on `livegate.Require` when the build fails.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.tls-ca-path-in-ready-line
    level: MUST
    text: In TLS mode the command serves `https` and the readiness line reports the
      generated CA certificate path, formed by joining the TLS directory with `devTLSCAFile`;
      without TLS the scheme is `http` and no CA path is reported.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.tls-mode-cert-directory
    level: MUST
    text: 'In TLS mode the command uses the given TLS directory, or creates a fresh
      temporary directory when none is given, then calls `os.MkdirAll` with mode `0o700`
      because OpenBao refuses a certificate directory that does not exist; a failure
      writes `baoembed: making the certificate directory %s: %v` to stderr and exits
      with status 1.'
  upstream: self
