  id: sc.deploy-examples
  intent: 'This context exists so the deploy/examples directory and the test-side
    registry that describes it are specified as one unit rather than as an untracked
    pile of YAML. The examples are the smoke-test fixtures for every custom resource
    the operator ships, so the specification pins three things at once: which ten
    manifests are present, which Kind/resource/schema each one maps to, and the invariant
    that the on-disk listing and the in-code listing stay in step. Anything that adds,
    renames or removes an example breaks the pairing, and the requirements below make
    that breakage explicit instead of silent.'
  interfaces:
  - file: test/integration/examples.go
    kind: function
    name: exampleByName
    signature: func exampleByName(file string) (example, bool)
  - file: test/integration/examples.go
    kind: function
    name: exampleFiles
    signature: func exampleFiles() []example
  - file: test/integration/examples.go
    kind: function
    name: exampleFilesOnDisk
    signature: func exampleFilesOnDisk() ([]string, error)
  name: deploy-examples
  requirements:
  - codeRefs:
    - file:deploy/examples/deno-job.yaml
    id: r.deno-job-kind
    level: MUST
    text: deno-job.yaml instantiates Kind DenoJob, resource denojobs, checked against
      denojob-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/deno-pod.yaml
    id: r.deno-pod-kind
    level: MUST
    text: deno-pod.yaml instantiates Kind DenoPod, resource denopods, checked against
      denopod-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/deno-run.yaml
    id: r.deno-run-kind
    level: MUST
    text: deno-run.yaml instantiates Kind DenoRun, resource denoruns, checked against
      denorun-apiresourceschema.yaml.
  - id: r.disk-listing-yaml-only-sorted
    level: MUST
    text: exampleFilesOnDisk reads the local examples directory, skips subdirectories
      and every entry that is not a .yaml file, and returns the surviving names sorted.
  - id: r.examples-are-fixtures
    level: SHOULD
    text: Every manifest in deploy/examples is referenced by the integration registry,
      so the directory holds no manifest that the suite does not validate.
  - id: r.lookup-by-file-name
    level: MUST
    text: exampleByName returns the registry entry matching a given file name and
      reports false when no entry matches, so an unknown example is a lookup miss
      and not a zero value.
  - codeRefs:
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
    id: r.one-kind-many-examples
    level: SHOULD
    text: DenoPod is exercised by three separate manifests (deno-pod.yaml, native-fire-pod.yaml,
      openbao-tls-pod.yaml) so a single Kind is covered by more than one configuration.
  - codeRefs:
    - file:deploy/examples/openbao.yaml
    id: r.openbao-kind
    level: MUST
    text: openbao.yaml instantiates Kind OpenBao, resource openbaos, checked against
      openbao-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policy-workflow-run.yaml
    id: r.policy-workflow-run-kind
    level: MUST
    text: policy-workflow-run.yaml instantiates Kind PolicyWorkflowRun, resource policyworkflowruns,
      checked against policyworkflowrun-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policyengine.yaml
    id: r.policyengine-kind
    level: MUST
    text: policyengine.yaml instantiates Kind PolicyEngine, resource policyengines,
      checked against policyengine-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/policyworkflowpod.yaml
    id: r.policyworkflowpod-kind
    level: MUST
    text: policyworkflowpod.yaml instantiates Kind PolicyWorkflowPod, resource policyworkflowpods,
      checked against policyworkflowpod-apiresourceschema.yaml.
  - id: r.registry-enumerates-examples
    level: MUST
    text: exampleFiles returns the registry of all ten examples in a fixed order,
      each entry carrying File, Kind, Resource and Schema.
  - id: r.registry-matches-disk
    level: MUST
    text: The names returned by exampleFilesOnDisk equal the set of File fields in
      exampleFiles, so adding or removing a manifest on disk without updating the
      registry fails the integration suite.
  - codeRefs:
    - file:deploy/examples/runtrigger.yaml
    id: r.runtrigger-kind
    level: MUST
    text: runtrigger.yaml instantiates Kind RunTrigger, resource runtriggers, checked
      against runtrigger-apiresourceschema.yaml.
  - codeRefs:
    - file:deploy/examples/native-fire-pod.yaml
    id: r.second-deno-pod-kind
    level: MUST
    text: native-fire-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, demonstrating the same kind with a different
      runtime path.
  - codeRefs:
    - file:deploy/examples/deno-job.yaml
    - file:deploy/examples/deno-pod.yaml
    - file:deploy/examples/deno-run.yaml
    - file:deploy/examples/native-fire-pod.yaml
    - file:deploy/examples/openbao-tls-pod.yaml
    - file:deploy/examples/openbao.yaml
    - file:deploy/examples/policy-workflow-run.yaml
    - file:deploy/examples/policyengine.yaml
    - file:deploy/examples/policyworkflowpod.yaml
    - file:deploy/examples/runtrigger.yaml
    id: r.ten-example-manifests
    level: MUST
    text: 'deploy/examples contains exactly ten YAML manifests: deno-job.yaml, deno-pod.yaml,
      deno-run.yaml, native-fire-pod.yaml, openbao-tls-pod.yaml, openbao.yaml, policy-workflow-run.yaml,
      policyengine.yaml, policyworkflowpod.yaml and runtrigger.yaml.'
  - codeRefs:
    - file:deploy/examples/openbao-tls-pod.yaml
    id: r.third-deno-pod-kind
    level: MUST
    text: openbao-tls-pod.yaml also instantiates Kind DenoPod, resource denopods,
      against denopod-apiresourceschema.yaml, showing the pod wired to OpenBao over
      TLS.
  upstream: self
- code:
  - deploy/examples/atproto/market/00-workspaces.yaml
  - deploy/examples/atproto/market/10-rbac.yaml
  - deploy/examples/atproto/market/15-openbao-alice.yaml
  - deploy/examples/atproto/market/15-openbao-bob.yaml
  - deploy/examples/atproto/market/15-openbao-global.yaml
  - deploy/examples/atproto/market/15-openbao-relay.yaml
  - deploy/examples/atproto/market/20-global-plc.yaml
  - deploy/examples/atproto/market/30-relay-relay.yaml
  - deploy/examples/atproto/market/40-alice-pds.yaml
  - deploy/examples/atproto/market/50-verifier.yaml
  - deploy/examples/atproto/market/60-bob-pds.yaml
  - deploy/examples/atproto/market/70-bidder.yaml
  id: sc.deploy-examples-atproto-market
  intent: 'This context exists to pin down the deploy/examples/atproto/market example
    as an executable specification of what the kcp deno runtime must support: peer
    services that reach each other only by cluster-local name over TLS, with identity
    and certificates supplied from outside the pod, and a market bidder that reaches
    those same peers the same way. It is the reference topology that exercises workspace
    creation, per-workspace API bindings, per-workspace RBAC, per-workspace OpenBao
    certificate authority selection, the provider''s virtual DNS table and shim, and
    the TLS leaf injection path, and it exists so that a regression in any of those
    surfaces shows up as a failing verifier pod rather than as an untested assumption
    in the provider. The example carries its own live acceptance, accept.sh, so that
    it is proven by bringing the whole topology up and reaching it, not only by decoding
    its manifests and fitting them to the schemas.'
  interfaces:
  - file: .tools/open-architecture/validate.py
    kind: variable
    name: MARKET_WORKSPACES
    signature: MARKET_WORKSPACES = "deploy/examples/atproto/market/00-workspaces.yaml"
  - file: test/integration/examples.go
    kind: function
    name: exampleByName
    signature: func exampleByName(file string) (example, bool)
  - file: test/integration/examples.go
    kind: function
    name: exampleFiles
    signature: func exampleFiles() []example
  name: deploy-examples-atproto-market
  requirements:
  - codeRefs:
    - file:deploy/examples/atproto/market/apply.sh
    id: r.apply-includes-bob-and-bidder
    level: MUST
    text: apply.sh names the workspaces global relay alice bob, requires atproto-market/hono-bidder
      (as well as hono-plc, hono-atproto-relay and hono-pds) in its preflight check,
      generates a PDS key for bob and a key for the bidder, each distinct from alice's
      and each overridable by BOB_PDS_PRIVATE_KEY_HEX and BIDDER_PRIVATE_KEY_HEX,
      substitutes them for __BOB_PDS_PRIVATE_KEY_HEX__ and __BIDDER_PRIVATE_KEY_HEX__,
      applies 15-openbao-bob.yaml with the other authorities, applies 60-bob-pds.yaml
      before 70-bidder.yaml, and reports the phase and readiness of both pds and bidder
      in its final summary.
  - codeRefs:
    - file:.tools/open-architecture/arch.yaml
    id: r.arch-data-lists-bob
    level: SHOULD
    text: The open-architecture overlay data ov.market-workspaces in .tools/open-architecture/arch.yaml
      lists root:bob alongside root:global, root:relay and root:alice, so validate.py
      and 00-workspaces.yaml agree.
  - codeRefs:
    - file:deploy/examples/atproto/market/70-bidder.yaml
    id: r.bidder-pod
    level: MUST
    text: 'The bob workspace runs DenoPod bidder in namespace default under the deno-runner
      service account with restartPolicy Always, the denopod.deno.computer/run finalizer,
      SERVICE_ENTRY <ORG_ROOT>/atproto-market/hono-bidder/mod.ts (apply.sh rewrites
      the /home/johnandersen777/src/publicdomainrelay-kcp prefix), SERVICE_CWD <ORG_ROOT>/atproto-market,
      SERVICE_ARGS ["--serve-addr","127.0.0.1","--serve-port","2586","--plc-directory-url","https://plc.default.global.svc.kcp.local","--relay-url","https://relay.default.relay.svc.kcp.local","--skip-qr","--no-ingress-proxy","--compute-provider-deno-worker"]
      (the deno-worker compute provider is the only one that needs no cloud credential),
      SERVICE_DENO_FLAGS ["--unstable-kv"], SERVICE_TLS true, SERVICE_ENV {"PORT":"2586","HOSTNAME":"127.0.0.1","REPO_PRIVATE_KEY_HEX":"__BIDDER_PRIVATE_KEY_HEX__"}
      (PORT and HOSTNAME are what the provider advertises for bidder.default.bob.svc.kcp.local,
      because the bidder names its listener --serve-port and the name table only reads
      --port or PORT), and a readiness probe that resolves bidder.default.bob.svc.kcp.local
      and requests /oauth-client-metadata.json. It lives in root:bob because it is
      bob''s market participant: it shares bob''s OpenBao authority, service account
      and workspace identity with bob''s PDS and reaches the market through the same
      virtual DNS table.'
  - codeRefs:
    - file:deploy/examples/atproto/market/70-bidder.yaml
    id: r.bidder-supervisor-script
    level: MUST
    text: 'The bidder pod''s script writes the injected KCP_CA_BUNDLE to ca.pem and
      sets DENO_CERT to it, prepends KCP_SHIM to the Deno flags as --preload, spawns
      the entry module as a child process with stdin null and inherited stdio, and
      writes the child exitCode to result.json. It must NOT write tls.crt or tls.key
      and must NOT append --tls-cert-file or --tls-key-file to the child argv: hono-bidder''s
      cli-args-env declares no such options and its parser rejects unknown flags,
      so the bidder consumes only the trust bundle even though SERVICE_TLS is true.'
  - codeRefs:
    - file:deploy/examples/atproto/market/60-bob-pds.yaml
    id: r.bob-pds-pod
    level: MUST
    text: 'The bob workspace runs DenoPod pds in namespace default under the deno-runner
      service account with restartPolicy Always, the denopod.deno.computer/run finalizer,
      SERVICE_TLS true, --unstable-kv in SERVICE_DENO_FLAGS, port 2585 (which collides
      with no other service: alice uses 2583, the relay 2584 and the PLC 2587), PDS_PUBLIC_HOSTNAME
      pds.default.bob.svc.kcp.local, PDS_PLC_DIRECTORY_URL pointed at the global PLC
      name, PDS_CRAWLERS pointed at the relay name, PDS_SUBSCRIBE_REPOS_FORMAT json,
      and PDS_PRIVATE_KEY_HEX in SERVICE_ENV as a key distinct from alice''s (__BOB_PDS_PRIVATE_KEY_HEX__),
      so the two PDS identities differ.'
  - codeRefs:
    - file:deploy/examples/atproto/market/00-workspaces.yaml
    id: r.four-workspaces-at-root
    level: MUST
    text: The example creates exactly the four workspaces global, relay, alice and
      bob, each with spec.type.name denoruntime and spec.type.path root.
  - codeRefs:
    - file:deploy/examples/atproto/market/apply.sh
    id: r.live-acceptance-script
    level: MUST
    text: 'deploy/examples/atproto/market/accept.sh is the live acceptance of this
      example: it brings the whole market up in a throwaway state directory and exits
      non-zero unless every workload is up and reachable. It is bash with set -euo
      pipefail; ACCEPT_ROOT (default a fresh mktemp -d) is the one directory it owns,
      and an EXIT trap stops everything it started and removes that directory. It
      never stops or touches a kcp, kine or OpenBao it did not start. It asks the
      kernel for three free 127.0.0.1 ports, for kcp, kine and OpenBao, instead of
      pinning any, so it cannot collide with another instance on the machine. It starts
      kcp with ROOT=$ACCEPT_ROOT/kcp and KCP_SECURE_PORT and KINE_ENDPOINT set to
      two of those ports through deploy/start-kcp.sh; installs the provider with KUBECONFIG_PATH=$ACCEPT_ROOT/kcp/admin.kubeconfig
      through deploy/install-provider.sh; builds ./cmd/deno-kcp-provider into $ACCEPT_ROOT;
      starts OpenBao with OPENBAO_DIR=$ACCEPT_ROOT/openbao and OPENBAO_LISTEN on the
      third port through deploy/start-openbao.sh; and runs the provider with --kubeconfig,
      --openbao-addr http://<openbao port>, --openbao-token root and RUNS_DIR=$ACCEPT_ROOT/runs.
      It then runs deploy/examples/atproto/market/apply.sh with ORG_ROOT the repository
      parent, KUBECONFIG the kcp admin kubeconfig, OPENBAO_LISTEN the same address,
      START_OPENBAO=0, a bounded WAIT_SECONDS, and KEY_FILE, BOB_KEY_FILE and BIDDER_KEY_FILE
      under $ACCEPT_ROOT. When apply.sh returns, whether it succeeded or not, accept.sh
      reads every DenoPod from kcp with kubectl and prints one line per check, each
      with its result and the decisive evidence: apply.sh exited 0; DenoPod plc in
      root:global, relay in root:relay, pds in root:alice, pds in root:bob and bidder
      in root:bob each reached phase Running and report ready true; DenoPod verifier
      in root:alice reached the terminal phase Succeeded; bob pds answers on its own
      name, which the provider proves with its readiness probe through the shim (kcpdns
      pds.default.bob.svc.kcp.local /xrpc/_health) and the host proves by fetching
      the same path from outside with curl https://127.0.0.1:2585/xrpc/_health; the
      bidder answers on bidder.default.bob.svc.kcp.local /oauth-client-metadata.json
      and on https://127.0.0.1:2586/oauth-client-metadata.json. Both host checks use
      https, because every service pod sets SERVICE_TLS true and the provider issues
      it a leaf, so the listener the host reaches is the TLS one; an http:// fetch
      of a TLS listener is not a check of anything and must not be written. http_code
      reports the status curl printed, and prints 000 exactly once when the fetch
      failed rather than appending a second fallback. And the five long-running pods
      are still Running with ready true when they are read a second time at least
      ten seconds later, so a pod that dies after startup fails the run. It prints
      a final table naming every check and its result, prints the tail of the provider
      log and the status of the failing pod when a check fails, and exits 0 only when
      every check passed.'
  - codeRefs:
    - file:deploy/examples/atproto/market/15-openbao-alice.yaml
    - file:deploy/examples/atproto/market/15-openbao-bob.yaml
    - file:deploy/examples/atproto/market/15-openbao-global.yaml
    - file:deploy/examples/atproto/market/15-openbao-relay.yaml
    id: r.openbao-object-per-workspace
    level: MUST
    text: 'Each workspace applies one OpenBao object named openbao in namespace default,
      carrying the finalizer openbao.deno.computer/namespace and naming the OpenBao
      namespace that serves it: global.default, relay.default, alice.default and bob.default
      respectively.'
  - codeRefs:
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.pds-pod
    level: MUST
    text: The alice workspace runs DenoPod pds under the deno-runner service account
      with restartPolicy Always, SERVICE_TLS true, --unstable-kv in SERVICE_DENO_FLAGS,
      port 2583, PDS_PUBLIC_HOSTNAME pds.default.alice.svc.kcp.local, PDS_PLC_DIRECTORY_URL
      pointed at the global PLC name, PDS_CRAWLERS pointed at the relay name, and
      PDS_PRIVATE_KEY_HEX in SERVICE_ENV.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    id: r.plc-directory-pod
    level: MUST
    text: The global workspace runs DenoPod plc with restartPolicy Always, the denopod.deno.computer/run
      finalizer, SERVICE_TLS true, port 2587, and a readiness probe that resolves
      plc.default.global.svc.kcp.local and requests /health.
  - codeRefs:
    - file:deploy/examples/atproto/market/10-rbac.yaml
    - file:deploy/examples/atproto/market/apply.sh
    id: r.rbac-covers-bob
    level: MUST
    text: apply.sh applies 10-rbac.yaml in root:bob as it does in every workspace,
      and every DenoPod in bob (pds and bidder) names the deno-runner service account.
      No new ClusterRole is added, because deno-runner-read-pods already grants get
      and list on denopods.
  - codeRefs:
    - file:deploy/examples/atproto/market/README.md
    id: r.readme-lists-bob-and-bidder
    level: MUST
    text: README.md's service table adds root:bob DenoPod/pds (hono-pds, port 2585,
      pds.default.bob.svc.kcp.local) and root:bob DenoPod/bidder (hono-bidder, port
      2586, bidder.default.bob.svc.kcp.local), its OpenBao table adds root:bob OpenBao/openbao
      bob.default (15-openbao-bob.yaml), its prose says four workspaces, and its ceilings
      note that the bidder registers with an XRPC dispatcher, so it needs one reachable.
  - codeRefs:
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    id: r.relay-pod
    level: MUST
    text: The relay workspace runs DenoPod relay with restartPolicy Always, SERVICE_TLS
      true, HOSTNAME relay.default.relay.svc.kcp.local on port 2584, and a readiness
      probe that resolves relay.default.relay.svc.kcp.local and requests /xrpc/_health.
  - codeRefs:
    - file:deploy/examples/atproto/market/10-rbac.yaml
    id: r.runner-rbac-reads-denopods
    level: MUST
    text: The example creates a ServiceAccount named deno-runner in namespace default,
      a ClusterRole named deno-runner-read-pods granting get and list on deno.computer
      denopods, and a ClusterRoleBinding of that role to that ServiceAccount.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.supervisor-env-allowlist
    level: MUST
    text: Every service pod's env allowList admits the shim's keys (SERVICE_*, KCP_SHIM,
      KCP_TLS_CERT, KCP_TLS_KEY, KCP_CA_BUNDLE, KCP_SERVICE_NAME, KCP_SERVICE_DOMAIN,
      KCP_DNS_TABLE, KCP_TOKENS, KCP_SERVER, KCP_NAMESPACE, PATH, HOME) and its write
      allowList admits only result.json, tls.crt, tls.key and ca.pem, with read and
      run allowed and noPrompt true.
  - codeRefs:
    - file:deploy/examples/atproto/market/20-global-plc.yaml
    - file:deploy/examples/atproto/market/30-relay-relay.yaml
    - file:deploy/examples/atproto/market/40-alice-pds.yaml
    id: r.supervisor-injects-tls-and-shim
    level: MUST
    text: The service pods' supervisor script writes the injected KCP_CA_BUNDLE to
      ca.pem and sets DENO_CERT to it, writes KCP_TLS_CERT and KCP_TLS_KEY to tls.crt
      and tls.key and appends --tls-cert-file and --tls-key-file to the child argv,
      prepends KCP_SHIM to the Deno flags as --preload, spawns the entry module as
      a child process with stdin null and inherited stdio, and writes the child exitCode
      to result.json.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-bounded-wait
    level: MUST
    text: The verifier's relay watch settles exactly once, with a 90 second timeout,
      closing the WebSocket on settle and reporting error or closed instead of hanging.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-end-to-end-check
    level: MUST
    text: The alice workspace runs DenoPod verifier with restartPolicy Never, importing
      KCP_SHIM before anything else, creating an account on VERIFY_PDS, reading the
      returned DID back from VERIFY_PLC, making a first write so the PDS announces
      itself, then writing a second record while watching VERIFY_RELAY's subscribeRepos
      WebSocket, and exiting 0 only when plcStatus is 200, gotAccessJwt is yes and
      relaySawCommit is yes.
  - codeRefs:
    - file:deploy/examples/atproto/market/50-verifier.yaml
    id: r.verifier-judges-decode-frames
    level: SHOULD
    text: The verifier treats relay frames as bytes, decoding ArrayBuffer and Blob
      payloads with TextDecoder before searching for its own DID, because the relay
      emits DRISL where a CBOR string is its bytes verbatim.
  upstream: self
- code:
  - internal/baoembed/cmd/baoembed/main.go
  id: sc.internal-baoembed-cmd-baoembed
  intent: 'This context exists to give the repository''s integration tests and developers
    a runnable OpenBao server without an external install. The `test/integration`
    helpers build this package (see `baoembedBinary`, which runs `go build -o bin
    ./cmd/baoembed` with its working directory at `internal/baoembed`) and start it
    with `startProcess`, which launches the binary with stdout and stderr redirected
    into a log file and a new process group. Because the tests need to know when the
    server is up and, under TLS, which CA to trust, the command''s contract is its
    readiness line: everything here is shaped around emitting `BAOEMBED <url>` (with
    the CA path when TLS is on) only after the embedded server accepts connections,
    and around accepting its configuration from flags with environment fallbacks so
    a test can drive it either way.'
  name: internal-baoembed-cmd-baoembed
  requirements:
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.flag-env-fallbacks
    level: MUST
    text: 'Each configuration value is taken from a flag that falls back to an environment
      variable: `-addr` from `BAOEMBED_ADDR` defaulting to `127.0.0.1:8200`, `-root-token`
      from `BAOEMBED_ROOT_TOKEN` defaulting to `root`, `-tls` from `BAOEMBED_TLS`
      being `1`, and `-tls-dir` from `BAOEMBED_TLS_DIR` defaulting to empty.'
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.poll-until-server-answers
    level: MUST
    text: The command polls the server address on a fixed interval rather than trusting
      an address the server reports, and only emits the readiness line once the embedded
      server accepts connections.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.readiness-line-prefix
    level: MUST
    text: The command signals readiness by printing a line that begins with the constant
      `readyPrefix`, whose value is "BAOEMBED ".
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.root-token-export
    level: MUST
    text: 'The command sets the environment variable `BAO_DEV_ROOT_TOKEN_ID` to the
      configured root token before starting the embedded server; if `os.Setenv` fails
      it writes `baoembed: setting the root token: %v` to stderr and exits with status
      1.'
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.serve-before-ready
    level: MUST
    text: The command is a `main` package entry point invoked as `main`, so it starts
      the embedded OpenBao development server on the configured address and holds
      it running rather than returning.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.test-build-and-start
    level: SHOULD
    text: Integration tests build this command once (cached behind a `sync.Once`)
      by running `go build -o bin ./cmd/baoembed` with its working directory set to
      `internal/baoembed`, and gate the run on `livegate.Require` when the build fails.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.tls-ca-path-in-ready-line
    level: MUST
    text: In TLS mode the command serves `https` and the readiness line reports the
      generated CA certificate path, formed by joining the TLS directory with `devTLSCAFile`;
      without TLS the scheme is `http` and no CA path is reported.
  - codeRefs:
    - file:internal/baoembed/cmd/baoembed/main.go
    id: r.tls-mode-cert-directory
    level: MUST
    text: 'In TLS mode the command uses the given TLS directory, or creates a fresh
      temporary directory when none is given, then calls `os.MkdirAll` with mode `0o700`
      because OpenBao refuses a certificate directory that does not exist; a failure
      writes `baoembed: making the certificate directory %s: %v` to stderr and exits
      with status 1.'
  upstream: self
- code:
  - internal/denojob/denojob.go
  - internal/denojob/denojob_test.go
  id: sc.internal-denojob
  intent: 'This context exists to fix the contract of the DenoJob decider: the inputs
    it reads (Observed plus Options) and the plan it emits (Result), separate from
    any Kubernetes client work. It is the place where job semantics — run creation,
    parallelism, completion counts, backoff and retries, suspension, deadlines, TTL
    deletion — are decided as a pure function so the provider can apply the result,
    and so the behaviour is testable by handing Reconcile an Observed and checking
    the Result. The tests in denojob_test.go are the executable statement of that
    contract.'
  interfaces:
  - file: internal/denojob/denojob.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/denojob/denojob.go
    kind: struct
    name: Observed
  - file: internal/denojob/denojob.go
    kind: struct
    name: Options
  - file: internal/denojob/denojob.go
    kind: struct
    name: Reconciler
  - file: internal/denojob/denojob.go
    kind: method
    name: Reconciler.Reconcile
    signature: func (r *Reconciler) Reconcile(ctx context.Context, o Observed) (Result,
      error)
  - file: internal/denojob/denojob.go
    kind: struct
    name: Result
  - file: internal/denojob/denojob.go
    kind: struct
    name: RunObservation
  name: internal-denojob
  requirements:
  - codeRefs:
    - struct:0ba4feb0fbc5bf2cadab0956427bd073
    - struct:d14a57a215b6cff18c212b07ddfe93f7
    id: r.observed-carries-job-runs-and-now
    level: MUST
    text: 'Observed supplies the Decoded observed state: the v1alpha1.DenoJob, the
      slice of RunObservation for its runs, and the time the decision is made against.'
  - codeRefs:
    - method:609e5eaa8563a6ad1508b812aa5604b4
    - struct:0ba4feb0fbc5bf2cadab0956427bd073
    - struct:a76d5210541b3f0c4f0346477f21b1c1
    id: r.reconcile-is-a-pure-decision
    level: MUST
    text: Reconciler.Reconcile takes a context and an Observed snapshot and returns
      a Result plus an error; the Result is the complete plan for the job, so no Kubernetes
      client work happens inside the decider.
  - codeRefs:
    - function:0d2947cb5cecdc22a1eed7036e77229b
    - struct:8a80dd72dde5aa7fad20d4a2a56c0c77
    - struct:f9b27eae82ab32e2cb4cf25ca02b0e65
    id: r.reconciler-built-from-options
    level: MUST
    text: The decider is a Reconciler value that is constructed by New from an Options
      value; New returns a *Reconciler.
  - codeRefs:
    - file:internal/denojob/denojob.go
    - struct:a76d5210541b3f0c4f0346477f21b1c1
    id: r.result-is-the-job-plan
    level: MUST
    text: Result carries the DenoJobPhase, the observed run names, the single run
      name, the runs to create and to stop, start and completion times, the active,
      ready, succeeded, failed and retry counters, the exit code, the outputs map,
      the conditions, the requeue delay, and the delete flags for the job and for
      its runs.
  - codeRefs:
    - file:internal/denojob/denojob.go
    - struct:d14a57a215b6cff18c212b07ddfe93f7
    id: r.run-observation-reports-run-outcome
    level: MUST
    text: RunObservation reports one run by name with its v1alpha1.DenoRunPhase, an
      optional exit code, a message, and the run's outputs map.
  - codeRefs:
    - file:internal/denojob/denojob_test.go
    - struct:0ba4feb0fbc5bf2cadab0956427bd073
    - struct:a76d5210541b3f0c4f0346477f21b1c1
    id: r.tests-assert-the-decider-contract
    level: MUST
    text: denojob_test.go MUST reconcile constructed Observed values and assert on
      the returned Result, covering at least that an unstarted job creates one run
      and reports pending with active one, and that the job succeeds with its run's
      outputs once that run reaches DenoRunSucceeded.
  upstream: self
- code:
  - internal/denopod/denopod.go
  - internal/denopod/denopod_test.go
  id: sc.internal-denopod
  intent: This context exists so the DenoPod lifecycle can be specified and tested
    without a Kubernetes client or a live deno process. Reconcile is the single decision
    point that turns an observed pod plus its execution observation into a target
    state, and every branch is covered by internal/denopod/denopod_test.go, which
    drives the reconciler with table-style Observed values and asserts on the returned
    Result. The package mirrors the shape of internal/policyengine but adds exit-code
    and output capture, so the spec records the exact contract other reconcile loops
    in this repository follow.
  interfaces:
  - file: internal/denopod/denopod.go
    kind: struct
    name: ExecutionObservation
    signature: "type ExecutionObservation struct {\n\tRunID string\n\tState ExecutionState\n\tExitCode
      *int32\n\tMessage string\n\tOutputs map[string]string\n}"
  - file: internal/denopod/denopod.go
    kind: type_alias
    name: ExecutionState
    signature: type ExecutionState string
  - file: internal/denopod/denopod.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/denopod/denopod.go
    kind: struct
    name: Observed
    signature: "type Observed struct {\n\tPod v1alpha1.DenoPod\n\tExecution *ExecutionObservation\n\tReadinessPassed
      *bool\n\tLivenessFailed bool\n\tNow time.Time\n}"
  - file: internal/denopod/denopod.go
    kind: type_alias
    name: Op
    signature: type Op string
  - file: internal/denopod/denopod.go
    kind: struct
    name: Options
    signature: "type Options struct {\n\tNow func() time.Time\n}"
  - file: internal/denopod/denopod.go
    kind: struct
    name: Reconciler
    signature: "type Reconciler struct {\n\topts Options\n}"
  - file: internal/denopod/denopod.go
    kind: method
    name: Reconciler.Reconcile
    signature: func (r *Reconciler) Reconcile(ctx context.Context, o Observed) (Result,
      error)
  - file: internal/denopod/denopod.go
    kind: struct
    name: Result
    signature: "type Result struct {\n\tPhase v1alpha1.DenoPodPhase\n\tRunID string\n\tRestarts
      int32\n\tStartTime *metav1.Time\n\tCompletionTime *metav1.Time\n\tExitCode *int32\n\tMessage
      string\n\tOutputs map[string]string\n\tReady bool\n\tConditions []metav1.Condition\n\tOps
      []Op\n\tRequeueAfter time.Duration\n\tRemoveFinalizer bool\n\tDelete bool\n}"
  name: internal-denopod
  requirements:
  - codeRefs:
    - struct:4c5bf8db95a5eabcdd5969ee40a83886
    - struct:aff6e789cdee650936e8e9c4badaedd7
    id: r.carries-existing-status
    level: MUST
    text: 'Every decision starts from the observed DenoPod status: phase, run ID,
      restarts, start time, completion time, exit code, message, outputs, readiness
      and a copy of conditions carry into the Result.'
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:0ffa826db7f6371892be099973c54fbd
    id: r.completion-carries-execution-detail
    level: MUST
    text: A completion copies the execution run ID, exit code, message and outputs
      into the Result, sets the completion time to Now, marks ready false, sets phase
      Succeeded when successful or Failed otherwise, and sets the Ready condition
      false plus the Complete condition to the success value.
  - codeRefs:
    - file:internal/denopod/denopod.go
    - struct:aff6e789cdee650936e8e9c4badaedd7
    id: r.conditions-carry-generation
    level: MUST
    text: Every condition Reconcile sets records the observed pod generation as ObservedGeneration.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:aff6e789cdee650936e8e9c4badaedd7
    id: r.deadline-fails-the-pod
    level: MUST
    text: When ActiveDeadlineSeconds is set and has elapsed since the status start
      time, Reconcile stops a running execution, sets phase Failed, clears the run
      ID, marks ready false, sets the completion time to Now, sets Failed and Ready
      conditions with reason DeadlineExceeded, and requeues after RequeueAfter.
  - codeRefs:
    - file:internal/denopod/denopod_test.go
    id: r.decisions-are-covered-by-tests
    level: SHOULD
    text: Each decision branch is covered by a test in denopod_test.go that builds
      an Observed value and asserts on the returned Result phase, readiness and timestamps.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - type_alias:a490e5e249e0847d63dd37e654172f27
    id: r.deletion-tears-down
    level: MUST
    text: When the DenoPod has a deletion timestamp, Reconcile emits OpStopRun if
      the execution is still running, then OpRemoveFinalizer, sets RemoveFinalizer,
      marks ready false with reason Terminating, and requeues after RequeueAfter.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - type_alias:26dc5a9867b60f56e7de57f597ef8248
    id: r.exit-policy-is-applied
    level: MUST
    text: 'When the execution has exited, the restart policy decides the outcome,
      where an empty policy means Always: Always restarts; OnFailure completes successfully
      on exit code zero and restarts otherwise; Never and any unrecognised policy
      complete successfully on exit code zero and fail with reason ProcessFailed otherwise.'
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:4c5bf8db95a5eabcdd5969ee40a83886
    id: r.liveness-failure-restarts
    level: MUST
    text: When LivenessFailed is set while the execution is running, Reconcile stops
      the running execution, keeps phase Running, clears the run ID, increments Restarts
      from the observed status, sets ready false, and records reason LivenessProbeFailed.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - type_alias:26dc5a9867b60f56e7de57f597ef8248
    id: r.no-execution-starts-a-run
    level: MUST
    text: When no execution is observed, Reconcile sets phase Running, clears the
      run ID, emits OpStartRun, sets the start time to Now if unset, marks ready false,
      sets Starting and Running conditions, and requeues after RequeueAfter.
  - codeRefs:
    - struct:aff6e789cdee650936e8e9c4badaedd7
    - type_alias:a490e5e249e0847d63dd37e654172f27
    id: r.no-io-from-the-decider
    level: MUST
    text: 'Reconcile performs no I/O and touches no Kubernetes client: side effects
      are described only through the Ops list, RemoveFinalizer, Delete and RequeueAfter
      fields of the Result.'
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    id: r.reconcile-honours-context
    level: MUST
    text: Reconcile returns the context error and no Result when the context is already
      cancelled.
  - codeRefs:
    - function:3f0c5153e0db566485eab480379f957d
    - method:73925188636ee222feadc0ef8ca57514
    id: r.reconcile-injected-clock
    level: MUST
    text: Reconcile fills a zero Now from the Reconciler's clock, and New defaults
      that clock to time.Now when Options.Now is nil.
  - codeRefs:
    - file:internal/denopod/denopod.go
    - method:73925188636ee222feadc0ef8ca57514
    id: r.reconcile-requires-pod-name
    level: MUST
    text: Reconcile returns an error and an empty Result when the observed DenoPod
      has no name.
  - codeRefs:
    - file:internal/denopod/denopod.go
    id: r.requeue-interval-exposed
    level: MUST
    text: The package exposes RequeueAfter as a two-second duration, used as the requeue
      interval on the paths that expect another observation.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:aff6e789cdee650936e8e9c4badaedd7
    id: r.restart-clears-run-and-counts
    level: MUST
    text: A restart keeps phase Running, clears the run ID, sets Restarts to the observed
      count plus one, sets ready false with the restart message, and requeues after
      RequeueAfter.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:0ffa826db7f6371892be099973c54fbd
    id: r.running-reports-readiness
    level: MUST
    text: While the execution state is running, Reconcile keeps phase Running, copies
      the execution run ID, sets Ready from ReadinessPassed (true when that observation
      is nil), sets the Ready condition true with reason Ready or false with reason
      NotReady, and requeues after RequeueAfter.
  - codeRefs:
    - method:73925188636ee222feadc0ef8ca57514
    - struct:aff6e789cdee650936e8e9c4badaedd7
    id: r.terminal-phase-stops-making-decisions
    level: MUST
    text: 'When the carried phase is Succeeded or Failed, Reconcile emits no run ops
      and only evaluates TTLSecondsAfterFinished: with a TTL and a completion time
      it sets Delete and OpDelete once expiry has passed, otherwise it requeues for
      the remaining time.'
  upstream: self
- code:
  - internal/denorun/denorun.go
  - internal/denorun/denorun_test.go
  id: sc.internal-denorun
  intent: This context exists to hold the reconciliation logic for a single DenoRun
    as an isolated, side-effect-free decider. The provider observes the cluster and
    the workload, builds an Observed value, and asks the Reconciler what the next
    state should be; the Reconciler never talks to the API server itself. That split
    lets the run lifecycle rules, retry and backoff handling, deadline enforcement,
    TTL cleanup, and finalizer removal be tested as plain data-in data-out cases while
    the provider keeps the write path and the guards against stale cached objects.
  interfaces:
  - file: internal/denorun/denorun.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/denorun/denorun.go
    kind: struct
    name: Observed
    signature: type Observed struct { Run v1alpha1.DenoRun; Execution *RunObservation;
      Now time.Time }
  - file: internal/denorun/denorun.go
    kind: type_alias
    name: Op
    signature: type Op string
  - file: internal/denorun/denorun.go
    kind: struct
    name: Options
    signature: type Options struct { Now func() time.Time; DefaultBackoff int32 }
  - file: internal/denorun/denorun.go
    kind: struct
    name: Reconciler
    signature: type Reconciler struct { opts Options }
  - file: internal/denorun/denorun.go
    kind: method
    name: Reconciler.Reconcile
    signature: func (r *Reconciler) Reconcile(ctx context.Context, o Observed) (Result,
      error)
  - file: internal/denorun/denorun.go
    kind: struct
    name: Result
    signature: type Result struct { Phase v1alpha1.DenoRunPhase; RunID string; RunIDCleared
      bool; StartTime *metav1.Time; CompletionTime *metav1.Time; ExitCode *int32;
      Message string; Outputs map[string]string; Retries int32; Conditions []metav1.Condition;
      Ops []Op; RequeueAfter time.Duration; RemoveFinalizer bool; Delete bool }
  - file: internal/denorun/denorun.go
    kind: struct
    name: RunObservation
    signature: type RunObservation struct { RunID string; State RunState; ExitCode
      *int32; Message string; Outputs map[string]string }
  - file: internal/denorun/denorun.go
    kind: type_alias
    name: RunState
    signature: type RunState string
  name: internal-denorun
  requirements:
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.deadline-exceeded-fails
    level: MUST
    text: When ActiveDeadlineSeconds has elapsed since the run's start time the decider
      stops a running execution, fails the run, clears RunID with RunIDCleared set,
      stamps the completion time, and sets the DeadlineExceeded failed and complete
      conditions.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.deletion-teardown
    level: MUST
    text: When the run carries a deletion timestamp the decider stops a still-running
      execution, emits the remove-finalizer Op, sets RemoveFinalizer, and requeues,
      taking precedence over every other branch.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    - struct:ee4d89fa2c7dd0cff8185caf5882f1e5
    id: r.failed-retries-or-fails
    level: MUST
    text: 'A failed observation clears the run id, increments the retry count, records
      the exit code and message, and compares retries against the run''s backoff limit
      (falling back to Options.DefaultBackoff): past the limit the phase fails with
      BackoffExceeded conditions, otherwise the phase returns to pending with a Retrying
      condition.'
  - codeRefs:
    - function:ebb0b90e032475ce8ac596f8c699f18d
    id: r.new-defaults-clock
    level: MUST
    text: New returns a Reconciler built from Options, substituting time.Now when
      Options.Now is nil.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.no-execution-starts-run
    level: MUST
    text: 'With no execution observation the decider starts the run: it sets the start
      time if unset, moves the phase to running, emits the start-run Op, and sets
      a Running/complete-false condition.'
  - codeRefs:
    - struct:46375556082738a3e31036edf9eb66d4
    id: r.observed-shape
    level: MUST
    text: Observed carries the DenoRun under reconciliation, an optional pointer to
      a RunObservation, and the Now clock reading the decision is made against.
  - codeRefs:
    - type_alias:30190d31491ebfeaec53888338d8ddf7
    id: r.op-values
    level: MUST
    text: Op is a string type whose values are "start-run", "stop-run", "delete",
      and "remove-finalizer", naming the side effects the provider must perform.
  - codeRefs:
    - struct:ee4d89fa2c7dd0cff8185caf5882f1e5
    id: r.options-shape
    level: MUST
    text: Options supplies the Now clock function and a DefaultBackoff retry limit.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.reconcile-carries-status
    level: MUST
    text: Reconcile seeds the Result from the run's existing status, copying phase,
      run id, timestamps, exit code, message, outputs, retries, and a copy of the
      conditions.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.reconcile-defaults-now
    level: MUST
    text: Reconcile fills in a zero Now from the Reconciler's clock and returns the
      context error if the context is already cancelled.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.reconcile-requires-run-name
    level: MUST
    text: Reconcile returns an error and an empty Result when the observed DenoRun
      has no name.
  - codeRefs:
    - struct:8cfd6dfc94f9f9f64a46b94dc7cac4c6
    id: r.reconciler-holds-options
    level: MUST
    text: Reconciler is a struct holding the configured Options and exposes no other
      state.
  - codeRefs:
    - struct:729b6f20e41c65ca009aeef5ce0be147
    id: r.result-carries-next-status
    level: MUST
    text: 'Result carries the full next status the provider should write: Phase, RunID,
      RunIDCleared, StartTime, CompletionTime, ExitCode, Message, Outputs, Retries,
      Conditions, Ops, RequeueAfter, RemoveFinalizer, and Delete.'
  - codeRefs:
    - struct:729b6f20e41c65ca009aeef5ce0be147
    id: r.run-id-cleared-flag
    level: MUST
    text: Result.RunIDCleared distinguishes an id the decider never saw from one it
      cleared on purpose, so the provider does not write back the id of the workload
      it just observed and re-observe a corpse on the next pass.
  - codeRefs:
    - struct:871d7b88332e893f59d62b5249a55bca
    id: r.run-observation-shape
    level: MUST
    text: RunObservation carries RunID, State, an optional ExitCode, Message, and
      an Outputs map, and describes what the provider observed for one workload execution.
  - codeRefs:
    - type_alias:bd23d69ec74e9fe3e50fcdbd3c0331ba
    id: r.run-state-values
    level: MUST
    text: RunState is a string type whose only values are "running", "succeeded",
      and "failed".
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.running-reports-id
    level: MUST
    text: A running observation keeps the phase running, adopts the observed RunID,
      and requeues.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.succeeded-completes
    level: MUST
    text: A succeeded observation sets the phase to succeeded, adopts the run id,
      exit code, and outputs, stamps the completion time, and sets the Complete/true
      condition.
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.terminal-ttl-delete
    level: MUST
    text: 'A run already in a terminal phase is left finished: with TTLSecondsAfterFinished
      and a completion time it deletes once the TTL has elapsed, otherwise it requeues
      for the remainder of the TTL.'
  - codeRefs:
    - method:f155b5d02f0b9e87bf309fef18faa708
    id: r.unknown-state-errors
    level: MUST
    text: An execution observation whose state is none of running, succeeded, or failed
      returns an error.
  upstream: self
- code:
  - internal/livegate/livegate.go
  id: sc.internal-livegate
  intent: 'This context exists so that live, environment-dependent tests share one
    consistent skip-or-fail policy instead of each test inventing its own. A live
    test needs to behave two ways: on an ordinary developer or unit-test run it must
    skip quietly, because the real kcp, kine, kubectl and deno binaries are not present;
    in a dedicated live CI run it must fail loudly, because a skipped live test there
    would look like success while nothing was verified. RequiresLive names the single
    switch, DENO_KCP_REQUIRE_LIVE=1, that separates the two modes, and Require turns
    that boolean into the right testing.T outcome. Short adds the standard Go short-mode
    convention on top, so `go test -short` counts as a reason to skip unless live
    is explicitly required. Keeping the policy in one three-function package means
    the decision is auditable in one place and every caller cannot drift.'
  interfaces:
  - file: internal/livegate/livegate.go
    kind: function
    name: Require
    signature: func Require(t *testing.T, format string, args ...any)
  - file: internal/livegate/livegate.go
    kind: function
    name: RequiresLive
    signature: func RequiresLive() bool
  - file: internal/livegate/livegate.go
    kind: function
    name: Short
    signature: func Short(t *testing.T, format string, args ...any)
  name: internal-livegate
  requirements:
  - codeRefs:
    - file:internal/livegate/livegate.go
    - function:105aa5910047c1743f2bbed1f73895c8
    - function:cc9c12855dee252d71eac5766360e2f9
    id: r.helpers-attribute-caller
    level: MUST
    text: Require and Short MUST call t.Helper() first so failure and skip reports
      attribute the caller's line, not the gate's.
  - codeRefs:
    - file:internal/livegate/livegate.go
    - function:0e31bdc8610f1db91dd40606eac8d2a2
    id: r.live-flag-from-env
    level: MUST
    text: RequiresLive MUST report true if and only if the environment variable DENO_KCP_REQUIRE_LIVE
      equals the string "1".
  - codeRefs:
    - file:internal/livegate/livegate.go
    - function:0e31bdc8610f1db91dd40606eac8d2a2
    - function:cc9c12855dee252d71eac5766360e2f9
    id: r.require-fails-when-live-required
    level: MUST
    text: Require MUST call t.Fatalf with the caller's format and args when RequiresLive
      reports true, so a live test fails loudly instead of skipping in a live-required
      run.
  - codeRefs:
    - file:internal/livegate/livegate.go
    - function:cc9c12855dee252d71eac5766360e2f9
    id: r.require-skips-otherwise
    level: MUST
    text: Require MUST call t.Skipf with the caller's format and args when RequiresLive
      reports false, so a live test skips quietly on ordinary runs.
  - codeRefs:
    - file:internal/livegate/livegate.go
    - function:105aa5910047c1743f2bbed1f73895c8
    - function:cc9c12855dee252d71eac5766360e2f9
    id: r.short-delegates-to-require
    level: MUST
    text: Short MUST call Require with the same format and args exactly when testing.Short()
      is true, and MUST do nothing when short mode is off.
  upstream: self
- code:
  - internal/policyengine/policyengine.go
  - internal/policyengine/policyengine_test.go
  id: sc.internal-policyengine
  intent: This context exists to keep PolicyEngine lifecycle policy separate from
    the machinery that carries it out. The provider observes runs and probes, fills
    in an Observed value, and hands it to the policyengine Reconciler; the Reconciler
    answers with a Result describing the engine's phase, any requeue delay, the run
    ID, and the ops to apply. Because the decider touches no cluster state directly,
    engine behaviour such as default restart, Never restart, and liveness-driven restart
    can be exercised in unit tests against plain structs instead of a live API server,
    and the same shape is shared with the sibling denopod, denorun, denojob and trigger
    deciders.
  interfaces:
  - file: internal/policyengine/policyengine.go
    kind: struct
    name: ExecutionObservation
    signature: type ExecutionObservation struct { RunID string; State ExecutionState;
      Message string }
  - file: internal/policyengine/policyengine.go
    kind: type_alias
    name: ExecutionState
    signature: type ExecutionState string
  - file: internal/policyengine/policyengine.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/policyengine/policyengine.go
    kind: struct
    name: Observed
    signature: type Observed struct { Engine v1alpha1.PolicyEngine; Execution *ExecutionObservation;
      ReadinessPassed *bool; LivenessFailed bool; Endpoint string; Now time.Time }
  - file: internal/policyengine/policyengine.go
    kind: type_alias
    name: Op
    signature: type Op
  - file: internal/policyengine/policyengine.go
    kind: struct
    name: Options
    signature: type Options struct
  - file: internal/policyengine/policyengine.go
    kind: struct
    name: Reconciler
    signature: type Reconciler struct
  - file: internal/policyengine/policyengine.go
    kind: method
    name: Reconciler.Reconcile
    signature: func (r *Reconciler) Reconcile(ctx context.Context, o Observed) (Result,
      error)
  - file: internal/policyengine/policyengine.go
    kind: struct
    name: Result
    signature: type Result struct { Phase v1alpha1.PolicyEnginePhase; RunID string;
      Ops []Op; RequeueAfter time.Duration }
  name: internal-policyengine
  requirements:
  - id: r.engine-behaviour-is-unit-tested
    level: SHOULD
    text: Engine policy outcomes such as readiness reporting, restart-on-exit by default,
      and the Never restart policy failing on a non-zero exit should stay covered
      by tests that drive the decider through Observed values.
  - codeRefs:
    - struct:51a6de2d483d5be40201c7de454f6cd7
    - type_alias:c2475e9a59e50fceb012111299966c7a
    id: r.execution-observation-identifies-run-and-state
    level: MUST
    text: ExecutionObservation must identify the run by RunID, report its ExecutionState,
      and carry a human-readable Message; it is present only when the engine has a
      run to observe.
  - codeRefs:
    - function:26e6969406488bfc97e9ed77febe4974
    - struct:c5868ebca402d6036b8a7d908bf1a8ba
    id: r.new-builds-reconciler-from-options
    level: MUST
    text: New must construct a Reconciler from an Options value, so the decider's
      dependencies and tunables are supplied at build time rather than read from package
      globals.
  - codeRefs:
    - struct:7b1226e6c85673295723299601dd8674
    id: r.observed-carries-engine-and-execution
    level: MUST
    text: Observed must carry the v1alpha1.PolicyEngine under reconciliation, an optional
      ExecutionObservation of the current run, the readiness and liveness probe outcome,
      the engine endpoint, and the observation time Now.
  - codeRefs:
    - struct:bea3d6cd026242f0ba9701845a99d9ef
    - type_alias:43971b7fe73a576e55a3463fe8f33daf
    id: r.ops-name-the-actions-the-provider-applies
    level: MUST
    text: A Result must express the changes the decider wants as Op values, so the
      provider can switch on them and drive the engine runner without the decider
      naming any runner method directly.
  - codeRefs:
    - method:cf15bd5457ef89fffc8abf3947dbb830
    - struct:2c2a9e18bb5ac0b6ffbbc8977980dbed
    id: r.reconcile-is-a-pure-decision
    level: MUST
    text: Reconciler.Reconcile must decide engine behaviour only from the Observed
      snapshot it is given and return the Result it wants applied; it must not perform
      cluster, runner or probe I/O itself, leaving the returned Ops for the provider
      to execute.
  upstream: self
- code:
  - internal/policyworkflowpod/policyworkflowpod.go
  - internal/policyworkflowpod/policyworkflowpod_test.go
  id: sc.internal-policyworkflowpod
  intent: This context exists so the PolicyWorkflowPod decider has a describable contract
    separate from the provider that calls it. The provider owns the watch loop and
    status writes; this package owns only the decision, which makes the phase transitions,
    the condition wording, the requeue cadence and the TTL and concurrency helpers
    testable without a cluster. Capacity and RunTTL are exported because the admission
    source in internal/provider and the run reconciler need the same precedence rules
    the pod decider uses, so the rule lives here once instead of being re-derived
    at each call site.
  interfaces:
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: function
    name: Capacity
    signature: func Capacity(policy v1alpha1.ConcurrencyPolicy, maxConcurrent *int32)
      (int32, bool)
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: struct
    name: Observed
    signature: type Observed struct { Pod v1alpha1.PolicyWorkflowPod; EngineReady
      bool; EngineEndpoint string; Active int32; Now time.Time }
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: struct
    name: Options
    signature: type Options struct { Now func() time.Time }
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: struct
    name: Reconciler
    signature: type Reconciler struct { opts Options }
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: method
    name: Reconciler.Reconcile
    signature: func (r *Reconciler) Reconcile(ctx context.Context, o Observed) (Result,
      error)
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: struct
    name: Result
    signature: type Result struct { Phase v1alpha1.PolicyWorkflowPodPhase; Endpoint
      string; Active int32; Conditions []metav1.Condition; RequeueAfter time.Duration
      }
  - file: internal/policyworkflowpod/policyworkflowpod.go
    kind: function
    name: RunTTL
    signature: func RunTTL(pod *v1alpha1.PolicyWorkflowPod, providerDefault *int64)
      *int64
  name: internal-policyworkflowpod
  requirements:
  - codeRefs:
    - function:bbc6e4753713c4d1d1079ae7e84ed8fa
    id: r.capacity-allow-bounded
    level: MUST
    text: Capacity returns (MaxConcurrent, false) when the policy is ConcurrencyAllow
      and MaxConcurrent is positive.
  - codeRefs:
    - function:bbc6e4753713c4d1d1079ae7e84ed8fa
    id: r.capacity-allow-unbounded
    level: MUST
    text: Capacity returns (0, true) when the policy is ConcurrencyAllow and MaxConcurrent
      is nil or not greater than zero, so the caller treats the capacity as unbounded.
  - codeRefs:
    - function:bbc6e4753713c4d1d1079ae7e84ed8fa
    id: r.capacity-any-other-policy-is-one
    level: MUST
    text: Capacity returns (1, false) for every policy other than ConcurrencyAllow,
      so a non-allow policy admits at most one run.
  - codeRefs:
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.deletion-timestamp-returns-carried-status
    level: MUST
    text: A pod with a non-nil DeletionTimestamp returns the carried Result unchanged,
      with no phase, endpoint or condition change and no requeue delay.
  - codeRefs:
    - file:internal/policyworkflowpod/policyworkflowpod.go
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.pending-when-engine-not-ready
    level: MUST
    text: When EngineReady is false or EngineEndpoint is empty, Reconcile sets phase
      PolicyWorkflowPodPending, sets the Ready condition to False with reason EngineNotReady
      and message "the referenced policy engine is not reachable yet", and requeues
      after RequeueAfter.
  - codeRefs:
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.ready-condition-true-when-running
    level: MUST
    text: The running path sets the Ready condition to True with reason Ready and
      message "the referenced policy engine is reachable and the pod accepts runs",
      observed against the pod's generation.
  - codeRefs:
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.reconcile-carries-status-first
    level: MUST
    text: Reconcile starts from the observed pod's existing status, copying phase,
      endpoint, active count and conditions, then overwrites Active with the observed
      Active value.
  - codeRefs:
    - function:02acf20c6ae76f4247f2782b39f9905d
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.reconcile-defaults-now
    level: MUST
    text: Reconcile fills a zero Observed.Now from the Reconciler's Now function,
      which New defaults to time.Now when the caller passes nil.
  - codeRefs:
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.reconcile-propagates-context-error
    level: MUST
    text: Reconcile returns the context error and an empty Result when the passed
      context is already cancelled or expired.
  - codeRefs:
    - file:internal/policyworkflowpod/policyworkflowpod.go
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.reconcile-requires-pod-name
    level: MUST
    text: 'Reconcile returns the error "policyworkflowpod: observed pod has no name"
      and an empty Result when the observed pod has an empty name.'
  - codeRefs:
    - file:internal/policyworkflowpod/policyworkflowpod.go
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.requeue-after-both-live-paths
    level: MUST
    text: Both the pending and the running paths set Result.RequeueAfter to RequeueAfter,
      which is 2 seconds.
  - codeRefs:
    - file:internal/policyworkflowpod/policyworkflowpod.go
    - method:84d4636db1ea631ee61b88e98f741d27
    id: r.running-when-engine-ready
    level: MUST
    text: When EngineReady is true and EngineEndpoint is non-empty, Reconcile sets
      phase PolicyWorkflowPodRunning and publishes the observed engine endpoint on
      the Result.
  - codeRefs:
    - function:d4ae60590520385e8ca42957d1cb728f
    id: r.runttl-negative-or-nil-is-nil
    level: MUST
    text: RunTTL returns nil when the resolved TTL is nil or negative, so a negative
      value never becomes a live TTL.
  - codeRefs:
    - function:d4ae60590520385e8ca42957d1cb728f
    id: r.runttl-pod-spec-wins
    level: MUST
    text: RunTTL returns the pod's spec RunTTLSecondsAfterFinished when it is set,
      overriding the provider default.
  - codeRefs:
    - function:d4ae60590520385e8ca42957d1cb728f
    id: r.runttl-provider-default-fallback
    level: MUST
    text: RunTTL falls back to the provider default when the pod is nil or its RunTTLSecondsAfterFinished
      is nil.
  - codeRefs:
    - function:d4ae60590520385e8ca42957d1cb728f
    id: r.runttl-returns-a-copy
    level: MUST
    text: RunTTL returns a pointer to a copy of the resolved value, never a pointer
      into the pod spec.
  upstream: self
- code:
  - internal/policyworkflowrun/policyworkflowrun.go
  - internal/policyworkflowrun/policyworkflowrun_test.go
  id: sc.internal-policyworkflowrun
  intent: This context exists so the PolicyWorkflowRun state machine is testable and
    separable from the Kubernetes client. Reconcile only reads the observed world
    and writes a Result, so callers translate Op verbs, status fields and flags into
    API calls. Keeping the decision here means the retry, backoff, TTL, cancel, suspend
    and deadline rules live in one place with explicit preconditions and errors, and
    the provider layer stays a thin adapter.
  interfaces:
  - file: internal/policyworkflowrun/policyworkflowrun.go
    kind: struct
    name: Admission
    signature: type Admission struct { Allowed bool; Reason string; Message string
      }
  - file: internal/policyworkflowrun/policyworkflowrun.go
    kind: function
    name: New
    signature: func New(opts Options) *Reconciler
  - file: internal/policyworkflowrun/policyworkflowrun.go
    kind: struct
    name: Observed
